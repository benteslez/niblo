es de jueces y tribunales, limitará su función a concretar si se han violado derechos o libertades del demandante y a preservar o restablecer estos derechos o libertades, y se abstendrá de cualquier otra consideración sobre la actuación de los órganos jurisdiccionales.\n\n> **Artículo cincuenta y cinco. (LOTC)**\n> Uno. La sentencia que otorgue el amparo contendrá alguno o algunos de los pronunciamientos siguientes:\n> a) Declaración de nulidad de la decisión, acto o resolución que hayan impedido el pleno ejercicio de los derechos o libertades protegidos, con determinación, en su caso, de la extensión de sus efectos.\n> b) Reconocimiento del derecho o libertad pública, de conformidad con su contenido constitucionalmente declarado.\n> c) Restablecimiento del recurrente en la integridad de su derecho o libertad con la adopción de las medidas apropiadas, en su caso, para su conservación.\n> Dos. En el supuesto de que el recurso de amparo debiera ser estimado porque, a juicio de la Sala o, en su caso, la Sección, la ley aplicada lesione derechos fundamentales o libertades públicas, **se elevará la cuestión al Pleno** con suspensión del plazo para dictar sentencia, de conformidad con lo prevenido en los artículos 35 y siguientes.\n\n=> Qué: Qué puede decidir el TC\n=> Quién: La Sala o, en su caso, la Sección\n=> Cómo: \n=> - Dos fallos: **otorgamiento** o **denegación** del amparo (53)\n=> - Frente a los jueces, solo dice si hubo violación y cómo repararla; nada más sobre la actuación judicial (54)\n=> - Si otorga: **nulidad** del acto, **reconocimiento** del derecho y **restablecimiento** del recurrente en su integridad (55.1)\n=> - Si la lesión viene de **la ley aplicada**: eleva la cuestión al **Pleno**, con suspensión del plazo para sentenciar (55.2)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: La doctrina llama al 55.2 «autocuestión de inconstitucionalidad»; el término **no** es literal.\n\n### 5.5 Suspensión del acto impugnado (arts. 56 a 58)\n\n> **Artículo cincuenta y seis. (LOTC)**\n> 1. La interposición del recurso de amparo **no suspenderá los efectos** del acto o sentencia impugnados.\n> 2. Ello no obstante, cuando la ejecución del acto o sentencia impugnados produzca un perjuicio al recurrente que pudiera hacer perder al amparo su finalidad, la Sala, o la Sección en el supuesto del artículo 52.2, de oficio o a instancia del recurrente, podrá disponer la suspensión, total o parcial, de sus efectos, siempre y cuando la suspensión no ocasione perturbación grave a un interés constitucionalmente protegido, ni a los derechos fundamentales o libertades de otra persona.\n> 3. Asimismo, la Sala o la Sección podrá adoptar cualesquiera medidas cautelares y resoluciones provisionales previstas en el ordenamiento, que, por su naturaleza, puedan aplicarse en el proceso de amparo y tiendan a evitar que el recurso pierda su finalidad.\n> 4. La suspensión u otra medida cautelar podrá pedirse en cualquier tiempo, antes de haberse pronunciado la sentencia o decidirse el amparo de otro modo. El incidente de suspensión se sustanciará con audiencia de las partes y del Ministerio Fiscal, por un plazo común que no excederá de tres días y con el informe de las autoridades responsables de la ejecución, si la Sala o la Sección lo creyera necesario. La Sala o la Sección podrá condicionar la denegación de la suspensión en el caso de que pudiera seguirse perturbación grave de los derechos de un tercero, a la constitución de caución suficiente para responder de los daños o perjuicios que pudieran originarse.\n> 5. La Sala o la Sección podrá condicionar la suspensión de la ejecución y la adopción de las medidas cautelares a la satisfacción por el interesado de la oportuna fianza suficiente para responder de los daños y perjuicios que pudieren originarse. Su fijación y determinación podrá delegarse en el órgano jurisdiccional de instancia.\n> 6. En supuestos de urgencia excepcional, la adopción de la suspensión y de las medidas cautelares y provisionales podrá efectuarse en la resolución de la admisión a trámite. Dicha adopción podrá ser impugnada **en el plazo de cinco días** desde su notificación, por el Ministerio Fiscal y demás partes personadas. La Sala o la Sección resolverá el incidente mediante auto no susceptible de recurso alguno.\n\n> **Artículo cincuenta y siete. (LOTC)**\n> La suspensión o su denegación puede ser modificada durante el curso del juicio de amparo constitucional, de oficio o a instancia de parte, en virtud de circunstancias sobrevenidas o que no pudieron ser conocidas al tiempo de sustanciarse el incidente de suspensión.\n\n> **Artículo cincuenta y ocho. (LOTC)**\n> Uno. Serán competentes para resolver sobre las peticiones de indemnización de los daños causados como consecuencia de la concesión o denegación de la suspensión los Jueces o Tribunales, a cuya disposición se pondrán las fianzas constituidas.\n> Dos. Las peticiones de indemnización, que se sustanciarán por el trámite de los incidentes, deberán presentarse **dentro del plazo de un año** a partir de la publicación de la sentencia del Tribunal Constitucional.\n\n=> Qué: Si el amparo paraliza o no el acto recurrido\n=> Quién: La Sala o la Sección; los Jueces o Tribunales, para la indemnización\n=> Cómo: \n=> - Regla: interponer el amparo **no suspende** (56.1)\n=> - Excepción: se suspende si la ejecución haría perder al amparo su finalidad, salvo perturbación grave de un interés constitucional o de derechos de terceros; puede pedirse hasta la sentencia\n=> - La suspensión o su denegación pueden **modificarse** por circunstancias sobrevenidas (57)\n=> Plazos y mayorías: \n=> - Urgencia excepcional: suspensión en la propia admisión, impugnable en **5 días** (56.6)\n=> - Indemnización por la suspensión o su denegación: **1 año** desde la publicación de la sentencia del TC (58)\n=> ⚠ Ojo en el examen: La regla es que **no** suspende.","nivel":2},{"id":"s5-3","title":"II.6 Cuadro de síntesis de la protección","body":"Con todo el bloque II visto, el art. 53 se resume así:\n\n| Ubicación | Vinculación, reserva de ley y contenido esencial (53.1) | Ley orgánica (81) | Preferente y sumario (53.2) | Amparo ante el TC | Reforma de la CE |\n|---|---|---|---|---|---|\n| Art. 14 | Sí | No (doctrina del TC) | Sí | Sí | Ordinaria (167) |\n| Sección 1.ª (arts. 15-29) | Sí | Sí | Sí | Sí | Agravada (168) |\n| Art. 30 (objeción de conciencia) | Sí | No (doctrina del TC) | No | **Sí** | Ordinaria |\n| Resto de la Sección 2.ª (arts. 30-38) | Sí | No (doctrina del TC) | No | No | Ordinaria |\n| Capítulo tercero (arts. 39-52) | No: «informarán» (53.3) | No | No | No | Ordinaria |\n\n**Comunes a todo el Título I:** prohibición del **decreto-ley** (86.1); **recurso de inconstitucionalidad** contra las leyes; supervisión del **Defensor del Pueblo**, que defiende «los derechos comprendidos en este Título» (art. 54 → IV).\n\n@> **▸ En resumen.**\n@> • El **art. 53** reparte las garantías: 53.1 para todo el Capítulo segundo, 53.2 para el art. 14 y la Sección 1.ª (y el amparo, también para la objeción de conciencia), 53.3 para el Capítulo tercero.\n@> • **Normativas** (frente al legislador): ley orgánica (81), prohibición del decreto-ley (86.1), recurso de inconstitucionalidad (161-162) y rigidez (167-169).\n@> • **Jurisdiccionales**: procedimiento preferente y sumario (LJCA, 10 días), *habeas corpus* (LO 6/1984, 24 horas) y amparo constitucional (LOTC: 3 meses, 20 días o 30 días).\n@> • El **Defensor del Pueblo** aparece en todas: inconstitucionalidad, amparo y *habeas corpus*.\n@> **→ Siguiente: bloque III. Los derechos están protegidos, pero en situaciones extraordinarias algunos pueden **suspenderse**: cuáles, cuándo y con qué controles.**","nivel":2},{"id":"bIII","title":"III. ¿Cuándo pueden suspenderse? (arts. 55 y 116 y su desarrollo)","body":"@> **▸ Dónde estamos.** Los derechos están reconocidos (I) y protegidos (II). Pero la Constitución admite que, en situaciones extraordinarias, **algunos** queden temporalmente sin efecto. Este bloque responde a **cuáles**, **cuándo**, **quién lo decide** y **con qué controles**.\n@> **▸ Qué vas a ver.** 1 El art. 55: dos clases de suspensión · 2 Qué derechos se suspenden · 3 El art. 116 y las reglas comunes (LO 4/1981) · 4 Alarma · 5 Excepción · 6 Sitio · 7 Cuadro comparativo · 8 Práctica y jurisprudencia · 9 Suspensión individual: art. 55.2 y LECrim\n\n**Orden de estudio.** El art. 55 primero (es el Capítulo quinto del Título I); después la suspensión **general**, con el art. 116 y la LO 4/1981 en el orden de sus artículos; al final, la suspensión **individual** del art. 55.2 y su desarrollo en la LECrim.\n\n!> **Distinción que lo ordena todo:** **limitar** un derecho (posible en el estado de alarma) no es lo mismo que **suspenderlo** (solo en los estados de excepción y de sitio, art. 55.1).","nivel":1},{"id":"s6","title":"III.1 El art. 55: suspensión general y suspensión individual","body":"Suspender un derecho es **dejarlo temporalmente sin efecto**, no solo limitarlo. El Capítulo quinto, «De la suspensión de los derechos y libertades», tiene un único artículo.\n\n### 1.1 La suspensión de los derechos y libertades (art. 55)\n\n> **Artículo 55.**\n> 1. Los derechos reconocidos en los artículos **17, 18, apartados 2 y 3, artículos 19, 20, apartados 1, a) y d), y 5, artículos 21, 28, apartado 2, y artículo 37, apartado 2**, podrán ser suspendidos cuando se acuerde la declaración del **estado de excepción o de sitio** en los términos previstos en la Constitución. Se exceptúa de lo establecido anteriormente **el apartado 3 del artículo 17 para el supuesto de declaración de estado de excepción**.\n> 2. Una ley orgánica podrá determinar la forma y los casos en los que, **de forma individual** y con la **necesaria intervención judicial y el adecuado control parlamentario**, los derechos reconocidos en los artículos 17, apartado 2, y 18, apartados 2 y 3, pueden ser suspendidos para personas determinadas, en relación con las investigaciones correspondientes a la actuación de **bandas armadas o elementos terroristas**.\n> La utilización injustificada o abusiva de las facultades reconocidas en dicha ley orgánica producirá **responsabilidad penal**, como violación de los derechos y libertades reconocidos por las leyes.\n\n=> Qué: Dos clases de suspensión: **general** (55.1) e **individual** (55.2)\n=> Quién: \n=> - 55.1: todos los que estén en el territorio afectado por el estado de **excepción** o de **sitio**\n=> - 55.2: «personas determinadas», investigadas por actuaciones de **bandas armadas o elementos terroristas**\n=> Cómo: \n=> - 55.1: al declararse el estado (art. 116 y LO 4/1981 → III.3 a III.6)\n=> - 55.2: por **ley orgánica**, con intervención **judicial** y control **parlamentario** (LECrim → III.9)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: \n=> - 55.1 solo nombra **excepción y sitio**: la **alarma no suspende**\n=> - El **17.3** no se suspende en la excepción (solo en el sitio)\n=> - 55.2 solo alcanza a **17.2, 18.2 y 18.3**\n=> - El abuso de las facultades del 55.2 genera responsabilidad **penal**\n\n| | Suspensión **general** (55.1) | Suspensión **individual** (55.2) |\n|---|---|---|\n| Cuándo | Estado de **excepción** o de **sitio** | Investigaciones sobre **bandas armadas o elementos terroristas** |\n| A quién | A todos en el territorio afectado | A personas determinadas |\n| Derechos | 17; 18.2 y 18.3; 19; 20.1 a) y d) y 20.5; 21; 28.2; 37.2 | Solo 17.2, 18.2 y 18.3 |\n| Regulación | Art. 116 CE y LO 4/1981 | Una ley orgánica (preceptos de la LECrim) |\n| Control | El Congreso autoriza o declara | Intervención judicial y control parlamentario |","nivel":2},{"id":"s6-1","title":"III.2 Qué derechos pueden suspenderse (art. 55.1)","body":"Es la consecuencia de la casilla «Protección» de las fichas del bloque I. Solo los que enumera el art. 55.1:\n\n| Art. | Derecho | Matiz |\n|---|---|---|\n| 17 | Libertad y seguridad personal | El **17.3** (derechos del detenido) **no** se suspende en el estado de excepción; solo en el de **sitio** |\n| 18.2 | Inviolabilidad del domicilio | — |\n| 18.3 | Secreto de las comunicaciones | — |\n| 19 | Residencia y circulación | — |\n| 20.1 a) | Libertad de expresión | — |\n| 20.1 d) | Libertad de información | — |\n| 20.5 | Secuestro de publicaciones solo por resolución judicial | — |\n| 21 | Reunión y manifestación | — |\n| 28.2 | Huelga | — |\n| 37.2 | Medidas de conflicto colectivo | Único de la Sección 2.ª |\n\n**La excepción del 17.3.** «Se exceptúa de lo establecido anteriormente el apartado 3 del artículo 17 para el supuesto de declaración de estado de excepción». Las garantías del detenido (información inmediata, no declarar, abogado) se mantienen en la excepción y **solo** se suspenden en el **sitio**, como confirma el art. 32.3 LO 4/1981 (→ III.6).\n\n**Lo que nunca se suspende** (los distractores habituales): igualdad (14), vida (15), libertad ideológica (16), honor e intimidad (18.1), creación (20.1 b), cátedra (20.1 c), **asociación (22)**, participación (23), tutela judicial (24), legalidad penal (25), educación (27), **libertad sindical (28.1)** y petición (29).","nivel":2},{"id":"s6-3","title":"III.3 El art. 116 CE y las reglas comunes de la LO 4/1981 (arts. 1 a 3)","body":"El art. 116 fija **quién** declara cada estado y **cuánto** dura; la **Ley Orgánica 4/1981, de 1 de junio, de los estados de alarma, excepción y sitio** (BOE-A-1981-12774; BOE de 5 de junio de 1981; **no modificada** desde su aprobación) fija **cuándo** procede y **qué medidas** permite.\n\n### 3.1 Los estados de alarma, excepción y sitio (art. 116 CE)\n\n> **Artículo 116.**\n> 1. **Una ley orgánica regulará** los estados de alarma, de excepción y de sitio, y las competencias y limitaciones correspondientes.\n> 2. El estado de alarma será declarado por el Gobierno mediante decreto acordado en Consejo de Ministros por un **plazo máximo de quince días**, dando cuenta al Congreso de los Diputados, **reunido inmediatamente al efecto** y sin cuya autorización no podrá ser prorrogado dicho plazo. El decreto determinará el ámbito territorial a que se extienden los efectos de la declaración.\n> 3. El estado de excepción será declarado por el Gobierno mediante decreto acordado en Consejo de Ministros, **previa autorización del Congreso de los Diputados**. La autorización y proclamación del estado de excepción deberá determinar expresamente los efectos del mismo, el ámbito territorial a que se extiende y su duración, que **no podrá exceder de treinta días, prorrogables por otro plazo igual**, con los mismos requisitos.\n> 4. El estado de sitio será declarado por la **mayoría absoluta del Congreso de los Diputados, a propuesta exclusiva del Gobierno**. El Congreso determinará su ámbito territorial, duración y condiciones.\n> 5. **No podrá procederse a la disolución del Congreso** mientras estén declarados algunos de los estados comprendidos en el presente artículo, quedando automáticamente convocadas las Cámaras si no estuvieren en período de sesiones. Su funcionamiento, así como el de los demás poderes constitucionales del Estado, no podrán interrumpirse durante la vigencia de estos estados.\n> Disuelto el Congreso o expirado su mandato, si se produjere alguna de las situaciones que dan lugar a cualquiera de dichos estados, las competencias del Congreso serán asumidas por su **Diputación Permanente**.\n> 6. La declaración de los estados de alarma, de excepción y de sitio no modificarán el **principio de responsabilidad del Gobierno** y de sus agentes reconocidos en la Constitución y en las leyes.\n\n=> Qué: Los tres estados excepcionales y sus garantías institucionales\n=> Quién: \n=> - Alarma (116.2): el **Gobierno**, por decreto en Consejo de Ministros, dando cuenta al Congreso\n=> - Excepción (116.3): el **Gobierno**, por decreto en Consejo de Ministros, **previa autorización** del Congreso\n=> - Sitio (116.4): el **Congreso**, por **mayoría absoluta**, a **propuesta exclusiva** del Gobierno\n=> Cómo: \n=> - 116.5: no se puede **disolver** el Congreso; las Cámaras quedan **automáticamente convocadas** si no están en sesiones; no se interrumpe el funcionamiento de las Cámaras ni de los demás poderes; si el Congreso está disuelto o expirado, asume sus competencias la **Diputación Permanente**\n=> - 116.6: no se modifica el principio de **responsabilidad** del Gobierno y sus agentes\n=> Plazos y mayorías: \n=> - Alarma: máximo **15 días**; prórroga solo con autorización del Congreso\n=> - Excepción: máximo **30 días**, prorrogables por **otro plazo igual**\n=> - Sitio: lo que fije el Congreso (ámbito, duración y condiciones)\n=> - Sitio: **mayoría absoluta** del Congreso\n=> ⚠ Ojo en el examen: \n=> - Alarma: Congreso «reunido inmediatamente al efecto»\n=> - Sitio: la propuesta del Gobierno es **exclusiva**\n=> - En la excepción el Congreso **autoriza**; en el sitio **declara**\n\n### 3.2 Disposiciones comunes de la LO 4/1981 (arts. 1 a 3)\n\n> **Artículo primero. (LO 4/1981)**\n> Uno. Procederá la declaración de los estados de alarma, excepción o sitio cuando **circunstancias extraordinarias** hiciesen imposible el mantenimiento de la normalidad mediante los poderes ordinarios de las Autoridades competentes.\n> Dos. Las medidas a adoptar en los estados de alarma, excepción y sitio, así como la duración de los mismos, serán en cualquier caso las **estrictamente indispensables** para asegurar el restablecimiento de la normalidad. Su aplicación se realizará **de forma proporcionada a las circunstancias**.\n> Tres. Finalizada la vigencia de los estados de alarma, excepción y sitio decaerán en su eficacia cuantas competencias en materia sancionadora y en orden a actuaciones preventivas correspondan a las Autoridades competentes, así como las concretas medidas adoptadas en base a éstas, **salvo las que consistiesen en sanciones firmes**.\n> Cuatro. La declaración de los estados de alarma, excepción y sitio no interrumpe el normal funcionamiento de los poderes constitucionales del Estado.\n\n> **Artículo segundo. (LO 4/1981)**\n> La declaración de los estados de alarma, excepción o sitio será publicada de inmediato en el «Boletín Oficial del Estado», y difundida obligatoriamente por todos los medios de comunicación públicos y por los privados que se determinen, y entrará en vigor **desde el instante mismo de su publicación** en aquél. También serán de difusión obligatoria las disposiciones que la Autoridad competente dicte durante la vigencia de cada uno de dichos estados.\n\n> **Artículo tercero. (LO 4/1981)**\n> Uno. Los actos y disposiciones de la Administración Pública adoptados durante la vigencia de los estados de alarma, excepción y sitio serán **impugnables en vía jurisdiccional** de conformidad con lo dispuesto en las leyes.\n> Dos. Quienes como consecuencia de la aplicación de los actos y disposiciones adoptadas durante la vigencia de estos estados sufran, de forma directa, o en su persona, derechos o bienes, daños o perjuicios por actos que no les sean imputables, **tendrán derecho a ser indemnizados** de acuerdo con lo dispuesto en las leyes.\n\n=> Qué: Reglas que valen para los tres estados\n=> Quién: El Gobierno y las Autoridades competentes\n=> Cómo: \n=> - Presupuesto (1.1): **circunstancias extraordinarias** que hagan imposible la normalidad con los poderes ordinarios\n=> - Proporcionalidad (1.2): medidas y duración **estrictamente indispensables**, aplicadas de forma proporcionada\n=> - Fin del estado (1.3): decaen las competencias y medidas, **salvo las sanciones firmes**\n=> - Continuidad (1.4): no se interrumpe el funcionamiento de los poderes constitucionales\n=> - Publicación (2): de inmediato en el BOE y difusión obligatoria por los medios públicos y por los privados que se determinen\n=> - Control (3): actos **impugnables** en vía jurisdiccional e **indemnización** de los daños no imputables al perjudicado\n=> Plazos y mayorías: Vigencia de la **declaración**: desde el instante mismo de su publicación en el BOE\n=> ⚠ Ojo en el examen: La **declaración** rige «desde el instante mismo de su publicación»; la **propia LO 4/1981** entró en vigor «el día siguiente al de su publicación» (disposición final).","nivel":2},{"id":"s6-4","title":"III.4 El estado de alarma (LO 4/1981, arts. 4 a 12)","body":"El estado de las **catástrofes y emergencias**. No suspende derechos: solo permite **limitarlos**.\n\n### 4.1 Supuestos (art. 4)\n\n> **Artículo cuarto. (LO 4/1981)**\n> El Gobierno, en uso de las facultades que le otorga el artículo ciento dieciséis, dos, de la Constitución podrá declarar el estado de alarma, en todo o parte del territorio nacional, cuando se produzca alguna de las siguientes alteraciones graves de la normalidad.\n> a) Catástrofes, calamidades o desgracias públicas, tales como terremotos, inundaciones, incendios urbanos y forestales o accidentes de gran magnitud.\n> b) **Crisis sanitarias**, tales como epidemias y situaciones de contaminación graves.\n> c) Paralización de servicios públicos esenciales para la comunidad, cuando no se garantice lo dispuesto en los artículos veintiocho, dos, y treinta y siete, dos, de la Constitución, y **concurra alguna de las demás circunstancia o situaciones** contenidas en este artículo.\n> d) Situaciones de **desabastecimiento** de productos de primera necesidad.\n\n=> Qué: Cuándo puede declararse la alarma, en todo o parte del territorio\n=> Quién: El Gobierno\n=> Cómo: \n=> - a) **catástrofes**, calamidades o desgracias públicas (terremotos, inundaciones, incendios urbanos y forestales, accidentes de gran magnitud)\n=> - b) **crisis sanitarias** (epidemias, contaminación grave)\n=> - c) **paralización de servicios públicos esenciales**, si no se garantizan los arts. 28.2 y 37.2 CE **y** concurre otra circunstancia del artículo\n=> - d) **desabastecimiento** de productos de primera necesidad\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: \n=> - Una huelga sola **no** basta: el supuesto c) exige que concurra otro de los supuestos\n=> - *Así en el BOE:* «circunstancia» en singular\n\n### 4.2 Declaración, duración, autoridad y control (arts. 5 a 8)\n\n> **Artículo quinto. (LO 4/1981)**\n> Cuando los supuestos a que se refiere el artículo anterior afecten exclusivamente a todo, o parte del ámbito territorial de una Comunidad Autónoma, el Presidente de la misma, **podrá solicitar del Gobierno** la declaración de estado de alarma.\n\n> **Artículo sexto. (LO 4/1981)**\n> Uno. La declaración del estado de alarma se llevará a cabo mediante decreto acordado en Consejo de Ministros.\n> Dos. En el decreto se determinará el ámbito territorial, la duración y los efectos del estado de alarma, **que no podrá exceder de quince días**. Sólo se podrá prorrogar con **autorización expresa del Congreso de los Diputados**, que en este caso podrá establecer el alcance y las condiciones vigentes durante la prórroga.\n\n> **Artículo séptimo. (LO 4/1981)**\n> A los efectos del estado de alarma la Autoridad competente será el Gobierno o, **por delegación de éste, el Presidente de la Comunidad Autónoma** cuando la declaración afecte exclusivamente a todo o parte del territorio de una Comunidad.\n\n> **Artículo octavo. (LO 4/1981)**\n> Uno. El Gobierno dará cuenta al Congreso de los Diputados de la declaración del estado de alarma y le suministrará la información que le sea requerida.\n> Dos. El Gobierno también dará cuenta al Congreso de los Diputados de los decretos que dicte durante la vigencia del estado de alarma en relación con éste.\n\n=> Qué: Cómo se declara, cuánto dura y quién manda\n=> Quién: \n=> - **Declara** siempre el Gobierno (6)\n=> - Si afecta solo a una CA, su **Presidente puede solicitarlo** (5)\n=> - Autoridad competente (7): el Gobierno o, **por delegación**, el Presidente de la CA si solo afecta a su territorio\n=> Cómo: \n=> - Decreto en Consejo de Ministros: ámbito, duración y efectos (6.1)\n=> - El Gobierno **da cuenta** al Congreso de la declaración y de los decretos que dicte (8)\n=> Plazos y mayorías: \n=> - Máximo **15 días** (6.2)\n=> - Prórroga: solo con **autorización expresa del Congreso**, que puede fijar su alcance y condiciones (6.2)\n=> ⚠ Ojo en el examen: El Presidente autonómico **solicita** y puede ser **autoridad delegada**, pero **nunca declara**.\n\n### 4.3 Poderes sobre el personal e incumplimientos (arts. 9 y 10)\n\n> **Artículo noveno. (LO 4/1981)**\n> Uno. Por la declaración del estado de alarma todas las Autoridades civiles de la Administración Pública del territorio afectado por la declaración, los integrantes de los Cuerpos de Policía de las Comunidades Autónomas y de las Corporaciones Locales, y los demás funcionarios y trabajadores al servicio de las mismas, quedarán **bajo las órdenes directas de la Autoridad competente** en cuanto sea necesaria para la protección de personas, bienes y lugares, pudiendo imponerles servicios extraordinarios por su duración o por su naturaleza.\n> Dos. Cuando la Autoridad competente sea el Presidente de una Comunidad Autónoma podrá requerir la colaboración de los Cuerpos y Fuerzas de Seguridad del Estado, que actuarán bajo la dirección de sus mandos naturales.\n\n> **Artículo diez. (LO 4/1981)**\n> Uno. El incumplimiento o la resistencia a las órdenes de la Autoridad competente en el estado de alarma será sancionado con arreglo a lo dispuesto en las leyes.\n> Dos. Si estos actos fuesen cometidos por funcionarios, las Autoridades podrán suspenderlos de inmediato en el ejercicio de sus cargos, pasando, en su caso, el tanto de culpa al juez, y se notificará al superior jerárquico, a los efectos del oportuno expediente disciplinario.\n> Tres. Si fuesen cometidos por Autoridades, las facultades de éstas que fuesen necesarias para el cumplimiento de las medidas acordadas en ejecución de la declaración de estado de alarma podrán ser asumidas por la Autoridad competente durante su vigencia.\n\n=> Qué: Mando único sobre las Administraciones del territorio\n=> Quién: Autoridades civiles, policías autonómicas y locales y personal de las Administraciones del territorio afectado\n=> Cómo: \n=> - Quedan **bajo las órdenes directas** de la Autoridad competente, que puede imponerles servicios extraordinarios (9)\n=> - Incumplimientos: sanción según las leyes; los funcionarios pueden ser **suspendidos** de inmediato y, si son Autoridades, la Autoridad competente puede asumir sus facultades (10)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Incluye a las **policías autonómicas y locales**.\n\n### 4.4 Medidas (arts. 11 y 12)\n\n> **Artículo once. (LO 4/1981)**\n> Con independencia de lo dispuesto en el artículo anterior, el decreto de declaración del estado de alarma, o los sucesivos que durante su vigencia se dicten, podrán acordar las medidas siguientes:\n> a) **Limitar la circulación o permanencia de personas o vehículos** en horas y lugares determinados, o condicionarlas al cumplimiento de ciertos requisitos.\n> b) Practicar requisas temporales de todo tipo de bienes e imponer prestaciones personales obligatorias.\n> c) Intervenir y ocupar transitoriamente industrias, fábricas, talleres, explotaciones o locales de cualquier naturaleza, **con excepción de domicilios privados**, dando cuenta de ello a los Ministerios interesados.\n> d) Limitar o racionar el uso de servicios o el consumo de artículos de primera necesidad.\n> e) Impartir las órdenes necesarias para asegurar el abastecimiento de los mercados y el funcionamiento de los servicios de los centros de producción afectados por el apartado d) del artículo cuarto.\n\n> **Artículo doce. (LO 4/1981)**\n> Uno. En los supuestos previstos en los apartados a) y b) del artículo cuarto, la Autoridad competente podrá adoptar por sí, según los casos, además de las medidas previstas en los artículos anteriores, las establecidas en las normas para la lucha contra las enfermedades infecciosas, la protección del medio ambiente, en materia de aguas y sobre incendios forestales.\n> Dos. En los casos previstos en los apartados c) y d) del artículo cuarto el Gobierno podrá acordar la intervención de empresas o servicios, así como la **movilización de su personal**, con el fin de asegurar su funcionamiento. Será de aplicación al personal movilizado la normativa vigente sobre movilización que, en todo caso, será supletoria respecto de lo dispuesto en el presente artículo.\n\n=> Qué: Qué puede acordar el decreto: **limitaciones**, no suspensiones\n=> Quién: La Autoridad competente\n=> Cómo: \n=> - 11 a) limitar la circulación o permanencia de personas o vehículos en horas y lugares determinados\n=> - 11 b) requisas temporales y **prestaciones personales obligatorias**\n=> - 11 c) intervenir y ocupar transitoriamente industrias, fábricas, talleres, explotaciones o locales, **salvo domicilios privados**\n=> - 11 d) limitar o racionar servicios y artículos de primera necesidad\n=> - 11 e) órdenes para el abastecimiento de los mercados\n=> - 12.1, catástrofes y crisis sanitarias: medidas de las normas sobre enfermedades infecciosas, medio ambiente, aguas e incendios forestales\n=> - 12.2, paralización de servicios y desabastecimiento: **intervención de empresas** y **movilización de su personal**\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Las ocupaciones excluyen los **domicilios privados**. Limitar la circulación no es suspenderla (STC 148/2021 → III.8).","nivel":2},{"id":"s6-5","title":"III.5 El estado de excepción (LO 4/1981, arts. 13 a 31)","body":"El estado de las **crisis de orden público**. Aquí sí se suspenden derechos, los del 55.1 **salvo el 17.3**.\n\n### 5.1 Supuesto y solicitud (art. 13)\n\n> **Artículo trece. (LO 4/1981)**\n> Uno. Cuando el libre ejercicio de los derechos y libertades de los ciudadanos, el normal funcionamiento de las instituciones democráticas, el de los servicios públicos esenciales para la comunidad, o cualquier otro aspecto del orden público, resulten tan **gravemente alterados** que el ejercicio de las potestades ordinarias fuera insuficiente para restablecerlo y mantenerlo, el Gobierno, de acuerdo con el apartado tres del artículo ciento dieciséis de la Constitución, podrá solicitar del Congreso de los Diputados autorización para declarar el estado de excepción.\n> Dos. A los anteriores efectos, el Gobierno remitirá al Congreso de los Diputados una solicitud de autorización que deberá contener los siguientes extremos:\n> a) Determinación de los efectos del estado de excepción, con mención expresa de los derechos cuya suspensión se solicita, **que no podrán ser otros que los enumerados en el apartado uno del artículo cincuenta y cinco** de la Constitución.\n> b) Relación de las medidas a adoptar referidas a los derechos cuya suspensión específicamente se solicita.\n> c) Ámbito territorial del estado de excepción, así como duración del mismo, **que no podrá exceder de treinta días**.\n> d) **La cuantía máxima de las sanciones pecuniarias** que la Autoridad gubernativa esté autorizada para imponer, en su caso, a quienes contravengan las disposiciones que dicte durante el estado de excepción.\n> Tres. El Congreso debatirá la solicitud de autorización remitida por el Gobierno, pudiendo aprobarla en sus propios términos o **introducir modificaciones** en la misma.\n\n=> Qué: Cuándo procede y qué pide el Gobierno al Congreso\n=> Quién: El Gobierno solicita; el **Congreso** autoriza\n=> Cómo: \n=> - Supuesto (13.1): el libre ejercicio de los derechos, el funcionamiento de las instituciones democráticas, el de los servicios públicos esenciales u otro aspecto del orden público, **tan gravemente alterados** que las potestades ordinarias no bastan\n=> - La solicitud (13.2) contiene **cuatro** extremos: a) efectos y **derechos cuya suspensión se pide** (solo los del 55.1); b) medidas; c) ámbito territorial y duración; d) **cuantía máxima de las sanciones pecuniarias**\n=> - El Congreso (13.3) puede «aprobarla en sus propios términos o introducir modificaciones en la misma»\n=> Plazos y mayorías: Duración solicitada: máximo **30 días**\n=> ⚠ Ojo en el examen: Cuatro extremos; el último, la **cuantía máxima de las sanciones**.\n\n### 5.2 Declaración, cambios y prórroga (arts. 14 y 15)\n\n> **Artículo catorce. (LO 4/1981)**\n> El Gobierno, obtenida la autorización a que hace referencia el artículo anterior, procederá a declarar el estado de excepción, acordando para ello en Consejo de Ministros un decreto con el contenido autorizado por el Congreso de los Diputados.\n\n> **Artículo quince. (LO 4/1981)**\n> Uno. Si durante el estado de excepción, el Gobierno considerase conveniente la adopción de medidas distintas de las previstas en el decreto que lo declaró, procederá a solicitar del Congreso de los Diputados la autorización necesaria para la modificación del mismo, para lo que se utilizará el procedimiento, que se establece en los artículos anteriores.\n> Dos. El Gobierno, mediante decreto acordado en Consejo de Ministros, podrá poner fin al estado de excepción antes de que finalice el período para el que fue declarado, dando cuenta de ello inmediatamente al Congreso de los Diputados.\n> Tres. Si persistieran las circunstancias que dieron lugar a la declaración del estado de excepción, el Gobierno podrá solicitar del Congreso de los Diputados la prórroga de aquél, que **no podrá exceder de treinta días**.\n\n=> Qué: Del permiso del Congreso al decreto del Gobierno\n=> Quién: El Gobierno declara; el Congreso autoriza\n=> Cómo: \n=> - Decreto en Consejo de Ministros «con el contenido autorizado por el Congreso de los Diputados» (14)\n=> - Cambiar las medidas exige **nueva autorización** (15.1)\n=> - **Fin anticipado** por decreto del Gobierno, dando cuenta inmediata al Congreso (15.2)\n=> - **Prórroga**: se solicita al Congreso (15.3)\n=> Plazos y mayorías: Prórroga: máximo **30 días**\n=> ⚠ Ojo en el examen: El Gobierno puede **terminarlo antes** sin pedir permiso; para **cambiarlo** o **prorrogarlo**, necesita al Congreso.\n\n### 5.3 Medidas según el derecho suspendido (arts. 16 a 23)\n\n> **Artículo dieciséis. (LO 4/1981)**\n> Uno. La Autoridad gubernativa podrá detener a cualquier persona si lo considera necesario para la conservación del orden, siempre que, cuando menos, existan fundadas sospechas de que dicha persona vaya a provocar alteraciones del orden público. La detención **no podrá exceder de diez días** y los detenidos disfrutarán de los derechos que les reconoce el artículo diecisiete, tres, de la Constitución.\n> Dos. La detención habrá de ser comunicada al juez competente **en el plazo de veinticuatro horas**. Durante la detención, el Juez podrá, en todo momento, requerir información y conocer personalmente, o mediante delegación en el Juez de Instrucción del partido o demarcación donde se encuentre el detenido la situación de éste.\n\n> **Artículo diecisiete. (LO 4/1981)**\n> Uno. Cuando la autorización del Congreso comprenda la suspensión del artículo dieciocho, dos, de la Constitución, la Autoridad gubernativa podrá disponer inspecciones, registros domiciliarios si lo considera necesario para el esclarecimiento de los hechos presuntamente delictivos o para el mantenimiento del orden público.\n> Dos. La inspección o el registro se llevarán a cabo por la propia Autoridad o por sus agentes, a los que proveerá de orden formal y escrita.\n> Tres. El reconocimiento de la casa, papeles y efectos, podrá ser presenciado por el titular o encargado de la misma o por uno o más individuos de su familia mayores de edad y, en todo caso, por **dos vecinos** de la casa o de las inmediaciones, si en ellas los hubiere, o, en su defecto, por dos vecinos del mismo pueblo o del pueblo o pueblos limítrofes.\n> Cuatro. No hallándose en ella al titular o encargado de la casa ni a ningún individuo de la familia, se hará el reconocimiento en presencia únicamente de los dos vecinos indicados.\n> Cinco. La asistencia de los vecinos requeridos para presenciar el registro será obligatoria y coercitivamente exigible.\n> Seis. Se levantará acta de la inspección o registro, en la que se harán constar los nombres de las personas que asistieren y las circunstancias que concurriesen, así como las incidencias a que diere lugar. El acta será firmada por la autoridad o el agente que efectuare el reconocimiento y por el dueño o familiares y vecinos. Si no supieran o no quisiesen firmar se anotará también esta incidencia.\n> Siete. La autoridad gubernativa comunicará inmediatamente al Juez competente las inspecciones y registros efectuados, las causas que los motivaron y los resultados de los mismos, remitiéndole copia del acta levantada.\n\n> **Artículo dieciocho. (LO 4/1981)**\n> Uno. Cuando la autorización del Congreso comprenda la suspensión del artículo dieciocho, tres, de la Constitución, la autoridad gubernativa podrá intervenir toda clase de comunicaciones, incluidas las postales, telegráficas y telefónicas. Dicha intervención sólo podrá ser realizada si ello resulta necesario para el esclarecimiento de los hechos presuntamente delictivos o el mantenimiento del orden público.\n> Dos. La intervención decretada será comunicada inmediatamente por escrito motivado al Juez competente.\n\n> **Artículo diecinueve. (LO 4/1981)**\n> La autoridad gubernativa podrá intervenir y controlar toda clase de transportes, y la carga de los mismos.\n\n> **Artículo veinte. (LO 4/1981)**\n> Uno. Cuando la autorización del Congreso comprenda la suspensión del artículo diecinueve de la Constitución, la autoridad gubernativa podrá prohibir la circulación de personas y vehículos en las horas y lugares que se determine, y exigir a quienes se desplacen de un lugar a otro que acrediten su identidad, señalándoles el itinerario a seguir.\n> Dos. Igualmente podrá delimitar zonas de protección o seguridad y dictar las condiciones de permanencia en las mismas y prohibir en lugares determinados la presencia de persona que puedan dificultar la acción de la fuerza pública.\n> Tres. Cuando ello resulte necesario, la Autoridad gubernativa podrá exigir a personas determinadas que comuniquen, **con una antelación de dos días**, todo desplazamiento fuera de la localidad en que tengan su residencia habitual.\n> Cuatro. Igualmente podrá disponer su desplazamiento fuera de dicha localidad cuando lo estime necesario.\n> Cinco. Podrá también fijar transitoriamente la residencia de personas determinadas en localidad o territorio adecuados a sus condiciones personales.\n> Seis. Corresponde a la Autoridad gubernativa proveer de los recursos necesarios para el cumplimiento de las medidas previstas en este artículo y, particularmente, de las referidas a viajes, alojamiento y manutención de la persona afectada.\n> Siete. Para acordar las medidas a que se refieren los apartados tres, cuatro y cinco de este artículo, la Autoridad gubernativa habrá de tener fundados motivos en razón a la peligrosidad que para el mantenimiento del orden público suponga la persona afectada por tales medidas.\n\n> **Artículo veintiuno. (LO 4/1981)**\n> Uno. La Autoridad gubernativa podrá suspender todo tipo de publicaciones, emisiones de radio y televisión, proyecciones, cinematográficas y representaciones teatrales, siempre y cuando la autorización del Congreso comprenda la suspensión del artículo veinte, apartados uno, a) y d), y cinco de la Constitución. Igualmente podrá ordenar el secuestro de publicaciones.\n> Dos. El ejercicio de las potestades a que se refiere el apartado anterior no podrá llevar aparejado **ningún tipo de censura previa**.\n\n> **Artículo veintidós. (LO 4/1981)**\n> Uno. Cuando la autorización del Congreso comprenda la suspensión del artículo veintiuno de la Constitución, la autoridad gubernativa podrá someter a autorización previa o prohibir la celebración de reuniones y manifestaciones.\n> Dos. También podrá disolver las reuniones y manifestaciones a que se refiere el párrafo anterior.\n> Tres. Las reuniones orgánicas que los partidos políticos, los sindicatos y las asociaciones empresariales realicen en cumplimiento de los fines que respectivamente les asignen los artículos sexto y séptimo de la Constitución, y de acuerdo con sus Estatutos, **no podrán ser prohibidas, disueltas ni sometidas a autorización previa**.\n> Cuatro. Para penetrar en los locales en que tuvieran lugar las reuniones, la Autoridad gubernativa deberá proveer a sus agentes de autorización formal y escrita. Esta autorización no será necesaria cuando desde dichos locales se estuviesen produciendo alteraciones graves del orden público constitutivas del delito o agresiones a las Fuerzas de Seguridad y en cualesquiera otros casos de flagrante delito.\n\n> **Artículo veintitrés. (LO 4/1981)**\n> La Autoridad gubernativa podrá prohibir las huelgas y la adopción de medidas de conflicto colectivo, cuando la autorización del Congreso comprenda la suspensión de los artículos veintiocho, dos, y treinta y siete, dos de la Constitución.\n\n=> Qué: Cada medida exige que la autorización del Congreso incluya la suspensión del derecho correspondiente\n=> Quién: La Autoridad gubernativa; el juez, informado\n=> Cómo: \n=> - 17 → **detención** por la Autoridad gubernativa; el detenido conserva los derechos del **17.3** (16)\n=> - 18.2 → **inspecciones y registros** domiciliarios, con el titular o familiares y **dos vecinos**; acta y comunicación al juez (17)\n=> - 18.3 → **intervención de comunicaciones**, comunicada de inmediato al juez por escrito motivado (18)\n=> - Control de **transportes** y su carga (19)\n=> - 19 → prohibir la circulación, zonas de seguridad, control de desplazamientos y fijación de residencia (20)\n=> - 20.1 a) y d) y 20.5 → suspender publicaciones, emisiones y espectáculos y secuestrar publicaciones, **sin censura previa** (21)\n=> - 21 → autorización previa, prohibición o disolución de reuniones (22)\n=> - 28.2 y 37.2 → prohibir **huelgas** y medidas de **conflicto colectivo** (23)\n=> Plazos y mayorías: \n=> - Detención: máximo **10 días**; comunicada al juez en **24 horas** (16)\n=> - Desplazamientos: aviso con **2 días** de antelación (20)\n=> ⚠ Ojo en el examen: \n=> - Detención: **10 días** y juez en **24 horas**, no las 72 horas del art. 17.2 CE\n=> - Las reuniones **orgánicas** de partidos, sindicatos y asociaciones empresariales **no** pueden prohibirse, disolverse ni someterse a autorización (22)\n\n### 5.4 Otras medidas y Comunidades Autónomas (arts. 24 a 31)\n\n> **Artículo veinticuatro. (LO 4/1981)**\n> Uno. Los extranjeros que se encuentren en España vendrán obligados a realizar las comparecencias que se acuerden, a cumplir las normas que se dicten sobre renovación o control de permisos de residencia y cédulas de inscripción consular y a observar las demás formalidades que se establezcan.\n> Dos. Quienes contravinieren las normas o medidas que se adopten, o actuaren en connivencia con los perturbadores del orden público, **podrán ser expulsados de España**, salvo que sus actos presentaren indicios de ser constitutivos de delito, en cuyo caso se les someterá a los procedimientos judiciales correspondientes.\n> Tres. Los apátridas y refugiados respecto de los cuales no sea posible la expulsión se someterán al mismo régimen que los españoles.\n> Cuatro. Las medidas de expulsión deberán ir acompañadas de una previa justificación sumaria de las razones que la motivan.\n\n> **Artículo veinticinco. (LO 4/1981)**\n> La autoridad gubernativa podrá proceder a la incautación de toda clase de armas, municiones o sustancias explosivas.\n\n> **Artículo veintiséis. (LO 4/1981)**\n> Uno. La Autoridad gubernativa podrá ordenar la intervención de industrias o comercios que puedan motivar la alteración del orden público o coadyuvar a ella, y la suspensión temporal de las actividades de los mismos, dando cuenta a los Ministerios interesados.\n> Dos. Podrá, asimismo, ordenar el cierre provisional de salas de espectáculos, establecimientos de bebidas y locales de similares características.\n\n> **Artículo veintisiete. (LO 4/1981)**\n> La Autoridad gubernativa podrá ordenar las medidas necesarias de vigilancia y protección de edificaciones, instalaciones, obras, servicios públicos e industrias o explotaciones de cualquier género. A estos efectos podrá emplazar puestos armados en los lugares más apropiados para asegurar la vigilancia, sin perjuicio de lo establecido en el artículo dieciocho, uno de la Constitución.\n\n> **Artículo veintiocho. (LO 4/1981)**\n> Cuando la alteración del orden público haya dado lugar a alguna de las circunstancias especificadas en el artículo cuarto coincida con ellas, el Gobierno podrá adoptar además de las medidas propias del estado de excepción, las previstas para el estado de alarma en la presente ley.\n\n> **Artículo veintinueve. (LO 4/1981)**\n> Si algún funcionario o personal al servicio de una Administración pública o entidad o instituto de carácter público u oficial favoreciese con su conducta la actuación de los elementos perturbadores del orden, la Autoridad gubernativa podrá suspenderlo en el ejercicio de su cargo, pasando el tanto de culpa al Juez competente y notificándolo al superior jerárquico a los efectos del oportuno expediente disciplinario.\n\n> **Artículo treinta. (LO 4/1981)**\n> Uno. Si durante el estado de excepción el Juez estimase la existencia de hechos contrarios al orden público o a la seguridad ciudadana que puedan ser constitutivos de delito, oído el Ministerio Fiscal, decretará la prisión provisional del presunto responsable, la cual mantendrá, según su arbitrio, durante dicho estado.\n> Dos. Los condenados en estos procedimientos quedan exceptuados de los beneficios de la remisión condicional durante la vigencia del estado de excepción.\n\n> **Artículo treinta y uno. (LO 4/1981)**\n> Cuando la declaración del estado de excepción afecte exclusivamente a todo o parte del ámbito territorial de una Comunidad Autónoma, la Autoridad gubernativa podrá coordinar el ejercicio de sus competencias con el Gobierno de dicha Comunidad.\n\n=> Qué: Medidas complementarias del estado de excepción\n=> Quién: \n=> - La Autoridad gubernativa; el **juez**, para la prisión provisional (30)\n=> - Si afecta solo a una CA, la Autoridad gubernativa «podrá coordinar el ejercicio de sus competencias con el Gobierno de dicha Comunidad» (31)\n=> Cómo: \n=> - **Extranjeros** (24): comparecencias, control de permisos y posible **expulsión**, con justificación sumaria previa\n=> - Incautación de **armas** y explosivos (25)\n=> - Intervención o cierre de industrias, comercios y locales (26)\n=> - Vigilancia de instalaciones con puestos armados (27)\n=> - Si coincide con circunstancias del art. 4, se suman las medidas de la **alarma** (28)\n=> - Suspensión de **funcionarios** que favorezcan a los perturbadores (29)\n=> - **Prisión provisional** acordada por el juez durante el estado (30)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: La Autoridad del estado de excepción es **gubernativa** (civil); la **militar** es propia del sitio.","nivel":2},{"id":"s6-6","title":"III.6 El estado de sitio (LO 4/1981, arts. 32 a 36)","body":"El estado de las **crisis que amenazan la existencia del Estado**. Suspende los derechos del 55.1, **incluido el 17.3**.\n\n### 6.1 Supuesto, declaración y medidas (art. 32)\n\n> **Artículo treinta y dos. (LO 4/1981)**\n> Uno. Cuando se produzca o amenace producirse una **insurrección o acto de fuerza** contra la soberanía o independencia de España, su integridad territorial o el ordenamiento constitucional, que no pueda resolverse por otros medios, el Gobierno, de conformidad con lo dispuesto en el apartado cuatro del artículo ciento dieciséis de la Constitución, podrá proponer al Congreso de los Diputados la declaración de estado de sitio.\n> Dos. La correspondiente declaración determinará el ámbito territorial, duración y condiciones del estado de sitio.\n> Tres. La declaración podrá autorizar, además de lo previsto para los estados de alarma y excepción, la suspensión temporal de las garantías jurídicas del detenido que se reconocen en el **apartado tres del artículo diecisiete** de la Constitución.\n\n=> Qué: Cuándo procede y qué añade a los otros dos estados\n=> Quién: Propone el Gobierno; **declara el Congreso** por mayoría absoluta (116.4 CE)\n=> Cómo: \n=> - Supuesto (32.1): «insurrección o acto de fuerza contra la soberanía o independencia de España, su integridad territorial o el ordenamiento constitucional, que no pueda resolverse por otros medios»\n=> - La declaración «determinará el ámbito territorial, duración y condiciones del estado de sitio» (32.2)\n=> - Medidas (32.3): las de la alarma y la excepción **y además** la suspensión de las garantías del detenido del **art. 17.3** CE\n=> Plazos y mayorías: Mayoría absoluta del Congreso; duración la que fije\n=> ⚠ Ojo en el examen: Lo único que **solo** permite el sitio: suspender el **17.3**.\n\n### 6.2 La Autoridad militar (arts. 33 a 36)\n\n> **Artículo treinta y tres. (LO 4/1981)**\n> Uno. En virtud de la declaración del estado de sitio, el Gobierno, que dirige la política militar y de la defensa, de acuerdo con el artículo noventa y siete de la Constitución, asumirá todas las facultades extraordinarias previstas en la misma y en la presente ley.\n> Dos. A efectos de lo dispuesto en el párrafo anterior, el Gobierno **designará la Autoridad militar** que, bajo su dirección, haya de ejecutar las medidas que procedan en el territorio a que el estado de sitio se refiera.\n\n> **Artículo treinta y cuatro. (LO 4/1981)**\n> La Autoridad militar procederá a publicar y difundir los oportunos **bandos**, que contendrán las medidas y prevenciones necesarias, de acuerdo con la Constitución, la presente ley y las condiciones de la declaración del estado de sitio.\n\n> **Artículo treinta y cinco. (LO 4/1981)**\n> En la declaración del estado de sitio el Congreso de los Diputados podrá determinar los delitos que durante su vigencia quedan sometidos a la **Jurisdicción Militar**.\n\n> **Artículo treinta y seis. (LO 4/1981)**\n> Las Autoridades civiles continuarán en el ejercicio de las facultades que no hayan sido conferidas a la Autoridad militar de acuerdo con la presente Ley. Aquellas Autoridades darán a la militar las informaciones que ésta le solicite y cuantas noticias referentes al orden público lleguen a su conocimiento.\n\n=> Qué: Quién ejecuta las medidas del estado de sitio\n=> Quién: \n=> - El **Gobierno** dirige (33.1; art. 97 CE)\n=> - Una **Autoridad militar** designada por el Gobierno ejecuta, bajo su dirección (33.2)\n=> - Las **autoridades civiles** conservan las facultades no conferidas a la militar (36)\n=> Cómo: \n=> - La Autoridad militar publica **bandos** con las medidas y prevenciones (34)\n=> - El Congreso puede someter determinados delitos a la **Jurisdicción Militar** durante el estado (35)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: La Jurisdicción Militar en el sitio la fija **el Congreso** en la declaración, no el Gobierno ni la Autoridad militar. Cayó en 2025, vía art. 3.2 LOPJ (tema I.7): pregunta real justo debajo.\n\n%> **📋 Pregunta real · GACE-L 2025 · 1.er ejercicio · n.º 10**\n%> «Según el artículo 3.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿en qué ámbito administran Justicia los órganos de la jurisdicción militar?»\n%> [ ] a) En cualquiera en el que estén implicados los miembros de las Fuerzas Armadas, con independencia de su naturaleza. || Demasiado amplia: la jurisdicción militar no alcanza a todo asunto con militares implicados. La Constitución la ciñe «en el ámbito estrictamente castrense y en los supuestos de estado de sitio» (art. 117.5 CE).\n%> [x] b) En el estrictamente castrense y, en su caso, en las materias que establezca la declaración del estado de sitio. || Coincide con el criterio del art. 117.5 CE (ámbito estrictamente castrense y estado de sitio) y conecta con el art. 35 LO 4/1981: el Congreso puede determinar «los delitos que durante su vigencia quedan sometidos a la Jurisdicción Militar».\n%> [ ] c) Únicamente en el disciplinario militar, con exclusión de las materias penales y procesales. || Demasiado estrecha: no se limita a lo disciplinario ni excluye lo penal; el art. 35 LO 4/1981 le atribuye precisamente **delitos** durante el estado de sitio.\n%> [ ] d) Exclusivamente en el del estado de sitio. || Olvida el ámbito **estrictamente castrense**, que es el principal; el estado de sitio es solo el supuesto añadido («en su caso»).\n%> = **Respuesta correcta: b)**, según la plantilla definitiva de respuestas, y coherente con el texto legal citado.\n\n*Pendiente:* no tengo aportado el texto literal del art. 3.2 LOPJ, así que la explicación se apoya en el art. 117.5 CE y en el art. 35 LO 4/1981. Si me pasas la LOPJ (BOE-A-1985-12666), cito el artículo exacto.","nivel":2},{"id":"s6-7","title":"III.7 Cuadro comparativo de los tres estados","body":"| | Alarma | Excepción | Sitio |\n|---|---|---|---|\n| Naturaleza de la crisis | Catástrofes y emergencias | Orden público | Amenaza a la soberanía, la integridad o el orden constitucional |\n| Presupuesto (LO 4/1981) | Catástrofes; crisis sanitarias; paralización de servicios esenciales (con otra circunstancia); desabastecimiento (art. 4) | Grave alteración del libre ejercicio de los derechos, de las instituciones democráticas, de los servicios esenciales o de otro aspecto del orden público (art. 13) | Insurrección o acto de fuerza contra la soberanía, independencia, integridad territorial u ordenamiento constitucional (art. 32) |\n| Quién lo declara | **Gobierno**, decreto en Consejo de Ministros (116.2) | **Gobierno**, decreto en Consejo de Ministros, **previa autorización** del Congreso (116.3) | **Congreso** por **mayoría absoluta**, a **propuesta exclusiva** del Gobierno (116.4) |\n| Papel del Congreso | Se le da cuenta, «reunido inmediatamente al efecto»; autoriza la prórroga | Autoriza; puede introducir modificaciones | Declara y fija ámbito, duración y condiciones |\n| Duración | Máximo **quince días** | Máximo **treinta días** | La que fije el Congreso |\n| Prórroga | Con autorización expresa del Congreso; la CE no fija límite | **Otro plazo igual** (máximo treinta días), con los mismos requisitos | La que fije el Congreso |\n| Suspensión de derechos | **No**: solo limitaciones (art. 11) | Sí: los del 55.1, **salvo el 17.3** | Sí: los del 55.1, **incluido el 17.3** (art. 32.3) |\n| Autoridad | Gobierno o, por delegación, Presidente autonómico (art. 7) | Autoridad gubernativa | Autoridad militar designada por el Gobierno (art. 33) |\n| Comunidad Autónoma | Su Presidente puede solicitarlo (art. 5) | Coordinación con su Gobierno (art. 31) | — |\n\n**Reglas comunes a los tres estados:**\n- no se disuelve el Congreso y no se interrumpen los poderes del Estado (116.5 CE; art. 1.4 LO 4/1981);\n- se mantiene la responsabilidad del Gobierno (116.6);\n- no puede iniciarse la reforma constitucional (art. 169 → II.2.4);\n- los actos son impugnables y los daños, indemnizables (art. 3 LO 4/1981);\n- el Defensor del Pueblo sigue actuando (art. 11.3 LO 3/1981 → IV.4.3), igual que los defensores autonómicos en excepción y sitio (art. 1.4 Ley 36/1985 → IV.7).","nivel":2},{"id":"s6-8","title":"III.8 Aplicación práctica y jurisprudencia","body":"*Este apartado no es texto legal: recoge hechos y sentencias, con su referencia.*\n\n- **Estados de excepción y de sitio:** **nunca se han declarado**.\n- **Estado de alarma de 2010:** **RD 1673/2010**, de 4 de diciembre, para normalizar el servicio público esencial del **transporte aéreo** (cierre del espacio aéreo por los controladores). Fue el primero.\n- **Estado de alarma de 2020:** **RD 463/2020**, de 14 de marzo, por la **COVID-19**, con varias prórrogas hasta junio de 2020.\n- **Estado de alarma de 2020-2021:** **RD 926/2020**, de 25 de octubre, con una **prórroga de seis meses** y delegación en los Presidentes autonómicos como autoridades competentes.\n\n| Sentencia | Qué declaró |\n|---|---|\n| **STC 83/2016, de 28 de abril** | El decreto que declara la alarma tiene **rango o valor de ley**; su control corresponde al **Tribunal Constitucional** |\n| **STC 148/2021, de 14 de julio** | Inconstitucionales los **apartados 1, 3 y 5 del art. 7 del RD 463/2020**, porque **suspendían** (no limitaban) la libertad de circulación del **art. 19 CE**, algo que la alarma no permite. También anuló el inciso «modificar, ampliar o» de su art. 10.6 |\n| **STC 183/2021, de 27 de octubre** | Inconstitucionales la **prórroga de seis meses** y el régimen de **delegación** en los Presidentes autonómicos del RD 926/2020 |\n\n!> **Idea clave.** La STC 148/2021 aplica directamente la distinción del bloque: **limitar** (posible en la alarma) frente a **suspender** (solo en excepción y sitio, art. 55.1).","nivel":2},{"id":"s6-2","title":"III.9 La suspensión individual (art. 55.2 CE y LECrim)","body":"La segunda clase de suspensión: frente al **terrorismo**, sobre **personas determinadas** y **sin** declarar ningún estado.\n\n### 9.1 El art. 55.2 CE\n\n> **Artículo 55.2**\n> 2. Una ley orgánica podrá determinar la forma y los casos en los que, **de forma individual** y con la **necesaria intervención judicial y el adecuado control parlamentario**, los derechos reconocidos en los artículos **17, apartado 2, y 18, apartados 2 y 3**, pueden ser suspendidos para personas determinadas, en relación con las investigaciones correspondientes a la actuación de **bandas armadas o elementos terroristas**.\n> La utilización injustificada o abusiva de las facultades reconocidas en dicha ley orgánica producirá **responsabilidad penal**, como violación de los derechos y libertades reconocidos por las leyes.\n\n=> Qué: Suspensión **individual** de tres derechos en investigaciones de terrorismo\n=> Quién: \n=> - Persona: «personas determinadas»\n=> - Regula: **una ley orgánica**\n=> - Controlan: el **juez** y el **Parlamento**\n=> Cómo: \n=> - Presupuesto: «en relación con las investigaciones correspondientes a la actuación de bandas armadas o elementos terroristas»\n=> - Derechos: **17.2** (duración de la detención), **18.2** (domicilio) y **18.3** (comunicaciones)\n=> - Garantías: necesaria intervención judicial y adecuado control parlamentario\n=> - Abuso: utilización injustificada o abusiva → **responsabilidad penal**\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Solo **17.2, 18.2 y 18.3**: ni todo el art. 17 ni el 19.\n\n### 9.2 Su desarrollo en la Ley de Enjuiciamiento Criminal\n\nLas reglas están en la **Ley de Enjuiciamiento Criminal** (BOE-A-1882-6036; texto consolidado con última modificación de 9 de abril de 2026). Los preceptos siguientes se refieren a los delitos de **bandas armadas o elementos terroristas**, los mismos del art. 55.2. Que sean su desarrollo es **interpretación**: la LECrim no lo dice expresamente. Se reproducen en el orden de sus artículos.\n\n> **Artículo 384 bis. (LECrim)**\n> Firme un auto de procesamiento y decretada la prisión provisional por delito cometido por persona integrada o relacionada con bandas armadas o individuos terroristas o rebeldes, el procesado que estuviere ostentando función o cargo público **quedará automáticamente suspendido** en el ejercicio del mismo mientras dure la situación de prisión.\n\n> **Artículo 509. (LECrim)**\n> 1. El juez de instrucción o tribunal podrá acordar excepcionalmente, mediante resolución motivada, la detención o prisión incomunicadas cuando concurra alguna de las siguientes circunstancias:\n> a) necesidad urgente de evitar graves consecuencias que puedan poner en peligro la vida, la libertad o la integridad física de una persona, o\n> b) necesidad urgente de una actuación inmediata de los jueces de instrucción para evitar comprometer de modo grave el proceso penal.\n> 2. La incomunicación durará el tiempo estrictamente necesario para practicar con urgencia diligencias tendentes a evitar los peligros a que se refiere el apartado anterior. La incomunicación **no podrá extenderse más allá de cinco días**. En los casos en que la prisión se acuerde en causa por alguno de los delitos a que se refiere el artículo 384 bis u otros delitos cometidos concertadamente y de forma organizada por dos o más personas, la incomunicación podrá prorrogarse **por otro plazo no superior a cinco días**.\n> 3. El auto en el que sea acordada la incomunicación o, en su caso, su prórroga deberá expresar los motivos por los que haya sido adoptada la medida.\n> 4. En ningún caso podrán ser objeto de detención incomunicada **los menores de dieciséis años**.\n\n> **Artículo 520.1, párrafo segundo (LECrim)**\n> La detención preventiva no podrá durar más del tiempo estrictamente necesario para la realización de las averiguaciones tendentes al esclarecimiento de los hechos. Dentro de los plazos establecidos en la presente Ley, y, en todo caso, **en el plazo máximo de setenta y dos horas**, el detenido deberá ser puesto en libertad o a disposición de la autoridad judicial. En el atestado deberá reflejarse el lugar y la hora de la detención y de la puesta a disposición de la autoridad judicial o en su caso, de la puesta en libertad.\n\n> **Artículo 520 bis. (LECrim)**\n> 1. Toda persona detenida como presunto partícipe de alguno de los delitos a que se refiere el artículo 384 bis será puesta a disposición del Juez competente **dentro de las setenta y dos horas siguientes a la detención**. No obstante, podrá prolongarse la detención el tiempo necesario para los fines investigadores, **hasta un límite máximo de otras cuarenta y ocho horas**, siempre que, solicitada tal prórroga mediante comunicación motivada **dentro de las primeras cuarenta y ocho horas** desde la detención, sea autorizada por el Juez **en las veinticuatro horas siguientes**. Tanto la autorización cuanto la denegación de la prórroga se adoptarán en resolución motivada.\n> 2. Detenida una persona por los motivos expresados en el número anterior, podrá solicitarse del Juez que decrete su incomunicación, el cual deberá pronunciarse sobre la misma, en resolución motivada, **en el plazo de veinticuatro horas**. Solicitada la incomunicación, el detenido quedará en todo caso incomunicado sin perjuicio del derecho de defensa que le asiste y de lo establecido en los artículos 520 y 527, hasta que el Juez hubiere dictado la resolución pertinente.\n> 3. Durante la detención, el Juez podrá en todo momento requerir información y conocer, personalmente o mediante delegación en el Juez de Instrucción del partido o demarcación donde se encuentre el detenido, la situación de éste.\n\n> **Artículo 527. (LECrim)**\n> 1. En los supuestos del artículo 509, el detenido o preso podrá ser privado de los siguientes derechos si así lo justifican las circunstancias del caso:\n> a) Designar un abogado de su confianza.\n> b) Comunicarse con todas o alguna de las personas con las que tenga derecho a hacerlo, salvo con la autoridad judicial, el Ministerio Fiscal y el Médico Forense.\n> c) Entrevistarse reservadamente con su abogado.\n> d) Acceder él o su abogado a las actuaciones, salvo a los elementos esenciales para poder impugnar la legalidad de la detención.\n> 2. La incomunicación o restricción de otro derecho del apartado anterior será acordada por auto. Cuando la restricción de derechos sea solicitada por la Policía Judicial o por el Ministerio Fiscal se entenderán acordadas las medidas previstas por el apartado 1 que hayan sido instadas por un plazo máximo de veinticuatro horas, dentro del cual el juez habrá de pronunciarse sobre la solicitud, así como sobre la pertinencia de acordar el secreto de las actuaciones. La incomunicación y la aplicación al detenido o preso de alguna de las excepciones referidas en el apartado anterior será acordada por auto debiéndose motivar las razones que justifican la adopción de cada una de las excepciones al régimen general de conformidad con lo dispuesto en el artículo 509.\n> El juez controlará efectivamente las condiciones en que se desarrolle la incomunicación, a cuyo efecto podrá requerir información a fin de constatar el estado del detenido o preso y el respeto a sus derechos.\n> 3. Los reconocimientos médicos al detenido a quien se le restrinja el derecho a comunicarse con todas o alguna de las personas con las que tenga derecho a hacerlo se realizarán con una frecuencia de al menos **dos reconocimientos cada veinticuatro horas**, según criterio facultativo.\n\n> **Artículo 553. (LECrim)**\n> Los Agentes de policía podrán asimismo proceder de propia autoridad a la inmediata detención de las personas cuando haya mandamiento de prisión contra ellas, cuando sean sorprendidas en flagrante delito, cuando un delincuente, inmediatamente perseguido por los Agentes de la autoridad, se oculte o refugie en alguna casa o, **en casos de excepcional o urgente necesidad**, cuando se trate de presuntos responsables de las acciones a que se refiere el artículo 384 bis, cualquiera que fuese el lugar o domicilio donde se ocultasen o refugiasen, así como al registro que, con ocasión de aquélla, se efectúe en dichos lugares y a la ocupación de los efectos e instrumentos que en ellos se hallasen y que pudieran guardar relación con el delito perseguido.\n> Del registro efectuado, conforme a lo establecido en el párrafo anterior, **se dará cuenta inmediata al Juez competente**, con indicación de las causas que lo motivaron y de los resultados obtenidos en el mismo, con especial referencia a las detenciones que, en su caso, se hubieran practicado. Asimismo, se indicarán las personas que hayan intervenido y los incidentes ocurridos.\n\n> **Artículo 579.1 a 3 (LECrim). De la correspondencia escrita o telegráfica.**\n> 1. El juez podrá acordar la detención de la correspondencia privada, postal y telegráfica, incluidos faxes, burofaxes y giros, que el investigado remita o reciba, así como su apertura o examen, si hubiera indicios de obtener por estos medios el descubrimiento o la comprobación del algún hecho o circunstancia relevante para la causa, siempre que la investigación tenga por objeto alguno de los siguientes delitos:\n> 1.º Delitos dolosos castigados con pena con límite máximo de, al menos, tres años de prisión.\n> 2.º Delitos cometidos en el seno de un grupo u organización criminal.\n> 3.º Delitos de terrorismo.\n> 2. El juez podrá acordar, en resolución motivada, por un plazo de hasta tres meses, prorrogable por iguales o inferiores períodos hasta un máximo de dieciocho meses, la observación de las comunicaciones postales y telegráficas del investigado, así como de las comunicaciones de las que se sirva para la realización de sus fines delictivos.\n> 3. En caso de urgencia, cuando las investigaciones se realicen para la averiguación de delitos relacionados con la actuación de bandas armadas o elementos terroristas y existan razones fundadas que hagan imprescindible la medida prevista en los apartados anteriores de este artículo, **podrá ordenarla el Ministro del Interior o, en su defecto, el Secretario de Estado de Seguridad**. Esta medida se comunicará inmediatamente al juez competente y, en todo caso, **dentro del plazo máximo de veinticuatro horas**, haciendo constar las razones que justificaron la adopción de la medida, la actuación realizada, la forma en que se ha efectuado y su resultado. El juez competente, también de forma motivada, revocará o confirmará tal actuación **en un plazo máximo de setenta y dos horas** desde que fue ordenada la medida.\n\n> **Artículo 588 ter d.3 (LECrim)**\n> 3. En caso de urgencia, cuando las investigaciones se realicen para la averiguación de delitos relacionados con la actuación de bandas armadas o elementos terroristas y existan razones fundadas que hagan imprescindible la medida prevista en los apartados anteriores de este artículo, **podrá ordenarla el Ministro del Interior** o, en su defecto, el Secretario de Estado de Seguridad. Esta medida se comunicará inmediatamente al juez competente y, en todo caso, dentro del plazo máximo de veinticuatro horas, haciendo constar las razones que justificaron la adopción de la medida, la actuación realizada, la forma en que se ha efectuado y su resultado. El juez competente, también de forma motivada, revocará o confirmará tal actuación en un plazo máximo de setenta y dos horas desde que fue ordenada la medida.\n\n=> Qué: Cómo se concreta la suspensión de cada derecho del 55.2\n=> Quién: \n=> - El **Juez** autoriza o confirma\n=> - En urgencia, el **Ministro del Interior** o, en su defecto, el **Secretario de Estado de Seguridad** (579.3 y 588 ter d.3)\n=> - Los **Agentes**, para entrar en domicilios en urgencia (553)\n=> Cómo: \n=> - **17.2**, detención: prórroga de la detención más allá de 72 horas (520 bis.1); incomunicación (509, 520 bis.2 y 527)\n=> - **18.2**, domicilio: entrada y detención de propia autoridad «en casos de excepcional o urgente necesidad», con **cuenta inmediata al Juez** (553)\n=> - **18.3**, comunicaciones: correspondencia (579.3) y comunicaciones telefónicas y telemáticas (588 ter d.3) ordenadas en urgencia por Interior\n=> - Cargo público con auto de procesamiento **firme** y en **prisión provisional**: suspensión **automática** mientras dure la prisión (384 bis)\n=> Plazos y mayorías: \n=> - Detención: **72 horas** + prórroga de **otras 48**; se pide motivadamente **en las primeras 48** y el Juez decide **en las 24 siguientes** (520 bis.1)\n=> - Incomunicación: el Juez se pronuncia en **24 horas**; mientras, el detenido queda incomunicado (520 bis.2)\n=> - Incomunicación: máximo **5 días**; en causas del 384 bis, prórroga de **otros 5** como máximo; nunca a **menores de 16 años** (509)\n=> - Incomunicado: al menos **dos reconocimientos médicos cada 24 horas** (527)\n=> - Comunicaciones en urgencia: juez avisado en **24 horas**; revoca o confirma en **72 horas** (579.3)\n=> ⚠ Ojo en el examen: \n=> - **72 + 48** horas (no 72 + 72)\n=> - Urgencia: Ministro del **Interior** (no de Justicia)\n=> - Plazo general de referencia (520.1): «en todo caso, en el plazo máximo de setenta y dos horas»\n=> - Enlace: si la detención se basa en esta ley orgánica, el *habeas corpus* lo conoce el **Juez Central de Instrucción** (→ II.4.2)\n=> - *Así en el BOE:* el art. 579.1 dice «la comprobación del algún hecho»\n\n@> **▸ En resumen.**\n@> • **Suspender** no es **limitar**: la alarma solo limita; excepción y sitio suspenden los derechos del 55.1.\n@> • Quién decide: alarma y excepción, el **Gobierno** (en la excepción, con autorización previa del Congreso); sitio, el **Congreso** por mayoría absoluta.\n@> • Duración: alarma **15** días; excepción **30 + 30**; sitio, lo que fije el Congreso.\n@> • El **17.3** solo se suspende en el **sitio**.\n@> • Suspensión **individual** (55.2): terrorismo, solo 17.2, 18.2 y 18.3, con juez y control parlamentario (LECrim).\n@> **→ Siguiente: bloque IV. Falta la institución que vela por los derechos en todo momento, también durante los estados de excepción y sitio: el Defensor del Pueblo.**","nivel":2},{"id":"bIV","title":"IV. ¿Quién vela por ellos? El Defensor del Pueblo (art. 54, LO 3/1981 y Ley 36/1985)","body":"@> **▸ Dónde estamos.** Los bloques II y III han mostrado las garantías **normativas** y **jurisdiccionales** y su suspensión. Falta la garantía **institucional**: una institución que supervisa a la Administración y no se interrumpe ni siquiera en los estados de excepción y sitio.\n@> **▸ Qué vas a ver.** 1 Art. 54 y naturaleza · 2 Elección · 3 Estatuto · 4 Ámbito y quejas · 5 Investigación · 6 Resoluciones e informes · 7 Defensores autonómicos (Ley 36/1985) · 8 La institución hoy\n\n**Orden de estudio.** El art. 54 CE y, después, la **Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo** (BOE-A-1981-10325; última modificación: 4 de noviembre de 2009) en el orden de sus artículos. Al final, la Ley 36/1985 sobre los defensores autonómicos.","nivel":1},{"id":"s7","title":"IV.1 El art. 54 y la naturaleza del Defensor del Pueblo","body":"Sigue el modelo del *ombudsman* escandinavo: una institución independiente que recibe quejas y **supervisa a la Administración** (dato doctrinal, no texto legal).\n\n### 1.1 El Defensor del Pueblo en la Constitución (art. 54)\n\n> **Artículo 54.**\n> **Una ley orgánica** regulará la institución del Defensor del Pueblo, como **alto comisionado de las Cortes Generales**, designado por éstas para la defensa de **los derechos comprendidos en este Título**, a cuyo efecto podrá **supervisar la actividad de la Administración**, **dando cuenta a las Cortes Generales**.\n\n=> Qué: La garantía **institucional** de los derechos del Título I\n=> Quién: **Alto comisionado de las Cortes Generales**, designado por ellas\n=> Cómo: \n=> - Defiende los derechos del **Título I**\n=> - Para ello, puede **supervisar la actividad de la Administración**\n=> - Da cuenta a las **Cortes Generales**\n=> Plazos y mayorías: Regulación por **ley orgánica**\n=> ⚠ Ojo en el examen: \n=> - De las **Cortes Generales**, no solo del Congreso\n=> - Está en el **Capítulo cuarto** (garantías), no en un título propio\n\n### 1.2 Carácter y finalidad (art. 1 LO 3/1981)\n\n> **Artículo primero. (LO 3/1981)**\n> El Defensor del Pueblo es el **alto comisionado de las Cortes Generales** designado por éstas para la defensa de los derechos comprendidos en el **Título I de la Constitución**, a cuyo efecto podrá supervisar la actividad de la Administración, dando cuenta a las Cortes Generales. Ejercerá las funciones que le encomienda la Constitución y la presente Ley.\n\n=> Qué: Comisionado parlamentario para la defensa de los derechos del Título I\n=> Quién: El Defensor del Pueblo, designado por las Cortes Generales\n=> Cómo: \n=> - Supervisa la actividad de la **Administración**, dando cuenta a las Cortes\n=> - Actúa con **independencia** (art. 6.1 → IV.3.2)\n=> - Sus resoluciones **no son vinculantes**: no anula actos (art. 28.1 → IV.6.1)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: No supervisa a los **jueces** (art. 13 → IV.4.4) ni al **legislador**.","nivel":2},{"id":"s7-1","title":"IV.2 Elección y nombramiento (arts. 2 a 4 LO 3/1981)","body":"### 2.1 Elección (art. 2)\n\n> **Artículo segundo. (LO 3/1981)**\n> Uno. El Defensor del Pueblo será elegido por las Cortes Generales para un periodo de **cinco años**, y se dirigirá a las mismas a través de los Presidentes del Congreso y del senado, respectivamente.\n> Dos. Se designará en las Cortes Generales una Comisión Mixta Congreso-Senado encargada de relacionarse con el Defensor del Pueblo e informar a los respectivos Plenos en cuantas ocasiones sea necesario.\n> Tres. Dicha Comisión se reunirá cuando así lo acuerden conjuntamente el Presidente del Congreso y del Senado, y en todo caso, para proponer a los Plenos de las Cámaras el candidato o candidatos a Defensor del Pueblo. Los acuerdos de la Comisión se adoptarán por **mayoría simple**.\n> Cuatro. Propuesto el candidato o candidatos, se convocará en término **no inferior a diez días** al Pleno del Congreso para que proceda a su elección. Será designado quien obtuviese una votación favorable de las **tres quintas partes** de los miembros del Congreso y posteriormente, en un **plazo máximo de veinte días**, fuese ratificado por esta misma mayoría del Senado.\n> Cinco. Caso de no alcanzarse las mencionadas mayorías, se procederá en nueva sesión de la Comisión, y **en el plazo máximo de un mes**, a formular sucesivas propuestas. En tales casos, una vez conseguida la mayoría de los tres quintos en el Congreso, la designación quedará realizada al alcanzarse la **mayoría absoluta del Senado**.\n> Seis. Designado el Defensor del Pueblo se reunirá de nuevo la Comisión Mixta Congreso-Senado para otorgar su **conformidad previa** al nombramiento de los adjuntos que le sean propuestos por aquél.\n\n=> Qué: Cómo eligen las Cortes al Defensor del Pueblo\n=> Quién: \n=> - Una **Comisión Mixta** Congreso-Senado propone; el **Pleno del Congreso** vota; el **Senado** ratifica\n=> - La Comisión se reúne cuando lo acuerdan los Presidentes de ambas Cámaras y, en todo caso, para proponer candidatos; decide por **mayoría simple**\n=> - Se relaciona con las Cortes a través de los **Presidentes del Congreso y del Senado**\n=> Cómo: \n=> - 1 Propuesta de la Comisión Mixta\n=> - 2 Votación en el Pleno del Congreso\n=> - 3 Ratificación en el Senado\n=> - Si fracasa: nueva sesión de la Comisión y **sucesivas propuestas**\n=> - Designado el Defensor, la Comisión da su **conformidad previa** a los Adjuntos que proponga\n=> Plazos y mayorías: \n=> - Mandato: **5 años**\n=> - Pleno del Congreso convocado en término **no inferior a 10 días**; **tres quintos**\n=> - Senado: en un plazo máximo de **20 días**; la **misma mayoría**\n=> - Si no se alcanzan: Comisión en **un mes** máximo; después basta **tres quintos en el Congreso** y **mayoría absoluta en el Senado**\n=> ⚠ Ojo en el examen: \n=> - Si fracasa: Comisión (no «Pleno conjunto»), **un mes** (no quince días) y **mayoría absoluta del Senado** (no simple)\n=> - Cayó en 2025: pregunta real justo debajo\n\n%> **📋 Pregunta real · GACE-L 2025 · 1.er ejercicio · n.º 2**\n%> «Según el artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, si en el procedimiento inicial no se alcanzan las mayorías exigidas para la elección del Defensor del Pueblo:»\n%> [ ] a) Se convoca directamente un nuevo Pleno conjunto de las Cortes Generales, y el candidato será designado por mayoría absoluta de ambas Cámaras. || No existe ningún «Pleno conjunto»: el art. 2.5 manda volver a la Comisión Mixta: «se procederá en nueva sesión de la Comisión». Tampoco se exige mayoría absoluta en las dos Cámaras.\n%> [ ] b) Se convoca directamente un nuevo Pleno conjunto de las Cortes Generales, y el candidato será designado por mayoría simple de ambas Cámaras. || Mismo error que la a): no hay «Pleno conjunto». Y la designación nunca se hace por mayoría simple de las Cámaras: la mayoría simple solo rige para los acuerdos de la Comisión («Los acuerdos de la Comisión se adoptarán por mayoría simple», art. 2.3).\n%> [x] c) Se procede a una nueva sesión de la Comisión Mixta Congreso-Senado y, en el plazo máximo de un mes, se formulan sucesivas propuestas; una vez obtenidos tres quintos en el Congreso, la designación queda realizada al alcanzarse mayoría absoluta en el Senado. || Reproduce el art. 2.5: «en el plazo máximo de un mes, a formular sucesivas propuestas»; «una vez conseguida la mayoría de los tres quintos en el Congreso, la designación quedará realizada al alcanzarse la mayoría absoluta del Senado».\n%> [ ] d) Se procede a una nueva sesión de la Comisión Mixta Congreso-Senado y, en el plazo máximo de quince días, se formulan sucesivas propuestas; una vez obtenidos tres quintos en el Congreso, la designación queda realizada al alcanzarse mayoría simple en el Senado. || Cambia dos datos: «un mes» por «quince días» y «mayoría absoluta» por «mayoría simple» en el Senado.\n%> = **Respuesta correcta: c)**, según la plantilla definitiva de respuestas, y coherente con el texto legal citado.\n\n### 2.2 Requisitos, nombramiento y toma de posesión (arts. 3 y 4)\n\n> **Artículo tercero. (LO 3/1981)**\n> Podrá ser elegido Defensor del Pueblo cualquier **español mayor de edad** que se encuentre en el pleno disfrute de sus derechos civiles y políticos.\n\n> **Artículo cuarto. (LO 3/1981)**\n> Uno. Los Presidentes del Congreso y del Senado acreditarán **conjuntamente con sus firmas** el nombramiento del Defensor del Pueblo que se publicará en el «Boletín Oficial del Estado».\n> Dos. El Defensor del Pueblo tomará posesión de su cargo ante las **Mesas de ambas Cámaras reunidas conjuntamente**, prestando juramento o promesa de fiel desempeño de su función.\n\n=> Qué: Quién puede serlo y cómo se formaliza\n=> Quién: «cualquier español mayor de edad que se encuentre en el pleno disfrute de sus derechos civiles y políticos»\n=> Cómo: \n=> - Nombramiento: los **Presidentes del Congreso y del Senado** lo acreditan conjuntamente con sus firmas; se publica en el **BOE** (4.1)\n=> - Toma de posesión ante las **Mesas de ambas Cá
