n la resolución que proceda en el plazo de:","o":["Cuarenta y ocho horas, contadas desde la solicitud.","Veinticuatro horas, contadas desde que sea dictado el auto de incoación.","Veinticuatro horas, contadas desde la detención.","Setenta y dos horas, contadas desde la detención."],"c":1,"e":"Art. 7 LO 6/1984. Trampa: 72 horas es el máximo de la detención preventiva (art. 17.2 CE).","cat":"Art. 7 LO 6/1984"},{"q":"Según el artículo 9 de la Ley Orgánica 6/1984, si se apreciase temeridad o mala fe en el solicitante:","o":["Se le impondrán las costas y una multa.","Se archivará el procedimiento sin más trámite.","Será sancionado con multa por el Juez.","Será condenado al pago de las costas del procedimiento."],"c":3,"e":"Art. 9 LO 6/1984. En caso contrario, las costas se declaran de oficio.","cat":"Art. 9 LO 6/1984"},{"q":"Según el artículo 1.1 de la Ley 36/1985, de 6 de noviembre, el aforamiento especial de los titulares de las instituciones autonómicas similares al Defensor del Pueblo se entenderá referido a:","o":["La Audiencia Provincial correspondiente.","La Sala correspondiente de los Tribunales Superiores de Justicia en cada ámbito territorial.","La Sala de lo Penal de la Audiencia Nacional.","La Sala de lo Penal del Tribunal Supremo."],"c":1,"e":"Art. 1.1 Ley 36/1985. El Defensor del Pueblo estatal está aforado ante la Sala de lo Penal del Tribunal Supremo (art. 6.3 LO 3/1981).","cat":"Art. 1.1 Ley 36/1985"},{"q":"Según el artículo 1.4 de la Ley 36/1985, la declaración de los estados de excepción o de sitio:","o":["Atribuirá al Defensor del Pueblo las funciones de los Comisionados autonómicos.","No interrumpirá la actividad de los Comisionados de los Parlamentos autonómicos.","Suspenderá la actividad de los Comisionados autonómicos mientras dure el estado declarado.","Interrumpirá la actividad de los Comisionados autonómicos solo en el estado de sitio."],"c":1,"e":"Art. 1.4 Ley 36/1985 (paralelo al art. 11.3 LO 3/1981 para el Defensor del Pueblo).","cat":"Art. 1.4 Ley 36/1985"},{"q":"Según el artículo 2.3 de la Ley 36/1985, en la supervisión de la actividad de órganos de la Administración pública estatal que radiquen en el territorio de cada Comunidad Autónoma:","o":["El Comisionado autonómico actuará por delegación del Defensor del Pueblo.","Será necesario un acuerdo previo de las Cortes Generales y del Parlamento autonómico.","Será competente exclusivamente el Comisionado parlamentario autonómico.","El Defensor del Pueblo podrá recabar la colaboración del respectivo Comisionado parlamentario."],"c":3,"e":"Art. 2.3 Ley 36/1985.","cat":"Art. 2.3 Ley 36/1985"},{"q":"Según la disposición adicional de la Ley 36/1985, los Comisionados parlamentarios autonómicos y sus Adjuntos que fueran funcionarios públicos en activo al ser nombrados pasarán a la situación de:","o":["Excedencia forzosa.","Servicios especiales.","Servicio activo con dispensa de funciones.","Excedencia voluntaria."],"c":1,"e":"Disposición adicional Ley 36/1985.","cat":"DA Ley 36/1985"},{"q":"Según el artículo 520 bis.1 de la Ley de Enjuiciamiento Criminal, toda persona detenida como presunto partícipe de alguno de los delitos a que se refiere el artículo 384 bis será puesta a disposición del Juez competente dentro de:","o":["Las setenta y dos horas siguientes a la detención, prorrogables hasta un límite máximo de otras cuarenta y ocho horas.","Las setenta y dos horas siguientes a la detención, sin posibilidad de prórroga.","Los cinco días siguientes a la detención.","Las cuarenta y ocho horas siguientes a la detención, prorrogables por otras veinticuatro horas."],"c":0,"e":"Art. 520 bis.1 LECrim. Prórroga: solicitud motivada dentro de las primeras 48 horas y autorización judicial en las 24 horas siguientes.","cat":"Art. 520 bis.1 LECrim"},{"q":"Según el artículo 520 bis.1 de la LECrim, la prórroga de la detención de los presuntos partícipes en los delitos del artículo 384 bis deberá solicitarse mediante comunicación motivada:","o":["Dentro de las primeras veinticuatro horas desde la detención, y ser autorizada por el Juez en las cuarenta y ocho horas siguientes.","En cualquier momento de la detención, y ser autorizada por el Ministerio Fiscal.","Antes de que transcurran setenta y dos horas, y ser autorizada por el Ministro del Interior.","Dentro de las primeras cuarenta y ocho horas desde la detención, y ser autorizada por el Juez en las veinticuatro horas siguientes."],"c":3,"e":"Art. 520 bis.1 LECrim.","cat":"Art. 520 bis.1 LECrim"},{"q":"Según el artículo 520 bis.2 de la LECrim, solicitada al Juez la incomunicación del detenido por los delitos del artículo 384 bis:","o":["El Juez deberá pronunciarse en el plazo de veinticuatro horas y, entretanto, el detenido quedará en todo caso incomunicado.","El detenido no podrá quedar incomunicado hasta que el Juez resuelva.","El Juez deberá pronunciarse en el plazo de setenta y dos horas.","La incomunicación la acuerda directamente el Ministerio Fiscal."],"c":0,"e":"Art. 520 bis.2 LECrim.","cat":"Art. 520 bis.2 LECrim"},{"q":"Según el artículo 509 de la LECrim, la incomunicación no podrá extenderse más allá de cinco días, pero en causas por alguno de los delitos a que se refiere el artículo 384 bis:","o":["Podrá prorrogarse sin límite mientras subsista la necesidad.","Podrá prorrogarse por otro plazo no superior a cinco días.","No cabe prórroga en ningún caso.","Podrá prorrogarse por otro plazo no superior a diez días."],"c":1,"e":"Art. 509.2 LECrim. El 509.4 añade que nunca pueden ser objeto de detención incomunicada los menores de dieciséis años.","cat":"Art. 509 LECrim"},{"q":"Según el artículo 509.4 de la LECrim, en ningún caso podrán ser objeto de detención incomunicada:","o":["Los menores de dieciséis años.","Los menores de catorce años.","Los menores de dieciocho años.","Los detenidos por delitos de terrorismo."],"c":0,"e":"Art. 509.4 LECrim.","cat":"Art. 509.4 LECrim"},{"q":"Según el artículo 579.3 de la LECrim, en caso de urgencia, cuando se investiguen delitos relacionados con la actuación de bandas armadas o elementos terroristas, la detención y apertura de la correspondencia podrá ordenarla:","o":["El Ministerio Fiscal, comunicándolo al juez en el plazo de cuarenta y ocho horas.","El Ministro del Interior o, en su defecto, el Secretario de Estado de Seguridad, comunicándolo al juez competente en el plazo máximo de veinticuatro horas.","El Director General de la Policía, comunicándolo al juez en el plazo de setenta y dos horas.","El Ministro de Justicia o, en su defecto, el Secretario de Estado de Justicia."],"c":1,"e":"Art. 579.3 LECrim. El juez revoca o confirma en un plazo máximo de 72 horas desde que fue ordenada la medida. Igual regla en el art. 588 ter d.3 para las comunicaciones telefónicas y telemáticas.","cat":"Art. 579.3 LECrim"},{"q":"Según el artículo 588 ter d.3 de la LECrim, cuando el Ministro del Interior ordene por urgencia la interceptación de comunicaciones en investigaciones sobre bandas armadas o elementos terroristas, el juez competente revocará o confirmará tal actuación:","o":["En un plazo máximo de veinticuatro horas desde que fue ordenada la medida.","En un plazo máximo de cuarenta y ocho horas desde que reciba la comunicación.","En un plazo máximo de setenta y dos horas desde que fue ordenada la medida.","En el plazo de diez días."],"c":2,"e":"Art. 588 ter d.3 LECrim.","cat":"Art. 588 ter d.3 LECrim"},{"q":"Según el artículo 553 de la LECrim, los Agentes de policía podrán proceder de propia autoridad a la detención y al registro en el lugar o domicilio donde se oculten los presuntos responsables de las acciones del artículo 384 bis:","o":["Solo con autorización judicial previa, en todo caso.","Solo con autorización previa del Ministro del Interior.","En cualquier caso, dando cuenta al Juez en el plazo de setenta y dos horas.","En casos de excepcional o urgente necesidad, dando cuenta inmediata al Juez competente."],"c":3,"e":"Art. 553 LECrim: relacionado con la suspensión del art. 18.2 CE prevista en el art. 55.2.","cat":"Art. 553 LECrim"},{"q":"Según el artículo 384 bis de la LECrim, firme un auto de procesamiento y decretada la prisión provisional por delito cometido por persona integrada o relacionada con bandas armadas o individuos terroristas o rebeldes, el procesado que ostente función o cargo público:","o":["Quedará suspendido si así lo acuerda el órgano del que dependa.","Perderá definitivamente el cargo.","Quedará automáticamente suspendido en el ejercicio del mismo mientras dure la situación de prisión.","Conservará el cargo hasta que recaiga sentencia firme."],"c":2,"e":"Art. 384 bis LECrim.","cat":"Art. 384 bis LECrim"},{"q":"Según el artículo 527.3 de la LECrim, los reconocimientos médicos al detenido a quien se restrinja el derecho a comunicarse se realizarán con una frecuencia de al menos:","o":["Tres reconocimientos cada veinticuatro horas.","Un reconocimiento cada veinticuatro horas.","Dos reconocimientos cada veinticuatro horas, según criterio facultativo.","Un reconocimiento cada doce horas."],"c":2,"e":"Art. 527.3 LECrim.","cat":"Art. 527.3 LECrim"}],"cargado":"2026-10-02T18:30:00.000Z"}}}</script>

<script type="application/json" id="tests-reales">{"_formato":"tests_reales_v1","examenes":[{"id":"GACE-L-2025-1","titulo":"GACE-L 2025","anio":2025,"acceso":"libre","ejercicio":"Primer ejercicio","plantilla":"definitiva","fuente":"Cuestionario oficial «2025 - GACE-L» y plantilla definitiva de respuestas del primer ejercicio (ingreso libre)","preguntas":[{"n":1,"q":"El Título I de la Constitución Española de 1978 se denomina:","o":["De los derechos y deberes fundamentales.","De los derechos y deberes de los ciudadanos.","De los españoles y los extranjeros.","Derechos y libertades."],"c":0,"tema":"I.2"},{"n":2,"q":"Según el artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, si en el procedimiento inicial no se alcanzan las mayorías exigidas para la elección del Defensor del Pueblo:","o":["Se convoca directamente un nuevo Pleno conjunto de las Cortes Generales, y el candidato será designado por mayoría absoluta de ambas Cámaras.","Se convoca directamente un nuevo Pleno conjunto de las Cortes Generales, y el candidato será designado por mayoría simple de ambas Cámaras.","Se procede a una nueva sesión de la Comisión Mixta Congreso-Senado y, en el plazo máximo de un mes, se formulan sucesivas propuestas; una vez obtenidos tres quintos en el Congreso, la designación queda realizada al alcanzarse mayoría absoluta en el Senado.","Se procede a una nueva sesión de la Comisión Mixta Congreso-Senado y, en el plazo máximo de quince días, se formulan sucesivas propuestas; una vez obtenidos tres quintos en el Congreso, la designación queda realizada al alcanzarse mayoría simple en el Senado."],"c":2,"tema":"I.2"},{"n":3,"q":"¿Quién propone a los Magistrados del Tribunal Constitucional, de acuerdo con el artículo 159 de la Constitución Española de 1978?","o":["4 el Congreso, 4 el Senado, 2 el Gobierno y 2 el Consejo General del Poder Judicial.","6 el Congreso y 6 el Senado.","4 el Congreso, 4 el Senado y 4 el Gobierno.","6 el Congreso, 2 el Senado, 2 el Gobierno y 2 el Presidente del Tribunal Supremo."],"c":0,"tema":"I.3"},{"n":4,"q":"Según el artículo 99 de la Constitución Española de 1978, el Rey propone candidato a la Presidencia del Gobierno:","o":["Libremente y sin consulta previa.","Tras consultar a los Grupos Parlamentarios del Congreso y el Senado.","Tras consultar a los representantes designados por los grupos políticos con representación parlamentaria.","A propuesta del Presidente del Congreso."],"c":2,"tema":"I.6"},{"n":5,"q":"Según el artículo 62 de la Constitución Española de 1978, ¿cuál de las siguientes funciones corresponde al Rey en los términos expresamente previstos por dicho precepto?","o":["Autorizar indultos generales mediante Real Decreto, a propuesta del Gobierno.","Ser informado de los asuntos de Estado y presidir las sesiones de las Cortes Generales.","El Alto Patronazgo de las Fuerzas Armadas.","Ejercer el derecho de gracia con arreglo a la ley, sin que esta pueda autorizar indultos generales."],"c":3,"tema":"I.4"},{"n":6,"q":"De acuerdo con el artículo 56.1 de la Constitución Española de 1978, ¿qué arbitra y modera el Rey?","o":["Las relaciones diplomáticas.","El funcionamiento regular de las instituciones.","La unidad y permanencia del Estado Español.","Las relaciones entre las naciones de su comunidad histórica."],"c":1,"tema":"I.4"},{"n":7,"q":"Según el artículo 75 de la Constitución Española de 1978, ¿cuál de las siguientes materias NO puede ser objeto de delegación en las Comisiones Legislativas Permanentes para la aprobación de proyectos o proposiciones de ley?","o":["Una ley orgánica.","Una ley ordinaria que regule aspectos sectoriales de una política pública.","Una proposición de ley ordinaria presentada por un grupo parlamentario.","Un proyecto de ley ordinaria cuya tramitación haya sido delegada, aunque el Pleno pueda recabar en cualquier momento el debate y votación."],"c":0,"tema":"I.5"},{"n":8,"q":"De conformidad con lo establecido en la Ley Orgánica 3/1980, de 22 de abril, del Consejo de Estado, el Pleno estará compuesto por, entre otros:","o":["El vicepresidente.","Los consejeros electivos, en número de doce, nombrados entre quienes hayan desempeñado el cargo de Fiscal General del Estado.","Los consejeros natos, entre los que figurarán los ex gobernadores del Banco de España.","Los consejeros permanentes, en numero igual al de las Secciones del Consejo, que son nombrados, sin límite de tiempo, por Real Decreto."],"c":3,"tema":"I.6"},{"n":9,"q":"Según el artículo 124.4 de la Constitución Española de 1978, el Fiscal General del Estado es nombrado por:","o":["El Congreso de los Diputados, a propuesta del Gobierno, previo informe vinculante del Consejo General del Poder Judicial.","El Rey, a propuesta del Consejo General del Poder Judicial, oído el Gobierno.","El Rey, a propuesta del Gobierno, oído el Consejo General del Poder Judicial.","El Rey, a propuesta del Gobierno, previa autorización del Senado."],"c":2},{"n":10,"q":"Según el artículo 3.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿en qué ámbito administran Justicia los órganos de la jurisdicción militar?","o":["En cualquiera en el que estén implicados los miembros de las Fuerzas Armadas, con independencia de su naturaleza.","En el estrictamente castrense y, en su caso, en las materias que establezca la declaración del estado de sitio.","Únicamente en el disciplinario militar, con exclusión de las materias penales y procesales.","Exclusivamente en el del estado de sitio."],"c":1,"tema":"I.7"},{"n":11,"q":"Según el artículo 55 bis de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué criterio debe observarse en el nombramiento de las personas titulares de las Secretarías de Estado y de los órganos directivos?","o":["Debe asegurarse que, en cada departamento ministerial, las personas de cada sexo no superen el 60% ni sean menos del 40 %.","Debe asegurarse que, en el conjunto de la Administración General del Estado, las personas de cada sexo no superen el 70% ni sean menos del 30 %.","Debe asegurarse que, en el conjunto de la Administración General del Estado, las personas de cada sexo no superen el 60% ni sean menos del 40 %.","En las Secretarías de Estado se aplica el principio de presencia equilibrada de hombres y mujeres, y en el resto de los órganos directivos de cada departamento ministerial, el de paridad."],"c":0,"tema":"I.8"},{"n":12,"q":"Según el artículo 82.1 de la Ley 40/2015, de 1 de octubre, del Régimen Jurídico del Sector Público, el Inventario de Entidades del Sector Público Estatal, Autonómico y Local:","o":["Es un registro público administrativo que garantiza la información pública y la ordenación de todas las entidades del sector público institucional, y su integración, gestión y publicación dependen de la Intervención General de la Administración del Estado.","Es un registro público administrativo que garantiza la información pública y la ordenación de todas las entidades del sector público institucional, y su integración, gestión y publicación dependen de la Autoridad Independiente de Responsabilidad Fiscal.","Es un registro administrativo interno, que recoge la clasificación de todas las entidades del sector público institucional y su gestión depende del Tribunal de Cuentas.","Es un registro administrativo interno, que recoge la clasificación de todas las entidades del sector público institucional y su gestión depende de la Subdirección General de Datos del Empleo Público."],"c":0,"tema":"I.9"},{"n":13,"q":"¿Sobre cuál de las siguientes materias tiene competencia exclusiva el Estado, de acuerdo con el artículo 149.1 de la Constitución de 1978?","o":["Ordenación del territorio, urbanismo y vivienda.","Asistencia social.","Marina mercante.","Pesca fluvial."],"c":2,"tema":"I.10"},{"n":14,"q":"¿Cuál de las siguientes afirmaciones es correcta?","o":["La Constitución prohíbe expresamente la federación de Comunidades Autónomas.","La Constitución permite la federación de Comunidades Autónomas siempre que se autorice mediante ley orgánica.","La Constitución permite la federación de Comunidades Autónomas si lo aprueban por mayoría absoluta las Asambleas Legislativas de las Comunidades afectadas.","La Constitución no regula la federación de Comunidades Autónomas, y se limita a lo que dispongan los Estatutos de Autonomía."],"c":0,"tema":"I.10"},{"n":15,"q":"Según el artículo 141.4 de la Constitución Española de 1978, ¿cómo se articula la administración propia de las islas en los archipiélagos?","o":["Mediante Diputaciones Provinciales insulares.","Mediante Mancomunidades insulares, creadas mediante acuerdo de los municipios que las integran.","Mediante Cabildos o Consejos.","Mediante Delegaciones del Gobierno en cada isla."],"c":2,"tema":"I.11"},{"n":16,"q":"Indique la respuesta correcta en relación con los municipios, de conformidad con lo establecido en la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local:","o":["El Alcalde, los Tenientes de Alcalde, el Pleno y la Junta de Gobierno Local existen en todos los ayuntamientos.","Los Tenientes de Alcalde sustituyen, por el orden de su nombramiento y en los casos de vacante, ausencia o enfermedad, al Alcalde, siendo libremente designados y removidos por los miembros del Pleno municipal.","El Alcalde es el Presidente de la Corporación y ostenta el control y la fiscalización de los órganos de gobierno.","Corresponde al Pleno municipal en los Ayuntamientos y a la Asamblea vecinal en el régimen de Concejo Abierto la declaración de lesividad de los actos del Ayuntamiento."],"c":3,"tema":"I.11"},{"n":17,"q":"Indique qué país de los siguientes NO forma parte de la eurozona:","o":["Dinamarca.","Letonia.","Eslovenia.","Malta."],"c":0,"tema":"II.6"},{"n":18,"q":"El Día de Europa se celebra cada 9 de mayo. ¿Qué conmemora?","o":["La firma del Tratado de Roma.","Celebra el aniversario de la Declaración Schuman.","La primera ampliación de la Unión Europea.","La entrada en vigor del Acuerdo de Schengen."],"c":1,"tema":"II.1"},{"n":19,"q":"En relación con el mandato del Presidente del Consejo Europeo indique la respuesta correcta de acuerdo con el artículo 15 del Tratado de la Unión Europea:","o":["Se elige para un mandato de cinco años, renovable una vez.","Se elige para un mandato de dos años, no renovable.","Se elige para un mandato de dos años y medio, renovable una vez.","Se elige para un mandato de cuatro años, renovable una vez."],"c":2,"tema":"II.2"},{"n":20,"q":"¿Quién se encargará de preparar los trabajos del Consejo, de acuerdo con el artículo 16 del Tratado de la Unión Europea?","o":["Un Comité de Representantes Permanentes de los Gobiernos de los estados miembros.","Un Comité de Representantes Especiales de los Gobiernos de los estados miembros.","Un Comité de Representantes Expertos de los Gobiernos de los estados miembros.","Un Comité de Representantes Profesionales de los Gobiernos de los estados miembros."],"c":0,"tema":"II.2"},{"n":21,"q":"De acuerdo con el artículo 249 del Tratado de Funcionamiento de la Unión Europea, ¿en qué plazo la Comisión publicará todos los años, con carácter previo a la apertura del período de sesiones del Parlamento Europeo, un informe general sobre las actividades de la Unión?","o":["Al menos tres meses antes.","Al menos seis meses antes.","Al menos un mes antes.","Al menos cuatro meses antes."],"c":2,"tema":"II.2"},{"n":22,"q":"Según el artículo 14 del Tratado de la Unión Europea, señale la respuesta correcta:","o":["El Parlamento Europeo elegirá a su Presidente y a la Mesa de entre sus diputados.","La función presupuestaria es ejercida en exclusiva por el Parlamento.","El Consejo de Asuntos Exteriores velará por la coherencia de los trabajos de las diferentes formaciones del Consejo.","El mandato de la Comisión será de cuatro años."],"c":0,"tema":"II.3"},{"n":23,"q":"De acuerdo con lo establecido en el artículo 263 del Tratado de Funcionamiento de la Unión Europea, el Tribunal de Justicia de la Unión Europea NO ser orable que otras en situación análoga o comparable por razón de orientación sexual e identidad sexual, expresión de género o características sexuales.","Diferencias de trato orientadas a prevenir, eliminar y, en su caso, compensar cualquier forma de discriminación o desventaja en su dimensión colectiva o social. Tales medidas serán aplicables en tanto subsistan las situaciones de discriminación o las desventajas que las justifican y habrán de ser razonables y proporcionadas en relación con los medios para su desarrollo y los objetivos que persigan."],"c":0,"tema":"III.9"},{"n":44,"q":"La Estrategia de Acción Exterior de España 2025-2028 tiene entre sus grandes ejes de actuación:","o":["Una España con presencia comercial en Asia.","Una Europa reforzada.","Una alianza en defensa que sustituya a la OTAN.","No existe esa Estrategia."],"c":1,"tema":"III.10"},{"n":45,"q":"Mediante la Ley 7/2025, de 28 de julio, se ha creado una entidad con el objetivo de reforzar las capacidades del Estado para mejorar la salud de la población, la equidad en salud y su bienestar y proteger a la población frente a riesgos y amenazas sanitarias, con un enfoque salutogénico que potencie las capacidades y el empoderamiento de las personas y las comunidades. ¿De qué entidad se trata?","o":["Instituto de Salud Pública O.A.","Agencia Estatal de Salud Pública.","Agencia Estatal de Control de Pandemias.","Autoridad Administrativa Independiente de Control de Pandemias."],"c":1,"tema":"III.10"},{"n":46,"q":"Según lo dispuesto en el artículo 1.1 del Código Civil, ¿cuáles de las siguientes son fuentes del Ordenamiento Jurídico Español?","o":["La Ley, los Tratados Internacionales y la jurisprudencia.","La Ley, los Reglamentos y la doctrina del Tribunal Supremo.","La Ley, los Reglamentos y la jurisprudencia.","La Ley, la costumbre y los principios generales del derecho."],"c":3,"tema":"IV.1"},{"n":47,"q":"Según el artículo 85 de la Constitución Española de 1978, ¿qué título recibirán las disposiciones d miento corresponderá a los Delegados de Economía y Hacienda."],"c":3,"tema":"IV.9"},{"n":56,"q":"Según el artículo 91.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los procedimientos de responsabilidad patrimonial, ¿cuándo podrá entenderse que la resolución es contraria a la indemnización del particular?","o":["Cuando hayan transcurrido cinco meses desde que se inició el procedimiento sin que haya recaído y se notifique resolución expresa, o en su caso, se haya formalizado el acuerdo.","Cuando hayan transcurrido tres meses desde que se inició el procedimiento sin que haya recaído y se notifique resolución expresa.","Cuando hayan transcurrido seis meses desde que se inició el procedimiento sin que haya recaido y se notifique resolución expresa o, en su caso, se haya formalizado el acuerdo.","Cuando hayan transcurrido dos meses desde que se inició el procedimiento sin que haya recaído y se notifique resolución expresa."],"c":2,"tema":"IV.10"},{"n":57,"q":"Según el artículo 73 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué plazo deberán realizarse los trámites que deban ser cumplimentados por los interesados?","o":["En el plazo de cinco días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto.","En el plazo de tres días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije un plazo distinto.","En el plazo de diez días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto.","En el plazo de veinte días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije un plazo distinto."],"c":2,"tema":"IV.11"},{"n":58,"q":"Según el artículo 24 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los procedimientos iniciados a solicitud del interesado, ¿en cuál de los siguientes casos tendrá efecto desestimatorio el silencio administrativo?","o":["En los procedimientos de responsabilidad sancionadora de las Administraciones Públicas.","En los procedimientos relativos al ejercicio del derecho de asociación a que se refiere el artículo 22 de la Constitución Española de 1978.","En los procedimientos que impliquen el ejercicio de actividades que puedan dañar el medio ambiente.","En los procedimientos cuya estimación tuviera como consecuencia que se transfieran al solicitante facultades relativas al dominio privado."],"c":2,"tema":"IV.11"},{"n":59,"q":"Según el artículo 121.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué ocurre si el recurso de alzada se interpone ante el mismo órgano que dictó el acto impugnado?","o":["El órgano que dictó el acto que se impugna deberá resolver el recurso de alzada el plazo de diez días desde que lo haya recibido.","El órgano que dictó el acto que se impugna podrá remitirlo al competente en el plazo de quince días, con su informe y con una copia completa y ordenada del expediente.","El órgano que dictó el acto que se impugna deberá remitirlo al competente en el plazo de diez días, con su informe y con una copia completa y ordenada del expediente.","El órgano que dictó el acto que se impugna deberá resolver el recurso de alzada en el plazo de quince días desde que lo haya recibido."],"c":2,"tema":"IV.12"},{"n":60,"q":"Según se establece en el artículo 19 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, están legitimados ante el orden jurisdiccional contencioso-administrativo:","o":["Cualquier ciudadano sin interés directo.","Solo quienes ostenten un derecho subjetivo.","Las persona    ====================================================================== */
const KEY_AJUSTES_V1 = "gestion_hub_ajustes_v1";   // progreso antiguo (por posición); se migra
const KEY_PROG    = "gestion_hub_progreso_v2:";     // + uid | "local"
const KEY_PEND    = "gestion_hub_pendientes_v1";    // { temas:{id:1}, prog:{"uid|clave":1} }

function leerJSON(k, def) { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? def : v; } catch (_) { return def; } }
function escribirJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }

const pend = Object.assign({ temas:{}, prog:{} }, leerJSON(KEY_PEND, {}));
const borrados = leerJSON(KEY_BORR, {});
function guardarPend() { escribirJSON(KEY_PEND, pend); escribirJSON(KEY_BORR, borrados); pintarSync(); }
function nPendientes() { return Object.keys(pend.temas).length + Object.keys(pend.prog).length; }

/* ---- Progreso de flashcards (por persona) ------------------------------
   Cada tarjeta se identifica por el tema y un resumen de su pregunta, no por
   su posición: si el tema se edita y las tarjetas cambian de orden, lo que
   ya sabías sigue marcado. Valor: { s: sabida, m: ms de la última marca }. */
const prog = { duenno:"local", mapa:{} };
function hashCorto(txt) {
  let h = 0x811c9dc5;
  const s = String(txt || "").trim();
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36);
}
function claveFc(id, f) { return id + ":" + hashCorto(f && f.q); }
function sabida(k) { const v = prog.mapa[k]; return !!(v && v.s); }
function sabidasDe(t) { return fcs(t).filter(f => sabida(claveFc(t.id, f))).length; }
function guardarProg() { escribirJSON(KEY_PROG + prog.duenno, prog.mapa); }
/* El progreso de cada persona es un mapa de claves con { s, m, d? }:
     "B4T11:<hash>"          flashcard dominada
     "B4T11:sec:<apartado>"  apartado marcado como repasado
     "B4T11:res:<hash>"      texto resaltado        d: { sec, x }
     "B4T11:q:<hash>"        última respuesta a una pregunta (s: acertada) d: { a, f }
     "T:<ámbito>:<marca>"    resultado de un test   d: { a, f, b, n, amb }
   Todo se sincroniza igual, clave a clave (gana la marca más reciente). */
function progreso(k) { return prog.mapa[k] || null; }
function marcarProg(k, valor, datos) {
  prog.mapa[k] = datos === undefined ? { s:!!valor, m:Date.now() } : { s:!!valor, m:Date.now(), d:datos };
  guardarProg();
  pend.prog[prog.duenno + "|" + k] = 1; guardarPend();
  programarSync();
}
const repasada = (id, sec) => sabida(id + ":sec:" + sec);
function resaltadosDe(id) {
  return Object.keys(prog.mapa).filter(k => k.startsWith(id + ":res:") && prog.mapa[k].s && prog.mapa[k].d)
    .map(k => Object.assign({ k }, prog.mapa[k].d)).sort((a, b) => (prog.mapa[a.k].m) - (prog.mapa[b.k].m));
}
function registrarRespuesta(id, q, acierto) {
  const k = id + ":q:" + hashCorto(q.q), v = progreso(k), d = (v && v.d) || { a:0, f:0 };
  marcarProg(k, acierto, { a:d.a + (acierto ? 1 : 0), f:d.f + (acierto ? 0 : 1) });
}
const fallada = (id, q) => { const v = progreso(id + ":q:" + hashCorto(q.q)); return !!(v && !v.s); };
function resultadosTest(filtro) {
  return Object.keys(prog.mapa).filter(k => k.startsWith("T:") && prog.mapa[k].d && (!filtro || filtro(prog.mapa[k].d)))
    .map(k => Object.assign({ m:prog.mapa[k].m }, prog.mapa[k].d)).sort((a, b) => b.m - a.m);
}
/** Apartados principales (los subapartados van dentro de su apartado). */
function apartados(t) {
  const out = [];
  t.sections.forEach(x => {
    if (!(lleno(x.title) || lleno(x.body))) return;
    if (x.nivel === 2 && out.length) out[out.length - 1].subs.push(x);
    else out.push({ s:x, subs:[] });
  });
  return out;
}
function repasoDe(t) {
  const a = apartados(t);
  return { n:a.length, hechos:a.filter(x => repasada(t.id, x.s.id)).length };
}
function marcarFc(k, valor) {
  prog.mapa[k] = { s:!!valor, m:Date.now() };
  guardarProg();
  pend.prog[prog.duenno + "|" + k] = 1; guardarPend();
  programarSync();
}
/** Carga el progreso de quien tenga la sesión. Lo marcado sin sesión se
    suma al de la primera persona que entre (y se sube). */
function cargarProgreso(uid) {
  const duenno = uid || "local";
  prog.duenno = duenno;
  prog.mapa = leerJSON(KEY_PROG + duenno, {});
  if (uid) {
    const local = leerJSON(KEY_PROG + "local", null);
    if (local && Object.keys(local).length) {
      for (const k in local) {
        const a = prog.mapa[k];
        if (!a || local[k].m > a.m) { prog.mapa[k] = local[k]; pend.prog[uid + "|" + k] = 1; }
      }
      Object.keys(pend.prog).forEach(pk => { if (pk.startsWith("local|")) delete pend.prog[pk]; });
      try { localStorage.removeItem(KEY_PROG + "local"); } catch (_) {}
      guardarProg(); guardarPend();
    }
  }
}
/** Progreso de la primera versión del hub (claves por posición). */
function migrarProgresoV1() {
  const v1 = leerJSON(KEY_AJUSTES_V1, null);
  if (!v1 || !v1.fc || !Array.isArray(v1.fc.known)) return;
  v1.fc.known.forEach(k => {
    const [id, i] = k.split(":");
    const t = estado.temas[id];
    const f = t && t.flashcards[parseInt(i, 10)];
    if (f && !sabida(claveFc(id, f))) marcarFc(claveFc(id, f), true);
  });
  try { localStorage.removeItem(KEY_AJUSTES_V1); } catch (_) {}
}

/* ---- IndexedDB ---------------------------------------------------------- */
let db = null;
function abrirDB() {
  return new Promise((ok, ko) => {
    const r = indexedDB.open(DB_NOMBRE, 1);
    r.onerror = () => ko(r.error);
    r.onsuccess = () => { db = r.result; ok(db); };
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains("temas")) d.createObjectStore("temas", { keyPath:"id" });
    };
  });
}
function dbTodos() {
  return new Promise((ok, ko) => {
    if (!db) return ok({});
    const out = {};
    const tx = db.transaction("temas", "readonly");
    tx.objectStore("temas").openCursor().onsuccess = e => {
      const c = e.target.result;
      if (c) { out[c.key] = c.value; c.continue(); } else ok(out);
    };
    tx.onerror = () => ko(tx.error);
  });
}
function dbPut(obj) {
  return new Promise((ok, ko) => {
    if (!db) return ok();
    const tx = db.transaction("temas", "readwrite");
    tx.objectStore("temas").put(obj);
    tx.oncomplete = ok; tx.onerror = () => ko(tx.error);
  });
}
function dbBorrar(id) {
  return new Promise((ok, ko) => {
    if (!db) return ok();
    const tx = db.transaction("temas", "readwrite");
    tx.objectStore("temas").delete(id);
    tx.oncomplete = ok; tx.onerror = () => ko(tx.error);
  });
}
/* Los mazos de flashcards se rehacen al cambiar el contenido. */
function olvidarMazos() { Object.keys(hubLocal).forEach(k => { hubLocal[k].mazo = null; hubLocal[k].test = null; }); }
function olvidarBlob(id) { if (blobs[id]) { URL.revokeObjectURL(blobs[id]); delete blobs[id]; } }

/** Guarda un tema. Si viene de una acción tuya (no de la bajada) se sella con
    la hora y entra en la cola de subida. */
/* Cada tema se sincroniza por PARTES, cada una con su propia fecha: si en un
   dispositivo editas el glosario y en otro los apuntes, se combinan en vez de
   ganar el tema entero del último. El servidor hace la misma mezcla (010). */
const PARTES = ["meta", "sections", "glossary", "timeline", "flashcards", "questions"];
const CAMPOS_META = ["title", "subtitle", "etiquetas", "fileName", "html", "cargado"];
function modParte(t, k) { return (t.mod && t.mod[k]) || t.modificado || 0; }
function copiarParte(dst, src, k) {
  if (k === "meta") CAMPOS_META.forEach(f => { dst[f] = src[f] == null ? null : src[f]; });
  else dst[k] = JSON.parse(JSON.stringify(src[k] || []));
}
/** Mezcla dos versiones parte a parte (gana la más reciente de cada parte). */
function mezclarTema(local, remoto) {
  const out = JSON.parse(JSON.stringify(remoto));
  out.mod = {};
  let deLocal = false, deRemoto = false;
  PARTES.forEach(k => {
    const ml = modParte(local, k), mr = modParte(remoto, k);
    if (ml > mr) { deLocal = true; copiarParte(out, local, k); out.mod[k] = ml; }
    else { if (mr > ml) deRemoto = true; out.mod[k] = mr; }
  });
  out.modificado = Math.max(local.modificado || 0, remoto.modificado || 0);
  return { t:out, deLocal, deRemoto };
}

/** partes: las que has cambiado (por defecto, todas). Solo esas se sellan. */
async function guardarTema(t, deServidor, marca, partes) {
  if (!deServidor) {
    const ahora = marca || Date.now();
    const antes = t.modificado || 0;
    t.mod = Object.assign({}, t.mod);
    PARTES.forEach(k => { if (!t.mod[k]) t.mod[k] = antes; });
    (partes || PARTES).forEach(k => { t.mod[k] = ahora; });
    t.modificado = Math.max(ahora, ...PARTES.map(k => t.mod[k] || 0));
    pend.temas[t.id] = 1; delete borrados[t.id]; guardarPend();
  }
  estado.temas[t.id] = t;
  olvidarMazos(); olvidarBlob(t.id);
  await dbPut(t);
  if (!deServidor) programarSync();
}
/** Quita el contenido de un tema. El borrado también se sincroniza (queda una
    marca en el servidor); el progreso de cada persona no se toca. */
async function quitarTema(id, deServidor) {
  delete estado.temas[id];
  olvidarMazos(); olvidarBlob(id);
  if (!deServidor) { borrados[id] = Date.now(); pend.temas[id] = 1; guardarPend(); }
  await dbBorrar(id);
  if (!deServidor) programarSync();
}

/* ========================================================================
   (b2) SINCRONIZACIÓN con Supabase — la misma cuenta y el mismo hogar que
   Niblo, sin librerías (REST + WebSocket), como en Niblo.
   - Subida: cola de pendientes; se reintenta sola al volver la conexión.
   - Bajada: solo lo cambiado desde el último cursor (con 2 min de solape:
     una fila que se confirma tarde no se pierde; aplicar dos veces es inocuo).
   - Conflictos: gana la última modificación, por tema y por tarjeta. El
     servidor lo hace cumplir también (trigger): una subida vieja nunca pisa
     una nueva, aunque llegue después.
   - En vivo: WebSocket de Realtime; cada aviso dispara una bajada.
   ====================================================================== */
const SUPA = { url:null, anon:null, token:null, refresh:null, uid:null, email:null };
const SYNC = Object.assign({ hogar:null, uid:null, cT:null, cP:null }, leerJSON(KEY_SYNC, {}));
const S = { estado:"local", detalle:"", enCurso:null, repetir:false, timer:null, ultimaSubida:0, ultimaOk:null };

function jwt(token) {
  try { return JSON.parse(atob(String(token).split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch (_) { return null; }
}
function caducaPronto(token) { const c = jwt(token); return !c || (typeof c.exp === "number" && c.exp * 1000 < Date.now() + 60000); }
/** Lee la sesión que guarda Niblo. Devuelve true si hay sesión utilizable. */
function leerSesion() {
  const o = leerJSON(KEY_SUPABASE, null);
  if (!o || !o.token || !o.url || !o.anonKey) {
    Object.assign(SUPA, { url:null, anon:null, token:null, refresh:null, uid:null, email:null });
    return false;
  }
  const c = jwt(o.token);
  Object.assign(SUPA, { url:o.url, anon:o.anonKey, token:o.token, refresh:o.refreshToken || null,
    uid:(c && c.sub) || o.userId || null, email:o.email || null });
  return !!SUPA.uid;
}
const haySesion = () => !!(SUPA.token && SUPA.uid);

/* Renovar el token. Supabase ROTA el refresh token: si Niblo y el hub lo
   gastaran a la vez, el segundo recibiría «ya usado» y la detección de reuso
   podría cerrar la sesión en todas partes. Por eso: (1) cerrojo compartido
   entre pestañas con Niblo (Web Locks, mismo nombre); (2) antes de pedir,
   se mira si otra pestaña ya lo ha renovado; (3) el resultado se escribe en
   la misma clave que lee Niblo. */
const CERROJO_AUTH = "niblo-auth-refresh";
let _renovando = null;
function renovarToken() {
  if (_renovando) return _renovando;
  const tokenAntes = SUPA.token;
  const hacer = async () => {
    const g = leerJSON(KEY_SUPABASE, null);
    if (g && g.token && g.token !== tokenAntes && !caducaPronto(g.token)) {
      SUPA.token = g.token; SUPA.refresh = g.refreshToken || SUPA.refresh;
      return true;
    }
    const refresh = (g && g.refreshToken) || SUPA.refresh;
    if (!refresh) return false;
    try {
      const r = await fetchPlazo(SUPA.url + "/auth/v1/token?grant_type=refresh_token", {
        method:"POST", headers:{ "apikey":SUPA.anon, "Content-Type":"application/json" },
        body:JSON.stringify({ refresh_token:refresh })
      });
      if (!r.ok) return false;
      const d = await r.json();
      SUPA.token = d.access_token; SUPA.refresh = d.refresh_token || refresh;
      const o = leerJSON(KEY_SUPABASE, {}) || {};
      o.token = SUPA.token; o.refreshToken = SUPA.refresh;
      escribirJSON(KEY_SUPABASE, o);
      return true;
    } catch (_) { return false; }
  };
  _renovando = (navigator.locks && navigator.locks.request ? navigator.locks.request(CERROJO_AUTH, hacer) : hacer())
    .then(ok => { if (ok) rtToken(); return ok; })
    .finally(() => { _renovando = null; });
  return _renovando;
}
function fetchPlazo(url, opts, ms) {
  const ctrl = typeof AbortController === "function" ? new AbortController() : null;
  const t = setTimeout(() => { if (ctrl) ctrl.abort(); }, ms || 20000);
  return fetch(url, ctrl ? Object.assign({}, opts, { signal:ctrl.signal }) : opts).finally(() => clearTimeout(t));
}
async function supa(ruta, opts, reintento) {
  if (reintento === undefined) reintento = true;
  if (reintento && SUPA.refresh && caducaPronto(SUPA.token)) await renovarToken();
  const headers = Object.assign({ "apikey":SUPA.anon, "Authorization":"Bearer " + SUPA.token, "Content-Type":"application/json" }, (opts && opts.headers) || {});
  const r = await fetchPlazo(SUPA.url + ruta, Object.assign({}, opts, { headers }), opts && opts.plazo);
  if (r.status === 401 && reintento) {
    if (await renovarToken()) return supa(ruta, opts, false);
    const e = new Error("sesión caducada"); e.sesion = true; throw e;
  }
  if (!r.ok) {
    const txt = await r.text().catch(() => "");
    let j = null; try { j = JSON.parse(txt); } catch (_) {}
    const e = new Error("Supabase " + r.status + ": " + ((j && j.message) || txt));
    e.status = r.status; e.code = j && j.code; e.pg = (j && [j.message, j.details, j.hint].filter(Boolean).join(" · ")) || txt;
    throw e;
  }
  if (r.status === 204 || r.status === 201) return null;
  const ct = r.headers.get("Content-Type") || "";
  return ct.indexOf("json") >= 0 ? r.json() : r.text();
}
const ms = iso => { const n = Date.parse(iso); return isNaN(n) ? 0 : n; };
const iso = n => new Date(n).toISOString();
function guardarSyncMeta() { escribirJSON(KEY_SYNC, { hogar:SYNC.hogar, uid:SYNC.uid, cT:SYNC.cT, cP:SYNC.cP }); }

/** Hogar de la sesión (RLS solo devuelve los tuyos). Si cambia, lo guardado
    aquí era de otro hogar: se descarta el contenido local para no mezclarlo. */
async function asegurarHogar() {
  const filas = await supa("/rest/v1/hogares?select=id&limit=1");
  const h = filas && filas[0] && filas[0].id;
  if (!h) { const e = new Error("tu cuenta no tiene hogar en Niblo"); e.sinHogar = true; throw e; }
  if (SYNC.hogar && SYNC.hogar !== h) {
    for (const id of Object.keys(estado.temas)) await quitarTema(id, true);
    Object.keys(pend.temas).forEach(id => delete pend.temas[id]);
    Object.keys(borrados).forEach(id => delete borrados[id]);
    guardarPend();
    SYNC.cT = null;
  }
  if (SYNC.uid !== SUPA.uid) { SYNC.cP = null; SYNC.uid = SUPA.uid; }
  SYNC.hogar = h; guardarSyncMeta();
  return h;
}

/** Lee páginas de 1000 filas (el límite de PostgREST) ordenadas por cursor. */
async function bajarTabla(base, cursor) {
  const desde = cursor ? "&actualizado=gte." + encodeURIComponent(iso(ms(cursor) - 120000)) : "";
  const filas = [];
  for (let off = 0; ; off += 1000) {
    const pag = await supa(base + desde + "&order=actualizado.asc&limit=1000&offset=" + off);
    filas.push(...(pag || []));
    if (!pag || pag.length < 1000) break;
  }
  return filas;
}
async function bajar() {
  let cambios = 0;
  // Temas del hogar
  const ft = await bajarTabla(`/rest/v1/oposicion_temas?select=tema_id,datos,borrado,modificado,actualizado&hogar_id=eq.${SYNC.hogar}`, SYNC.cT);
  for (const r of ft) {
    const id = r.tema_id;
    if (!TEMA_POR_ID[id]) continue;
    const tm = ms(r.modificado);
    const loc = estado.temas[id];
    const lm = loc ? (loc.modificado || 0) : (borrados[id] || 0);
    if (r.borrado || !r.datos) {
      // Borrado: decide la fecha del tema entero (si lo editaste después, se queda).
      if (tm > lm) { if (loc) { await quitarTema(id, true); cambios++; S.cambioTemas = true; } delete borrados[id]; delete pend.temas[id]; }
    } else {
      const rem = normalizarTema(id, r.datos, r.datos.fileName, r.datos.html);
      rem.modificado = tm; rem.cargado = r.datos.cargado || rem.cargado;
      rem.mod = Object.assign({}, r.datos.mod);
      if (!loc) {
        if (tm > lm) { await guardarTema(rem, true); delete borrados[id]; delete pend.temas[id]; cambios++; S.cambioTemas = true; }
      } else {
        const { t, deLocal, deRemoto } = mezclarTema(loc, rem);
        if (deRemoto && !deLocal) { await guardarTema(rem, true); delete pend.temas[id]; cambios++; S.cambioTemas = true; }
        else if (deRemoto && deLocal) {
          // Cada lado tiene algo más nuevo: se guarda la mezcla y se sube.
          await guardarTema(t, false, null, []); cambios++; S.cambioTemas = true;
        }
        // Solo lo local es más nuevo (o son iguales): ya está en la cola o no hay nada que hacer.
      }
    }
    if (!SYNC.cT || ms(r.actualizado) > ms(SYNC.cT)) SYNC.cT = r.actualizado;
  }
  // Progreso propio
  const fp = await bajarTabla(`/rest/v1/oposicion_progreso?select=tarjeta,sabida,datos,modificado,actualizado&user_id=eq.${SUPA.uid}`, SYNC.cP);
  let cambioProg = false;
  for (const r of fp) {
    const tm = ms(r.modificado), a = prog.mapa[r.tarjeta];
    if (!a || tm > a.m) {
      S.cambioProg = true;
      prog.mapa[r.tarjeta] = r.datos == null ? { s:!!r.sabida, m:tm } : { s:!!r.sabida, m:tm, d:r.datos };
      delete pend.prog[SUPA.uid + "|" + r.tarjeta];
      cambioProg = true; cambios++;
    }
    if (!SYNC.cP || ms(r.actualizado) > ms(SYNC.cP)) SYNC.cP = r.actualizado;
  }
  if (cambioProg) {
    guardarProg();
    // Las tarjetas que ya sabes (aunque lo marcaras en otro dispositivo) salen del mazo en curso.
    Object.values(hubLocal).forEach(h => { if (h.mazo) { h.mazo = h.mazo.filter(f => !sabida(f._k)); if (h.idx >= h.mazo.length) h.idx = 0; } });
  }
  guardarPend(); guardarSyncMeta();
  return cambios;
}
async function subir() {
  // Temas: de uno en uno (pueden llevar el HTML completo del tema).
  for (const id of Object.keys(pend.temas)) {
    if (!TEMA_POR_ID[id]) { delete pend.temas[id]; continue; }
    const t = estado.temas[id];
    const marca = t ? t.modificado : borrados[id];
    if (!marca) { delete pend.temas[id]; continue; }
    let datos = null;
    if (t) { datos = Object.assign({}, t); delete datos.id; delete datos.modificado; }
    await supa("/rest/v1/oposicion_temas?on_conflict=hogar_id,tema_id", {
      method:"POST", plazo:60000,
      headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
      body:JSON.stringify({ hogar_id:SYNC.hogar, tema_id:id, datos, borrado:!t, modificado:iso(marca) })
    });
    S.ultimaSubida = Date.now();
    // Solo se da por subido si no ha vuelto a cambiar mientras tanto.
    const ahora = estado.temas[id] ? estado.temas[id].modificado : borrados[id];
    if (ahora === marca) { delete pend.temas[id]; if (!t) delete borrados[id]; }
    guardarPend();
  }
  // Progreso: por lotes; solo lo de la persona con sesión.
  const mias = Object.keys(pend.prog).filter(pk => pk.startsWith(SUPA.uid + "|"));
  for (let i = 0; i < mias.length; i += 500) {
    const lote = mias.slice(i, i + 500);
    const filas = lote.map(pk => { const k = pk.slice(SUPA.uid.length + 1); const v = prog.mapa[k]; return v ? { user_id:SUPA.uid, tarjeta:k, sabida:!!v.s, datos:v.d === undefined ? null : v.d, modificado:iso(v.m) } : null; }).filter(Boolean);
    const marcas = lote.map(pk => { const v = prog.mapa[pk.slice(SUPA.uid.length + 1)]; return v ? v.m : null; });
    if (filas.length) {
      await supa("/rest/v1/oposicion_progreso?on_conflict=user_id,tarjeta", {
        method:"POST", headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" }, body:JSON.stringify(filas)
      });
      S.ultimaSubida = Date.now();
    }
    lote.forEach((pk, j) => { const v = prog.mapa[pk.slice(SUPA.uid.length + 1)]; if (!v || v.m === marcas[j]) delete pend.prog[pk]; });
    guardarPend();
  }
}

function sincronizar() {
  if (!haySesion()) { ponerSync("local"); return Promise.resolve(); }
  if (!navigator.onLine) { ponerSync("offline"); return Promise.resolve(); }
  if (S.enCurso) { S.repetir = true; return S.enCurso; }
  S.enCurso = (async () => {
    ponerSync("sync");
    try {
      await asegurarHogar();
      const cambios = await bajar();
      await subir();
      S.ultimaOk = new Date();
      ponerSync("ok");
      if (cambios) repintar();
      rtConectar();
    } catch (e) {
      const m = e.message || String(e);
      if (e.sesion) ponerSync("sesion", "La sesión de Niblo ha caducado: vuelve a entrar en Niblo.");
      else if (e.sinHogar) ponerSync("error", "Tu cuenta no tiene hogar en Niblo.");
      /* Cada caso con su mensaje y siempre con el texto real de Supabase, para
         no confundir una tabla que falta con una columna que la API aún no
         conoce (después de una migración, su caché tarda en enterarse). */
      else if (/datos/i.test(m) && (e.code === "42703" || e.code === "PGRST204" || /column/i.test(m)))
        ponerSync("error", "Supabase no encuentra la columna «datos» (migración 010). Si ya la ejecutaste, recarga la caché de la API con: NOTIFY pgrst, 'reload schema';  — Detalle: " + (e.pg || m));
      else if ((e.code === "42P01" || e.code === "PGRST205" || /relation .* does not exist|Could not find the table/i.test(m)) && /oposicion_/i.test(m))
        ponerSync("error", "Supabase no encuentra las tablas del hub (migración 009). Si ya la ejecutaste, recarga la caché con: NOTIFY pgrst, 'reload schema';  — Detalle: " + (e.pg || m));
      else if (!navigator.onLine || /Failed to fetch|NetworkError|aborted|Load failed/i.test(m)) ponerSync("offline");
      else ponerSync("error", "Error de Supabase" + (e.code ? " (" + e.code + ")" : "") + ": " + (e.pg || m).slice(0, 300));
      console.warn("Sync oposición:", e);
    } finally {
      S.enCurso = null;
      if (S.repetir) { S.repetir = false; programarSync(300); }
    }
  })();
  return S.enCurso;
}
function programarSync(espera) {
  clearTimeout(S.timer);
  pintarSync();
  S.timer = setTimeout(() => sincronizar(), espera == null ? 500 : espera);
}

/* ---- Tiempo real (WebSocket de Supabase Realtime) ---------------------- */
const RT = { ws:null, ref:0, latido:null, reintento:null, intentos:0, conectado:false, tema:"realtime:oposicion", aviso:null };
function rtEnviar(topic, event, payload) {
  if (RT.ws && RT.ws.readyState === 1) RT.ws.send(JSON.stringify({ topic, event, payload:payload || {}, ref:String(++RT.ref) }));
}
function rtConectar() {
  if (!haySesion() || !SYNC.hogar) return;
  if (RT.ws && RT.ws.readyState <= 1) return;
  clearTimeout(RT.reintento);
  let ws;
  try { ws = new WebSocket(`wss://${SUPA.url.replace(/^https?:\/\//, "")}/realtime/v1/websocket?apikey=${encodeURIComponent(SUPA.anon)}&vsn=1.0.0`); }
  catch (_) { return; }
  RT.ws = ws;
  ws.onopen = async () => {
    if (caducaPronto(SUPA.token)) await renovarToken();
    rtEnviar(RT.tema, "phx_join", {
      config:{
        broadcast:{ self:false },
        postgres_changes:[
          { event:"*", schema:"public", table:"oposicion_temas",    filter:`hogar_id=eq.${SYNC.hogar}` },
          { event:"*", schema:"public", table:"oposicion_progreso", filter:`user_id=eq.${SUPA.uid}` }
        ]
      },
      access_token:SUPA.token
    });
    clearInterval(RT.latido);
    RT.latido = setInterval(() => {
      rtEnviar("phoenix", "heartbeat", {});
      // El canal se cierra cuando caduca el token: se renueva antes.
      if (caducaPronto(SUPA.token)) renovarToken();
    }, 25000);
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.topic !== RT.tema) return;
    if (m.event === "phx_reply" && m.payload && m.payload.status === "ok" && m.payload.response && m.payload.response.postgres_changes) {
      RT.conectado = true; RT.intentos = 0; pintarSync();
      // Lo que cambiara mientras no había canal se recoge ahora.
      programarSync(200);
      return;
    }
    if ((m.event === "system" && m.payload && m.payload.status === "error") || m.event === "phx_error" || m.event === "phx_close") {
      RT.conectado = false; pintarSync();
      try { ws.close(); } catch (_) {}
      return;
    }
    if (m.event === "postgres_changes") {
      // Puede ser el eco de lo que acabamos de subir: se deja pasar la ventana.
      const espera = Math.max(300, 1500 - (Date.now() - S.ultimaSubida));
      programarSync(espera);
    }
  };
  ws.onclose = () => {
    RT.conectado = false; clearInterval(RT.latido); pintarSync();
    if (RT.ws !== ws) return;
    RT.ws = null;
    if (!haySesion()) return;
    const espera = Math.min(30000, 1000 * Math.pow(2, RT.intentos++));
    RT.reintento = setTimeout(rtConectar, espera);
  };
  ws.onerror = () => { try { ws.close(); } catch (_) {} };
}
/** Token nuevo: se lo pasa al canal abierto para que no lo cierre al caducar. */
function rtToken() { if (RT.conectado) rtEnviar(RT.tema, "access_token", { access_token:SUPA.token }); }
function rtCerrar() {
  clearTimeout(RT.reintento); clearInterval(RT.latido); RT.conectado = false;
  if (RT.ws) { const w = RT.ws; RT.ws = null; try { w.close(); } catch (_) {} }
}

/* ---- Indicador de sincronización -------------------------------------- */
function ponerSync(est, detalle) { S.estado = est; S.detalle = detalle || ""; pintarSync(); }
function pintarSync() {
  const el = document.getElementById("sync-pill");
  if (!el) return;
  const n = nPendientes();
  const txt = {
    local:   "Solo este dispositivo",
    sync:    "Sincronizando…",
    ok:      n ? `${n} pendiente${n === 1 ? "" : "s"}` : (RT.conectado ? "Sincronizado" : "Sincronizado"),
    offline: n ? `Sin conexión · ${n} pendiente${n === 1 ? "" : "s"}` : "Sin conexión",
    sesion:  "Sesión caducada",
    error:   "Error al sincronizar"
  }[S.estado];
  el.dataset.estado = S.estado === "ok" && RT.conectado ? "vivo" : S.estado;
  el.querySelector(".t").textContent = txt;
  const hora = S.ultimaOk ? " · última: " + S.ultimaOk.toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" }) : "";
  el.title = ({
    local:   "Sin sesión de Niblo: los cambios se guardan solo en este navegador. Entra en Niblo para sincronizar.",
    sync:    "Sincronizando con Niblo…",
    ok:      (RT.conectado ? "Sincronizado y en vivo: los cambios de otros dispositivos llegan al momento" : "Sincronizado (sin canal en vivo: se comprueba al volver a la página)") + hora,
    offline: "Sin conexión: los cambios se guardan aquí y se subirán solos al volver la red.",
    sesion:  S.detalle,
    error:   S.detalle
  }[S.estado]) || "";
}

/* ========================================================================
   (c) UTILIDADES
   ====================================================================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function barajar(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function plural(n, s, p) { return n + " " + (n === 1 ? s : (p || s + "s")); }
function resaltar(texto, q) {
  const txt = String(texto || "");
  if (!q) return esc(txt);
  const i = norm(txt).indexOf(norm(q));
  if (i < 0) return esc(txt);
  return esc(txt.slice(0, i)) + "<mark>" + esc(txt.slice(i, i + q.length)) + "</mark>" + esc(txt.slice(i + q.length));
}
/** Ordena hitos: primer año de 4 cifras; siglos en romano; lo demás al final. */
function claveAnio(y) {
  const s = String(y || "");
  const m = s.match(/\d{4}/); if (m) return parseInt(m[0], 10);
  const r = s.match(/s\.?\s*([ivxlcdm]+)/i);
  if (r) return romano(r[1].toUpperCase()) * 100 - 50;
  return 99999;
}
function romano(s) { const v = { I:1, V:5, X:10, L:50, C:100, D:500, M:1000 }; let r = 0, p = 0; for (let i = s.length - 1; i >= 0; i--) { const x = v[s[i]] || 0; r += x < p ? -x : x; p = x; } return r; }

function toast(msg, tipo, duracion) {
  const box = document.getElementById("toast-box");
  const t = document.createElement("div");
  t.className = "toast" + (tipo === "error" ? " error" : "");
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => t.remove(), duracion || 3600);
}

/** Texto de la tabla del documento -> HTML con los enlaces que el documento
    enlaza: identificadores BOE (texto consolidado), webs institucionales y
    las fuentes citadas por su nombre. «(verif.)» se marca aparte. */
function enlazar(texto) {
  let h = esc(texto);
  const marcas = [];
  const guardar = html => { marcas.push(html); return "\u0000" + (marcas.length - 1) + "\u0000"; };
  h = h.replace(/BOE-A-\d{4}-\d+/g, id =>
    guardar(`<a href="https://www.boe.es/buscar/act.php?id=${id}" target="_blank" rel="noopener">${id}</a>`));
  ENLACES_TEXTO.forEach(([t, url]) => {
    h = h.split(esc(t)).join(guardar(`<a href="${url}" target="_blank" rel="noopener">${esc(t)}</a>`));
  });
  h = h.replace(/\bwww\.[a-z0-9.-]+\.[a-z]{2,}(?:\/[a-z0-9\/._-]*[a-z0-9\/])?/gi, d =>
    guardar(`<a href="https://${d}" target="_blank" rel="noopener">${d}</a>`));
  DOMINIOS_SIN_WWW.forEach(d => {
    h = h.replace(new RegExp("(^|[\\s(;,])(" + d.replace(/[.\/]/g, "\\$&") + ")(?![\\w.-]*\\w)", "g"),
      (m, pre, dom) => pre + guardar(`<a href="https://${dom}" target="_blank" rel="noopener">${dom}</a>`));
  });
  h = h.replace(/\(verif\.\)/g, () =>
    guardar('<span class="verif" title="Norma, cifra o web citada sin identificador o sin comprobar en la revisión del documento: contrástala antes de incorporarla a tus temas.">verif.</span>'));
  return h.replace(/\u0000(\d+)\u0000/g, (m, i) => marcas[+i]);
}

function tagVigencia(t) { const v = VIGENCIA[t.v[0]]; return `<span class="tag ${v.cls}" title="${esc(v.def)}">${v.txt}</span>`; }
function tagFuente(t)   { const f = FUENTE[t.f[0]];   return `<span class="tag ${f.cls}" title="${esc(f.def)}">${f.txt}</span>`; }
function tagTac(t)      { return t.tac ? `<span class="tag lila" title="Sin correlato en el TAC con grupo de sociales (§15.6 del PDF base)">Sin correlato TAC</span>` : ""; }

function temasDeBloque(code) { return Object.values(estado.temas).filter(t => t.group === code).sort((a, b) => a.id.localeCompare(b.id)); }
function temasDeAmbito(ambito) {
  if (ambito === "global") return Object.values(estado.temas).sort((a, b) => a.id.localeCompare(b.id));
  return temasDeBloque(ambito);
}
function codigoDe(id) { return TEMA_POR_ID[id] ? TEMA_POR_ID[id].c : id; }

/* Lo que se usa para estudiar: solo lo completo. El editor guarda también lo
   que esté a medias para no perderlo, pero no entra en mazos ni tests. */
const lleno = x => String(x == null ? "" : x).trim() !== "";
const fcValida = f => !!(f && lleno(f.q) && lleno(f.a));
function fcs(t) { return t.flashcards.filter(fcValida); }
/** Preguntas completas, sin opciones vacías (la correcta se reindexa). */
function qs(t) {
  const out = [];
  t.questions.forEach(q => {
    if (!q || !lleno(q.q) || !Array.isArray(q.o)) return;
    const o = []; let c = -1;
    q.o.forEach((x, i) => { if (lleno(x)) { if (i === q.c) c = o.length; o.push(x); } });
    if (o.length >= 2 && c >= 0) out.push(Object.assign({}, q, { o, c }));
  });
  return out;
}
const tieneApuntes = t => !!(t && t.sections.some(x => lleno(x.body)));

/* ---- Abrir el tema desarrollado ---------------------------------------- */
const blobs = {};
function urlTema(t, ancla) {

  } else {
    base = CARPETA_TEMAS + (t.fileName || (t.id + "_estudio.html"));
  }
  return base + (ancla ? "#" + encodeURIComponent(ancla) : "");
}
/** Lleva al contenido: a tus apuntes si los hay; si el tema se importó como
    archivo y no tiene apuntes escritos aquí, abre el archivo original. */
let anclaPendiente = null;
function abrirTema(id, ancla) {

  if (tieneApuntes(t) || !t.html) { anclaPendiente = ancla || null; ir("#/tema/" + id + "/leer"); return; }
  window.open(urlTema(t, ancla), "_blank", "noopener");
}

/* ========================================================================
   Carga de contenido: archivos HTML con window.TEMARIO_DATA (mismo formato
   que los temas de estudio ya existentes) o JSON.
   ====================================================================== */
/** Acepta "B4T11", "IV.11", "iv-11"… y devuelve el id interno o null. */
function idValido(k, v) {
  const cand = [v && v.id, k, v && v.codigo, v && v.c].filter(Boolean).map(x => String(x).trim());
  for (const c of cand) {
    const u = c.toUpperCase();
    if (TEMA_POR_ID[u]) return u;
    const m = u.match(/^(I{1,3}|IV|V|VI)[.\-_ ]?(\d{1,2})$/);
    if (m && ID_POR_CODIGO[m[1] + "." + parseInt(m[2], 10)]) return ID_POR_CODIGO[m[1] + "." + parseInt(m[2], 10)];
  }
  // Por número de bloque y tema, si vienen sueltos.
  if (v && v.group && v.number) {
    const g = String(v.group).toUpperCase().replace(/^G/, "B");
    const id = g + "T" + String(v.number).padStart(2, "0");
    if (TEMA_POR_ID[id]) return id;
  }
  return null;
}
function normalizarTema(id, v, fileName, html) {
  const p = TEMA_POR_ID[id];
  const arr = x => Array.isArray(x) ? x : [];
  return {
    id, group:p.b, number:p.num,
    title: v.title || p.e, subtitle: v.subtitle || "",
    fileName: fileName || v.fileName || v.url || "",
    timeline: arr(v.timeline), glossary: arr(v.glossary), flashcards: arr(v.flashcards),
    // Se guardan también las preguntas a medio escribir (editor); las que no
    // están completas no entran en el test (ver qs()).
    questions: arr(v.questions).filter(q => q && typeof q === "object").map(q => Object.assign({}, q, { o:Array.isArray(q.o) ? q.o : [] })),
    sections: arr(v.sections),
    etiquetas: arr(v.etiquetas || v.tags).map(String).filter(x => x.trim()),
    mod: (v.mod && typeof v.mod === "object") ? Object.assign({}, v.mod) : {},
    html: html || v.html || null,
    cargado: v.cargado || new Date().toISOString()
  };
}
function datosATemas(datos, fileName, html) {
  const out = [], ignorados = [];
  for (const k in datos) {
    const v = datos[k];
    if (!v || typeof v !== "object") continue;
    const id = idValido(k, v);
    if (id) out.push(normalizarTema(id, v, fileName, html)); else ignorados.push(k);
  }
  return { out, ignorados };
}

/** Ejecuta el HTML en un iframe aislado (sin acceso a esta página) y recoge
    window.TEMARIO_DATA por postMessage. */
function leerHTMLTema(texto) {
  return new Promise((ok, ko) => {
    const testigo = "gestion-" + Math.random().toString(36).slice(2);
    const sonda = `<script>addEventListener("load",function(){setTimeout(function(){var d=null;try{d=JSON.parse(JSON.stringify(window.TEMARIO_DATA||window.GESTION_DATA||null));}catch(e){}parent.postMessage({testigo:${JSON.stringify(testigo)},datos:d},"*");},300);});<\/script>`;
    const ifr = document.createElement("iframe");
    ifr.setAttribute("sandbox", "allow-scripts");
    ifr.style.cssText = "position:absolute;left:-10000px;top:0;width:1px;height:1px;visibility:hidden";
    ifr.srcdoc = texto + sonda;
    let hecho = false;
    const fin = () => { hecho = true; window.removeEventListener("message", oir); clearTimeout(plazo); ifr.remove(); };
    const oir = e => {
      if (hecho || !e.data || e.data.testigo !== testigo) return;
      const d = e.data.datos;
      fin();
      if (!d || typeof d !== "object" || !Object.keys(d).length) ko(new Error("no contiene window.TEMARIO_DATA"));
      else ok(d);
    };
    const plazo = setTimeout(() => { if (!hecho) { fin(); ko(new Error("tiempo agotado al leer el archivo")); } }, 15000);
    window.addEventListener("message", oir);
    document.body.appendChild(ifr);
  });
}
function leerArchivo(f) {
  return new Promise((ok, ko) => { const r = new FileReader(); r.onerror = () => ko(new Error("no se pudo leer")); r.onload = () => ok(r.result); r.readAsText(f); });
}

async function procesarArchivos(lista) {
  const archivos = Array.from(lista || []);
  const validos = archivos.filter(f => /\.(html?|json)$/i.test(f.name));
  if (!validos.length) { toast("Suelta archivos .html (temas) o .json (copia o temas)", "error"); return; }
  let total = 0;
  for (const f of validos) {
    try {
      const texto = await leerArchivo(f);
      let datos, html = null;
      if (/\.json$/i.test(f.name)) {
        const j = JSON.parse(texto);
        if (j && j._format === FORMATO) { if (await importarCopia(j)) total += Object.keys(j.temas || {}).length; continue; }
        datos = (j && j.id && (j.glossary || j.flashcards || j.questions || j.timeline || j.sections)) ? { [j.id]: j } : j;
      } else {
        datos = await leerHTMLTema(texto);
        html = texto;
      }
      const { out, ignorados } = datosATemas(datos, f.name, html);
      for (const t of out) await guardarTema(t);
      total += out.length;
      if (out.length) toast(`✓ ${f.name}: ${out.map(t => codigoDe(t.id)).join(", ")}`);
      if (ignorados.length) toast(`${f.name}: ${ignorados.join(", ")} no corresponde a ningún tema del programa`, "error");
      if (!out.length && !ignorados.length) toast(`${f.name}: sin temas reconocibles`, "error");
    } catch (e) {
      toast(`✗ ${f.name}: ${e.message}`, "error");
    }
  }
  if (total) render();
}

function elegirArchivos() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".html,.htm,.json"; inp.multiple = true;
  inp.style.cssText = "position:fixed;left:-10000px";
  inp.addEventListener("change", () => { procesarArchivos(inp.files); setTimeout(() => inp.remove(), 500); });
  document.body.appendChild(inp);
  inp.click();
}
function activarDrop(el) {
  el.addEventListener("click", e => { if (e.target.closest("a,button")) return; elegirArchivos(); });
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); elegirArchivos(); } });
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("encima"); });
  el.addEventListener("dragleave", e => { if (!el.contains(e.relatedTarget)) el.classList.remove("encima"); });
  el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("encima"); procesarArchivos(e.dataTransfer && e.dataTransfer.files); });
}
// Soltar fuera de una zona de carga no debe abrir el archivo en el navegador.
["dragover", "drop"].forEach(ev => document.addEventListener(ev, e => { if (!e.target.closest || !e.target.closest(".drop")) e.preventDefault(); }));

/* ---- Copia completa (💾) ------------------------------------------------ */
async function exportarCopia() {
  const temas = {};
  Object.values(estado.temas).forEach(t => { temas[t.id] = t; });
  const datos = { _format:FORMATO, _version:2, _exportedAt:new Date().toISOString(), ajustes:{ progreso:prog.mapa }, temas };
  const url = URL.createObjectURL(new Blob([JSON.stringify(datos, null, 2)], { type:"application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = "gestion_hub_" + new Date().toISOString().slice(0, 10).replace(/-/g, "") + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 300);
  toast(`✓ Copia guardada: ${plural(Object.keys(temas).length, "tema")} + progreso`);
}
async function importarCopia(j, silencioso) {
  const n = Object.keys(j.temas || {}).length;
  if (!silencioso) {
    const fecha = j._exportedAt ? new Date(j._exportedAt).toLocaleString("es-ES") : "fecha desconocida";
    if (!confirm(`¿Importar la copia del ${fecha} con ${plural(n, "tema")}?\nSustituye los temas con el mismo número y el progreso de flashcards.`)) return false;
  }
  let ok = 0;
  for (const k in (j.temas || {})) {
    const v = j.temas[k];
    const id = idValido(k, v);
    if (!id) continue;
    /* Lo embebido en la página lleva la fecha de la copia, no la de ahora: si
       no, cada dispositivo que abriera la página por primera vez pisaría lo
       que se hubiera editado después en otro. */
    const marca = silencioso ? ms(j._exportedAt) || 1 : null;
    if (marca && estado.temas[id] && (estado.temas[id].modificado || 0) >= marca) continue;
    await guardarTema(normalizarTema(id, v, v.fileName, v.html), false, marca); ok++;
  }
  // Progreso: se suma al tuyo tarjeta a tarjeta (gana la marca más reciente).
  const pr = j.ajustes && j.ajustes.progreso;
  if (pr && typeof pr === "object") {
    for (const k in pr) { const v = pr[k], a = prog.mapa[k]; if (v && typeof v.m === "number" && (!a || v.m > a.m)) { prog.mapa[k] = v.d === undefined ? { s:!!v.s, m:v.m } : { s:!!v.s, m:v.m, d:v.d }; pend.prog[prog.duenno + "|" + k] = 1; } }
    guardarProg(); guardarPend(); programarSync();
  }
  // Copias de la primera versión: claves por posición.
  const v1 = j.ajustes && j.ajustes.fc && j.ajustes.fc.known;
  if (Array.isArray(v1)) v1.forEach(k => { const [id, i] = k.split(":"); const t = estado.temas[id]; const f = t && t.flashcards[parseInt(i, 10)]; if (f) marcarFc(claveFc(id, f), true); });
  if (!silencioso) toast(`✓ Importados ${plural(ok, "tema")}`);
  return true;
}
async function cargarEmbebidos() {
  const el = document.getElementById("datos-embebidos");
  const txt = el ? el.textContent.trim() : "";
  if (!txt) return;
  try {
    let j = JSON.parse(txt);
    if (j._format !== FORMATO) return;
    const sello = j._exportedAt || "sin-fecha";
    if (localStorage.getItem(KEY_EMBED) === sello) return;
    // El progreso es de cada persona: lo embebido en la página no lo trae.
    j = Object.assign({}, j, { ajustes:null });
    await importarCopia(j, true);
    localStorage.setItem(KEY_EMBED, sello);
  } catch (e) { console.warn("Datos embebidos:", e); }
}

/* ---- Buscar temas publicados junto a la página ------------------------- */
async function buscarEnServidor() {
  if (!/^https?:$/.test(location.protocol)) { toast("Solo funciona con la página publicada (http/https)", "error"); return; }
  const btn = document.getElementById("btn-servidor");
  btn.classList.add("girando"); btn.disabled = true;
  let hallados = 0, cursor = 0;
  const lista = TEMAS.map(t => t.id);
  async function trabajador() {
    while (cursor < lista.length) {
      const id = lista[cursor++];
      try {
        const r = await fetch(CARPETA_TEMAS + id + "_estudio.html", { cache:"no-cache" });
        if (!r.ok) continue;
        const texto = await r.text();
        if (!/TEMARIO_DATA|GESTION_DATA/.test(texto)) continue;
        const { out } = datosATemas(await leerHTMLTema(texto), id + "_estudio.html", null);
        for (const t of out) { await guardarTema(t); hallados++; }
      } catch (_) {}
    }
  }
  await Promise.all(Array.from({ length:6 }, trabajador));
  btn.classList.remove("girando"); btn.disabled = false;
  toast(hallados ? `✓ ${plural(hallados, "tema")} cargado${hallados === 1 ? "" : "s"} desde ${CARPETA_TEMAS}` : `No hay temas publicados en ${CARPETA_TEMAS}`, hallados ? "" : "error");
  if (hallados) render();
}

/* ---- Editor del tema ----------------------------------------------------
   Se escribe directamente en el hub. Cada cambio se guarda solo (600 ms
   después de dejar de teclear) y entra en la cola de sincronización. Lo que
   esté a medias también se guarda; solo lo completo pasa a mazos y tests. */
const ED_TABS = [
  { id:"apuntes",  txt:"📝 Apuntes",     arr:"sections"   },
  { id:"glosario", txt:"📖 Glosario",    arr:"glossary"   },
  { id:"crono",    txt:"📅 Cronología",  arr:"timeline"   },
  { id:"fc",       txt:"🎴 Flashcards",  arr:"flashcards" },
  { id:"test",     txt:"❓ Test",        arr:"questions"  }
];
const ED = { id:null, t:null, tab:"apuntes", timer:null, tocado:new Set() };
const idApartado = () => "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const NUEVO = {
  apuntes:  () => ({ id:idApartado(), title:"", body:"", nivel:1 }),
  glosario: () => ({ t:"", d:"", cat:"" }),
  crono:    () => ({ y:"", txt:"", cons:"", cat:"" }),
  fc:       () => ({ q:"", a:"", cat:"" }),
  test:     () => ({ q:"", o:["", "", "", ""], c:0, e:"" })
};
function temaVacio(t) {
  return !t.sections.some(x => lleno(x.title) || lleno(x.body)) && !lleno(t.subtitle) && !(t.etiquetas || []).length && !t.glossary.length && !t.timeline.length && !t.flashcards.length && !t.questions.length;
}
function edGuardarLuego() {
  clearTimeout(ED.timer);
  ED.timer = setTimeout(edGuardarYa, 600);
  const e = document.getElementById("ed-estado"); if (e) e.textContent = "Guardando…";
}
/** Guarda ya lo pendiente del editor (al salir, al cambiar de pestaña…). */
function edGuardarYa() {
  if (!ED.timer) return;
  clearTimeout(ED.timer); ED.timer = null;
  if (!ED.t) return;
  // Un tema que solo se ha abierto en el editor, sin escribir nada, no se crea.
  if (!estado.temas[ED.id] && temaVacio(ED.t)) return;
  /* Si mientras escribías llegó otra versión del tema (de otro dispositivo),
     se guardan solo las partes que has tocado aquí encima de esa versión:
     glosario en un móvil y apuntes en otro se combinan en vez de pisarse. */
  const actual = estado.temas[ED.id];
  if (actual && (actual.modificado || 0) > (ED.base || 0)) {
    const mezcla = JSON.parse(JSON.stringify(actual));
    ED.tocado.forEach(k => { mezcla[k] = ED.t[k]; });
    ED.t = mezcla;
  }
  const partes = [...ED.tocado];
  ED.tocado.clear();
  const t = ED.t;
  const guardado = guardarTema(t, false, null, partes);
  ED.base = t.modificado;         // guardarTema la sella antes de su primer await
  guardado.then(() => {
    const e = document.getElementById("ed-estado");
    if (e) e.textContent = "Guardado ✓";
  });
}
/** Repinta salvo que estés escribiendo en el editor: entonces espera. */
/** Llega algo de otro dispositivo. Nunca interrumpe: si estás escribiendo,
    en un test o con un panel abierto, se actualiza lo justo (barras, marcas,
    resaltados) y el repintado completo espera a que termines. */
const panelAbierto = () => { const p = document.getElementById("panel"); return !!(p && !p.hidden); };
function repintar() {
  const r = ruta(), a = document.activeElement;
  const escribiendo = !!(a && a.closest && a.closest("#vista, #panel") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  const cambioTemas = S.cambioTemas; S.cambioTemas = false;
  if (r.v === "leer") {
    refrescarLectura(); pintarResaltados(ESTUDIO.id);
    if (cambioTemas) { if (panelAbierto() || escribiendo) S.renderPendiente = true; else render(); }
    return;
  }
  const enTest = Object.values(hubLocal).some(h => h.test);
  if (escribiendo || panelAbierto() || enTest) { S.renderPendiente = true; return; }
  render();
}
document.addEventListener("focusout", () => setTimeout(() => {
  const a = document.activeElement;
  if (S.renderPendiente && !panelAbierto() && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render();
}, 0));
window.addEventListener("pagehide", edGuardarYa);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") edGuardarYa(); });
