<!-- Tema antes del primer pintado. Comparte la clave con Niblo: si alli esta
     en oscuro, aqui tambien. -->
<script>
(function(){
  try {
    var t = localStorage.getItem('recetas:tema');
    if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t);
  } catch (e) {}
})();
</script>

<link rel="preload" href="manrope.woff2" as="font" type="font/woff2" crossorigin>
<style>

  font-family:"Manrope"; font-style:normal; font-weight:300 800; font-display:swap;
  src:url("manrope.woff2") format("woff2");
}
</style>

<style>
/* ========================================================================
   Sistema de diseño — el de Viajes: paleta slate/azul, Manrope única,
   tarjetas redondeadas, chips en pastilla y cabecera translúcida.
   ====================================================================== */
:root {
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.03);
  --sh-2:0 2px 10px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-3:0 12px 28px rgba(0,0,0,.10);
  --font-ui:'Manrope', system-ui, -apple-system, sans-serif;
  --font-titulo:'Manrope', system-ui, -apple-system, sans-serif;
  --font-code:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root, :root[data-tema="claro"] {
  --bg:#f8fafc; --bg-elev:#fff; --bg-soft:#f1f5f9; --bg-input:#fff;
  --text:#0f172a; --text-muted:#64748b; --text-inv:#fff;
  --line:#e2e8f0; --line-soft:#f1f5f9;
  --accent:#2563eb; --accent-2:#06b6d4; --accent-bg:#dbeafe;
  --focus:#2563eb; --danger:#dc2626;
  /* Semáforo del PDF: verde (solo BOE + estable), ámbar (solo BOE + revisar),
     rojo (actualizar), lila (sin correlato en el TAC) */
  --ok:#059669; --ok-bg:#dcfce7;
  --warn:#b45309; --warn-bg:#fef3c7;
  --hot:#b91c1c; --hot-bg:#fee2e2;
  --lila:#7c3aed; --lila-bg:#ede9fe;
  --azul:#1d4ed8; --azul-bg:#dbeafe;
}
:root[data-tema="oscuro"] {
  --bg:#0b1220; --bg-elev:#111a2e; --bg-soft:#1e293b; --bg-input:#111a2e;
  --text:#f1f5f9; --text-muted:#94a3b8; --text-inv:#0b1220;
  --line:#334155; --line-soft:#1e293b;
  --accent:#60a5fa; --accent-2:#22d3ee; --accent-bg:#1e3a5f;
  --focus:#93c5fd; --danger:#f87171;
  --ok:#34d399; --ok-bg:#064e3b;
  --warn:#fbbf24; --warn-bg:#4a3510;
  --hot:#fca5a5; --hot-bg:#4c1d1d;
  --lila:#c4b5fd; --lila-bg:#2e1f5e;
  --azul:#93c5fd; --azul-bg:#1e3a5f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]) {
    --bg:#0b1220; --bg-elev:#111a2e; --bg-soft:#1e293b; --bg-input:#111a2e;
    --text:#f1f5f9; --text-muted:#94a3b8; --text-inv:#0b1220;
    --line:#334155; --line-soft:#1e293b;
    --accent:#60a5fa; --accent-2:#22d3ee; --accent-bg:#1e3a5f;
    --focus:#93c5fd; --danger:#f87171;
    --ok:#34d399; --ok-bg:#064e3b;
    --warn:#fbbf24; --warn-bg:#4a3510;
    --hot:#fca5a5; --hot-bg:#4c1d1d;
    --lila:#c4b5fd; --lila-bg:#2e1f5e;
    --azul:#93c5fd; --azul-bg:#1e3a5f;
  }
}

/* ---- Color por bloque (solo el acento: el resto del sistema no cambia) -- */
[data-b="B1"] { --accent:#2563eb; --accent-2:#3b82f6; --accent-bg:#dbeafe; }
[data-b="B2"] { --accent:#4f46e5; --accent-2:#6366f1; --accent-bg:#e0e7ff; }
[data-b="B3"] { --accent:#0d9488; --accent-2:#14b8a6; --accent-bg:#ccfbf1; }
[data-b="B4"] { --accent:#7c3aed; --accent-2:#a855f7; --accent-bg:#ede9fe; }
[data-b="B5"] { --accent:#c2410c; --accent-2:#f97316; --accent-bg:#ffedd5; }
[data-b="B6"] { --accent:#be123c; --accent-2:#f43f5e; --accent-bg:#ffe4e6; }
:root[data-tema="oscuro"] [data-b="B1"] { --accent:#60a5fa; --accent-2:#93c5fd; --accent-bg:#1e3a5f; }
:root[data-tema="oscuro"] [data-b="B2"] { --accent:#818cf8; --accent-2:#a5b4fc; --accent-bg:#272b5e; }
:root[data-tema="oscuro"] [data-b="B3"] { --accent:#2dd4bf; --accent-2:#5eead4; --accent-bg:#123b3a; }
:root[data-tema="oscuro"] [data-b="B4"] { --accent:#c084fc; --accent-2:#d8b4fe; --accent-bg:#2e1f5e; }
:root[data-tema="oscuro"] [data-b="B5"] { --accent:#fb923c; --accent-2:#fdba74; --accent-bg:#45260f; }
:root[data-tema="oscuro"] [data-b="B6"] { --accent:#fb7185; --accent-2:#fda4af; --accent-bg:#4a1525; }
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]) [data-b="B1"] { --accent:#60a5fa; --accent-2:#93c5fd; --accent-bg:#1e3a5f; }
  :root:not([data-tema]) [data-b="B2"] { --accent:#818cf8; --accent-2:#a5b4fc; --accent-bg:#272b5e; }
  :root:not([data-tema]) [data-b="B3"] { --accent:#2dd4bf; --accent-2:#5eead4; --accent-bg:#123b3a; }
  :root:not([data-tema]) [data-b="B4"] { --accent:#c084fc; --accent-2:#d8b4fe; --accent-bg:#2e1f5e; }
  :root:not([data-tema]) [data-b="B5"] { --accent:#fb923c; --accent-2:#fdba74; --accent-bg:#45260f; }
  :root:not([data-tema]) [data-b="B6"] { --accent:#fb7185; --accent-2:#fda4af; --accent-bg:#4a1525; }
}

* { box-sizing:border-box; }
html, body { margin:0; padding:0; overflow-x:clip; }
html { -webkit-text-size-adjust:100%; }
body {
  font-family:var(--font-ui); background:var(--bg); color:var(--text);
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  padding-bottom:env(safe-area-inset-bottom);
}
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; }
.num { font-feature-settings:"tnum","ss01"; }
.muted { color:var(--text-muted); }
[hidden] { display:none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* ---- Cabecera ---------------------------------------------------------- */
header.topbar {
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line-soft);
  padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top));
}
.topbar-inner { max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:10px; }
.topbar-title {
  font-weight:700; letter-spacing:-.02em; font-size:17px;
  min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.topbar-spacer { flex:1; }
.icon-btn {
  border:1px solid var(--line); background:var(--bg-elev); color:var(--text);
  width:38px; height:38px; border-radius:var(--r-md); flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
  text-decoration:none;
}
.icon-btn:hover { transform:translateY(-1px); box-shadow:var(--sh-2); text-decoration:none; }
.icon-btn svg { width:18px; height:18px; }
.icon-btn.girando svg { animation:girar 1s linear infinite; }
@keyframes girar { to { transform:rotate(360deg); } }

main {
  max-width:1100px; margin:0 auto; padding:16px 16px 64px; width:100%;
  overflow-x:clip; animation:fadeIn .18s var(--ease);
}
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

/* ---- Tipografía de vista ---------------------------------------------- */
.titulo-grande {
  font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1.12;
  margin:10px 0 6px; padding-bottom:.08em;
  background-image:linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, #000 30%) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  overflow-wrap:break-word;
}
:root[data-tema="oscuro"] .titulo-grande {
  background-image:linear-gradient(135deg, color-mix(in srgb, var(--accent) 80%, #fff 20%) 0%, var(--accent) 100%);
}
@media (min-width:720px) { .titulo-grande { font-size:46px; letter-spacing:-.035em; } }
.view-sub { color:var(--text-muted); font-size:14px; margin:0 0 20px; }
h2.section-title { font-weight:700; letter-spacing:-.02em; font-size:20px; margin:32px 0 12px; }
h3.card-title { font-size:16px; font-weight:700; letter-spacing:-.01em; margin:0 0 10px; }

/* ---- Botones ----------------------------------------------------------- */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:42px; padding:0 18px; border:1px solid var(--line); background:var(--bg-elev); color:var(--text);
  border-radius:var(--r-pill); font-weight:600; font-size:14px; letter-spacing:-.01em;
  cursor:pointer; text-decoration:none;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
}
.btn:hover { transform:translateY(-1px); box-shadow:var(--sh-2); text-decoration:none; }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
.btn-primary {
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border:none;
  box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 28%, transparent);
}
.btn-sm { height:32px; padding:0 12px; font-size:13px; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; }

/* ---- Chips y segmentado ------------------------------------------------ */
.chip-row {
  display:flex; gap:8px; overflow-x:auto; padding:2px; margin:0 -2px 16px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.chip-row::-webkit-scrollbar { display:none; }
.chip-row.wrap { flex-wrap:wrap; overflow:visible; }
.chip {
  flex-shrink:0; display:inline-flex; align-items:center; gap:7px;
  height:34px; padding:0 14px; background:var(--bg-elev); border:1px solid var(--line); color:var(--text-muted);
  border-radius:var(--r-pill); font-size:13px; font-weight:600; cursor:pointer;
  transition:all .18s var(--ease); white-space:nowrap;
}
.chip:hover { color:var(--text); }
.chip.active {
  background:var(--accent); border-color:var(--accent); color:#fff;
  box-shadow:0 4px 12px color-mix(in srgb, var(--accent) 22%, transparent);
}
.chip .badge {
  font-size:11px; font-weight:600; font-feature-settings:"tnum";
  background:color-mix(in srgb, var(--text) 8%, transparent); padding:2px 7px; border-radius:var(--r-pill);
}
.chip.active .badge { background:rgba(255,255,255,.22); color:#fff; }
.chip.peq { height:28px; padding:0 11px; font-size:12px; }

.seg {
  display:flex; gap:2px; padding:3px; margin:0 0 20px;
  background:var(--bg-soft); border:1px solid var(--line); border-radius:var(--r-pill);
}
.seg button {
  flex:1; min-width:0; border:none; background:transparent; color:var(--text-muted);
  font-size:14px; font-weight:600; min-height:40px; border-radius:var(--r-pill); cursor:pointer;
  transition:background .15s, color .15s;
}
.seg button.on { background:var(--bg-elev); color:var(--text); box-shadow:var(--sh-1); }

/* ---- Etiquetas (vigencia, fuente, bloque) ------------------------------ */
.tag {
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  padding:3px 9px; border-radius:var(--r-pill); line-height:1.3;
  background:var(--bg-soft); color:var(--text-muted);
}
.tag.ok   { background:var(--ok-bg);   color:var(--ok); }
.tag.warn { background:var(--warn-bg); color:var(--warn); }
.tag.hot  { background:var(--hot-bg);  color:var(--hot); }
.tag.lila { background:var(--lila-bg); color:var(--lila); }
.tag.azul { background:var(--azul-bg); color:var(--azul); }
.tag.acc  { background:var(--accent-bg); color:var(--accent); }
.tags { display:flex; flex-wrap:wrap; gap:6px; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.hot { background:var(--hot); }

/* ---- Tarjetas ---------------------------------------------------------- */
.card {
  background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--sh-1); padding:20px; min-width:0;
}
.card + .card { margin-top:14px; }
/* En rejilla el hueco lo pone gap, no el margen de apilado */
.grid > .card, .ficha > .card { margin-top:0; }
.card.interactive { cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s var(--ease); }
.card.interactive:hover { transform:translateY(-2px); box-shadow:var(--sh-2); }

/* Hero del inicio */
.hero { padding:22px 20px; }
.prog-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.prog-row .lbl { font-size:13px; font-weight:600; color:var(--text-muted); }
.bar { flex:1; min-width:160px; height:8px; background:var(--bg-soft); border-radius:99px; overflow:hidden; }
.bar > div { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:99px; transition:width .4s var(--ease); }
.prog-row .pct { font-weight:800; font-size:18px; color:var(--accent); font-feature-settings:"tnum"; }
.kpis { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-top:16px; }
@media (min-width:720px) { .kpis { grid-template-columns:repeat(4, minmax(0,1fr)); } }
.kpi { background:var(--bg-soft); border-radius:var(--r-md); padding:12px 14px; min-width:0; }
.kpi .k { font-size:11.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; display:flex; align-items:center; gap:6px; }
.kpi .v { font-size:24px; font-weight:800; letter-spacing:-.02em; font-feature-settings:"tnum"; }
.kpi .s { font-size:12px; color:var(--text-muted); }

/* Rejillas */
.grid { display:grid; gap:16px; grid-template-columns:minmax(0,1fr); }
@media (min-width:720px) { .grid.g2 { grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (min-width:720px) { .grid.g3 { grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (min-width:1000px) { .grid.g3 { grid-template-columns:repeat(3, minmax(0,1fr)); } }

/* Tarjeta de bloque */
.bloque-card { display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden; }
.bloque-card::before {
  content:""; position:absolute; inset:0 0 auto 0; height:4px;
  background:linear-gradient(90deg, var(--accent), var(--accent-2));
}
.bloque-cab { display:flex; align-items:center; gap:12px; }
.bloque-rom {
  width:48px; height:48px; border-radius:var(--r-md); flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--accent-bg); color:var(--accent); font-weight:800; font-size:18px; letter-spacing:-.02em;
}
.bloque-nombre { font-weight:700; font-size:18px; letter-spacing:-.02em; line-height:1.25; }
.bloque-sub { font-size:12.5px; color:var(--text-muted); font-weight:600; }
.mini-stats { display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--text-muted); }
.mini-stats b { color:var(--text); font-size:15px; font-feature-settings:"tnum"; margin-right:3px; }
.semaforo { display:flex; height:6px; border-radius:99px; overflow:hidden; background:var(--bg-soft); }
.semaforo span { display:block; height:100%; }
.bloque-pie { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto; padding-top:4px; }
.ir { font-weight:700; font-size:14px; color:var(--accent); }

/* CTA (hub global, guía) */
.cta { display:flex; align-items:center; gap:16px; }
.cta-ico {
  width:52px; height:52px; border-radius:var(--r-md); flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center; font-size:26px;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff;
}
.cta-ico.suave { background:var(--accent-bg); }
.cta-t { font-weight:700; font-size:17px; letter-spacing:-.02em; }
.cta-d { font-size:13.5px; color:var(--text-muted); }

/* Cabecera de bloque */
.bloque-head { display:flex; align-items:center; gap:14px; margin:6px 0 18px; }
.bloque-head .bloque-rom { width:56px; height:56px; font-size:20px; }
.bloque-head h1 { margin:0; font-size:24px; font-weight:700; letter-spacing:-.025em; line-height:1.2; }
@media (min-width:720px) { .bloque-head h1 { font-size:30px; } }

/* Tarjeta de tema */
.tema-card { display:flex; flex-direction:column; gap:10px; }
.tema-cab { display:flex; align-items:baseline; gap:10px; }
.tema-cod { font-weight:800; font-size:22px; letter-spacing:-.03em; color:var(--accent); font-feature-settings:"tnum"; }
.tema-estado { margin-left:auto; }
.tema-epi { font-weight:600; font-size:15px; line-height:1.35; letter-spacing:-.01em; }
.tema-stats { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--text-muted); }
.tema-stats b { color:var(--text); font-feature-settings:"tnum"; }
.tema-card.pendiente { background:color-mix(in srgb, var(--bg-soft) 55%, var(--bg-elev)); }
.tema-card.pendiente .tema-epi { color:var(--text); }
.tema-card.lila-borde { box-shadow:inset 4px 0 0 var(--lila), var(--sh-1); }
.prog-mini { display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-muted); font-weight:600; }

/* Detalle del tema */
.ficha { display:grid; gap:14px; grid-template-columns:minmax(0,1fr); }
@media (min-width:860px) { .ficha { grid-template-columns:repeat(2, minmax(0,1fr)); } .ficha .ancho { grid-column:1 / -1; } }
.ficha-k {
  font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-muted); margin:0 0 8px; display:flex; align-items:center; gap:8px;
}
.ficha-v { font-size:15px; line-height:1.55; overflow-wrap:break-word; }
.ficha-v a { font-weight:600; }
.verif {
  font-size:11px; font-weight:700; color:var(--warn); background:var(--warn-bg);
  padding:1px 6px; border-radius:var(--r-pill); white-space:nowrap; cursor:help;
}
.nota-destacada { border-left:4px solid var(--accent); background:color-mix(in srgb, var(--accent-bg) 45%, var(--bg-elev)); }
.secciones { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.secciones button {
  width:100%; text-align:left; border:none; background:transparent; cursor:pointer;
  padding:9px 10px; border-radius:var(--r-sm); font-size:14px; color:var(--text);
}
.secciones button:hover { background:var(--bg-soft); }
.secciones .sub { padding-left:26px; color:var(--text-muted); font-size:13.5px; }

/* Zona de carga */
.drop {
  border:2px dashed var(--line); border-radius:var(--r-lg); padding:26px 18px; text-align:center;
  background:var(--bg-elev); cursor:pointer; transition:border-color .18s, background .18s;
}
.drop:hover, .drop.encima { border-color:var(--accent); background:color-mix(in srgb, var(--accent-bg) 40%, var(--bg-elev)); }
.drop .ico { font-size:28px; }
.drop .t { font-weight:700; margin-top:6px; }
.drop .s { font-size:13px; color:var(--text-muted); margin-top:4px; }
code, .code { font-family:var(--font-code); font-size:.86em; background:var(--bg-soft); padding:1px 6px; border-radius:6px; }
.cargados { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; }
.cargado {
  display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 11px;
  background:var(--bg-soft); border:1px solid var(--line); border-radius:var(--r-pill); font-size:12.5px; font-weight:600;
}
.cargado button {
  width:22px; height:22px; border-radius:50%; border:none; cursor:pointer;
  background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger); font-weight:700; line-height:1;
}

/* ---- Hub: búsqueda, cronología, glosario, flashcards, test, progreso ---- */
.toolbar { margin-bottom:12px; }
.input {
  width:100%; min-width:0; border:1px solid var(--line); background:var(--bg-input); color:var(--text);
  border-radius:var(--r-md); padding:11px 14px; font-size:16px;
  transition:border .18s, box-shadow .18s;
}
.input:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.stats-line { font-size:12.5px; color:var(--text-muted); font-weight:600; margin:0 0 10px; }
.res {
  padding:12px 14px; border:1px solid var(--line-soft); border-radius:var(--r-md);
  background:var(--bg-elev); margin-bottom:8px; cursor:pointer; transition:border-color .15s, box-shadow .15s;
}
.res:hover { border-color:var(--line); box-shadow:var(--sh-1); }
.res-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.res-tit { font-weight:700; font-size:14.5px; letter-spacing:-.01em; }
.res-txt { font-size:13.5px; color:var(--text-muted); margin-top:4px; line-height:1.5; }
mark { background:color-mix(in srgb, #facc15 45%, transparent); color:inherit; border-radius:3px; padding:0 1px; }

.tl { position:relative; padding-left:18px; }
.tl::before { content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line); border-radius:2px; }
.tl-item { position:relative; padding:10px 12px; margin-bottom:8px; border-radius:var(--r-md); background:var(--bg-elev); border:1px solid var(--line-soft); cursor:pointer; }
.tl-item::before { content:""; position:absolute; left:-17px; top:16px; width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--bg); }
.tl-y { font-weight:800; color:var(--accent); font-feature-settings:"tnum"; margin-right:8px; }
.tl-cons { font-size:13px; color:var(--text-muted); margin-top:3px; }

.letras { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px; }
.letra {
  min-width:32px; height:32px; padding:0 8px; border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--bg-elev); font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-muted);
}
.letra.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.letra:disabled { opacity:.3; cursor:default; }

.fc-ctrl { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:12px; font-size:13px; color:var(--text-muted); }
.fc-ctrl b { color:var(--text); font-feature-settings:"tnum"; }
.fc { perspective:1200px; cursor:pointer; margin:6px 0 14px; }
.fc-in { position:relative; min-height:230px; transition:transform .5s var(--ease); transform-style:preserve-3d; }
.fc.volteada .fc-in { transform:rotateY(180deg); }
.fc-cara {
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:var(--r-lg); padding:24px 22px; display:flex; flex-direction:column; justify-content:center; gap:10px;
  border:1px solid var(--line); background:var(--bg-elev); box-shadow:var(--sh-2); overflow:auto;
}
.fc-cara.atras { transform:rotateY(180deg); background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border:none; }
.fc-q { font-size:19px; font-weight:700; letter-spacing:-.015em; line-height:1.35; }
.fc-a { font-size:16px; line-height:1.55; }
.fc-hint { font-size:12px; color:var(--text-muted); }
.fc-btns { display:flex; gap:10px; }
.fc-btns .btn { flex:1; }
.btn-no { color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn-si { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); }

.test-cfg { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.test-cfg select { border:1px solid var(--line); background:var(--bg-input); border-radius:var(--r-md); padding:8px 12px; font-size:15px; }
.q-meta { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--text-muted); font-weight:600; margin-bottom:8px; }
.q-txt { font-size:17px; font-weight:700; line-height:1.4; letter-spacing:-.01em; margin-bottom:14px; }
.q-opts { display:flex; flex-direction:column; gap:8px; }
.q-opt {
  display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
  padding:12px 14px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--bg-elev);
  cursor:pointer; font-size:15px; line-height:1.4; transition:border-color .15s, background .15s;
}
.q-opt:hover:not(:disabled) { border-color:var(--accent); }
.q-opt .l {
  width:26px; height:26px; border-radius:50%; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
  background:var(--bg-soft); font-weight:800; font-size:13px;
}
.q-opt.bien { border-color:var(--ok); background:var(--ok-bg); }
.q-opt.mal  { border-color:var(--danger); background:var(--hot-bg); }
.q-opt:disabled { cursor:default; }
.q-fb { margin-top:12px; padding:12px 14px; border-radius:var(--r-md); font-size:14px; line-height:1.5; }
.q-fb.bien { background:var(--ok-bg); color:var(--text); }
.q-fb.mal  { background:var(--hot-bg); color:var(--text); }
.resultado { text-align:center; padding:12px 0; }
.resultado .big { font-size:56px; font-weight:800; letter-spacing:-.04em; color:var(--accent); font-feature-settings:"tnum"; }

table.tabla { width:100%; border-collapse:collapse; font-size:13.5px; }
.tabla th { text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); padding:8px 8px; border-bottom:2px solid var(--line); }
.tabla td { padding:9px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
.tabla td.n, .tabla th.n { text-align:right; font-feature-settings:"tnum"; white-space:nowrap; }
.tabla tr.clic { cursor:pointer; }
.tabla tr.clic:hover td { background:var(--bg-soft); }
.tabla-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* Guía */
.guia p, .guia li { font-size:14.5px; line-height:1.6; }
.guia ul { padding-left:20px; margin:8px 0; }
.guia li { margin-bottom:6px; }
.guia .tabla td { font-size:13.5px; }
.lista-temas { display:flex; flex-wrap:wrap; gap:5px; }
.lista-temas button {
  border:1px solid var(--line); background:var(--bg-elev); border-radius:var(--r-pill);
  padding:3px 10px; font-size:12.5px; font-weight:700; cursor:pointer; font-feature-settings:"tnum";
}
.lista-temas button:hover { border-color:var(--accent); color:var(--accent); }
pre.formato {
  font-family:var(--font-code); font-size:12px; line-height:1.5; background:var(--bg-soft);
  border-radius:var(--r-md); padding:14px; overflow-x:auto; margin:8px 0 0;
}

/* Vacío */
.empty { text-align:center; padding:40px 20px; color:var(--text-muted); }
.empty .ico {
  display:inline-flex; align-items:center; justify-content:center; width:60px; height:60px;
  border-radius:50%; background:var(--bg-soft); font-size:26px; margin-bottom:12px;
}
.empty h3 { color:var(--text); font-weight:700; margin:4px 0; font-size:16px; }
.empty p { margin:0 auto; font-size:14px; max-width:340px; }

/* Toast */
.toast-box {
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  z-index:100; pointer-events:none; display:flex; flex-direction:column; gap:8px; align-items:center;
  width:max-content; max-width:calc(100vw - 32px);
}
.toast {
  background:var(--text); color:var(--text-inv); padding:10px 16px; border-radius:var(--r-pill);
  font-size:14px; box-shadow:var(--sh-3); animation:toastIn .25s var(--ease); text-align:center;
}
.toast.error { background:var(--danger); color:#fff; }
@keyframes toastIn { from { transform:translateY(20px); opacity:0; } to { transform:none; opacity:1; } }

/* Estado de sincronización (como la píldora de Viajes) */
.sync-pill {
  display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px; flex-shrink:0;
  border:1px solid var(--line); background:var(--bg-elev); border-radius:var(--r-pill);
  font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; white-space:nowrap;
}
.sync-pill .dot { width:8px; height:8px; background:var(--text-muted); }
.sync-pill[data-estado="vivo"] .dot { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.sync-pill[data-estado="ok"] .dot { background:var(--ok); }
.sync-pill[data-estado="sync"] .dot { background:var(--accent); animation:latido 1s ease-in-out infinite; }
.sync-pill[data-estado="offline"] .dot { background:var(--warn); }
.sync-pill[data-estado="error"] .dot, .sync-pill[data-estado="sesion"] .dot { background:var(--danger); }
.sync-pill[data-estado="error"], .sync-pill[data-estado="sesion"] { color:var(--danger); }
@keyframes latido { 50% { opacity:.35; } }
@media (max-width:560px) {
  .sync-pill { width:38px; height:38px; padding:0; justify-content:center; border-radius:var(--r-md); }
  .sync-pill .t { display:none; }
}

/* Banner de búsqueda en el servidor */
.banner {
  display:flex; align-items:center; gap:12px; padding:12px 16px; margin-bottom:14px;
  border-radius:var(--r-md); background:var(--accent-bg); color:var(--text); font-size:14px;
}
.banner .bar { min-width:80px; max-width:200px; }
</style>

function leerJSON(k, def) { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? def : v; } catch (_) { return def; } }
function escribirJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }

const pend = Object.assign({ temas:{}, prog:{} }, leerJSON(KEY_PEND, {}));
const borrados = leerJSON(KEY_BORR, {});
function guardarPend() { escribirJSON(KEY_PEND, pend); escribirJSON(KEY_BORR, borrados); pintarSync(); }

/* ---- Progreso de flashcards (por persona) ------------------------------
   Cada tarjeta se identifica por el tema y un resumen de su pregunta, no por
   su posición: si el tema se edita y las tarjetas cambian de orden, lo que
   ya sabías sigue marcado. Valor: { s: sabida, m: ms de la última marca }. */
const prog = { duenno:"local", mapa:{} };
function hashCorto(txt) {
  let h = 0x811c9dc5;
  const s = String(txt || "").trim();
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36);
}
function claveFc(id, f) { return id + ":" + hashCorto(f && f.q); }
function sabida(k) { const v = prog.mapa[k]; return !!(v && v.s); }
function sabidasDe(t) { return t.flashcards.filter(f => sabida(claveFc(t.id, f))).length; }
function guardarProg() { escribirJSON(KEY_PROG + prog.duenno, prog.mapa); }
function marcarFc(k, valor) {
  prog.mapa[k] = { s:!!valor, m:Date.now() };
  guardarProg();
  pend.prog[prog.duenno + "|" + k] = 1; guardarPend();
  programarSync();
}
/** Carga el progreso de quien tenga la sesión. Lo marcado sin sesión se
    suma al de la primera persona que entre (y se sube). */
function cargarProgreso(uid) {
  const duenno = uid || "local";
  prog.duenno = duenno;
  prog.mapa = leerJSON(KEY_PROG + duenno, {});
  if (uid) {
    const local = leerJSON(KEY_PROG + "local", null);
    if (local && Object.keys(local).length) {
      for (const k in local) {
        const a = prog.mapa[k];
        if (!a || local[k].m > a.m) { prog.mapa[k] = local[k]; pend.prog[uid + "|" + k] = 1; }
      }
      Object.keys(pend.prog).forEach(pk => { if (pk.startsWith("local|")) delete pend.prog[pk]; });
      try { localStorage.removeItem(KEY_PROG + "local"); } catch (_) {}
      guardarProg(); guardarPend();
    }
  }
}
/** Progreso de la primera versión del hub (claves por posición). */
function migrarProgresoV1() {
  const v1 = leerJSON(KEY_AJUSTES_V1, null);
  if (!v1 || !v1.fc || !Array.isArray(v1.fc.known)) return;
  v1.fc.known.forEach(k => {
    const [id, i] = k.split(":");
    const t = estado.temas[id];
    const f = t && t.flashcards[parseInt(i, 10)];
    if (f && !sabida(claveFc(id, f))) marcarFc(claveFc(id, f), true);
  });
  try { localStorage.removeItem(KEY_AJUSTES_V1); } catch (_) {}
}

/* ---- IndexedDB ---------------------------------------------------------- */
let db = null;
function abrirDB() {
  return new Promise((ok, ko) => {
    const r = indexedDB.open(DB_NOMBRE, 1);
    r.onerror = () => ko(r.error);
    r.onsuccess = () => { db = r.result; ok(db); };
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains("temas")) d.createObjectStore("temas", { keyPath:"id" });
    };
  });
}
function dbTodos() {
  return new Promise((ok, ko) => {
    if (!db) return ok({});
    const out = {};
    const tx = db.transaction("temas", "readonly");
    tx.objectStore("temas").openCursor().onsuccess = e => {
      const c = e.target.result;
      if (c) { out[c.key] = c.value; c.continue(); } else ok(out);
    };
    tx.onerror = () => ko(tx.error);
  });
}
function dbPut(obj) {
  return new Promise((ok, ko) => {
    if (!db) return ok();
    const tx = db.transaction("temas", "readwrite");
    tx.objectStore("temas").put(obj);
    tx.oncomplete = ok; tx.onerror = () => ko(tx.error);
  });
}
function dbBorrar(id) {
  return new Promise((ok, ko) => {
    if (!db) return ok();
    const tx = db.transaction("temas", "readwrite");
    tx.objectStore("temas").delete(id);
    tx.oncomplete = ok; tx.onerror = () => ko(tx.error);
  });
}
/* Los mazos de flashcards se rehacen al cambiar el contenido. */
function olvidarMazos() { Object.keys(hubLocal).forEach(k => { hubLocal[k].mazo = null; hubLocal[k].test = null; }); }
function olvidarBlob(id) { if (blobs[id]) { URL.revokeObjectURL(blobs[id]); delete blobs[id]; } }

/** Guarda un tema. Si viene de una acción tuya (no de la bajada) se sella con
    la hora y entra en la cola de subida. */
async function guardarTema(t, deServidor, marca) {
  if (!deServidor) {
    t.modificado = marca || Date.now();
    pend.temas[t.id] = 1; delete borrados[t.id]; guardarPend();
  }
  estado.temas[t.id] = t;
  olvidarMazos(); olvidarBlob(t.id);
  await dbPut(t);
  if (!deServidor) programarSync();
}
/** Quita el contenido de un tema. El borrado también se sincroniza (queda una
    marca en el servidor); el progreso de cada persona no se toca. */
async function quitarTema(id, deServidor) {
  delete estado.temas[id];
  olvidarMazos(); olvidarBlob(id);
  if (!deServidor) { borrados[id] = Date.now(); pend.temas[id] = 1; guardarPend(); }
  await dbBorrar(id);
  if (!deServidor) programarSync();
}

/* ========================================================================
   (b2) SINCRONIZACIÓN con Supabase — la misma cuenta y el mismo hogar que
   Niblo, sin librerías (REST + WebSocket), como en Niblo.
   - Subida: cola de pendientes; se reintenta sola al volver la conexión.
   - Bajada: solo lo cambiado desde el último cursor (con 2 min de solape:
     una fila que se confirma tarde no se pierde; aplicar dos veces es inocuo).
   - Conflictos: gana la última modificación, por tema y por tarjeta. El
     servidor lo hace cumplir también (trigger): una subida vieja nunca pisa
     una nueva, aunque llegue después.
   - En vivo: WebSocket de Realtime; cada aviso dispara una bajada.
   ====================================================================== */
const SUPA = { url:null, anon:null, token:null, refresh:null, uid:null, email:null };
const SYNC = Object.assign({ hogar:null, uid:null, cT:null, cP:null }, leerJSON(KEY_SYNC, {}));
const S = { estado:"local", detalle:"", enCurso:null, repetir:false, timer:null, ultimaSubida:0, ultimaOk:null };

function jwt(token) {
  try { return JSON.parse(atob(String(token).split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch (_) { return null; }
}
function caducaPronto(token) { const c = jwt(token); return !c || (typeof c.exp === "number" && c.exp * 1000 < Date.now() + 60000); }
/** Lee la sesión que guarda Niblo. Devuelve true si hay sesión utilizable. */
function leerSesion() {
  const o = leerJSON(KEY_SUPABASE, null);
  if (!o || !o.token || !o.url || !o.anonKey) {
    Object.assign(SUPA, { url:null, anon:null, token:null, refresh:null, uid:null, email:null });
    return false;
  }
  const c = jwt(o.token);
  Object.assign(SUPA, { url:o.url, anon:o.anonKey, token:o.token, refresh:o.refreshToken || null,
    uid:(c && c.sub) || o.userId || null, email:o.email || null });
  return !!SUPA.uid;
}
const haySesion = () => !!(SUPA.token && SUPA.uid);

/* Renovar el token. Supabase ROTA el refresh token: si Niblo y el hub lo
   gastaran a la vez, el segundo recibiría «ya usado» y la detección de reuso
   podría cerrar la sesión en todas partes. Por eso: (1) cerrojo compartido
   entre pestañas con Niblo (Web Locks, mismo nombre); (2) antes de pedir,
   se mira si otra pestaña ya lo ha renovado; (3) el resultado se escribe en
   la misma clave que lee Niblo. */
const CERROJO_AUTH = "niblo-auth-refresh";
let _renovando = null;
function renovarToken() {
  if (_renovando) return _renovando;
  const tokenAntes = SUPA.token;
  const hacer = async () => {
    const g = leerJSON(KEY_SUPABASE, null);
    if (g && g.token && g.token !== tokenAntes && !caducaPronto(g.token)) {
      SUPA.token = g.token; SUPA.refresh = g.refreshToken || SUPA.refresh;
      return true;
    }
    const refresh = (g && g.refreshToken) || SUPA.refresh;
    if (!refresh) return false;
    try {
      const r = await fetchPlazo(SUPA.url + "/auth/v1/token?grant_type=refresh_token", {
        method:"POST", headers:{ "apikey":SUPA.anon, "Content-Type":"application/json" },
        body:JSON.stringify({ refresh_token:refresh })
      });
      if (!r.ok) return false;
      const d = await r.json();
      SUPA.token = d.access_token; SUPA.refresh = d.refresh_token || refresh;
      const o = leerJSON(KEY_SUPABASE, {}) || {};
      o.token = SUPA.token; o.refreshToken = SUPA.refresh;
      escribirJSON(KEY_SUPABASE, o);
      return true;
    } catch (_) { return false; }
  };
  _renovando = (navigator.locks && navigator.locks.request ? navigator.locks.request(CERROJO_AUTH, hacer) : hacer())
    .then(ok => { if (ok) rtToken(); return ok; })
    .finally(() => { _renovando = null; });
  return _renovando;
}
function fetchPlazo(url, opts, ms) {
  const ctrl = typeof AbortController === "function" ? new AbortController() : null;
  const t = setTimeout(() => { if (ctrl) ctrl.abort(); }, ms || 20000);
  return fetch(url, ctrl ? Object.assign({}, opts, { signal:ctrl.signal }) : opts).finally(() => clearTimeout(t));
}
async function supa(ruta, opts, reintento) {
  if (reintento === undefined) reintento = true;
  if (reintento && SUPA.refresh && caducaPronto(SUPA.token)) await renovarToken();
  const headers = Object.assign({ "apikey":SUPA.anon, "Authorization":"Bearer " + SUPA.token, "Content-Type":"application/json" }, (opts && opts.headers) || {});
  const r = await fetchPlazo(SUPA.url + ruta, Object.assign({}, opts, { headers }), opts && opts.plazo);
  if (r.status === 401 && reintento) {
    if (await renovarToken()) return supa(ruta, opts, false);
    const e = new Error("sesión caducada"); e.sesion = true; throw e;
  }
  if (!r.ok) { const txt = await r.text().catch(() => ""); const e = new Error("Supabase " + r.status + ": " + txt); e.status = r.status; throw e; }
  if (r.status === 204 || r.status === 201) return null;
  const ct = r.headers.get("Content-Type") || "";
  return ct.indexOf("json") >= 0 ? r.json() : r.text();
}
const ms = iso => { const n = Date.parse(iso); return isNaN(n) ? 0 : n; };
const iso = n => new Date(n).toISOString();
function guardarSyncMeta() { escribirJSON(KEY_SYNC, { hogar:SYNC.hogar, uid:SYNC.uid, cT:SYNC.cT, cP:SYNC.cP }); }

/** Hogar de la sesión (RLS solo devuelve los tuyos). Si cambia, lo guardado
    aquí era de otro hogar: se descarta el contenido local para no mezclarlo. */
async function asegurarHogar() {
  const filas = await supa("/rest/v1/hogares?select=id&limit=1");
  const h = filas && filas[0] && filas[0].id;
  if (!h) { const e = new Error("tu cuenta no tiene hogar en Niblo"); e.sinHogar = true; throw e; }
  if (SYNC.hogar && SYNC.hogar !== h) {
    for (const id of Object.keys(estado.temas)) await quitarTema(id, true);
    Object.keys(pend.temas).forEach(id => delete pend.temas[id]);
    Object.keys(borrados).forEach(id => delete borrados[id]);
    guardarPend();
    SYNC.cT = null;
  }
  if (SYNC.uid !== SUPA.uid) { SYNC.cP = null; SYNC.uid = SUPA.uid; }
  SYNC.hogar = h; guardarSyncMeta();
  return h;
}

/** Lee páginas de 1000 filas (el límite de PostgREST) ordenadas por cursor. */
async function bajarTabla(base, cursor) {
  const desde = cursor ? "&actualizado=gte." + encodeURIComponent(iso(ms(cursor) - 120000)) : "";
  const filas = [];
  for (let off = 0; ; off += 1000) {
    const pag = await supa(base + desde + "&order=actualizado.asc&limit=1000&offset=" + off);
    filas.push(...(pag || []));
    if (!pag || pag.length < 1000) break;
  }
  return filas;
}
async function bajar() {
  let cambios = 0;
  // Temas del hogar
  const ft = await bajarTabla(`/rest/v1/oposicion_temas?select=tema_id,datos,borrado,modificado,actualizado&hogar_id=eq.${SYNC.hogar}`, SYNC.cT);
  for (const r of ft) {
    const id = r.tema_id;
    if (!TEMA_POR_ID[id]) continue;
    const tm = ms(r.modificado);
    const lm = estado.temas[id] ? (estado.temas[id].modificado || 0) : (borrados[id] || 0);
    if (tm > lm) {
      if (r.borrado) { if (estado.temas[id]) { await quitarTema(id, true); cambios++; } delete borrados[id]; }
      else if (r.datos) {
        const rec = normalizarTema(id, r.datos, r.datos.fileName, r.datos.html);
        rec.modificado = tm; rec.cargado = r.datos.cargado || rec.cargado;
        await guardarTema(rec, true); cambios++;
      }
      delete pend.temas[id];
    }
    if (!SYNC.cT || ms(r.actualizado) > ms(SYNC.cT)) SYNC.cT = r.actualizado;
  }
  // Progreso propio
  const fp = await bajarTabla(`/rest/v1/oposicion_progreso?select=tarjeta,sabida,modificado,actualizado&user_id=eq.${SUPA.uid}`, SYNC.cP);
  let cambioProg = false;
  for (const r of fp) {
    const tm = ms(r.modificado), a = prog.mapa[r.tarjeta];
    if (!a || tm > a.m) {
      prog.mapa[r.tarjeta] = { s:!!r.sabida, m:tm };
      delete pend.prog[SUPA.uid + "|" + r.tarjeta];
      cambioProg = true; cambios++;
    }
    if (!SYNC.cP || ms(r.actualizado) > ms(SYNC.cP)) SYNC.cP = r.actualizado;
  }
  if (cambioProg) { guardarProg(); olvidarMazos(); }
  guardarPend(); guardarSyncMeta();
  return cambios;
}
async function subir() {
  // Temas: de uno en uno (pueden llevar el HTML completo del tema).
  for (const id of Object.keys(pend.temas)) {
    if (!TEMA_POR_ID[id]) { delete pend.temas[id]; continue; }
    const t = estado.temas[id];
    const marca = t ? t.modificado : borrados[id];
    if (!marca) { delete pend.temas[id]; continue; }
    let datos = null;
    if (t) { datos = Object.assign({}, t); delete datos.id; delete datos.modificado; }
    await supa("/rest/v1/oposicion_temas?on_conflict=hogar_id,tema_id", {
      method:"POST", plazo:60000,
      headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
      body:JSON.stringify({ hogar_id:SYNC.hogar, tema_id:id, datos, borrado:!t, modificado:iso(marca) })
    });
    S.ultimaSubida = Date.now();
    // Solo se da por subido si no ha vuelto a cambiar mientras tanto.
    const ahora = estado.temas[id] ? estado.temas[id].modificado : borrados[id];
    if (ahora === marca) { delete pend.temas[id]; if (!t) delete borrados[id]; }
    guardarPend();
  }
  // Progreso: por lotes; solo lo de la persona con sesión.
  const mias = Object.keys(pend.prog).filter(pk => pk.startsWith(SUPA.uid + "|"));
  for (let i = 0; i < mias.length; i += 500) {
    const lote = mias.slice(i, i + 500);
    const filas = lote.map(pk => { const k = pk.slice(SUPA.uid.length + 1); const v = prog.mapa[k]; return v ? { user_id:SUPA.uid, tarjeta:k, sabida:!!v.s, modificado:iso(v.m) } : null; }).filter(Boolean);
    const marcas = lote.map(pk => { const v = prog.mapa[pk.slice(SUPA.uid.length + 1)]; return v ? v.m : null; });
    if (filas.length) {
      await supa("/rest/v1/oposicion_progreso?on_conflict=user_id,tarjeta", {
        method:"POST", headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" }, body:JSON.stringify(filas)
      });
      S.ultimaSubida = Date.now();
    }
    lote.forEach((pk, j) => { const v = prog.mapa[pk.slice(SUPA.uid.length + 1)]; if (!v || v.m === marcas[j]) delete pend.prog[pk]; });
    guardarPend();
  }
}

function sincronizar() {
  if (!haySesion()) { ponerSync("local"); return Promise.resolve(); }
  if (!navigator.onLine) { ponerSync("offline"); return Promise.resolve(); }
  if (S.enCurso) { S.repetir = true; return S.enCurso; }
  S.enCurso = (async () => {
    ponerSync("sync");
    try {
      await asegurarHogar();
      const cambios = await bajar();
      await subir();
      S.ultimaOk = new Date();
      ponerSync("ok");
      if (cambios) render();
      rtConectar();
    } catch (e) {
      const m = e.message || String(e);
      if (e.sesion) ponerSync("sesion", "La sesión de Niblo ha caducado: vuelve a entrar en Niblo.");
      else if (e.sinHogar) ponerSync("error", "Tu cuenta no tiene hogar en Niblo.");
      else if (/42P01|does not exist|Could not find the table|PGRST205/i.test(m)) ponerSync("error", "Falta ejecutar la migración 009_oposicion_sync.sql en Supabase.");
      else if (!navigator.onLine || /Failed to fetch|NetworkError|aborted|Load failed/i.test(m)) ponerSync("offline");
      else ponerSync("error", m.slice(0, 220));
      console.warn("Sync oposición:", e);
    } finally {
      S.enCurso = null;
      if (S.repetir) { S.repetir = false; programarSync(300); }
    }
  })();
  return S.enCurso;
}
function programarSync(espera) {
  clearTimeout(S.timer);
  pintarSync();
  S.timer = setTimeout(() => sincronizar(), espera == null ? 500 : espera);
}

/* ---- Tiempo real (WebSocket de Supabase Realtime) ---------------------- */
const RT = { ws:null, ref:0, latido:null, reintento:null, intentos:0, conectado:false, tema:"realtime:oposicion", aviso:null };
function rtEnviar(topic, event, payload) {
  if (RT.ws && RT.ws.readyState === 1) RT.ws.send(JSON.stringify({ topic, event, payload:payload || {}, ref:String(++RT.ref) }));
}
function rtConectar() {
  if (!haySesion() || !SYNC.hogar) return;
  if (RT.ws && RT.ws.readyState <= 1) return;
  clearTimeout(RT.reintento);
  let ws;
  try { ws = new WebSocket(`wss://${SUPA.url.replace(/^https?:\/\//, "")}/realtime/v1/websocket?apikey=${encodeURIComponent(SUPA.anon)}&vsn=1.0.0`); }
  catch (_) { return; }
  RT.ws = ws;
  ws.onopen = async () => {
    if (caducaPronto(SUPA.token)) await renovarToken();
    rtEnviar(RT.tema, "phx_join", {
      config:{
        broadcast:{ self:false },
        postgres_changes:[
          { event:"*", schema:"public", table:"oposicion_temas",    filter:`hogar_id=eq.${SYNC.hogar}` },
          { event:"*", schema:"public", table:"oposicion_progreso", filter:`user_id=eq.${SUPA.uid}` }
        ]
      },
      access_token:SUPA.token
    });
    clearInterval(RT.latido);
    RT.latido = setInterval(() => {
      rtEnviar("phoenix", "heartbeat", {});
      // El canal se cierra cuando caduca el token: se renueva antes.
      if (caducaPronto(SUPA.token)) renovarToken();
    }, 25000);
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.topic !== RT.tema) return;
    if (m.event === "phx_reply" && m.payload && m.payload.status === "ok" && m.payload.response && m.payload.response.postgres_changes) {
      RT.conectado = true; RT.intentos = 0; pintarSync();
      // Lo que cambiara mientras no había canal se recoge ahora.
      programarSync(200);
      return;
    }
    if ((m.event === "system" && m.payload && m.payload.status === "error") || m.event === "phx_error" || m.event === "phx_close") {
      RT.conectado = false; pintarSync();
      try { ws.close(); } catch (_) {}
      return;
    }
    if (m.event === "postgres_changes") {
      // Puede ser el eco de lo que acabamos de subir: se deja pasar la ventana.
      const espera = Math.max(300, 1500 - (Date.now() - S.ultimaSubida));
      programarSync(espera);
    }
  };
  ws.onclose = () => {
    RT.conectado = false; clearInterval(RT.latido); pintarSync();
    if (RT.ws !== ws) return;
    RT.ws = null;
    if (!haySesion()) return;
    const espera = Math.min(30000, 1000 * Math.pow(2, RT.intentos++));
    RT.reintento = setTimeout(rtConectar, espera);
  };
  ws.onerror = () => { try { ws.close(); } catch (_) {} };
}
/** Token nuevo: se lo pasa al canal abierto para que no lo cierre al caducar. */
function rtToken() { if (RT.conectado) rtEnviar(RT.tema, "access_token", { access_token:SUPA.token }); }
function rtCerrar() {
  clearTimeout(RT.reintento); clearInterval(RT.latido); RT.conectado = false;
  if (RT.ws) { const w = RT.ws; RT.ws = null; try { w.close(); } catch (_) {} }
}

/* ========================================================================
   (c) UTILIDADES
   ====================================================================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function barajar(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function plural(n, s, p) { return n + " " + (n === 1 ? s : (p || s + "s")); }
function resaltar(texto, q) {
  const txt = String(texto || "");
  if (!q) return esc(txt);
  const i = norm(txt).indexOf(norm(q));
  if (i < 0) return esc(txt);
  return esc(txt.slice(0, i)) + "<mark>" + esc(txt.slice(i, i + q.length)) + "</mark>" + esc(txt.slice(i + q.length));
}
/** Ordena hitos: primer año de 4 cifras; siglos en romano; lo demás al final. */
function claveAnio(y) {
  const s = String(y || "");
  const m = s.match(/\d{4}/); if (m) return parseInt(m[0], 10);
  const r = s.match(/s\.?\s*([ivxlcdm]+)/i);
  if (r) return romano(r[1].toUpperCase()) * 100 - 50;
  return 99999;
}
function romano(s) { const v = { I:1, V:5, X:10, L:50, C:100, D:500, M:1000 }; let r = 0, p = 0; for (let i = s.length - 1; i >= 0; i--) { const x = v[s[i]] || 0; r += x < p ? -x : x; p = x; } return r; }

function toast(msg, tipo) {
  const box = document.getElementById("toast-box");
  const t = document.createElement("div");
  t.className = "toast" + (tipo === "error" ? " error" : "");
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => t.remove(), 3600);
}

/** Texto de la tabla del documento -> HTML con los enlaces que el documento
    enlaza: identificadores BOE (texto consolidado), webs institucionales y
    las fuentes citadas por su nombre. «(verif.)» se marca aparte. */
function enlazar(texto) {
  let h = esc(texto);
  const marcas = [];
  const guardar = html => { marcas.push(html); return "\u0000" + (marcas.length - 1) + "\u0000"; };
  h = h.replace(/BOE-A-\d{4}-\d+/g, id =>
    guardar(`<a href="https://www.boe.es/buscar/act.php?id=${id}" target="_blank" rel="noopener">${id}</a>`));
  ENLACES_TEXTO.forEach(([t, url]) => {
    h = h.split(esc(t)).join(guardar(`<a href="${url}" target="_blank" rel="noopener">${esc(t)}</a>`));
  });
  h = h.replace(/\bwww\.[a-z0-9.-]+\.[a-z]{2,}(?:\/[a-z0-9\/._-]*[a-z0-9\/])?/gi, d =>
    guardar(`<a href="https://${d}" target="_blank" rel="noopener">${d}</a>`));
  DOMINIOS_SIN_WWW.forEach(d => {
    h = h.replace(new RegExp("(^|[\\s(;,])(" + d.replace(/[.\/]/g, "\\$&") + ")(?![\\w.-]*\\w)", "g"),
      (m, pre, dom) => pre + guardar(`<a href="https://${dom}" target="_blank" rel="noopener">${dom}</a>`));
  });
  h = h.replace(/\(verif\.\)/g, () =>
    guardar('<span class="verif" title="Norma, cifra o web citada sin identificador o sin comprobar en la revisión del documento: contrástala antes de incorporarla a tus temas.">verif.</span>'));
  return h.replace(/\u0000(\d+)\u0000/g, (m, i) => marcas[+i]);
}

function tagVigencia(t) { const v = VIGENCIA[t.v[0]]; return `<span class="tag ${v.cls}" title="${esc(v.def)}">${v.txt}</span>`; }
function tagFuente(t)   { const f = FUENTE[t.f[0]];   return `<span class="tag ${f.cls}" title="${esc(f.def)}">${f.txt}</span>`; }
function tagTac(t)      { return t.tac ? `<span class="tag lila" title="Sin correlato en el TAC con grupo de sociales (§15.6 del PDF base)">Sin correlato TAC</span>` : ""; }

function temasDeBloque(code) { return Object.values(estado.temas).filter(t => t.group === code).sort((a, b) => a.id.localeCompare(b.id)); }

  return temasDeBloque(ambito);
}

/* ========================================================================
   Carga de contenido: archivos HTML con window.TEMARIO_DATA (mismo formato
   que los temas de estudio ya existentes) o JSON.
   ====================================================================== */
/** Acepta "B4T11", "IV.11", "iv-11"… y devuelve el id interno o null. */
function idValido(k, v) {
  const cand = [v && v.id, k, v && v.codigo, v && v.c].filter(Boolean).map(x => String(x).trim());
  for (const c of cand) {
    const u = c.toUpperCase();
    if (TEMA_POR_ID[u]) return u;
    const m = u.match(/^(I{1,3}|IV|V|VI)[.\-_ ]?(\d{1,2})$/);
    if (m && ID_POR_CODIGO[m[1] + "." + parseInt(m[2], 10)]) return ID_POR_CODIGO[m[1] + "." + parseInt(m[2], 10)];
  }
  // Por número de bloque y tema, si vienen sueltos.
  if (v && v.group && v.number) {
    const g = String(v.group).toUpperCase().replace(/^G/, "B");
    const id = g + "T" + String(v.number).padStart(2, "0");
    if (TEMA_POR_ID[id]) return id;
  }
  return null;
}
function normalizarTema(id, v, fileName, html) {
  const p = TEMA_POR_ID[id];
  const arr = x => Array.isArray(x) ? x : [];
  return {
    id, group:p.b, number:p.num,
    title: v.title || p.e, subtitle: v.subtitle || "",
    fileName: fileName || v.fileName || v.url || "",
    timeline: arr(v.timeline), glossary: arr(v.glossary), flashcards: arr(v.flashcards),
    questions: arr(v.questions).filter(q => q && Array.isArray(q.o) && q.o.length >= 2 && Number.isInteger(q.c) && q.c >= 0 && q.c < q.o.length),
    sections: arr(v.sections),
    html: html || v.html || null,
    cargado: new Date().toISOString()
  };
}
function datosATemas(datos, fileName, html) {
  const out = [], ignorados = [];
  for (const k in datos) {
    const v = datos[k];
    if (!v || typeof v !== "object") continue;
    const id = idValido(k, v);
    if (id) out.push(normalizarTema(id, v, fileName, html)); else ignorados.push(k);
  }
  return { out, ignorados };
}

/** Ejecuta el HTML en un iframe aislado (sin acceso a esta página) y recoge
    window.TEMARIO_DATA por postMessage. */
function leerHTMLTema(texto) {
  return new Promise((ok, ko) => {
    const testigo = "gestion-" + Math.random().toString(36).slice(2);
    const sonda = `<script>addEventListener("load",function(){setTimeout(function(){var d=null;try{d=JSON.parse(JSON.stringify(window.TEMARIO_DATA||window.GESTION_DATA||null));}catch(e){}parent.postMessage({testigo:${JSON.stringify(testigo)},datos:d},"*");},300);});<\/script>`;
    const ifr = document.createElement("iframe");
    ifr.setAttribute("sandbox", "allow-scripts");
    ifr.style.cssText = "position:absolute;left:-10000px;top:0;width:1px;height:1px;visibility:hidden";
    ifr.srcdoc = texto + sonda;
    let hecho = false;
    const fin = () => { hecho = true; window.removeEventListener("message", oir); clearTimeout(plazo); ifr.remove(); };
    const oir = e => {
      if (hecho || !e.data || e.data.testigo !== testigo) return;
      const d = e.data.datos;
      fin();
      if (!d || typeof d !== "object" || !Object.keys(d).length) ko(new Error("no contiene window.TEMARIO_DATA"));
      else ok(d);
    };
    const plazo = setTimeout(() => { if (!hecho) { fin(); ko(new Error("tiempo agotado al leer el archivo")); } }, 15000);
    window.addEventListener("message", oir);
    document.body.appendChild(ifr);
  });
}
function leerArchivo(f) {
  return new Promise((ok, ko) => { const r = new FileReader(); r.onerror = () => ko(new Error("no se pudo leer")); r.onload = () => ok(r.result); r.readAsText(f); });
}

async function procesarArchivos(lista) {
  const archivos = Array.from(lista || []);
  const validos = archivos.filter(f => /\.(html?|json)$/i.test(f.name));
  if (!validos.length) { toast("Suelta archivos .html (temas) o .json (copia o temas)", "error"); return; }
  let total = 0;
  for (const f of validos) {
    try {
      const texto = await leerArchivo(f);
      let datos, html = null;
      if (/\.json$/i.test(f.name)) {
        const j = JSON.parse(texto);
        if (j && j._format === FORMATO) { if (await importarCopia(j)) total += Object.keys(j.temas || {}).length; continue; }
        datos = (j && j.id && (j.glossary || j.flashcards || j.questions || j.timeline || j.sections)) ? { [j.id]: j } : j;
      } else {
        datos = await leerHTMLTema(texto);
        html = texto;
      }
      const { out, ignorados } = datosATemas(datos, f.name, html);
      for (const t of out) await guardarTema(t);
      total += out.length;
      if (out.length) toast(`✓ ${f.name}: ${out.map(t => codigoDe(t.id)).join(", ")}`);
      if (ignorados.length) toast(`${f.name}: ${ignorados.join(", ")} no corresponde a ningún tema del programa`, "error");
      if (!out.length && !ignorados.length) toast(`${f.name}: sin temas reconocibles`, "error");
    } catch (e) {
      toast(`✗ ${f.name}: ${e.message}`, "error");
    }
  }
  if (total) render();
}

function elegirArchivos() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".html,.htm,.json"; inp.multiple = true;
  inp.style.cssText = "position:fixed;left:-10000px";
  inp.addEventListener("change", () => { procesarArchivos(inp.files); setTimeout(() => inp.remove(), 500); });
  document.body.appendChild(inp);
  inp.click();
}
function activarDrop(el) {
  el.addEventListener("click", e => { if (e.target.closest("a,button")) return; elegirArchivos(); });
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); elegirArchivos(); } });
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("encima"); });
  el.addEventListener("dragleave", e => { if (!el.contains(e.relatedTarget)) el.classList.remove("encima"); });
  el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("encima"); procesarArchivos(e.dataTransfer && e.dataTransfer.files); });
}
// Soltar fuera de una zona de carga no debe abrir el archivo en el navegador.
["dragover", "drop"].forEach(ev => document.addEventListener(ev, e => { if (!e.target.closest || !e.target.closest(".drop")) e.preventDefault(); }));

/* ---- Copia completa (💾) ------------------------------------------------ */
async function exportarCopia() {
  const temas = {};
  Object.values(estado.temas).forEach(t => { temas[t.id] = t; });
  const datos = { _format:FORMATO, _version:2, _exportedAt:new Date().toISOString(), ajustes:{ progreso:prog.mapa }, temas };
  const url = URL.createObjectURL(new Blob([JSON.stringify(datos, null, 2)], { type:"application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = "gestion_hub_" + new Date().toISOString().slice(0, 10).replace(/-/g, "") + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 300);
  toast(`✓ Copia guardada: ${plural(Object.keys(temas).length, "tema")} + progreso`);
}
async function importarCopia(j, silencioso) {
  const n = Object.keys(j.temas || {}).length;
  if (!silencioso) {
    const fecha = j._exportedAt ? new Date(j._exportedAt).toLocaleString("es-ES") : "fecha desconocida";
    if (!confirm(`¿Importar la copia del ${fecha} con ${plural(n, "tema")}?\nSustituye los temas con el mismo número y el progreso de flashcards.`)) return false;
  }
  let ok = 0;
  for (const k in (j.temas || {})) {
    const v = j.temas[k];
    const id = idValido(k, v);
    if (!id) continue;
    /* Lo embebido en la página lleva la fecha de la copia, no la de ahora: si
       no, cada dispositivo que abriera la página por primera vez pisaría lo
       que se hubiera editado después en otro. */
    const marca = silencioso ? ms(j._exportedAt) || 1 : null;
    if (marca && estado.temas[id] && (estado.temas[id].modificado || 0) >= marca) continue;
    await guardarTema(normalizarTema(id, v, v.fileName, v.html), false, marca); ok++;
  }
  // Progreso: se suma al tuyo tarjeta a tarjeta (gana la marca más reciente).
  const pr = j.ajustes && j.ajustes.progreso;
  if (pr && typeof pr === "object") {
    for (const k in pr) { const v = pr[k], a = prog.mapa[k]; if (v && typeof v.m === "number" && (!a || v.m > a.m)) { prog.mapa[k] = { s:!!v.s, m:v.m }; pend.prog[prog.duenno + "|" + k] = 1; } }
    guardarProg(); guardarPend(); programarSync();
  }
  // Copias de la primera versión: claves por posición.
  const v1 = j.ajustes && j.ajustes.fc && j.ajustes.fc.known;
  if (Array.isArray(v1)) v1.forEach(k => { const [id, i] = k.split(":"); const t = estado.temas[id]; const f = t && t.flashcards[parseInt(i, 10)]; if (f) marcarFc(claveFc(id, f), true); });
  if (!silencioso) toast(`✓ Importados ${plural(ok, "tema")}`);
  return true;
}
async function cargarEmbebidos() {
  const el = document.getElementById("datos-embebidos");
  const txt = el ? el.textContent.trim() : "";
  if (!txt) return;
  try {
    let j = JSON.parse(txt);
    if (j._format !== FORMATO) return;
    const sello = j._exportedAt || "sin-fecha";
    if (localStorage.getItem(KEY_EMBED) === sello) return;
    // El progreso es de cada persona: lo embebido en la página no lo trae.
    j = Object.assign({}, j, { ajustes:null });
    await importarCopia(j, true);
    localStorage.setItem(KEY_EMBED, sello);
  } catch (e) { console.warn("Datos embebidos:", e); }
}

/* ---- Buscar temas publicados junto a la página ------------------------- */
async function buscarEnServidor() {
  if (!/^https?:$/.test(location.protocol)) { toast("Solo funciona con la página publicada (http/https)", "error"); return; }
  const btn = document.getElementById("btn-servidor");
  btn.classList.add("girando"); btn.disabled = true;
  let hallados = 0, cursor = 0;
  const lista = TEMAS.map(t => t.id);
  async function trabajador() {
    while (cursor < lista.length) {
      const id = lista[cursor++];
      try {
        const r = await fetch(CARPETA_TEMAS + id + "_estudio.html", { cache:"no-cache" });
        if (!r.ok) continue;
        const texto = await r.text();
        if (!/TEMARIO_DATA|GESTION_DATA/.test(texto)) continue;
        const { out } = datosATemas(await leerHTMLTema(texto), id + "_estudio.html", null);
        for (const t of out) { await guardarTema(t); hallados++; }
      } catch (_) {}
    }
  }
  await Promise.all(Array.from({ length:6 }, trabajador));
  btn.classList.remove("girando"); btn.disabled = false;
  toast(hallados ? `✓ ${plural(hallados, "tema")} cargado${hallados === 1 ? "" : "s"} desde ${CARPETA_TEMAS}` : `No hay temas publicados en ${CARPETA_TEMAS}`, hallados ? "" : "error");
  if (hallados) render();
}

      ${sig ? `<button class="btn" data-ir="#/tema/${sig}">${esc(TEMA_POR_ID[sig].c)} →</button>` : "<span></span>"}
    </div>`;
  vista().querySelectorAll("[data-ir]").forEach(x => x.addEventListener("click", () => ir(x.dataset.ir)));
  const pl = document.getElementById("btn-plantilla");
  if (pl) pl.addEventListener("click", () => descargarPlantilla(id));
  const drop = vista().querySelector(".drop");
  if (drop) activarDrop(drop);
  vista().querySelectorAll("[data-ancla]").forEach(x => x.addEventListener("click", () => abrirTema(id, x.dataset.ancla)));
  const ab = document.getElementById("btn-abrir"); if (ab) ab.addEventListener("click", () => abrirTema(id));
  const re = document.getElementById("btn-reemplazar"); if (re) re.addEventListener("click", elegirArchivos);
  const qu = document.getElementById("btn-quitar");
  if (qu) qu.addEventListener("click", async () => {
    if (!confirm(`¿Quitar el contenido del tema ${p.c}?`)) return;
    await quitarTema(id); toast(`Tema ${p.c} quitado`); render();
  });
}
function bloqueContenido(t) {
  const fcT = t.flashcards.length;
  const fcK = sabidasDe(t);
  return `

      </div>

    </div>

          ${t.sections.map(s => `<li><button class="${/-/.test(s.id || "") ? "sub" : ""}" data-ancla="${esc(s.id || "")}">${esc(s.title)}</button></li>`).join("")}
