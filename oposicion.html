maras reunidas conjuntamente**, con juramento o promesa (4.2)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Firman los **dos Presidentes**; toma posesión ante las **Mesas** (no ante los Plenos).","nivel":2},{"id":"s7-2","title":"IV.3 Estatuto: cese, prerrogativas, incompatibilidades y Adjuntos (arts. 5 a 8)","body":"### 3.1 Cese y vacante (art. 5)\n\n> **Artículo quinto. (LO 3/1981)**\n> Uno. El Defensor del Pueblo cesará por alguna de las siguientes causas:\n> Uno) Por renuncia.\n> Dos) Por expiración del plazo de su nombramiento.\n> Tres) Por muerte o por incapacidad sobrevenida.\n> Cuatro) Por actuar con **notoria negligencia** en el cumplimiento de las obligaciones y deberes del cargo.\n> Cinco) Por haber sido condenado, mediante sentencia firme, por **delito doloso**.\n> Dos. La vacante en el cargo se declarará por el **Presidente del Congreso** en los casos de muerte, renuncia y expiración del plazo del mandato. En los demás casos se decidirá, por mayoría de las **tres quintas partes de los componentes de cada Cámara**, mediante debate y previa audiencia del interesado.\n> Tres. Vacante el cargo se iniciará el procedimiento para el nombramiento de nuevo Defensor del Pueblo **en plazo no superior a un mes**.\n> Cuatro. En los casos de muerte, cese o incapacidad temporal o definitiva del Defensor del Pueblo y en tanto no procedan las Cortes Generales a una nueva designación desempeñarán sus funciones, interinamente, **en su propio orden**, los Adjuntos al Defensor del Pueblo.\n\n=> Qué: Por qué cesa y quién declara la vacante\n=> Quién: \n=> - **Presidente del Congreso**: vacante por muerte, renuncia o expiración del mandato\n=> - **Cada Cámara**, en los demás casos\n=> - **Adjuntos**: ejercen interinamente, en su propio orden, hasta el nuevo nombramiento\n=> Cómo: Cinco causas (5.1):\n=> - renuncia\n=> - expiración del plazo\n=> - muerte o incapacidad sobrevenida\n=> - **notoria negligencia** en el cumplimiento de sus obligaciones y deberes\n=> - condena por **delito doloso** en sentencia firme\n=> Plazos y mayorías: \n=> - Negligencia o condena: **tres quintos** de los componentes de cada Cámara, con debate y audiencia del interesado (5.2)\n=> - Nuevo nombramiento: iniciar en plazo **no superior a un mes** (5.3)\n=> ⚠ Ojo en el examen: La pérdida de confianza de las Cortes **no** es causa de cese.\n\n### 3.2 Independencia y prerrogativas (art. 6)\n\n> **Artículo sexto. (LO 3/1981)**\n> Uno. El Defensor del Pueblo **no estará sujeto a mandato imperativo alguno**. No recibirá instrucciones de ninguna Autoridad. Desempeñará sus funciones con autonomía y según su criterio.\n> Dos. El Defensor del Pueblo **gozará de inviolabilidad**. No podrá ser detenido, expedientado, multado, perseguido o juzgado en razón a las opiniones que formule o a los actos que realice en el ejercicio de las competencias propias de su cargo.\n> Tres. En los demás casos, y mientras permanezca en el ejercicio de sus funciones, el Defensor del Pueblo no podrá ser detenido ni retenido sino en caso de **flagrante delito**, correspondiendo la decisión sobre su inculpación, prisión, procesamiento y juicio exclusivamente a la **Sala de lo Penal del Tribunal Supremo**.\n> Cuatro. Las anteriores reglas serán aplicables a los Adjuntos del Defensor del Pueblo en el cumplimiento de sus funciones.\n\n=> Qué: Las garantías personales del Defensor\n=> Quién: El Defensor y, por extensión (6.4), los **Adjuntos**\n=> Cómo: \n=> - **Independencia** (6.1): sin mandato imperativo ni instrucciones; actúa con autonomía y según su criterio\n=> - **Inviolabilidad** (6.2): no puede ser detenido, expedientado, multado, perseguido o juzgado por sus opiniones o actos en el ejercicio del cargo\n=> - **Inmunidad** (6.3): en los demás casos, solo detenido o retenido «en caso de flagrante delito»\n=> - **Fuero** (6.3): inculpación, prisión, procesamiento y juicio, exclusivamente la **Sala de lo Penal del Tribunal Supremo**\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Fuero: **Sala de lo Penal del Tribunal Supremo** (no el TC ni la Audiencia Nacional). Los defensores autonómicos, el **TSJ** (→ IV.7).\n\n### 3.3 Incompatibilidades (art. 7)\n\n> **Artículo séptimo. (LO 3/1981)**\n> Uno. La condición de Defensor del Pueblo es incompatible con todo mandato representativo; con todo cargo político o actividad de propaganda política; con la permanencia en el servicio activo de cualquier Administración pública; con la afiliación a un partido político o el desempeño de funciones directivas en un partido político o en un sindicato, asociación o fundación, y con el empleo al servicio de los mismos; con el ejercicio de las carreras judicial y fiscal, y con cualquier actividad profesional, liberal, mercantil o laboral.\n> Dos. El Defensor del Pueblo deberá cesar, **dentro de los diez días siguientes a su nombramiento y antes de tomar posesión**, en toda situación de incompatibilidad que pudiera afectarle, entendiéndose en caso contrario que no acepta el nombramiento.\n> Tres. Si la incompatibilidad fuere sobrevenida una vez posesionado del cargo, se entenderá que renuncia al mismo en la fecha en que aquélla se hubiere producido.\n\n=> Qué: Qué no puede compatibilizar\n=> Quién: El Defensor y los Adjuntos (8.4)\n=> Cómo: Incompatible con (7.1):\n=> - todo mandato representativo\n=> - todo cargo político o actividad de propaganda política\n=> - el servicio activo en cualquier Administración\n=> - la afiliación a un partido o funciones directivas en un partido, sindicato, asociación o fundación, o el empleo al servicio de los mismos\n=> - las carreras **judicial y fiscal**\n=> - cualquier actividad profesional, liberal, mercantil o laboral\n=> Plazos y mayorías: \n=> - Cesar en la causa de incompatibilidad **en 10 días** desde el nombramiento y antes de tomar posesión; si no, **no acepta** el nombramiento (7.2)\n=> - Incompatibilidad sobrevenida: se entiende que **renuncia** en la fecha en que se produjo (7.3)\n=> ⚠ Ojo en el examen: Antes: «no acepta». Después: «renuncia».\n\n### 3.4 Los Adjuntos (art. 8)\n\n> **Artículo octavo. (LO 3/1981)**\n> Uno. El Defensor del Pueblo estará auxiliado por un **Adjunto Primero y un Adjunto Segundo**, en los que podrá delegar sus funciones y que le sustituirán por su orden, en el ejercicio de las mismas, en los supuestos de imposibilidad temporal y en los de cese.\n> Dos. El Defensor del Pueblo nombrará y separará a sus Adjuntos **previa conformidad de las Cámaras** en la forma que determinen sus Reglamentos.\n> Tres. El nombramiento de los Adjuntos será publicado en el «Boletín Oficial del Estado».\n> Cuatro. A los Adjuntos les será de aplicación lo dispuesto para el Defensor del Pueblo en los artículos tercero, sexto y séptimo de la presente Ley.\n\n=> Qué: Los colaboradores directos del Defensor\n=> Quién: Un **Adjunto Primero** y un **Adjunto Segundo**\n=> Cómo: \n=> - Le auxilian; puede **delegarles** funciones; le **sustituyen por su orden** en caso de imposibilidad temporal o cese (8.1)\n=> - El Defensor los nombra y separa **previa conformidad de las Cámaras** (8.2)\n=> - Se les aplican los arts. 3, 6 y 7: requisitos, prerrogativas e incompatibilidades (8.4)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Los nombra **el Defensor**, con conformidad previa de las Cámaras (en la práctica, de la Comisión Mixta, art. 2.6).","nivel":2},{"id":"s7-3","title":"IV.4 Ámbito de actuación y quejas (arts. 9 a 17)","body":"### 4.1 Objeto de la supervisión (art. 9)\n\n> **Artículo noveno. (LO 3/1981)**\n> Uno. El Defensor del Pueblo podrá iniciar y proseguir **de oficio o a petición de parte**, cualquier investigación conducente al esclarecimiento de los actos y resoluciones de la Administración pública y sus agentes, en relación con los ciudadanos, a la luz de lo dispuesto en el **artículo ciento tres, uno**, de la Constitución, y el respeto debido a los Derechos proclamados en su Título primero.\n> Dos. Las atribuciones del Defensor del Pueblo se extienden a la actividad de los ministros, autoridades administrativas, funcionarios y cualquier persona que actúe al servicio de las Administraciones públicas.\n\n=> Qué: Qué investiga\n=> Quién: Ministros, autoridades administrativas, funcionarios y cualquier persona al servicio de las Administraciones (9.2)\n=> Cómo: \n=> - Investigaciones **de oficio o a petición de parte** sobre actos y resoluciones de la **Administración pública** y sus agentes\n=> - Criterios: el **art. 103.1 CE** y el respeto a los derechos del Título I\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Mide a la Administración con el **art. 103.1** CE (objetividad, eficacia, sometimiento a la ley).\n\n### 4.2 Quién puede presentar quejas (art. 10)\n\n> **Artículo diez. (LO 3/1981)**\n> Uno. Podrá dirigirse al Defensor del Pueblo **toda persona natural o jurídica que invoque un interés legítimo**, sin restricción alguna. No podrán constituir impedimento para ello la nacionalidad, residencia, sexo, minoría de edad, la incapacidad legal del sujeto, el internamiento en un centro penitenciario o de reclusión o, en general, cualquier relación especial de sujeción o dependencia de una Administración o Poder público.\n> Dos. Los Diputados y Senadores individualmente, las comisiones de investigación o relacionadas con la defensa general o parcial de los derechos y libertades públicas y, principalmente, la Comisión Mixta Congreso-Senado de relaciones con el Defensor del Pueblo podrán solicitar, mediante escrito motivado, la intervención del Defensor del Pueblo para la investigación o esclarecimiento de actos, resoluciones y conductas concretas producidas en las Administraciones públicas, que afecten a un ciudadano o grupo de ciudadanos, en el ámbito de sus competencias.\n> Tres. No podrá presentar quejas ante el Defensor del Pueblo **ninguna autoridad administrativa en asuntos de su competencia**.\n\n=> Qué: Legitimación para acudir al Defensor\n=> Quién: \n=> - «toda persona natural o jurídica que invoque un interés legítimo, sin restricción alguna»\n=> - Diputados y Senadores individualmente, comisiones de investigación o de derechos y, principalmente, la **Comisión Mixta**, por escrito motivado (10.2)\n=> Cómo: No impiden la queja la nacionalidad, la residencia, el sexo, la minoría de edad, la incapacidad legal, el internamiento penitenciario ni ninguna relación especial de sujeción\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Exclusión (10.3): **ninguna autoridad administrativa en asuntos de su competencia**.\n\n### 4.3 Continuidad de su actividad (art. 11)\n\n> **Artículo once. (LO 3/1981)**\n> Uno. La actividad del Defensor del Pueblo no se verá interrumpida en los casos en que las Cortes Generales no se encuentren reunidas, hubieren sido disueltas o hubiere expirado su mandato.\n> Dos. En las situaciones previstas en el apartado anterior, el Defensor del Pueblo se dirigirá a las **Diputaciones Permanentes** de las Cámaras.\n> Tres. La declaración de los estados de **excepción o de sitio** no interrumpirán la actividad del Defensor del Pueblo, ni el derecho de los ciudadanos de acceder al mismo, sin perjuicio de lo dispuesto en el artículo cincuenta y cinco de la Constitución.\n\n=> Qué: La institución no se detiene\n=> Quién: El Defensor; se dirige a las **Diputaciones Permanentes** si las Cámaras no están reunidas, se han disuelto o ha expirado su mandato\n=> Cómo: \n=> - «La declaración de los estados de excepción o de sitio no interrumpirán la actividad del Defensor del Pueblo, ni el derecho de los ciudadanos de acceder al mismo» (11.3)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Enlace con el bloque III: sigue actuando en **excepción y sitio** (→ III.7).\n\n### 4.4 Comunidades Autónomas, Administración de Justicia y Administración Militar (arts. 12 a 14)\n\n> **Artículo doce. (LO 3/1981)**\n> Uno. El Defensor del Pueblo podrá, en todo caso, de oficio o a instancia de parte, supervisar por sí mismo la actividad de la Comunidad Autónoma en el ámbito de competencias definido por esta Ley.\n> Dos. A los efectos de lo previsto en el párrafo anterior, los órganos similares de las Comunidades Autónomas coordinarán sus funciones con las del Defensor del Pueblo y éste podrá solicitar su cooperación.\n\n> **Artículo trece. (LO 3/1981)**\n> Cuando el Defensor del Pueblo reciba quejas referidas al funcionamiento de la Administración de Justicia, deberá dirigirlas al **Ministerio Fiscal** para que éste investigue su realidad y adopte las medidas oportunas con arreglo a la ley, o bien dé traslado de las mismas al **Consejo General del Poder Judicial**, según el tipo de reclamación de que se trate; todo ello sin perjuicio de la referencia que en su informe general a las Cortes Generales pueda hacer al tema.\n\n> **Artículo catorce. (LO 3/1981)**\n> El Defensor del Pueblo velará por el respeto de los derechos proclamados en el título primero de la Constitución en el ámbito de la Administración Militar, sin que ella pueda entrañar una interferencia en el mando de la Defensa Nacional.\n\n=> Qué: Hasta dónde llega su supervisión\n=> Quién: \n=> - CC. AA. (12): puede supervisarlas **por sí mismo**; los órganos autonómicos similares coordinan sus funciones con él (→ IV.7)\n=> - Justicia (13): **no** la supervisa; remite las quejas al **Ministerio Fiscal** o al **CGPJ**\n=> - Militar (14): vela por los derechos en ella, sin interferir en el **mando** de la Defensa Nacional\n=> Cómo: —\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Quejas sobre la **Justicia**: al Ministerio Fiscal o al Consejo General del Poder Judicial, según el tipo de reclamación.\n\n### 4.5 La queja y su correspondencia (arts. 15 y 16)\n\n> **Artículo quince. (LO 3/1981)**\n> Uno. Toda queja se presentará firmada por el interesado, con indicación de su nombre, apellidos y domicilio, en escrito razonado en papel común y **en el plazo máximo de un año**, contado a partir del momento en que tuviera conocimiento de los hechos objeto de la misma.\n> Dos. Todas las actuaciones del Defensor del Pueblo son **gratuitas** para el interesado y no será preceptiva la asistencia de Letrado ni de Procurador. De toda queja se acusará recibo.\n\n> **Artículo dieciséis. (LO 3/1981)**\n> Uno. La correspondencia dirigida al Defensor del Pueblo y que sea remitida desde cualquier centro de detención, internamiento o custodia de las personas no podrá ser objeto de censura de ningún tipo.\n> Dos. Tampoco podrán ser objeto de escucha o interferencia las conversaciones que se produzcan entre el Defensor del Pueblo o sus delegados y cualquier otra persona de las enumeradas en el apartado anterior.\n\n=> Qué: Cómo se presenta una queja\n=> Quién: El interesado\n=> Cómo: \n=> - Firmada, con nombre, apellidos y domicilio, en escrito razonado en papel común (15.1)\n=> - Actuaciones **gratuitas**, sin Letrado ni Procurador (15.2)\n=> - Correspondencia desde centros de detención, internamiento o custodia: «no podrá ser objeto de censura de ningún tipo»; las conversaciones no pueden ser escuchadas (16)\n=> Plazos y mayorías: **Un año** desde que se conocieron los hechos (15.1)\n=> ⚠ Ojo en el examen: Plazo: **un año**. Sin abogado ni procurador.\n\n### 4.6 Admisión y rechazo (art. 17)\n\n> **Artículo diecisiete. (LO 3/1981)**\n> Uno. El Defensor del Pueblo registrará y acusará recibo de las quejas que se formulen, que tramitará o rechazará. En este último caso lo hará en escrito motivado pudiendo informar al interesado sobre las vías más oportunas para ejercitar su acción, caso de que a su entender hubiese alguna y sin perjuicio de que el interesado pueda utilizar las que considere más pertinentes.\n> Dos. El Defensor del Pueblo no entrará en el examen individual de aquellas quejas sobre las que esté **pendiente resolución judicial** y lo suspenderá si, iniciada su actuación, se interpusiere por persona interesada demanda o recurso ante las Tribunales ordinarios o el Tribunal Constitucional. Ello no impedirá, sin embargo, la investigación sobre los problemas generales planteados en las quejas presentadas. En cualquier caso velará por que la Administración resuelva expresamente, en tiempo y forma, las peticiones y recursos que le hayan sido formulados.\n> Tres. El Defensor del Pueblo **rechazará las quejas anónimas** y podrá rechazar aquellas en las que advierta mala fe, carencia de fundamento, inexistencia de pretensión, así como aquellas otras cuya tramitación irrogue perjuicio al legítimo derecho de tercera persona. **Sus decisiones no serán susceptibles de recurso**.\n\n=> Qué: Qué quejas se tramitan\n=> Quién: El Defensor\n=> Cómo: \n=> - Registro y acuse; tramitación o rechazo por **escrito motivado** (17.1)\n=> - No examina individualmente las quejas **pendientes de resolución judicial** y suspende el examen si se interpone demanda o recurso; puede investigar los problemas generales (17.2)\n=> - Rechaza **siempre** las **anónimas**; **puede** rechazar las de mala fe, sin fundamento o sin pretensión, y las que perjudiquen a terceros (17.3)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Anónimas: **rechaza** (obligatorio). Mala fe: **podrá** rechazar. Sus decisiones **no son recurribles**.","nivel":2},{"id":"s7-7","title":"IV.5 La investigación y el deber de colaboración (arts. 18 a 27)","body":"### 5.1 Desarrollo de la investigación (arts. 18 a 21)\n\n> **Artículo dieciocho. (LO 3/1981)**\n> Uno. Admitida la queja, el Defensor del Pueblo promoverá la oportuna investigación sumaria e informal para el esclarecimiento de los supuestos de la misma. En todo caso dará cuenta del contenido sustancial de la solicitud al Organismo o a la Dependencia administrativa procedente con el fin de que por su Jefe **en el plazo máximo de quince días**, se remita informe escrito. Tal plazo será ampliable cuando concurran circunstancias que lo aconsejen a juicio del Defensor del Pueblo.\n> Dos. La negativa o negligencia del funcionario o de sus superiores responsables al envío del informe inicial solicitado podrá ser considerada por el Defensor del Pueblo como **hostil y entorpecedora** de sus funciones, haciéndola pública de inmediato y destacando tal calificación en su informe anual o especial, en su caso, a las Cortes Generales.\n\n> **Artículo diecinueve. (LO 3/1981)**\n> Uno. Todos los poderes públicos están obligados a auxiliar, **con carácter preferente y urgente**, al Defensor del Pueblo en sus investigaciones e inspecciones.\n> Dos. En la fase de comprobación e investigación de una queja o en expediente iniciado de oficio, el Defensor del Pueblo su Adjunto, o la persona en quien él delegue, podrán personarse en cualquier centro de la Administración pública, dependientes de la misma a afectos a un servicio público, para comprobar cuantos datos fueren menester, hacer las entrevistas personales pertinentes o proceder al estudio de los expedientes y documentación necesaria.\n> Tres. A estos efectos no podrá negársele el acceso a ningún expediente o documentación administrativa o que se encuentre relacionada con la actividad o servicio objeto de la investigación, sin perjuicio de lo que se dispone en el artículo veintidós de esta Ley.\n\n> **Artículo veinte. (LO 3/1981)**\n> Uno. Cuando la queja a investigar afectare a la conducta de las personas al servicio de la Administración, en relación con la función que desempeñan, el Defensor del Pueblo dará cuenta de la misma al afectado y a su inmediato superior u Organismo de quien aquél dependiera.\n> Dos. El afectado responderá por escrito, y con la aportación de cuantos documentos y testimonios considere oportunos, en el plazo que se le haya fijado, **que en ningún caso será inferior a diez días**, pudiendo ser prorrogado, a instancia de parte, **por la mitad del concedido**.\n> Tres. El Defensor del Pueblo podrá comprobar la veracidad de los mismos y proponer al funcionario afectado una entrevista ampliatoria de datos. Los funcionarios que se negaren a ello podrán ser requeridos por aquél para que manifiesten por escrito las razones que justifiquen tal decisión.\n> Cuatro. La información que en el curso de una investigación pueda aportar un funcionario a través de su testimonio personal tendrá el carácter de reservada, sin perjuicio de lo dispuesto en la Ley de Enjuiciamiento Criminal sobre la denuncia de hechos que pudiesen revestir carácter delictivo.\n\n> **Artículo veintiuno. (LO 3/1981)**\n> El superior jerárquico u Organismo que prohíba al funcionario a sus órdenes o servicio responder a la requisitoria del Defensor del Pueblo o entrevistarse con él, deberá manifestarlo por escrito, debidamente motivado, dirigido al funcionario y al propio Defensor del Pueblo. El Defensor del Pueblo dirigirá en adelante cuantas actuaciones investigadoras sean necesarias al referido superior jerárquico.\n\n=> Qué: Cómo investiga una queja admitida\n=> Quién: \n=> - El organismo afectado, que debe informar\n=> - «Todos los poderes públicos están obligados a auxiliar, con carácter preferente y urgente, al Defensor del Pueblo»\n=> - El funcionario investigado y su superior\n=> Cómo: \n=> - Investigación «sumaria e informal» con petición de informe escrito (18.1)\n=> - No enviar el informe puede considerarse **hostil y entorpecedor** y hacerse público (18.2)\n=> - Puede personarse en cualquier centro de la Administración (19.2) y no se le puede negar el acceso a ningún expediente, salvo lo previsto para los secretos (19.3)\n=> - Lo que aporte un funcionario con su testimonio es **reservado** (20.4)\n=> - Si el superior prohíbe colaborar, debe hacerlo por escrito motivado; el Defensor se dirige entonces a él (21)\n=> Plazos y mayorías: \n=> - Informe del organismo: **15 días**, ampliable (18.1)\n=> - Respuesta del funcionario: **no menos de 10 días**, prorrogable **por la mitad** (20.2)\n=> ⚠ Ojo en el examen: **15** días el organismo; **no menos de 10** el funcionario.\n\n### 5.2 Documentos y reserva (art. 22)\n\n> **Artículo veintidós. (LO 3/1981)**\n> Uno. El Defensor del Pueblo podrá solicitar a los poderes públicos todos los documentos que considere necesarios para el desarrollo de su función, incluidos aquéllos clasificados con el carácter de secretos de acuerdo con la ley. En este último supuesto la no remisión de dichos documentos **deberá ser acordada por el Consejo de Ministros** y se acompañará una certificación acreditativa del acuerdo denegatorio.\n> Dos. Las investigaciones que realice el Defensor del Pueblo y el personal dependiente del mismo, así como los trámites procedimentales, se verificarán dentro de **la más absoluta reserva**, tanto con respecto a los particulares como a las dependencias y demás Organismos públicos, sin perjuicio de las consideraciones que el Defensor del Pueblo considere oportuno incluir en sus informes a las Cortes Generales. Se dispondrán medidas especiales de protección en relación con los documentos clasificados como secretos.\n> Tres. Cuando entienda que un documento declarado secreto y no remitido por la Administración pudiera afectar de forma decisiva a la buena marcha de su investigación, lo pondrá en conocimiento de la Comisión Mixta Congreso-Senado a que se refiere el artículo 2.° de esta Ley.\n\n=> Qué: Acceso a documentos, incluidos los secretos\n=> Quién: El Defensor pide; el **Consejo de Ministros** puede denegar los secretos\n=> Cómo: \n=> - Puede pedir todos los documentos necesarios, también los **secretos** (22.1)\n=> - La no remisión la acuerda el **Consejo de Ministros**, con certificación del acuerdo (22.2)\n=> - Investigaciones con la **más absoluta reserva** (22.3)\n=> - Si un secreto no remitido puede afectar decisivamente a la investigación, lo comunica a la **Comisión Mixta** (22.4)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Documentos secretos: decide el **Consejo de Ministros** (no un ministro).\n\n### 5.3 Consecuencias de la investigación (arts. 23 a 27)\n\n> **Artículo veintitrés. (LO 3/1981)**\n> Cuando las actuaciones practicadas revelen que la queja ha sido originada presumiblemente por el abuso, arbitrariedad, discriminación, error, negligencia u omisión de un funcionario, el Defensor del Pueblo podrá dirigirse al afectado haciéndole constar su criterio al respecto. Con la misma fecha dará traslado de dicho escrito al superior jerárquico, formulando las sugerencias que considere oportunas.\n\n> **Artículo veinticuatro. (LO 3/1981)**\n> Uno. La persistencia en una actitud hostil o entorpecedora de la labor de investigación del Defensor del Pueblo por parte de cualquier Organismo, funcionarios, directivo o persona al servicio de la Administración pública podrá ser objeto de un **informe especial**, además de destacarlo en la sección correspondiente de su informe anual.\n> Dos. (Derogado)\n\n> **Artículo veinticinco. (LO 3/1981)**\n> Uno. Cuando el Defensor del Pueblo, en razón del ejercicio de las funciones propias de su cargo, tenga conocimiento de una conducta o hechos presumiblemente delictivos lo pondrá de inmediato en conocimiento del **Fiscal General del Estado**.\n> Dos. En cualquier caso, el Fiscal General del Estado informará periódicamente al Defensor del Pueblo, o cuando éste lo solicite, del trámite en que se hallen las actuaciones iniciadas a su instancia.\n> Tres. El Fiscal General del Estado pondrá en conocimiento del Defensor del Pueblo todas aquellas posibles irregularidades administrativas de que tenga conocimiento el Ministerio Fiscal en el ejercicio de sus funciones.\n\n> **Artículo veintiséis. (LO 3/1981)**\n> El Defensor del Pueblo podrá, **de oficio**, ejercitar la acción de responsabilidad contra todas las autoridades, funcionarios y agentes civiles del orden gubernativo o administrativo, incluso local, sin que sea necesaria en ningún caso la previa reclamación por escrito.\n\n> **Artículo veintisiete. (LO 3/1981)**\n> Los gastos efectuados o perjuicios materiales causados a los particulares que no hayan promovido la queja al ser llamados a informar por el Defensor del Pueblo, serán correspondidos con cargo a su presupuesto una vez justificados debidamente.\n\n=> Qué: Qué hace si encuentra irregularidades\n=> Quién: El Defensor; el **Fiscal General del Estado**, ante delitos\n=> Cómo: \n=> - Abuso, arbitrariedad, discriminación, error, negligencia u omisión de un funcionario: se dirige a él y traslada su criterio al superior (23)\n=> - Actitud hostil persistente: **informe especial** y mención en el informe anual (24.1; el 24.2 está derogado)\n=> - Hechos delictivos: al **Fiscal General del Estado**, que le informa periódicamente (25)\n=> - Acción de **responsabilidad** de oficio contra autoridades, funcionarios y agentes civiles, «sin que sea necesaria en ningún caso la previa reclamación por escrito» (26)\n=> - Resarce a los particulares llamados a informar que no promovieron la queja (27)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Delitos: al **Fiscal General del Estado** (no al juez).","nivel":2},{"id":"s7-4","title":"IV.6 Resoluciones, informes y medios (arts. 28 a 37, DT y DF única)","body":"### 6.1 Las resoluciones (arts. 28 a 31)\n\n> **Artículo veintiocho. (LO 3/1981)**\n> Uno. El Defensor del Pueblo, **aun no siendo competente para modificar o anular** los actos y resoluciones de la Administración Pública, podrá, sin embargo, sugerir la modificación de los criterios utilizados para la producción de aquéllos.\n> Dos. Si como consecuencia de sus investigaciones llegase al convencimiento de que el cumplimiento riguroso de la norma puede provocar situaciones injustas o perjudiciales para los administrados, podrá sugerir al órgano legislativo competente o a la Administración la modificación de la misma.\n> Tres. Si las actuaciones se hubiesen realizado con ocasión de servicios prestados por particulares en virtud de acto administrativo habilitante, el Defensor del Pueblo podrá instar de las autoridades administrativas competentes el ejercicio de sus potestades de inspección y sanción.\n\n> **Artículo veintinueve. (LO 3/1981)**\n> El Defensor del Pueblo está legitimado para interponer los **recursos de inconstitucionalidad y de amparo**, de acuerdo con lo dispuesto en la Constitución y en la Ley Orgánica del Tribunal Constitucional.\n\n> **Artículo treinta. (LO 3/1981)**\n> Uno. El Defensor del Pueblo, con ocasión de sus investigaciones, podrá formular a las autoridades y funcionarios de las Administraciones Públicas **advertencias, recomendaciones, recordatorios de sus deberes legales y sugerencias** para la adopción de nuevas medidas. En todos los casos, las autoridades y los funcionarios vendrán obligados a responder por escrito **en término no superior al de un mes**.\n> Dos. Si formuladas sus recomendaciones dentro de un plazo razonable no se produce una medida adecuada en tal sentido por la autoridad administrativa afectada o éste no informa al Defensor del Pueblo de las razones que estime para no adoptarlas, el Defensor del Pueblo podrá poner en conocimiento del Ministro del Departamento afectado, o sobre la máxima autoridad de la Administración afectada, los antecedentes del asunto y las recomendaciones presentadas. Si tampoco obtuviera una justificación adecuada, incluirá tal asunto en su informe anual o especial con mención de los nombres de las autoridades o funcionarios que hayan adoptado tal actitud entre los casos en que considerando el Defensor del Pueblo que era posible una solución positiva, ésta no se ha conseguido.\n\n> **Artículo treinta y uno. (LO 3/1981)**\n> Uno. El Defensor del Pueblo informará al interesado del resultado de sus investigaciones y gestión así como de la respuesta que hubiese dado la Administración o funcionario implicados, salvo en el caso de que éstas, por su naturaleza, fuesen consideradas como de carácter reservado o declaradas secretas.\n> Dos. Cuando en intervención se hubiere iniciado de acuerdo con lo dispuesto en el apartado dos del artículo diez, el Defensor del Pueblo informará al parlamentario o Comisión competente que lo hubiese solicitado y al término de sus investigaciones, de los resultados alcanzados. Igualmente, cuando decida no intervenir informará razonando su desestimación.\n> Tres. El Defensor del Pueblo comunicará el resultado positivo o negativo de sus investigaciones a la autoridad, funcionario o dependencia administrativa acerca de la cual se haya suscitado,\n\n=> Qué: Qué puede hacer con el resultado: persuadir, no anular\n=> Quién: \n=> - Autoridades y funcionarios, que deben responder\n=> - El interesado, el parlamentario o comisión que lo pidió y la autoridad afectada reciben el resultado (31)\n=> Cómo: \n=> - **No** modifica ni anula actos; puede sugerir cambiar los criterios (28.1)\n=> - Si una norma provoca situaciones injustas, sugiere su **modificación** (28.2)\n=> - Servicios prestados por particulares: insta a las autoridades a inspeccionar y sancionar (28.3)\n=> - Legitimado para los recursos de **inconstitucionalidad y amparo** (29 → II.2.3)\n=> - Formula **advertencias, recomendaciones, recordatorios de sus deberes legales y sugerencias** (30.1)\n=> - Sin respuesta: acude al **Ministro** o máxima autoridad y, si sigue sin justificación, lo incluye en su informe **con nombres** (30.2)\n=> Plazos y mayorías: Respuesta a sus resoluciones: **un mes** como máximo (30.1)\n=> ⚠ Ojo en el examen: Cuatro tipos de resolución: advertencias, recomendaciones, recordatorios y sugerencias. **Ninguna vinculante**.\n\n### 6.2 Los informes a las Cortes (arts. 32 y 33)\n\n> **Artículo treinta y dos. (LO 3/1981)**\n> Uno. El Defensor del Pueblo dará cuenta anualmente a las Cortes Generales de la gestión realizada en un informe que presentará ante las mismas **cuando se hallen reunidas en periodo ordinario de sesiones**.\n> Dos. Cuando la gravedad o urgencia de los hechos lo aconsejen podrá presentar un informe extraordinario que dirigirá a las **Diputaciones Permanentes** de las Cámaras si éstas no se encontraran reunidas.\n> Tres. Los informes anuales y, en su caso los extraordinarios, serán publicados.\n\n> **Artículo treinta y tres. (LO 3/1981)**\n> Uno. El Defensor del Pueblo en su informe anual dará cuenta del número y tipo de quejas presentadas; de aquellas que hubiesen sido rechazadas y sus causas, así como de las que fueron objeto de investigación y el resultado de las mismas, con especificación de las sugerencias o recomendaciones admitidas por las Administraciones Públicas.\n> Dos. En el informe no constarán datos personales que permitan la pública identificación de los interesados en el procedimiento investigador, sin perjuicio de lo dispuesto en el artículo veinticuatro punto uno.\n> Tres. El informe contendrá igualmente un anexo, cuyo destinatario serán las Cortes Generales, en el que se hará constar la liquidación del presupuesto de la institución en el periodo que corresponda.\n> Cuatro. **Un resumen del informe será expuesto oralmente** por el Defensor del Pueblo ante los Plenos de ambas Cámaras, pudiendo intervenir los grupos parlamentarios a efectos de fijar su postura.\n\n=> Qué: Cómo da cuenta a las Cortes\n=> Quién: Las **Cortes Generales**; si no están reunidas, las **Diputaciones Permanentes** (informe extraordinario)\n=> Cómo: \n=> - **Anual**, en periodo ordinario de sesiones (32.1)\n=> - **Extraordinario**, por gravedad o urgencia (32.2)\n=> - Los informes se **publican** (32.3)\n=> - Contenido del anual (33): quejas presentadas, rechazadas y sus causas, investigadas y su resultado; **sin datos personales**; anexo con la **liquidación del presupuesto**\n=> - «Un resumen del informe será expuesto oralmente por el Defensor del Pueblo ante los Plenos de ambas Cámaras», con intervención de los grupos (33.4)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Exposición **oral** de un **resumen** ante los **Plenos** de ambas Cámaras.\n\n### 6.3 Medios personales y económicos (arts. 34 a 37)\n\n> **Artículo treinta y cuatro. (LO 3/1981)**\n> El Defensor del Pueblo podrá designar libremente los asesores necesarios para el ejercicio de sus funciones, de acuerdo con el Reglamento y dentro de los límites presupuestarios.\n\n> **Artículo treinta y cinco. (LO 3/1981)**\n> Uno. Las personas que se encuentren al servicio del Defensor del Pueblo, y mientras permanezcan en el mismo, se considerarán como **persona al servicio de las Cortes**.\n> Dos. En los casos de funcionarios provenientes de la Administración Pública se les reservará la plaza y destino que ocupasen con anterioridad a su adscripción a la oficina del Defensor del Pueblo, y se les computará, a todos los efectos, el tiempo transcurrido en esta situación.\n\n> **Artículo treinta y seis. (LO 3/1981)**\n> Los adjuntos y asesores **cesarán automáticamente** en el momento de la toma de posesión de un nuevo Defensor del Pueblo destinado por las Cortes.\n\n> **Artículo treinta y siete. (LO 3/1981)**\n> La dotación económica necesaria para el funcionamiento de la institución constituirá una partida dentro de los **Presupuestos de las Cortes Generales**.\n\n=> Qué: Personal y presupuesto\n=> Quién: \n=> - Asesores: los designa **libremente** (34)\n=> - Su personal es **personal al servicio de las Cortes**; los funcionarios conservan plaza y destino (35)\n=> Cómo: \n=> - «Los adjuntos y asesores cesarán automáticamente en el momento de la toma de posesión de un nuevo Defensor del Pueblo» (36)\n=> - Presupuesto: una **partida** de los Presupuestos de las **Cortes Generales** (37)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: \n=> - Presupuesto: dentro de los de las **Cortes Generales**, no sección propia de los PGE\n=> - *Así en el BOE:* el art. 36 dice «destinado por las Cortes»; el art. 31.3 termina en coma\n\n### 6.4 Disposición transitoria y Mecanismo Nacional de Prevención de la Tortura (DF única)\n\n> **Disposición transitoria. (LO 3/1981)**\n> A los cinco años de entrada en vigor de la presente Ley, el Defensor del Pueblo podrá proponer a las Cortes Generales y en informe razonado aquellas modificaciones que entienda que deben realizarse a la misma.\n\n> **Disposición final única. Mecanismo Nacional de Prevención de la Tortura. (LO 3/1981)**\n> Primero. El Defensor del Pueblo ejercerá las funciones del **Mecanismo Nacional de Prevención de la Tortura** de conformidad con la Constitución, la presente Ley y el Protocolo facultativo de la Convención contra la tortura u otros tratos o penas crueles, inhumanos o degradantes.\n> Segundo. Se crea un **Consejo Asesor** como órgano de cooperación técnica y jurídica en el ejercicio de las funciones propias del Mecanismo Nacional de Prevención, que será presidido por el Adjunto en el que el Defensor del Pueblo delegue las funciones previstas en esta disposición. El Reglamento determinará su estructura, composición y funcionamiento.\n\n=> Qué: El Defensor como **Mecanismo Nacional de Prevención de la Tortura** (MNPT)\n=> Quién: \n=> - El Defensor del Pueblo «ejercerá las funciones del Mecanismo Nacional de Prevención de la Tortura»\n=> - Un **Consejo Asesor**, «que será presidido por el Adjunto en el que el Defensor del Pueblo delegue las funciones previstas en esta disposición»\n=> Cómo: Conforme al Protocolo facultativo de la Convención contra la tortura\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: La introdujo la reforma de **2009**, la última de la ley. El Consejo Asesor lo preside el **Adjunto en quien delegue**, no el Defensor.","nivel":2},{"id":"s7-6","title":"IV.7 Los defensores autonómicos (Ley 36/1985)","body":"Muchos Estatutos de Autonomía crean figuras similares al Defensor del Pueblo. Sus relaciones con él las regula la **Ley 36/1985, de 6 de noviembre** (BOE-A-1985-23210), ley **ordinaria** **no modificada**, que desarrolla la coordinación del art. 12.2 LO 3/1981 (→ IV.4.4).\n\n### 7.1 Estatuto de los comisionados autonómicos (art. 1)\n\n> **Artículo primero. (Ley 36/1985)**\n> 1. Los titulares de las Instituciones autonómicas similares al Defensor del Pueblo, **Comisionados territoriales de las respectivas Asambleas Legislativas**, gozarán, durante el ejercicio de su cargo, de las garantías de inviolabilidad e inmunidad que se otorgan a los miembros de aquéllas en los respectivos Estatutos de Autonomía.\n> El aforamiento especial se entenderá referido a la **Sala correspondiente de los Tribunales Superiores de Justicia** en cada ámbito territorial.\n> 2. Serán igualmente aplicables a dichas instituciones autonómicas, siempre dentro del respectivo ámbito de competencia estatutaria, las siguientes garantías establecidas en la Ley Orgánica 3/1981, de 6 de abril, para el Defensor del Pueblo:\n> a) Las preceptuadas en los artículos 16 (inviolabilidad de la correspondencia y otras comunicaciones), 19 (cooperación de los Poderes Públicos), 24 (medidas en caso de entorpecimiento o resistencia a la actuación investigadora) y 26 (ejercicio de acciones de responsabilidad).\n> b) La contenida en el artículo 25.2 de la misma Ley (denuncia de infracciones e irregularidades), entendiéndose que, en tales casos, la relación del Comisionado parlamentario autonómico será con el Fiscal que corresponda en el respectivo ámbito territorial.\n> c) Cuando los supuestos previstos en el apartado anterior hagan referencia a actividades de las Administraciones públicas no autonómicas, el Comisionado parlamentario de la Comunidad Autónoma notificará al Defensor del Pueblo las infracciones e irregularidades que haya observado. El Defensor del Pueblo, atendiendo dicha información, podrá intervenir en uso de las facultades que le confiere la Ley Orgánica 3/1981, de 6 de abril, e informar al respectivo Comisionado parlamentario de sus gestiones ante el Fiscal General del Estado y del resultado de la misma.\n> 3. Las prerrogativas y garantías que se reconocen a los Comisionados parlamentarios autonómicos serán también aplicables, en su caso, a los Adjuntos durante el ejercicio de sus funciones.\n> 4. La declaración de los estados de excepción o de sitio **no interrumpirán la actividad de los Comisionados** de los Parlamentos autonómicos, ni el derecho de las personas afectadas de acceder ellos, siempre dentro del respeto a lo preceptuado en los artículos 55 y 116 de la Constitución y en las Leyes Orgánicas que los desarrollan.\n\n=> Qué: Las garantías de los defensores autonómicos\n=> Quién: \n=> - «Comisionados territoriales de las respectivas Asambleas Legislativas»\n=> - Sus **Adjuntos**, con las mismas prerrogativas (1.3)\n=> Cómo: \n=> - Inviolabilidad e inmunidad: las de los miembros de su **Asamblea** autonómica\n=> - Aforamiento: «la Sala correspondiente de los Tribunales Superiores de Justicia en cada ámbito territorial»\n=> - Se les aplican los arts. **16, 19, 24 y 26** LO 3/1981 y el **25.2** (este, con el **Fiscal** de su ámbito territorial) (1.2 a y b)\n=> - Irregularidades de Administraciones **no autonómicas**: las notifican al Defensor del Pueblo (1.2 c)\n=> - No se interrumpe su actividad en los estados de **excepción o de sitio** (1.4)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: \n=> - Fuero autonómico: **TSJ**. Fuero del Defensor del Pueblo: **Tribunal Supremo**\n=> - *Así en el BOE:* el art. 1.4 dice «el derecho de las personas afectadas de acceder ellos»\n\n### 7.2 Cooperación con el Defensor del Pueblo (art. 2 y disposición adicional)\n\n> **Artículo segundo. (Ley 36/1985)**\n> 1. La protección de los derechos y libertades reconocidos en el Título I de la Constitución y la supervisión, a estos efectos, de la actividad de la Administración pública propia de cada Comunidad Autónoma, así como de las Administraciones de los Entes Locales, cuando actúen en ejercicio de **competencias delegadas** por aquélla, se podrá realizar, de oficio o a instancia de parte, por el Defensor del Pueblo y el Comisionado parlamentario autonómico en régimen de cooperación, según lo establecido en el apartado segundo de este artículo, en todo aquello que afecte a materias sobre las cuales se atribuyan competencias a la Comunidad Autónoma en la Constitución y en el respectivo Estatuto de Autonomía y sin mengua de lo establecido en cuanto a facultades del Defensor del Pueblo por la Constitución y por la Ley Orgánica 3/1981, de 6 de abril.\n> 2. A fin de desarrollar y concretar adecuadamente la colaboración y coordinación entre el Defensor del Pueblo y los Comisionados parlamentarios autonómicos, **se concertarán entre ellos acuerdos** sobre los ámbitos de actuación de las Administraciones públicas objeto de supervisión, los supuestos de actuación de los Comisionados parlamentarios, las facultades que puedan ejercitar, el procedimiento de comunicación entre el Defensor del Pueblo y cada uno de dichos Comisionados parlamentarios, y la duración de los propios acuerdos.\n> 3. En la supervisión de la actividad de órganos de la Administración pública estatal, que radiquen en el territorio de cada Comunidad Autónoma, el Defensor del Pueblo **podrá recabar la colaboración del respectivo Comisionado parlamentario** para la mejor eficacia de sus gestiones y recibirá de él las quejas que le hubieran sido remitidas sobre la actividad de dichos órganos de la Administración pública estatal. A su vez, el Defensor del Pueblo podrá informar al Comisionado parlamentario autonómico del resultado de sus gestiones.\n\n> **Disposición adicional. (Ley 36/1985)**\n> A los Comisionados parlamentarios a los que se refiere la presente Ley, así como a sus Adjuntos, que ostentasen al momento del nombramiento la condición de funcionario público en situación administrativa de activo, les será de aplicación lo dispuesto en el artículo 29.2.e) de la Ley 30/1984, de 2 de agosto, pasando a la situación administrativa de **servicios especiales** en su Cuerpo o Escala de procedencia, mientras se encuentren desempeñando tal cargo.\n\n=> Qué: Cómo se coordinan las dos instituciones\n=> Quién: El Defensor del Pueblo y cada comisionado autonómico\n=> Cómo: \n=> - Cooperan en la supervisión de la Administración **autonómica** y de los **Entes Locales** cuando actúen por «competencias delegadas» de la Comunidad (2.1)\n=> - Conciertan **acuerdos** sobre ámbitos de actuación, facultades, comunicación y duración (2.2)\n=> - Administración del Estado en la Comunidad: el Defensor del Pueblo puede **recabar la colaboración** del comisionado autonómico y recibe de él las quejas (2.3)\n=> - Funcionarios en activo nombrados comisionados: **servicios especiales** (DA)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Sobre la Administración **del Estado**, la competencia sigue siendo del **Defensor del Pueblo**; el autonómico colabora.","nivel":2},{"id":"s7-5","title":"IV.8 La institución hoy (dato que caduca)","body":"- **Titular:** **Ángel Gabilondo Pujol**, que tomó posesión el **18 de noviembre de 2021**. Su mandato de cinco años (art. 2.1) **vence en noviembre de 2026**: comprobar la renovación.\n- **Adjuntas:** **M.ª Teresa Jiménez-Becerril** (Adjunta Primera) y **Patricia Bárcena García** (Adjunta Segunda), elegidas el 30 de noviembre de 2021.\n- **Informe anual 2025** (presentado en 2026): **38.144 quejas** (3.742 más que en 2024), **253 actuaciones de oficio** y **365 solicitudes** de interposición de recursos de inconstitucionalidad y amparo, en total **38.762 expedientes**.\n\nFuentes: notas de prensa de defensordelpueblo.es y prensa, consultadas el 2-10-2026. Revisar antes del examen.\n\n@> **▸ En resumen.**\n@> • El Defensor del Pueblo es **alto comisionado de las Cortes Generales** para defender los derechos del Título I **supervisando a la Administración** (art. 54).\n@> • Elección: Comisión Mixta propone; **3/5 del Congreso** y ratificación por **3/5 del Senado**; si no, en **un mes**, 3/5 del Congreso y **mayoría absoluta del Senado**. Mandato de **5 años**.\n@> • Persuade, no anula: advertencias, recomendaciones, recordatorios y sugerencias; respuesta en **un mes**; informe anual a las Cortes.\n@> • Está legitimado para la **inconstitucionalidad**, el **amparo** y el ***habeas corpus*** (bloque II) y no se detiene en **excepción ni sitio** (bloque III).\n@> **→ Fin del tema. Para fijarlo: Cierre 1 (preguntas reales de 2025) y Cierre 2 (repaso por bloques); después, el test.**","nivel":2},{"id":"s8","title":"Cierre 1. Preguntas del examen de 2025 sobre este tema","body":"En el primer ejercicio de **2025 (GACE-L, 100 preguntas + 5 de reserva)** cayeron **dos** preguntas de este tema y **una** relacionada. Aquí están **literales**. Pulsa la opción que creas correcta: se marca en verde o en rojo y aparece el porqué de cada opción. La respuesta de la plantilla se ha comprobado contra el texto legal.\n\n### Pregunta 1 · Título I (→ I.1.1)\n\n%> **📋 Pregunta real · GACE-L 2025 · 1.er ejercicio · n.º 1**\n%> «El Título I de la Constitución Española de 1978 se denomina:»\n%> [x] a) De los derechos y deberes fundamentales. || Es la rúbrica literal del Título I: «De los derechos y deberes fundamentales» (arts. 10 a 55).\n%> [ ] b) De los derechos y deberes de los ciudadanos. || «De los derechos y deberes de los ciudadanos» es la rúbrica de la **Sección 2.ª** del Capítulo segundo (arts. 30 a 38), no la del Título.\n%> [ ] c) De los españoles y los extranjeros. || «De los españoles y los extranjeros» es la rúbrica del **Capítulo primero** (arts. 11 a 13).\n%> [ ] d) Derechos y libertades. || «Derechos y libertades» es la rúbrica del **Capítulo segundo** (arts. 14 a 38).\n%> = **Respuesta correcta: a)**, según la plantilla definitiva de respuestas, y coherente con el texto legal citado.\n\n### Pregunta 2 · Elección del Defensor del Pueblo (→ IV.2.1)\n\n%> **📋 Pregunta real · GACE-L 2025 · 1.er ejercicio · n.º 2**\n%> «Según el artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, si en el procedimiento inicial no se alcanzan las mayorías exigidas para la elección del Defensor del Pueblo:»\n%> [ ] a) Se convoca directamente un nuevo Pleno conjunto de las Cortes Generales, y el candidato será designado por mayoría absoluta de ambas Cámaras. || No existe ningún «Pleno conjunto»: el art. 2.5 manda volver a la Comisión Mixta: «se procederá en nueva sesión de la Comisión». Tampoco se exige mayoría absoluta en las dos Cámaras.\n%> [ ] b) Se convoca directamente un nuevo Pleno conjunto de las Cortes Generales, y el candidato será designado por mayoría simple de ambas Cámaras. || Mismo error que la a): no hay «Pleno conjunto». Y la designación nunca se hace por mayoría simple de las Cámaras: la mayoría simple solo rige para los acuerdos de la Comisión («Los acuerdos de la Comisión se adoptarán por mayoría simple», art. 2.3).\n%> [x] c) Se procede a una nueva sesión de la Comisión Mixta Congreso-Senado y, en el plazo máximo de un mes, se formulan sucesivas propuestas; una vez obtenidos tres quintos en el Congreso, la designación queda realizada al alcanzarse mayoría absoluta en el Senado. || Reproduce el art. 2.5: «en el plazo máximo de un mes, a formular sucesivas propuestas»; «una vez conseguida la mayoría de los tres quintos en el Congreso, la designación quedará realizada al alcanzarse la mayoría absoluta del Senado».\n%> [ ] d) Se procede a una nueva sesión de la Comisión Mixta Congreso-Senado y, en el plazo máximo de quince días, se formulan sucesivas propuestas; una vez obtenidos tres quintos en el Congreso, la designación queda realizada al alcanzarse mayoría simple en el Senado. || Cambia dos datos: «un mes» por «quince días» y «mayoría absoluta» por «mayoría simple» en el Senado.\n%> = **Respuesta correcta: c)**, según la plantilla definitiva de respuestas, y coherente con el texto legal citado.\n\n### Pregunta 10 · Jurisdicción militar y estado de sitio (relacionada; → III.6.2)\n\n%> **📋 Pregunta real · GACE-L 2025 · 1.er ejercicio · n.º 10**\n%> «Según el artículo 3.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿en qué ámbito administran Justicia los órganos de la jurisdicción militar?»\n%> [ ] a) En cualquiera en el que estén implicados los miembros de las Fuerzas Armadas, con independencia de su naturaleza. || Demasiado amplia: la jurisdicción militar no alcanza a todo asunto con militares implicados. La Constitución la ciñe «en el ámbito estrictamente castrense y en los supuestos de estado de sitio» (art. 117.5 CE).\n%> [x] b) En el estrictamente castrense y, en su caso, en las materias que establezca la declaración del estado de sitio. || Coincide con el criterio del art. 117.5 CE (ámbito estrictamente castrense y estado de sitio) y conecta con el art. 35 LO 4/1981: el Congreso puede determinar «los delitos que durante su vigencia quedan sometidos a la Jurisdicción Militar».\n%> [ ] c) Únicamente en el disciplinario militar, con exclusión de las materias penales y procesales. || Demasiado estrecha: no se limita a lo disciplinario ni excluye lo penal; el art. 35 LO 4/1981 le atribuye precisamente **delitos** durante el estado de sitio.\n%> [ ] d) Exclusivamente en el del estado de sitio. || Olvida el ámbito **estrictamente castrense**, que es el principal; el estado de sitio es solo el supuesto añadido («en su caso»).\n%> = **Respuesta correcta: b)**, según la plantilla definitiva de respuestas, y coherente con el texto legal citado.\n\n*Pendiente:* no tengo aportado el texto literal del art. 3.2 LOPJ, así que la explicación se apoya en el art. 117.5 CE y en el art. 35 LO 4/1981. Si me pasas la LOPJ (BOE-A-1985-12666), cito el artículo exacto.\n\n### Cómo se pregunta\n\nCasi todas las preguntas empiezan por «Según el artículo X…». Las cuatro opciones comparten estructura y difieren en **un plazo, una mayoría, un órgano o una palabra** (en la 2: «un mes» frente a «quince días», «absoluta» frente a «simple»). Por eso hay que estudiar el **texto literal**.\n\n**Plantilla:** *Plantilla definitiva de respuestas del primer ejercicio* (GACE-L 2025). Respecto a la provisional, solo cambia la pregunta 82, que queda **anulada**; las de este tema no cambian.","nivel":1},{"id":"s9","title":"Cierre 2. Repaso en 10 minutos (por bloques)","body":"### I. Qué derechos y deberes hay\n\n| Artículo | Dato literal clave | Trampa típica |\n|---|---|---|\n| Título I | «De los derechos y deberes fundamentales» (arts. 10-55) | Confundirlo con las rúbricas de capítulos y secciones |\n| 10.2 | DUDH y tratados «ratificados por España» | «firmados» |\n| 11.2 | «Ningún español **de origen**…» | Quitar «de origen» |\n| 13.2 | Sufragio **activo y pasivo** en elecciones **municipales**, por reciprocidad | Generales o autonómicas |\n| 13.3 | Terrorismo no es delito político | — |\n| 14 | «nacimiento, raza, sexo, religión, opinión…» | Añadir «ideología» o «edad» |\n| 15 | Pena de muerte: salvo leyes penales militares **para tiempos de guerra** | «estado de sitio» |\n| 17.2 | **72 horas** | 48 h / 24 h |\n| 17.3 | Informado «de forma inmediata» | «en 24 horas» |\n| 18.2 | Consentimiento, resolución judicial o **flagrante delito** | — |\n| 18.3 | Comunicaciones: solo **resolución judicial** | Añadir «flagrante delito» |\n| 20.5 | Secuestro solo por **resolución judicial** | Gobierno o autoridad gubernativa |\n| 21 | Sin autorización; **comunicación previa** en tránsito público | «autorización previa» |\n| 22 | Registro **a efectos de publicidad**; disolución por **resolución judicial motivada** | «efectos constitutivos» |\n| 23.2 | «con los requisitos que señalen las leyes» | «mérito y capacidad» (art. 103.3) |\n| 25.3 | Sin sanción privativa de libertad «directa o subsidiariamente» | — |\n| 27.4 | Básica **obligatoria y gratuita** | — |\n| 28.1 | Limitar o exceptuar: **Fuerzas o Institutos armados** | «jueces» (art. 127) |\n| 29.2 | Militares: petición **sólo individualmente** | — |\n| 31.1 | Sistema tributario: «en ningún caso, tendrá alcance **confiscatorio**» | «nunca confiscatorio» no es literal |\n| 34.2 | Fundaciones: **apartados 2 y 4 del art. 22** | 3 y 4 |\n| 47 | Comunidad participa en las **plusvalías** | — |\n| 50 | Pensiones **adecuadas y periódicamente actualizadas** | — |\n\n### II. Cómo se protegen\n\n| Artículo | Dato literal clave | Trampa típica |\n|---|---|---|\n| 53.1 | Tutela del Capítulo II por el **art. 161, 1, a)** | 161.1.b |\n| 53.2 | **Preferencia y sumariedad**; amparo; también **objeción de conciencia** | Sección 2.ª entera |\n| 81.2 | LO: **mayoría absoluta del Congreso** en votación final | 3/5 |\n| 86.1 | El decreto-ley no afecta a **todo el Título I** | Solo la Sección 1.ª |\n| 169 | No se inicia la reforma en guerra ni con estados del 116 | — |\n| LJCA, art. 115.1 | Amparo judicial: **10 días** (inactividad: tras **20 días**) | 2 meses (plazo general) |\n| LJCA, arts. 116-121 | Expediente **5 días**; demanda **8**; alegaciones **8**; prueba **≤ 20**; sentencia **5** | — |\n| LJCA, art. 122 | Reuniones: recurso en **48 horas**; audiencia en **4 días**; sin ulterior recurso | 72 horas |\n| LOTC, art. 41 | Amparo: arts. **14 a 29** + objeción de conciencia (**30**) | 14 a 38 |\n| LOTC, arts. 42-44 | Parlamentos **3 meses** (actos firmes); Gobierno **20 días**; jueces **30 días** | Intercambiar 20 y 30 |\n| LOTC, art. 46 | Art. 42: **directamente afectada** + DP + MF; arts. 43-44: **parte en el proceso** + DP + MF | — |\n| LOTC, art. 50 | Admisión: **Sección, unanimidad, providencia**; súplica solo del **MF** en **3 días** | Auto / mayoría |\n| LOTC, art. 56.1 | El amparo **no suspende** | — |\n| LO 6/1984, art. 2 | Juez de Instrucción **del lugar donde esté** el detenido; 55.2: **Juez Central de Instrucción** | Lugar de la detención |\n| LO 6/1984, arts. 4 y 7 | Sin Abogado ni Procurador; resolver en **24 horas** desde el auto de incoación | 72 horas |\n\n### III. Cuándo pueden suspenderse\n\n| Artículo | Dato literal clave | Trampa típica |\n|---|---|---|\n| 55.1 | 17, 18.2-3, 19, 20.1 a) d) y 5, 21, 28.2, 37.2; **17.3 no en excepción** | Asociación (22) |\n| 55.2 | 17.2, 18.2 y 18.3; LO; intervención judicial y control parlamentario | — |\n| 116.2 | Alarma: Gobierno, **15 días**, Congreso «reunido inmediatamente al efecto» | — |\n| 116.3 | Excepción: **previa autorización**; **30 + 30** | — |\n| 116.4 | Sitio: **mayoría absoluta del Congreso**, propuesta **exclusiva** del Gobierno | — |\n| LO 4/1981, art. 2 | La **declaración** entra en vigor «desde el instante mismo de su publicación» | «al día siguiente» |\n| LO 4/1981, art. 7 | Alarma: Gobierno o, **por delegación**, Presidente de la CA | — |\n| LO 4/1981, art. 11.c | Ocupación de locales **salvo domicilios privados** | — |\n| LO 4/1981, art. 16 | Detención en excepción: **10 días**, juez en **24 h** | 72 h |\n| LO 4/1981, art. 20.3 | Desplazamientos: aviso con **2 días** | — |\n| LECrim, art. 520 bis | Terrorismo: **72 h + 48 h** (se pide en las primeras 48 h; el Juez decide en 24 h) | 72 + 72 |\n| LECrim, art. 509 | Incomunicación **5 días** + **5** (casos del 384 bis); nunca a **menores de 16** | 10 días / menores de 18 |\n| LECrim, arts. 579.3 y 588 ter d.3 | Urgencia: **Ministro del Interior** o **Secretario de Estado de Seguridad**; juez avisado en **24 h**, confirma o revoca en **72 h** | Ministro de Justicia |\n\n### IV. Quién vela por ellos\n\n| Artículo | Dato literal clave | Trampa típica |\n|---|---|---|\n| LO 3/1981, art. 2 | **5 años**; **3/5 Congreso + 3/5 Senado (20 días)**; después, Comisión **1 mes**, 3/5 Congreso + **mayoría absoluta Senado** | 15 días / mayoría simple |\n| LO 3/1981, art. 5.2 | Vacante por muerte, renuncia o expiración: **Presidente del Congreso** | — |\n| LO 3/1981, art. 6.3 | **Sala de lo Penal del Tribunal Supremo** | TC / Audiencia Nacional |\n| LO 3/1981, art. 10.3 | Las autoridades administrativas **no** pueden quejarse en asuntos de su competencia | — |\n| LO 3/1981, art. 15 | Queja: **1 año**, gratuita, sin Letrado | — |\n| LO 3/1981, art. 18 | Informe del organismo: **15 días** | — |\n| LO 3/1981, art. 28.1 | **No** modifica ni anula actos | — |\n| LO 3/1981, art. 30.1 | Respuesta a recomendaciones: **1 mes** | — |\n| Ley 36/1985, art. 1.1 | Defensores autonómicos: aforados ante el **TSJ** | Tribunal Supremo |","nivel":1}],"glossary":[{"t":"Derechos fundamentales y libertades públicas","d":"Derechos del Capítulo II, Sección 1.ª del Título I (arts. 15-29), con el máximo nivel de protección: ley orgánica, procedimiento preferente y sumario, amparo y reforma agravada.","section":"s3-1","cat":"Título I"},{"t":"Contenido esencial","d":"Núcleo de un derecho del Capítulo II que la ley que regule su ejercicio debe respetar en todo caso (art. 53.1 CE).","section":"s5","cat":"Garantías"},{"t":"Reserva de ley","d":"Exigencia de que el ejercicio de los derechos del Capítulo II solo pueda regularse por ley (art. 53.1 CE).","section":"s5","cat":"Garantías"},{"t":"Ley orgánica","d":"La relativa al desarrollo de los derechos fundamentales y libertades públicas, entre otras; requiere mayoría absoluta del Congreso en votación final sobre el conjunto (art. 81 CE).","section":"s5-1","cat":"Garantías"},{"t":"Recurso de amparo","d":"Recurso ante el TC por violación del art. 14, la Sección 1.ª y la objeción de conciencia (arts. 53.2 y 161.1.b CE). Legitimados: persona natural o jurídica con interés legítimo, Defensor del Pueblo y Ministerio Fiscal.","section":"s5-6","cat":"Garantías"},{"t":"Principios rectores","d":"Capítulo III del Título I (arts. 39-52). Informan la legislación, la práctica judicial y la actuación de los poderes públicos; solo se alegan ante la jurisdicción ordinaria según las leyes que los desarrollen (art. 53.3 CE).","section":"s4-2","cat":"Título I"},{"t":"Detención preventiva","d":"Privación de libertad por el tiempo estrictamente necesario para las averiguaciones; máximo 72 horas antes de libertad o disposición judicial (art. 17.2 CE).","section":"s3-1","cat":"Derechos"},{"t":"Inviolabilidad del domicilio","d":"Ninguna entrada o registro sin consentimiento del titular o resolución judicial, salvo flagrante delito (art. 18.2 CE).","section":"s3-1","cat":"Derechos"},{"t":"Censura previa","d":"Control previo de contenidos prohibido en todo caso por el art. 20.2 CE; tampoco cabe en el estado de excepción (art. 21.2 LO 4/1981).","section":"s3-2","cat":"Derechos"},{"t":"Objeción de conciencia","d":"Derecho del art. 30.2 CE (Sección 2.ª) al que el art. 53.2 extiende el recurso de amparo.","section":"s4","cat":"Derechos"},{"t":"Suspensión general de derechos","d":"Suspensión colectiva de los derechos del art. 55.1 CE al declararse el estado de excepción o de sitio.","section":"s6-1","cat":"Suspensión"},{"t":"Suspensión individual de derechos","d":"Suspensión, por ley orgánica y para personas determinadas, de los arts. 17.2 y 18.2-3 CE en investigaciones sobre bandas armadas o terroristas, con intervención judicial y control parlamentario (art. 55.2 CE).","section":"s6-2","cat":"Suspensión"},{"t":"Estado de alarma","d":"Estado excepcional declarado por el Gobierno, por decreto del Consejo de Ministros, ante catástrofes, crisis sanitarias, paralización de servicios esenciales o desabastecimiento; máximo 15 días prorrogables con autorización del Congreso (art. 116.2 CE; arts. 4-12 LO 4/1981).","section":"s6-4","cat":"Suspensión"},{"t":"Estado de excepción","d":"Estado excepcional que declara el Gobierno, previa autorización del Congreso, cuando el libre ejercicio de los derechos y libertades, el normal funcionamiento de las instituciones democráticas, el de los servicios públicos esenciales o cualquier otro aspecto del orden público resulten tan gravemente alterados que las potestades ordinarias no basten (art. 13.1 LO 4/1981). Máximo 30 días, prorrogables por otro plazo igual (art. 116.3 CE; arts. 13-31 LO 4/1981).","section":"s6-5","cat":"Suspensión"},{"t":"Estado de sitio","d":"Estado excepcional declarado por mayoría absoluta del Congreso, a propuesta exclusiva del Gobierno, ante insurrección o acto de fuerza contra la soberanía, independencia, integridad territorial u orden constitucional (art. 116.4 CE; arts. 32-36 LO 4/1981).","section":"s6-6","cat":"Suspensión"},{"t":"Autoridad competente (estado de alarma)","d":"El Gobierno o, por delegación, el Presidente de la Comunidad Autónoma cuando la declaración afecte solo a su territorio (art. 7 LO 4/1981).","section":"s6-4","cat":"Suspensión"},{"t":"Bando","d":"Disposición publicada por la Autoridad militar en el estado de sitio con las medidas y prevenciones necesarias (art. 34 LO 4/1981).","section":"s6-6","cat":"Suspensión"},{"t":"Defensor del Pueblo","d":"Alto comisionado de las Cortes Generales, designado por éstas para la defensa de los derechos del Título I, a cuyo efecto supervisa la actividad de la Administración (art. 54 CE; art. 1 LO 3/1981).","section":"s7","cat":"Defensor"},{"t":"Comisión Mixta Congreso-Senado de relaciones con el Defensor del Pueblo","d":"Comisión que propone los candidatos a Defensor, da conformidad al nombramiento de los Adjuntos y se relaciona con la institución (art. 2 LO 3/1981).","section":"s7-1","cat":"Defensor"},{"t":"Adjuntos del Defensor del Pueblo","d":"Adjunto Primero y Adjunto Segundo: auxilian al Defensor, pueden recibir delegación y le sustituyen por su orden; nombrados por él con conformidad de las Cámaras (art. 8 LO 3/1981).","section":"s7-2","cat":"Defensor"},{"t":"Inviolabilidad (Defensor del Pueblo)","d":"No puede ser detenido, expedientado, multado, perseguido ni juzgado por las opiniones o actos realizados en el ejercicio de su cargo (art. 6.2 LO 3/1981).","section":"s7-2","cat":"Defensor"},{"t":"Queja","d":"Escrito firmado, con nombre, apellidos y domicilio, presentado en el plazo máximo de un año; gratuito y sin abogado ni procurador (art. 15 LO 3/1981).","section":"s7-3","cat":"Defensor"},{"t":"Actitud hostil y entorpecedora","d":"Calificación que el Defensor puede dar a la negativa o negligencia en remitir el informe solicitado, con posible informe especial (arts. 18.2 y 24 LO 3/1981).","section":"s7-7","cat":"Defensor"},{"t":"Recomendaciones del Defensor","d":"Junto con advertencias, recordatorios de deberes legales y sugerencias, son sus resoluciones; obligan a responder por escrito en un mes como máximo, pero no anulan actos (arts. 28 y 30 LO 3/1981).","section":"s7-4","cat":"Defensor"},{"t":"Mecanismo Nacional de Prevención de la Tortura","d":"Funciones que ejerce el Defensor del Pueblo conforme al Protocolo facultativo de la Convención contra la tortura, con un Consejo Asesor presidido por un Adjunto (disposición final única LO 3/1981).","section":"s7-4","cat":"Defensor"},{"t":"Diputación Permanente","d":"Órgano al que se dirige el Defensor cuando las Cámaras no están reunidas o están disueltas (art. 11 LO 3/1981), y que asume las competencias del Congreso en los estados excepcionales si está disuelto (art. 116.5 CE).","section":"s6-3","cat":"Instituciones"},{"t":"Procedimiento preferente y sumario","d":"Vía ante los tribunales ordinarios para tutelar el art. 14 y la Sección 1.ª, «basado en los principios de preferencia y sumariedad» (art. 53.2 CE). En el orden contencioso-administrativo, arts. 114-122 LJCA: recurso en diez días y tramitación «preferente» a todos los efectos.","cat":"Garantías","section":"s5-4"},{"t":"Habeas corpus","d":"Procedimiento del art. 17.4 CE (LO 6/1984) para obtener la «inmediata puesta a disposición de la Autoridad judicial competente» de cualquier persona detenida ilegalmente.","cat":"Garantías","section":"s5-5"},{"t":"Especial trascendencia constitucional","d":"Requisito de admisión del amparo (arts. 49.1 y 50.1.b LOTC): la demanda debe justificarla. Se aprecia por su importancia para la interpretación, aplicación o eficacia de la Constitución y para el contenido de los derechos fundamentales.","cat":"Garantías","section":"s5-6"},{"t":"Autocuestión de inconstitucionalidad","d":"Término doctrinal para el art. 55.2 LOTC: si el amparo se estima porque la ley aplicada lesiona derechos, la Sala o Sección eleva la cuestión al Pleno.","cat":"Garantías","section":"s5-6"},{"t":"Comisionados parlamentarios autonómicos","d":"Figuras autonómicas similares al Defensor del Pueblo, «Comisionados territoriales de las respectivas Asambleas Legislativas» (art. 1.1 Ley 36/1985). Aforados ante los Tribunales Superiores de Justicia.","cat":"Defensor","section":"s7-6"}],"timeline":[{"y":"1978","txt":"Constitución Española (aprobada el 27-12-1978; BOE de 29-12-1978)","cons":"Título I: derechos, garantías (art. 53), Defensor del Pueblo (art. 54) y suspensión (art. 55)","cat":"normativo","target":"s1"},{"y":"1981","txt":"LO 3/1981, de 6 de abril, del Defensor del Pueblo","cons":"Desarrolla el art. 54 CE","cat":"normativo","target":"s7"},{"y":"1981","txt":"LO 4/1981, de 1 de junio, de los estados de alarma, excepción y sitio (BOE de 5-6-1981)","cons":"Desarrolla el art. 116 CE; vigente sin modificaciones","cat":"normativo","target":"s6-3"},{"y":"1992","txt":"Primera reforma constitucional: art. 13.2","cons":"Sufragio pasivo de extranjeros en elecciones municipales («y pasivo»)","cat":"normativo","target":"s2"},{"y":"2009","txt":"Última modificación de la LO 3/1981 (4 de noviembre de 2009)","cons":"El Defensor del Pueblo asume el Mecanismo Nacional de Prevención de la Tortura","cat":"normativo","target":"s7-4"},{"y":"2010","txt":"RD 1673/2010, de 4 de diciembre: primer estado de alarma","cons":"Normalización del transporte aéreo (controladores)","cat":"estados excepcionales","target":"s6-8"},{"y":"2016","txt":"STC 83/2016, de 28 de abril","cons":"El decreto de alarma tiene rango o valor de ley: su control corresponde al TC","cat":"jurisprudencia","target":"s6-8"},{"y":"2020","txt":"RD 463/2020, de 14 de marzo: estado de alarma por la COVID-19","cons":"Confinamiento domiciliario general; varias prórrogas hasta junio de 2020","cat":"estados excepcionales","target":"s6-8"},{"y":"2020","txt":"RD 926/2020, de 25 de octubre: segundo estado de alarma general","cons":"Prórroga de seis meses y delegación en Presidentes autonómicos","cat":"estados excepcionales","target":"s6-8"},{"y":"2021","txt":"STC 148/2021, de 14 de julio","cons":"Inconstitucional el art. 7.1, 3 y 5 del RD 463/2020: suspendía (no limitaba) el art. 19 CE","cat":"jurisprudencia","target":"s6-8"},{"y":"2021","txt":"STC 183/2021, de 27 de octubre","cons":"Inconstitucionales la prórroga de seis meses y la delegación en Presidentes autonómicos","cat":"jurisprudencia","target":"s6-8"},{"y":"2021","txt":"Ángel Gabilondo toma posesión como Defensor del Pueblo (18 de noviembre)","cons":"Mandato de 5 años, hasta noviembre de 2026","cat":"institucional","target":"s7-5"},{"y":"2024","txt":"Reforma del art. 49 CE","cons":"Personas con discapacidad: ejercen los derechos en condiciones de libertad e igualdad reales y efectivas","cat":"normativo","target":"s4-4"},{"y":"2026","txt":"Presentación del Informe anual 2025 del Defensor del Pueblo","cons":"38.144 quejas, 253 actuaciones de oficio, 365 solicitudes de recurso","cat":"institucional","target":"s7-5"}],"flashcards":[{"q":"¿Qué artículos comprende el Título I de la Constitución?","a":"Del 10 al 55.","cat":"Estructura"},{"q":"¿Conforme a qué se interpretan las normas sobre derechos fundamentales (art. 10.2)?","a":"Conforme a la Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España.","cat":"Estructura"},{"q":"¿Qué arts. forman la Sección 1.ª del Capítulo II?","a":"Los arts. 15 a 29 (derechos fundamentales y libertades públicas).","cat":"Estructura"},{"q":"¿Qué arts. forman la Sección 2.ª del Capítulo II?","a":"Los arts. 30 a 38 (derechos y deberes de los ciudadanos).","cat":"Estructura"},{"q":"¿Qué arts. contienen los principios rectores?","a":"Los arts. 39 a 52 (Capítulo III).","cat":"Estructura"},{"q":"¿Puede ser privado de su nacionalidad un español de origen?","a":"No (art. 11.2 CE).","cat":"Españoles y extranjeros"},{"q":"¿Qué derecho reservado a los españoles pueden ejercer los extranjeros por reciprocidad?","a":"El sufragio activo y pasivo en las elecciones municipales (art. 13.2 CE).","cat":"Españoles y extranjeros"},{"q":"¿Qué delitos quedan excluidos de la extradición?","a":"Los delitos políticos, sin considerar como tales los actos de terrorismo (art. 13.3 CE).","cat":"Españoles y extranjeros"},{"q":"Plazo máximo de la detención preventiva","a":"72 horas; antes, libertad o disposición judicial (art. 17.2 CE).","cat":"Derechos"},{"q":"¿Qué tres excepciones permiten entrar en un domicilio?","a":"Consentimiento del titular, resolución judicial o flagrante delito (art. 18.2 CE).","cat":"Derechos"},{"q":"¿Quién puede acordar el secuestro de publicaciones?","a":"Solo una resolución judicial (art. 20.5 CE).","cat":"Derechos"},{"q":"¿Necesita autorización el derecho de reunión?","a":"No. Las reuniones en lugares de tránsito público y las manifestaciones requieren solo comunicación previa (art. 21 CE).","cat":"Derechos"},{"q":"¿Qué asociaciones prohíbe expresamente el art. 22 CE?","a":"Las secretas y las de carácter paramilitar.","cat":"Derechos"},{"q":"¿Puede la Administración civil imponer sanciones privativas de libertad?","a":"No, ni directa ni subsidiariamente (art. 25.3 CE).","cat":"Derechos"},{"q":"¿Dónde prohíbe el art. 26 los Tribunales de Honor?","a":"En el ámbito de la Administración civil y de las organizaciones profesionales.","cat":"Derechos"},{"q":"¿Cómo pueden ejercer el derecho de petición los militares?","a":"Solo individualmente y con arreglo a su legislación específica (art. 29.2 CE).","cat":"Derechos"},{"q":"¿Qué derecho fuera de la Sección 1.ª tiene recurso de amparo además del art. 14?","a":"La objeción de conciencia del art. 30 (art. 53.2 CE).","cat":"Garantías"},{"q":"¿Qué garantías da el art. 53.1 a los derechos del Capítulo II?","a":"Vinculan a todos los poderes públicos, reserva de ley con respeto al contenido esencial y tutela por recurso de inconstitucionalidad (art. 161.1.a).","cat":"Garantías"},{"q":"¿Qué valor tienen los principios rectores (art. 53.3)?","a":"Informan la legislación positiva, la práctica judicial y la actuación de los poderes públicos; solo se alegan ante la jurisdicción ordinaria según las leyes que los desarrollen.","cat":"Garantías"},{"q":"¿Pueden los decretos-leyes afectar a derechos del Título I?","a":"No, a ninguno: el art. 86.1 se refiere a todo el Título I.","cat":"Garantías"},{"q":"¿Qué partes del Título I exigen la reforma agravada del art. 168?","a":"Solo el Capítulo II, Sección 1.ª (arts. 15-29). El art. 14 se reforma por el procedimiento ordinario.","cat":"Garantías"},{"q":"¿Quiénes están legitimados para el recurso de amparo?","a":"Toda persona natural o jurídica con interés legítimo, el Defensor del Pueblo y el Ministerio Fiscal (art. 162.1.b CE).","cat":"Garantías"},{"q":"¿Qué derechos pueden suspenderse en los estados de excepción o sitio?","a":"Arts. 17; 18.2 y 3; 19; 20.1 a) y d) y 20.5; 21; 28.2 y 37.2 CE.","cat":"Suspensión"},{"q":"¿Qué apartado no puede suspenderse en el estado de excepción?","a":"El art. 17.3 (derechos del detenido); solo puede suspenderse en el estado de sitio.","cat":"Suspensión"},{"q":"¿Qué derechos admiten suspensión individual (art. 55.2)?","a":"Los de los arts. 17.2, 18.2 y 18.3, para investigaciones sobre bandas armadas o terroristas.","cat":"Suspensión"},{"q":"¿Permite el estado de alarma suspender derechos?","a":"No. Solo cabe limitarlos (art. 11 LO 4/1981); suspender solo es posible en excepción y sitio (art. 55.1 CE).","cat":"Suspensión"},{"q":"¿Quién declara el estado de alarma y por cuánto tiempo?","a":"El Gobierno, por decreto acordado en Consejo de Ministros, por un máximo de 15 días; la prórroga requiere autorización del Congreso.","cat":"Suspensión"},{"q":"¿Quién puede solicitar el estado de alarma si afecta solo a una Comunidad Autónoma?","a":"Su Presidente, que lo solicita al Gobierno (art. 5 LO 4/1981).","cat":"Suspensión"},{"q":"Duración máxima del estado de excepción","a":"30 días, prorrogables por otros 30 con los mismos requisitos (art. 116.3 CE).","cat":"Suspensión"},{"q":"¿Qué debe contener la solicitud de autorización del estado de excepción?","a":"Efectos y derechos a suspender, medidas, ámbito territorial y duración (máx. 30 días) y cuantía máxima de las sanciones pecuniarias (art. 13.2 LO 4/1981).","cat":"Suspensión"},{"q":"Duración máxima de la detención en el estado de excepción","a":"10 días, comunicada al juez en 24 horas (art. 16 LO 4/1981).","cat":"Suspensión"},{"q":"¿Cómo se declara el estado de sitio?","a":"Por mayoría absoluta del Congreso, a propuesta exclusiva del Gobierno, que determina ámbito, duración y condiciones (art. 116.4 CE).","cat":"Suspensión"},{"q":"¿Quién ejecuta las medidas en el estado de sitio?","a":"La Autoridad militar designada por el Gobierno, bajo su dirección, mediante bandos (arts. 33-34 LO 4/1981).","cat":"Suspensión"},{"q":"¿Qué no puede hacerse mientras esté declarado alguno de los estados del art. 116?","a":"Disolver el Congreso (art. 116.5) ni iniciar la reforma constitucional (art. 169).","cat":"Suspensión"},{"q":"¿Qué declaró la STC 148/2021?","a":"La inconstitucionalidad del art. 7.1, 3 y 5 del RD 463/2020, porque el confinamiento suspendía (no limitaba) la libertad de circulación del art. 19 CE.","cat":"Jurisprudencia"},{"q":"¿Qué rango tiene el decreto de declaración del estado de alarma según la STC 83/2016?","a":"Rango o valor de ley; su control corresponde al Tribunal Constitucional.","cat":"Jurisprudencia"},{"q":"¿Cómo define el art. 54 CE al Defensor del Pueblo?","a":"Alto comisionado de las Cortes Generales, designado por éstas para la defensa de los derechos del Título I, que supervisa la actividad de la Administración dando cuenta a las Cortes.","cat":"Defensor"},{"q":"Mandato del Defensor del Pueblo","a":"5 años (art. 2.1 LO 3/1981).","cat":"Defensor"},{"q":"Mayorías para elegir al Defensor del Pueblo","a":"3/5 del Congreso y ratificación por 3/5 del Senado en 20 días; si no se alcanzan, tras nuevas propuestas basta 3/5 del Congreso + mayoría absoluta del Senado.","cat":"Defensor"},{"q":"¿Quién declara la vacante del Defensor en caso de muerte, renuncia o expiración del mandato?","a":"El Presidente del Congreso. En los demás casos, 3/5 de cada Cámara, previa audiencia del interesado.","cat":"Defensor"},{"q":"¿Qué órgano decide sobre la inculpación o procesamiento del Defensor?","a":"Exclusivamente la Sala de lo Penal del Tribunal Supremo (art. 6.3 LO 3/1981).","cat":"Defensor"},{"q":"Plazo para presentar una queja ante el Defensor","a":"Un año desde que se tuvo conocimiento de los hechos (art. 15 LO 3/1981).","cat":"Defensor"},{"q":"¿Qué quejas rechaza siempre el Defensor?","a":"Las anónimas (art. 17.3 LO 3/1981).","cat":"Defensor"},{"q":"¿Quién no puede presentar quejas ante el Defensor?","a":"Ninguna autoridad administrativa en asuntos de su competencia (art. 10.3 LO 3/1981).","cat":"Defensor"},{"q":"¿Qué hace el Defensor con las quejas sobre la Administración de Justicia?","a":"Las remite al Ministerio Fiscal o al Consejo General del Poder Judicial (art. 13 LO 3/1981).","cat":"Defensor"},{"q":"¿Puede el Defensor anular actos administrativos?","a":"No. Puede sugerir la modificación de criterios o de normas y formular advertencias, recomendaciones, recordatorios y sugerencias (arts. 28 y 30).","cat":"Defensor"},{"q":"Plazo de respuesta a las recomendaciones del Defensor","a":"Por escrito, en término no superior a un mes (art. 30.1 LO 3/1981).","cat":"Defensor"},{"q":"¿De dónde sale la dotación económica del Defensor del Pueblo?","a":"De una partida de los Presupuestos de las Cortes Generales (art. 37 LO 3/1981).","cat":"Defensor"},{"q":"Plazo para interponer el recurso de amparo judicial en la LJCA (art. 115.1)","a":"Diez días. Si hay inactividad, recurso potestativo o vía de hecho sin requerimiento, empiezan tras veinte días.","cat":"Garantías"},{"q":"Plazos del procedimiento de la LJCA para los derechos fundamentales: expediente, demanda, alegaciones, prueba, sentencia","a":"Expediente: 5 días (116.1). Demanda: 8, improrrogable (118). Alegaciones: 8, común e improrrogable (119). Prueba: no más de 20 (120). Sentencia: 5 (121.1).","cat":"Garantías"},{"q":"Prohibición o modificación de una reunión: plazo de recurso (art. 122 LJCA)","a":"48 horas desde la notificación. Audiencia en 4 días; el tribunal resuelve sin ulterior recurso.","cat":"Garantías"},{"q":"Plazos del recurso de amparo constitucional según su origen (arts. 42-44 LOTC)","a":"Actos sin valor de Ley de Parlamentos: 3 meses desde que sean firmes. Gobierno o Administración: 20 días tras la vía judicial. Órgano judicial: 30 días.","cat":"Garantías"},{"q":"¿Quién admite a trámite el recurso de amparo y cómo? (art. 50 LOTC)","a":"La Sección, por unanimidad, mediante providencia. Sin unanimidad, decide la Sala. La inadmisión solo es recurrible en súplica por el Ministerio Fiscal, en 3 días.","cat":"Garantías"},{"q":"¿Suspende la interposición del amparo los efectos del acto? (art. 56 LOTC)","a":"No. La Sala o la Sección puede acordar la suspensión si la ejecución haría perder al amparo su finalidad.","cat":"Garantías"},{"q":"Juez competente para el habeas corpus (art. 2 LO 6/1984)","a":"El Juez de Instrucción del lugar donde se encuentre la persona; si no consta, el del lugar de la detención; si no, el de las últimas noticias. Art. 55.2 CE: Juez Central de Instrucción. Jurisdicción Militar: Juez Togado Militar de Instrucción.","cat":"Garantías"},{"q":"Legitimados para instar el habeas corpus (art. 3 LO 6/1984)","a":"El privado de libertad, su cónyuge o persona unida por análoga relación de afectividad, descendientes, ascendientes, hermanos y, en su caso, representantes; el Ministerio Fiscal; el Defensor del Pueblo; el abogado defensor. También de oficio el Juez.","cat":"Garantías"},{"q":"Plazo para resolver el habeas corpus (art. 7 LO 6/1984)","a":"Veinticuatro horas desde el auto de incoación.","cat":"Garantías"},{"q":"Detención por delitos del art. 384 bis LECrim (bandas armadas o terroristas): plazos (art. 520 bis)","a":"72 horas, prorrogables hasta otras 48. La prórroga se pide motivadamente dentro de las primeras 48 horas y el Juez la autoriza en las 24 horas siguientes.","cat":"Suspensión"},{"q":"Incomunicación: duración máxima y prórroga (art. 509 LECrim)","a":"Máximo cinco días; en causas por delitos del art. 384 bis u otros cometidos
