adante, humillante u ofensivo.","Toda actitud, conducta o discurso de rechazo, repudio, prejuicio, discriminación o intolerancia hacia las personas LGTBI por el hecho de serlo, o ser percibidas como tales.","Situación en que se encuentra una persona o grupo en que se integra que sea, haya sido o pudiera ser tratada de manera menos favorable que otras en situación análoga o comparable por razón de orientación sexual e identidad sexual, expresión de género o características sexuales.","Diferencias de trato orientadas a prevenir, eliminar y, en su caso, compensar cualquier forma de discriminación o desventaja en su dimensión colectiva o social. Tales medidas serán aplicables en tanto subsistan las situaciones de discriminación o las desventajas que las justifican y habrán de ser razonables y proporcionadas en relación con los medios para su desarrollo y los objetivos que persigan."],"c":0,"tema":"III.9","ley":[{"t":"Ley 4/2023, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI · artículo 3 d)","f":"BOE-A-2023-5366","p":["d) **Acoso discriminatorio**: Cualquier conducta realizada por razón de alguna de las causas de discriminación previstas en esta ley, con el objetivo o la consecuencia de atentar contra la dignidad de una persona o grupo en que se integra y de crear un entorno intimidatorio, hostil, degradante, humillante u ofensivo."]}]},{"n":44,"q":"La Estrategia de Acción Exterior de España 2025-2028 tiene entre sus grandes ejes de actuación:","o":["Una España con presencia comercial en Asia.","Una Europa reforzada.","Una alianza en defensa que sustituya a la OTAN.","No existe esa Estrategia."],"c":1,"tema":"III.10"},{"n":45,"q":"Mediante la Ley 7/2025, de 28 de julio, se ha creado una entidad con el objetivo de reforzar las capacidades del Estado para mejorar la salud de la población, la equidad en salud y su bienestar y proteger a la población frente a riesgos y amenazas sanitarias, con un enfoque salutogénico que potencie las capacidades y el empoderamiento de las personas y las comunidades. ¿De qué entidad se trata?","o":["Instituto de Salud Pública O.A.","Agencia Estatal de Salud Pública.","Agencia Estatal de Control de Pandemias.","Autoridad Administrativa Independiente de Control de Pandemias."],"c":1,"tema":"III.10","ley":[{"t":"Ley 7/2025, por la que se crea la Agencia Estatal de Salud Pública · artículo 1.1","f":"BOE-A-2025-15652","p":["1. El objeto de esta ley es la creación de la **Agencia Estatal de Salud Pública** (en adelante, AESAP) y la modificación de la Ley 33/2011, de 4 de octubre, General de Salud Pública."]},{"t":"Ley 7/2025, por la que se crea la Agencia Estatal de Salud Pública · artículo 2.1","f":"BOE-A-2025-15652","p":["1. La AESAP tiene como objetivo, en consonancia con lo dispuesto en la Ley 33/2011, de 4 de octubre, **reforzar las capacidades del Estado para mejorar la salud de la población**, la equidad en salud y su bienestar y proteger a la población frente a riesgos y amenazas sanitarias, con un enfoque salutogénico que potencie las capacidades y el empoderamiento de las personas y las comunidades."]}]},{"n":46,"q":"Según lo dispuesto en el artículo 1.1 del Código Civil, ¿cuáles de las siguientes son fuentes del Ordenamiento Jurídico Español?","o":["La Ley, los Tratados Internacionales y la jurisprudencia.","La Ley, los Reglamentos y la doctrina del Tribunal Supremo.","La Ley, los Reglamentos y la jurisprudencia.","La Ley, la costumbre y los principios generales del derecho."],"c":3,"tema":"IV.1","ley":[{"t":"Código Civil · artículo 1.1","f":"BOE-A-1889-4763","p":["1. Las fuentes del ordenamiento jurídico español son **la ley, la costumbre y los principios generales del derecho**."]}]},{"n":47,"q":"Según el artículo 85 de la Constitución Española de 1978, ¿qué título recibirán las disposiciones del Gobierno que contengan legislación delegada?","o":["Decretos-Leyes.","Leyes de bases.","Decretos Legislativos.","Leyes Marco."],"c":2,"tema":"IV.2","ley":[{"t":"Constitución Española · artículo 85","f":"BOE-A-1978-31229","p":["Las disposiciones del Gobierno que contengan legislación delegada recibirán el título de **Decretos Legislativos**."]}]},{"n":48,"q":"Según el artículo 133 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuándo podrá prescindirse del trámite de consulta pública?","o":["En caso de normas no organizativas de la Administración autonómica.","En caso de normas no presupuestarias de la Administración General del Estado.","Cuando concurran razones graves de interés público que lo justifiquen.","En caso de normas no organizativas de la Administración General del Estado."],"c":2,"ley":[{"t":"Ley 39/2015, del Procedimiento Administrativo Común de las Administraciones Públicas · artículo 133.4, párrafo primero","f":"BOE-A-2015-10565","p":["4. Podrá prescindirse de los trámites de consulta, audiencia e información públicas previstos en este artículo en el caso de normas presupuestarias u organizativas de la Administración General del Estado, la Administración autonómica, la Administración local o de las organizaciones dependientes o vinculadas a éstas, **o cuando concurran razones graves de interés público que lo justifiquen**."]}]},{"n":49,"q":"Según el artículo 48 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, son anulables los actos administrativos que:","o":["Incurran en cualquier infracción del ordenamiento jurídico, incluso la desviación de poder.","Lesionen derechos fundamentales.","Se dicten prescindiendo total y absolutamente del procedimiento.","Sean inexistentes jurídicamente."],"c":0,"tema":"IV.4","ley":[{"t":"Ley 39/2015, del Procedimiento Administrativo Común de las Administraciones Públicas · artículo 48.1","f":"BOE-A-2015-10565","p":["1. Son anulables los actos de la Administración que incurran en **cualquier infracción del ordenamiento jurídico, incluso la desviación de poder**."]}]},{"n":50,"q":"Según el artículo 44 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿en qué casos los contratos administrativos especiales serán susceptibles de recurso especial en materia de contratación?","o":["Cuando su valor estimado sea igual al establecido para los contratos de servicios.","Cuando por sus características no sea posible fijar su precio de licitación.","Cuando su valor estimado sea inferior al establecido para los contratos de servicios.","Cuando por sus caracteristicas no sea posible fijar su valor estimado."],"c":1,"tema":"IV.5","ley":[{"t":"Ley 9/2017, de Contratos del Sector Público · artículo 44.1, párrafo segundo","f":"BOE-A-2017-12902","p":["Serán igualmente recurribles los contratos administrativos especiales, cuando, **por sus características no sea posible fijar su precio de licitación** o, en otro caso, cuando su valor estimado sea superior a lo establecido para los contratos de servicios."]}]},{"n":51,"q":"Según el artículo 36 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cómo se perfeccionan los contratos basados en un acuerdo marco?","o":["Con su formalización.","Con su publicación en el Diario Oficial de la Unión Europea.","Con su adjudicación.","De conformidad por la legislación por la que se rijan."],"c":2,"tema":"IV.5","ley":[{"t":"Ley 9/2017, de Contratos del Sector Público · artículo 36.3","f":"BOE-A-2017-12902","p":["3. Los contratos basados en un acuerdo marco y los contratos específicos en el marco de un sistema dinámico de adquisición, **se perfeccionan con su adjudicación**."]}]},{"n":52,"q":"Según el artículo 88 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, en los contratos de obras, la solvencia técnica del empresario podrá ser acreditada a elección del órgano de contratación teniendo en cuenta la relación de las obras ejecutadas en el curso de:","o":["Los dos últimos años.","Los cinco últimos años.","Los tres últimos años.","Los cuatro últimos años."],"c":1,"tema":"IV.5","ley":[{"t":"Ley 9/2017, de Contratos del Sector Público · artículo 88.1 a)","f":"BOE-A-2017-12902","p":["1. En los contratos de obras, la solvencia técnica del empresario deberá ser acreditada por uno o varios de los medios siguientes, a elección del órgano de contratación:","a) Relación de las obras ejecutadas en el curso de los **cinco últimos años**, avalada por certificados de buena ejecución; estos certificados indicarán el importe, las fechas y el lugar de ejecución de las obras y se precisará si se realizaron según las reglas por las que se rige la profesión y se llevaron normalmente a buen término; en su caso, dichos certificados serán comunicados directamente al órgano de contratación por la autoridad competente. Cuando sea necesario para garantizar un nivel adecuado de competencia, los poderes adjudicadores podrán indicar que se tendrán en cuenta las pruebas de las obras pertinentes ejecutadas en los últimos diez años."]}]},{"n":53,"q":"Según lo dispuesto en el artículo 20 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, ¿cuál de los siguientes es el órgano responsable de la administración y custodia de la Base de Datos Nacional de Subvenciones?","o":["El Ministerio de Hacienda.","La Intervención General de la Administración del Estado.","El Ministerio de Economía, Comercio y Empresa.","La Autoridad Independiente de Responsabilidad Fiscal."],"c":1,"tema":"IV.7","ley":[{"t":"Ley 38/2003, General de Subvenciones · artículo 20.3","f":"BOE-A-2003-20977","p":["3. **La Intervención General de la Administración del Estado es el órgano responsable de la administración y custodia de la BDNS** y adoptará las medidas necesarias para garantizar la confidencialidad y seguridad de la información."]}]},{"n":54,"q":"Según el artículo veintidós de la Ley de 16 de diciembre de 1954 sobre expropiación forzosa, ¿qué recurso cabrá interponer contra el acuerdo de necesidad de ocupación?","o":["Recurso de súplica ante el Delegado del Gobierno.","Recurso de reposición ante el Subdelegado del Gobierno.","Recurso de revisión ante el Subdelegado del Gobierno.","Recurso de alzada ante el Ministerio correspondiente."],"c":3,"tema":"IV.8","ley":[{"t":"Ley de 16 de diciembre de 1954 sobre expropiación forzosa · artículo veintidós.1","f":"BOE-A-1954-15431","p":["1. Contra el acuerdo de necesidad de ocupación se dará **recurso de alzada ante el Ministerio correspondiente**, que podrán interponer los interesados en el procedimiento expropiatorio, así como las personas que hubieran comparecido en la información pública."]}]},{"n":55,"q":"Según la Ley 33/2003, de 3 de noviembre, del Patrimonio de las Administraciones Públicas, en relación con la potestad de deslinde, ¿cuál de las siguientes afirmaciones es correcta?","o":["Iniciado el procedimiento administrativo de deslinde, y mientras dure su tramitación, podrá instarse procedimiento judicial con igual pretensión.","La incoación del procedimiento para deslindar bienes patrimoniales de la Adminsitración General del Estado se acordará por el Ministro de Hacienda.","La resolución del procedimiento corresponderá al Director General de Patrimonio del Estado.","La instrucción del procedimiento corresponderá a los Delegados de Economía y Hacienda."],"c":3,"tema":"IV.9","ley":[{"t":"Ley 33/2003, del Patrimonio de las Administraciones Públicas · artículo 50.2","f":"BOE-A-2003-20254","p":["2. Una vez iniciado el procedimiento administrativo de deslinde, y mientras dure su tramitación, **no podrá instarse** procedimiento judicial con igual pretensión."]},{"t":"Ley 33/2003, del Patrimonio de las Administraciones Públicas · artículo 51.1","f":"BOE-A-2003-20254","p":["1. La incoación del procedimiento para deslindar los bienes patrimoniales de la Administración General del Estado se acordará por el **Director General del Patrimonio del Estado**, y corresponderá al **Ministro de Hacienda la resolución** del mismo. **La instrucción del procedimiento corresponderá a los Delegados de Economía y Hacienda**."]}]},{"n":56,"q":"Según el artículo 91.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los procedimientos de responsabilidad patrimonial, ¿cuándo podrá entenderse que la resolución es contraria a la indemnización del particular?","o":["Cuando hayan transcurrido cinco meses desde que se inició el procedimiento sin que haya recaído y se notifique resolución expresa, o en su caso, se haya formalizado el acuerdo.","Cuando hayan transcurrido tres meses desde que se inició el procedimiento sin que haya recaído y se notifique resolución expresa.","Cuando hayan transcurrido seis meses desde que se inició el procedimiento sin que haya recaido y se notifique resolución expresa o, en su caso, se haya formalizado el acuerdo.","Cuando hayan transcurrido dos meses desde que se inició el procedimiento sin que haya recaído y se notifique resolución expresa."],"c":2,"tema":"IV.10","ley":[{"t":"Ley 39/2015, del Procedimiento Administrativo Común de las Administraciones Públicas · artículo 91.3","f":"BOE-A-2015-10565","p":["3. **Transcurridos seis meses** desde que se inició el procedimiento sin que haya recaído y se notifique resolución expresa o, en su caso, se haya formalizado el acuerdo, podrá entenderse que la resolución es contraria a la indemnización del particular."]}]},{"n":57,"q":"Según el artículo 73 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿en qué plazo deberán realizarse los trámites que deban ser cumplimentados por los interesados?","o":["En el plazo de cinco días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto.","En el plazo de tres días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije un plazo distinto.","En el plazo de diez días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto.","En el plazo de veinte días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije un plazo distinto."],"c":2,"tema":"IV.11","ley":[{"t":"Ley 39/2015, del Procedimiento Administrativo Común de las Administraciones Públicas · artículo 73.1","f":"BOE-A-2015-10565","p":["1. Los trámites que deban ser cumplimentados por los interesados deberán realizarse **en el plazo de diez días** a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto."]}]},{"n":58,"q":"Según el artículo 24 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, en los procedimientos iniciados a solicitud del interesado, ¿en cuál de los siguientes casos tendrá efecto desestimatorio el silencio administrativo?","o":["En los procedimientos de responsabilidad sancionadora de las Administraciones Públicas.","En los procedimientos relativos al ejercicio del derecho de asociación a que se refiere el artículo 22 de la Constitución Española de 1978.","En los procedimientos que impliquen el ejercicio de actividades que puedan dañar el medio ambiente.","En los procedimientos cuya estimación tuviera como consecuencia que se transfieran al solicitante facultades relativas al dominio privado."],"c":2,"tema":"IV.11","ley":[{"t":"Ley 39/2015, del Procedimiento Administrativo Común de las Administraciones Públicas · artículo 24.1, párrafo segundo","f":"BOE-A-2015-10565","p":["El silencio tendrá efecto desestimatorio en los procedimientos relativos al ejercicio del **derecho de petición, a que se refiere el artículo 29 de la Constitución**, aquellos cuya estimación tuviera como consecuencia que se transfirieran al solicitante o a terceros facultades relativas al **dominio público** o al servicio público, **impliquen el ejercicio de actividades que puedan dañar el medio ambiente** y en los procedimientos de **responsabilidad patrimonial** de las Administraciones Públicas."]}]},{"n":59,"q":"Según el artículo 121.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿qué ocurre si el recurso de alzada se interpone ante el mismo órgano que dictó el acto impugnado?","o":["El órgano que dictó el acto que se impugna deberá resolver el recurso de alzada el plazo de diez días desde que lo haya recibido.","El órgano que dictó el acto que se impugna podrá remitirlo al competente en el plazo de quince días, con su informe y con una copia completa y ordenada del expediente.","El órgano que dictó el acto que se impugna deberá remitirlo al competente en el plazo de diez días, con su informe y con una copia completa y ordenada del expediente.","El órgano que dictó el acto que se impugna deberá resolver el recurso de alzada en el plazo de quince días desde que lo haya recibido."],"c":2,"tema":"IV.12","ley":[{"t":"Ley 39/2015, del Procedimiento Administrativo Común de las Administraciones Públicas · artículo 121.2, párrafo segundo","f":"BOE-A-2015-10565","p":["Si el recurso se hubiera interpuesto ante el órgano que dictó el acto impugnado, éste **deberá remitirlo al competente en el plazo de diez días**, con su informe y con una copia completa y ordenada del expediente."]}]},{"n":60,"q":"Según se establece en el artículo 19 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, están legitimados ante el orden jurisdiccional contencioso-administrativo:","o":["Cualquier ciudadano sin interés directo.","Solo quienes ostenten un derecho subjetivo.","Las personas físicas o jurídicas que ostenten un derecho o interés legítimo.","Únicamente la Administración demandada."],"c":2,"tema":"IV.13","ley":[{"t":"Ley 29/1998, reguladora de la Jurisdicción Contencioso-administrativa · artículo 19.1 a)","f":"BOE-A-1998-16718","p":["1. Están legitimados ante el orden jurisdiccional contencioso-administrativo:","a) **Las personas físicas o jurídicas que ostenten un derecho o interés legítimo**."]}]},{"n":61,"q":"De acuerdo con el artículo 62 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado mediante Real Decreto Legislativo 5/2015, de 30 de octubre, ¿cuál de los siguientes NO es un requisito para la adquisición de la condición de funcionario de carrera?","o":["La firma del contrato y el alta en nómina.","La toma de posesión dentro del plazo que se establezca.","El acto de acatamiento de la Constitución y, en su caso, del Estatuto de Autonomía correspondiente y del resto del Ordenamiento Jurídico.","El nombramiento por el órgano o autoridad competente, que será publicado en el Diario Oficial correspondiente."],"c":0,"tema":"V.1","ley":[{"t":"Texto refundido de la Ley del Estatuto Básico del Empleado Público (RDLeg 5/2015) · artículo 62.1","f":"BOE-A-2015-11719","p":["1. La condición de funcionario de carrera se adquiere por el cumplimiento sucesivo de los siguientes requisitos:","a) **Superación del proceso selectivo**.","b) Nombramiento por el órgano o autoridad competente, que será publicado en el Diario Oficial correspondiente.","c) Acto de acatamiento de la Constitución y, en su caso, del Estatuto de Autonomía correspondiente y del resto del Ordenamiento Jurídico.","d) Toma de posesión dentro del plazo que se establezca."]}]},{"n":62,"q":"De acuerdo con el artículo 64 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado mediante Real Decreto Legislativo 5/2015, de 30 de octubre, ¿es la renuncia una forma de pérdida de la condición de funcionario?","o":["No, la relación de servicio es inamovible y solo puede perderse por jubilación, sanción firme de separación de servicio o pena principal o accesoria de inhabilitación absoluta o especial para cargo público que tuviere carácter firme.","Sí, no pudiendo la persona que renuncia ingresar de nuevo en la Administración Pública a través del procedimiento de selección establecido.","Sí, manifestada por escrito y aceptada expresamente por la Administración.","No, los funcionarios se deben al interés general y a la obediencia debida, no existiendo en su relación estatutaria la renuncia como fórmula equivalente a la dimisión del Estatuto de los Trabajadores."],"c":2,"tema":"V.1","ley":[{"t":"Texto refundido de la Ley del Estatuto Básico del Empleado Público (RDLeg 5/2015) · artículo 64.1 y 3","f":"BOE-A-2015-11719","p":["1. La renuncia voluntaria a la condición de funcionario habrá de ser **manifestada por escrito y será aceptada expresamente por la Administración**, salvo lo dispuesto en el apartado siguiente.","3. La renuncia a la condición de funcionario **no inhabilita** para ingresar de nuevo en la Administración Pública a través del procedimiento de selección establecido."]}]},{"n":63,"q":"Según el artículo 16 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado mediante Real Decreto Legislativo 5/2015, de 30 de octubre, las modalidades de carrera profesional son:","o":["Carrera horizontal, carrera vertical, promoción interna vertical y promoción interna horizontal.","Carrera vertical, carrera horizontal, consolidación de grado y formación permanente.","Carrera horizontal y ascensos internos específicos.","Carrera vertical, carrera horizontal y carrera \"per saltum\"."],"c":0,"tema":"V.4","ley":[{"t":"Texto refundido de la Ley del Estatuto Básico del Empleado Público (RDLeg 5/2015) · artículo 16.3","f":"BOE-A-2015-11719","p":["3. Las leyes de Función Pública que se dicten en desarrollo de este Estatuto regularán la carrera profesional aplicable en cada ámbito que podrán consistir, entre otras, en la aplicación aislada o simultánea de alguna o algunas de las siguientes modalidades:","a) **Carrera horizontal**, que consiste en la progresión de grado, categoría, escalón u otros conceptos análogos, sin necesidad de cambiar de puesto de trabajo y de conformidad con lo establecido en la letra b) del artículo 17 y en el apartado 3 del artículo 20 de este Estatuto.","b) **Carrera vertical**, que consiste en el ascenso en la estructura de puestos de trabajo por los procedimientos de provisión establecidos en el capítulo III del título V de este Estatuto.","c) **Promoción interna vertical**, que consiste en el ascenso desde un cuerpo o escala de un Subgrupo, o Grupo de clasificación profesional en el supuesto de que éste no tenga Subgrupo, a otro superior, de acuerdo con lo establecido en el artículo 18.","d) **Promoción interna horizontal**, que consiste en el acceso a cuerpos o escalas del mismo Subgrupo profesional, de acuerdo con lo dispuesto en el artículo 18."]}]},{"n":64,"q":"De acuerdo con el artículo 96 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado mediante Real Decreto Legislativo 5/2015, de 30 de octubre, ¿qué puede suponer la sanción de demérito?","o":["La revocación del nombramiento en el caso de los funcionarios interinos.","La inhabilitación para ser titular de un nuevo contrato de trabajo con funciones similares a las desempeñadas.","La suspensión firme de sueldo.","La penalización a efectos de movilidad voluntaria."],"c":3,"tema":"V.2","ley":[{"t":"Texto refundido de la Ley del Estatuto Básico del Empleado Público (RDLeg 5/2015) · artículo 96.1 e)","f":"BOE-A-2015-11719","p":["e) Demérito, que consistirá en la **penalización a efectos de carrera, promoción o movilidad voluntaria**."]}]},{"n":65,"q":"Conforme al artículo 70 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado mediante Real Decreto Legislativo 5/2015, de 30 de octubre, la ejecución de la oferta de empleo público o instrumento similar deberá desarrollarse dentro del plazo improrrogable de:","o":["Un año.","Dos años.","Tres años.","Cuatro años."],"c":2,"tema":"V.3","ley":[{"t":"Texto refundido de la Ley del Estatuto Básico del Empleado Público (RDLeg 5/2015) · artículo 70.1","f":"BOE-A-2015-11719","p":["1. Las necesidades de recursos humanos, con asignación presupuestaria, que deban proveerse mediante la incorporación de personal de nuevo ingreso serán objeto de la Oferta de empleo público, o a través de otro instrumento similar de gestión de la provisión de las necesidades de personal, lo que comportará la obligación de convocar los correspondientes procesos selectivos para las plazas comprometidas y hasta un diez por cien adicional, fijando el plazo máximo para la convocatoria de los mismos. En todo caso, la ejecución de la oferta de empleo público o instrumento similar deberá desarrollarse **dentro del plazo improrrogable de tres años**."]}]},{"n":66,"q":"De acuerdo con el artículo 110.3 del Real Decreto-Ley 6/2023, de 19 de diciembre, por el que se aprueban medidas urgentes para la ejecución del plan de recuperación, transformación y resiliencia en materia de servicio público de justicia, función pública, régimen local y mecenazgo, con carácter general, en la reestructuración de puestos de trabajo, ¿a qué se adscriben los puestos resultantes?","o":["A la oferta de empleo público.","A una o varias áreas funcionales.","A los perfiles profesionales.","Al Registro Central de Personal."],"c":1,"ley":[{"t":"Real Decreto-ley 6/2023 · artículo 110.3, párrafo primero","f":"BOE-A-2023-25758","p":["3. Con carácter general, los puestos de trabajo estarán **adscritos a una o varias áreas funcionales**, a fin de facilitar la gestión eficaz de los recursos humanos, las competencias para su desempeño y la formación más adecuada."]}]},{"n":67,"q":"De acuerdo con el artículo 127 del Real Decreto-Ley 6/2023, de 19 de diciembre, por el que se aprueban medidas urgentes para la ejecución del plan de recuperación, transformación y resiliencia en materia de servicio público de justicia, función pública, régimen local y mecenazgo, ¿es posible nombrar a una Subdirectora General en la Administración General del Estado mediante adscripción provisional?","o":["Sí, pero solo si se ha publicado la convocatoria de libre designación y mientras esta se resuelve.","Sí, si la previa convocatoria de libre designación queda desierta.","No, los puestos de personal directivo público profesional no pueden cubrirse de manera provisional.","No, la adscripción provisional no es una forma de provisión de puestos."],"c":2,"tema":"V.4","ley":[{"t":"Real Decreto-ley 6/2023 · artículo 123.3","f":"BOE-A-2023-25758","p":["3. Tendrán la consideración de personal directivo público profesional **las personas titulares de las subdirecciones generales**, con arreglo a lo dispuesto en el artículo 67 de la Ley 40/2015, de 1 de octubre."]},{"t":"Real Decreto-ley 6/2023 · artículo 127.1, párrafo primero","f":"BOE-A-2023-25758","p":["1. El nombramiento y cese en puestos de personal directivo público profesional en la Administración del Estado se realizará en todo caso por el procedimiento de libre designación, con las especialidades previstas en este artículo y las normas de adaptación a que se refiere el artículo 125.2, **sin que quepa la cobertura de carácter provisional**."]}]},{"n":68,"q":"De acuerdo con el artículo 111 del Real Decreto-Ley 6/2023, de 19 de diciembre, por el que se aprueban medidas urgentes para la ejecución del plan de recuperación, transformación y resiliencia en materia de servicio público de justicia, función pública, régimen local y mecenazgo, ¿cómo se denominan los instrumentos de planificación de carácter abierto y permanente, en los que se podrán incluir puestos de trabajo vacantes, para fomentar una mayor ocupación de las plazas de necesaria cobertura y favorecer una movilidad ordenada y coordinada?","o":["Planes de ámbito general de función pública.","Concursos unitarios.","Planes específicos de vacantes.","Concursos de reestructuración de sectores concretos."],"c":1,"tema":"V.4","ley":[{"t":"Real Decreto-ley 6/2023 · artículo 111","f":"BOE-A-2023-25758","p":["La Secretaría de Estado de Función Pública, en colaboración con los departamentos ministeriales y organismos públicos, convocará **concursos unitarios, de carácter abierto y permanente**, en los que se podrán incluir puestos de trabajo vacantes adscritos a los mismos, con la finalidad de fomentar una mayor ocupación de las plazas de necesaria cobertura y de favorecer una movilidad ordenada y coordinada."]}]},{"n":69,"q":"¿Cuál de las siguientes NO es una situación administrativa de los funcionarios de carrera contemplada en el texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado mediante Real Decreto Legislativo 5/2015, de 30 de octubre?","o":["Excedencia.","Comisión de servicios.","Servicios especiales.","Suspensión de funciones."],"c":1,"tema":"V.5","ley":[{"t":"Texto refundido de la Ley del Estatuto Básico del Empleado Público (RDLeg 5/2015) · artículo 85.1","f":"BOE-A-2015-11719","p":["1. Los funcionarios de carrera se hallarán en alguna de las siguientes situaciones:","a) Servicio activo.","b) **Servicios especiales**.","c) Servicio en otras Administraciones Públicas.","d) **Excedencia**.","e) **Suspensión de funciones**."]}]},{"n":70,"q":"De acuerdo con lo establecido en el artículo quinto de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿es compatible el desempeño de un puesto de funcionario de carrera de la Administración General del Estado con el de cargo electivo, miembro de una corporación local?","o":["Sí, salvo que en la corporación local desempeñe cargos retribuidos en régimen de dedicación exclusiva.","Sí, puesto que el derecho al sufragio pasivo prima sobre la condición de funcionario.","No, debe pasar a situación de excedencia por cargo electo.","No, salvo que se trate de municipios de más de dos millones de habitantes."],"c":0,"tema":"V.5","ley":[{"t":"Ley 53/1984, de Incompatibilidades del personal al servicio de las Administraciones Públicas · artículo quinto.1 b)","f":"BOE-A-1985-151","p":["1. Por excepción, el personal incluido en el ámbito de aplicación de esta Ley podrá compatibilizar sus actividades con el desempeño de los cargos electivos siguientes:","b) Miembros de las Corporaciones locales, **salvo que desempeñen en las mismas cargos retribuidos en régimen de dedicación exclusiva**."]}]},{"n":71,"q":"Según el Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, la duración de una comisión con derecho a indemnización:","o":["Salvo casos excepcionales, será de un máximo de un mes en territorio nacional y de tres en el extranjero.","Será de un máximo de un mes en territorio nacional y de tres en el extranjero, improrrogables.","Salvo casos excepcionales, no durará más de quince días en territorio nacional y de un mes en el extranjero.","Será de un máximo de dos meses en territorio nacional o en el extranjero, improrrogables."],"c":0,"tema":"V.6","ley":[{"t":"Real Decreto 462/2002, sobre indemnizaciones por razón del servicio · artículo 5.1","f":"BOE-A-2002-10337","p":["1. Toda comisión con derecho a indemnización, **salvo casos excepcionales, no durará más de un mes en territorio nacional y de tres en el extranjero**."]}]},{"n":72,"q":"De acuerdo con la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, ¿cuál de las siguientes afirmaciones sobre los trienios es correcta?","o":["Serán iguales, en todas las Administraciones públicas, para cada uno de los grupos de clasificación según el nivel del complemento de destino que se perciba.","Corresponde al índice de proporcionalidad asignado anualmente a cada uno de los grupos en que se organizan los Cuerpos y Escalas, Clases o Categorías.","Serán iguales en todas las Administraciones públicas, para cada uno de los grupos en que se clasifican los cuerpos, escalas, categorías o clases de funcionarios.","Corresponde al índice de proporcionalidad asignado cada tres años a cada uno de los grupos en que se organizan los Cuerpos y Escalas, Clases o Categorías."],"c":2,"tema":"V.6","ley":[{"t":"Ley 30/1984, de medidas para la reforma de la Función Pública · artículo veinticuatro.1","f":"BOE-A-1984-17387","p":["1. Las cuantías de las retribuciones básicas de los párrafos a) y b) del apartado 2 del artículo 23 de esta Ley, **serán iguales en todas las Administraciones públicas, para cada uno de los grupos en que se clasifican los cuerpos, escalas, categorías o clases de funcionarios**. Asimismo las cuantías de las pagas extraordinarias serán iguales, en todas las Administraciones públicas, para cada uno de los grupos de clasificación según el nivel del complemento de destino que se perciba."]},{"t":"Ley 30/1984, de medidas para la reforma de la Función Pública · artículo veintitrés.2 a) y b)","f":"BOE-A-1984-17387","p":["a) El sueldo, que corresponde al índice de proporcionalidad asignado a cada uno de los grupos en que se organizan los Cuerpos y Escalas, Clases o Categorías.","b) **Los trienios**, consistentes en una cantidad igual para cada grupo, por cada tres años de servicio en el Cuerpo o Escala, Clase o Categoría."]}]},{"n":73,"q":"Conforme al Real Decreto 462/2002, de 24 de mayo, sobre indemnizaciones por razón del servicio, ¿cuál de los siguientes supuestos NO da lugar a indemnización o compensación?","o":["Desplazamientos dentro del término municipal por razón de servicio.","Redistribución de efectivos.","Traslados de residencia.","Colaboración en centros de formación y perfeccionamiento del personal de las Administraciones públicas."],"c":1,"tema":"V.6","ley":[{"t":"Real Decreto 462/2002, sobre indemnizaciones por razón del servicio · artículo 1.1","f":"BOE-A-2002-10337","p":["1. Darán origen a indemnización o compensación los supuestos siguientes, en las circunstancias, condiciones y límites contenidos en el presente Real Decreto:","a) Comisiones de servicio con derecho a indemnización.","b) **Desplazamientos dentro del término municipal por razón de servicio**.","c) **Traslados de residencia**.","d) Asistencias por concurrencia a Consejos de Administración u Órganos Colegiados, por participación en tribunales de oposiciones y concursos y por la **colaboración en centros de formación y perfeccionamiento del personal de las Administraciones públicas**."]}]},{"n":74,"q":"De acuerdo con el IV Convenio colectivo único para el personal laboral de la Administración General del Estado, registrado y publicado mediante Resolución de 13 de mayo de 2019, de la Dirección General de Trabajo, ¿qué titulación mínima se exige para el grupo profesional E2?","o":["Título clasificado en el Nivel 1 del Marco Español de Cualificaciones para la Educación Superior o equivalentes.","Título de Bachiller o Técnico o equivalentes.","Título clasificado en el Nivel 3 del Marco Español de Cualificaciones para la Educación Superior o equivalentes.","Título clasificado en el Nivel 2 del Marco Español de Cualificaciones para la Educación Superior o equivalentes."],"c":1,"tema":"V.7","ley":[{"t":"IV Convenio colectivo único para el personal laboral de la Administración General del Estado · artículo 8.1","f":"BOE-A-2019-7414","p":["1. Se establecen los siguientes grupos profesionales de acuerdo con la titulación exigida para el ingreso en los mismos:","a) Grupo profesional M3: Título clasificado en el Nivel 3 del Marco Español de Cualificaciones para la Educación Superior o equivalentes.","b) Grupo profesional M2: Título clasificado en el Nivel 2 del Marco Español de Cualificaciones para la Educación Superior o equivalentes.","c) Grupo profesional M1: Título clasificado en el Nivel 1 del Marco Español de Cualificaciones para la Educación Superior o equivalentes.","d) **Grupo profesional E2: Título de Bachiller o Técnico o equivalentes**."]}]},{"n":75,"q":"De acuerdo con el IV Convenio colectivo único para el personal laboral de la Administración General del Estado, registrado y publicado mediante Resolución de 13 de mayo de 2019, de la Dirección General de Trabajo, ¿cuál de las siguientes opciones se considera órgano de representación unitaria de este personal laboral?","o":["El delegado o delegada sindical.","El delegado o delegada de personal.","La sección sindical.","El comité de Seguridad y Salud."],"c":1,"tema":"V.8","ley":[{"t":"IV Convenio colectivo único para el personal laboral de la Administración General del Estado · artículo 85.1","f":"BOE-A-2019-7414","p":["1. Serán órganos de representación unitaria del personal laboral incluido en el ámbito de este Convenio los siguientes:","a) **Los Delegados y Delegadas de personal** que ostentarán la representación colectiva del personal laboral en los centros de trabajo que tengan menos de cincuenta trabajadores y/o trabajadoras.","b) Los Comités de empresa que ostentarán la representación colectiva del personal laboral en los centros de trabajo que tengan cincuenta o más trabajadores y/o trabajadoras."]}]},{"n":76,"q":"¿Cuál de las siguientes materias está excluida de la obligatoriedad de negociación, de acuerdo con el artículo 37 del texto refundido de la Ley del Estatuto Básico del Empleado Público, aprobado mediante Real Decreto Legislativo 5/2015, de 30 de octubre?","o":["La determinación y aplicación de las retribuciones complementarias de los funcionarios.","La regulación y determinación concreta, en cada caso, de los sistemas, criterios, órganos y procedimientos de acceso al empleo público y la promoción profesional.","Los criterios generales sobre ofertas de empleo público.","Los criterios generales para la determinación de prestaciones sociales y pensiones de clases pasivas."],"c":1,"tema":"V.8","ley":[{"t":"Texto refundido de la Ley del Estatuto Básico del Empleado Público (RDLeg 5/2015) · artículo 37.2 e)","f":"BOE-A-2015-11719","p":["2. **Quedan excluidas de la obligatoriedad de la negociación**, las materias siguientes:","e) **La regulación y determinación concreta, en cada caso, de los sistemas, criterios, órganos y procedimientos de acceso al empleo público y la promoción profesional**."]}]},{"n":77,"q":"De acuerdo con el artículo 3 del Real Decreto Legislativo 4/2000, de 23 de junio, por el que se aprueba el texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado, ¿quiénes quedan obligatoriamente incluidos en el campo de aplicación del régimen especial de la Seguridad Social de los funcionarios civiles del Estado?","o":["Los funcionarios de la Administración Local.","Los funcionarios de organismos autónomos.","Los funcionarios en prácticas que aspiren a incorporarse a Cuerpos de la Administración Civil del Estado.","Los funcionarios de la Administración de Justicia."],"c":2,"tema":"V.9","ley":[{"t":"Texto refundido de la Ley sobre Seguridad Social de los Funcionarios Civiles del Estado (RDLeg 4/2000) · artículo 3.1 y 3.2 a), b) y d)","f":"BOE-A-2000-12140","p":["1. Quedan obligatoriamente incluidos en el campo de aplicación de este Régimen especial:","a) Los funcionarios de carrera de la Administración Civil del Estado.","b) **Los funcionarios en prácticas que aspiren a incorporarse a Cuerpos de la Administración Civil del Estado**, en la forma que reglamentariamente se determine.","2. **Quedan excluidos** de este Régimen especial y se regirán por sus normas específicas:","a) Los funcionarios de la Administración Local.","b) Los funcionarios de organismos autónomos.","d) Los funcionarios de la Administración de Justicia."]}]},{"n":78,"q":"Según el artículo 66 del Real Decreto 375/2003, de 28 de marzo, por el que se aprueba el Reglamento General del Mutualismo Administrativo, ¿es el embarazo una contingencia protegida por la prestación sanitaria de MUFACE?","o":["El embarazo no se considera contingencia, por lo tanto no está protegida por la prestación sanitaria.","El embarazo no se considera enfermedad, por lo tanto no es una contingencia protegida por la prestación sanitaria.","Es una contingencia protegida, pero no por la prestación sanitaria, sino por la prestación asistencial.","Sí, así lo establece el Reglamento General del Mutualismo Administrativo."],"c":3,"tema":"V.9","ley":[{"t":"Real Decreto 375/2003, Reglamento General del Mutualismo Administrativo · artículo 66","f":"BOE-A-2003-7527","p":["Las contingencias cubiertas por la prestación de la asistencia sanitaria son las de enfermedad común o profesional y las lesiones ocasionadas por accidente común o en acto de servicio o como consecuencia de él, sea por accidente o riesgo específico del cargo, **así como el embarazo, el parto y el puerperio**, en la extensión y términos que se establecen en este reglamento."]}]},{"n":79,"q":"¿En qué régimen cotiza y genera su derecho a la pensión de jubilación una funcionaria de nuevo ingreso de la OEP 2021?","o":["En el Régimen de Clases Pasivas.","En el Régimen General de la Seguridad Social.","Puede optar entre el Régimen de Clases Pasivas y el Régimen General de la Seguridad Social.","En el Régimen de Mutualismo Administrativo."],"c":1,"tema":"V.9","ley":[{"t":"Texto refundido de la Ley General de la Seguridad Social (RDLeg 8/2015) · disposición adicional tercera.1","f":"BOE-A-2015-11724","p":["1. **Con efectos de 1 de enero de 2011**, el personal que se relaciona en el artículo 2.1 del texto refundido de la Ley de Clases Pasivas del Estado, aprobado por el Real Decreto Legislativo 670/1987, de 30 de abril, excepción hecha del comprendido en la letra i), estará obligatoriamente incluido, a los exclusivos efectos de lo dispuesto en dicha norma y en sus disposiciones de desarrollo, **en el Régimen General de la Seguridad Social siempre que el acceso a la condición de que se trate se produzca a partir de aquella fecha**."]}]},{"n":80,"q":"De acuerdo con el Real Decreto 2271/2004, de 3 de diciembre, por el que se regula el acceso al empleo público y la provisión de puestos de trabajo de las personas con discapacidad, una vez superado el proceso selectivo, ¿qué pueden solicitar al órgano convocante las personas que ingresen y hayan sido admitidas en la convocatoria ordinaria por el cupo de reserva para personas con discapacidad?","o":["Un destino en la provincia de residencia habitual de la persona admitida con plaza de reserva para personas con discapacidad, por motivos de dependencia personal.","La alteración del orden de prelación para la elección de las plazas dentro del ámbito territorial que se determine en la convocatoria, por motivos de dificultades de desplazamiento.","Un destino en la Comunidad Autónoma de residencia habitual de la persona admitida con plaza de reserva para personas con discapacidad, por motivos de dependencia personal.","Un destino en la ciudad de residencia habitual de la persona admitida con plaza de reserva para personas con discapacidad, por motivos de dependencia personal."],"c":1,"tema":"V.10","ley":[{"t":"Real Decreto 2271/2004, de acceso al empleo público y provisión de puestos de las personas con discapacidad · artículo 9","f":"BOE-A-2004-21221","p":["Una vez superado el proceso selectivo, las personas que ingresen en cuerpos o escalas de funcionarios o categorías de personal laboral de la Administración General del Estado y hayan sido admitidos en la convocatoria ordinaria con plazas reservadas para personas con discapacidad podrán solicitar al órgano convocante **la alteración del orden de prelación para la elección de las plazas dentro del ámbito territorial que se determine en la convocatoria**, por motivos de dependencia personal, **dificultades de desplazamiento** u otras análogas, que deberán ser debidamente acreditados. El órgano convocante decidirá dicha alteración cuando se encuentre debidamente justificado, y deberá limitarse a realizar la mínima modificación en el orden de prelación necesaria para posibilitar el acceso al puesto de la persona discapacitada."]}]},{"n":81,"q":"De acuerdo con la Orden PJC/804/2025, de 23 de julio, por la que se establecen criterios generales para la adaptación de medios y tiempos y la realización de otros ajustes razonables en los procesos selectivos para el acceso al empleo público de personas con discapacidad, las adaptaciones de medios humanos podrán consistir en:","o":["Un asistente personal.","La concesión de un tiempo adicional para la realización de los ejercicios correspondientes a las pruebas selectivas.","La puesta a disposición de la persona aspirante con discapacidad de los medios materiales que precise para la realización de las pruebas en las que participe.","La puesta a disposición de la persona aspirante con discapacidad de los productos de apoyo y de las tecnologías asistidas que precise para la realización de las pruebas en las que participe."],"c":0,"tema":"V.10","ley":[{"t":"Orden PJC/804/2025, de adaptaciones y ajustes razonables en los procesos selectivos · artículo 5 a)","f":"BOE-A-2025-15426","p":["Las adaptaciones de medios humanos podrán consistir en la puesta a disposición de la persona con discapacidad participante en el proceso selectivo de:","a) **Asistente personal**."]}]},{"n":82,"q":"¿Qué articulo de la Constitución de 1978 recoge el principio de estabilidad presupuestaria?","o":["El articulo 134, referido a los Presupuestos Generales del Estado.","El artículo 135, dentro del capítulo de Economía y Hacienda.","El artículo 40, dentro del capítulo referido a los principios rectores de la política social y económica.","El artículo 66, dentro del capítulo referido la Cámaras."],"c":null,"tema":"VI.1","anulada":true},{"n":83,"q":"¿Cómo define el principio de estabilidad presupuestaria la Ley Orgánica 2/2012, de 27 de abril, de Estabilidad Presupuestaria y Sostenibilidad Financiera?","o":["La situación de equilibrio estructural.","La situación de superávit estructural.","La situación de equilibrio o superávit estructural.","La capacidad para financiar compromisos de gasto presentes y futuros dentro de los límites de déficit."],"c":2,"tema":"VI.1","ley":[{"t":"Ley Orgánica 2/2012, de Estabilidad Presupuestaria y Sostenibilidad Financiera · artículo 3.2","f":"BOE-A-2012-5730","p":["2. Se entenderá por estabilidad presupuestaria de las Administraciones Públicas **la situación de equilibrio o superávit estructural**."]}]},{"n":84,"q":"De acuerdo con la clasificación orgánica regulada en la Ley 47/2003, de 26 de noviembre, General Presupuestaria, señale la respuesta correcta en relación con la aplicación presupuestaria 13.91.112A.240 de los Presupuestos Generales del Estado:","o":["El 13 hace referencia al Servicio.","El 112A hace referencia a la Sección.","El 13 hace referencia a la Sección.","El 240 hace referencia al Subconcepto."],"c":2,"tema":"VI.2"},{"n":85,"q":"La clasificación económica de los estados de gastos de los Presupuestos Generales del Estado:","o":["Agrupa los créditos asignados a los distintos centros gestores de gastos por secciones y servicios.","Agrupa los créditos asignados a los distintos centros gestores de gasto por órganos administrativos de la estructura orgánica.","Agrupa los créditos por capítulos separando las operaciones corrientes, las de capital, las financieras y el Fondo de Contingencia de ejecución presupuestaria.","Agrupa los créditos por objetivos de las políticas de gasto contenidas en la programación plurianual."],"c":2,"tema":"VI.2","ley":[{"t":"Ley 47/2003, General Presupuestaria · artículo 40.1 c)","f":"BOE-A-2003-21614","p":["c) La clasificación económica, que **agrupará los créditos por capítulos separando las operaciones corrientes, las de capital, las financieras y el Fondo de Contingencia de ejecución presupuestaria**."]}]},{"n":86,"q":"¿Cuál de las siguientes NO es una modificación presupuestaria conforme a la Ley 47/2003, de 26 de noviembre, General Presupuestaria?","o":["La ampliación de crédito.","El suplemento de crédito.","El gasto plurianual de crédito.","La incorporación de crédito."],"c":2,"tema":"VI.3","ley":[{"t":"Ley 47/2003, General Presupuestaria · artículo 51","f":"BOE-A-2003-21614","p":["La cuantía y finalidad de los créditos contenidos en los presupuestos de gastos sólo podrán ser modificadas durante el ejercicio, dentro de los límites y con arreglo al procedimiento establecido en los artículos siguientes, mediante:","a) **Transferencias**.","b) Generaciones.","c) **Ampliaciones**.","d) **Créditos extraordinarios y suplementos de crédito**.","e) **Incorporaciones**."]}]},{"n":87,"q":"La competencia para autorizar créditos extraordinarios y suplementarios de los organismos autónomos corresponde:","o":["A los Presidentes o Directores de los organismos hasta un importe del 10 % del correspondiente capítulo de su presupuesto inicial de gastos, cuando no supere la cuantía de 1 millón de euros, excluidos los que afecten a gastos de personal o a los contemplados en el apartado 2 del artículo 44 de esta Ley, dando cuenta de los acuerdos al Ministro de que dependan y al Ministro de Hacienda.","A los Presidentes o Directores de los organismos hasta un importe del 50 % del correspondiente capítulo de su presupuesto inicial de gastos, cuando no supere la cuantía de 500.000 euros, excluidos los que afecten a gastos de personal o a los contemplados en el apartado 2 del artículo 44 de esta Ley, dando cuenta de los acuerdos al Ministro de que dependan y al Ministro de Hacienda.","A los Presidentes o Directores de los organismos hasta un importe del 10 % del correspondiente capítulo de su presupuesto inicial de gastos, cuando no supere la cuantía de 500.000 euros, excluidos los que afecten a gastos de personal o a los contemplados en el apartado 2 del artículo 44 de esta Ley, dando cuenta de los acuerdos al Ministro de que dependan y al Ministro de Hacienda.","A los Presidentes o Directores de los organismos hasta un importe del 25 % del correspondiente capítulo de su presupuesto inicial de gastos, cuando no supere la cuantía de un millón de euros, excluidos los que afecten a gastos de personal o a los contemplados en el apartado 2 del artículo 44 de esta Ley, dando cuenta de los acuerdos al Ministro de que dependan y al Ministro de Hacienda."],"c":2,"tema":"VI.3","ley":[{"t":"Ley 47/2003, General Presupuestaria · artículo 56.3 a)","f":"BOE-A-2003-21614","p":["3. La competencia para autorizar créditos extraordinarios o suplementarios corresponderá:","a. A los Presidentes o Directores de los organismos **hasta un importe del 10 %** del correspondiente capítulo de su presupuesto inicial de gastos, **cuando no supere la cuantía de 500.000 euros**, excluidos los que afecten a gastos de personal o a los contemplados en el apartado 2 del artículo 44 de esta Ley, dando cuenta de los acuerdos al Ministro de que dependan y al Ministro de Hacienda."]}]},{"n":88,"q":"De acuerdo con el artículo 150 bis de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿qué podrá avocar el Interventor General para sí en la función interventora?","o":["Cualquier acto o expediente que considere oportuno.","Solo las competencias delegadas en favor de los interventores delegados.","La avocación se halla prohibida en la función interventora.","Solo aquellos derivados de la modalidad de intervención material."],"c":0,"tema":"VI.4","ley":[{"t":"Ley 47/2003, General Presupuestaria · artículo 150 bis, párrafo segundo","f":"BOE-A-2003-21614","p":["En todo caso, las competencias del Interventor General en materia de función interventora podrán ser delegadas en favor de los interventores delegados. Asimismo, **el Interventor General podrá avocar para sí cualquier acto o expediente que considere oportuno**."]}]},{"n":89,"q":"Conforme al artículo treinta y ocho de la Ley Orgánica 2/1982, de 12 de mayo, del Tribunal de Cuentas, las responsabilidades derivadas de la responsabilidad contable:","o":["Se transmiten a los causahabientes de los responsables por la aceptación expresa o tácita de la herencia, pero solo en la cuantía a que ascienda el importe líquido de la misma.","Siempre serán solidarias y comprenderán todos los perjuicios causados.","Cuando se demuestra que es directa, la cuantía de su responsabilidad se limitará a los perjuicios que sean consecuencia de sus actos y podrá moderarse en forma prudencial y equitativa.","Serán subsidiarias cuando se haya producido alcance."],"c":0,"tema":"VI.4","ley":[{"t":"Ley Orgánica 2/1982, del Tribunal de Cuentas · artículo treinta y ocho.tres a cinco","f":"BOE-A-1982-11584","p":["Tres. La responsabilidad directa será siempre solidaria y comprenderá todos los perjuicios causados.","Cuatro. Respecto a los responsables subsidiarios, la cuantía de su responsabilidad se limitará a los perjuicios que sean consecuencia de sus actos y podrá moderarse en forma prudencial y equitativa.","Cinco. Las responsabilidades, tanto directas como subsidiarias, **se transmiten a los causahabientes de los responsables por la aceptación expresa o tácita de la herencia, pero sólo en la cuantía a que ascienda el importe líquido de la misma**."]}]},{"n":90,"q":"De acuerdo con la Ley 47/2003, de 26 de noviembre, General Presupuestaria, el reconocimiento de la obligación es:","o":["El acto mediante el que se declara la existencia de un crédito exigible contra la Hacienda Pública estatal.","El acto mediante el cual se acuerda la realización de gastos previamente aprobados, por un importe determinado o determinable.","El acto mediante el cual se autoriza la realización de un gasto determinado por una cuantía cierta o aproximada.","El ingreso del pago."],"c":0,"tema":"VI.5","ley":[{"t":"Ley 47/2003, General Presupuestaria · artículo 73.4","f":"BOE-A-2003-21614","p":["4. El reconocimiento de la obligación es **el acto mediante el que se declara la existencia de un crédito exigible contra la Hacienda Pública estatal** o contra la Seguridad Social, derivado de un gasto aprobado y comprometido y que comporta la propuesta de pago correspondiente."]}]},{"n":91,"q":"Según lo dispuesto en la regla 23 de la Orden de 1 de febrero de 1996, por la que se aprueba la Instrucción Operatoria Contable a seguir en la ejecución del gas zaciones por razón del servicio, de acuerdo con lo dispuesto en la Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, por la que se establecen los códigos que definen la clasificación económica:","o":["Artículo 21.","Artículo 12.","Artículo 23.","Artículo 14."],"c":2,"ley":[{"t":"Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, códigos de la clasificación económica · anexo IV (código de la clasificación económica de los gastos), capítulo 2","f":"BOE-A-2014-879","p":["**Artículo 23. Indemnizaciones por razón del servicio.**","– Las indemnizaciones que para resarcir gastos de esta naturaleza y de acuerdo con la legislación vigente deban satisfacerse a altos cargos y asimilados, y su séquito, funcionarios, personal laboral fijo y eventual y otro personal."]}]},{"n":95,"q":"De acuerdo con el artículo 79 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿quién es responsable de la custodia y uso de los fondos y de la rendición de la cuenta de los pagos a justificar?","o":["El cuentadante.","El Ministro, o en quien este delegue, y, en su caso, los presidentes o directores de los organismos autónomos del Estado y de las entidades gestoras y servicios comunes de la Seguridad Social.","El Subsecretario.","El perceptor de la orden de pago a justificar."],"c":3,"tema":"VI.6","ley":[{"t":"Ley 47/2003, General Presupuestaria · artículo 79.5","f":"BOE-A-2003-21614","p":["5. **Los perceptores de las órdenes de pago a justificar son responsables**, en los términos previstos en esta ley, de la custodia y uso de los fondos y de la rendición de la cuenta."]}]},{"n":96,"q":"¿Qué nivel de especificación tienen las inversiones reales en el presupuesto del Estado, de acuerdo con lo establecido en el artículo 43 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria?","o":["Capítulo.","Artículo.","Concepto.","Subconcepto."],"c":0,"ley":[{"t":"Ley 47/2003, General Presupuestaria · artículo 43.1","f":"BOE-A-2003-21614","
