  }[S.estado]) || "";
}

/* ========================================================================
   (c) UTILIDADES
   ====================================================================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function barajar(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function plural(n, s, p) { return n + " " + (n === 1 ? s : (p || s + "s")); }
function resaltar(texto, q) {
  const txt = String(texto || "");
  if (!q) return esc(txt);
  const i = norm(txt).indexOf(norm(q));
  if (i < 0) return esc(txt);
  return esc(txt.slice(0, i)) + "<mark>" + esc(txt.slice(i, i + q.length)) + "</mark>" + esc(txt.slice(i + q.length));
}
/** Ordena hitos: primer año de 4 cifras; siglos en romano; lo demás al final. */
function claveAnio(y) {
  const s = String(y || "");
  const m = s.match(/\d{4}/); if (m) return parseInt(m[0], 10);
  const r = s.match(/s\.?\s*([ivxlcdm]+)/i);
  if (r) return romano(r[1].toUpperCase()) * 100 - 50;
  return 99999;
}
function romano(s) { const v = { I:1, V:5, X:10, L:50, C:100, D:500, M:1000 }; let r = 0, p = 0; for (let i = s.length - 1; i >= 0; i--) { const x = v[s[i]] || 0; r += x < p ? -x : x; p = x; } return r; }

function toast(msg, tipo, duracion) {
  const box = document.getElementById("toast-box");
  const t = document.createElement("div");
  t.className = "toast" + (tipo === "error" ? " error" : "");
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => t.remove(), duracion || 3600);
}

/** Texto de la tabla del documento -> HTML con los enlaces que el documento
    enlaza: identificadores BOE (texto consolidado), webs institucionales y
    las fuentes citadas por su nombre. «(verif.)» se marca aparte. */
function enlazar(texto) {
  let h = esc(texto);
  const marcas = [];
  const guardar = html => { marcas.push(html); return "\u0000" + (marcas.length - 1) + "\u0000"; };
  h = h.replace(/BOE-A-\d{4}-\d+/g, id =>
    guardar(`<a href="https://www.boe.es/buscar/act.php?id=${id}" target="_blank" rel="noopener">${id}</a>`));
  ENLACES_TEXTO.forEach(([t, url]) => {
    h = h.split(esc(t)).join(guardar(`<a href="${url}" target="_blank" rel="noopener">${esc(t)}</a>`));
  });
  h = h.replace(/\bwww\.[a-z0-9.-]+\.[a-z]{2,}(?:\/[a-z0-9\/._-]*[a-z0-9\/])?/gi, d =>
    guardar(`<a href="https://${d}" target="_blank" rel="noopener">${d}</a>`));
  DOMINIOS_SIN_WWW.forEach(d => {
    h = h.replace(new RegExp("(^|[\\s(;,])(" + d.replace(/[.\/]/g, "\\$&") + ")(?![\\w.-]*\\w)", "g"),
      (m, pre, dom) => pre + guardar(`<a href="https://${dom}" target="_blank" rel="noopener">${dom}</a>`));
  });
  h = h.replace(/\(verif\.\)/g, () =>
    guardar('<span class="verif" title="Norma, cifra o web citada sin identificador o sin comprobar en la revisión del documento: contrástala antes de incorporarla a tus temas.">verif.</span>'));
  return h.replace(/\u0000(\d+)\u0000/g, (m, i) => marcas[+i]);
}

function tagVigencia(t) { const v = VIGENCIA[t.v[0]]; return `<span class="tag ${v.cls}" title="${esc(v.def)}">${v.txt}</span>`; }
function tagFuente(t)   { const f = FUENTE[t.f[0]];   return `<span class="tag ${f.cls}" title="${esc(f.def)}">${f.txt}</span>`; }
function tagTac(t)      { return t.tac ? `<span class="tag lila" title="Sin correlato en el TAC con grupo de sociales (§15.6 del PDF base)">Sin correlato TAC</span>` : ""; }

function temasDeBloque(code) { return Object.values(estado.temas).filter(t => t.group === code).sort((a, b) => a.id.localeCompare(b.id)); }
function temasDeAmbito(ambito) {
  if (ambito === "global") return Object.values(estado.temas).sort((a, b) => a.id.localeCompare(b.id));
  return temasDeBloque(ambito);
}
function codigoDe(id) { return TEMA_POR_ID[id] ? TEMA_POR_ID[id].c : id; }

/* Lo que se usa para estudiar: solo lo completo. El editor guarda también lo
   que esté a medias para no perderlo, pero no entra en mazos ni tests. */
const lleno = x => String(x == null ? "" : x).trim() !== "";
const fcValida = f => !!(f && lleno(f.q) && lleno(f.a));
function fcs(t) { return t.flashcards.filter(fcValida); }
/** Preguntas completas, sin opciones vacías (la correcta se reindexa). */
function qs(t) {
  const out = [];
  t.questions.forEach(q => {
    if (!q || !lleno(q.q) || !Array.isArray(q.o)) return;
    const o = []; let c = -1;
    q.o.forEach((x, i) => { if (lleno(x)) { if (i === q.c) c = o.length; o.push(x); } });
    if (o.length >= 2 && c >= 0) out.push(Object.assign({}, q, { o, c }));
  });
  return out;
}
const tieneApuntes = t => !!(t && t.sections.some(x => lleno(x.body)));

/* ---- Abrir el tema desarrollado ---------------------------------------- */
const blobs = {};
function urlTema(t, ancla) {
  let base;
  if (t.html) {
    if (!blobs[t.id]) blobs[t.id] = URL.createObjectURL(new Blob([t.html], { type:"text/html" }));
    base = blobs[t.id];
  } else {
    base = CARPETA_TEMAS + (t.fileName || (t.id + "_estudio.html"));
  }
  return base + (ancla ? "#" + encodeURIComponent(ancla) : "");
}
/** Lleva al contenido: a tus apuntes si los hay; si el tema se importó como
    archivo y no tiene apuntes escritos aquí, abre el archivo original. */
let anclaPendiente = null;
function abrirTema(id, ancla) {
  const t = estado.temas[id];
  if (!t) { ir("#/tema/" + id); return; }
  if (tieneApuntes(t) || !t.html) { anclaPendiente = ancla || null; ir("#/tema/" + id + "/leer"); return; }
  window.open(urlTema(t, ancla), "_blank", "noopener");
}

/* ========================================================================
   Carga de contenido: archivos HTML con window.TEMARIO_DATA (mismo formato
   que los temas de estudio ya existentes) o JSON.
   ====================================================================== */
/** Acepta "B4T11", "IV.11", "iv-11"… y devuelve el id interno o null. */
function idValido(k, v) {
  const cand = [v && v.id, k, v && v.codigo, v && v.c].filter(Boolean).map(x => String(x).trim());
  for (const c of cand) {
    const u = c.toUpperCase();
    if (TEMA_POR_ID[u]) return u;
    const m = u.match(/^(I{1,3}|IV|V|VI)[.\-_ ]?(\d{1,2})$/);
    if (m && ID_POR_CODIGO[m[1] + "." + parseInt(m[2], 10)]) return ID_POR_CODIGO[m[1] + "." + parseInt(m[2], 10)];
  }
  // Por número de bloque y tema, si vienen sueltos.
  if (v && v.group && v.number) {
    const g = String(v.group).toUpperCase().replace(/^G/, "B");
    const id = g + "T" + String(v.number).padStart(2, "0");
    if (TEMA_POR_ID[id]) return id;
  }
  return null;
}
function normalizarTema(id, v, fileName, html) {
  const p = TEMA_POR_ID[id];
  const arr = x => Array.isArray(x) ? x : [];
  return {
    id, group:p.b, number:p.num,
    title: v.title || p.e, subtitle: v.subtitle || "",
    fileName: fileName || v.fileName || v.url || "",
    timeline: arr(v.timeline), glossary: arr(v.glossary), flashcards: arr(v.flashcards),
    // Se guardan también las preguntas a medio escribir (editor); las que no
    // están completas no entran en el test (ver qs()).
    questions: arr(v.questions).filter(q => q && typeof q === "object").map(q => Object.assign({}, q, { o:Array.isArray(q.o) ? q.o : [] })),
    sections: arr(v.sections),
    etiquetas: arr(v.etiquetas || v.tags).map(String).filter(x => x.trim()),
    mod: (v.mod && typeof v.mod === "object") ? Object.assign({}, v.mod) : {},
    html: html || v.html || null,
    cargado: v.cargado || new Date().toISOString()
  };
}
function datosATemas(datos, fileName, html) {
  const out = [], ignorados = [];
  for (const k in datos) {
    const v = datos[k];
    if (!v || typeof v !== "object") continue;
    const id = idValido(k, v);
    if (id) out.push(normalizarTema(id, v, fileName, html)); else ignorados.push(k);
  }
  return { out, ignorados };
}

/** Ejecuta el HTML en un iframe aislado (sin acceso a esta página) y recoge
    window.TEMARIO_DATA por postMessage. */
function leerHTMLTema(texto) {
  return new Promise((ok, ko) => {
    const testigo = "gestion-" + Math.random().toString(36).slice(2);
    const sonda = `<script>addEventListener("load",function(){setTimeout(function(){var d=null;try{d=JSON.parse(JSON.stringify(window.TEMARIO_DATA||window.GESTION_DATA||null));}catch(e){}parent.postMessage({testigo:${JSON.stringify(testigo)},datos:d},"*");},300);});<\/script>`;
    const ifr = document.createElement("iframe");
    ifr.setAttribute("sandbox", "allow-scripts");
    ifr.style.cssText = "position:absolute;left:-10000px;top:0;width:1px;height:1px;visibility:hidden";
    ifr.srcdoc = texto + sonda;
    let hecho = false;
    const fin = () => { hecho = true; window.removeEventListener("message", oir); clearTimeout(plazo); ifr.remove(); };
    const oir = e => {
      if (hecho || !e.data || e.data.testigo !== testigo) return;
      const d = e.data.datos;
      fin();
      if (!d || typeof d !== "object" || !Object.keys(d).length) ko(new Error("no contiene window.TEMARIO_DATA"));
      else ok(d);
    };
    const plazo = setTimeout(() => { if (!hecho) { fin(); ko(new Error("tiempo agotado al leer el archivo")); } }, 15000);
    window.addEventListener("message", oir);
    document.body.appendChild(ifr);
  });
}
function leerArchivo(f) {
  return new Promise((ok, ko) => { const r = new FileReader(); r.onerror = () => ko(new Error("no se pudo leer")); r.onload = () => ok(r.result); r.readAsText(f); });
}

async function procesarArchivos(lista) {
  const archivos = Array.from(lista || []);
  const validos = archivos.filter(f => /\.(html?|json)$/i.test(f.name));
  if (!validos.length) { toast("Suelta archivos .html (temas) o .json (copia o temas)", "error"); return; }
  let total = 0;
  for (const f of validos) {
    try {
      const texto = await leerArchivo(f);
      let datos, html = null;
      if (/\.json$/i.test(f.name)) {
        const j = JSON.parse(texto);
        if (j && j._format === FORMATO) { if (await importarCopia(j)) total += Object.keys(j.temas || {}).length; continue; }
        datos = (j && j.id && (j.glossary || j.flashcards || j.questions || j.timeline || j.sections)) ? { [j.id]: j } : j;
      } else {
        datos = await leerHTMLTema(texto);
        html = texto;
      }
      const { out, ignorados } = datosATemas(datos, f.name, html);
      for (const t of out) await guardarTema(t);
      total += out.length;
      if (out.length) toast(`✓ ${f.name}: ${out.map(t => codigoDe(t.id)).join(", ")}`);
      if (ignorados.length) toast(`${f.name}: ${ignorados.join(", ")} no corresponde a ningún tema del programa`, "error");
      if (!out.length && !ignorados.length) toast(`${f.name}: sin temas reconocibles`, "error");
    } catch (e) {
      toast(`✗ ${f.name}: ${e.message}`, "error");
    }
  }
  if (total) render();
}

function elegirArchivos() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".html,.htm,.json"; inp.multiple = true;
  inp.style.cssText = "position:fixed;left:-10000px";
  inp.addEventListener("change", () => { procesarArchivos(inp.files); setTimeout(() => inp.remove(), 500); });
  document.body.appendChild(inp);
  inp.click();
}
function activarDrop(el) {
  el.addEventListener("click", e => { if (e.target.closest("a,button")) return; elegirArchivos(); });
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); elegirArchivos(); } });
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("encima"); });
  el.addEventListener("dragleave", e => { if (!el.contains(e.relatedTarget)) el.classList.remove("encima"); });
  el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("encima"); procesarArchivos(e.dataTransfer && e.dataTransfer.files); });
}
// Soltar fuera de una zona de carga no debe abrir el archivo en el navegador.
["dragover", "drop"].forEach(ev => document.addEventListener(ev, e => { if (!e.target.closest || !e.target.closest(".drop")) e.preventDefault(); }));

/* ---- Copia completa (💾) ------------------------------------------------ */
async function exportarCopia() {
  const temas = {};
  Object.values(estado.temas).forEach(t => { temas[t.id] = t; });
  const datos = { _format:FORMATO, _version:2, _exportedAt:new Date().toISOString(), ajustes:{ progreso:prog.mapa }, temas };
  const url = URL.createObjectURL(new Blob([JSON.stringify(datos, null, 2)], { type:"application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = "gestion_hub_" + new Date().toISOString().slice(0, 10).replace(/-/g, "") + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 300);
  toast(`✓ Copia guardada: ${plural(Object.keys(temas).length, "tema")} + progreso`);
}
async function importarCopia(j, silencioso) {
  const n = Object.keys(j.temas || {}).length;
  if (!silencioso) {
    const fecha = j._exportedAt ? new Date(j._exportedAt).toLocaleString("es-ES") : "fecha desconocida";
    if (!confirm(`¿Importar la copia del ${fecha} con ${plural(n, "tema")}?\nSustituye los temas con el mismo número y el progreso de flashcards.`)) return false;
  }
  let ok = 0;
  for (const k in (j.temas || {})) {
    const v = j.temas[k];
    const id = idValido(k, v);
    if (!id) continue;
    /* Lo embebido en la página lleva la fecha de la copia, no la de ahora: si
       no, cada dispositivo que abriera la página por primera vez pisaría lo
       que se hubiera editado después en otro. */
    const marca = silencioso ? ms(j._exportedAt) || 1 : null;
    if (marca && estado.temas[id] && (estado.temas[id].modificado || 0) >= marca) continue;
    await guardarTema(normalizarTema(id, v, v.fileName, v.html), false, marca); ok++;
  }
  // Progreso: se suma al tuyo tarjeta a tarjeta (gana la marca más reciente).
  const pr = j.ajustes && j.ajustes.progreso;
  if (pr && typeof pr === "object") {
    for (const k in pr) { const v = pr[k], a = prog.mapa[k]; if (v && typeof v.m === "number" && (!a || v.m > a.m)) { prog.mapa[k] = v.d === undefined ? { s:!!v.s, m:v.m } : { s:!!v.s, m:v.m, d:v.d }; pend.prog[prog.duenno + "|" + k] = 1; } }
    guardarProg(); guardarPend(); programarSync();
  }
  // Copias de la primera versión: claves por posición.
  const v1 = j.ajustes && j.ajustes.fc && j.ajustes.fc.known;
  if (Array.isArray(v1)) v1.forEach(k => { const [id, i] = k.split(":"); const t = estado.temas[id]; const f = t && t.flashcards[parseInt(i, 10)]; if (f) marcarFc(claveFc(id, f), true); });
  if (!silencioso) toast(`✓ Importados ${plural(ok, "tema")}`);
  return true;
}
async function cargarEmbebidos() {
  const el = document.getElementById("datos-embebidos");
  const txt = el ? el.textContent.trim() : "";
  if (!txt) return;
  try {
    let j = JSON.parse(txt);
    if (j._format !== FORMATO) return;
    const sello = j._exportedAt || "sin-fecha";
    if (localStorage.getItem(KEY_EMBED) === sello) return;
    // El progreso es de cada persona: lo embebido en la página no lo trae.
    j = Object.assign({}, j, { ajustes:null });
    await importarCopia(j, true);
    localStorage.setItem(KEY_EMBED, sello);
  } catch (e) { console.warn("Datos embebidos:", e); }
}

async function buscarEnServidor() {
  if (!/^https?:$/.test(location.protocol)) { toast("Solo funciona con la página publicada (http/https)", "error"); return; }
  const btn = document.getElementById("btn-servidor");
  btn.classList.add("girando"); btn.disabled = true;
  let hallados = 0, cursor = 0;
  const lista = TEMAS.map(t => t.id);
  async function trabajador() {
    while (cursor < lista.length) {
      const id = lista[cursor++];
      try {
        const r = await fetch(CARPETA_TEMAS + id + "_estudio.html", { cache:"no-cache" });
        if (!r.ok) continue;
        const texto = await r.text();
        if (!/TEMARIO_DATA|GESTION_DATA/.test(texto)) continue;
        const { out } = datosATemas(await leerHTMLTema(texto), id + "_estudio.html", null);
        for (const t of out) { await guardarTema(t); hallados++; }
      } catch (_) {}
    }
  }
  await Promise.all(Array.from({ length:6 }, trabajador));
  btn.classList.remove("girando"); btn.disabled = false;
  toast(hallados ? `✓ ${plural(hallados, "tema")} cargado${hallados === 1 ? "" : "s"} desde ${CARPETA_TEMAS}` : `No hay temas publicados en ${CARPETA_TEMAS}`, hallados ? "" : "error");
  if (hallados) render();
}

  if (!estado.temas[ED.id] && temaVacio(ED.t)) return;
  /* Si mientras escribías llegó otra versión del tema (de otro dispositivo),
     se guardan solo las partes que has tocado aquí encima de esa versión:
     glosario en un móvil y apuntes en otro se combinan en vez de pisarse. */
  const actual = estado.temas[ED.id];
  if (actual && (actual.modificado || 0) > (ED.base || 0)) {
    const mezcla = JSON.parse(JSON.stringify(actual));
    ED.tocado.forEach(k => { mezcla[k] = ED.t[k]; });
    ED.t = mezcla;
  }
  const partes = [...ED.tocado];
  ED.tocado.clear();
  const t = ED.t;
  const guardado = guardarTema(t, false, null, partes);
  ED.base = t.modificado;         // guardarTema la sella antes de su primer await
  guardado.then(() => {

    if (e) e.textContent = "Guardado ✓";

/** Texto con un formato mínimo: párrafos, listas, **negrita**, *cursiva* y
    enlaces a los identificadores BOE. Todo escapado antes. */
function formatear(txt) {
  const enLinea = x => esc(x)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/BOE-A-\d{4}-\d+/g, id => `<a href="https://www.boe.es/buscar/act.php?id=${id}" target="_blank" rel="noopener">${id}</a>`);
  let html = "", lista = null, parr = [];
  const cerrarP = () => { if (parr.length) { html += "<p>" + parr.map(enLinea).join("<br>") + "</p>"; parr = []; } };
  const cerrarL = () => { if (lista) { html += "</" + lista + ">"; lista = null; } };
  String(txt || "").replace(/\r/g, "").split("\n").forEach(l => {
    const t = l.trim();
    if (!t) { cerrarP(); cerrarL(); return; }
    let m = t.match(/^[-•*]\s+(.*)$/), tipo = "ul";
    if (!m) { m = t.match(/^(?:\d{1,2}|[a-z])[.)]\s+(.*)$/); tipo = "ol"; }
    if (m) { cerrarP(); if (lista !== tipo) { cerrarL(); html += "<" + tipo + ">"; lista = tipo; } html += "<li>" + enLinea(m[1]) + "</li>"; return; }
    cerrarL(); parr.push(t);
  });
  cerrarP(); cerrarL();
  return html;
}

/* ---- Envolver texto (búsqueda y resaltados) ----------------------------
   Busca sin distinguir mayúsculas ni tildes, también a través de negritas o
   enlaces, y envuelve cada trozo en su propia marca. */
function envolver(root, aguja, crear, todas) {
  const nodos = [];
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode:n => n.parentNode.closest("button") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  let total = "";
  while (w.nextNode()) { nodos.push({ n:w.currentNode, ini:total.length, len:w.currentNode.nodeValue.length }); total += w.currentNode.nodeValue; }
  const T = norm(total), A = norm(String(aguja).trim());
  if (!A || T.length !== total.length) return [];
  const rangos = [];
  for (let i = T.indexOf(A); i >= 0; i = T.indexOf(A, i + A.length)) { rangos.push([i, i + A.length]); if (!todas) break; }
  const grupos = rangos.map(() => []);
  for (let r = rangos.length - 1; r >= 0; r--) {
    const [a, b] = rangos[r];
    for (let j = nodos.length - 1; j >= 0; j--) {
      const { n, ini, len } = nodos[j];
      if (ini >= b || ini + len <= a) continue;
      const s0 = Math.max(a, ini) - ini, e0 = Math.min(b, ini + len) - ini;
      if (e0 < n.nodeValue.length) n.splitText(e0);
      const trozo = s0 > 0 ? n.splitText(s0) : n;
      const m = crear(); trozo.parentNode.insertBefore(m, trozo); m.appendChild(trozo);
      grupos[r].unshift(m);
    }
  }
  return grupos;
}
function desenvolver(root, sel) {
  root.querySelectorAll(sel).forEach(m => { const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); p.normalize(); });
}

function historialTests(tests) {

}

/* ---- Lectura en voz (Web Speech API) ----------------------------------- */
const VOZ = { cola:[], i:0, activo:false, pausa:false, vel:1 };
function textoPlano(md) { return String(md || "").replace(/\*\*|\*/g, "").replace(/^\s*[-•]\s+/gm, "").replace(/BOE-A-(\d{4})-(\d+)/g, "BOE $1 $2"); }
function vozParar() {
  VOZ.activo = false; VOZ.pausa = false; VOZ.cola = [];
  try { speechSynthesis.cancel(); } catch (_) {}
  document.querySelectorAll(".ap.leyendo").forEach(x => x.classList.remove("leyendo"));
}
function vozDecir() {
  if (!VOZ.activo || VOZ.i >= VOZ.cola.length) { vozParar(); pintarVoz(); return; }
  const item = VOZ.cola[VOZ.i];
  document.querySelectorAll(".ap.leyendo").forEach(x => x.classList.remove("leyendo"));
  const ap = document.querySelector(`.ap[data-ap="${CSS.escape(item.ap)}"]`);
  if (ap) { ap.classList.add("leyendo"); if (!ap.classList.contains("abierto")) alternarApartado(ap, true); ap.scrollIntoView({ behavior:"smooth", block:"start" }); }
  const u = new SpeechSynthesisUtterance(item.txt);
  u.lang = "es-ES"; u.rate = VOZ.vel;
  const v = speechSynthesis.getVoices().find(x => /^es(-|_)ES/i.test(x.lang)) || speechSynthesis.getVoices().find(x => /^es/i.test(x.lang));
  if (v) u.voice = v;
  u.onend = () => { if (VOZ.activo && !VOZ.pausa) { VOZ.i++; vozDecir(); pintarVoz(); } };
  speechSynthesis.speak(u);
}
function panelVoz(c, id) {
  if (!("speechSynthesis" in window)) { c.innerHTML = `<div class="empty"><div class="ico">🔇</div><h3>Este navegador no puede leer en voz alta</h3></div>`; return; }
  const aps = apartados(estado.temas[id]);
  if (!aps.length) return vacioHerr(c, "🔊", "Nada que leer", "Escribe primero los apuntes del tema.");
  c.innerHTML = `
    <label class="lat-k" for="voz-desde">Leer desde</label>
    <select class="input" id="voz-desde">${aps.map((a, i) => `<option value="${i}">${i + 1}. ${esc(a.s.title || "(sin título)")}</option>`).join("")}</select>
    <label class="lat-k" for="voz-vel">Velocidad <span id="voz-vel-txt">${VOZ.vel.toFixed(1)}×</span></label>
    <input type="range" id="voz-vel" min="0.7" max="1.6" step="0.1" value="${VOZ.vel}" style="width:100%">
    <div class="btn-row" style="margin-top:14px" id="voz-botones"></div>
    <p class="muted" style="font-size:12.5px;margin-top:12px">Lee el apartado y sus subapartados, y continúa con los siguientes. Se para al cambiar de tema.</p>`;
  document.getElementById("voz-vel").addEventListener("input", e => { VOZ.vel = +e.target.value; document.getElementById("voz-vel-txt").textContent = VOZ.vel.toFixed(1) + "×"; });
  pintarVoz();
}
function pintarVoz() {
  const caja = document.getElementById("voz-botones"); if (!caja) return;
  caja.innerHTML = !VOZ.activo
    ? `<button class="btn btn-primary" data-voz="play">▶ Leer</button>`
    : `<button class="btn btn-primary" data-voz="${VOZ.pausa ? "seguir" : "pausa"}">${VOZ.pausa ? "▶ Seguir" : "⏸ Pausa"}</button><button class="btn" data-voz="stop">■ Parar</button><span class="muted" style="align-self:center;font-size:13px">${VOZ.i + 1}/${VOZ.cola.length}</span>`;
  caja.querySelectorAll("[data-voz]").forEach(b => b.addEventListener("click", () => {
    const acc = b.dataset.voz;
    if (acc === "play") {
      const aps = apartados(estado.temas[ESTUDIO.id]), desde = +document.getElementById("voz-desde").value;
      VOZ.cola = aps.slice(desde).map(a => ({ ap:a.s.id, txt:[a.s.title, textoPlano(a.s.body), ...a.subs.map(x => x.title + ". " + textoPlano(x.body))].filter(lleno).join(". ") }));
      VOZ.i = 0; VOZ.activo = true; VOZ.pausa = false; speechSynthesis.cancel(); vozDecir();
    }
    if (acc === "pausa") { VOZ.pausa = true; speechSynthesis.pause(); }
    if (acc === "seguir") { VOZ.pausa = false; speechSynthesis.resume(); }
    if (acc === "stop") vozParar();
    pintarVoz();
  }));
}

/* Resaltar: aparece un botón al seleccionar texto dentro de los apuntes. */
function seleccionEnApuntes() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  const nodo = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentNode;
  const cuerpo = nodo.closest && nodo.closest("[data-cuerpo]");
  if (!cuerpo || !cuerpo.closest(".estudio-main")) return null;
  const txt = sel.toString().replace(/\s+/g, " ").trim();
  if (txt.length < 2) return null;
  return { r, cuerpo, txt:txt.slice(0, 400) };
}

  const b = document.getElementById("btn-resaltar"); if (!b) return;
  const s = seleccionEnApuntes();
  if (!s) { b.hidden = true; return; }
  const rc = s.r.getBoundingClientRect();
  b.hidden = false;
  b.style.top = Math.max(70, rc.top - 46) + "px";
  b.style.left = Math.min(window.innerWidth - 130, Math.max(10, rc.left + rc.width / 2 - 55)) + "px";

/* 1 · Búsqueda */
function hubBuscar(c, ambito, temas) {
  const s = hl(ambito);
  c.innerHTML = `
    <div class="toolbar"><input class="input" type="search" id="q" placeholder="Buscar en glosario, cronología, flashcards, test y secciones…" value="${esc(s.q)}"></div>
    <div class="chip-row">
      ${[["todo","Todo"],["glosario","📖 Glosario"],["crono","📅 Cronología"],["fc","🎴 Flashcards"],["test","📝 Preguntas"],["seccion","📑 Secciones"]].map(([k, v]) =>
        `<button class="chip peq ${s.tipo === k ? "active" : ""}" data-tipo="${k}">${v}</button>`).join("")}
    </div>
    <div class="stats-line" id="st"></div><div id="res"></div>`;
  const pintar = () => {
    let pool = [];
    temas.forEach(t => {
      t.glossary.forEach(g => pool.push({ tipo:"glosario", t, tit:g.t || g.term || "", txt:g.d || g.def || "", ancla:g.section || "" }));
      t.timeline.forEach(i => pool.push({ tipo:"crono", t, tit:i.y, txt:(i.txt || "") + (i.cons ? " — " + i.cons : ""), ancla:i.target || "" }));
      fcs(t).forEach(f => pool.push({ tipo:"fc", t, tit:f.q, txt:f.a, ancla:"" }));
      qs(t).forEach(q => pool.push({ tipo:"test", t, tit:q.q, txt:q.o.join(" / ") + (q.e ? " · " + q.e : ""), ancla:"" }));
      t.sections.forEach(x => pool.push({ tipo:"seccion", t, tit:x.title || "(sin título)", txt:x.body || "", ancla:x.id }));
    });
    if (s.tipo !== "todo") pool = pool.filter(p => p.tipo === s.tipo);
    const q = s.q.trim();
    if (q) { const nq = norm(q); pool = pool.filter(p => norm(p.tit).includes(nq) || norm(p.txt).includes(nq)); }
    document.getElementById("st").textContent = q ? `${plural(pool.length, "resultado")} para «${q}»` : plural(pool.length, "elemento");
    const res = document.getElementById("res");
    if (!pool.length) { res.innerHTML = `<div class="empty"><div class="ico">🔍</div><h3>Sin coincidencias</h3></div>`; return; }
    res.innerHTML = pool.slice(0, 200).map(p => `
      <div class="res" data-id="${p.t.id}" data-ancla="${esc(p.ancla)}">
        <div class="res-row"><span class="tag acc">${esc(codigoDe(p.t.id))}</span><span class="tag">${etiquetaRes[p.tipo]}</span><span class="res-tit">${resaltar(p.tit, q)}</span></div>
        ${p.txt ? `<div class="res-txt">${resaltar(p.txt.length > 260 ? p.txt.slice(0, 260) + "…" : p.txt, q)}</div>` : ""}
      </div>`).join("") + (pool.length > 200 ? `<div class="stats-line">+${pool.length - 200} más…</div>` : "");
    res.querySelectorAll(".res").forEach(x => x.addEventListener("click", () => abrirTema(x.dataset.id, x.dataset.ancla)));
  };
  document.getElementById("q").addEventListener("input", e => { s.q = e.target.value; pintar(); });
  c.querySelectorAll("[data-tipo]").forEach(x => x.addEventListener("click", () => { s.tipo = x.dataset.tipo; hubBuscar(c, ambito, temas); }));
  pintar();
}

/* 2 · Cronología. Las categorías salen de los datos cargados, no de una lista fija. */
function hubCrono(c, ambito, temas) {
  const s = hl(ambito);
  const cats = [...new Set(temas.flatMap(t => t.timeline.map(i => i.cat)).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
  if (s.ccat !== "todas" && !cats.includes(s.ccat)) s.ccat = "todas";
  if (s.ctema !== "todos" && !temas.some(t => t.id === s.ctema)) s.ctema = "todos";
  c.innerHTML = `
    <div class="toolbar"><input class="input" type="search" id="cq" placeholder="Buscar año o hito…" value="${esc(s.cq)}"></div>
    ${cats.length ? `<div class="chip-row"><button class="chip peq ${s.ccat === "todas" ? "active" : ""}" data-cat="todas">Todas</button>${cats.map(k => `<button class="chip peq ${s.ccat === k ? "active" : ""}" data-cat="${esc(k)}">${esc(k)}</button>`).join("")}</div>` : ""}
    ${chipsTemas(temas, s.ctema, "ct")}
    <div class="stats-line" id="st"></div><div class="tl" id="res"></div>`;
  const pintar = () => {
    let pool = [];
    temas.forEach(t => { if (s.ctema !== "todos" && t.id !== s.ctema) return; t.timeline.forEach(i => pool.push(Object.assign({ _t:t, _k:claveAnio(i.y) }, i))); });
    if (s.ccat !== "todas") pool = pool.filter(i => i.cat === s.ccat);
    const q = s.cq.trim();
    if (q) { const nq = norm(q); pool = pool.filter(i => norm(i.y).includes(nq) || norm(i.txt).includes(nq) || norm(i.cons).includes(nq)); }
    pool.sort((a, b) => a._k - b._k);
    document.getElementById("st").textContent = plural(pool.length, "hito");
    const res = document.getElementById("res");
    if (!pool.length) { res.innerHTML = `<div class="empty"><div class="ico">📅</div><h3>Sin hitos</h3></div>`; return; }
    res.innerHTML = pool.map(i => `
      <div class="tl-item" data-id="${i._t.id}" data-ancla="${esc(i.target || "")}">
        <div><span class="tl-y">${resaltar(i.y, q)}</span>${resaltar(i.txt, q)}</div>
        ${i.cons ? `<div class="tl-cons">→ ${resaltar(i.cons, q)}</div>` : ""}
        <div class="tags" style="margin-top:6px"><span class="tag acc">${esc(codigoDe(i._t.id))}</span>${i.cat ? `<span class="tag">${esc(i.cat)}</span>` : ""}</div>
      </div>`).join("");
    res.querySelectorAll(".tl-item").forEach(x => x.addEventListener("click", () => abrirTema(x.dataset.id, x.dataset.ancla)));
  };
  document.getElementById("cq").addEventListener("input", e => { s.cq = e.target.value; pintar(); });
  c.querySelectorAll("[data-cat]").forEach(x => x.addEventListener("click", () => { s.ccat = x.dataset.cat; hubCrono(c, ambito, temas); }));
  c.querySelectorAll("[data-ct]").forEach(x => x.addEventListener("click", () => { s.ctema = x.dataset.ct; hubCrono(c, ambito, temas); }));
  pintar();
}

/* 3 · Glosario */
function hubGlosario(c, ambito, temas) {
  const s = hl(ambito);
  if (s.gtema !== "todos" && !temas.some(t => t.id === s.gtema)) s.gtema = "todos";
  const inicial = x => { const ch = String(x).trim().charAt(0).toUpperCase(); return ch === "Ñ" ? "Ñ" : norm(ch).toUpperCase(); };
  const todos = temas.flatMap(t => t.glossary.map(g => Object.assign({ _t:t, _term:g.t || g.term || "", _def:g.d || g.def || "" }, g)));
  todos.forEach(g => { g._ini = inicial(g._term); });
  const presentes = new Set(todos.map(g => g._ini));
  const letras = ["A","B","C","D","E","F","G","H","I","J","K","L","M","N","Ñ","O","P","Q","R","S","T","U","V","W","X","Y","Z"];
  c.innerHTML = `
    <div class="toolbar"><input class="input" type="search" id="gq" placeholder="Buscar término o definición…" value="${esc(s.gq)}"></div>
    <div class="letras">
      <button class="letra ${!s.gletra ? "active" : ""}" data-l="">Todas</button>
      ${letras.map(L => `<button class="letra ${s.gletra === L ? "active" : ""}" data-l="${L}" ${presentes.has(L) ? "" : "disabled"}>${L}</button>`).join("")}
    </div>
    ${chipsTemas(temas, s.gtema, "gt")}
    <div class="stats-line" id="st"></div><div id="res"></div>`;
  const pintar = () => {
    let pool = todos.filter(g => s.gtema === "todos" || g._t.id === s.gtema);
    if (s.gletra) pool = pool.filter(g => g._ini === s.gletra);
    const q = s.gq.trim();
    if (q) { const nq = norm(q); pool = pool.filter(g => norm(g._term).includes(nq) || norm(g._def).includes(nq)); }
    pool.sort((a, b) => a._term.localeCompare(b._term, "es"));
    document.getElementById("st").textContent = plural(pool.length, "término");
    const res = document.getElementById("res");
    if (!pool.length) { res.innerHTML = `<div class="empty"><div class="ico">📖</div><h3>Sin entradas</h3></div>`; return; }
    res.innerHTML = pool.map(g => `
      <div class="res" data-id="${g._t.id}" data-ancla="${esc(g.section || "")}">
        <div class="res-row"><span class="res-tit">${resaltar(g._term, q)}</span><span class="tag acc">${esc(codigoDe(g._t.id))}</span>${g.cat ? `<span class="tag">${esc(g.cat)}</span>` : ""}${g.ref ? `<span class="tag">${esc(g.ref)}</span>` : ""}</div>
        <div class="res-txt">${resaltar(g._def, q)}</div>
      </div>`).join("");
    res.querySelectorAll(".res").forEach(x => x.addEventListener("click", () => abrirTema(x.dataset.id, x.dataset.ancla)));
  };
  document.getElementById("gq").addEventListener("input", e => { s.gq = e.target.value; pintar(); });
  c.querySelectorAll("[data-l]").forEach(x => x.addEventListener("click", () => { s.gletra = x.dataset.l; hubGlosario(c, ambito, temas); }));
  c.querySelectorAll("[data-gt]").forEach(x => x.addEventListener("click", () => { s.gtema = x.dataset.gt; hubGlosario(c, ambito, temas); }));
  pintar();
}

/* 4 · Flashcards. Progreso: claves "id:índice" de las que «la sabía». */
function hubFc(c, ambito, temas) {
  const s = hl(ambito);
  if (s.fcTema !== "todos" && !temas.some(t => t.id === s.fcTema)) { s.fcTema = "todos"; s.mazo = null; }
  const enFiltro = temas.filter(t => s.fcTema === "todos" || t.id === s.fcTema);
  const rehacer = () => {
    const pool = [];
    enFiltro.forEach(t => fcs(t).forEach(f => { const k = claveFc(t.id, f); if (!sabida(k)) pool.push(Object.assign({ _id:t.id, _k:k }, f)); }));
    s.mazo = barajar(pool); s.idx = 0; s.volteada = false;
  };
  if (!s.mazo) rehacer();
  const total = enFiltro.reduce((n, t) => n + fcs(t).length, 0);
  const sabidas = enFiltro.reduce((n, t) => n + sabidasDe(t), 0);
  const f = s.mazo[s.idx];
  c.innerHTML = `
    <div class="fc-ctrl">
      <span><b>${total}</b> tarjetas</span><span>Dominadas: <b>${sabidas}</b></span><span>Pendientes: <b>${s.mazo.length}</b></span>
      <button class="chip peq" id="fc-mezclar">🔀 Mezclar</button><button class="chip peq" id="fc-reiniciar">♻ Reiniciar</button>
    </div>
    ${chipsTemas(temas, s.fcTema, "ft")}
    ${!total ? `<div class="empty"><div class="ico">🎴</div><h3>Sin flashcards</h3></div>`
      : !f ? `<div class="empty"><div class="ico">🏆</div><h3>¡Mazo dominado!</h3><p>Pulsa «Reiniciar» para repasar.</p></div>`
      : `<div class="fc ${s.volteada ? "volteada" : ""}" id="fc" role="button" tabindex="0" aria-label="Voltear tarjeta">
          <div class="fc-in">
            <div class="fc-cara">
              <div class="tags"><span class="tag acc">${esc(codigoDe(f._id))}</span>${f.cat ? `<span class="tag">${esc(f.cat)}</span>` : ""}</div>
              <div class="fc-q">${esc(f.q)}</div><div class="fc-hint">Pulsa para voltear</div>
            </div>
            <div class="fc-cara atras"><div class="fc-a">${esc(f.a)}</div></div>
          </div>
        </div>
        <div class="fc-btns" ${s.volteada ? "" : "hidden"} id="fc-btns">
          <button class="btn btn-no" id="fc-no">✗ No la sabía</button>
          <button class="btn btn-si" id="fc-si">✓ La sabía</button>
        </div>`}`;
  const rep = () => hubFc(c, ambito, temas);
  document.getElementById("fc-mezclar").addEventListener("click", () => { s.mazo = barajar(s.mazo); s.idx = 0; s.volteada = false; rep(); });
  document.getElementById("fc-reiniciar").addEventListener("click", () => {
    if (!confirm("¿Reiniciar el progreso de flashcards de este ámbito?")) return;
    enFiltro.forEach(t => fcs(t).forEach(f => { const k = claveFc(t.id, f); if (sabida(k)) marcarFc(k, false); }));
    rehacer(); rep();
  });
  c.querySelectorAll("[data-ft]").forEach(x => x.addEventListener("click", () => { s.fcTema = x.dataset.ft; s.mazo = null; rep(); }));
  const carta = document.getElementById("fc");
  if (carta) {
    const voltear = () => { s.volteada = !s.volteada; carta.classList.toggle("volteada", s.volteada); document.getElementById("fc-btns").hidden = !s.volteada; };
    carta.addEventListener("click", voltear);
    carta.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); voltear(); } });
    document.getElementById("fc-si").addEventListener("click", () => {
      if (!sabida(f._k)) marcarFc(f._k, true);
      s.mazo.splice(s.idx, 1); if (s.idx >= s.mazo.length) s.idx = 0; s.volteada = false; rep();
    });
    document.getElementById("fc-no").addEventListener("click", () => {
      s.mazo.push(s.mazo.splice(s.idx, 1)[0]); if (s.idx >= s.mazo.length) s.idx = 0; s.volteada = false; rep();
    });
  }
}

/* 5 · Test. Opciones barajadas; acepta cualquier número de opciones. */
function hubTest(c, ambito, temas) {
  const s = hl(ambito);
  [...s.testSel].forEach(id => { if (!temas.some(t => t.id === id)) s.testSel.delete(id); });
  if (s.test) return pintarPregunta(c, ambito, temas);
  const filtroQ = (t, q) => !s.soloFalladas || fallada(t.id, q);
  const disp = temas.filter(t => !s.testSel.size || s.testSel.has(t.id)).reduce((n, t) => n + qs(t).filter(q => filtroQ(t, q)).length, 0);
  const nFalladas = temas.reduce((n, t) => n + qs(t).filter(q => fallada(t.id, q)).length, 0);
  c.innerHTML = `
    <div class="card">
      <div class="test-cfg">
        <label>Nº de preguntas <select id="tn">${[10, 20, 30, 50, 100].map(n => `<option ${n === s.testN ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        <button class="btn btn-primary" id="t-go" ${disp ? "" : "disabled"}>🚀 Empezar</button>
        <span class="muted" style="font-size:13px">${plural(disp, "pregunta disponible", "preguntas disponibles")}</span>
      </div>
      <div class="chip-row" style="margin-bottom:8px">
        <button class="chip peq ${!s.soloFalladas ? "active" : ""}" data-modo="todas">Todas</button>
        <button class="chip peq ${s.soloFalladas ? "active" : ""}" data-modo="falladas" ${nFalladas ? "" : "disabled"}>🔁 Solo las que fallé<span class="badge">${nFalladas}</span></button>
      </div>
      ${temas.length > 1 ? `<div class="chip-row wrap" style="margin-bottom:0"><button class="chip peq ${!s.testSel.size ? "active" : ""}" data-tt="todos">Todos</button>${temas.map(t =>
        `<button class="chip peq ${s.testSel.has(t.id) ? "active" : ""}" data-tt="${t.id}">${esc(codigoDe(t.id))}<span class="badge">${qs(t).length}</span></button>`).join("")}</div>` : ""}
      <p class="muted" style="font-size:13px;margin:12px 0 0">El examen real descuenta 1/3 por error: practica también a dejar en blanco.</p>
    </div>`;
  document.getElementById("tn").addEventListener("change", e => { s.testN = parseInt(e.target.value, 10); });
  c.querySelectorAll("[data-modo]").forEach(x => x.addEventListener("click", () => { s.soloFalladas = x.dataset.modo === "falladas"; hubTest(c, ambito, temas); }));
  c.querySelectorAll("[data-tt]").forEach(x => x.addEventListener("click", () => {
    const id = x.dataset.tt;
    if (id === "todos") s.testSel.clear(); else if (s.testSel.has(id)) s.testSel.delete(id); else s.testSel.add(id);
    hubTest(c, ambito, temas);
  }));
  document.getElementById("t-go").addEventListener("click", () => {
    const pool = [];
    temas.forEach(t => { if (s.testSel.size && !s.testSel.has(t.id)) return; qs(t).forEach(q => { if (filtroQ(t, q)) pool.push(Object.assign({ _id:t.id }, q)); }); });
    if (!pool.length) { toast("Sin preguntas en este filtro", "error"); return; }
    const elegidas = barajar(pool).slice(0, Math.min(s.testN, pool.length)).map(q => {
      const orden = barajar(q.o.map((_, i) => i));
      return Object.assign({}, q, { o:orden.map(i => q.o[i]), _c:orden.indexOf(q.c) });
    });
    s.test = { qs:elegidas, i:0, bien:0, mal:0, inicio:Date.now(), resp:null };
    pintarPregunta(c, ambito, temas);
  });
}
function pintarPregunta(c, ambito, temas) {
  const s = hl(ambito), r = s.test;
  if (r.i >= r.qs.length) {
    const n = r.qs.length;
    const neta = Math.max(0, r.bien - r.mal / 3);
    // El resultado se guarda una vez (es tu progreso y se sincroniza).
    if (!r.guardado && (r.bien + r.mal) > 0) { r.guardado = true; marcarProg("T:" + ambito + ":" + Date.now().toString(36), true, { a:r.bien, f:r.mal, b:n - r.bien - r.mal, n, amb:ambito }); }
    const seg = Math.round((Date.now() - r.inicio) / 1000);
    c.innerHTML = `
      <div class="card resultado">
        <div class="big">${Math.round(r.bien / n * 100)}%</div>
        <p style="margin:0 0 6px">${plural(r.bien, "acierto")} y ${plural(r.mal, "error", "errores")} de ${n} · ${Math.floor(seg / 60)} min ${seg % 60} s</p>
        <p class="muted" style="margin:0 0 16px;font-size:14px">Con penalización de −1/3 por error: <b>${neta.toFixed(2)}</b> de ${n} (${(neta / n * 100).toFixed(1)} %)</p>
        <button class="btn btn-primary" id="t-fin">← Volver</button>
      </div>`;
    document.getElementById("t-fin").addEventListener("click", () => { s.test = null; hubTest(c, ambito, temas); });
    return;
  }
  const q = r.qs[r.i];
  const letras = "ABCDEFGH";
  c.innerHTML = `
    <div class="card">
      <div class="q-meta"><span>Pregunta ${r.i + 1} de ${r.qs.length}</span><span class="tag acc">${esc(codigoDe(q._id))}</span></div>
      <div class="q-txt">${esc(q.q)}</div>
      <div class="q-opts">${q.o.map((o, i) => `<button class="q-opt" data-i="${i}"><span class="l">${letras[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="fb"></div>
      <div class="btn-row" style="justify-content:space-between;margin-top:14px">
        <button class="btn btn-sm" id="t-salir">Terminar</button>
        <button class="btn btn-sm" id="t-blanco">Dejar en blanco →</button>
      </div>
    </div>`;
  const sig = () => { r.i++; pintarPregunta(c, ambito, temas); };
  document.getElementById("t-salir").addEventListener("click", () => { r.qs = r.qs.slice(0, r.i); pintarPregunta(c, ambito, temas); });
  document.getElementById("t-blanco").addEventListener("click", sig);
  c.querySelectorAll(".q-opt").forEach(b => b.addEventListener("click", () => {
    const i = parseInt(b.dataset.i, 10);
    const ok = i === q._c;
    if (ok) r.bien++; else r.mal++;
    registrarRespuesta(q._id, q, ok);
    c.querySelectorAll(".q-opt").forEach((x, j) => { x.disabled = true; if (j === q._c) x.classList.add("bien"); if (j === i && !ok) x.classList.add("mal"); });
    document.getElementById("t-blanco").hidden = true;
    document.getElementById("fb").innerHTML = `
      <div class="q-fb ${ok ? "bien" : "mal"}">${ok ? "✓ Correcto." : "✗ Era la " + letras[q._c] + "."} ${esc(q.e || "")}</div>
      <div class="btn-row" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-primary" id="t-sig">${r.i + 1 === r.qs.length ? "Ver resultado →" : "Siguiente →"}</button></div>`;
    document.getElementById("t-sig").addEventListener("click", sig);
  }));
}

/* 6 · Progreso */
function hubProgreso(c, ambito, temas) {
  const G = { glossary:t => t.glossary, timeline:t => t.timeline, flashcards:fcs, questions:qs };
  const sum = k => temas.reduce((n, t) => n + G[k](t).length, 0);
  const fcT = sum("flashcards");
  const fcK = temas.reduce((n, t) => n + sabidasDe(t), 0);
  const total = ambito === "global" ? TEMAS.length : BLOQUE_POR_CODE[ambito].total;
  c.innerHTML = `
    <div class="kpis" style="margin-top:0">
      <div class="kpi"><div class="k">Temas</div><div class="v">${temas.length}/${total}</div><div class="s">desarrollados</div></div>
      <div class="kpi"><div class="k">Glosario</div><div class="v">${sum("glossary")}</div><div class="s">conceptos</div></div>
      <div class="kpi"><div class="k">Cronología</div><div class="v">${sum("timeline")}</div><div class="s">hitos</div></div>
      <div class="kpi"><div class="k">Flashcards</div><div class="v">${fcK}/${fcT}</div><div class="s">${fcT ? Math.round(fcK / fcT * 100) : 0}% dominadas</div></div>
      <div class="kpi"><div class="k">Test</div><div class="v">${sum("questions")}</div><div class="s">preguntas</div></div>
    </div>
    ${ambito === "global" ? `
      <h2 class="section-title">Por bloque</h2>
      <div class="card tabla-wrap"><table class="tabla"><thead><tr><th>Bloque</th><th class="n">Temas</th><th class="n">Gl.</th><th class="n">Hitos</th><th class="n">FC</th><th class="n">Preg.</th></tr></thead><tbody>
        ${BLOQUES.map(b => { const ts = temas.filter(t => t.group === b.code); const s2 = k => ts.reduce((n, t) => n + G[k](t).length, 0);
          return `<tr class="clic" data-ir="#/bloque/${b.code}"><td><b>${b.rom}</b> · ${esc(b.nombre)}</td><td class="n">${ts.length}/${b.total}</td><td class="n">${s2("glossary")}</td><td class="n">${s2("timeline")}</td><td class="n">${s2("flashcards")}</td><td class="n">${s2("questions")}</td></tr>`; }).join("")}
      </tbody></table></div>` : ""}
    <h2 class="section-title">Tests realizados</h2>
    <div class="card">${historialTests(resultadosTest(d => ambito === "global" || d.amb === ambito || (String(d.amb).startsWith("t:" + ambito + "T"))))}</div>
    <h2 class="section-title">Por tema</h2>
    <div class="card tabla-wrap"><table class="tabla"><thead><tr><th>Tema</th><th class="n">Gl.</th><th class="n">Hitos</th><th class="n">Rep.</th><th class="n">FC</th><th class="n">Preg.</th></tr></thead><tbody>
      ${temas.map(t => `<tr class="clic" data-ir="#/tema/${t.id}"><td><b style="color:var(--accent)">${esc(codigoDe(t.id))}</b> · ${esc(TEMA_POR_ID[t.id].e)}</td><td class="n">${t.glossary.length}</td><td class="n">${t.timeline.length}</td><td class="n">${repasoDe(t).hechos}/${repasoDe(t).n}</td><td class="n">${sabidasDe(t)}/${fcs(t).length}</td><td class="n">${qs(t).length}</td></tr>`).join("")}
    </tbody></table></div>`;
  c.querySelectorAll("[data-ir]").forEach(x => x.addEventListener("click", () => ir(x.dataset.ir)));
}

/* ---- Guía de fuentes (secciones 1, 2, 3, 5 y 6 del documento) ---------- */

}

  const porBloque = lista => BLOQUES.map(b => `${b.rom}: ${lista.filter(c => c.split(".")[0] === b.rom).length}`).join("; ");
  vista().innerHTML = `
    <h1 class="titulo-grande">Guía de fuentes</h1>

          <tr><td><b>A · Norma oficial</b></td><td>Texto consolidado en el BOE (enlace directo al identificador BOE-A-…)</td><td>Máxima: es lo que se pregunta</td><td>Base del test (preguntas literales) y del supuesto</td></tr>
          <tr><td><b>B · Fuente institucional</b></td><td>Webs de órganos públicos (Congreso, PE, IGAE, AEPD, SEPE…)</td><td>Alta; comentario no normativo</td><td>Comprender y esquematizar; datos actualizados</td></tr>

      <ul>
        <li>No existe un «temario oficial» desarrollado. El INAP y la Comisión Permanente de Selección publican solo el programa (los epígrafes del anexo VII). Cualquier temario desarrollado es de una academia o propio.</li>
        <li>La legislación exigible es la vigente en la fecha de cada ejercicio. Por eso los enlaces apuntan al texto consolidado y no a la publicación original.</li>
        <li>Identificadores BOE verificados uno a uno contra la ficha oficial del BOE (2-10-2026). <span class="verif">verif.</span> marca normas, cifras o webs citadas sin identificador o sin comprobar en esa revisión: contrástalas antes de incorporarlas a tus temas.</li>
        <li>Los epígrafes están resumidos. El texto íntegro y vinculante está en el anexo VII de la convocatoria (<a href="https://www.boe.es/diario_boe/txt.php?id=${PROGRAMA_REF}" target="_blank" rel="noopener">${PROGRAMA_REF}</a>).</li>
      </ul>

    <section class="card">
      <h3 class="card-title">4. Cómo convertir las fuentes en un tema que apruebe holgadamente</h3>
      <ul>
        <li><b>Test</b> (100 preguntas, −1/3 por error): se nutre casi solo del nivel A. Leer la norma consolidada, no un resumen: los distractores juegan con plazos, órganos y cifras literales.</li>
        <li><b>Supuesto práctico</b> (bloques IV-VI, 150 min): el modelo real son los mejores ejercicios publicados por el INAP en el Espacio del Opositor. Practicar con ellos antes que con supuestos de academia.</li>
        <li><b>Orden de trabajo por tema:</b> (1) epígrafe literal del BOE → (2) norma consolidada → (3) fuente institucional para entender y actualizar datos → (4) temario de academia para la redacción final → (5) preguntas de exámenes oficiales del tema.</li>
        <li><b>Temas que más caducan</b> (ACTUALIZAR): reservar una vuelta específica de actualización en las 4-6 semanas previas al examen.</li>
      </ul>
      ${botonesTemas(actualizar)}
      <ul>
        <li><b>Método de actualización:</b> abrir el texto consolidado del BOE y mirar la fecha de «última actualización» y la lista de modificaciones al pie; contrastar los datos de planes y estrategias en la web del ministerio responsable.</li>
      </ul>
    </section>

          <tr><td>${'<span class="tag azul">BOE + temario</span>'}</td><td>${botonesTemas(porFuente("BOE+T"))}</td><td class="n">${porFuente("BOE+T").length}</td><td>La norma como fuente principal; el temario como mapa (qué artículos entran) y para la parte doctrinal o práctica. Todo dato se contrasta con el BOE.</td></tr>
          <tr><td>${'<span class="tag lila">Temario / fuentes inst.</span>'}</td><td>${botonesTemas(porFuente("INST"))}</td><td class="n">${porFuente("INST").length}</td><td>Temario o Fichas temáticas del PE y webs institucionales; el BOE solo para las normas concretas que se citen. Son los temas que más caducan.</td></tr>
        </tbody>
      </table></div>
      <ul>
        <li><b>Lectura por bloques:</b> IV, V y VI se pueden preparar casi enteros desde el BOE (con apoyo en doctrina en IV.1, IV.3, IV.7 e IV.9 y práctica en VI.5 y VI.8); I es casi todo BOE más la Sinopsis; II y III son los que de verdad necesitan temario o fuentes institucionales.</li>
        <li><b>Consecuencia práctica:</b> si compras temario, la parte que más rinde es la de los bloques II y III; para el resto puede bastar como índice. Valoración del documento basada en la letra de los epígrafes.</li>
      </ul>
    </section>

    <section class="card">
      <h3 class="card-title">Cómo añadir el contenido de un tema</h3>
      <ul>
        <li>Desde la ficha de cada tema: <b>Empezar a desarrollar</b> (o <b>Editar</b>). Los apuntes se escriben por apartados y en pestañas aparte el glosario, la cronología, las flashcards y las preguntas tipo test. Se guarda solo mientras escribes y también funciona sin conexión.</li>
        <li>Si ya tienes un tema en un archivo de estudio (<code>.html</code> con <code>TEMARIO_DATA</code>), se puede importar desde la ficha del tema.</li>
        <li><b>Sincronización:</b> con la sesión de Niblo iniciada, el contenido de los temas se comparte con tu hogar y tu progreso de flashcards (solo tuyo) se sincroniza entre tus dispositivos al momento. Sin conexión se guarda aquí y se sube solo al volver la red. El indicador de la cabecera dice en qué estado está.</li>
        <li>Copia de seguridad: el botón de descarga de la cabecera guarda todos los temas y tu progreso en un <code>.json</code> que se puede volver a importar.</li>
        <li>También se pueden publicar junto a esta página en <code>${CARPETA_TEMAS}B4T11_estudio.html</code> (etc.) y cargarlos con el botón de recargar de la cabecera.</li>

};</pre>

/* ========================================================================
   (e) EVENTOS + arranque
   ====================================================================== */
function aplicarTema(t) {
  if (t) document.documentElement.setAttribute("data-tema", t);
}
document.getElementById("btn-tema").addEventListener("click", () => {
  const actual = document.documentElement.getAttribute("data-tema")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro");
  const nuevo = actual === "oscuro" ? "claro" : "oscuro";
  aplicarTema(nuevo);
  try { localStorage.setItem(KEY_TEMA, nuevo); } catch (_) {}
});
document.getElementById("btn-guardar").addEventListener("click", exportarCopia);
document.getElementById("panel-cerrar").addEventListener("click", () => cerrarPanel());
document.getElementById("panel-fondo").addEventListener("click", () => cerrarPanel());
document.getElementById("panel-volver").addEventListener("click", () => abrirPanel("menu"));
document.getElementById("btn-servidor").addEventListener("click", buscarEnServidor);
document.getElementById("sync-pill").addEventListener("click", () => {
  if (!haySesion()) { toast("Entra en Niblo con tu cuenta para sincronizar el hub entre dispositivos"); return; }
  if (S.estado === "error" || S.estado === "sesion") {
    let copiado = false;
    try { if (navigator.clipboard) { navigator.clipboard.writeText(S.detalle); copiado = true; } } catch (_) {}
    toast(S.detalle + (copiado ? "  (copiado)" : ""), "error", 12000);
  }
  sincronizar();
});
window.addEventListener("hashchange", render);
window.addEventListener("storage", e => {
  // Si se cambia el tema en Niblo con esta pestaña abierta, se sigue.
  if (e.key === KEY_TEMA && (e.newValue === "claro" || e.newValue === "oscuro")) aplicarTema(e.newValue);
  // Entrar, salir o renovar el token en Niblo (otra pestaña) se nota aquí.
  if (e.key === KEY_SUPABASE) cambioDeSesion();
});
/** Relee la sesión de Niblo y actúa si ha cambiado de persona. */
function cambioDeSesion() {
  const uidAntes = SUPA.uid;
  leerSesion();
  if (SUPA.uid !== uidAntes) {
    rtCerrar();
    cargarProgreso(SUPA.uid);
    olvidarMazos(); render();
  } else if (RT.conectado) rtToken();
  if (haySesion()) programarSync(100); else ponerSync("local");
}
window.addEventListener("online", () => programarSync(100));
window.addEventListener("offline", () => ponerSync("offline"));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  // En el móvil el WebSocket muere en segundo plano: al volver, ponerse al día.
  leerSesion();
  programarSync(100);
});
// Red de seguridad por si se pierde algún aviso en vivo.
setInterval(() => { if (document.visibilityState === "visible" && haySesion()) sincronizar(); }, 120000);

(async function arrancar() {
  leerSesion();
  cargarProgreso(SUPA.uid);
  pintarSync();
  render();                       // el programa se ve ya; el contenido llega después
  try {
    await abrirDB();
    estado.temas = {};
    const guardados = await dbTodos();
    for (const k in guardados) {
      if (!TEMA_POR_ID[k]) continue;
      const t = guardados[k];
      // Temas cargados antes de existir la sincronización: a la cola.
      if (!t.modificado) { t.modificado = ms(t.cargado) || Date.now(); pend.temas[k] = 1; await dbPut(t); }
      estado.temas[k] = t;
    }
    guardarPend();
    migrarProgresoV1();
    await cargarEmbebidos();
  } catch (e) {
    console.error(e);
    toast("No se pudo abrir el almacenamiento local: el contenido no se guardará", "error");
  }
  render();
  sincronizar();
})();
</script>
