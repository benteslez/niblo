idos por la Administración con fondos públicos, en los términos que la ley establezca.\n> 8. Los poderes públicos inspeccionarán y homologarán el sistema educativo para garantizar el cumplimiento de las leyes.\n> 9. Los poderes públicos ayudarán a los centros docentes que reúnan los requisitos que la ley establezca.\n> 10. Se reconoce la **autonomía de las Universidades**, en los términos que la ley establezca.\n\n=> Titulares: «Todos»; los padres, para la formación religiosa y moral de sus hijos (27.3)\n=> Contenido: \n=> - 27.1, derecho a la educación y libertad de enseñanza\n=> - 27.2, objeto: el pleno desarrollo de la personalidad humana\n=> - 27.3, formación religiosa y moral según las convicciones de los padres\n=> - 27.4, enseñanza básica obligatoria y gratuita\n=> - 27.5, programación general de la enseñanza y creación de centros\n=> - 27.6, libertad de creación de centros docentes\n=> - 27.7, profesores, padres y, en su caso, alumnos intervienen en los centros sostenidos con fondos públicos\n=> - 27.8, inspección y homologación\n=> - 27.9, ayudas a los centros\n=> - 27.10, autonomía de las Universidades\n=> Límites: \n=> - 27.2, el respeto a los principios democráticos de convivencia y a los derechos y libertades fundamentales\n=> - 27.6, creación de centros dentro del respeto a los principios constitucionales\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: Alumnos: «en su caso». Autonomía universitaria «en los términos que la ley establezca».\n\n### 7.2 Libertad sindical y huelga (art. 28)\n\n> **Artículo 28.**\n> 1. Todos tienen derecho a sindicarse libremente. La ley podrá **limitar o exceptuar** el ejercicio de este derecho a las Fuerzas o Institutos armados o a los demás Cuerpos sometidos a disciplina militar y **regulará las peculiaridades de su ejercicio para los funcionarios públicos**. La libertad sindical comprende el derecho a fundar sindicatos y a afiliarse al de su elección, así como el derecho de los sindicatos a formar confederaciones y a fundar organizaciones sindicales internacionales o a afiliarse a las mismas. **Nadie podrá ser obligado a afiliarse a un sindicato**.\n> 2. Se reconoce el derecho a la huelga de los trabajadores para la defensa de sus intereses. La ley que regule el ejercicio de este derecho establecerá las garantías precisas para asegurar el **mantenimiento de los servicios esenciales de la comunidad**.\n\n=> Titulares: 28.1, «Todos tienen derecho a sindicarse libremente»; 28.2, «los trabajadores»\n=> Contenido: \n=> - 28.1, libertad sindical: fundar sindicatos y afiliarse; los sindicatos pueden formar confederaciones y organizaciones internacionales; nadie obligado a afiliarse\n=> - 28.2, huelga de los trabajadores para la defensa de sus intereses\n=> Límites: \n=> - Fuerzas o Institutos armados y Cuerpos con disciplina militar: la ley puede **limitar o exceptuar** la libertad sindical\n=> - Funcionarios públicos: la ley regula sus **peculiaridades**\n=> - Huelga: garantías para mantener los **servicios esenciales** de la comunidad\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **sí**, en los estados de excepción y de sitio (art. 55.1 → III.2): solo la **huelga (28.2)**; la libertad sindical (28.1), no\n=> ⚠ Ojo en el examen: Los **jueces** no están aquí: su prohibición de sindicarse está en el **art. 127**.\n\n### 7.3 Petición (art. 29)\n\n> **Artículo 29.**\n> 1. Todos los españoles tendrán el derecho de petición **individual y colectiva, por escrito**, en la forma y con los efectos que determine la ley.\n> 2. Los miembros de las Fuerzas o Institutos armados o de los Cuerpos sometidos a disciplina militar podrán ejercer este derecho **sólo individualmente** y con arreglo a lo dispuesto en su legislación específica.\n\n=> Titulares: «Todos los españoles»\n=> Contenido: Petición individual y colectiva, **por escrito**, en la forma y con los efectos que determine la ley\n=> Límites: Miembros de las Fuerzas o Institutos armados y Cuerpos con disciplina militar: «sólo individualmente» y según su legislación específica\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: Siempre **por escrito**. Militares: **solo individual**.\n\n!> **Idea clave del grupo.** Solo se suspende la **huelga (28.2)**.","nivel":2},{"id":"s4","title":"I.8 Sección 2.ª (I): defensa, tributos, matrimonio, propiedad y fundación (arts. 30 a 34)","body":"La Sección 2.ª, «De los derechos y deberes de los ciudadanos», tiene **protección intermedia** (→ II.1): vinculación de todos los poderes públicos, reserva de ley con contenido esencial y recurso de inconstitucionalidad, pero **sin** procedimiento preferente y sumario, **sin** amparo (salvo la objeción de conciencia) y **sin** reforma agravada. También es donde la Constitución concentra los **deberes** (→ I.12).\n\n### 8.1 Defensa de España y objeción de conciencia (art. 30)\n\n> **Artículo 30.**\n> 1. Los españoles tienen **el derecho y el deber de defender a España**.\n> 2. La ley fijará las obligaciones militares de los españoles y regulará, con las debidas garantías, **la objeción de conciencia**, así como las demás causas de exención del servicio militar obligatorio, pudiendo imponer, en su caso, una **prestación social sustitutoria**.\n> 3. Podrá establecerse un **servicio civil** para el cumplimiento de fines de interés general.\n> 4. Mediante ley podrán regularse los deberes de los ciudadanos en los casos de **grave riesgo, catástrofe o calamidad pública**.\n\n=> Titulares: «Los españoles» (30.1); los ciudadanos (30.4)\n=> Contenido: \n=> - 30.1, **derecho y deber** de defender a España\n=> - 30.2, la ley fija las obligaciones militares y regula la objeción de conciencia y las exenciones del servicio militar obligatorio; puede imponer una prestación social sustitutoria\n=> - 30.3, puede establecerse un servicio civil para fines de interés general\n=> - 30.4, la ley puede regular deberes en casos de grave riesgo, catástrofe o calamidad pública\n=> Límites: La objeción de conciencia, «con las debidas garantías» que fije la ley\n=> Protección: Intermedia (Sección 2.ª): vinculación, reserva de ley con contenido esencial y recurso de inconstitucionalidad; sin amparo (→ II.1)\n=> - **Excepción:** la objeción de conciencia tiene **amparo** (arts. 53.2 CE y 41.1 LOTC → II.5)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: La objeción de conciencia es el **único** derecho de la Sección 2.ª con amparo. «Podrá establecerse» un servicio civil: no es obligatorio.\n\n### 8.2 Sistema tributario y gasto público (art. 31)\n\n> **Artículo 31.**\n> 1. Todos contribuirán al sostenimiento de los gastos públicos de acuerdo con su **capacidad económica** mediante un sistema tributario justo inspirado en los principios de **igualdad y progresividad** que, **en ningún caso, tendrá alcance confiscatorio**.\n> 2. El gasto público realizará una asignación equitativa de los recursos públicos, y su programación y ejecución responderán a los criterios de **eficiencia y economía**.\n> 3. Sólo podrán establecerse prestaciones personales o patrimoniales de carácter público **con arreglo a la ley**.\n\n=> Titulares: «Todos»\n=> Contenido: \n=> - 31.1, **deber** de contribuir según la capacidad económica, con un sistema tributario justo\n=> - 31.2, gasto público: asignación equitativa de los recursos\n=> - 31.3, reserva de ley para las prestaciones personales o patrimoniales de carácter público\n=> Límites: \n=> - Sistema tributario (31.1): igualdad, progresividad y **no confiscatoriedad**\n=> - Gasto (31.2): **eficiencia y economía**\n=> Protección: Intermedia (Sección 2.ª): vinculación, reserva de ley con contenido esencial y recurso de inconstitucionalidad; sin amparo (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: No mezclar los principios del **tributo** (igualdad, progresividad, no confiscatorio) con los criterios del **gasto** (eficiencia y economía). Literal: «en ningún caso, tendrá alcance confiscatorio».\n\n### 8.3 Matrimonio (art. 32)\n\n> **Artículo 32.**\n> 1. El hombre y la mujer tienen derecho a contraer matrimonio **con plena igualdad jurídica**.\n> 2. La ley regulará las formas de matrimonio, la edad y capacidad para contraerlo, los derechos y deberes de los cónyuges, las causas de separación y disolución y sus efectos.\n\n=> Titulares: «El hombre y la mujer»\n=> Contenido: Derecho a contraer matrimonio con plena igualdad jurídica\n=> Límites: La ley regula las formas, la edad y capacidad, los derechos y deberes de los cónyuges y las causas de separación y disolución\n=> Protección: Intermedia (Sección 2.ª): vinculación, reserva de ley con contenido esencial y recurso de inconstitucionalidad; sin amparo (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: «con **plena** igualdad jurídica».\n\n### 8.4 Propiedad privada y herencia (art. 33)\n\n> **Artículo 33.**\n> 1. Se reconoce el derecho a la propiedad privada y a la herencia.\n> 2. La **función social** de estos derechos delimitará su contenido, de acuerdo con las leyes.\n> 3. Nadie podrá ser privado de sus bienes y derechos sino por causa justificada de **utilidad pública o interés social**, mediante la **correspondiente indemnización** y de conformidad con lo dispuesto por las leyes.\n\n=> Titulares: No se nombra titular («Se reconoce el derecho a la propiedad privada y a la herencia»)\n=> Contenido: \n=> - 33.1, propiedad privada y herencia\n=> - 33.3, garantía expropiatoria: base de la **expropiación forzosa** (tema IV.8)\n=> Límites: \n=> - 33.2, la **función social** delimita su contenido\n=> - 33.3, privación solo por **causa justificada de utilidad pública o interés social**, con **indemnización** y conforme a las leyes\n=> Protección: Intermedia (Sección 2.ª): vinculación, reserva de ley con contenido esencial y recurso de inconstitucionalidad; sin amparo (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: Tres requisitos de la expropiación: causa (utilidad pública o interés social), indemnización y conformidad con las leyes.\n\n### 8.5 Fundación (art. 34)\n\n> **Artículo 34.**\n> 1. Se reconoce el derecho de fundación **para fines de interés general**, con arreglo a la ley.\n> 2. Regirá también para las fundaciones lo dispuesto en los **apartados 2 y 4 del artículo 22**.\n\n=> Titulares: No se nombra titular\n=> Contenido: Derecho de fundación para fines de **interés general**, con arreglo a la ley\n=> Límites: Se le aplican los apartados **2 y 4** del art. 22: ilegales si sus fines o medios son delito; disolución o suspensión solo por resolución judicial motivada (→ I.5.3)\n=> Protección: Intermedia (Sección 2.ª): vinculación, reserva de ley con contenido esencial y recurso de inconstitucionalidad; sin amparo (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: Apartados «**2 y 4**» del art. 22, no el 3 (la inscripción registral).","nivel":2},{"id":"s4-1","title":"I.9 Sección 2.ª (II): trabajo, colegios, negociación colectiva y empresa (arts. 35 a 38)","body":"Segunda parte de la Sección 2.ª: los derechos del **ámbito económico y laboral**. Misma protección intermedia (→ II.1).\n\n### 9.1 Trabajo (art. 35)\n\n> **Artículo 35.**\n> 1. Todos los españoles tienen **el deber de trabajar y el derecho al trabajo**, a la libre elección de profesión u oficio, a la promoción a través del trabajo y a una **remuneración suficiente** para satisfacer sus necesidades y las de su familia, sin que en ningún caso pueda hacerse discriminación **por razón de sexo**.\n> 2. La ley regulará un **estatuto de los trabajadores**.\n\n=> Titulares: «Todos los españoles»\n=> Contenido: \n=> - 35.1, **deber** de trabajar y **derecho** al trabajo; libre elección de profesión u oficio; promoción a través del trabajo; remuneración suficiente para el trabajador y su familia\n=> - 35.2, la ley regulará un **estatuto de los trabajadores**\n=> Límites: Sin discriminación por razón de sexo\n=> Protección: Intermedia (Sección 2.ª): vinculación, reserva de ley con contenido esencial y recurso de inconstitucionalidad; sin amparo (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: Remuneración «suficiente para satisfacer sus necesidades y las de su familia». Discriminación expresamente prohibida: «por razón de sexo».\n\n### 9.2 Colegios profesionales (art. 36)\n\n> **Artículo 36.**\n> La ley regulará las peculiaridades propias del régimen jurídico de los Colegios Profesionales y el ejercicio de las profesiones tituladas. La estructura interna y el funcionamiento de los Colegios **deberán ser democráticos**.\n\n=> Qué: Reserva de ley para el régimen de los colegios profesionales y el ejercicio de las profesiones tituladas\n=> Quién: El legislador; los colegios\n=> Cómo: Estructura interna y funcionamiento **democráticos**\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Exigen estructura democrática: colegios (36), organizaciones profesionales (52) y, fuera del Título I, partidos (6) y sindicatos y asociaciones empresariales (7).\n\n### 9.3 Negociación colectiva y conflicto colectivo (art. 37)\n\n> **Artículo 37.**\n> 1. La ley garantizará el derecho a la negociación colectiva laboral entre los representantes de los trabajadores y empresarios, así como la **fuerza vinculante de los convenios**.\n> 2. Se reconoce el derecho de los **trabajadores y empresarios a adoptar medidas de conflicto colectivo**. La ley que regule el ejercicio de este derecho, sin perjuicio de las limitaciones que puedan establecer, incluirá las garantías precisas para asegurar el funcionamiento de los servicios esenciales de la comunidad.\n\n=> Titulares: Los representantes de los trabajadores y empresarios (37.1); los **trabajadores y empresarios** (37.2)\n=> Contenido: \n=> - 37.1, negociación colectiva laboral y fuerza vinculante de los convenios\n=> - 37.2, medidas de conflicto colectivo\n=> Límites: La ley incluirá garantías para «asegurar el funcionamiento de los servicios esenciales de la comunidad»\n=> Protección: Intermedia (Sección 2.ª): vinculación, reserva de ley con contenido esencial y recurso de inconstitucionalidad; sin amparo (→ II.1)\n=> - Suspendible: **sí, el 37.2**, en excepción y sitio (55.1 → III.2): es el **único** de la Sección 2.ª\n=> ⚠ Ojo en el examen: Huelga (28.2): de los «trabajadores». Conflicto colectivo (37.2): de «trabajadores **y empresarios**».\n\n### 9.4 Libertad de empresa (art. 38)\n\n> **Artículo 38.**\n> Se reconoce la libertad de empresa **en el marco de la economía de mercado**. Los poderes públicos garantizan y protegen su ejercicio y la defensa de la productividad, de acuerdo con las exigencias de la economía general y, en su caso, de **la planificación**.\n\n=> Titulares: No se nombra titular («Se reconoce la libertad de empresa»)\n=> Contenido: Libertad de empresa **en el marco de la economía de mercado**; los poderes públicos garantizan y protegen su ejercicio y la defensa de la productividad\n=> Límites: Las exigencias de la economía general y, en su caso, la **planificación**\n=> Protección: Intermedia (Sección 2.ª): vinculación, reserva de ley con contenido esencial y recurso de inconstitucionalidad; sin amparo (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: «economía de **mercado**»; el límite puede ser «en su caso, de la planificación».","nivel":2},{"id":"s4-2","title":"I.10 Capítulo tercero (I): naturaleza y arts. 39 a 45","body":"### 10.1 Naturaleza de los principios rectores\n\nEl Capítulo tercero, «De los principios rectores de la política social y económica», no reconoce, en general, derechos exigibles directamente ante un juez, sino **mandatos** que orientan el Estado social («Estado social y democrático de Derecho», art. 1.1). Su eficacia la fija el art. 53.3 (→ II.1):\n- «informarán la legislación positiva, la práctica judicial y la actuación de los poderes públicos»;\n- «Sólo podrán ser alegados ante la Jurisdicción ordinaria de acuerdo con lo que dispongan las leyes que los desarrollen».\n\nEn sus fichas, «Titulares» indica a **quién beneficia** el principio; los obligados son siempre los poderes públicos. Ninguno puede suspenderse.\n\n### 10.2 Familia e infancia (art. 39)\n\n> **Artículo 39.**\n> 1. Los poderes públicos aseguran la protección social, económica y jurídica de la familia.\n> 2. Los poderes públicos aseguran, asimismo, la protección integral de los hijos, iguales éstos ante la ley **con independencia de su filiación**, y de las madres, cualquiera que sea su estado civil. La ley posibilitará la **investigación de la paternidad**.\n> 3. Los padres deben prestar **asistencia de todo orden** a los hijos habidos dentro o fuera del matrimonio, durante su minoría de edad y en los demás casos en que legalmente proceda.\n> 4. Los niños gozarán de la protección prevista en los **acuerdos internacionales** que velan por sus derechos.\n\n=> Titulares: La familia, los hijos, las madres y los niños\n=> Contenido: \n=> - 39.1, protección social, económica y jurídica de la **familia**\n=> - 39.2, protección integral de los **hijos**, iguales con independencia de su filiación, y de las **madres**, cualquiera que sea su estado civil; investigación de la paternidad\n=> - 39.3, **deber** de los padres de prestar asistencia de todo orden a los hijos, dentro o fuera del matrimonio\n=> - 39.4, los niños gozan de la protección de los **acuerdos internacionales**\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: «La ley posibilitará la investigación de la paternidad». Madres «cualquiera que sea su estado civil».\n\n### 10.3 Política económica y laboral (art. 40)\n\n> **Artículo 40.**\n> 1. Los poderes públicos promoverán las condiciones favorables para el progreso social y económico y para una distribución de la renta regional y personal más equitativa, en el marco de una política de estabilidad económica. De manera especial realizarán una **política orientada al pleno empleo**.\n> 2. Asimismo, los poderes públicos fomentarán una política que garantice la formación y readaptación profesionales; velarán por la seguridad e higiene en el trabajo y garantizarán el descanso necesario, mediante la limitación de la jornada laboral, las **vacaciones periódicas retribuidas** y la promoción de centros adecuados.\n\n=> Titulares: Los trabajadores y el conjunto de la sociedad\n=> Contenido: \n=> - 40.1, progreso social y económico y distribución más equitativa de la renta, en el marco de la estabilidad económica; política orientada al **pleno empleo**\n=> - 40.2, formación y readaptación profesionales; seguridad e higiene en el trabajo; descanso, limitación de la jornada, **vacaciones periódicas retribuidas** y centros adecuados\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: «De manera especial realizarán una política orientada al pleno empleo».\n\n### 10.4 Seguridad Social (art. 41)\n\n> **Artículo 41.**\n> Los poderes públicos mantendrán un **régimen público de Seguridad Social para todos los ciudadanos**, que garantice la asistencia y prestaciones sociales suficientes ante situaciones de necesidad, **especialmente en caso de desempleo**. La asistencia y prestaciones complementarias **serán libres**.\n\n=> Titulares: Todos los ciudadanos\n=> Contenido: Régimen **público** de Seguridad Social, con asistencia y prestaciones suficientes ante situaciones de necesidad, especialmente el desempleo\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: «La asistencia y prestaciones complementarias serán libres».\n\n### 10.5 Trabajadores en el extranjero (art. 42)\n\n> **Artículo 42.**\n> El Estado velará especialmente por la salvaguardia de los derechos económicos y sociales de los trabajadores españoles en el extranjero y **orientará su política hacia su retorno**.\n\n=> Titulares: Los trabajadores españoles en el extranjero\n=> Contenido: El Estado vela por sus derechos económicos y sociales\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: Lo encomienda al **Estado** y orienta su política hacia el **retorno**.\n\n### 10.6 Salud (art. 43)\n\n> **Artículo 43.**\n> 1. Se reconoce el **derecho a la protección de la salud**.\n> 2. Compete a los poderes públicos organizar y tutelar la salud pública a través de medidas preventivas y de las prestaciones y servicios necesarios. La ley establecerá los derechos y deberes de todos al respecto.\n> 3. Los poderes públicos fomentarán la educación sanitaria, la educación física y el deporte. Asimismo facilitarán la **adecuada utilización del ocio**.\n\n=> Titulares: No se nombra titular («Se reconoce el derecho a la protección de la salud»)\n=> Contenido: \n=> - 43.1, protección de la salud\n=> - 43.2, salud pública: medidas preventivas y prestaciones y servicios; la ley fija derechos y deberes\n=> - 43.3, educación sanitaria, educación física y deporte; adecuada utilización del ocio\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: «adecuada utilización del **ocio**» está en el art. 43.3.\n\n### 10.7 Cultura y ciencia (art. 44)\n\n> **Artículo 44.**\n> 1. Los poderes públicos promoverán y tutelarán el acceso a la cultura, **a la que todos tienen derecho**.\n> 2. Los poderes públicos promoverán la ciencia y la investigación científica y técnica en beneficio del interés general.\n\n=> Titulares: «todos»\n=> Contenido: \n=> - 44.1, acceso a la cultura\n=> - 44.2, promoción de la ciencia y la investigación científica y técnica\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: La ciencia, «en beneficio del interés general».\n\n### 10.8 Medio ambiente (art. 45)\n\n> **Artículo 45.**\n> 1. Todos tienen el derecho a disfrutar de un medio ambiente adecuado para el desarrollo de la persona, **así como el deber de conservarlo**.\n> 2. Los poderes públicos velarán por la utilización racional de todos los recursos naturales, con el fin de proteger y mejorar la calidad de la vida y defender y restaurar el medio ambiente, apoyándose en la indispensable solidaridad colectiva.\n> 3. Para quienes violen lo dispuesto en el apartado anterior, en los términos que la ley fije se establecerán **sanciones penales o, en su caso, administrativas**, así como la **obligación de reparar el daño causado**.\n\n=> Titulares: «Todos»\n=> Contenido: \n=> - 45.1, **derecho** a un medio ambiente adecuado y **deber** de conservarlo\n=> - 45.2, utilización racional de los recursos naturales, con «la indispensable solidaridad colectiva»\n=> - 45.3, sanciones y obligación de reparar el daño\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: Sanciones «penales **o, en su caso,** administrativas» y obligación de **reparar** el daño.","nivel":2},{"id":"s4-4","title":"I.11 Capítulo tercero (II): arts. 46 a 52","body":"Segunda parte del Capítulo tercero: patrimonio, vivienda, juventud y colectivos con protección específica. Misma eficacia del art. 53.3 (→ I.10.1).\n\n### 11.1 Patrimonio histórico, cultural y artístico (art. 46)\n\n> **Artículo 46.**\n> Los poderes públicos garantizarán la conservación y promoverán el enriquecimiento del patrimonio histórico, cultural y artístico de los pueblos de España y de los bienes que lo integran, cualquiera que sea su régimen jurídico y su titularidad. **La ley penal sancionará** los atentados contra este patrimonio.\n\n=> Titulares: Los pueblos de España\n=> Contenido: Conservación y enriquecimiento del patrimonio, «cualquiera que sea su régimen jurídico y su titularidad»\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: Protección **penal** expresa: «La ley penal sancionará los atentados contra este patrimonio».\n\n### 11.2 Vivienda (art. 47)\n\n> **Artículo 47.**\n> Todos los españoles tienen derecho a disfrutar de una **vivienda digna y adecuada**. Los poderes públicos promoverán las condiciones necesarias y establecerán las normas pertinentes para hacer efectivo este derecho, regulando la utilización del suelo de acuerdo con el interés general para **impedir la especulación**. La comunidad participará en las **plusvalías** que genere la acción urbanística de los entes públicos.\n\n=> Titulares: «Todos los españoles»\n=> Contenido: \n=> - Vivienda **digna y adecuada**\n=> - Regulación del suelo según el interés general para impedir la **especulación**\n=> - Participación de la comunidad en las **plusvalías** de la acción urbanística pública\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: Titulares: «Todos los **españoles**». Las plusvalías: las que genere la acción urbanística **de los entes públicos**.\n\n### 11.3 Juventud (art. 48)\n\n> **Artículo 48.**\n> Los poderes públicos promoverán las condiciones para la participación **libre y eficaz** de la juventud en el desarrollo político, social, económico y cultural.\n\n=> Titulares: La juventud\n=> Contenido: Participación **libre y eficaz** en el desarrollo político, social, económico y cultural\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: «libre **y eficaz**».\n\n### 11.4 Personas con discapacidad (art. 49)\n\n> **Artículo 49.**\n> 1. Las personas con discapacidad ejercen los derechos previstos en este Título en condiciones de **libertad e igualdad reales y efectivas**. Se regulará por ley la protección especial que sea necesaria para dicho ejercicio.\n> 2. Los poderes públicos impulsarán las políticas que garanticen la plena autonomía personal y la inclusión social de las personas con discapacidad, en **entornos universalmente accesibles**. Asimismo, fomentarán la participación de sus organizaciones, en los términos que la ley establezca. Se atenderán particularmente las necesidades específicas de **las mujeres y los menores con discapacidad**.\n\n=> Titulares: Las personas con discapacidad\n=> Contenido: \n=> - 49.1, ejercen los derechos del Título I en condiciones de libertad e igualdad reales y efectivas\n=> - 49.2, políticas de plena autonomía personal e inclusión social, en entornos universalmente accesibles; participación de sus organizaciones; atención a las necesidades específicas de mujeres y menores con discapacidad\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: Redacción de la **reforma constitucional de 2024** (dato, no texto legal: la redacción anterior hablaba de los disminuidos físicos, sensoriales y psíquicos).\n\n### 11.5 Tercera edad (art. 50)\n\n> **Artículo 50.**\n> Los poderes públicos garantizarán, mediante **pensiones adecuadas y periódicamente actualizadas**, la suficiencia económica a los ciudadanos durante la tercera edad. Asimismo, y **con independencia de las obligaciones familiares**, promoverán su bienestar mediante un sistema de servicios sociales que atenderán sus problemas específicos de salud, vivienda, cultura y ocio.\n\n=> Titulares: Los ciudadanos durante la tercera edad\n=> Contenido: \n=> - Suficiencia económica mediante pensiones **adecuadas y periódicamente actualizadas**\n=> - Servicios sociales para salud, vivienda, cultura y ocio, **con independencia de las obligaciones familiares**\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: Pensiones «adecuadas **y periódicamente actualizadas**».\n\n### 11.6 Consumidores y usuarios (art. 51)\n\n> **Artículo 51.**\n> 1. Los poderes públicos garantizarán la defensa de los consumidores y usuarios, protegiendo, mediante procedimientos eficaces, **la seguridad, la salud y los legítimos intereses económicos** de los mismos.\n> 2. Los poderes públicos promoverán la información y la educación de los consumidores y usuarios, fomentarán sus organizaciones y oirán a éstas en las cuestiones que puedan afectar a aquéllos, en los términos que la ley establezca.\n> 3. En el marco de lo dispuesto por los apartados anteriores, la ley regulará el **comercio interior** y el régimen de autorización de productos comerciales.\n\n=> Titulares: Los consumidores y usuarios\n=> Contenido: \n=> - 51.1, defensa de su seguridad, salud y legítimos intereses económicos\n=> - 51.2, información, educación y fomento de sus organizaciones\n=> - 51.3, la ley regula el **comercio interior** y la autorización de productos comerciales\n=> Límites: —\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: El **comercio interior** aparece en este artículo (51.3).\n\n### 11.7 Organizaciones profesionales (art. 52)\n\n> **Artículo 52.**\n> La ley regulará las organizaciones profesionales que contribuyan a la defensa de los intereses económicos que les sean propios. Su estructura interna y funcionamiento **deberán ser democráticos**.\n\n=> Titulares: Las organizaciones profesionales\n=> Contenido: Contribuyen a la defensa de los intereses económicos que les sean propios\n=> Límites: «Su estructura interna y funcionamiento deberán ser democráticos»\n=> Protección: Mínima (Capítulo tercero): informa la legislación, la práctica judicial y la actuación pública; ante los jueces, según su ley de desarrollo (→ II.1)\n=> ⚠ Ojo en el examen: No confundir con los **colegios profesionales** (art. 36, Sección 2.ª). Los dos exigen estructura democrática.","nivel":2},{"id":"s4-3","title":"I.12 Los deberes constitucionales (visión de conjunto)","body":"El epígrafe dice «Derechos **y deberes** fundamentales». Los deberes no tienen capítulo propio: están repartidos por el Título I. Estos son los que la Constitución formula expresamente:\n\n| Art. | Deber | Texto literal |\n|---|---|---|\n| 27.4 | Escolarización básica | «La enseñanza básica es obligatoria y gratuita.» |\n| 30.1 | Defensa de España | «Los españoles tienen el derecho y el deber de defender a España.» |\n| 30.4 | Deberes ante grave riesgo, catástrofe o calamidad | «Mediante ley podrán regularse los deberes de los ciudadanos en los casos de grave riesgo, catástrofe o calamidad pública.» |\n| 31.1 | Contribuir a los gastos públicos | «Todos contribuirán al sostenimiento de los gastos públicos de acuerdo con su capacidad económica» |\n| 35.1 | Trabajar | «Todos los españoles tienen el deber de trabajar y el derecho al trabajo» |\n| 39.3 | Asistencia de los padres a los hijos | «Los padres deben prestar asistencia de todo orden a los hijos habidos dentro o fuera del matrimonio» |\n| 45.1 | Conservar el medio ambiente | «un medio ambiente adecuado para el desarrollo de la persona, así como el deber de conservarlo.» |\n\nFuera del Título I: el deber de conocer el castellano (art. 3.1) y la sujeción a la Constitución (art. 9.1): «Los ciudadanos y los poderes públicos están sujetos a la Constitución y al resto del ordenamiento jurídico».\n\n!> **Idea clave.** Tres deberes van unidos a un derecho: defender a España (30.1), trabajar (35.1) y el medio ambiente (45.1).\n\n@> **▸ En resumen.**\n@> • El Título I (arts. 10-55) ordena los derechos en **tres niveles**: art. 14 y Sección 1.ª (máximo), Sección 2.ª (intermedio) y Capítulo tercero (mínimo).\n@> • La titularidad cambia según el artículo: «todos», «toda persona», «los españoles», «los ciudadanos»… Es un clásico del examen.\n@> • Solo pueden suspenderse los que enumera el art. 55.1 (17, 18.2, 18.3, 19, 20.1 a y d, 20.5, 21, 28.2 y 37.2); todos de la Sección 1.ª salvo el 37.2.\n@> • Los deberes están repartidos: 27.4, 30, 31, 35, 39.3 y 45.\n@> **→ Siguiente: bloque II. Ya sabes qué derechos hay y en qué nivel está cada uno; ahora, cómo se protege cada nivel.**","nivel":2},{"id":"bII","title":"II. ¿Cómo se protegen? (arts. 53 y 54 y su desarrollo)","body":"@> **▸ Dónde estamos.** Ya sabes qué derechos hay y en qué nivel está cada uno (bloque I). Ahora, **qué mecanismos** aseguran que se respeten y **cuáles corresponden a cada nivel**.\n@> **▸ Qué vas a ver.** 1 El art. 53 y el mapa de garantías · 2 Garantías normativas (81, 86, 161-162, 167-169) · 3 Procedimiento preferente y sumario (LJCA) · 4 *Habeas corpus* (LO 6/1984) · 5 Recurso de amparo (LOTC) · 6 Cuadro de síntesis\n\n**Orden de estudio.** Primero el art. 53, que reparte las garantías; después cada garantía en el orden de sus artículos; las leyes de desarrollo (LJCA, LO 6/1984, LOTC), en el orden de sus propios artículos. La garantía **institucional** (Defensor del Pueblo, art. 54) tiene bloque propio (→ IV).","nivel":1},{"id":"s5","title":"II.1 El art. 53: las garantías según el nivel del derecho","body":"### 1.1 Qué es una garantía y qué tipos hay\n\nReconocer un derecho no basta: hacen falta **mecanismos que aseguren su respeto**. El Capítulo cuarto, «De las garantías de las libertades y derechos fundamentales» (arts. 53 y 54), los recoge junto con otros preceptos. La doctrina los clasifica en tres tipos:\n\n| Tipo | Qué hace | Dónde | Apartado |\n|---|---|---|---|\n| **Normativas** | Protegen los derechos **frente al legislador** | Arts. 53.1, 81, 86.1, 161.1 a), 167-169 | → II.2 |\n| **Jurisdiccionales** | Permiten acudir a un **tribunal** | Arts. 53.2, 17.4, 161.1 b) y 162.1 b) | → II.3 a II.5 |\n| **Institucionales** | Encargan su defensa a una **institución** | Art. 54 (Defensor del Pueblo) y art. 124 (Ministerio Fiscal) | → IV |\n\n### 1.2 Las garantías de las libertades y derechos (art. 53)\n\n> **Artículo 53.**\n> 1. Los derechos y libertades reconocidos en el Capítulo segundo del presente Título **vinculan a todos los poderes públicos**. **Sólo por ley, que en todo caso deberá respetar su contenido esencial**, podrá regularse el ejercicio de tales derechos y libertades, que se tutelarán de acuerdo con lo previsto en el **artículo 161, 1, a)**.\n> 2. Cualquier ciudadano podrá recabar la tutela de las libertades y derechos reconocidos en el artículo 14 y la Sección primera del Capítulo segundo ante los Tribunales ordinarios por un procedimiento basado en los principios de **preferencia y sumariedad** y, en su caso, a través del **recurso de amparo ante el Tribunal Constitucional**. Este último recurso será aplicable a la **objeción de conciencia reconocida en el artículo 30**.\n> 3. El reconocimiento, el respeto y la protección de los principios reconocidos en el Capítulo tercero **informarán la legislación positiva, la práctica judicial y la actuación de los poderes públicos**. Sólo podrán ser alegados ante la Jurisdicción ordinaria de acuerdo con lo que dispongan las leyes que los desarrollen.\n\n=> Qué: El precepto que **gradúa** las garantías según el lugar del derecho en el Título I\n=> Quién: \n=> - 53.1 → **todo el Capítulo segundo** (arts. 14 a 38)\n=> - 53.2 → **art. 14 y Sección 1.ª**; para el amparo, también la **objeción de conciencia** (art. 30)\n=> - 53.3 → **Capítulo tercero** (arts. 39 a 52)\n=> Cómo: \n=> - 53.1: vinculan a **todos los poderes públicos**; **reserva de ley** que respete el **contenido esencial**; tutela por el recurso de inconstitucionalidad (art. 161.1 a)\n=> - 53.2: ante los tribunales ordinarios, procedimiento de **preferencia y sumariedad**; y, en su caso, **recurso de amparo** ante el TC\n=> - 53.3: **informan** la legislación, la práctica judicial y la actuación de los poderes públicos; solo alegables según sus leyes de desarrollo\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: \n=> - 53.1 remite al «artículo 161, 1, a)», es decir, al recurso de **inconstitucionalidad**, no al de amparo\n=> - 53.2 dice «**Cualquier ciudadano**»\n=> - El amparo llega a la objeción de conciencia; el procedimiento preferente y sumario, **no**\n\n**Dos ideas que el art. 53.1 condensa** (doctrina, no texto legal):\n- **Reserva de ley:** solo una norma con rango de ley puede regular el ejercicio de estos derechos; un reglamento no puede hacerlo por sí solo.\n- **Contenido esencial:** ni siquiera la ley puede vaciar el núcleo del derecho. La STC 11/1981 lo define como las facultades sin las cuales el derecho se desnaturaliza o deja de ser reconocible.\n\n### 1.3 Otra garantía institucional: el Ministerio Fiscal (art. 124.1)\n\nAdemás del Defensor del Pueblo (→ IV), el art. 124.1 encomienda al Ministerio Fiscal «promover la acción de la justicia en defensa de la legalidad, de los derechos de los ciudadanos y del interés público tutelado por la ley». Por eso está legitimado en el amparo (→ II.5) y en el *habeas corpus* (→ II.4).","nivel":2},{"id":"s5-1","title":"II.2 Garantías normativas (arts. 81, 86, 161, 162 y 167 a 169)","body":"Las garantías normativas limitan al **legislador**: quién puede regular los derechos, con qué norma y cómo se controla. Se ven en el orden de sus artículos.\n\n### 2.1 Ley orgánica (art. 81)\n\n> **Artículo 81.**\n> 1. Son leyes orgánicas las relativas al **desarrollo de los derechos fundamentales y de las libertades públicas**, las que aprueben los Estatutos de Autonomía y el régimen electoral general y las demás previstas en la Constitución.\n> 2. La aprobación, modificación o derogación de las leyes orgánicas exigirá **mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto**.\n\n=> Qué: Reserva de **ley orgánica** para el desarrollo de los derechos fundamentales y libertades públicas\n=> Quién: Las Cortes; la mayoría la exige al **Congreso**\n=> Cómo: Aprobación, modificación o derogación en una **votación final sobre el conjunto del proyecto**\n=> Plazos y mayorías: **Mayoría absoluta del Congreso**\n=> ⚠ Ojo en el examen: \n=> - «Derechos fundamentales y libertades públicas» es la rúbrica de la **Sección 1.ª**. Que no alcance al art. 14 ni a la Sección 2.ª es **doctrina del TC**, no texto literal\n=> - Mayoría **absoluta**, no tres quintos\n\n### 2.2 Prohibición del decreto-ley (art. 86.1)\n\n> **Artículo 86.1**\n> 1. En caso de **extraordinaria y urgente necesidad**, el Gobierno podrá dictar disposiciones legislativas provisionales que tomarán la forma de Decretos-leyes y que no podrán afectar al ordenamiento de las instituciones básicas del Estado, **a los derechos, deberes y libertades de los ciudadanos regulados en el Título I**, al régimen de las Comunidades Autónomas ni al Derecho electoral general.\n\n=> Qué: Límite material del decreto-ley\n=> Quién: El Gobierno\n=> Cómo: En caso de extraordinaria y urgente necesidad puede dictar decretos-leyes, que **no podrán afectar** a los derechos, deberes y libertades del Título I (ni a otras materias que enumera)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: La prohibición alcanza a **todo el Título I**, no solo a la Sección 1.ª.\n\n### 2.3 Control de constitucionalidad de las leyes (arts. 161.1 y 162.1 CE; art. 32.1 LOTC)\n\n> **Artículo 161.1 a) y b)**\n> 1. El Tribunal Constitucional tiene jurisdicción en todo el territorio español y es competente para conocer:\n> a) **Del recurso de inconstitucionalidad contra leyes y disposiciones normativas con fuerza de ley**. La declaración de inconstitucionalidad de una norma jurídica con rango de ley, interpretada por la jurisprudencia, afectará a ésta, si bien la sentencia o sentencias recaídas no perderán el valor de cosa juzgada.\n> b) **Del recurso de amparo por violación de los derechos y libertades referidos en el artículo 53, 2**, de esta Constitución, en los casos y formas que la ley establezca.\n\n> **Artículo 162.**\n> 1. Están legitimados:\n> a) Para interponer el recurso de inconstitucionalidad, el Presidente del Gobierno, **el Defensor del Pueblo, 50 Diputados, 50 Senadores**, los órganos colegiados ejecutivos de las Comunidades Autónomas y, en su caso, las Asambleas de las mismas.\n> b) Para interponer el recurso de amparo, toda persona natural o jurídica que invoque un interés legítimo, **así como el Defensor del Pueblo y el Ministerio Fiscal**.\n> 2. En los demás casos, la ley orgánica determinará las personas y órganos legitimados.\n\n> **Artículo treinta y dos.1 (LOTC)**\n> Uno. Están legitimados para el ejercicio del recurso de inconstitucionalidad cuando se trate de Estatutos de Autonomía y demás Leyes del Estado, orgánicas o en cualesquiera de sus formas, y disposiciones normativas y actos del Estado o de las Comunidades Autónomas con fuerza de ley, Tratados Internacionales y Reglamentos de las Cámaras y de las Cortes Generales:\n> a) El Presidente del Gobierno.\n> b) **El Defensor del Pueblo.**\n> c) Cincuenta Diputados.\n> d) Cincuenta Senadores.\n\n=> Qué: Recurso de **inconstitucionalidad** (161.1 a) contra la ley que vulnera un derecho; y recurso de **amparo** (161.1 b), que se estudia en → II.5\n=> Quién: \n=> - Inconstitucionalidad (162.1 a): Presidente del Gobierno, **Defensor del Pueblo**, 50 Diputados, 50 Senadores, órganos colegiados ejecutivos de las CC. AA. y, en su caso, sus Asambleas\n=> - Amparo (162.1 b): toda persona natural o jurídica con interés legítimo, **Defensor del Pueblo** y **Ministerio Fiscal**\n=> Cómo: Ante el Tribunal Constitucional\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: \n=> - El **Defensor del Pueblo** es el único que está en **las dos** listas\n=> - El Ministerio Fiscal, solo en la de amparo; los 50 Diputados o Senadores, solo en la de inconstitucionalidad\n\n### 2.4 Rigidez constitucional (arts. 167 a 169)\n\n> **Artículo 168.**\n> 1. Cuando se propusiere la revisión total de la Constitución o una parcial que afecte al Título preliminar, **al Capítulo segundo, Sección primera del Título I**, o al Título II, se procederá a la aprobación del principio por **mayoría de dos tercios de cada Cámara**, y a la **disolución inmediata de las Cortes**.\n> 2. Las Cámaras elegidas deberán ratificar la decisión y proceder al estudio del nuevo texto constitucional, que deberá ser aprobado por mayoría de dos tercios de ambas Cámaras.\n> 3. Aprobada la reforma por las Cortes Generales, será sometida a **referéndum** para su ratificación.\n\n> **Artículo 169.**\n> No podrá iniciarse la reforma constitucional **en tiempo de guerra o de vigencia de alguno de los estados previstos en el artículo 116**.\n\n=> Qué: Protección de los derechos frente a la propia reforma de la Constitución\n=> Quién: \n=> - Reforma **agravada** (168): revisión total o parcial que afecte al Título preliminar, a la **Sección 1.ª** del Capítulo segundo del Título I o al Título II\n=> - Reforma **ordinaria** (167): el resto, incluidos el **art. 14**, la **Sección 2.ª** y el **Capítulo tercero**\n=> Cómo: \n=> - 168: aprobación del principio, **disolución** de las Cortes, ratificación y estudio del nuevo texto por las nuevas Cámaras y **referéndum** obligatorio\n=> - 169: no puede **iniciarse** la reforma en tiempo de guerra ni con un estado del art. 116 en vigor\n=> Plazos y mayorías: 168: **dos tercios** de cada Cámara (para el principio y para el nuevo texto)\n=> ⚠ Ojo en el examen: El art. 14 tiene amparo, pero su reforma es **ordinaria**: el 168 solo nombra la Sección primera.","nivel":2},{"id":"s5-4","title":"II.3 El procedimiento preferente y sumario (LJCA, arts. 114 a 122)","body":"Desarrolla la primera vía del art. 53.2 frente a la **Administración**: es el Capítulo I del Título V de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa (BOE-A-1998-16718), «Procedimiento para la protección de los derechos fundamentales de la persona».\n\n### 3.1 Objeto y carácter preferente (art. 114)\n\n> **Artículo 114. (LJCA)**\n> 1. El procedimiento de amparo judicial de las libertades y derechos, previsto en el **artículo 53.2 de la Constitución española**, se regirá, en el orden contencioso-administrativo, por lo dispuesto en este capítulo y, en lo no previsto en él, por las normas generales de la presente Ley.\n> 2. Podrán hacerse valer en este proceso las pretensiones a que se refieren los artículos 31 y 32, siempre que tengan como finalidad la de restablecer o preservar los derechos o libertades por razón de los cuales el recurso hubiere sido formulado.\n> 3. **A todos los efectos, la tramitación de estos recursos tendrá carácter preferente**.\n\n=> Qué: El «procedimiento de amparo judicial de las libertades y derechos, previsto en el artículo 53.2 de la Constitución española»\n=> Quién: Quien recurra la actuación administrativa que lesiona un derecho susceptible de amparo\n=> Cómo: Solo pretensiones para «restablecer o preservar los derechos o libertades por razón de los cuales el recurso hubiere sido formulado»\n=> Plazos y mayorías: Tramitación **preferente** «a todos los efectos»\n=> ⚠ Ojo en el examen: Es el «amparo **judicial**» (ante los jueces ordinarios); el amparo **constitucional** es el de la LOTC (→ II.5).\n\n### 3.2 Tramitación (arts. 115 a 121)\n\n> **Artículo 115. (LJCA)**\n> 1. El plazo para interponer este recurso **será de diez días**, que se computarán, según los casos, desde el día siguiente al de notificación del acto, publicación de la disposición impugnada, requerimiento para el cese de la vía de hecho, o transcurso del plazo fijado para la resolución, sin más trámites. Cuando la lesión del derecho fundamental tuviera su origen en la inactividad administrativa, o se hubiera interpuesto potestativamente un recurso administrativo, o, tratándose de una actuación en vía de hecho, no se hubiera formulado requerimiento, **el plazo de diez días se iniciará transcurridos veinte días** desde la reclamación, la presentación del recurso o el inicio de la actuación administrativa en vía de hecho, respectivamente.\n> 2. En el escrito de interposición se expresará con precisión y claridad el derecho o derechos cuya tutela se pretende y, de manera concisa, los argumentos sustanciales que den fundamento al recurso.\n\n> **Artículo 116. (LJCA)**\n> 1. En el mismo día de la presentación del recurso o en el siguiente, el letrado o letrada de la Administración de Justicia requerirá con carácter urgente al órgano administrativo correspondiente, acompañando copia del escrito de interposición, para que **en el plazo máximo de cinco días** a contar desde la recepción del requerimiento remita el expediente administrativo en soporte electrónico, acompañado de los informes y datos que estime procedentes, que también se enviarán en soporte electrónico, y con apercibimiento de cuanto se establece en el artículo 48.\n> 2. Al remitir el expediente, el órgano administrativo lo comunicará a todos los que aparezcan como interesados en el mismo, acompañando copia del escrito de interposición y emplazándoles para que puedan comparecer como demandados ante el Juzgado o Sala **en el plazo de cinco días**.\n> 3. La Administración, con el envío del expediente, y los demás demandados, al comparecer, podrán solicitar razonadamente la inadmisión del recurso y la celebración de la comparecencia a que se refiere el artículo 117.2.\n> 4. La falta de envío del expediente administrativo dentro del plazo previsto en el apartado anterior no suspenderá el curso de los autos.\n> 5. Cuando el expediente administrativo se recibiese en el juzgado o Sala una vez transcurrido el plazo establecido en el apartado 1, el letrado o letrada de la Administración de Justicia lo entregará a las partes **por plazo de cuarenta y ocho horas**, en el que podrán hacer alegaciones, y sin alteración del curso del procedimiento.\n\n> **Artículo 117. (LJCA)**\n> 1. Recibido el expediente o transcurrido el plazo para su remisión y, en su caso, el del emplazamiento a los demás interesados, el Secretario judicial, dentro del siguiente día, dictará decreto mandando seguir las actuaciones. Si estima que no procede la admisión, dará cuenta al Tribunal quien, en su caso, comunicará a las partes el motivo en que pudiera fundarse la inadmisión del procedimiento.\n> 2. En el supuesto de posibles motivos de inadmisión del procedimiento, el Secretario judicial convocará a las partes y al Ministerio Fiscal a una comparecencia, que habrá de tener lugar **antes de transcurrir cinco días**, en la que se les oirá sobre la procedencia de dar al recurso la tramitación prevista en este capítulo.\n> 3. En el siguiente día, el órgano jurisdiccional dictará auto mandando proseguir las actuaciones por este trámite o acordando su inadmisión por inadecuación del procedimiento.\n\n> **Artículo 118. (LJCA)**\n> Acordada la prosecución del procedimiento especial de este capítulo, el Secretario judicial pondrá de manifiesto al recurrente el expediente y demás actuaciones para que en el **plazo improrrogable de ocho días** pueda formalizar la demanda y acompañar los documentos.\n\n> **Artículo 119. (LJCA)**\n> Formalizada la demanda, el letrado o letrada de la Administración de Justicia dará traslado de la misma, con entrega del expediente administrativo, al Ministerio Fiscal y a las partes demandadas para que presenten sus alegaciones en el **plazo común e improrrogable de ocho días** y acompañen los documentos que estimen oportunos.\n\n> **Artículo 120. (LJCA)**\n> Evacuado el trámite de alegaciones o transcurrido el plazo para efectuarlas, el órgano jurisdiccional decidirá en el siguiente día sobre el recibimiento a prueba, con arreglo a las normas generales establecidas en la presente Ley, y sin perjuicio de lo dispuesto en el artículo 57. El período probatorio **no será en ningún caso superior a veinte días comunes** para su proposición y práctica.\n\n> **Artículo 121. (LJCA)**\n> 1. Conclusas las actuaciones, el órgano jurisdiccional dictará sentencia **en el plazo de cinco días**.\n> 2. La sentencia estimará el recurso cuando la disposición, la actuación o el acto incurran en cualquier infracción del ordenamiento jurídico, **incluso la desviación de poder**, y como consecuencia de la misma vulneren un derecho de los susceptibles de amparo.\n> 3. Contra las sentencias de los Juzgados de lo Contencioso-administrativo procederá siempre la **apelación en un solo efecto**.\n\n=> Qué: Un proceso contencioso **abreviado**, con plazos muy cortos\n=> Quién: El recurrente; el órgano administrativo; el Ministerio Fiscal; los demandados\n=> Cómo: \n=> - La sentencia estima el recurso si la actuación incurre en cualquier infracción del ordenamiento, **incluso la desviación de poder**, y vulnera un derecho susceptible de amparo (121.2)\n=> - Contra las sentencias de los Juzgados, «siempre la apelación en un solo efecto»\n=> Plazos y mayorías: \n=> - 1 Interposición: **10 días** (115.1); si hubo inactividad, recurso potestativo o vía de hecho sin requerimiento, empiezan **transcurridos 20 días**\n=> - 2 Remisión del expediente: máximo **5 días** (116.1); emplazamiento: **5 días** (116.2); expediente tardío: alegaciones en **48 horas** (116.5)\n=> - 3 Posible inadmisión: comparecencia antes de **5 días** (117.2)\n=> - 4 Demanda: **8 días**, improrrogable (118)\n=> - 5 Alegaciones del Fiscal y demandados: **8 días**, común e improrrogable (119)\n=> - 6 Prueba: no más de **20 días** comunes (120)\n=> - 7 Sentencia: **5 días** (121.1)\n=> ⚠ Ojo en el examen: Diez días para recurrir, no los dos meses del recurso contencioso ordinario. Apelación «en un **solo** efecto».\n\n### 3.3 Especialidad del derecho de reunión (art. 122)\n\n> **Artículo 122. (LJCA)**\n> 1. En el caso de prohibición o de propuesta de modificación de reuniones previstas en la Ley Orgánica Reguladora del Derecho de Reunión que no sean aceptadas por los promotores, éstos podrán interponer recurso contencioso-administrativo ante el Tribunal competente. El recurso se interpondrá **dentro de las cuarenta y ocho horas siguientes** a la notificación de la prohibición o modificación, trasladándose por los promotores copia debidamente registrada del escrito del recurso a la autoridad gubernativa, con el objeto de que ésta remita inmediatamente el expediente.\n> 2. El letrado o letrada de la Administración de Justicia, en el **plazo improrrogable de cuatro días**, y haciendo entrega del expediente si se hubiera recibido, convocará al representante legal de la Administración, al Ministerio Fiscal y a los recurrentes o a la persona que éstos designen como representante a una audiencia en la que el tribunal, de manera contradictoria, oirá a todos los personados y **resolverá sin ulterior recurso**.\n> En cuanto se refiere a la grabación de la audiencia y a su documentación, serán aplicables las disposiciones contenidas en el artículo 63.\n> 3. La decisión que se adopte únicamente podrá mantener o revocar la prohibición o las modificaciones propuestas.\n\n=> Qué: Recurso urgente contra la **prohibición o modificación** de una reunión (art. 21 CE → I.5.2)\n=> Quién: Los promotores que no aceptan la prohibición o la modificación propuesta por la autoridad\n=> Cómo: Audiencia con el representante de la Administración, el Ministerio Fiscal y los promotores; el tribunal solo puede «mantener o revocar la prohibición o las modificaciones propuestas»\n=> Plazos y mayorías: \n=> - Recurso: **48 horas** desde la notificación\n=> - Audiencia y resolución: plazo improrrogable de **4 días**\n=> - **Sin ulterior recurso**\n=> ⚠ Ojo en el examen: 48 horas, **no** 72. La resolución no admite recurso.\n\n**Notas del texto consolidado (BOE):**\n- Los arts. 116, 119 y 122 dicen «letrado o letrada de la Administración de Justicia»; los arts. 117 y 118 conservan «Secretario judicial».\n- Según la **disposición adicional primera de la LO 1/2025, de 2 de enero** (BOE-A-2025-76), las referencias a los Juzgados de lo Contencioso-Administrativo se entienden hechas a las Secciones correspondientes de los **Tribunales de Instancia**.","nivel":2},{"id":"s5-5","title":"II.4 El habeas corpus (art. 17.4 CE y LO 6/1984)","body":"El art. 17.4 CE ordena: «La ley regulará un procedimiento de «habeas corpus» para producir la inmediata puesta a disposición judicial de toda persona detenida ilegalmente». Lo desarrolla la **Ley Orgánica 6/1984, de 24 de mayo**, reguladora del procedimiento de «Habeas Corpus» (BOE-A-1984-11620; última modificación: 14 de noviembre de 2024). Es la garantía judicial **específica de la libertad personal** (art. 17 → I.4.3).\n\n### 4.1 Objeto y supuestos de detención ilegal (art. 1)\n\n> **Artículo primero. (LO 6/1984)**\n> Mediante el procedimiento del «Habeas Corpus», regulado en la presente ley, se podrá obtener la **inmediata puesta a disposición de la Autoridad judicial competente**, de cualquier persona detenida ilegalmente.\n> A los efectos de esta ley se consideran personas ilegalmente detenidas:\n> a) Las que lo fueren por una autoridad, agente de la misma, funcionario público o particular, sin que concurran los supuestos legales, o sin haberse cumplido las formalidades prevenidas y requisitos exigidos por las leyes.\n> b) Las que estén ilícitamente internadas en cualquier establecimiento o lugar.\n> c) Las que lo estuvieran por plazo superior al señalado en las leyes, si transcurrido el mismo, no fuesen puestas en libertad o entregadas al Juez más próximo al lugar de la detención.\n> d) Las privadas de libertad a quienes no les sean respetados los derechos que la Constitución y las leyes procesales garantizan a toda persona detenida.\n\n=> Qué: Procedimiento rápido para que un juez compruebe de inmediato la legalidad de una privación de libertad\n=> Quién: Cualquier persona detenida ilegalmente\n=> Cómo: Cuatro supuestos de detención ilegal:\n=> - a) sin supuesto legal o sin las formalidades y requisitos de las leyes\n=> - b) «Las que estén ilícitamente internadas en cualquier establecimiento o lugar»\n=> - c) retenidas más del plazo legal sin libertad ni entrega «al Juez más próximo al lugar de la detención»\n=> - d) sin respeto de los derechos que la Constitución y las leyes procesales garantizan al detenido\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: También es ilegal la detención **legal en su origen** si se prolonga más de lo debido (c) o no se respetan los derechos del detenido (d).\n\n### 4.2 Competencia (art. 2)\n\n> **Artículo segundo. (LO 6/1984)**\n> Es competente para conocer la solicitud de «Habeas Corpus» **el Juez de Instrucción del lugar en que se encuentre la persona privada de libertad**; si no constare, el del lugar en que se produzca la detención, y, en defecto de los anteriores, el del lugar donde se hayan tenido las últimas noticias sobre el paradero del detenido.\n> Si la detención obedece a la aplicación de la ley orgánica que desarrolla los supuestos previstos en el art. 55.2 de la Constitución, el procedimiento deberá seguirse ante el **Juez Central de Instrucción** correspondiente.\n> En el ámbito de la Jurisdicción Militar será competente para conocer de la solicitud de «Habeas Corpus» el **Juez Togado Militar de Instrucción** constituido en la cabecera de la circunscripción jurisdiccional en la que se efectuó la detención.\n\n=> Qué: Qué juez conoce del *habeas corpus*\n=> Quién: \n=> - Regla: el **Juez de Instrucción del lugar donde se encuentre** la persona privada de libertad\n=> - Si no consta, el del lugar de la detención; en defecto de ambos, el del lugar de las últimas noticias\n=> - Detención por terrorismo (ley orgánica del art. 55.2 CE): el **Juez Central de Instrucción**\n=> - Jurisdicción Militar: el **Juez Togado Militar de Instrucción** de la circunscripción de la detención\n=> Cómo: —\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: \n=> - El juez es el del lugar **donde esté** el detenido, no el de la detención (salvo que aquel no conste)\n=> - *Pendiente de comprobar:* el texto consolidado no incluye nota sobre la LO 1/2025 (Tribunales de Instancia), que sí llevan la LECrim y la LJCA. Confirmar si «Juez Central de Instrucción» debe leerse ya como Sección del Tribunal Central de Instancia\n\n### 4.3 Legitimación e iniciación (arts. 3 a 5)\n\n> **Artículo tercero. (LO 6/1984)**\n> Podrán instar el procedimiento de “Habeas Corpus” que esta ley establece:\n> a) El privado de libertad, su cónyuge o persona unida por análoga relación de afectividad, descendientes, ascendientes, hermanos y, en su caso, respecto a los menores, sus representantes legales, y respecto a las personas con discapacidad con medidas de apoyo judiciales, la persona que preste su apoyo con facultad de representación específica para este acto concreto.\n> b) **El Ministerio Fiscal.**\n> c) **El Defensor del Pueblo.**\n> d) El abogado defensor del privado de libertad.\n> Asimismo, lo podrá iniciar, **de oficio**, el Juez competente a que se refiere el artículo anterior.\n\n> **Artículo cuarto. (LO 6/1984)**\n> El procedimiento se iniciará, salvo cuando se incoe de oficio, por medio de escrito o comparecencia, **no siendo preceptiva la intervención de Abogado ni de Procurador**. En dicho escrito o comparecencia deberán constar:\n> a) El nombre y circunstancias personales del solicitante y de la persona para la que se solicita el amparo judicial regulado en esta ley.\n> b) El lugar en que se halle el privado de libertad, autoridad o persona, bajo cuya custodia se encuentre, si fueren conocidos, y todas aquellas otras circunstancias que pudieran resultar relevantes.\n> c) El motivo concreto por el que se solicita el «Habeas Corpus».\n\n> **Artículo quinto. (LO 6/1984)**\n> La autoridad gubernativa, agente de la misma o funcionario público, estarán obligados a poner inmediatamente en conocimiento del Juez competente la solicitud de «Habeas Corpus», formulada por la persona privada de libertad que se encuentre bajo su custodia.\n> Si incumplieren esta obligación, serán apercibidos por el Juez, sin perjuicio de las responsabilidades penales y disciplinarias en que pudieran incurrir.\n\n=> Qué: Quién puede pedirlo y cómo se pide\n=> Quién: \n=> - El privado de libertad, su cónyuge o persona unida por análoga relación de afectividad, descendientes, ascendientes, hermanos y, en su caso, representantes legales o de apoyo\n=> - El **Ministerio Fiscal**\n=> - El **Defensor del Pueblo**\n=> - El **abogado defensor**\n=> - **De oficio**, el juez competente\n=> Cómo: \n=> - Por **escrito o comparecencia**, sin Abogado ni Procurador (art. 4)\n=> - Quien custodia al detenido pone la solicitud «inmediatamente en conocimiento del Juez competente» (art. 5)\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: No es preceptiva la intervención de **Abogado ni Procurador**. Lo puede iniciar el juez **de oficio**.\n\n### 4.4 Tramitación y resolución (arts. 6 a 9)\n\n> **Artículo sexto. (LO 6/1984)**\n> Promovida la solicitud de «Habeas Corpus» el Juez examinará la concurrencia de los requisitos para su tramitación y dará traslado de la misma al Ministerio Fiscal. Seguidamente, mediante auto, acordará la incoación del procedimiento, o, en su caso, denegará la solicitud por ser ésta improcedente. Dicho auto se notificará, en todo caso, al Ministerio Fiscal. Contra la resolución que en uno u otro caso se adopte, **no cabrá recurso alguno**.\n\n> **Artículo séptimo. (LO 6/1984)**\n> En el auto de incoación, el Juez ordenará a la autoridad a cuya disposición se halle la persona privada de libertad o a aquél en cuyo poder se encuentre, que la ponga de manifiesto ante él, sin pretexto ni demora alguna o se constituirá en el lugar donde aquélla se encuentre.\n> Antes de dictar resolución, oirá el Juez a la persona privada de libertad o, en su caso, a su representante legal y Abogado, si lo hubiera designado, así como al Ministerio Fiscal; acto seguido oirá en justificación de su proceder a la autoridad, agentes, funcionario público o representante de la institución o persona que hubiere ordenado o practicado la detención o internamiento y, en todo caso, a aquélla bajo cuya custodia se encontrase la persona privada de libertad; a todos ellos dará a conocer el Juez las declaraciones del privado de libertad.\n> El Juez admitirá, si las estima pertinentes, las pruebas que aporten las personas a que se refiere el párrafo anterior y las que propongan que puedan practicarse en el acto.\n> **En el plazo de veinticuatro horas**, contadas desde que sea dictado el auto de incoación, los Jueces practicarán todas las actuaciones a que se refiere este artículo y dictarán la resolución que proceda.\n\n> **Artículo octavo. (LO 6/1984)**\n> Practicadas las actuaciones a que se refiere el artículo anterior, el Juez, **mediante auto motivado**, adoptará seguidamente alguna de estas resoluciones:\n> 1. Si estima que no se da ninguna de las circunstancias a que se refiere el artículo primero de esta ley, acordará el archivo de las actuaciones, declarando ser conforme a Derecho la privación de libertad y las circunstancias en que se está realizando.\n> 2. Si estima que concurren alguna de las circunstancias del artículo primero de esta ley, se acordará en el acto alguna de las siguientes medidas:\n> a) La puesta en libertad del privado de ésta, si lo fue ilegalmente.\n> b) Que continúe la situación de privación de libertad de acuerdo con las disposiciones legales aplicables al caso, pero, si lo considerase necesario, en establecimiento distinto, o bajo la custodia de personas distintas a las que hasta entonces la detentaban.\n> c) Que la persona privada de libertad sea puesta inmediatamente a disposición judicial, si ya hubiese transcurrido el plazo legalmente establecido para su detención.\n\n> **Artículo noveno. (LO 6/1984)**\n> El Juez deducirá testimonio de los particulares pertinentes para la persecución y castigo de los delitos que hayan podido cometerse por quienes hubieran ordenado la detención, o tenido bajo su custodia a la persona privada de libertad.\n> En los casos de delito de denuncia falsa o simulación de delito se deducirá asimismo, testimonio de los particulares pertinentes, al efecto de determinar las responsabilidades penales correspondientes.\n> En todo caso, si se apreciase **temeridad o mala fe**, será condenado el solicitante al pago de las costas del procedimiento, en caso contrario, éstas se declararán de oficio.\n\n> **Disposición final. (LO 6/1984)**\n> La presente ley entrará en vigor al día siguiente de su publicación en el «Boletín Oficial del Estado».\n\n=> Qué: Las fases: admisión, actuaciones, resolución y responsabilidades\n=> Quién: El Juez; el Ministerio Fiscal; la autoridad que detuvo; el detenido y su abogado\n=> Cómo: \n=> - Admisión (6): previo traslado al Fiscal, auto de incoación o de denegación, **sin recurso**\n=> - Actuaciones (7): el juez hace presentar al detenido o va donde esté; oye al detenido, a su abogado, al Fiscal y a la autoridad; admite pruebas\n=> - Resolución (8), por **auto motivado**: **archivo** si la detención es legal; si no, **libertad**, otro establecimiento o custodia, o **puesta inmediata a disposición judicial**\n=> - Responsabilidades (9): testimonio para perseguir delitos; costas al solicitante si hubo **temeridad o mala fe**\n=> Plazos y mayorías: Todo en **24 horas** desde el auto de incoación (7)\n=> ⚠ Ojo en el examen: **24 horas**, no 72. Contra el auto de incoación o denegación **no cabe recurso**.","nivel":2},{"id":"s5-6","title":"II.5 El recurso de amparo constitucional (LOTC, arts. 41 a 58)","body":"Segunda vía del art. 53.2: el **Título III** de la Ley Orgánica 2/1979, de 3 de octubre, del Tribunal Constitucional (BOE-A-1979-23709; última modificación: 2 de agosto de 2024), «Del recurso de amparo constitucional». Es **subsidiario**: frente a actos del Gobierno o de los jueces, antes hay que agotar la vía judicial.\n\n### 5.1 Objeto (art. 41)\n\n> **Artículo cuarenta y uno. (LOTC)**\n> Uno. Los derechos y libertades reconocidos en los **artículos catorce a veintinueve** de la Constitución serán susceptibles de amparo constitucional, en los casos y formas que esta Ley establece, sin perjuicio de su tutela general encomendada a los Tribunales de Justicia. Igual protección será aplicable a la **objeción de conciencia reconocida en el artículo treinta** de la Constitución.\n> Dos. El recurso de amparo constitucional protege, en los términos que esta ley establece, frente a las violaciones de los derechos y libertades a que se refiere el apartado anterior, originadas por las disposiciones, actos jurídicos, omisiones o simple vía de hecho de los poderes públicos del Estado, las Comunidades Autónomas y demás entes públicos de carácter territorial, corporativo o institucional, así como de sus funcionarios o agentes.\n> Tres. En el amparo constitucional no pueden hacerse valer otras pretensiones que las dirigidas a restablecer o preservar los derechos o libertades por razón de los cuales se formuló el recurso.\n\n=> Qué: Recurso ante el TC por lesión de derechos fundamentales\n=> Quién: Protege los «artículos catorce a veintinueve de la Constitución» y la objeción de conciencia del art. 30, frente a los **poderes públicos** (Estado, CC. AA., demás entes públicos, funcionarios y agentes)\n=> Cómo: Contra «disposiciones, actos jurídicos, omisiones o simple vía de hecho»; solo pretensiones para restablecer o preservar el derecho\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Arts. **14 a 29** + **30** (objeción). No llega a los arts. 31 a 38.\n\n### 5.2 Las tres vías según el origen de la lesión y la legitimación (arts. 42 a 46)\n\n> **Artículo cuarenta y dos. (LOTC)**\n> Las decisiones o actos sin valor de Ley, emanados de las Cortes o de cualquiera de sus órganos, o de las Asambleas legislativas de las Comunidades Autónomas, o de sus órganos, que violen los derechos y libertades susceptibles de amparo constitucional, podrán ser recurridos **dentro del plazo de tres meses** desde que, con arreglo a las normas internas de las Cámaras o Asambleas, sean firmes.\n\n> **Artículo cuarenta y tres. (LOTC)**\n> Uno. Las violaciones de los derechos y libertades antes referidos originadas por disposiciones, actos jurídicos, omisiones o simple vía de hecho del Gobierno o de sus autoridades o funcionarios, o de los órganos ejecutivos colegiados de las comunidades autónomas o de sus autoridades o funcionarios o agentes, podrán dar lugar al recurso de amparo **una vez que se haya agotado la vía judicial procedente**.\n> Dos. El plazo para interponer el recurso de amparo constitucional será el de los **veinte días siguientes a la notificación** de la resolución recaída en el previo proceso judicial.\n> Tres. El recurso sólo podrá fundarse en la infracción por una resolución firme de los preceptos constitucionales que reconocen los derechos o libertades susceptibles de amparo.\n\n> **Artículo cuarenta y cuatro. (LOTC)**\n> 1. Las violaciones de los derechos y libertades susceptibles de amparo constitucional, que tuvieran su origen inmediato y directo en un acto u omisión de un órgano judicial, podrán dar lugar a este recurso siempre que se cumplan los requisitos siguientes:\n> a) Que se hayan agotado todos los medios de impugnación previstos por las normas procesales para el caso concreto dentro de la vía judicial.\n> b) Que la violación del derecho o libertad sea imputable de modo inmediato y directo a una acción u omisión del órgano judicial con independencia de los hechos que dieron lugar al proceso en que aquellas se produjeron, acerca de los que, en ningún caso, entrará a conocer el Tribunal Constitucional.\n> c) Que se haya denunciado formalmente en el proceso, si hubo oportunidad, la vulneración del derecho constitucional tan pronto como, una vez conocida, hubiera lugar para ello.\n> 2. El plazo para interponer el recurso de amparo **será de 30 días**, a partir de la notificación de la resolución recaída en el proceso judicial.\n\n> **Artículo cuarenta y cinco. (LOTC)**\n> (Derogado)\n\n> **Artículo cuarenta y seis. (LOTC)**\n> Uno. Están legitimados para interponer el recurso de amparo constitucional:\n> a) En los casos de los artículos cuarenta y dos y cuarenta y cinco, **la persona directamente afectada, el Defensor del Pueblo y el Ministerio Fiscal**.\n> b) En los casos de los artículos cuarenta y tres y cuarenta y cuatro, **quienes hayan sido parte en el proceso judicial correspondiente**, el Defensor del Pueblo y el Ministerio Fiscal.\n> Dos. Si el recurso se promueve por el Defensor del Pueblo o el Ministerio Fiscal, la Sala competente para conocer del amparo constitucional lo comunicara a los posibles agraviados que fueran conocidos y ordenará anunciar la interposición del recurso en el «Boletín Oficial del Estado» a efectos de comparecencia de otros posibles interesados. Dicha publicación tendrá carácter preferente.\n\n=> Qué: Tres amparos distintos según **quién** causó la lesión\n=> Quién: \n=> - Art. 42 (**Parlamentos**): legitimados la persona **directamente afectada**, el Defensor del Pueblo y el Ministerio Fiscal\n=> - Arts. 43 y 44 (**Gobierno** y **jueces**): quienes fueron **parte en el proceso judicial**, el Defensor del Pueblo y el Ministerio Fiscal\n=> Cómo: \n=> - 42: decisiones o actos **sin valor de ley** de las Cortes o de las Asambleas autonómicas, que sean **firmes**\n=> - 43: actos del **Gobierno**, sus autoridades o funcionarios, o de órganos ejecutivos autonómicos: antes, **agotar la vía judicial**\n=> - 44: acto u omisión **inmediato y directo de un órgano judicial**: agotar los recursos, imputación directa al juez y «Que se haya denunciado formalmente en el proceso, si hubo oportunidad»\n=> - Si recurren el Defensor o el Fiscal, la Sala lo comunica a los posibles agraviados y lo anuncia en el BOE (46.2)\n=> Plazos y mayorías: \n=> - Parlamentos: **3 meses** desde que el acto es firme\n=> - Gobierno: **20 días** desde la notificación de la resolución judicial\n=> - Jueces: **30 días** desde la notificación de la resolución judicial\n=> ⚠ Ojo en el examen: \n=> - No intercambiar **20** (Gobierno) y **30** (jueces)\n=> - *Así en el BOE:* el art. 45 figura «(Derogado)», aunque el 46.1 a) sigue citándolo; el art. 46.2 dice «lo comunicara», sin tilde\n\n### 5.3 Tramitación (arts. 47 a 52)\n\n> **Artículo cuarenta y siete. (LOTC)**\n> Uno. Podrán comparecer en el proceso de amparo constitucional, con el carácter de demandado o con el de coadyuvante, las personas favorecidas por la decisión, acto o hecho en razón del cual se formule el recurso o que ostenten un interés legítimo en el mismo.\n> Dos. El Ministerio Fiscal **intervendrá en todos los procesos de amparo**, en defensa de la legalidad, de los derechos de los ciudadanos y del interés público tutelado por la Ley.\n\n> **Artículo cuarenta y ocho. (LOTC)**\n> El conocimiento de los recursos de amparo constitucional corresponde a las Salas del Tribunal Constitucional y, en su caso, a las Secciones.\n\n> **Artículo cuarenta y nueve. (LOTC)**\n> Uno. El recurso de amparo constitucional se iniciará mediante demanda en la que se expondrán con claridad y concisión los hechos que la fundamenten, se citarán los preceptos constitucionales que se estimen infringidos y se fijará con precisión el amparo que se solicita para preservar o restablecer el derecho o libertad que se considere vulnerado. En todo caso, la demanda justificará la **especial trascendencia constitucional del recurso**.\n> Dos. Con la demanda se acompañarán:\n> a) El documento que acredite la representación del solicitante del amparo.\n> b) En su caso, la copia, traslado o certificación de la resolución recaída en el procedimiento judicial o administrativo.\n> Tres. A la demanda se acompañarán también tantas copias literales de la misma y de los documentos presentados como partes en el previo proceso, si lo hubiere, y una más para el Ministerio Fiscal.\n> Cuatro. De incumplirse cualquiera de los requisitos establecidos en los apartados que anteceden, las Secretarías de Justicia lo pondrán de manifiesto al interesado **en el plazo de 10 días**, con el apercibimiento de que, de no subsanarse el defecto, se acordará la inadmisión del recurso.\n\n> **Artículo cincuenta. (LOTC)**\n> 1. El recurso de amparo debe ser objeto de una decisión de admisión a trámite. La Sección, **por unanimidad de sus miembros**, acordará mediante providencia la admisión, en todo o en parte, del recurso solamente cuando concurran todos los siguientes requisitos:\n> a) Que la demanda cumpla con lo dispuesto en los artículos 41 a 46 y 49.\n> b) Que el contenido del recurso justifique una decisión sobre el fondo por parte del Tribunal Constitucional en razón de su especial trascendencia constitucional, que se apreciará atendiendo a su importancia para la interpretación de la Constitución, para su aplicación o para su general eficacia, y para la determinación del contenido y alcance de los derechos fundamentales.\n> 2. Cuando la admisión a trámite, aun habiendo obtenido la mayoría, no alcance la unanimidad, la Sección trasladará la decisión a la Sala respectiva para su resolución.\n> 3. Las providencias de inadmisión, adoptadas por las Secciones o las Salas, especificarán el requisito incumplido y se notificarán al demandante y al Ministerio Fiscal. Dichas providencias solamente podrán ser **recurridas en súplica por el Ministerio Fiscal en el plazo de tres días**. Este recurso se resolverá mediante auto, que no será susceptible de impugnación alguna.\n> 4. Cuando en la demanda de amparo concurran uno o varios defectos de naturaleza subsanable, se procederá en la forma prevista en el artículo 49.4; de no producirse la subsanación dentro del plazo fijado en dicho precepto, la Sección acordará la inadmisión mediante providencia, contra la cual no cabrá recurso alguno\n\n> **Artículo cincuenta y uno. (LOTC)**\n> Uno. Admitida la demanda de amparo, la Sala requerirá con carácter urgente al órgano o a la autoridad de que dimane la decisión, el acto o el hecho, o al Juez o Tribunal que conoció del procedimiento precedente para que, en plazo que **no podrá exceder de diez días**, remita las actuaciones o testimonio de ellas.\n> Dos. El órgano, autoridad, Juez o Tribunal acusará inmediato recibo del requerimiento, cumplimentará el envío dentro del plazo señalado y emplazará a quienes fueron parte en el procedimiento antecedente para que puedan comparecer en el proceso constitucional en el plazo de diez días.\n\n> **Artículo cincuenta y dos. (LOTC)**\n> Uno. Recibidas las actuaciones y transcurrido el tiempo de emplazamiento, la Sala dará vista de las mismas a quien promovió el amparo, a los personados en el proceso, al Abogado del Estado, si estuviera interesada la Administración Pública, y al Ministerio Fiscal. La vista será por plazo común que **no podrá exceder de veinte días**, y durante él podrán presentarse las alegaciones procedentes.\n> Dos. Presentadas las alegaciones o transcurrido el plazo otorgado para efectuarlas, la Sala podrá deferir la resolución del recurso, cuando para su resolución sea aplicable doctrina consolidada del Tribunal Constitucional, a una de sus Secciones o señalar día para la vista, en su caso, o deliberación y votación.\n> Tres. La Sala, o en su caso la Sección, pronunciará la sentencia que proceda **en el plazo de 10 días** a partir del día señalado para la vista o deliberación.\n\n=> Qué: De la demanda a la sentencia\n=> Quién: \n=> - Conocen las **Salas** y, en su caso, las **Secciones** (48)\n=> - El **Ministerio Fiscal** interviene **en todos** los procesos de amparo (47.2)\n=> Cómo: \n=> - Demanda (49): hechos, preceptos infringidos y amparo pedido; **siempre** justificar la **especial trascendencia constitucional**\n=> - Admisión (50): la **Sección**, por **unanimidad**, mediante **providencia**; si hay mayoría sin unanimidad, decide la **Sala**\n=> - Especial trascendencia: importancia para la interpretación, aplicación o eficacia de la Constitución y para el contenido de los derechos\n=> - Sentencia (52): la Sala puede deferirla a una Sección si hay doctrina consolidada\n=> Plazos y mayorías: \n=> - Subsanar defectos de la demanda: **10 días** (49.4)\n=> - Súplica contra la inadmisión: **solo el Fiscal**, en **3 días** (50.3)\n=> - Remisión de actuaciones: no más de **10 días**; comparecencia: **10 días** (51)\n=> - Alegaciones: no más de **20 días**; sentencia: **10 días** (52)\n=> ⚠ Ojo en el examen: Admisión: **Sección**, **unanimidad**, **providencia** (no auto ni mayoría). Súplica: **solo el Ministerio Fiscal**.\n\n### 5.4 La sentencia (arts. 53 a 55)\n\n> **Artículo cincuenta y tres. (LOTC)**\n> La Sala o, en su caso, la Sección, al conocer del fondo del asunto, pronunciará en su sentencia alguno de estos fallos:\n> a) Otorgamiento de amparo.\n> b) Denegación de amparo.\n\n> **Artículo cincuenta y cuatro. (LOTC)**\n> Cuando la Sala o, en su caso, la Sección conozca del recurso de amparo respecto de decision
