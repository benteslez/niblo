<script type="application/json" id="datos-embebidos">{"_format": "gestion_hub_config", "_version": 2, "_exportedAt": "2026-10-02T18:15:58.000Z", "ajustes": null, "temas": {"B1T02": {"id": "B1T02", "group": "B1", "number": 2, "codigo": "I.2", "title": "Derechos fundamentales; garantía y suspensión; Defensor del Pueblo", "subtitle": "Título I de la Constitución (arts. 10-55), LO 4/1981 de los estados de alarma, excepción y sitio y LO 3/1981 del Defensor del Pueblo", "etiquetas": ["Título I CE", "Art. 53: garantías", "Art. 55: suspensión", "Art. 116", "LO 4/1981", "LO 3/1981", "Defensor del Pueblo", "Amparo"], "sections": [{"id": "s1", "title": "1. Contextualización: el Título I de la Constitución", "body": "El **Título I** («De los derechos y deberes fundamentales», **arts. 10 a 55**) es la parte dogmática de la Constitución: reconoce los derechos y deberes y, en el mismo Título, establece sus **garantías** (Cap. IV) y los supuestos de **suspensión** (Cap. V). La Constitución se aprobó el 27-12-1978 y se publicó en el BOE el 29-12-1978 (BOE-A-1978-31229).\n\n**Art. 10 — pórtico del Título I**\n- **10.1:** «La dignidad de la persona, los derechos inviolables que le son inherentes, el libre desarrollo de la personalidad, el respeto a la ley y a los derechos de los demás son **fundamento del orden político y de la paz social**.»\n- **10.2 (canon de interpretación):** las normas relativas a los derechos fundamentales y a las libertades se interpretarán de conformidad con la **Declaración Universal de Derechos Humanos** y los **tratados y acuerdos internacionales** sobre las mismas materias **ratificados por España**.\n\n**Estructura del Título I**\n| Parte | Arts. | Contenido |\n|---|---|---|\n| Art. 10 | 10 | Fundamento del orden político; interpretación conforme a la DUDH |\n| Capítulo I | 11-13 | De los españoles y los extranjeros |\n| Capítulo II | 14-38 | Derechos y libertades: art. 14 + Sección 1.ª (15-29) + Sección 2.ª (30-38) |\n| Capítulo III | 39-52 | Principios rectores de la política social y económica |\n| Capítulo IV | 53-54 | Garantías de las libertades y derechos fundamentales (incluye el Defensor del Pueblo) |\n| Capítulo V | 55 | Suspensión de los derechos y libertades |\n\n**Idea clave:** el lugar que ocupa un derecho dentro del Título I decide su nivel de protección (art. 53). Por eso hay que saber con exactitud en qué capítulo y sección está cada derecho.", "nivel": 1}, {"id": "s2", "title": "2. Españoles y extranjeros (Capítulo I, arts. 11-13)", "body": "**Nacionalidad (art. 11)**\n- Se adquiere, se conserva y se pierde de acuerdo con lo establecido por la **ley** (11.1).\n- **Ningún español de origen podrá ser privado de su nacionalidad** (11.2).\n- **Doble nacionalidad (11.3):** el Estado podrá concertar tratados de doble nacionalidad con los **países iberoamericanos** o con aquellos que hayan tenido o tengan una particular vinculación con España. En esos países, aun cuando no reconozcan a sus ciudadanos un derecho recíproco, podrán naturalizarse los españoles **sin perder su nacionalidad de origen**.\n\n**Mayoría de edad (art. 12):** los españoles son mayores de edad a los **dieciocho años**. (La disposición adicional 2.ª salva las situaciones amparadas por los derechos forales en el ámbito del Derecho privado.)\n\n**Extranjeros (art. 13)**\n- **13.1:** gozarán en España de las **libertades públicas** que garantiza el Título I **en los términos que establezcan los tratados y la ley**.\n- **13.2:** solamente los españoles serán titulares de los derechos del **art. 23** (participación y acceso a cargos públicos), salvo lo que, atendiendo a criterios de **reciprocidad**, pueda establecerse por tratado o ley para el derecho de **sufragio activo y pasivo en las elecciones municipales**. Las palabras «y pasivo» se añadieron con la **reforma de 1992**, la primera de la Constitución, vinculada al Tratado de Maastricht.\n- **13.3 Extradición:** solo en cumplimiento de un **tratado o de la ley**, atendiendo al principio de **reciprocidad**. Quedan excluidos los **delitos políticos**, *no considerándose como tales los actos de terrorismo*.\n- **13.4 Asilo:** la ley establecerá los términos en que los ciudadanos de otros países y los **apátridas** podrán gozar del derecho de asilo en España.", "nivel": 1}, {"id": "s3", "title": "3. Derechos fundamentales y libertades públicas (art. 14 y Sección 1.ª, arts. 15-29)", "body": "El **Capítulo II** («Derechos y libertades») se abre con el **art. 14**, que **no forma parte de la Sección 1.ª** pero comparte su protección reforzada del art. 53.2 (procedimiento preferente y sumario y recurso de amparo). La **Sección 1.ª** («De los derechos fundamentales y de las libertades públicas») comprende los **arts. 15 a 29**.\n\nEstos son los derechos con el máximo nivel de protección: su desarrollo se hace por **ley orgánica** (art. 81), se tutelan por un procedimiento **preferente y sumario** y en **amparo** (art. 53.2), y su reforma exige el procedimiento **agravado** del art. 168. El art. 14 queda fuera de la reforma agravada, porque no está en la Sección 1.ª.", "nivel": 1}, {"id": "s3-1", "title": "3.1 Igualdad (art. 14) y esfera personal (arts. 15-18)", "body": "**Art. 14 — Igualdad:** los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de **nacimiento, raza, sexo, religión, opinión** o cualquier otra condición o circunstancia personal o social.\n\n**Art. 15 — Vida e integridad:** todos tienen derecho a la vida y a la integridad física y moral; nunca tortura ni penas o tratos inhumanos o degradantes. **Queda abolida la pena de muerte**, salvo lo que puedan disponer las leyes penales militares para tiempos de guerra.\n\n**Art. 16 — Libertad ideológica, religiosa y de culto**, de individuos y comunidades, sin más limitación que la necesaria para el mantenimiento del **orden público protegido por la ley**. Nadie podrá ser obligado a declarar sobre su ideología, religión o creencias. **Ninguna confesión tendrá carácter estatal**: los poderes públicos mantendrán relaciones de **cooperación** con la Iglesia Católica y las demás confesiones (aconfesionalidad).\n\n**Art. 17 — Libertad y seguridad** (el artículo con más datos de examen)\n- Nadie puede ser privado de libertad sino en los casos y en la forma previstos en la ley (17.1).\n- **Detención preventiva (17.2):** el tiempo estrictamente necesario y, **en todo caso, en el plazo máximo de 72 horas**, el detenido será puesto en libertad o a disposición judicial.\n- **Derechos del detenido (17.3):** ser informado **de forma inmediata** y comprensible de sus derechos y de las razones de la detención; no ser obligado a declarar; **asistencia de abogado** en las diligencias policiales y judiciales.\n- **17.4:** la ley regulará un procedimiento de **«habeas corpus»** para la inmediata puesta a disposición judicial de toda persona detenida ilegalmente, y fijará el plazo máximo de la **prisión provisional**.\n\n**Art. 18 — Intimidad y domicilio**\n- **18.1:** derecho al **honor**, a la **intimidad** personal y familiar y a la **propia imagen**.\n- **18.2 Inviolabilidad del domicilio:** ninguna entrada o registro sin **consentimiento del titular** o **resolución judicial**, salvo **flagrante delito**.\n- **18.3 Secreto de las comunicaciones**, en especial postales, telegráficas y telefónicas, **salvo resolución judicial**.\n- **18.4:** la ley limitará el uso de la **informática** para garantizar el honor y la intimidad (base constitucional de la protección de datos).", "nivel": 2}, {"id": "s3-2", "title": "3.2 Libertades de circulación, expresión, reunión, asociación y participación (arts. 19-23)", "body": "**Art. 19 — Residencia y circulación:** los **españoles** eligen libremente su residencia, circulan por el territorio nacional y entran y salen de España en los términos que la ley establezca; este derecho **no podrá ser limitado por motivos políticos o ideológicos**.\n\n**Art. 20 — Libertades de expresión e información**\n- Se reconocen: **a)** expresar y difundir pensamientos, ideas y opiniones; **b)** producción y creación literaria, artística, científica y técnica; **c)** libertad de cátedra; **d)** comunicar o recibir libremente **información veraz** (la ley regulará la **cláusula de conciencia** y el **secreto profesional**).\n- **Sin censura previa** de ningún tipo (20.2).\n- 20.3: control parlamentario de los medios públicos y acceso de los grupos sociales y políticos significativos (pluralismo).\n- **Límites (20.4):** los demás derechos del Título, y especialmente el **honor, la intimidad, la propia imagen y la protección de la juventud y de la infancia**.\n- **Secuestro de publicaciones (20.5): solo por resolución judicial.**\n\n**Art. 21 — Reunión:** pacífica y sin armas; **no necesita autorización previa**. Para reuniones en lugares de tránsito público y manifestaciones, **comunicación previa** a la autoridad, que solo podrá prohibirlas por **razones fundadas de alteración del orden público, con peligro para personas o bienes**.\n\n**Art. 22 — Asociación**\n- Son ilegales las que persigan fines o utilicen medios tipificados como delito.\n- Inscripción en un registro **a los solos efectos de publicidad**.\n- Solo podrán ser **disueltas o suspendidas** en sus actividades en virtud de **resolución judicial motivada**.\n- **Prohibidas: las secretas y las de carácter paramilitar.**\n\n**Art. 23 — Participación:** en los asuntos públicos, directamente o por representantes elegidos en elecciones periódicas por sufragio universal (23.1); y **acceso en condiciones de igualdad a funciones y cargos públicos** con los requisitos que señalen las leyes (23.2). Es la base constitucional del acceso al empleo público, junto con el art. 103.3 (mérito y capacidad).", "nivel": 2}, {"id": "s3-3", "title": "3.3 Tutela judicial y garantías penales (arts. 24-26)", "body": "**Art. 24 — Tutela judicial efectiva**\n- **24.1:** todas las personas tienen derecho a obtener la tutela efectiva de jueces y tribunales en el ejercicio de sus derechos e intereses legítimos, **sin que en ningún caso pueda producirse indefensión**.\n- **24.2 (garantías procesales):** juez ordinario predeterminado por la ley; defensa y asistencia de letrado; ser informado de la acusación; proceso público **sin dilaciones indebidas** y con todas las garantías; utilizar los medios de prueba pertinentes; no declarar contra sí mismo; no confesarse culpable; **presunción de inocencia**. La ley regulará cuándo, por **parentesco** o **secreto profesional**, no se estará obligado a declarar.\n\n**Art. 25 — Legalidad penal y sancionadora**\n- **25.1:** nadie puede ser condenado o sancionado por acciones u omisiones que en el momento de producirse no constituyan delito, falta o **infracción administrativa** según la legislación vigente (también alcanza a la potestad sancionadora de la Administración).\n- **25.2:** las penas privativas de libertad y las medidas de seguridad se orientan a la **reeducación y reinserción social**; no podrán consistir en **trabajos forzados**. El condenado conserva los derechos fundamentales de este Capítulo, salvo los limitados por el fallo, el sentido de la pena y la ley penitenciaria; tiene derecho a **trabajo remunerado**, a la Seguridad Social y al acceso a la cultura.\n- **25.3:** la **Administración civil no podrá imponer sanciones que, directa o subsidiariamente, impliquen privación de libertad.**\n\n**Art. 26:** se prohíben los **Tribunales de Honor** en el ámbito de la Administración civil y de las organizaciones profesionales.", "nivel": 2}, {"id": "s3-4", "title": "3.4 Educación, sindicación, huelga y petición (arts. 27-29)", "body": "**Art. 27 — Educación y libertad de enseñanza**\n- Todos tienen derecho a la educación; se reconoce la libertad de enseñanza (27.1).\n- Objeto: el pleno desarrollo de la personalidad en el respeto a los principios democráticos y a los derechos fundamentales (27.2).\n- Derecho de los padres a que sus hijos reciban la formación religiosa y moral acorde con sus convicciones (27.3).\n- **La enseñanza básica es obligatoria y gratuita** (27.4).\n- Libertad de **creación de centros docentes** (27.6); participación de profesores, padres y alumnos en el control y gestión de los centros sostenidos con fondos públicos (27.7).\n- **Autonomía de las Universidades** en los términos que la ley establezca (27.10).\n\n**Art. 28 — Libertad sindical y huelga**\n- **28.1:** todos tienen derecho a sindicarse libremente. La ley podrá **limitar o exceptuar** este derecho a las **Fuerzas o Institutos armados** y demás cuerpos sometidos a disciplina militar, y regulará las peculiaridades de los **funcionarios públicos**. Comprende fundar sindicatos y afiliarse al de su elección; **nadie podrá ser obligado a afiliarse**.\n- **28.2:** derecho de **huelga de los trabajadores** para la defensa de sus intereses; la ley garantizará el mantenimiento de los **servicios esenciales de la comunidad**.\n\n**Art. 29 — Petición:** individual y colectiva, **por escrito**. Los miembros de las Fuerzas o Institutos armados o cuerpos sometidos a disciplina militar solo podrán ejercerlo **individualmente** y con arreglo a su legislación específica.", "nivel": 2}, {"id": "s4", "title": "4. Derechos y deberes de los ciudadanos (Sección 2.ª) y principios rectores (Capítulo III)", "body": "**Sección 2.ª — arts. 30 a 38** (vinculan a los poderes públicos y tienen reserva de ley, pero **no** tienen amparo ni procedimiento preferente, salvo la objeción de conciencia)\n| Art. | Contenido |\n|---|---|\n| 30 | Derecho y deber de defender a España; **objeción de conciencia** (30.2, con amparo por el art. 53.2); servicio civil; deberes en caso de grave riesgo, catástrofe o calamidad (30.4) |\n| 31 | Sistema tributario justo (igualdad y progresividad, **nunca confiscatorio**); gasto público eficiente; prestaciones personales o patrimoniales solo con arreglo a la ley |\n| 32 | Matrimonio con plena igualdad jurídica |\n| 33 | **Propiedad privada y herencia**; función social; expropiación solo por utilidad pública o interés social, con indemnización |\n| 34 | Derecho de fundación para fines de interés general |\n| 35 | Deber de trabajar y derecho al trabajo; sin discriminación por sexo; Estatuto de los Trabajadores |\n| 36 | Colegios profesionales (estructura democrática) |\n| 37 | Negociación colectiva (fuerza vinculante de los convenios); **medidas de conflicto colectivo** (37.2) |\n| 38 | **Libertad de empresa** en el marco de la economía de mercado |\n\n**Capítulo III — Principios rectores (arts. 39-52):** no son derechos subjetivos directamente exigibles. Destacan la protección de la familia y de los hijos (39), la política orientada al **pleno empleo** (40), la **Seguridad Social** pública (41), la **protección de la salud** (43), la cultura (44), el **medio ambiente** (45), el patrimonio histórico (46), la **vivienda digna** (47), la juventud (48), las **personas con discapacidad (49)**, las pensiones de la tercera edad (50) y los **consumidores y usuarios** (51).\n\n**Art. 49 (reforma de 2024):** con la redacción vigente, las personas con discapacidad «ejercen los derechos previstos en este Título en condiciones de libertad e igualdad reales y efectivas». Los poderes públicos impulsarán su plena autonomía personal e inclusión social en entornos universalmente accesibles, y se atenderán particularmente las necesidades de las **mujeres y los menores con discapacidad**. Sustituyó la antigua redacción, que hablaba de «disminuidos».\n\n**Valor de los principios rectores (art. 53.3):** informan la legislación positiva, la práctica judicial y la actuación de los poderes públicos, pero **solo pueden alegarse ante la jurisdicción ordinaria de acuerdo con lo que dispongan las leyes que los desarrollen**.", "nivel": 1}, {"id": "s5", "title": "5. Garantías de los derechos (art. 53 y concordantes)", "body": "El **Capítulo IV** («De las garantías de las libertades y derechos fundamentales») contiene el **art. 53** (garantías normativas y jurisdiccionales) y el **art. 54** (Defensor del Pueblo, garantía institucional). A ellos se suman otros preceptos fuera del Título I: arts. **81** (ley orgánica), **86** (límites del decreto-ley), **161-162** (Tribunal Constitucional) y **168** (reforma agravada).", "nivel": 1}, {"id": "s5-1", "title": "5.1 Garantías normativas", "body": "**Art. 53.1:** los derechos y libertades del **Capítulo II** (arts. 14-38):\n- **vinculan a todos los poderes públicos**;\n- solo **por ley**, que en todo caso deberá **respetar su contenido esencial**, podrá regularse su ejercicio (**reserva de ley** y **garantía del contenido esencial**);\n- se tutelarán de acuerdo con el **art. 161.1.a)**, es decir, por el **recurso de inconstitucionalidad** contra las leyes que los vulneren.\n\n**Art. 81.1 — Ley orgánica:** son leyes orgánicas las relativas al **desarrollo de los derechos fundamentales y de las libertades públicas** (expresión que coincide con la rúbrica de la Sección 1.ª), las que aprueban los Estatutos de Autonomía y el régimen electoral general, y las demás previstas en la Constitución. **Art. 81.2:** su aprobación, modificación o derogación exige **mayoría absoluta del Congreso en una votación final sobre el conjunto del proyecto**.\n\n**Art. 86.1 — Límite del decreto-ley:** los decretos-leyes **no podrán afectar** a los **derechos, deberes y libertades de los ciudadanos regulados en el Título I** (todo el Título, no solo la Sección 1.ª), ni al ordenamiento de las instituciones básicas del Estado, al régimen de las CC. AA. ni al Derecho electoral general.\n\n**Art. 168 — Reforma agravada:** la revisión total o la parcial que afecte al **Título preliminar**, al **Capítulo II, Sección 1.ª del Título I** o al **Título II** exige dos tercios de cada Cámara, disolución inmediata de las Cortes, ratificación y aprobación por dos tercios de las nuevas Cámaras y **referéndum obligatorio**. **Trampa:** el art. 14 y la Sección 2.ª se reforman por el procedimiento ordinario del art. 167.\n\n**Art. 169:** no podrá iniciarse la reforma constitucional en tiempo de **guerra** o de vigencia de alguno de los estados del **art. 116**.", "nivel": 2}, {"id": "s5-2", "title": "5.2 Garantías jurisdiccionales", "body": "**Art. 53.2:** cualquier ciudadano podrá recabar la tutela de los derechos del **art. 14 y de la Sección 1.ª del Capítulo II**:\n1. ante los **Tribunales ordinarios**, por un procedimiento basado en los principios de **preferencia y sumariedad**;\n2. y, en su caso, mediante el **recurso de amparo ante el Tribunal Constitucional**. Este recurso es aplicable también a la **objeción de conciencia del art. 30** (única excepción fuera de la Sección 1.ª).\n\n**Recurso de amparo (art. 161.1.b):** competencia del TC por violación de los derechos y libertades del art. 53.2, en los casos y formas que la ley establezca (LOTC).\n\n**Legitimación (art. 162.1)**\n| Recurso | Legitimados |\n|---|---|\n| Inconstitucionalidad | Presidente del Gobierno, **Defensor del Pueblo**, **50 Diputados**, **50 Senadores**, órganos colegiados ejecutivos de las CC. AA. y, en su caso, sus Asambleas |\n| Amparo | Toda persona natural o jurídica que invoque un interés legítimo, el **Defensor del Pueblo** y el **Ministerio Fiscal** |\n\n**Dato clave:** el Defensor del Pueblo es el único órgano legitimado para interponer **ambos** recursos (también lo recoge el art. 29 de la LO 3/1981).", "nivel": 2}, {"id": "s5-3", "title": "5.3 Cuadro de niveles de protección (imprescindible)", "body": "| Ubicación | Vincula a los poderes públicos, reserva de ley y contenido esencial (53.1) | Desarrollo por ley orgánica (81) | Procedimiento preferente y sumario (53.2) | Amparo ante el TC | Reforma de la CE |\n|---|---|---|---|---|---|\n| Art. 14 (igualdad) | Sí | No | Sí | Sí | Ordinaria (art. 167) |\n| Sección 1.ª (arts. 15-29) | Sí | Sí | Sí | Sí | Agravada (art. 168) |\n| Art. 30.2 (objeción de conciencia) | Sí | No | No | **Sí** | Ordinaria |\n| Resto de la Sección 2.ª (arts. 30-38) | Sí | No | No | No | Ordinaria |\n| Capítulo III (arts. 39-52) | No: «informan» la actuación pública; alegables solo según sus leyes de desarrollo (53.3) | No | No | No | Ordinaria |\n\nNotas:\n- La tabla resume el texto constitucional. La exigencia de ley orgánica solo para la Sección 1.ª es la interpretación del Tribunal Constitucional del art. 81.1.\n- **Ningún** derecho del Título I puede ser «afectado» por decreto-ley (art. 86.1).\n- Garantía institucional común a todo el Título I: el **Defensor del Pueblo** (art. 54).", "nivel": 2}, {"id": "s6", "title": "6. La suspensión de los derechos y libertades (art. 55, art. 116 y LO 4/1981)", "body": "El **Capítulo V** (art. 55) prevé dos tipos de suspensión: la **general** (55.1), ligada a los estados de **excepción y de sitio**, y la **individual** (55.2), ligada a investigaciones sobre **bandas armadas o elementos terroristas**. El **art. 116** regula los tres estados excepcionales, y la **LO 4/1981, de 1 de junio, de los estados de alarma, excepción y sitio** (BOE-A-1981-12774) los desarrolla. Esta ley **no ha sido modificada nunca** («Última modificación: sin modificaciones»).\n\n**Por qué estudiarlo a fondo:** según el documento de fuentes, la suspensión (art. 55) **no está en el temario del TAC**, así que aquí se estudia desde cero.", "nivel": 1}, {"id": "s6-1", "title": "6.1 Suspensión general (art. 55.1)", "body": "Pueden suspenderse **cuando se acuerde la declaración del estado de excepción o de sitio** los derechos de los artículos:\n| Artículo | Derecho |\n|---|---|\n| 17 | Libertad personal y derechos del detenido (**el 17.3 solo en estado de sitio**) |\n| 18.2 | Inviolabilidad del domicilio |\n| 18.3 | Secreto de las comunicaciones |\n| 19 | Libre elección de residencia y circulación |\n| 20.1.a) y d) y 20.5 | Libertad de expresión, de información y garantía judicial frente al secuestro de publicaciones |\n| 21 | Reunión y manifestación |\n| 28.2 | Huelga |\n| 37.2 | Medidas de conflicto colectivo |\n\n**Excepción literal del art. 55.1:** el **apartado 3 del artículo 17** (derechos del detenido: información, no declarar, asistencia letrada) **no** puede suspenderse en el **estado de excepción**; solo en el de **sitio** (lo confirma el art. 32.3 de la LO 4/1981).\n\n**El estado de alarma no permite suspender derechos.** El art. 55.1 solo menciona la excepción y el sitio. En la alarma caben **limitaciones** (art. 11 de la LO 4/1981), pero no suspensiones. Esta distinción es la clave de la STC 148/2021 (ver 6.8).\n\n**Regla nemotécnica (8 bloques):** 17 · 18.2 · 18.3 · 19 · 20 (1.a, 1.d y 5) · 21 · 28.2 · 37.2. Es decir: **libertad, domicilio, comunicaciones, circulación, expresión e información, reunión, huelga y conflicto colectivo**. **No** se pueden suspender, entre otros, la vida (15), la libertad religiosa (16), la asociación (22), la tutela judicial (24) ni la igualdad (14).", "nivel": 2}, {"id": "s6-2", "title": "6.2 Suspensión individual (art. 55.2)", "body": "**Una ley orgánica** podrá determinar la forma y los casos en que, **de forma individual** y con la **necesaria intervención judicial** y el **adecuado control parlamentario**, pueden suspenderse para **personas determinadas** los derechos de los arts.:\n- **17.2** (duración máxima de la detención preventiva: 72 horas);\n- **18.2** (inviolabilidad del domicilio);\n- **18.3** (secreto de las comunicaciones);\n\nen relación con las investigaciones sobre la actuación de **bandas armadas o elementos terroristas**.\n\n**Responsabilidad:** la utilización injustificada o abusiva de estas facultades producirá **responsabilidad penal**, como violación de los derechos y libertades reconocidos por las leyes.\n\n**Diferencias con la suspensión general**\n| | General (55.1) | Individual (55.2) |\n|---|---|---|\n| Presupuesto | Estado de excepción o de sitio | Investigación sobre bandas armadas o terrorismo |\n| Alcance | Colectivo, en un ámbito territorial | Personas determinadas |\n| Derechos | 17, 18.2-3, 19, 20.1 a) y d) y 5, 21, 28.2, 37.2 | Solo 17.2, 18.2 y 18.3 |\n| Garantías | Declaración y control del Congreso (art. 116) | Intervención judicial y control parlamentario |\n\nDesarrollo legal: fuera de los textos adjuntos. Su regulación vigente está en la **Ley de Enjuiciamiento Criminal**, por ejemplo la prórroga de la detención incomunicada. Conviene contrastarlo antes de memorizar los artículos concretos.", "nivel": 2}, {"id": "s6-3", "title": "6.3 Reglas comunes a los tres estados (art. 116 CE y arts. 1-3 LO 4/1981)", "body": "**Presupuesto general (art. 1.1 LO 4/1981):** circunstancias extraordinarias que hagan **imposible el mantenimiento de la normalidad mediante los poderes ordinarios** de las autoridades competentes.\n\n**Principios (art. 1.2):** medidas y duración **estrictamente indispensables** para restablecer la normalidad; aplicación **proporcionada** a las circunstancias.\n\n**Fin de la vigencia (art. 1.3):** decaen las competencias sancionadoras y preventivas extraordinarias y las medidas adoptadas en base a ellas, **salvo las sanciones firmes**.\n\n**Continuidad institucional**\n- La declaración **no interrumpe el normal funcionamiento de los poderes constitucionales** (art. 1.4 LO; art. 116.5 CE).\n- **No podrá disolverse el Congreso** mientras esté declarado alguno de los estados; las Cámaras quedan **automáticamente convocadas** si no están en periodo de sesiones (116.5).\n- Si el Congreso está disuelto o ha expirado su mandato, sus competencias las asume la **Diputación Permanente** (116.5).\n- **No se modifica el principio de responsabilidad** del Gobierno y de sus agentes (116.6).\n- **No puede iniciarse la reforma constitucional** (art. 169).\n\n**Publicidad y entrada en vigor (art. 2):** publicación **inmediata en el BOE**, difusión obligatoria por todos los medios de comunicación públicos (y los privados que se determinen); entra en vigor **desde el instante mismo de su publicación**.\n\n**Control judicial y responsabilidad (art. 3):** los actos y disposiciones de la Administración durante estos estados son **impugnables en vía jurisdiccional**; quien sufra daños por actos que no le sean imputables tiene **derecho a indemnización**.", "nivel": 2}, {"id": "s6-4", "title": "6.4 Estado de alarma (arts. 4-12 LO 4/1981)", "body": "**Supuestos (art. 4)**, alteraciones graves de la normalidad, en todo o parte del territorio:\n- **a)** catástrofes, calamidades o desgracias públicas (terremotos, inundaciones, incendios urbanos y forestales, accidentes de gran magnitud);\n- **b)** **crisis sanitarias** (epidemias, situaciones de contaminación graves);\n- **c)** paralización de **servicios públicos esenciales** cuando no se garanticen los arts. 28.2 y 37.2 CE **y** concurra alguna de las demás circunstancias de este artículo;\n- **d)** situaciones de **desabastecimiento** de productos de primera necesidad.\n\n**Declaración**\n- Por el **Gobierno**, mediante **decreto acordado en Consejo de Ministros** (art. 116.2 CE; art. 6.1 LO).\n- El decreto fija el **ámbito territorial**, la **duración** y los **efectos**. La duración **no podrá exceder de 15 días**, y solo se prorroga con **autorización expresa del Congreso**, que puede establecer el alcance y las condiciones de la prórroga (art. 6.2).\n- El Gobierno **da cuenta al Congreso** de la declaración y de los decretos que dicte (art. 8).\n- **Si afecta solo a una Comunidad Autónoma**, su **Presidente podrá solicitar** del Gobierno la declaración (art. 5).\n\n**Autoridad competente (art. 7):** el **Gobierno** o, **por delegación**, el **Presidente de la Comunidad Autónoma** cuando la declaración afecte exclusivamente a su territorio.\n\n**Efectos sobre el personal (art. 9):** todas las autoridades civiles, policías autonómicas y locales y demás funcionarios y trabajadores quedan **bajo las órdenes directas de la Autoridad competente**, que puede imponerles **servicios extraordinarios**. Si la autoridad es un Presidente autonómico, podrá requerir la colaboración de las **Fuerzas y Cuerpos de Seguridad del Estado**, que actuarán bajo sus mandos naturales.\n\n**Incumplimientos (art. 10):** sanción según las leyes. Si los comete un funcionario, puede ser **suspendido de inmediato**, con traslado del tanto de culpa al juez. Si los comete una autoridad, sus facultades pueden ser **asumidas por la Autoridad competente**.\n\n**Medidas posibles (art. 11)**\n- **a)** limitar la circulación o permanencia de personas o vehículos en horas y lugares determinados, o condicionarlas a requisitos;\n- **b)** requisas temporales de bienes y prestaciones personales obligatorias;\n- **c)** intervenir y ocupar transitoriamente industrias, fábricas, talleres, explotaciones o locales, **con excepción de domicilios privados**;\n- **d)** limitar o racionar el uso de servicios o el consumo de artículos de primera necesidad;\n- **e)** órdenes para asegurar el abastecimiento de los mercados.\n\n**Medidas específicas (art. 12)**\n- Supuestos a) y b): medidas de las normas sobre **enfermedades infecciosas**, medio ambiente, aguas e incendios forestales.\n- Supuestos c) y d): **intervención de empresas o servicios** y **movilización de su personal**.", "nivel": 2}, {"id": "s6-5", "title": "6.5 Estado de excepción (arts. 13-31 LO 4/1981)", "body": "**Presupuesto (art. 13.1):** el libre ejercicio de los derechos y libertades, el normal funcionamiento de las instituciones democráticas, el de los servicios públicos esenciales o cualquier otro aspecto del **orden público** resultan tan gravemente alterados que las potestades ordinarias son **insuficientes** para restablecerlo.\n\n**Procedimiento**\n1. El **Gobierno solicita autorización al Congreso** (art. 116.3 CE; art. 13). La solicitud debe contener: **a)** los efectos, con **mención expresa de los derechos cuya suspensión se solicita** (solo los del art. 55.1); **b)** las medidas a adoptar; **c)** el ámbito territorial y la duración, que **no podrá exceder de 30 días**; **d)** la **cuantía máxima de las sanciones pecuniarias**.\n2. El **Congreso** debate la solicitud y puede **aprobarla en sus propios términos o introducir modificaciones** (13.3).\n3. Obtenida la autorización, el **Gobierno declara** el estado de excepción por **decreto acordado en Consejo de Ministros**, con el contenido autorizado (art. 14).\n4. **Prórroga:** por otros **30 días**, con los mismos requisitos (116.3 CE; 15.3 LO). Para **modificar** las medidas también hace falta nueva autorización. El Gobierno puede **ponerle fin anticipadamente** por decreto, dando cuenta inmediata al Congreso (15.2).\n\n**Medidas de la autoridad gubernativa** (cada una requiere que la autorización comprenda la suspensión del derecho correspondiente)\n| Medida | Art. LO | Derecho suspendido | Garantía |\n|---|---|---|---|\n| Detención si hay fundadas sospechas de que la persona va a alterar el orden público | 16 | 17 | Máx. **10 días**; comunicación al juez en **24 horas**; se respetan los derechos del 17.3 |\n| Inspecciones y registros domiciliarios | 17 | 18.2 | Orden formal y escrita; presencia del titular o familiares y de **dos vecinos**; acta; comunicación inmediata al juez |\n| Intervención de comunicaciones | 18 | 18.3 | Comunicación inmediata, por escrito motivado, al juez |\n| Prohibir la circulación, zonas de seguridad, fijar residencia, desplazamientos | 20 | 19 | Comunicar desplazamientos con **2 días** de antelación; fundados motivos de peligrosidad |\n| Suspender publicaciones, emisiones y representaciones; secuestro de publicaciones | 21 | 20.1 a) y d) y 20.5 | **Nunca censura previa** |\n| Autorización previa, prohibición o disolución de reuniones | 22 | 21 | No afecta a las reuniones orgánicas de partidos, sindicatos y asociaciones empresariales |\n| Prohibir huelgas y medidas de conflicto colectivo | 23 | 28.2 y 37.2 | — |\n\n**Otras medidas (sin suspensión específica):** intervenir y controlar transportes (19); obligaciones de los **extranjeros** y posible **expulsión** con justificación sumaria previa (24); **incautación de armas** (25); intervención o cierre de industrias y locales (26); vigilancia de edificaciones y servicios, con puestos armados (27); suspensión de funcionarios que favorezcan a los perturbadores (29). Si concurren circunstancias de alarma, pueden sumarse también sus medidas (28).\n\n**Jueces (art. 30):** prisión provisional del presunto responsable durante el estado, oído el Fiscal; los condenados quedan exceptuados de la **remisión condicional** mientras dure.", "nivel": 2}, {"id": "s6-6", "title": "6.6 Estado de sitio (arts. 32-36 LO 4/1981)", "body": "**Presupuesto (art. 32.1):** cuando se produzca o amenace producirse una **insurrección o acto de fuerza contra la soberanía o independencia de España, su integridad territorial o el ordenamiento constitucional** que no pueda resolverse por otros medios.\n\n**Declaración (art. 116.4 CE):** por la **mayoría absoluta del Congreso**, a **propuesta exclusiva del Gobierno**. El Congreso determina su **ámbito territorial, duración y condiciones**. Es el único estado que **declara el Congreso** y no el Gobierno.\n\n**Contenido**\n- Puede autorizar, **además de lo previsto para la alarma y la excepción**, la suspensión temporal de las **garantías del detenido del art. 17.3** (art. 32.3).\n- El **Gobierno**, que dirige la política militar y de la defensa (art. 97 CE), asume todas las facultades extraordinarias y **designa la Autoridad militar** que ejecutará las medidas bajo su dirección (art. 33).\n- La Autoridad militar publica y difunde los **bandos** oportunos (art. 34).\n- El Congreso puede determinar los **delitos sometidos a la Jurisdicción Militar** durante su vigencia (art. 35).\n- Las **autoridades civiles** conservan las facultades no conferidas a la militar y deben informarle (art. 36).", "nivel": 2}, {"id": "s6-7", "title": "6.7 Cuadro comparativo de los tres estados", "body": "| | Alarma | Excepción | Sitio |\n|---|---|---|---|\n| Causa | Catástrofes, crisis sanitarias, paralización de servicios esenciales (con otra circunstancia), desabastecimiento | Grave alteración del orden público, de los derechos o de las instituciones | Insurrección o acto de fuerza contra la soberanía, independencia, integridad territorial u orden constitucional |\n| Quién declara | **Gobierno** (decreto del Consejo de Ministros) | **Gobierno**, previa **autorización** del Congreso | **Congreso**, por **mayoría absoluta**, a propuesta exclusiva del Gobierno |\n| Duración inicial | Máx. **15 días** | Máx. **30 días** | La que fije el Congreso |\n| Prórroga | Solo con autorización expresa del Congreso (sin plazo fijado en la CE) | Otros **30 días**, con los mismos requisitos | La que fije el Congreso |\n| Papel del Congreso | Se le da cuenta; autoriza la prórroga | Autoriza (puede modificar la solicitud) | Declara |\n| Suspensión de derechos | **No** (solo limitaciones) | Sí: los del 55.1, **salvo el 17.3** | Sí: los del 55.1, **incluido el 17.3** |\n| Autoridad | Gobierno o, por delegación, Presidente autonómico | Autoridad gubernativa | Autoridad militar designada por el Gobierno |\n| Papel de las CC. AA. | Su Presidente puede solicitarlo y ser autoridad delegada | Coordinación con el Gobierno autonómico (art. 31) | — |\n\n**En los tres:** no se disuelve el Congreso, no se interrumpen los poderes del Estado, se mantiene la responsabilidad del Gobierno, no puede iniciarse la reforma constitucional y el **Defensor del Pueblo sigue actuando** (art. 11.3 LO 3/1981).", "nivel": 2}, {"id": "s6-8", "title": "6.8 Aplicación práctica y jurisprudencia constitucional", "body": "**Estados declarados.** Los estados de **excepción y de sitio nunca se han declarado**. El de **alarma** sí:\n- **2010:** **RD 1673/2010**, de 4 de diciembre, por el cierre del espacio aéreo, para normalizar el servicio público esencial del **transporte aéreo** (crisis de los controladores). Fue prorrogado con autorización del Congreso.\n- **2020:** **RD 463/2020**, de 14 de marzo, por la **crisis sanitaria de la COVID-19**, prorrogado varias veces hasta junio de 2020.\n- **2020-2021:** **RD 926/2020**, de 25 de octubre, segundo estado de alarma general por la COVID-19, con una **prórroga de seis meses** (hasta mayo de 2021) y **delegación en los Presidentes autonómicos** como autoridades competentes. Antes hubo otro estado de alarma limitado a varios municipios de Madrid (octubre de 2020).\n\n**Jurisprudencia clave**\n- **STC 83/2016, de 28 de abril:** la decisión de declarar el estado de alarma, aunque se formaliza por decreto del Consejo de Ministros, tiene **rango o valor de ley**. Por eso su control corresponde al **Tribunal Constitucional**, no a la jurisdicción contencioso-administrativa.\n- **STC 148/2021, de 14 de julio:** declaró **inconstitucionales y nulos los apartados 1, 3 y 5 del art. 7 del RD 463/2020** (confinamiento domiciliario general), porque no **limitaban** sino que **suspendían** la libertad de circulación del **art. 19 CE**, algo que la alarma no permite (art. 55.1). También anuló el inciso «modificar, ampliar o» del art. 10.6.\n- **STC 183/2021, de 27 de octubre:** declaró inconstitucionales la **duración de la prórroga de seis meses** del RD 926/2020, por fijarse sin justificación razonable que impedía el control del Congreso, y la **delegación** en los Presidentes autonómicos como autoridades competentes.\n\n**Consecuencia para el examen:** **limitación** (posible en la alarma) frente a **suspensión** (solo en excepción y sitio). Las sentencias de 2021 aplican exactamente esa distinción.", "nivel": 2}, {"id": "s7", "title": "7. El Defensor del Pueblo (art. 54 CE y LO 3/1981)", "body": "**Art. 54 CE:** «Una **ley orgánica** regulará la institución del Defensor del Pueblo, como **alto comisionado de las Cortes Generales**, designado por éstas para la **defensa de los derechos comprendidos en este Título**, a cuyo efecto podrá **supervisar la actividad de la Administración**, dando cuenta a las Cortes Generales.»\n\nEsa ley es la **LO 3/1981, de 6 de abril, del Defensor del Pueblo** (BOE-A-1981-10325). Su última modificación es de **4 de noviembre de 2009** y le atribuyó las funciones de **Mecanismo Nacional de Prevención de la Tortura**. Su art. 1 reproduce casi literalmente el art. 54 CE. La figura está inspirada en el *ombudsman* nórdico.", "nivel": 1}, {"id": "s7-1", "title": "7.1 Elección, nombramiento y mandato (arts. 1-4)", "body": "- **Mandato: 5 años** (art. 2.1). Se dirige a las Cortes a través de los **Presidentes del Congreso y del Senado**.\n- **Comisión Mixta Congreso-Senado** de relaciones con el Defensor del Pueblo (art. 2.2-3): se reúne cuando lo acuerden conjuntamente ambos Presidentes y, en todo caso, para **proponer el candidato o candidatos**; decide por **mayoría simple**.\n\n**Elección (art. 2.4-5)**\n1. Propuesto el candidato, se convoca al **Pleno del Congreso** en un término **no inferior a 10 días**.\n2. Es designado quien obtenga **3/5 de los miembros del Congreso** y, en un plazo **máximo de 20 días**, sea **ratificado por 3/5 del Senado**.\n3. Si no se alcanzan esas mayorías, la Comisión formula **nuevas propuestas** en el plazo **máximo de un mes**. Entonces, conseguidos los **3/5 en el Congreso**, basta la **mayoría absoluta del Senado**.\n\n- **Requisitos (art. 3):** cualquier **español mayor de edad** en el pleno disfrute de sus derechos civiles y políticos.\n- **Nombramiento (art. 4):** lo acreditan **conjuntamente con sus firmas los Presidentes del Congreso y del Senado** y se publica en el BOE. Toma posesión ante las **Mesas de ambas Cámaras reunidas conjuntamente**, con juramento o promesa.", "nivel": 2}, {"id": "s7-2", "title": "7.2 Cese, sustitución, prerrogativas e incompatibilidades (arts. 5-8)", "body": "**Causas de cese (art. 5.1)**\n1. Renuncia.\n2. Expiración del plazo de su nombramiento.\n3. Muerte o incapacidad sobrevenida.\n4. **Notoria negligencia** en el cumplimiento de las obligaciones y deberes del cargo.\n5. Condena, por **sentencia firme**, por **delito doloso**.\n\n**Vacante (art. 5.2-4)**\n- La declara el **Presidente del Congreso** en caso de **muerte, renuncia y expiración** del mandato.\n- En los demás casos se decide por **3/5 de cada Cámara**, mediante debate y previa audiencia del interesado.\n- El procedimiento de nuevo nombramiento se inicia en un plazo **no superior a un mes**.\n- Mientras tanto, ejercen las funciones **interinamente los Adjuntos, en su propio orden**.\n\n**Prerrogativas (art. 6)**\n- **No está sujeto a mandato imperativo** ni recibe instrucciones de ninguna autoridad: actúa con **autonomía y según su criterio**.\n- **Inviolabilidad:** no puede ser detenido, expedientado, multado, perseguido o juzgado por las opiniones que formule o los actos que realice en el ejercicio de su cargo.\n- **Inmunidad:** en los demás casos, solo puede ser detenido o retenido en **flagrante delito**. La decisión sobre su inculpación, prisión, procesamiento y juicio corresponde **exclusivamente a la Sala de lo Penal del Tribunal Supremo**.\n- Estas reglas se aplican también a los **Adjuntos**.\n\n**Incompatibilidades (art. 7):** todo mandato representativo; cargo político o actividad de propaganda política; servicio activo en cualquier Administración; afiliación a un partido o funciones directivas en un partido, sindicato, asociación o fundación; carreras judicial y fiscal; cualquier actividad profesional, liberal, mercantil o laboral.\n- Debe cesar en la incompatibilidad **dentro de los 10 días siguientes a su nombramiento y antes de tomar posesión**; si no, se entiende que **no acepta** el nombramiento.\n- Si la incompatibilidad es sobrevenida, se entiende que **renuncia** en la fecha en que se produjo.\n\n**Adjuntos (art. 8):** un **Adjunto Primero** y un **Adjunto Segundo**. El Defensor puede delegar en ellos y le sustituyen por su orden en caso de imposibilidad temporal y de cese. Los **nombra y separa el Defensor**, **previa conformidad de las Cámaras** (de la Comisión Mixta, según el art. 2.6). Su nombramiento se publica en el BOE.", "nivel": 2}, {"id": "s7-3", "title": "7.3 Procedimiento: quejas e investigación (arts. 9-27)", "body": "**Ámbito (arts. 9, 12-14)**\n- Investiga, **de oficio o a petición de parte**, los actos y resoluciones de la **Administración pública y sus agentes**, a la luz del **art. 103.1 CE** y del respeto a los derechos del Título I.\n- Alcanza a **ministros, autoridades administrativas, funcionarios** y cualquier persona al servicio de las Administraciones.\n- Puede supervisar la actividad de las **Comunidades Autónomas**; sus órganos similares (defensores autonómicos) coordinarán sus funciones con él (art. 12).\n- **Administración de Justicia (art. 13):** remite las quejas al **Ministerio Fiscal** o al **Consejo General del Poder Judicial**, según el tipo de reclamación (no investiga a los jueces).\n- **Administración militar (art. 14):** vela por los derechos sin interferir en el mando de la Defensa Nacional.\n\n**Quién puede acudir (art. 10)**\n- **Toda persona natural o jurídica que invoque un interés legítimo**, sin restricción. No son impedimento la **nacionalidad, residencia, sexo, minoría de edad, incapacidad legal**, el internamiento penitenciario ni las relaciones especiales de sujeción.\n- Los **Diputados y Senadores individualmente**, las comisiones de investigación o de defensa de derechos y, principalmente, la **Comisión Mixta**, mediante escrito motivado.\n- **No pueden presentar quejas las autoridades administrativas en asuntos de su competencia.**\n\n**Funcionamiento continuo (art. 11):** su actividad **no se interrumpe** aunque las Cortes no estén reunidas, hayan sido disueltas o haya expirado su mandato (se dirige entonces a las **Diputaciones Permanentes**), ni durante los **estados de excepción o de sitio**.\n\n**Requisitos de la queja (art. 15)**\n- **Firmada** por el interesado, con nombre, apellidos y domicilio, en escrito razonado en papel común.\n- Plazo **máximo de un año** desde que se tuvo conocimiento de los hechos.\n- Es **gratuita** y **no requiere abogado ni procurador**. De toda queja se acusa recibo.\n\n**Garantías del interesado (art. 16):** la correspondencia dirigida al Defensor desde **centros de detención, internamiento o custodia** no puede ser censurada, ni pueden escucharse las conversaciones.\n\n**Admisión y rechazo (art. 17)**\n- **Rechaza las quejas anónimas.** Puede rechazar las de **mala fe**, sin fundamento o sin pretensión, o las que perjudiquen el derecho de un tercero.\n- **No examina individualmente** las quejas **pendientes de resolución judicial** y suspende la actuación si se interpone demanda o recurso; aun así, puede investigar los problemas generales planteados.\n- **Sus decisiones no son susceptibles de recurso.**\n\n**Investigación (arts. 18-22)**\n- Investigación **sumaria e informal**. El organismo afectado debe remitir **informe escrito en 15 días** (plazo ampliable).\n- Una negativa o negligencia puede calificarse como **«hostil y entorpecedora»** y hacerse pública.\n- **Todos los poderes públicos** deben auxiliarle **con carácter preferente y urgente**; puede personarse en cualquier centro y acceder a expedientes.\n- El funcionario afectado responde por escrito en un plazo **no inferior a 10 días**, prorrogable por la mitad.\n- **Documentos secretos (art. 22):** puede solicitarlos. Su no remisión debe acordarla el **Consejo de Ministros**, con certificación del acuerdo denegatorio. Si el documento es decisivo, lo pone en conocimiento de la **Comisión Mixta**.\n\n**Responsabilidades (arts. 23-26)**\n- Si aprecia abuso, arbitrariedad, discriminación, error, negligencia u omisión, se dirige al funcionario y a su superior.\n- La actitud hostil persistente puede ser objeto de un **informe especial**.\n- Pone los hechos presuntamente delictivos en conocimiento del **Fiscal General del Estado**.\n- Puede ejercitar **de oficio la acción de responsabilidad** contra autoridades, funcionarios y agentes, sin necesidad de reclamación previa.", "nivel": 2}, {"id": "s7-4", "title": "7.4 Resoluciones, informes y medios (arts. 28-37)", "body": "**Naturaleza de sus resoluciones (art. 28)**\n- **No puede modificar ni anular actos y resoluciones** de la Administración.\n- Puede **sugerir la modificación de los criterios** utilizados para producirlos, y **sugerir al legislador o a la Administración la modificación de una norma** cuyo cumplimiento riguroso provoque situaciones injustas.\n- En los servicios prestados por particulares con habilitación administrativa, puede instar a la Administración a ejercer sus potestades de inspección y sanción.\n\n**Legitimación ante el TC (art. 29):** recursos de **inconstitucionalidad y de amparo**.\n\n**Resoluciones (art. 30):** **advertencias, recomendaciones, recordatorios de deberes legales y sugerencias**.\n- La autoridad o el funcionario debe **responder por escrito en un mes como máximo**.\n- Si no se adopta una medida adecuada ni se justifica, lo pone en conocimiento del **Ministro** del Departamento o de la máxima autoridad. Si tampoco hay justificación, lo incluye en su informe **con los nombres** de las autoridades o funcionarios.\n\n**Informes a las Cortes (arts. 32-33)**\n- **Informe anual** a las Cortes Generales, cuando estén reunidas en **periodo ordinario de sesiones**.\n- **Informe extraordinario** cuando la gravedad o urgencia lo aconsejen; se dirige a las **Diputaciones Permanentes** si las Cámaras no están reunidas.\n- Ambos **se publican**.\n- El informe anual recoge el número y tipo de quejas, las rechazadas y sus causas, y los resultados de las investigaciones. **No incluye datos personales** que identifiquen a los interesados. Lleva un **anexo con la liquidación del presupuesto**.\n- Un **resumen** se expone **oralmente ante los Plenos de ambas Cámaras**.\n\n**Medios (arts. 34-37)**\n- Designa libremente a sus **asesores**.\n- Su personal se considera **al servicio de las Cortes**; a los funcionarios se les reserva plaza y destino.\n- **Adjuntos y asesores cesan automáticamente** cuando toma posesión un nuevo Defensor.\n- Su dotación económica es una **partida de los Presupuestos de las Cortes Generales**.\n\n**Mecanismo Nacional de Prevención de la Tortura (disposición final única):** el Defensor ejerce estas funciones conforme al **Protocolo facultativo de la Convención contra la tortura** de la ONU. Existe un **Consejo Asesor**, presidido por el **Adjunto** en quien delegue.", "nivel": 2}, {"id": "s7-5", "title": "7.5 La institución hoy (dato que caduca)", "body": "- **Titular:** **Ángel Gabilondo Pujol**, que tomó posesión el **18 de noviembre de 2021**. Su mandato de 5 años **vence en noviembre de 2026**: comprobar la renovación antes del examen.\n- **Adjuntas:** **M.ª Teresa Jiménez-Becerril** (Adjunta Primera) y **Patricia Bárcena García** (Adjunta Segunda), elegidas el 30 de noviembre de 2021.\n- **Informe anual 2025** (presentado en 2026): **38.144 quejas** (3.742 más que en 2024), **253 actuaciones de oficio** y **365 solicitudes** de interposición de recursos de inconstitucionalidad y amparo, en total **38.762 expedientes**. Materias más frecuentes: Administración de Justicia (dilaciones), sanidad y política social, Seguridad Social y empleo, migraciones, interior y educación.\n\nFuente de estos datos: notas de prensa de defensordelpueblo.es y prensa general, consultadas el 2-10-2026. Antes del examen, revisa en www.defensordelpueblo.es el **informe anual más reciente** y la **composición vigente**.", "nivel": 2}, {"id": "s8", "title": "8. Claves de examen y trampas frecuentes", "body": "**Cifras y plazos que más se preguntan**\n| Dato | Valor | Fuente |\n|---|---|---|\n| Detención preventiva máxima | **72 horas** | art. 17.2 CE |\n| Detención en estado de excepción | **10 días**; comunicación al juez en **24 h** | art. 16 LO 4/1981 |\n| Estado de alarma | **15 días**; prórroga solo con autorización del Congreso | art. 116.2 CE |\n| Estado de excepción | **30 días + 30** | art. 116.3 CE |\n| Estado de sitio | Mayoría **absoluta** del Congreso | art. 116.4 CE |\n| Mandato del Defensor | **5 años** | art. 2.1 LO 3/1981 |\n| Elección del Defensor | **3/5 Congreso + 3/5 Senado (en 20 días)**; después, 3/5 Congreso + mayoría absoluta Senado | art. 2 LO 3/1981 |\n| Plazo de la queja | **1 año** | art. 15 LO 3/1981 |\n| Informe del organismo requerido | **15 días** | art. 18 LO 3/1981 |\n| Respuesta a recomendaciones | **1 mes** | art. 30 LO 3/1981 |\n| Legitimados para recurso de inconstitucionalidad | 50 Diputados / 50 Senadores | art. 162 CE |\n\n**Trampas habituales**\n1. **El art. 14 no está en la Sección 1.ª**, pero tiene amparo; en cambio, **no** tiene reforma agravada.\n2. **La objeción de conciencia (30.2)** está en la Sección 2.ª, pero tiene **amparo**.\n3. **La alarma no suspende derechos**: solo los limita. Suspender cabe solo en excepción y sitio.\n4. **El 17.3 no se suspende en el estado de excepción**; solo en el de sitio.\n5. **El sitio lo declara el Congreso**; la alarma y la excepción, el **Gobierno** (la excepción con autorización previa).\n6. **La CE no fija un límite a la prórroga de la alarma**; la de la excepción es de otros 30 días.\n7. **El Defensor no anula actos**: sugiere, recomienda, advierte y recuerda deberes.\n8. **No investiga a los jueces**: remite las quejas al Ministerio Fiscal o al CGPJ.\n9. **Las autoridades administrativas no pueden quejarse** en asuntos de su competencia.\n10. **Las decisiones del Defensor sobre las quejas no son recurribles.**\n11. **El decreto-ley no puede afectar a ningún derecho del Título I** (art. 86), no solo a los de la Sección 1.ª.\n12. **El Defensor sigue funcionando** con las Cortes disueltas (ante las Diputaciones Permanentes) y durante la excepción y el sitio.", "nivel": 1}], "glossary": [{"t": "Derechos fundamentales y libertades públicas", "d": "Derechos del Capítulo II, Sección 1.ª del Título I (arts. 15-29), con el máximo nivel de protección: ley orgánica, procedimiento preferente y sumario, amparo y reforma agravada.", "section": "s3", "cat": "Título I"}, {"t": "Contenido esencial", "d": "Núcleo de un derecho del Capítulo II que la ley que regule su ejercicio debe respetar en todo caso (art. 53.1 CE).", "section": "s5-1", "cat": "Garantías"}, {"t": "Reserva de ley", "d": "Exigencia de que el ejercicio de los derechos del Capítulo II solo pueda regularse por ley (art. 53.1 CE).", "section": "s5-1", "cat": "Garantías"}, {"t": "Ley orgánica", "d": "La relativa al desarrollo de los derechos fundamentales y libertades públicas, entre otras; requiere mayoría absoluta del Congreso en votación final sobre el conjunto (art. 81 CE).", "section": "s5-1", "cat": "Garantías"}, {"t": "Procedimiento preferente y sumario", "d": "Vía ante los tribunales ordinarios para tutelar el art. 14 y la Sección 1.ª (art. 53.2 CE).", "section": "s5-2", "cat": "Garantías"}, {"t": "Recurso de amparo", "d": "Recurso ante el TC por violación del art. 14, la Sección 1.ª y la objeción de conciencia (arts. 53.2 y 161.1.b CE). Legitimados: persona natural o jurídica con interés legítimo, Defensor del Pueblo y Ministerio Fiscal.", "section": "s5-2", "cat": "Garantías"}, {"t": "Principios rectores", "d": "Capítulo III del Título I (arts. 39-52). Informan la legislación, la práctica judicial y la actuación de los poderes públicos; solo se alegan ante la jurisdicción ordinaria según las leyes que los desarrollen (art. 53.3 CE).", "section": "s4", "cat": "Título I"}, {"t": "Habeas corpus", "d": "Procedimiento para la inmediata puesta a disposición judicial de toda persona detenida ilegalmente (art. 17.4 CE).", "section": "s3-1", "cat": "Derechos"}, {"t": "Detención preventiva", "d": "Privación de libertad por el tiempo estrictamente necesario para las averiguaciones; máximo 72 horas antes de libertad o disposición judicial (art. 17.2 CE).", "section": "s3-1", "cat": "Derechos"}, {"t": "Inviolabilidad del domicilio", "d": "Ninguna entrada o registro sin consentimiento del titular o resolución judicial, salvo flagrante delito (art. 18.2 CE).", "section": "s3-1", "cat": "Derechos"}, {"t": "Censura previa", "d": "Control previo de contenidos prohibido en todo caso por el art. 20.2 CE; tampoco cabe en el estado de excepción (art. 21.2 LO 4/1981).", "section": "s3-2", "cat": "Derechos"}, {"t": "Objeción de conciencia", "d": "Derecho del art. 30.2 CE (Sección 2.ª) al que el art. 53.2 extiende el recurso de amparo.", "section": "s4", "cat": "Derechos"}, {"t": "Suspensión general de derechos", "d": "Suspensión colectiva de los derechos del art. 55.1 CE al declararse el estado de excepción o de sitio.", "section": "s6-1", "cat": "Suspensión"}, {"t": "Suspensión individual de derechos", "d": "Suspensión, por ley orgánica y para personas determinadas, de los arts. 17.2 y 18.2-3 CE en investigaciones sobre bandas armadas o terroristas, con intervención judicial y control parlamentario (art. 55.2 CE).", "section": "s6-2", "cat": "Suspensión"}, {"t": "Estado de alarma", "d": "Estado excepcional declarado por el Gobierno, por decreto del Consejo de Ministros, ante catástrofes, crisis sanitarias, paralización de servicios esenciales o desabastecimiento; máximo 15 días prorrogables con autorización del Congreso (art. 116.2 CE; arts. 4-12 LO 4/1981).", "section": "s6-4", "cat": "Suspensión"}, {"t": "Estado de excepción", "d": "Estado excepcional declarado por el Gobierno, previa autorización del Congreso, por grave alteración del orden público; máximo 30 días prorrogables por otros 30 (art. 116.3 CE; arts. 13-31 LO 4/1981).", "section": "s6-5", "cat": "Suspensión"}, {"t": "Estado de sitio", "d": "Estado excepcional declarado por mayoría absoluta del Congreso, a propuesta exclusiva del Gobierno, ante insurrección o acto de fuerza contra la soberanía, independencia, integridad territorial u orden constitucional (art. 116.4 CE; arts. 32-36 LO 4/1981).", "section": "s6-6", "cat": "Suspensión"}, {"t": "Autoridad competente (estado de alarma)", "d": "El Gobierno o, por delegación, el Presidente de la Comunidad Autónoma cuando la declaración afecte solo a su territorio (art. 7 LO 4/1981).", "section": "s6-4", "cat": "Suspensión"}, {"t": "Bando", "d": "Disposición publicada por la Autoridad militar en el estado de sitio con las medidas y prevenciones necesarias (art. 34 LO 4/1981).", "section": "s6-6", "cat": "Suspensión"}, {"t": "Defensor del Pueblo", "d": "Alto comisionado de las Cortes Generales, designado por éstas para la defensa de los derechos del Título I, a cuyo efecto supervisa la actividad de la Administración (art. 54 CE; art. 1 LO 3/1981).", "section": "s7", "cat": "Defensor"}, {"t": "Comisión Mixta Congreso-Senado de relaciones con el Defensor del Pueblo", "d": "Comisión que propone los candidatos a Defensor, da conformidad al nombramiento de los Adjuntos y se relaciona con la institución (art. 2 LO 3/1981).", "section": "s7-1", "cat": "Defensor"}, {"t": "Adjuntos del Defensor del Pueblo", "d": "Adjunto Primero y Adjunto Segundo: auxilian al Defensor, pueden recibir delegación y le sustituyen por su orden; nombrados por él con conformidad de las Cámaras (art. 8 LO 3/1981).", "section": "s7-2", "cat": "Defensor"}, {"t": "Inviolabilidad (Defensor del Pueblo)", "d": "No puede ser detenido, expedientado, multado, perseguido ni juzgado por las opiniones o actos realizados en el ejercicio de su cargo (art. 6.2 LO 3/1981).", "section": "s7-2", "cat": "Defensor"}, {"t": "Queja", "d": "Escrito firmado, con nombre, apellidos y domicilio, presentado en el plazo máximo de un año; gratuito y sin abogado ni procurador (art. 15 LO 3/1981).", "section": "s7-3", "cat": "Defensor"}, {"t": "Actitud hostil y entorpecedora", "d": "Calificación que el Defensor puede dar a la negativa o negligencia en remitir el informe solicitado, con posible informe especial (arts. 18.2 y 24 LO 3/1981).", "section": "s7-3", "cat": "Defensor"}, {"t": "Recomendaciones del Defensor", "d": "Junto con advertencias, recordatorios de deberes legales y sugerencias, son sus resoluciones; obligan a responder por escrito en un mes como máximo, pero no anulan actos (arts. 28 y 30 LO 3/1981).", "section": "s7-4", "cat": "Defensor"}, {"t": "Mecanismo Nacional de Prevención de la Tortura", "d": "Funciones que ejerce el Defensor del Pueblo conforme al Protocolo facultativo de la Convención contra la tortura, con un Consejo Asesor presidido por un Adjunto (disposición final única LO 3/1981).", "section": "s7-4", "cat": "Defensor"}, {"t": "Diputación Permanente", "d": "Órgano al que se dirige el Defensor cuando las Cámaras no están reunidas o están disueltas (art. 11 LO 3/1981), y que asume las competencias del Congreso en los estados excepcionales si está disuelto (art. 116.5 CE).", "section": "s6-3", "cat": "Instituciones"}], "timeline": [{"y": "1978", "txt": "Constitución Española (aprobada el 27-12-1978; BOE de 29-12-1978)", "cons": "Título I: derechos, garantías (art. 53), Defensor del Pueblo (art. 54) y suspensión (art. 55)", "cat": "normativo", "target": "s1"}, {"y": "1981", "txt": "LO 3/1981, de 6 de abril, del Defensor del Pueblo", "cons": "Desarrolla el art. 54 CE", "cat": "normativo", "target": "s7"}, {"y": "1981", "txt": "LO 4/1981, de 1 de junio, de los estados de alarma, excepción y sitio (BOE de 5-6-1981)", "cons": "Desarrolla el art. 116 CE; vigente sin modificaciones", "cat": "normativo", "target": "s6"}, {"y": "1992", "txt": "Primera reforma constitucional: art. 13.2", "cons": "Sufragio pasivo de extranjeros en elecciones municipales («y pasivo»)", "cat": "normativo", "target": "s2"}, {"y": "2009", "txt": "Última modificación de la LO 3/1981 (4 de noviembre de 2009)", "cons": "El Defensor del Pueblo asume el Mecanismo Nacional de Prevención de la Tortura", "cat": "normativo", "target": "s7-4"}, {"y": "2010", "txt": "RD 1673/2010, de 4 de diciembre: primer estado de alarma", "cons": "Normalización del transporte aéreo (controladores)", "cat": "estados excepcionales", "target": "s6-8"}, {"y": "2016", "txt": "STC 83/2016, de 28 de abril", "cons": "El decreto de alarma tiene rango o valor de ley: su control corresponde al TC", "cat": "jurisprudencia", "target": "s6-8"}, {"y": "2020", "txt": "RD 463/2020, de 14 de marzo: estado de alarma por la COVID-19", "cons": "Confinamiento domiciliario general; varias prórrogas hasta junio de 2020", "cat": "estados excepcionales", "target": "s6-8"}, {"y": "2020", "txt": "RD 926/2020, de 25 de octubre: segundo estado de alarma general", "cons": "Prórroga de seis meses y delegación en Presidentes autonómicos", "cat": "estados excepcionales", "target": "s6-8"}, {"y": "2021", "txt": "STC 148/2021, de 14 de julio", "cons": "Inconstitucional el art. 7.1, 3 y 5 del RD 463/2020: suspendía (no limitaba) el art. 19 CE", "cat": "jurisprudencia", "target": "s6-8"}, {"y": "2021", "txt": "STC 183/2021, de 27 de octubre", "cons": "Inconstitucionales la prórroga de seis meses y la delegación en Presidentes autonómicos", "cat": "jurisprudencia", "target": "s6-8"}, {"y": "2021", "txt": "Ángel Gabilondo toma posesión como Defensor del Pueblo (18 de noviembre)", "cons": "Mandato de 5 años, hasta noviembre de 2026", "cat": "institucional", "target": "s7-5"}, {"y": "2024", "txt": "Reforma del art. 49 CE", "cons": "Personas con discapacidad: ejercen los derechos en condiciones de libertad e igualdad reales y efectivas", "cat": "normativo", "target": "s4"}, {"y": "2026", "txt": "Presentación del Informe anual 2025 del Defensor del Pueblo", "cons": "38.144 quejas, 253 actuaciones de oficio, 365 solicitudes de recurso", "cat": "institucional", "target": "s7-5"}], "flashcards": [{"q": "¿Qué artículos comprende el Título I de la Constitución?", "a": "Del 10 al 55.", "cat": "Estructura"}, {"q": "¿Conforme a qué se interpretan las normas sobre derechos fundamentales (art. 10.2)?", "a": "Conforme a la Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España.", "cat": "Estructura"}, {"q": "¿Qué arts. forman la Sección 1.ª del Capítulo II?", "a": "Los arts. 15 a 29 (derechos fundamentales y libertades públicas).", "cat": "Estructura"}, {"q": "¿Qué arts. forman la Sección 2.ª del Capítulo II?", "a": "Los arts. 30 a 38 (derechos y deberes de los ciudadanos).", "cat": "Estructura"}, {"q": "¿Qué arts. contienen los principios rectores?", "a": "Los arts. 39 a 52 (Capítulo III).", "cat": "Estructura"}, {"q": "¿Puede ser privado de su nacionalidad un español de origen?", "a": "No (art. 11.2 CE).", "cat": "Españoles y extranjeros"}, {"q": "¿Qué derecho reservado a los españoles pueden ejercer los extranjeros por reciprocidad?", "a": "El sufragio activo y pasivo en las elecciones municipales (art. 13.2 CE).", "cat": "Españoles y extranjeros"}, {"q": "¿Qué delitos quedan excluidos de la extradición?", "a": "Los delitos políticos, sin considerar como tales los actos de terrorismo (art. 13.3 CE).", "cat": "Españoles y extranjeros"}, {"q": "Plazo máximo de la detención preventiva", "a": "72 horas; antes, libertad o disposición judicial (art. 17.2 CE).", "cat": "Derechos"}, {"q": "¿Qué tres excepciones permiten entrar en un domicilio?", "a": "Consentimiento del titular, resolución judicial o flagrante delito (art. 18.2 CE).", "cat": "Derechos"}, {"q": "¿Quién puede acordar el secuestro de publicaciones?", "a": "Solo una resolución judicial (art. 20.5 CE).", "cat": "Derechos"}, {"q": "¿Necesita autorización el derecho de reunión?", "a": "No. Las reuniones en lugares de tránsito público y las manifestaciones requieren solo comunicación previa (art. 21 CE).", "cat": "Derechos"}, {"q": "¿Qué asociaciones prohíbe expresamente el art. 22 CE?", "a": "Las secretas y las de carácter paramilitar.", "cat": "Derechos"}, {"q": "¿Puede la Administración civil imponer sanciones privativas de libertad?", "a": "No, ni directa ni subsidiariamente (art. 25.3 CE).", "cat": "Derechos"}, {"q": "¿Dónde prohíbe el art. 26 los Tribunales de Honor?", "a": "En el ámbito de la Administración civil y de las organizaciones profesionales.", "cat": "Derechos"}, {"q": "¿Cómo pueden ejercer el derecho de petición los militares?", "a": "Solo individualmente y con arreglo a su legislación específica (art. 29.2 CE).", "cat": "Derechos"}, {"q": "¿Qué derecho fuera de la Sección 1.ª tiene recurso de amparo además del art. 14?", "a": "La objeción de conciencia del art. 30 (art. 53.2 CE).", "cat": "Garantías"}, {"q": "¿Qué garantías da el art. 53.1 a los derechos del Capítulo II?", "a": "Vinculan a todos los poderes públicos, reserva de ley con respeto al contenido esencial y tutela por recurso de inconstitucionalidad (art. 161.1.a).", "cat": "Garantías"}, {"q": "¿Qué valor tienen los principios rectores (art. 53.3)?", "a": "Informan la legislación positiva, la práctica judicial y la actuación de los poderes públicos; solo se alegan ante la jurisdicción ordinaria según las leyes que los desarrollen.", "cat": "Garantías"}, {"q": "¿Pueden los decretos-leyes afectar a derechos del Título I?", "a": "No, a ninguno: el art. 86.1 se refiere a todo el Título I.", "cat": "Garantías"}, {"q": "¿Qué partes del Título I exigen la reforma agravada del art. 168?", "a": "Solo el Capítulo II, Sección 1.ª (arts. 15-29). El art. 14 se reforma por el procedimiento ordinario.", "cat": "Garantías"}, {"q": "¿Quiénes están legitimados para el recurso de amparo?", "a": "Toda persona natural o jurídica con interés legítimo, el Defensor del Pueblo y el Ministerio Fiscal (art. 162.1.b CE).", "cat": "Garantías"}, {"q": "¿Qué derechos pueden suspenderse en los estados de excepción o sitio?", "a": "Arts. 17; 18.2 y 3; 19; 20.1 a) y d) y 20.5; 21; 28.2 y 37.2 CE.", "cat": "Suspensión"}, {"q": "¿Qué apartado no puede suspenderse en el estado de excepción?", "a": "El art. 17.3 (derechos del detenido); solo puede suspenderse en el estado de sitio.", "cat": "Suspensión"}, {"q": "¿Qué derechos admiten suspensión individual (art. 55.2)?", "a": "Los de los arts. 17.2, 18.2 y 18.3, para investigaciones sobre bandas armadas o terroristas.", "cat": "Suspensión"}, {"q": "¿Permite el estado de alarma suspender derechos?", "a": "No. Solo cabe limitarlos (art. 11 LO 4/1981); suspender solo es posible en excepción y sitio (art. 55.1 CE).", "cat": "Suspensión"}, {"q": "¿Quién declara el estado de alarma y por cuánto tiempo?", "a": "El Gobierno, por decreto acordado en Consejo de Ministros, por un máximo de 15 días; la prórroga requiere autorización del Congreso.", "cat": "Suspensión"}, {"q": "¿Quién puede solicitar el estado de alarma si afecta solo a una Comunidad Autónoma?", "a": "Su Presidente, que lo solicita al Gobierno (art. 5 LO 4/1981).", "cat": "Suspensión"}, {"q": "Duración máxima del estado de excepción", "a": "30 días, prorrogables por otros 30 con los mismos requisitos (art. 116.3 CE).", "cat": "Suspensión"}, {"q": "¿Qué debe contener la solicitud de autorización del estado de excepción?", "a": "Efectos y derechos a suspender, medidas, ámbito territorial y duración (máx. 30 días) y cuantía máxima de las sanciones pecuniarias (art. 13.2 LO 4/1981).", "cat": "Suspensión"}, {"q": "Duración máxima de la detención en el estado de excepción", "a": "10 días, comunicada al juez en 24 horas (art. 16 LO 4/1981).", "cat": "Suspensión"}, {"q": "¿Cómo se declara el estado de sitio?", "a": "Por mayoría absoluta del Congreso, a propuesta exclusiva del Gobierno, que determina ámbito, duración y condiciones (art. 116.4 CE).", "cat": "Suspensión"}, {"q": "¿Quién ejecuta las medidas en el estado de sitio?", "a": "La Autoridad militar designada por el Gobierno, bajo su dirección, mediante bandos (arts. 33-34 LO 4/1981).", "cat": "Suspensión"}, {"q": "¿Qué no puede hacerse mientras esté declarado alguno de los estados del art. 116?", "a": "Disolver el Congreso (art. 116.5) ni iniciar la reforma constitucional (art. 169).", "cat": "Suspensión"}, {"q": "¿Qué declaró la STC 148/2021?", "a": "La inconstitucionalidad del art. 7.1, 3 y 5 del RD 463/2020, porque el confinamiento suspendía (no limitaba) la libertad de circulación del art. 19 CE.", "cat": "Jurisprudencia"}, {"q": "¿Qué rango tiene el decreto de declaración del estado de alarma según la STC 83/2016?", "a": "Rango o valor de ley; su control corresponde al Tribunal Constitucional.", "cat": "Jurisprudencia"}, {"q": "¿Cómo define el art. 54 CE al Defensor del Pueblo?", "a": "Alto comisionado de las Cortes Generales, designado por éstas para la defensa de los derechos del Título I, que supervisa la actividad de la Administración dando cuenta a las Cortes.", "cat": "Defensor"}, {"q": "Mandato del Defensor del Pueblo", "a": "5 años (art. 2.1 LO 3/1981).", "cat": "Defensor"}, {"q": "Mayorías para elegir al Defensor del Pueblo", "a": "3/5 del Congreso y ratificación por 3/5 del Senado en 20 días; si no se alcanzan, tras nuevas propuestas basta 3/5 del Congreso + mayoría absoluta del Senado.", "cat": "Defensor"}, {"q": "¿Quién declara la vacante del Defensor en caso de muerte, renuncia o expiración del mandato?", "a": "El Presidente del Congreso. En los demás casos, 3/5 de cada Cámara, previa audiencia del interesado.", "cat": "Defensor"}, {"q": "¿Qué órgano decide sobre la inculpación o procesamiento del Defensor?", "a": "Exclusivamente la Sala de lo Penal del Tribunal Supremo (art. 6.3 LO 3/1981).", "cat": "Defensor"}, {"q": "Plazo para presentar una queja ante el Defensor", "a": "Un año desde que se tuvo conocimiento de los hechos (art. 15 LO 3/1981).", "cat": "Defensor"}, {"q": "¿Qué quejas rechaza siempre el Defensor?", "a": "Las anónimas (art. 17.3 LO 3/1981).", "cat": "Defensor"}, {"q": "¿Quién no puede presentar quejas ante el Defensor?", "a": "Ninguna autoridad administrativa en asuntos de su competencia (art. 10.3 LO 3/1981).", "cat": "Defensor"}, {"q": "¿Qué hace el Defensor con las quejas sobre la Administración de Justicia?", "a": "Las remite al Ministerio Fiscal o al Consejo General del Poder Judicial (art. 13 LO 3/1981).", "cat": "Defensor"}, {"q": "¿Puede el Defensor anular actos administrativos?", "a": "No. Puede sugerir la modificación de criterios o de normas y formular advertencias, recomendaciones, recordatorios y sugerencias (arts. 28 y 30).", "cat": "Defensor"}, {"q": "Plazo de respuesta a las recomendaciones del Defensor", "a": "Por escrito, en término no superior a un mes (art. 30.1 LO 3/1981).", "cat": "Defensor"}, {"q": "¿De dónde sale la dotación económica del Defensor del Pueblo?", "a": "De una partida de los Presupuestos de las Cortes Generales (art. 37 LO 3/1981).", "cat": "Defensor"}], "questions": [{"q": "Según el art. 10.2 CE, las normas relativas a los derechos fundamentales se interpretarán de conformidad con:", "o": ["La jurisprudencia del Tribunal Supremo", "La Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales ratificados por España", "El Convenio Europeo de Derechos Humanos exclusivamente", "La Carta de Derechos Fundamentales de la UE exclusivamente"], "c": 1, "e": "Art. 10.2 CE."}, {"q": "La Sección 1.ª del Capítulo II del Título I comprende los artículos:", "o": ["14 a 29", "15 a 29", "15 a 38", "14 a 38"], "c": 1, "e": "La Sección 1.ª va del 15 al 29; el art. 14 está en el Capítulo II, pero fuera de las secciones."}, {"q": "Según el art. 13.2 CE, los extranjeros pueden ser titulares, por tratado o ley y atendiendo a la reciprocidad, del derecho de:", "o": ["Sufragio activo y pasivo en las elecciones municipales", "Sufragio activo en las elecciones generales", "Acceso a cargos públicos en las CC. AA.", "Sufragio pasivo en las elecciones autonómicas"], "c": 0, "e": "Art. 13.2 CE, en la redacción dada por la reforma de 1992."}, {"q": "La detención preventiva no podrá durar, en todo caso, más de:", "o": ["24 horas", "48 horas", "72 horas", "10 días"], "c": 2, "e": "Art. 17.2 CE."}, {"q": "La CE garantiza el secreto de las comunicaciones salvo:", "o": ["Consentimiento del titular", "Resolución judicial", "Flagrante delito", "Orden del Ministerio del Interior"], "c": 1, "e": "Art. 18.3 CE. El flagrante delito es una excepción a la inviolabilidad del domicilio (18.2), no al secreto de las comunicaciones."}, {"q": "El secuestro de publicaciones, grabaciones y otros medios de información solo podrá acordarse:", "o": ["Por el Gobierno", "Por resolución judicial", "Por la autoridad gubernativa en caso de urgencia", "Por el Ministerio Fiscal"], "c": 1, "e": "Art. 20.5 CE."}, {"q": "Según el art. 21 CE, las reuniones en lugares de tránsito público y manifestaciones requieren:", "o": ["Autorización previa de la autoridad", "Comunicación previa a la autoridad", "Autorización judicial", "No requieren ningún trámite"], "c": 1, "e": "Art. 21.2 CE; el derecho de reunión no necesita autorización previa (21.1)."}, {"q": "Las asociaciones solo podrán ser disueltas o suspendidas en sus actividades:", "o": ["Por resolución administrativa motivada", "Por resolución judicial motivada", "Por acuerdo del Consejo de Ministros", "Por la autoridad gubernativa en estado de alarma"], "c": 1, "e": "Art. 22.4 CE."}, {"q": "¿Qué asociaciones prohíbe expresamente el art. 22.5 CE?", "o": ["Las no inscritas en el registro", "Las secretas y las de carácter paramilitar", "Las de fines políticos", "Las de ámbito internacional"], "c": 1, "e": "Art. 22.5 CE. La inscripción es solo a efectos de publicidad (22.3)."}, {"q": "La Administración civil podrá imponer sanciones que impliquen privación de libertad:", "o": ["Solo de forma subsidiaria", "Nunca, ni directa ni subsidiariamente", "Solo en estado de excepción", "Solo por infracciones muy graves"], "c": 1, "e": "Art. 25.3 CE."}, {"q": "Los Tribunales de Honor están prohibidos:", "o": ["En todo el ámbito público y privado", "En el ámbito de la Administración civil y de las organizaciones profesionales", "Solo en las Fuerzas Armadas", "Solo en los colegios profesionales"], "c": 1, "e": "Art. 26 CE."}, {"q": "Los miembros de las Fuerzas o Institutos armados pueden ejercer el derecho de petición:", "o": ["Individual y colectivamente", "Solo individualmente y con arreglo a su legislación específica", "Solo colectivamente a través de sus asociaciones", "No pueden ejercerlo"], "c": 1, "e": "Art. 29.2 CE."}, {"q": "Además del art. 14 y la Sección 1.ª, el recurso de amparo es aplicable a:", "o": ["El derecho de propiedad (art. 33)", "La objeción de conciencia (art. 30)", "El derecho a la vivienda (art. 47)", "El derecho al trabajo (art. 35)"], "c": 1, "e": "Art. 53.2 CE."}, {"q": "La tutela de los derechos del art. 14 y de la Sección 1.ª ante los tribunales ordinarios se basa en los principios de:", "o": ["Oralidad y concentración", "Preferencia y sumariedad", "Gratuidad y celeridad", "Inmediación y publicidad"], "c": 1, "e": "Art. 53.2 CE."}, {"q": "Según el art. 53.3 CE, los principios rectores de la política social y económica:", "o": ["Son directamente exigibles en amparo", "Solo pueden alegarse ante la jurisdicción ordinaria de acuerdo con las leyes que los desarrollen", "Vinculan a los poderes públicos con reserva de ley orgánica", "No pueden ser alegados en ningún caso"], "c": 1, "e": "Art. 53.3 CE."}, {"q": "Los decretos-leyes no podrán afectar a los derechos, deberes y libertades de los ciudadanos regulados en:", "o": ["La Sección 1.ª del Capítulo II", "El Capítulo II del Título I", "El Título I", "Los arts. 14 a 29"], "c": 2, "e": "Art. 86.1 CE: todo el Título I."}, {"q": "La reforma constitucional que afecte al art. 14 CE se tramitará por:", "o": ["El procedimiento agravado del art. 168", "El procedimiento ordinario del art. 167", "Ley orgánica", "Referéndum obligatorio en todo caso"], "c": 1, "e": "El art. 168 protege el Capítulo II, Sección 1.ª, del que el art. 14 no forma parte."}, {"q": "Están legitimados para interponer el recurso de amparo:", "o": ["Solo las personas físicas afectadas", "Toda persona natural o jurídica con interés legítimo, el Defensor del Pueblo y el Ministerio Fiscal", "50 Diputados o 50 Senadores", "El Presidente del Gobierno y el Defensor del Pueblo"], "c": 1, "e": "Art. 162.1.b CE."}, {"q": "¿Cuál de estos derechos NO puede ser suspendido en el estado de excepción según el art. 55.1 CE?", "o": ["La inviolabilidad del domicilio (art. 18.2)", "La libertad de circulación (art. 19)", "Los derechos del detenido del art. 17.3", "El derecho de huelga (art. 28.2)"], "c": 2, "e": "Art. 55.1 CE: el 17.3 se exceptúa en el estado de excepción; puede suspenderse en el de sitio (art. 32.3 LO 4/1981)."}, {"q": "¿Cuál de los siguientes derechos NO figura entre los suspendibles del art. 55.1 CE?", "o": ["Derecho de reunión (art. 21)", "Derecho de asociación (art. 22)", "Secreto de las comunicaciones (art. 18.3)", "Medidas de conflicto colectivo (art. 37.2)"], "c": 1, "e": "Art. 55.1 CE: la asociación (art. 22) no es suspendible."}, {"q": "La suspensión individual de derechos del art. 55.2 CE puede afectar a los artículos:", "o": ["17.2, 18.2 y 18.3", "17, 19 y 21", "18.1, 20 y 21", "17.3, 24 y 25"], "c": 0, "e": "Art. 55.2 CE, para investigaciones sobre bandas armadas o elementos terroristas."}, {"q": "El estado de alarma se declara:", "o": ["Por el Congreso por mayoría absoluta", "Por el Gobierno mediante decreto acordado en Consejo de Ministros", "Por el Gobierno previa autorización del Congreso", "Por el Rey a propuesta del Presidente del Gobierno"], "c": 1, "e": "Art. 116.2 CE; art. 6 LO 4/1981."}, {"q": "El plazo máximo de duración del estado de alarma, sin prórroga, es de:", "o": ["10 días", "15 días", "30 días", "60 días"], "c": 1, "e": "Art. 116.2 CE; art. 6.2 LO 4/1981."}, {"q": "¿Cuál NO es un supuesto de estado de alarma según el art. 4 de la LO 4/1981?", "o": ["Crisis sanitarias, como epidemias", "Desabastecimiento de productos de primera necesidad", "Grave alteración del orden público", "Catástrofes como terremotos o inundaciones"], "c": 2, "e": "La grave alteración del orden público es el presupuesto del estado de excepción (art. 13)."}, {"q": "En el estado de alarma, la autoridad competente es:", "o": ["El Ministro del Interior", "El Gobierno o, por delegación, el Presidente de la CA si afecta solo a su territorio", "La Autoridad militar", "El Delegado del Gobierno"], "c": 1, "e": "Art. 7 LO 4/1981."}, {"q": "Entre las medidas del estado de alarma (art. 11 LO 4/1981) NO está:", "o": ["Practicar requisas temporales de bienes", "Ocupar transitoriamente domicilios privados", "Limitar la circulación de personas en horas y lugares determinados", "Racionar el consumo de artículos de primera necesidad"], "c": 1, "e": "Art. 11.c): se exceptúan expresamente los domicilios privados."}, {"q": "El estado de excepción se declara:", "o": ["Por el Gobierno, previa autorización del Congreso de los Diputados", "Por el Congreso por mayoría absoluta", "Por el Gobierno, dando cuenta al Congreso", "Por las Cortes Generales en sesión conjunta"], "c": 0, "e": "Art. 116.3 CE; arts. 13-14 LO 4/1981."}, {"q": "La duración del estado de excepción no podrá exceder de:", "o": ["15 días prorrogables", "30 días, prorrogables por otro plazo igual", "60 días improrrogables", "90 días"], "c": 1, "e": "Art. 116.3 CE; arts. 13.2.c y 15.3 LO 4/1981."}, {"q": "Durante el estado de excepción, la detención acordada por la autoridad gubernativa no podrá exceder de:", "o": ["72 horas", "5 días", "10 días", "30 días"], "c": 2, "e": "Art. 16.1 LO 4/1981; debe comunicarse al juez en 24 horas."}, {"q": "En los registros domiciliarios durante el estado de excepción deben estar presentes, en todo caso:", "o": ["Un juez de instrucción", "Dos vecinos de la casa o de las inmediaciones", "El Ministerio Fiscal", "Un notario"], "c": 1, "e": "Art. 17.3 LO 4/1981."}, {"q": "El estado de sitio es declarado por:", "o": ["El Gobierno, previa autorización del Congreso", "La mayoría absoluta del Congreso, a propuesta exclusiva del Gobierno", "Las Cortes Generales por mayoría de 3/5", "El Rey como mando supremo de las Fuerzas Armadas"], "c": 1, "e": "Art. 116.4 CE; art. 32 LO 4/1981."}, {"q": "Mientras esté declarado alguno de los estados del art. 116 CE:", "o"
