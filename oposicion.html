<!-- Tema antes del primer pintado. Comparte la clave con Niblo: si alli esta
     en oscuro, aqui tambien. -->
<script>
(function(){
  try {
    var t = localStorage.getItem('recetas:tema');
    if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t);
  } catch (e) {}
})();
</script>

<link rel="preload" href="manrope.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family:"Manrope"; font-style:normal; font-weight:300 800; font-display:swap;
  src:url("manrope.woff2") format("woff2");
}
</style>

<style>
/* ========================================================================
   Sistema de diseño — el de Viajes: paleta slate/azul, Manrope única,
   tarjetas redondeadas, chips en pastilla y cabecera translúcida.
   ====================================================================== */
:root {
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.03);
  --sh-2:0 2px 10px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-3:0 12px 28px rgba(0,0,0,.10);
  --font-ui:'Manrope', system-ui, -apple-system, sans-serif;
  --font-titulo:'Manrope', system-ui, -apple-system, sans-serif;
  --font-code:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root, :root[data-tema="claro"] {
  --bg:#f8fafc; --bg-elev:#fff; --bg-soft:#f1f5f9; --bg-input:#fff;
  --text:#0f172a; --text-muted:#64748b; --text-inv:#fff;
  --line:#e2e8f0; --line-soft:#f1f5f9;
  --accent:#2563eb; --accent-2:#06b6d4; --accent-bg:#dbeafe;
  --focus:#2563eb; --danger:#dc2626;
  /* Semáforo del PDF: verde (solo BOE + estable), ámbar (solo BOE + revisar),
     rojo (actualizar), lila (sin correlato en el TAC) */
  --ok:#059669; --ok-bg:#dcfce7;
  --warn:#b45309; --warn-bg:#fef3c7;
  --hot:#b91c1c; --hot-bg:#fee2e2;
  --lila:#7c3aed; --lila-bg:#ede9fe;
  --azul:#1d4ed8; --azul-bg:#dbeafe;
}
:root[data-tema="oscuro"] {
  --bg:#0b1220; --bg-elev:#111a2e; --bg-soft:#1e293b; --bg-input:#111a2e;
  --text:#f1f5f9; --text-muted:#94a3b8; --text-inv:#0b1220;
  --line:#334155; --line-soft:#1e293b;
  --accent:#60a5fa; --accent-2:#22d3ee; --accent-bg:#1e3a5f;
  --focus:#93c5fd; --danger:#f87171;
  --ok:#34d399; --ok-bg:#064e3b;
  --warn:#fbbf24; --warn-bg:#4a3510;
  --hot:#fca5a5; --hot-bg:#4c1d1d;
  --lila:#c4b5fd; --lila-bg:#2e1f5e;
  --azul:#93c5fd; --azul-bg:#1e3a5f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]) {
    --bg:#0b1220; --bg-elev:#111a2e; --bg-soft:#1e293b; --bg-input:#111a2e;
    --text:#f1f5f9; --text-muted:#94a3b8; --text-inv:#0b1220;
    --line:#334155; --line-soft:#1e293b;
    --accent:#60a5fa; --accent-2:#22d3ee; --accent-bg:#1e3a5f;
    --focus:#93c5fd; --danger:#f87171;
    --ok:#34d399; --ok-bg:#064e3b;
    --warn:#fbbf24; --warn-bg:#4a3510;
    --hot:#fca5a5; --hot-bg:#4c1d1d;
    --lila:#c4b5fd; --lila-bg:#2e1f5e;
    --azul:#93c5fd; --azul-bg:#1e3a5f;
  }
}

/* ---- Color por bloque (solo el acento: el resto del sistema no cambia) -- */
[data-b="B1"] { --accent:#b45309; --accent-2:#f59e0b; --accent-bg:#fef3c7; }
[data-b="B2"] { --accent:#2563eb; --accent-2:#60a5fa; --accent-bg:#dbeafe; }
[data-b="B3"] { --accent:#15803d; --accent-2:#22c55e; --accent-bg:#dcfce7; }
[data-b="B4"] { --accent:#c2410c; --accent-2:#fb923c; --accent-bg:#ffedd5; }
[data-b="B5"] { --accent:#0e7490; --accent-2:#22d3ee; --accent-bg:#cffafe; }
[data-b="B6"] { --accent:#a21caf; --accent-2:#d946ef; --accent-bg:#fae8ff; }
:root[data-tema="oscuro"] [data-b="B1"] { --accent:#fbbf24; --accent-2:#fcd34d; --accent-bg:#422c0b; --on-accent:#111827; }
:root[data-tema="oscuro"] [data-b="B2"] { --accent:#60a5fa; --accent-2:#93c5fd; --accent-bg:#1e3a5f; --on-accent:#111827; }
:root[data-tema="oscuro"] [data-b="B3"] { --accent:#4ade80; --accent-2:#86efac; --accent-bg:#14361f; --on-accent:#111827; }
:root[data-tema="oscuro"] [data-b="B4"] { --accent:#fb923c; --accent-2:#fdba74; --accent-bg:#45260f; --on-accent:#111827; }
:root[data-tema="oscuro"] [data-b="B5"] { --accent:#22d3ee; --accent-2:#67e8f9; --accent-bg:#123b45; --on-accent:#111827; }
:root[data-tema="oscuro"] [data-b="B6"] { --accent:#e879f9; --accent-2:#f0abfc; --accent-bg:#3d1645; --on-accent:#111827; }
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]) [data-b="B1"] { --accent:#fbbf24; --accent-2:#fcd34d; --accent-bg:#422c0b; --on-accent:#111827; }
  :root:not([data-tema]) [data-b="B2"] { --accent:#60a5fa; --accent-2:#93c5fd; --accent-bg:#1e3a5f; --on-accent:#111827; }
  :root:not([data-tema]) [data-b="B3"] { --accent:#4ade80; --accent-2:#86efac; --accent-bg:#14361f; --on-accent:#111827; }
  :root:not([data-tema]) [data-b="B4"] { --accent:#fb923c; --accent-2:#fdba74; --accent-bg:#45260f; --on-accent:#111827; }
  :root:not([data-tema]) [data-b="B5"] { --accent:#22d3ee; --accent-2:#67e8f9; --accent-bg:#123b45; --on-accent:#111827; }
  :root:not([data-tema]) [data-b="B6"] { --accent:#e879f9; --accent-2:#f0abfc; --accent-bg:#3d1645; --on-accent:#111827; }
}

* { box-sizing:border-box; }
html, body { margin:0; padding:0; overflow-x:clip; }
html { -webkit-text-size-adjust:100%; }
body {
  font-family:var(--font-ui); background:var(--bg); color:var(--text);
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  padding-bottom:env(safe-area-inset-bottom);
}
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; }
.num { font-feature-settings:"tnum","ss01"; }
.muted { color:var(--text-muted); }
[hidden] { display:none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* ---- Cabecera ---------------------------------------------------------- */
header.topbar {
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line-soft);
  padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top));
}
.topbar-inner { max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:10px; }
.topbar-title {
  font-weight:700; letter-spacing:-.02em; font-size:17px;
  min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.topbar-spacer { flex:1; }
.icon-btn {
  border:1px solid var(--line); background:var(--bg-elev); color:var(--text);
  width:38px; height:38px; border-radius:var(--r-md); flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
  text-decoration:none;
}
.icon-btn:hover { transform:translateY(-1px); box-shadow:var(--sh-2); text-decoration:none; }
.icon-btn svg { width:18px; height:18px; }
.icon-btn.girando svg { animation:girar 1s linear infinite; }
@keyframes girar { to { transform:rotate(360deg); } }

main {
  max-width:1100px; margin:0 auto; padding:16px 16px 64px; width:100%;
  overflow-x:clip; animation:fadeIn .18s var(--ease);
}
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

/* ---- Tipografía de vista ---------------------------------------------- */
.titulo-grande {
  font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1.12;
  margin:10px 0 6px; padding-bottom:.08em;
  background-image:linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, #000 30%) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  overflow-wrap:break-word;
}
:root[data-tema="oscuro"] .titulo-grande {
  background-image:linear-gradient(135deg, color-mix(in srgb, var(--accent) 80%, #fff 20%) 0%, var(--accent) 100%);
}
@media (min-width:720px) { .titulo-grande { font-size:46px; letter-spacing:-.035em; } }
.view-sub { color:var(--text-muted); font-size:14px; margin:0 0 20px; }
h2.section-title { font-weight:700; letter-spacing:-.02em; font-size:20px; margin:32px 0 12px; }
h3.card-title { font-size:16px; font-weight:700; letter-spacing:-.01em; margin:0 0 10px; }

/* ---- Botones ----------------------------------------------------------- */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:42px; padding:0 18px; border:1px solid var(--line); background:var(--bg-elev); color:var(--text);
  border-radius:var(--r-pill); font-weight:600; font-size:14px; letter-spacing:-.01em;
  cursor:pointer; text-decoration:none;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
}
.btn:hover { transform:translateY(-1px); box-shadow:var(--sh-2); text-decoration:none; }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
.btn-primary {
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:var(--on-accent, #fff); border:none;
  box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 28%, transparent);
}
.btn-sm { height:32px; padding:0 12px; font-size:13px; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; }

/* ---- Chips y segmentado ------------------------------------------------ */
.chip-row {
  display:flex; gap:8px; overflow-x:auto; padding:2px; margin:0 -2px 16px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.chip-row::-webkit-scrollbar { display:none; }
.chip-row.wrap { flex-wrap:wrap; overflow:visible; }
.chip {
  flex-shrink:0; display:inline-flex; align-items:center; gap:7px;
  height:34px; padding:0 14px; background:var(--bg-elev); border:1px solid var(--line); color:var(--text-muted);
  border-radius:var(--r-pill); font-size:13px; font-weight:600; cursor:pointer;
  transition:all .18s var(--ease); white-space:nowrap;
}
.chip:hover { color:var(--text); }
.chip.active {
  background:var(--accent); border-color:var(--accent); color:var(--on-accent, #fff);
  box-shadow:0 4px 12px color-mix(in srgb, var(--accent) 22%, transparent);
}
.chip .badge {
  font-size:11px; font-weight:600; font-feature-settings:"tnum";
  background:color-mix(in srgb, var(--text) 8%, transparent); padding:2px 7px; border-radius:var(--r-pill);
}
.chip.active .badge { background:rgba(255,255,255,.22); color:var(--on-accent, #fff); }
.chip.peq { height:28px; padding:0 11px; font-size:12px; }

.seg {
  display:flex; gap:2px; padding:3px; margin:0 0 20px;
  background:var(--bg-soft); border:1px solid var(--line); border-radius:var(--r-pill);
}
.seg button {
  flex:1; min-width:0; border:none; background:transparent; color:var(--text-muted);
  font-size:14px; font-weight:600; min-height:40px; border-radius:var(--r-pill); cursor:pointer;
  transition:background .15s, color .15s;
}
.seg button.on { background:var(--bg-elev); color:var(--text); box-shadow:var(--sh-1); }

/* ---- Etiquetas (vigencia, fuente, bloque) ------------------------------ */
.tag {
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  padding:3px 9px; border-radius:var(--r-pill); line-height:1.3;
  background:var(--bg-soft); color:var(--text-muted);
}
.tag.ok   { background:var(--ok-bg);   color:var(--ok); }
.tag.warn { background:var(--warn-bg); color:var(--warn); }
.tag.hot  { background:var(--hot-bg);  color:var(--hot); }
.tag.lila { background:var(--lila-bg); color:var(--lila); }
.tag.azul { background:var(--azul-bg); color:var(--azul); }
.tag.acc  { background:var(--accent-bg); color:var(--accent); }
.tags { display:flex; flex-wrap:wrap; gap:6px; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.hot { background:var(--hot); }

/* ---- Tarjetas ---------------------------------------------------------- */
.card {
  background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--sh-1); padding:20px; min-width:0;
}
.card + .card { margin-top:14px; }
/* En rejilla el hueco lo pone gap, no el margen de apilado */
.grid > .card, .ficha > .card { margin-top:0; }
.card.interactive { cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s var(--ease); }
.card.interactive:hover { transform:translateY(-2px); box-shadow:var(--sh-2); }

/* Hero del inicio */
.hero { padding:22px 20px; }
.prog-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.prog-row .lbl { font-size:13px; font-weight:600; color:var(--text-muted); }
.bar { flex:1; min-width:160px; height:8px; background:var(--bg-soft); border-radius:99px; overflow:hidden; }
.bar > div { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:99px; transition:width .4s var(--ease); }
.prog-row .pct { font-weight:800; font-size:18px; color:var(--accent); font-feature-settings:"tnum"; }
.kpis { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-top:16px; }
@media (min-width:720px) { .kpis { grid-template-columns:repeat(4, minmax(0,1fr)); } }
.kpi { background:var(--bg-soft); border-radius:var(--r-md); padding:12px 14px; min-width:0; }
.kpi .k { font-size:11.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; display:flex; align-items:center; gap:6px; }
.kpi .v { font-size:24px; font-weight:800; letter-spacing:-.02em; font-feature-settings:"tnum"; }
.kpi .s { font-size:12px; color:var(--text-muted); }

/* Rejillas */
.grid { display:grid; gap:16px; grid-template-columns:minmax(0,1fr); }
@media (min-width:720px) { .grid.g2 { grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (min-width:720px) { .grid.g3 { grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (min-width:1000px) { .grid.g3 { grid-template-columns:repeat(3, minmax(0,1fr)); } }

/* Tarjeta de bloque */
.bloque-rom {
  width:48px; height:48px; border-radius:var(--r-md); flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--accent-bg); color:var(--accent); font-weight:800; font-size:18px; letter-spacing:-.02em;
}
.bloque-sub { font-size:12.5px; color:var(--text-muted); font-weight:600; }

/* Cabecera de bloque */
.bloque-head { display:flex; align-items:center; gap:14px; margin:6px 0 18px; }
.bloque-head .bloque-rom { width:56px; height:56px; font-size:20px; }
.bloque-head h1 { margin:0; font-size:24px; font-weight:700; letter-spacing:-.025em; line-height:1.2; }
@media (min-width:720px) { .bloque-head h1 { font-size:30px; } }

/* Tarjeta de tema */
.prog-mini { display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-muted); font-weight:600; }

/* Detalle del tema */
.ficha { display:grid; gap:14px; grid-template-columns:minmax(0,1fr); }
@media (min-width:860px) { .ficha { grid-template-columns:repeat(2, minmax(0,1fr)); } .ficha .ancho { grid-column:1 / -1; } }
.ficha-k {
  font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-muted); margin:0 0 8px; display:flex; align-items:center; gap:8px;
}
.ficha-v { font-size:15px; line-height:1.55; overflow-wrap:break-word; }
.ficha-v a { font-weight:600; }
.verif {
  font-size:11px; font-weight:700; color:var(--warn); background:var(--warn-bg);
  padding:1px 6px; border-radius:var(--r-pill); white-space:nowrap; cursor:help;
}
.nota-destacada { border-left:4px solid var(--accent); background:color-mix(in srgb, var(--accent-bg) 45%, var(--bg-elev)); }
.secciones { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.secciones button {
  width:100%; text-align:left; border:none; background:transparent; cursor:pointer;
  padding:9px 10px; border-radius:var(--r-sm); font-size:14px; color:var(--text);
}
.secciones button:hover { background:var(--bg-soft); }
.secciones .sub { padding-left:26px; color:var(--text-muted); font-size:13.5px; }

/* Zona de carga */
.drop {
  border:2px dashed var(--line); border-radius:var(--r-lg); padding:26px 18px; text-align:center;
  background:var(--bg-elev); cursor:pointer; transition:border-color .18s, background .18s;
}
.drop:hover, .drop.encima { border-color:var(--accent); background:color-mix(in srgb, var(--accent-bg) 40%, var(--bg-elev)); }
.drop .ico { font-size:28px; }
.drop .t { font-weight:700; margin-top:6px; }
.drop .s { font-size:13px; color:var(--text-muted); margin-top:4px; }
code, .code { font-family:var(--font-code); font-size:.86em; background:var(--bg-soft); padding:1px 6px; border-radius:6px; }
.cargados { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; }
.cargado {
  display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 11px;
  background:var(--bg-soft); border:1px solid var(--line); border-radius:var(--r-pill); font-size:12.5px; font-weight:600;
}
.cargado button {
  width:22px; height:22px; border-radius:50%; border:none; cursor:pointer;
  background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger); font-weight:700; line-height:1;
}

/* ---- Hub: búsqueda, cronología, glosario, flashcards, test, progreso ---- */
.toolbar { margin-bottom:12px; }
.input {
  width:100%; min-width:0; border:1px solid var(--line); background:var(--bg-input); color:var(--text);
  border-radius:var(--r-md); padding:11px 14px; font-size:16px;
  transition:border .18s, box-shadow .18s;
}
.input:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.stats-line { font-size:12.5px; color:var(--text-muted); font-weight:600; margin:0 0 10px; }
.res {
  padding:12px 14px; border:1px solid var(--line-soft); border-radius:var(--r-md);
  background:var(--bg-elev); margin-bottom:8px; cursor:pointer; transition:border-color .15s, box-shadow .15s;
}
.res:hover { border-color:var(--line); box-shadow:var(--sh-1); }
.res-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.res-tit { font-weight:700; font-size:14.5px; letter-spacing:-.01em; }
.res-txt { font-size:13.5px; color:var(--text-muted); margin-top:4px; line-height:1.5; }
mark { background:color-mix(in srgb, #facc15 45%, transparent); color:inherit; border-radius:3px; padding:0 1px; }

.tl { position:relative; padding-left:18px; }
.tl::before { content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line); border-radius:2px; }
.tl-item { position:relative; padding:10px 12px; margin-bottom:8px; border-radius:var(--r-md); background:var(--bg-elev); border:1px solid var(--line-soft); cursor:pointer; }
.tl-item::before { content:""; position:absolute; left:-17px; top:16px; width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--bg); }
.tl-y { font-weight:800; color:var(--accent); font-feature-settings:"tnum"; margin-right:8px; }
.tl-cons { font-size:13px; color:var(--text-muted); margin-top:3px; }

.letras { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px; }
.letra {
  min-width:32px; height:32px; padding:0 8px; border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--bg-elev); font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-muted);
}
.letra.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.letra:disabled { opacity:.3; cursor:default; }

.fc-ctrl { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:12px; font-size:13px; color:var(--text-muted); }
.fc-ctrl b { color:var(--text); font-feature-settings:"tnum"; }
.fc { perspective:1200px; cursor:pointer; margin:6px 0 14px; }
.fc-in { position:relative; min-height:230px; transition:transform .5s var(--ease); transform-style:preserve-3d; }
.fc.volteada .fc-in { transform:rotateY(180deg); }
.fc-cara {
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:var(--r-lg); padding:24px 22px; display:flex; flex-direction:column; justify-content:center; gap:10px;
  border:1px solid var(--line); background:var(--bg-elev); box-shadow:var(--sh-2); overflow:auto;
}
.fc-cara.atras { transform:rotateY(180deg); background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border:none; }
.fc-q { font-size:19px; font-weight:700; letter-spacing:-.015em; line-height:1.35; }
.fc-a { font-size:16px; line-height:1.55; }
.fc-hint { font-size:12px; color:var(--text-muted); }
.fc-btns { display:flex; gap:10px; }
.fc-btns .btn { flex:1; }
.btn-no { color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn-si { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); }

.test-cfg { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.test-cfg select { border:1px solid var(--line); background:var(--bg-input); border-radius:var(--r-md); padding:8px 12px; font-size:15px; }
.q-meta { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--text-muted); font-weight:600; margin-bottom:8px; }
.q-txt { font-size:17px; font-weight:700; line-height:1.4; letter-spacing:-.01em; margin-bottom:14px; }
.q-opts { display:flex; flex-direction:column; gap:8px; }
.q-opt {
  display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
  padding:12px 14px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--bg-elev);
  cursor:pointer; font-size:15px; line-height:1.4; transition:border-color .15s, background .15s;
}
.q-opt:hover:not(:disabled) { border-color:var(--accent); }
.q-opt .l {
  width:26px; height:26px; border-radius:50%; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
  background:var(--bg-soft); font-weight:800; font-size:13px;
}
.q-opt.bien { border-color:var(--ok); background:var(--ok-bg); }
.q-opt.mal  { border-color:var(--danger); background:var(--hot-bg); }
.q-opt:disabled { cursor:default; }
.q-fb { margin-top:12px; padding:12px 14px; border-radius:var(--r-md); font-size:14px; line-height:1.5; }
.q-fb.bien { background:var(--ok-bg); color:var(--text); }
.q-fb.mal  { background:var(--hot-bg); color:var(--text); }
.resultado { text-align:center; padding:12px 0; }
.resultado .big { font-size:56px; font-weight:800; letter-spacing:-.04em; color:var(--accent); font-feature-settings:"tnum"; }

table.tabla { width:100%; border-collapse:collapse; font-size:13.5px; }
.tabla th { text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); padding:8px 8px; border-bottom:2px solid var(--line); }
.tabla td { padding:9px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
.tabla td.n, .tabla th.n { text-align:right; font-feature-settings:"tnum"; white-space:nowrap; }
.tabla tr.clic { cursor:pointer; }
.tabla tr.clic:hover td { background:var(--bg-soft); }
.tabla-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* Guía */
.guia p, .guia li { font-size:14.5px; line-height:1.6; }
.guia ul { padding-left:20px; margin:8px 0; }
.guia li { margin-bottom:6px; }
.guia .tabla td { font-size:13.5px; }
.lista-temas { display:flex; flex-wrap:wrap; gap:5px; }
.lista-temas button {
  border:1px solid var(--line); background:var(--bg-elev); border-radius:var(--r-pill);
  padding:3px 10px; font-size:12.5px; font-weight:700; cursor:pointer; font-feature-settings:"tnum";
}
.lista-temas button:hover { border-color:var(--accent); color:var(--accent); }
pre.formato {
  font-family:var(--font-code); font-size:12px; line-height:1.5; background:var(--bg-soft);
  border-radius:var(--r-md); padding:14px; overflow-x:auto; margin:8px 0 0;
}

/* Vacío */
.empty { text-align:center; padding:40px 20px; color:var(--text-muted); }
.empty .ico {
  display:inline-flex; align-items:center; justify-content:center; width:60px; height:60px;
  border-radius:50%; background:var(--bg-soft); font-size:26px; margin-bottom:12px;
}
.empty h3 { color:var(--text); font-weight:700; margin:4px 0; font-size:16px; }
.empty p { margin:0 auto; font-size:14px; max-width:340px; }

/* Toast */
.toast-box {
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  z-index:100; pointer-events:none; display:flex; flex-direction:column; gap:8px; align-items:center;
  width:max-content; max-width:calc(100vw - 32px);
}
.toast {
  background:var(--text); color:var(--text-inv); padding:10px 16px; border-radius:var(--r-pill);
  font-size:14px; box-shadow:var(--sh-3); animation:toastIn .25s var(--ease); text-align:center;
}
.toast.error { background:var(--danger); color:#fff; }
@keyframes toastIn { from { transform:translateY(20px); opacity:0; } to { transform:none; opacity:1; } }

/* Editor del tema */
.ed-cab { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:6px 0 16px; }
.ed-tit { margin:2px 0 0; font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.25; }
.ed-acc { display:flex; align-items:center; gap:10px; }
.ed-ayuda { font-size:13px; margin:0 0 12px; line-height:1.5; }
.ed-item { display:flex; flex-direction:column; gap:8px; padding:14px 16px; }
.card.ed-item + .card.ed-item { margin-top:10px; }
.ed-item.sub { margin-left:22px; border-left:3px solid var(--accent-bg); }
.ed-item-cab { display:flex; align-items:center; gap:8px; }
.ed-num { font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); }
.ed-fila { display:flex; gap:8px; flex-wrap:wrap; }
.ed-fila > .input { flex:1 1 220px; }
.ed-fila > .input.peq, .input.peq { flex:0 1 180px; }
select.input { padding:10px 12px; }
textarea.input { resize:vertical; line-height:1.5; font-family:var(--font-ui); }
.ed-ops { display:flex; flex-direction:column; gap:6px; }
.ed-op { display:flex; align-items:center; gap:8px; }
.ed-op input[type=radio] { width:20px; height:20px; accent-color:var(--ok); flex-shrink:0; }
.ed-op .l { font-weight:800; font-size:13px; width:16px; color:var(--text-muted); }
.ed-op .input { flex:1; }
.icon-mini {
  width:30px; height:30px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--bg-elev);
  cursor:pointer; font-size:13px; color:var(--text-muted);
}
.icon-mini:disabled { opacity:.35; cursor:default; }
.icon-mini.peligro { color:var(--danger); }
details.importar { margin-top:14px; }
details.importar summary { cursor:pointer; font-size:13.5px; color:var(--text-muted); font-weight:600; margin-bottom:10px; text-align:center; }

/* Lectura */
.lectura { max-width:760px; }
.lectura h2 { font-size:22px; letter-spacing:-.02em; margin:30px 0 8px; scroll-margin-top:80px; }
.lectura h3 { font-size:18px; margin:22px 0 6px; color:var(--accent); }
.lectura section { scroll-margin-top:80px; }
.lectura p, .lectura li { font-size:16px; line-height:1.7; }
.lectura ul, .lectura ol { padding-left:22px; }
.lectura-indice { margin-bottom:8px; }
.gl-linea { margin:0 0 8px; font-size:14.5px; line-height:1.55; }

/* ===== Página de estudio del tema ===== */
.hero-tema {
  position:relative; overflow:hidden; color:#fff; border-radius:var(--r-lg); padding:28px 24px 24px; margin:8px 0 20px;
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent-2) 55%, transparent) 0%, transparent 55%),
    linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, #0b1220) 0%, color-mix(in srgb, var(--accent) 45%, #0b1220) 100%);
  box-shadow:0 18px 40px color-mix(in srgb, var(--accent) 28%, transparent);
}
:root[data-tema="oscuro"] .hero-tema {
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent) 35%, transparent) 0%, transparent 55%),
    linear-gradient(135deg, color-mix(in srgb, var(--accent) 42%, #0b1220) 0%, color-mix(in srgb, var(--accent) 18%, #0b1220) 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]) .hero-tema {
    background:
      radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent) 35%, transparent) 0%, transparent 55%),
      linear-gradient(135deg, color-mix(in srgb, var(--accent) 42%, #0b1220) 0%, color-mix(in srgb, var(--accent) 18%, #0b1220) 100%);
  }
}
.hero-sup { font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.85; }
.hero-num { font-size:13px; font-weight:600; opacity:.9; margin-top:6px; }
.hero-tema h1 { font-size:28px; line-height:1.15; letter-spacing:-.03em; margin:6px 0 8px; font-weight:800; }
@media (min-width:720px) { .hero-tema { padding:36px 34px 30px; } .hero-tema h1 { font-size:38px; } }
.hero-epi { margin:-4px 0 10px; font-size:14px; line-height:1.5; font-weight:600; opacity:.95; max-width:760px; }
.epi-oficial { margin:0 0 14px; padding:10px 14px; border-left:3px solid var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent); border-radius:0 10px 10px 0; font-size:14.5px; line-height:1.5; font-weight:500; }
.epi-oficial span { display:block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:3px; }
.hero-sub { margin:0 0 12px; font-size:15px; line-height:1.55; opacity:.92; font-style:italic; max-width:760px; }
.hero-chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
.hero-chips span { font-size:12.5px; font-weight:600; padding:5px 12px; border-radius:var(--r-pill); background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28); backdrop-filter:blur(4px); }
.hero-acc { display:flex; flex-wrap:wrap; gap:8px; }
.hero-btn { background:rgba(255,255,255,.14); color:#fff; border-color:rgba(255,255,255,.3); }
.hero-btn:hover { background:rgba(255,255,255,.24); }

.estudio { display:grid; grid-template-columns:minmax(0,1fr); gap:20px; align-items:start; }
@media (min-width:1000px) { .estudio { grid-template-columns:minmax(0,1fr) 290px; } }
.estudio-lateral { display:none; position:sticky; top:76px; max-height:calc(100dvh - 92px); overflow:auto; padding:18px; }
@media (min-width:1000px) { .estudio-lateral { display:block; } .fab-herr { display:none !important; } }
.lat-cab { padding-bottom:10px; border-bottom:2px solid var(--accent); margin-bottom:6px; }
.lat-sup { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); font-weight:700; }
.lat-tit { font-size:20px; font-weight:800; color:var(--accent); letter-spacing:-.02em; }
.lat-k { display:block; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin:16px 0 8px; }
.lat-pct { display:flex; justify-content:space-between; font-size:12px; margin-top:6px; }
.lat-pct b { color:var(--accent); }
.buscar-tema .input { padding:9px 12px; font-size:15px; }
.buscar-nav { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; }
.herr-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.herr {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:68px;
  border:1px solid var(--line); background:var(--bg-soft); border-radius:var(--r-md); cursor:pointer;
  font-size:12.5px; font-weight:600; color:var(--text); padding:8px 6px; text-align:center;
  transition:transform .15s var(--ease), box-shadow .15s, border-color .15s, background .15s;
}
.herr:hover { transform:translateY(-1px); box-shadow:var(--sh-2); border-color:var(--accent); background:var(--bg-elev); }
.herr-ico { font-size:20px; line-height:1; }
.practica { grid-column:1 / -1; border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background:color-mix(in srgb, var(--accent-bg) 45%, var(--bg-elev)); border-radius:var(--r-md); padding:10px; }
.practica-k { font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
.practica .herr { background:var(--bg-elev); }
.lat-indice { list-style:none; margin:0; padding:0; font-size:13.5px; }
.lat-indice ul { list-style:none; padding-left:16px; margin:0; }
.lat-indice button { border:none; background:none; cursor:pointer; text-align:left; width:100%; padding:6px 6px; border-radius:var(--r-sm); color:var(--text); font-size:13.5px; line-height:1.35; }
.lat-indice ul button { color:var(--text-muted); font-size:12.5px; }
.lat-indice button:hover { background:var(--bg-soft); }
.lat-indice .n { color:var(--accent); font-weight:700; margin-right:2px; }
.ok-mini { color:var(--ok); font-weight:800; }

.indice-tema { padding:20px 22px; margin-bottom:14px; }
.indice-tema .ficha-k { color:var(--accent); }
.indice-tema ol { list-style:none; margin:0; padding:0; columns:2 260px; column-gap:28px; }
.indice-tema li { break-inside:avoid; }
.indice-tema ul { list-style:none; padding-left:22px; margin:0 0 4px; }
.indice-tema button { border:none; background:none; cursor:pointer; text-align:left; padding:5px 0; font-size:15px; color:var(--text); line-height:1.4; }
.indice-tema ul button { font-size:13.5px; color:var(--text-muted); padding:3px 0; }
.indice-tema button:hover { color:var(--accent); }
.indice-tema .n { color:var(--accent); font-weight:800; font-feature-settings:"tnum"; margin-right:4px; }
.estudio-barra { display:flex; gap:8px; justify-content:flex-end; margin:0 0 10px; }

.card.ap { padding:0; overflow:hidden; transition:box-shadow .2s, border-color .2s; }
.card.ap + .card.ap { margin-top:12px; }
.ap-cab { display:flex; align-items:center; gap:12px; padding:16px 18px; cursor:pointer; }
.ap-num { font-size:13px; font-weight:800; color:var(--text-muted); font-feature-settings:"tnum"; min-width:20px; }
.ap-tit { flex:1; min-width:0; margin:0; font-size:18px; font-weight:700; letter-spacing:-.015em; line-height:1.3; color:var(--accent); }
@media (min-width:720px) { .ap-tit { font-size:20px; } }
.ap-rep {
  flex-shrink:0; border:1px solid var(--line); background:var(--bg-soft); color:var(--text-muted);
  font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:var(--r-pill); cursor:pointer; white-space:nowrap;
}
.ap-rep:hover { border-color:var(--ok); color:var(--ok); }
.ap-tog {
  flex-shrink:0; width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; color:#fff; font-size:12px;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); transition:transform .2s var(--ease);
  box-shadow:0 4px 12px color-mix(in srgb, var(--accent) 30%, transparent);
}
.ap.abierto .ap-tog { transform:rotate(90deg); }
.ap-cuerpo { display:none; padding:4px 22px 22px 50px; border-top:2px solid var(--accent); margin:0 18px; padding-left:32px; }
.ap.abierto .ap-cuerpo { display:block; }
.ap-cuerpo p, .ap-cuerpo li { font-size:16px; line-height:1.75; color:var(--text); }
.ap-cuerpo p { text-align:justify; hyphens:auto; }
.ap-cuerpo ul, .ap-cuerpo ol { padding-left:22px; }
.ap-sub { scroll-margin-top:84px; }
/* Texto literal de la norma */
.ap-cuerpo blockquote.literal {
  margin:10px 0 16px; padding:12px 16px 4px; border-left:4px solid var(--accent);
  background:color-mix(in srgb, var(--accent-bg) 28%, var(--bg-elev)); border-radius:0 var(--r-md) var(--r-md) 0;
}
.ap-cuerpo blockquote.literal p { text-align:left; font-size:15.5px; line-height:1.7; margin:0 0 10px; }
.ap-cuerpo blockquote.literal p:first-child strong:first-child { color:var(--accent); }
/* Subtítulos dentro de un apartado («### » y «#### ») */
.ap-cuerpo h4.ap-h { font-size:17px; font-weight:700; letter-spacing:-.01em; color:var(--accent); margin:26px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line); }
.ap-cuerpo h4.ap-h:first-child { margin-top:12px; }
.ap-cuerpo h5.ap-h2 { font-size:15.5px; font-weight:700; color:var(--text); margin:18px 0 6px; }
/* Recuadros: «!> » idea clave, «?> » trampa de examen */
.ap-cuerpo .ap-caja { margin:12px 0 16px; padding:10px 14px; border-radius:var(--r-md); border:1px solid var(--line); }
.ap-cuerpo .ap-caja p { margin:0 0 6px; text-align:left; font-size:15px; line-height:1.6; }
.ap-cuerpo .ap-caja p:last-child { margin-bottom:0; }
.ap-cuerpo .ap-caja.clave { background:color-mix(in srgb, var(--accent-bg) 45%, var(--bg-elev)); border-color:color-mix(in srgb, var(--accent) 35%, transparent); }
.ap-cuerpo .ap-caja.trampa { background:var(--warn-bg); border-color:color-mix(in srgb, var(--warn) 40%, transparent); }
.ap-cuerpo .ap-caja.trampa strong:first-child { color:var(--warn); }
.ap-cuerpo li.sub { margin-left:22px; list-style-type:circle; }
.ap-cuerpo .ap-caja.ap-guia { background:var(--bg-elev); border-left:4px solid var(--accent); }
.ap-cuerpo .ap-caja.ap-guia strong:first-child { color:var(--accent); }
.ap-cuerpo .ap-caja.ap-ficha { padding:0; overflow:hidden; background:var(--bg-elev); }
.ap-cuerpo .ap-caja.ap-ficha::before { content:"FICHA"; display:block; padding:5px 14px; font-size:11.5px; font-weight:700; letter-spacing:.08em; color:var(--text-muted); background:color-mix(in srgb, var(--line) 45%, transparent); }
.ap-cuerpo .fi-fila { display:grid; grid-template-columns:8.5em 1fr; gap:10px; padding:7px 14px; border-top:1px solid var(--line); font-size:15px; line-height:1.55; }
.ap-cuerpo .fi-k { font-weight:700; }
.ap-cuerpo .fi-v ul { margin:2px 0 0; padding-left:18px; }
.ap-cuerpo .fi-v li { margin:1px 0; font-size:15px; line-height:1.55; }
.ap-cuerpo .fi-fila.ojo { background:var(--warn-bg); }
.ap-cuerpo .fi-fila.ojo .fi-k { color:var(--warn); }
.ap-cuerpo .ap-caja.ap-quiz { background:var(--bg-elev); border-left:4px solid var(--warn); }
.ap-cuerpo .ap-quiz strong:first-child { color:var(--warn); }
.ap-cuerpo .qz-ops { display:flex; flex-direction:column; gap:6px; margin:8px 0; }
.ap-cuerpo .qz-op { display:flex; gap:6px; align-items:flex-start; text-align:left; width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--bg); color:var(--text); font:inherit; font-size:15px; line-height:1.5; cursor:pointer; }
.ap-cuerpo .qz-op:hover:not([disabled]) { border-color:var(--accent); }
.ap-cuerpo .qz-op .qz-l { font-weight:700; }

}

  background:transparent; color:inherit; display:inline-flex; align-items:center; gap:7px; }

<script type="application/json" id="tests-reales">{"_formato":"tests_reales_v1","examenes":[{"id":"GACE-L-2025-1","titulo":"GACE-L 2025","anio":2025,"acceso":"libre","ejercicio":"Primer ejercicio","plantilla":"definitiva","fuente":"Cuestionario oficial «2025 - GACE-L» y plantilla definitiva de respuestas del primer ejercicio (ingreso libre)","preguntas":[{"n":1,"q":"El Título I de la Constitución Española de 1978 se denomina:","o":["De los derechos y deberes fundamentales.","De los derechos y deberes de los ciudadanos.","De los españoles y los extranjeros.","Derechos y libertades."],"c":0,"tema":"I.2","ley":[{"t":"Constitución Española · rúbricas del Título I","f":"BOE-A-1978-31229","p":["**TÍTULO I. De los derechos y deberes fundamentales**","CAPÍTULO PRIMERO. De los españoles y los extranjeros","CAPÍTULO SEGUNDO. Derechos y libertades","Sección 2.ª De los derechos y deberes de los ciudadanos"]}]},{"n":2,"q":"Según el artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, si en el procedimiento inicial no se alcanzan las mayorías exigidas para la elección del Defensor del Pueblo:","o":["Se convoca directamente un nuevo Pleno conjunto de las Cortes Generales, y el candidato será designado por mayoría absoluta de ambas Cámaras.","Se convoca directamente un nuevo Pleno conjunto de las Cortes Generales, y el candidato será designado por mayoría simple de ambas Cámaras.","Se procede a una nueva sesión de la Comisión Mixta Congreso-Senado y, en el plazo máximo de un mes, se formulan sucesivas propuestas; una vez obtenidos tres quintos en el Congreso, la designación queda realizada al alcanzarse mayoría absoluta en el Senado.","Se procede a una nueva sesión de la Comisión Mixta Congreso-Senado y, en el plazo máximo de quince días, se formulan sucesivas propuestas; una vez obtenidos tres quintos en el Congreso, la designación queda realizada al alcanzarse mayoría simple en el Senado."],"c":2,"tema":"I.2","ley":[{"t":"Ley Orgánica 3/1981, del Defensor del Pueblo · artículo segundo, apartados cuatro y cinco","f":"BOE-A-1981-10325","p":["Cuatro. Propuesto el candidato o candidatos, se convocará en término no inferior a diez días al Pleno del Congreso para que proceda a su elección. Será designado quien obtuviese una votación favorable de las tres quintas partes de los miembros del Congreso y posteriormente, en un plazo máximo de veinte días, fuese ratificado por esta misma mayoría del Senado.","Cinco. Caso de no alcanzarse las mencionadas mayorías, se procederá en nueva sesión de la Comisión, y **en el plazo máximo de un mes**, a formular sucesivas propuestas. En tales casos, una vez conseguida la mayoría de los tres quintos en el Congreso, la designación quedará realizada **al alcanzarse la mayoría absoluta del Senado**."]}]},{"n":3,"q":"¿Quién propone a los Magistrados del Tribunal Constitucional, de acuerdo con el artículo 159 de la Constitución Española de 1978?","o":["4 el Congreso, 4 el Senado, 2 el Gobierno y 2 el Consejo General del Poder Judicial.","6 el Congreso y 6 el Senado.","4 el Congreso, 4 el Senado y 4 el Gobierno.","6 el Congreso, 2 el Senado, 2 el Gobierno y 2 el Presidente del Tribunal Supremo."],"c":0,"tema":"I.3","ley":[{"t":"Constitución Española · artículo 159.1","f":"BOE-A-1978-31229","p":["1. El Tribunal Constitucional se compone de 12 miembros nombrados por el Rey; de ellos, **cuatro a propuesta del Congreso** por mayoría de tres quintos de sus miembros; **cuatro a propuesta del Senado**, con idéntica mayoría; **dos a propuesta del Gobierno**, y **dos a propuesta del Consejo General del Poder Judicial**."]}]},{"n":4,"q":"Según el artículo 99 de la Constitución Española de 1978, el Rey propone candidato a la Presidencia del Gobierno:","o":["Libremente y sin consulta previa.","Tras consultar a los Grupos Parlamentarios del Congreso y el Senado.","Tras consultar a los representantes designados por los grupos políticos con representación parlamentaria.","A propuesta del Presidente del Congreso."],"c":2,"tema":"I.6","ley":[{"t":"Constitución Española · artículo 99.1","f":"BOE-A-1978-31229","p":["1. Después de cada renovación del Congreso de los Diputados, y en los demás supuestos constitucionales en que así proceda, el Rey, **previa consulta con los representantes designados por los Grupos políticos con representación parlamentaria**, y a través del Presidente del Congreso, propondrá un candidato a la Presidencia del Gobierno."]}]},{"n":5,"q":"Según el artículo 62 de la Constitución Española de 1978, ¿cuál de las siguientes funciones corresponde al Rey en los términos expresamente previstos por dicho precepto?","o":["Autorizar indultos generales mediante Real Decreto, a propuesta del Gobierno.","Ser informado de los asuntos de Estado y presidir las sesiones de las Cortes Generales.","El Alto Patronazgo de las Fuerzas Armadas.","Ejercer el derecho de gracia con arreglo a la ley, sin que esta pueda autorizar indultos generales."],"c":3,"tema":"I.4","ley":[{"t":"Constitución Española · artículo 62","f":"BOE-A-1978-31229","p":["Corresponde al Rey:","a) Sancionar y promulgar las leyes.","b) Convocar y disolver las Cortes Generales y convocar elecciones en los términos previstos en la Constitución.","c) Convocar a referéndum en los casos previstos en la Constitución.","d) Proponer el candidato a Presidente del Gobierno y, en su caso, nombrarlo, así como poner fin a sus funciones en los términos previstos en la Constitución.","e) Nombrar y separar a los miembros del Gobierno, a propuesta de su Presidente.","f) Expedir los decretos acordados en el Consejo de Ministros, conferir los empleos civiles y militares y conceder honores y distinciones con arreglo a las leyes.","g) Ser informado de los asuntos de Estado y presidir, a estos efectos, las sesiones del Consejo de Ministros, cuando lo estime oportuno, a petición del Presidente del Gobierno.","h) El mando supremo de las Fuerzas Armadas.","i) **Ejercer el derecho de gracia con arreglo a la ley, que no podrá autorizar indultos generales**.","j) El Alto Patronazgo de las Reales Academias."]}]},{"n":6,"q":"De acuerdo con el artículo 56.1 de la Constitución Española de 1978, ¿qué arbitra y modera el Rey?","o":["Las relaciones diplomáticas.","El funcionamiento regular de las instituciones.","La unidad y permanencia del Estado Español.","Las relaciones entre las naciones de su comunidad histórica."],"c":1,"tema":"I.4","ley":[{"t":"Constitución Española · artículo 56.1","f":"BOE-A-1978-31229","p":["1. El Rey es el Jefe del Estado, símbolo de su unidad y permanencia, **arbitra y modera el funcionamiento regular de las instituciones**, asume la más alta representación del Estado español en las relaciones internacionales, especialmente con las naciones de su comunidad histórica, y ejerce las funciones que le atribuyen expresamente la Constitución y las leyes."]}]},{"n":7,"q":"Según el artículo 75 de la Constitución Española de 1978, ¿cuál de las siguientes materias NO puede ser objeto de delegación en las Comisiones Legislativas Permanentes para la aprobación de proyectos o proposiciones de ley?","o":["Una ley orgánica.","Una ley ordinaria que regule aspectos sectoriales de una política pública.","Una proposición de ley ordinaria presentada por un grupo parlamentario.","Un proyecto de ley ordinaria cuya tramitación haya sido delegada, aunque el Pleno pueda recabar en cualquier momento el debate y votación."],"c":0,"tema":"I.5","ley":[{"t":"Constitución Española · artículo 75.2 y 3","f":"BOE-A-1978-31229","p":["2. Las Cámaras podrán delegar en las Comisiones Legislativas Permanentes la aprobación de proyectos o proposiciones de ley. El Pleno podrá, no obstante, recabar en cualquier momento el debate y votación de cualquier proyecto o proposición de ley que haya sido objeto de esta delegación.","3. Quedan exceptuados de lo dispuesto en el apartado anterior la reforma constitucional, las cuestiones internacionales, las **leyes orgánicas y de bases** y los Presupuestos Generales del Estado."]}]},{"n":8,"q":"De conformidad con lo establecido en la Ley Orgánica 3/1980, de 22 de abril, del Consejo de Estado, el Pleno estará compuesto por, entre otros:","o":["El vicepresidente.","Los consejeros electivos, en número de doce, nombrados entre quienes hayan desempeñado el cargo de Fiscal General del Estado.","Los consejeros natos, entre los que figurarán los ex gobernadores del Banco de España.","Los consejeros permanentes, en numero igual al de las Secciones del Consejo, que son nombrados, sin límite de tiempo, por Real Decreto."],"c":3,"tema":"I.6","ley":[{"t":"Ley Orgánica 3/1980, del Consejo de Estado · artículo cuarto.uno","f":"BOE-A-1980-8648","p":["Uno. Integran el Consejo de Estado en Pleno:","a) El Presidente.","b) **Los Consejeros permanentes**.","c) Los Consejeros natos.","d) Los Consejeros electivos.","e) El Secretario general."]},{"t":"Ley Orgánica 3/1980, del Consejo de Estado · artículo séptimo","f":"BOE-A-1980-8648","p":["Los Consejeros Permanentes, **en numero igual al de las Secciones del Consejo, son nombrados, sin límite de tiempo, por Real Decreto** entre personas que están o hayan estado comprendidas en alguna de las categorías siguientes:"]}]},{"n":9,"q":"Según el artículo 124.4 de la Constitución Española de 1978, el Fiscal General del Estado es nombrado por:","o":["El Congreso de los Diputados, a propuesta del Gobierno, previo informe vinculante del Consejo General del Poder Judicial.","El Rey, a propuesta del Consejo General del Poder Judicial, oído el Gobierno.","El Rey, a propuesta del Gobierno, oído el Consejo General del Poder Judicial.","El Rey, a propuesta del Gobierno, previa autorización del Senado."],"c":2,"ley":[{"t":"Constitución Española · artículo 124.4","f":"BOE-A-1978-31229","p":["4. El Fiscal General del Estado será nombrado por el Rey, **a propuesta del Gobierno, oído el Consejo General del Poder Judicial**."]}]},{"n":10,"q":"Según el artículo 3.2 de la Ley Orgánica 6/1985, de 1 de julio, del Poder Judicial, ¿en qué ámbito administran Justicia los órganos de la jurisdicción militar?","o":["En cualquiera en el que estén implicados los miembros de las Fuerzas Armadas, con independencia de su naturaleza.","En el estrictamente castrense y, en su caso, en las materias que establezca la declaración del estado de sitio.","Únicamente en el disciplinario militar, con exclusión de las materias penales y procesales.","Exclusivamente en el del estado de sitio."],"c":1,"tema":"I.7","ley":[{"t":"Ley Orgánica 6/1985, del Poder Judicial · artículo 3.2","f":"BOE-A-1985-12666","p":["2. Los órganos de la jurisdicción militar, integrante del Poder Judicial del Estado, basan su organización y funcionamiento en el principio de unidad jurisdiccional y administran Justicia **en el ámbito estrictamente castrense y, en su caso, en las materias que establezca la declaración del estado de sitio**, de acuerdo con la Constitución y lo dispuesto en las leyes penales, procesales y disciplinarias militares."]}]},{"n":11,"q":"Según el artículo 55 bis de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿qué criterio debe observarse en el nombramiento de las personas titulares de las Secretarías de Estado y de los órganos directivos?","o":["Debe asegurarse que, en cada departamento ministerial, las personas de cada sexo no superen el 60% ni sean menos del 40 %.","Debe asegurarse que, en el conjunto de la Administración General del Estado, las personas de cada sexo no superen el 70% ni sean menos del 30 %.","Debe asegurarse que, en el conjunto de la Administración General del Estado, las personas de cada sexo no superen el 60% ni sean menos del 40 %.","En las Secretarías de Estado se aplica el principio de presencia equilibrada de hombres y mujeres, y en el resto de los órganos directivos de cada departamento ministerial, el de paridad."],"c":0,"tema":"I.8","ley":[{"t":"Ley 40/2015, de Régimen Jurídico del Sector Público · artículo 55 bis","f":"BOE-A-2015-10566","p":["Las personas titulares de las Secretarías de Estado y de los órganos directivos de la Administración General del Estado se nombrarán atendiendo al principio de representación equilibrada entre mujeres y hombres, de tal manera que las personas de cada sexo **no superen el sesenta por ciento ni sean menos del cuarenta por ciento en el ámbito de cada departamento ministerial**."]}]},{"n":12,"q":"Según el artículo 82.1 de la Ley 40/2015, de 1 de octubre, del Régimen Jurídico del Sector Público, el Inventario de Entidades del Sector Público Estatal, Autonómico y Local:","o":["Es un registro público administrativo que garantiza la información pública y la ordenación de todas las entidades del sector público institucional, y su integración, gestión y publicación dependen de la Intervención General de la Administración del Estado.","Es un registro público administrativo que garantiza la información pública y la ordenación de todas las entidades del sector público institucional, y su integración, gestión y publicación dependen de la Autoridad Independiente de Responsabilidad Fiscal.","Es un registro administrativo interno, que recoge la clasificación de todas las entidades del sector público institucional y su gestión depende del Tribunal de Cuentas.","Es un registro administrativo interno, que recoge la clasificación de todas las entidades del sector público institucional y su gestión depende de la Subdirección General de Datos del Empleo Público."],"c":0,"tema":"I.9","ley":[{"t":"Ley 40/2015, de Régimen Jurídico del Sector Público · artículo 82.1","f":"BOE-A-2015-10566","p":["1. El Inventario de Entidades del Sector Público Estatal, Autonómico y Local, se configura como un **registro público administrativo** que garantiza la información pública y la ordenación de todas las entidades integrantes del sector público institucional cualquiera que sea su naturaleza jurídica.","La integración y gestión de dicho Inventario y su publicación dependerá de la **Intervención General de la Administración del Estado**."]}]},{"n":13,"q":"¿Sobre cuál de las siguientes materias tiene competencia exclusiva el Estado, de acuerdo con el artículo 149.1 de la Constitución de 1978?","o":["Ordenación del territorio, urbanismo y vivienda.","Asistencia social.","Marina mercante.","Pesca fluvial."],"c":2,"tema":"I.10","ley":[{"t":"Constitución Española · artículo 149.1.20.ª (competencia exclusiva del Estado)","f":"BOE-A-1978-31229","p":["1. El Estado tiene competencia exclusiva sobre las siguientes materias:","20.ª **Marina mercante** y abanderamiento de buques; iluminación de costas y señales marítimas; puertos de interés general; aeropuertos de interés general; control del espacio aéreo, tránsito y transporte aéreo, servicio meteorológico y matriculación de aeronaves."]},{"t":"Constitución Española · artículo 148.1 (competencias que pueden asumir las Comunidades Autónomas)","f":"BOE-A-1978-31229","p":["1. Las Comunidades Autónomas podrán asumir competencias en las siguientes materias:","3.ª **Ordenación del territorio, urbanismo y vivienda**.","11.ª La pesca en aguas interiores, el marisqueo y la acuicultura, la caza y **la pesca fluvial**.","20.ª **Asistencia social**."]}]},{"n":14,"q":"¿Cuál de las siguientes afirmaciones es correcta?","o":["La Constitución prohíbe expresamente la federación de Comunidades Autónomas.","La Constitución permite la federación de Comunidades Autónomas siempre que se autorice mediante ley orgánica.","La Constitución permite la federación de Comunidades Autónomas si lo aprueban por mayoría absoluta las Asambleas Legislativas de las Comunidades afectadas.","La Constitución no regula la federación de Comunidades Autónomas, y se limita a lo que dispongan los Estatutos de Autonomía."],"c":0,"tema":"I.10","ley":[{"t":"Constitución Española · artículo 145.1","f":"BOE-A-1978-31229","p":["1. **En ningún caso se admitirá la federación de Comunidades Autónomas**."]}]},{"n":15,"q":"Según el artículo 141.4 de la Constitución Española de 1978, ¿cómo se articula la administración propia de las islas en los archipiélagos?","o":["Mediante Diputaciones Provinciales insulares.","Mediante Mancomunidades insulares, creadas mediante acuerdo de los municipios que las integran.","Mediante Cabildos o Consejos.","Mediante Delegaciones del Gobierno en cada isla."],"c":2,"tema":"I.11","ley":[{"t":"Constitución Española · artículo 141.4","f":"BOE-A-1978-31229","p":["4. En los archipiélagos, las islas tendrán además su administración propia en forma de **Cabildos o Consejos**."]}]},{"n":16,"q":"Indique la respuesta correcta en relación con los municipios, de conformidad con lo establecido en la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local:","o":["El Alcalde, los Tenientes de Alcalde, el Pleno y la Junta de Gobierno Local existen en todos los ayuntamientos.","Los Tenientes de Alcalde sustituyen, por el orden de su nombramiento y en los casos de vacante, ausencia o enfermedad, al Alcalde, siendo libremente designados y removidos por los miembros del Pleno municipal.","El Alcalde es el Presidente de la Corporación y ostenta el control y la fiscalización de los órganos de gobierno.","Corresponde al Pleno municipal en los Ayuntamientos y a la Asamblea vecinal en el régimen de Concejo Abierto la declaración de lesividad de los actos del Ayuntamiento."],"c":3,"tema":"I.11","ley":[{"t":"Ley 7/1985, Reguladora de las Bases del Régimen Local · artículo 22.2, párrafos a) y k)","f":"BOE-A-1985-5392","p":["2. Corresponden, en todo caso, **al Pleno municipal en los Ayuntamientos, y a la Asamblea vecinal en el régimen de Concejo Abierto**, las siguientes atribuciones:","a) El control y la fiscalización de los órganos de gobierno.","k) **La declaración de lesividad de los actos del Ayuntamiento**."]}]},{"n":17,"q":"Indique qué país de los siguientes NO forma parte de la eurozona:","o":["Dinamarca.","Letonia.","Eslovenia.","Malta."],"c":0,"tema":"II.6"},{"n":18,"q":"El Día de Europa se celebra cada 9 de mayo. ¿Qué conmemora?","o":["La firma del Tratado de Roma.","Celebra el aniversario de la Declaración Schuman.","La primera ampliación de la Unión Europea.","La entrada en vigor del Acuerdo de Schengen."],"c":1,"tema":"II.1"},{"n":19,"q":"En relación con el mandato del Presidente del Consejo Europeo indique la respuesta correcta de acuerdo con el artículo 15 del Tratado de la Unión Europea:","o":["Se elige para un mandato de cinco años, renovable una vez.","Se elige para un mandato de dos años, no renovable.","Se elige para un mandato de dos años y medio, renovable una vez.","Se elige para un mandato de cuatro años, renovable una vez."],"c":2,"tema":"II.2","ley":[{"t":"Tratado de la Unión Europea (versión consolidada, DOUE C 202 de 7-6-2016) · artículo 15.5","f":"CELEX:12016M","p":["5. El Consejo Europeo elegirá a su Presidente por mayoría cualificada **para un mandato de dos años y medio, que podrá renovarse una sola vez**. En caso de impedimento o falta grave, el Consejo Europeo podrá poner fin a su mandato por el mismo procedimiento."]}]},{"n":20,"q":"¿Quién se encargará de preparar los trabajos del Consejo, de acuerdo con el artículo 16 del Tratado de la Unión Europea?","o":["Un Comité de Representantes Permanentes de los Gobiernos de los estados miembros.","Un Comité de Representantes Especiales de los Gobiernos de los estados miembros.","Un Comité de Representantes Expertos de los Gobiernos de los estados miembros.","Un Comité de Representantes Profesionales de los Gobiernos de los estados miembros."],"c":0,"tema":"II.2","ley":[{"t":"Tratado de la Unión Europea (versión consolidada, DOUE C 202 de 7-6-2016) · artículo 16.7","f":"CELEX:12016M","p":["7. **Un Comité de Representantes Permanentes de los Gobiernos de los Estados miembros se encargará de preparar los trabajos del Consejo**."]}]},{"n":21,"q":"De acuerdo con el artículo 249 del Tratado de Funcionamiento de la Unión Europea, ¿en qué plazo la Comisión publicará todos los años, con carácter previo a la apertura del período de sesiones del Parlamento Europeo, un informe general sobre las actividades de la Unión?","o":["Al menos tres meses antes.","Al menos seis meses antes.","Al menos un mes antes.","Al menos cuatro meses antes."],"c":2,"tema":"II.2","ley":[{"t":"Tratado de Funcionamiento de la Unión Europea (versión consolidada, DOUE C 202 de 7-6-2016) · artículo 249.2","f":"CELEX:12016E","p":["2. La Comisión publicará todos los años, **al menos un mes antes** de la apertura del período de sesiones del Parlamento Europeo, un informe general sobre las actividades de la Unión."]}]},{"n":22,"q":"Según el artículo 14 del Tratado de la Unión Europea, señale la respuesta correcta:","o":["El Parlamento Europeo elegirá a su Presidente y a la Mesa de entre sus diputados.","La función presupuestaria es ejercida en exclusiva por el Parlamento.","El Consejo de Asuntos Exteriores velará por la coherencia de los trabajos de las diferentes formaciones del Consejo.","El mandato de la Comisión será de cuatro años."],"c":0,"tema":"II.3","ley":[{"t":"Tratado de la Unión Europea (versión consolidada, DOUE C 202 de 7-6-2016) · artículo 14.1 y 4","f":"CELEX:12016M","p":["1. El Parlamento Europeo ejercerá **conjuntamente con el Consejo** la función legislativa y la función presupuestaria. Ejercerá funciones de control político y consultivas, en las condiciones establecidas en los Tratados. Elegirá al Presidente de la Comisión.","4. **El Parlamento Europeo elegirá a su Presidente y a la Mesa de entre sus diputados**."]},{"t":"Tratado de la Unión Europea (versión consolidada, DOUE C 202 de 7-6-2016) · artículo 16.6, párrafo segundo","f":"CELEX:12016M","p":["**El Consejo de Asuntos Generales velará por la coherencia de los trabajos de las diferentes formaciones del Consejo**. Preparará las reuniones del Consejo Europeo y garantizará su actuación subsiguiente, en contacto con el Presidente del Consejo Europeo y la Comisión."]},{"t":"Tratado de la Unión Europea (versión consolidada, DOUE C 202 de 7-6-2016) · artículo 17.3","f":"CELEX:12016M","p":["3. El mandato de la Comisión será de **cinco años**."]}]},{"n":23,"q":"De acuerdo con lo establecido en el artículo 263 del Tratado de Funcionamiento de la Unión Europea, el Tribunal de Justicia de la Unión Europea NO será competente para pronunciarse sobre los recursos interpuestos por:","o":["El Comité de las Regiones.","El Banco Central Europeo.","El Tribunal de Cuentas.","El Comité Económico y Social."],"c":3,"tema":"II.3","ley":[{"t":"Tratado de Funcionamiento de la Unión Europea (versión consolidada, DOUE C 202 de 7-6-2016) · artículo 263, párrafo tercero","f":"CELEX:12016E","p":["El Tribunal de Justicia de la Unión Europea será competente en las mismas condiciones para pronunciarse sobre los recursos interpuestos por **el Tribunal de Cuentas, por el Banco Central Europeo y por el Comité de las Regiones** con el fin de salvaguardar prerrogativas de éstos."]}]},{"n":24,"q":"De acuerdo con lo establecido en el artículo 288 del Tratado de Funcionamiento de la Unión Europea, la Decisión:","o":["Tendrá alcance general y directamente aplicable en cada Estado miembro.","Será obligatoria en todos sus elementos. Cuando designe destinatarios, sólo será obligatoria para éstos.","Obligará al Estado miembro destinatario en cuanto al resultado que deba conseguirse, dejando, sin embargo, a las autoridades nacionales la elección de la forma y de los medios.","No será vinculante."],"c":1,"tema":"II.4","ley":[{"t":"Tratado de Funcionamiento de la Unión Europea (versión consolidada, DOUE C 202 de 7-6-2016) · artículo 288, párrafos segundo a quinto","f":"CELEX:12016E","p":["El reglamento tendrá un alcance general. Será obligatorio en todos sus elementos y directamente aplicable en cada Estado miembro.","La directiva obligará al Estado miembro destinatario en cuanto al resultado que deba conseguirse, dejando, sin embargo, a las autoridades nacionales la elección de la forma y de los medios.","**La decisión será obligatoria en todos sus elementos. Cuando designe destinatarios, sólo será obligatoria para éstos.**","Las recomendaciones y los dictámenes no serán vinculantes."]}]},{"n":25,"q":"¿Qué sentencia del Tribunal de Justicia de la Unión Europea estableció el principio de \"efecto directo\"?","o":["Sentencia Simmenthal.","Sentencia Van Duyn.","Sentencia Van Gend & Loos.","Sentencia Francovich."],"c":2,"tema":"II.4"},{"n":26,"q":"Indique la respuesta correcta en relación con el presupuesto de la Unión Europea de acuerdo con el artículo 319 del Tratado de Funcionamiento de la Unión Europea:","o":["El presupuesto anual de la Unión Europea se establecerá en euros salvo para Hungría y Dinamarca.","Dentro del presupuesto, el Parlamento por su cuenta podrá transferir créditos de capítulo a capítulo o de subdivisión a subdivisión.","El Parlamento Europeo, por recomendación del Consejo, aprobará la gestión de la Comisión en la ejecución del presupuesto.","Los gastos consignados en el presupuesto para todo el ejercicio presupuestario serán autorizados con carácter semestral."],"c":2,"tema":"II.5","ley":[{"t":"Tratado de Funcionamiento de la Unión Europea (versión consolidada, DOUE C 202 de 7-6-2016) · artículo 319.1","f":"CELEX:12016E","p":["1. **El Parlamento Europeo, por recomendación del Consejo, aprobará la gestión de la Comisión en la ejecución del presupuesto**. A tal fin, examinará, después del Consejo, las cuentas, el balance financiero y el informe de evaluación mencionados en el artículo 318, el informe anual del Tribunal de Cuentas, acompañado de las respuestas de las instituciones controladas a las observaciones del Tribunal de Cuentas, la declaración de fiabilidad a que se refiere el párrafo segundo del apartado 1 del artículo 287 y los informes especiales pertinentes del Tribunal de Cuentas."]}]},{"n":27,"q":"¿Cuál es el programa marco de investigación e innovación (I+I) de la Unión Europea (UE) para el período 2021-2027?","o":["React EU.","Invest EU.","Next Generation EU.","Horizonte Europa."],"c":3},{"n":28,"q":"De acuerdo con el artículo 3 del Tratado de Funcionamiento de la Unión Europea, indique cuál de las siguientes es una competencia exclusiva de la Unión Europea:","o":["El mercado interior.","La energía.","La política comercial común.","Los transportes."],"c":2,"ley":[{"t":"Tratado de Funcionamiento de la Unión Europea (versión consolidada, DOUE C 202 de 7-6-2016) · artículo 3.1","f":"CELEX:12016E","p":["1. La Unión dispondrá de competencia exclusiva en los ámbitos siguientes:","a) la unión aduanera;","b) el establecimiento de las normas sobre competencia necesarias para el funcionamiento del mercado interior;","c) la política monetaria de los Estados miembros cuya moneda es el euro;","d) la conservación de los recursos biológicos marinos dentro de la política pesquera común;","e) **la política comercial común**."]}]},{"n":29,"q":"De acuerdo con el artículo 82 del Tratado de Funcionamiento de la Unión Europea, la cooperación judicial en materia penal en la Unión, ¿en qué principio se basará?","o":["Reconocimiento mutuo de las sentencias y resoluciones judiciales.","Atribución de competencias.","Proporcionalidad.","Subsidiariedad."],"c":0,"tema":"II.6","ley":[{"t":"Tratado de Funcionamiento de la Unión Europea (versión consolidada, DOUE C 202 de 7-6-2016) · artículo 82.1, párrafo primero","f":"CELEX:12016E","p":["1. La cooperación judicial en materia penal en la Unión **se basará en el principio de reconocimiento mutuo de las sentencias y resoluciones judiciales** e incluye la aproximación de las disposiciones legales y reglamentarias de los Estados miembros en los ámbitos mencionados en el apartado 2 y en el artículo 83."]}]},{"n":30,"q":"Indique cuál de los siguientes países NO firmó el Tratado de Estabilidad, Coordinación y Gobernanza en la Unión Económica y Monetaria:","o":["Chipre.","Malta.","Estonia.","República Checa."],"c":3,"tema":"II.6"},{"n":31,"q":"¿A qué eje de España Digital 2026 pertenece la medida \"Atracción de talento nacional e internacional\"?","o":["España, Hub Audiovisual.","Transformación digital de la empresa y emprendimiento digital.","Competencias digitales.","Economía del dato e inteligencia artificial."],"c":3,"tema":"III.1"},{"n":32,"q":"De acuerdo con lo establecido en el Real Decreto 931/2017, de 27 de octubre, por el que se regula la Memoria del Análisis de Impacto Normativo (MAIN), ¿qué debe incluir, al menos, la memoria abreviada de análisis de impacto normativo?","o":["Anexo con todas las aportaciones recibidas analizadas con detalle.","Listado de las normas que quedan derogadas.","Identificación de las personas que han trabajado en la elaboración de la norma.","Previsión de fechas de su futura aprobación."],"c":1,"tema":"III.1","ley":[{"t":"Real Decreto 931/2017, de la Memoria del Análisis de Impacto Normativo · artículo 3.2","f":"BOE-A-2017-13065","p":["2. La memoria abreviada deberá incluir, al menos, los siguientes apartados: oportunidad de la norma; identificación del título competencial prevalente; **listado de las normas que quedan derogadas**; impacto presupuestario y por razón de género, así como otros impactos detectados que se juzguen relevantes; descripción de la tramitación y consultas realizadas. También se incluirá una descripción de la forma en la que se analizarán, en su caso, los resultados de la aplicación de la norma de acuerdo con lo previsto en la letra j) del apartado 1 del artículo anterior. A este respecto la Guía Metodológica incluirá indicaciones del contenido preciso de la memoria abreviada."]}]},{"n":33,"q":"De acuerdo con la Ley Orgánica 6/2013, de 14 de noviembre, de creación de la Autoridad Independiente de Responsabilidad Fiscal, ¿antes de qué fecha la Autoridad Independiente de Responsabilidad Fiscal informará sobre el cumplimento de los objetivos de estabilidad presupuestaria y deuda pública del ejercicio en curso, así como de la regla de gasto de todas las Administraciones Públicas?","o":["15 de octubre.","1 de abril.","15 de abril.","15 de julio."],"c":3,"ley":[{"t":"Ley Orgánica 6/2013, de la Autoridad Independiente de Responsabilidad Fiscal · artículo 17","f":"BOE-A-2013-11935","p":["**Antes del 15 de julio de cada año**, la Autoridad Independiente de Responsabilidad Fiscal informará, considerando la ejecución presupuestaria y las medidas previstas en el año en curso y el inmediato anterior, sobre el cumplimento de los objetivos de estabilidad presupuestaria y deuda pública del ejercicio en curso así como de la regla de gasto de todas las Administraciones Públicas."]}]},{"n":34,"q":"La Actualización del Programa Nacional de Control de la Contaminación Atmosférica 2023-2030, ¿de cuántas medidas individuales se compone y en cuántos paquetes específicos se agrupan?","o":["57 medidas individuales agrupadas en 13 paquetes específicos.","60 medidas individuales agrupadas en 14 paquetes específicos.","61 medidas individuales agrupadas en 12 paquetes específicos.","57 medidas individuales agrupadas en 14 paquetes específicos."],"c":2,"tema":"III.3"},{"n":35,"q":"Según el artículo 125 del Real Decreto Legislativo 8/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley General de la Seguridad Social, ¿cada cuánto tiempo conocerá la Comisión de Seguimiento del Fondo de Reserva de la Seguridad Social de la evolución y composición del Fondo de Reserva?","o":["Semestralmente.","Anualmente.","Trimestralmente.","Bimestralmente."],"c":0,"tema":"III.4","ley":[{"t":"Texto refundido de la Ley General de la Seguridad Social (RDLeg 8/2015) · artículo 125.3","f":"BOE-A-2015-11724","p":["3. La Comisión de Seguimiento **conocerá semestralmente de la evolución y composición del Fondo de Reserva** de la Seguridad Social, para lo cual el Comité de Gestión, la Comisión Asesora de Inversiones y la Tesorería General de la Seguridad Social facilitarán información sobre tales extremos con carácter previo a las reuniones que mantenga dicha comisión."]}]},{"n":36,"q":"Según la Ley 22/2009, de 18 de diciembre, por la que se regula el sistema de financiación de las Comunidades Autónomas de régimen común y Ciudades con Estatuto de Autonomía y se modifican determinadas normas tributarias, ¿qué fondo opera como recurso de cierre del sistema?","o":["El Fondo de Cohesión Sanitaria.","El Fondo de Garantía Asistencial.","El Fondo de Suficiencia Global.","El Fondo de Garantía de los Servicios Públicos Fundamentales."],"c":2,"ley":[{"t":"Ley 22/2009, del sistema de financiación de las Comunidades Autónomas de régimen común · preámbulo","f":"BOE-A-2009-20375","p":["**El Fondo de Suficiencia Global opera como recurso de cierre del sistema**, asegurando que las necesidades globales de financiación de cada Comunidad en el año base se cubren con su capacidad tributaria, la transferencia del Fondo de Garantía y el propio Fondo de Suficiencia."]}]},{"n":37,"q":"De acuerdo con el Real Decreto 633/2025, de 15 de julio, por el que se aprueba la Estrategia Española de Apoyo Activo al Empleo 2025-2028, indique cuál de las siguientes opciones es un objetivo operativo:","o":["Promover la digitalización del Sistema Nacional de Empleo y el desarrollo de herramientas digitales de apoyo a la labor de los servicios públicos de empleo.","Promover la participación de las entidades colaboradoras de los servicios públicos de empleo.","Promover el acompañamiento integral a las empresas.","Promover la plena implementación de los servicios garantizados a las personas."],"c":0,"tema":"III.5","ley":[{"t":"Real Decreto 633/2025, Estrategia Española de Apoyo Activo al Empleo 2025-2028 · anexo (Estrategia), capítulo III, apartados 4 (objetivos estratégicos) y 5 (objetivos operativos)","f":"BOE-A-2025-14693","p":["4. Objetivos estratégicos","Objetivo estratégico 1. Promover la plena implementación de los servicios garantizados a las personas.","Objetivo estratégico 4. Promover el acompañamiento integral a las empresas.","Objetivo estratégico 6. Promover la participación de las entidades colaboradoras de los servicios públicos de empleo.","5. Objetivos operativos","**Objetivo operativo 5.2 Promover la digitalización del Sistema Nacional de Empleo** y el desarrollo de herramientas digitales de apoyo a la labor de los servicios públicos de empleo."]}]},{"n":38,"q":"¿Qué NO debe contener el modelo de gestión de contingencias migratorias extraordinarias para la infancia y la adolescencia migrante no acompañada, de acuerdo con lo establecido legalmente de acuerdo con la Ley Orgánica 4/2000, de 11 de enero, sobre derechos y libertades de los extranjeros en España y su integración social?","o":["El conjunto de criterios objetivos para la determinación, por el órgano competente de la Administración General del Estado, de cuál será la ubicación de las personas menores de edad extranjeras no acompañadas en las diferentes comunidades o ciudades autónomas.","La regulación del mecanismo de derivación de las personas menores de edad extranjeras no acompañadas a otras comunidades o ciudades autónomas.","Los criterios para la determinación del número de plazas por comunidad autónoma o ciudad autónoma, para atender a las personas menores de edad extranjeras no acompañadas en caso de derivación.","Un análisis de la situación de las familias de las personas menores de edad extranjeras no acompañadas."],"c":3,"tema":"III.6","ley":[{"t":"Ley Orgánica 4/2000, de derechos y libertades de los extranjeros en España · artículo 35 ter.1","f":"BOE-A-2000-544","p":["1. El Modelo de gestión de contingencias migratorias extraordinarias para la infancia y la adolescencia migrante no acompañada **contendrá**:","a) El conjunto de criterios objetivos para la determinación, por el órgano competente de la Administración General del Estado, de cuál será la ubicación de las personas menores de edad extranjeras no acompañadas en las diferentes comunidades o ciudades autónomas.","b) La regulación del mecanismo de derivación de las personas menores de edad extranjeras no acompañadas a otras comunidades o ciudades autónomas.","c) Los criterios para la determinación del número de plazas por comunidad autónoma o ciudad autónoma, para atender a las personas menores de edad extranjeras no acompañadas en caso de derivación."]}]},{"n":39,"q":"El V Plan de Gobierno Abierto, aprobado en 2025, contiene:","o":["Diez compromisos.","Seis compromisos.","Ocho compromisos.","Cuatro compromisos."],"c":0,"tema":"III.7"},{"n":40,"q":"De acuerdo con el artículo 6.2 del Real Decreto 389/2021, de 1 de junio, por el que se aprueba el Estatuto de la Agencia Española de Protección de Datos, ¿quién suscribe el informe técnico que da inicio al Proyecto de Circular?","o":["La persona titular de la Adjuntía a la Presidencia de la Agencia Española de Protección de Datos únicamente.","La persona titular de la Adjuntía con la aprobación de la persona titular de la Presidencia de la Agencia Española de Protección de Datos.","El Subdirector General o el Director de División correspondiente únicamente.","La persona titular de la Adjuntía a la Presidencia de la Agencia Española de Protección de Datos o el Subdirector General o el Director de División correspondiente."],"c":3,"tema":"III.8","ley":[{"t":"Real Decreto 389/2021, Estatuto de la Agencia Española de Protección de Datos · artículo 6.2","f":"BOE-A-2021-9175","p":["2. El Proyecto de Circular se iniciará mediante un informe técnico, suscrito por la **persona titular de la Adjuntía a la Presidencia de la Agencia Española de Protección de Datos o el Subdirector General o Director de División correspondiente**, que constará de las siguientes partes:"]}]},{"n":41,"q":"De acuerdo con la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, el derecho a la desconexión digital:","o":["Solo se reconoce al personal funcionario.","Garantiza el respeto al tiempo de descanso y a la intimidad personal y familiar fuera del tiempo de trabajo.","Impide cualquier comunicación empresarial fuera del horario laboral.","Es un principio meramente programático sin eficacia jurídica."],"c":1,"tema":"III.8","ley":[{"t":"Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales · artículo 88.1","f":"BOE-A-2018-16673","p":["1. Los trabajadores y los empleados públicos tendrán derecho a la desconexión digital a fin de garantizar, fuera del tiempo de trabajo legal o convencionalmente establecido, **el respeto de su tiempo de descanso, permisos y vacaciones, así como de su intimidad personal y familiar**."]}]},{"n":42,"q":"De acuerdo con el Real Decreto 675/2023, de 18 de julio, por el que se modifica el Real Decreto 1051/2013, de 27 de diciembre, por el que se regulan las prestaciones del Sistema para la Autonomía y Atención a la Dependencia, establecidas en la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, ¿qué cantidad de horas mensuales se establece de intensidad del servicio de ayuda a domicilio en el Grado II?","o":["De 20 a 37 horas mensuales.","De 65 a 94 horas mensuales.","De 42 a 68 horas mensuales.","De 38 a 64 horas mensuales."],"c":3,"ley":[{"t":"Real Decreto 1051/2013, de prestaciones del Sistema para la Autonomía y Atención a la Dependencia (redacción del Real Decreto 675/2023) · anexo II","f":"BOE-A-2013-13811","p":["Intensidad del servicio de ayuda a domicilio según grado de dependencia","– Grado I: De 20 a 37 horas mensuales.","– **Grado II: De 38 a 64 horas mensuales**.","– Grado III: De 65 a 94 horas mensuales."]}]},{"n":43,"q":"La Ley 4/2023, de 28 de febrero, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI, define el acoso discriminatorio como:","o":["Cualquier conducta realizada por razón de alguna de las causas de discriminación previstas en esta ley, con el objetivo o la consecuencia de atentar contra la dignidad de una persona o grupo en que se integra y de crear un entorno intimidatorio, hostil, degr
