<!-- Tema antes del primer pintado. Comparte la clave con Niblo: si alli esta
     en oscuro, aqui tambien. -->
<script>
(function(){
  try {
    var t = localStorage.getItem('recetas:tema');
    if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t);
  } catch (e) {}
})();
</script>

<link rel="preload" href="manrope.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family:"Manrope"; font-style:normal; font-weight:300 800; font-display:swap;
  src:url("manrope.woff2") format("woff2");
}
</style>

<style>
/* ========================================================================
   Sistema de diseño — el de Viajes: paleta slate/azul, Manrope única,
   tarjetas redondeadas, chips en pastilla y cabecera translúcida.
   ====================================================================== */
:root {
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.03);
  --sh-2:0 2px 10px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-3:0 12px 28px rgba(0,0,0,.10);
  --font-ui:'Manrope', system-ui, -apple-system, sans-serif;
  --font-titulo:'Manrope', system-ui, -apple-system, sans-serif;
  --font-code:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root, :root[data-tema="claro"] {
  --bg:#f8fafc; --bg-elev:#fff; --bg-soft:#f1f5f9; --bg-input:#fff;
  --text:#0f172a; --text-muted:#64748b; --text-inv:#fff;
  --line:#e2e8f0; --line-soft:#f1f5f9;
  --accent:#2563eb; --accent-2:#06b6d4; --accent-bg:#dbeafe;
  --focus:#2563eb; --danger:#dc2626;
  /* Semáforo del PDF: verde (solo BOE + estable), ámbar (solo BOE + revisar),
     rojo (actualizar), lila (sin correlato en el TAC) */
  --ok:#059669; --ok-bg:#dcfce7;
  --warn:#b45309; --warn-bg:#fef3c7;
  --hot:#b91c1c; --hot-bg:#fee2e2;
  --lila:#7c3aed; --lila-bg:#ede9fe;
  --azul:#1d4ed8; --azul-bg:#dbeafe;
}
:root[data-tema="oscuro"] {
  --bg:#0b1220; --bg-elev:#111a2e; --bg-soft:#1e293b; --bg-input:#111a2e;
  --text:#f1f5f9; --text-muted:#94a3b8; --text-inv:#0b1220;
  --line:#334155; --line-soft:#1e293b;
  --accent:#60a5fa; --accent-2:#22d3ee; --accent-bg:#1e3a5f;
  --focus:#93c5fd; --danger:#f87171;
  --ok:#34d399; --ok-bg:#064e3b;
  --warn:#fbbf24; --warn-bg:#4a3510;
  --hot:#fca5a5; --hot-bg:#4c1d1d;
  --lila:#c4b5fd; --lila-bg:#2e1f5e;
  --azul:#93c5fd; --azul-bg:#1e3a5f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]) {
    --bg:#0b1220; --bg-elev:#111a2e; --bg-soft:#1e293b; --bg-input:#111a2e;
    --text:#f1f5f9; --text-muted:#94a3b8; --text-inv:#0b1220;
    --line:#334155; --line-soft:#1e293b;
    --accent:#60a5fa; --accent-2:#22d3ee; --accent-bg:#1e3a5f;
    --focus:#93c5fd; --danger:#f87171;
    --ok:#34d399; --ok-bg:#064e3b;
    --warn:#fbbf24; --warn-bg:#4a3510;
    --hot:#fca5a5; --hot-bg:#4c1d1d;
    --lila:#c4b5fd; --lila-bg:#2e1f5e;
    --azul:#93c5fd; --azul-bg:#1e3a5f;
  }
}

/* ---- Color por bloque (solo el acento: el resto del sistema no cambia) -- */
[data-b="B1"] { --accent:#b45309; --accent-2:#f59e0b; --accent-bg:#fef3c7; }
[data-b="B2"] { --accent:#2563eb; --accent-2:#60a5fa; --accent-bg:#dbeafe; }
[data-b="B3"] { --accent:#15803d; --accent-2:#22c55e; --accent-bg:#dcfce7; }
[data-b="B4"] { --accent:#c2410c; --accent-2:#fb923c; --accent-bg:#ffedd5; }
[data-b="B5"] { --accent:#0e7490; --accent-2:#22d3ee; --accent-bg:#cffafe; }
[data-b="B6"] { --accent:#a21caf; --accent-2:#d946ef; --accent-bg:#fae8ff; }
:root[data-tema="oscuro"] [data-b="B1"] { --accent:#fbbf24; --accent-2:#fcd34d; --accent-bg:#422c0b; --on-accent:#111827; }
:root[data-tema="oscuro"] [data-b="B2"] { --accent:#60a5fa; --accent-2:#93c5fd; --accent-bg:#1e3a5f; --on-accent:#111827; }
:root[data-tema="oscuro"] [data-b="B3"] { --accent:#4ade80; --accent-2:#86efac; --accent-bg:#14361f; --on-accent:#111827; }
:root[data-tema="oscuro"] [data-b="B4"] { --accent:#fb923c; --accent-2:#fdba74; --accent-bg:#45260f; --on-accent:#111827; }
:root[data-tema="oscuro"] [data-b="B5"] { --accent:#22d3ee; --accent-2:#67e8f9; --accent-bg:#123b45; --on-accent:#111827; }
:root[data-tema="oscuro"] [data-b="B6"] { --accent:#e879f9; --accent-2:#f0abfc; --accent-bg:#3d1645; --on-accent:#111827; }
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]) [data-b="B1"] { --accent:#fbbf24; --accent-2:#fcd34d; --accent-bg:#422c0b; --on-accent:#111827; }
  :root:not([data-tema]) [data-b="B2"] { --accent:#60a5fa; --accent-2:#93c5fd; --accent-bg:#1e3a5f; --on-accent:#111827; }
  :root:not([data-tema]) [data-b="B3"] { --accent:#4ade80; --accent-2:#86efac; --accent-bg:#14361f; --on-accent:#111827; }
  :root:not([data-tema]) [data-b="B4"] { --accent:#fb923c; --accent-2:#fdba74; --accent-bg:#45260f; --on-accent:#111827; }
  :root:not([data-tema]) [data-b="B5"] { --accent:#22d3ee; --accent-2:#67e8f9; --accent-bg:#123b45; --on-accent:#111827; }
  :root:not([data-tema]) [data-b="B6"] { --accent:#e879f9; --accent-2:#f0abfc; --accent-bg:#3d1645; --on-accent:#111827; }
}

* { box-sizing:border-box; }
html, body { margin:0; padding:0; overflow-x:clip; }
html { -webkit-text-size-adjust:100%; }
body {
  font-family:var(--font-ui); background:var(--bg); color:var(--text);
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  padding-bottom:env(safe-area-inset-bottom);
}
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; }
.num { font-feature-settings:"tnum","ss01"; }
.muted { color:var(--text-muted); }
[hidden] { display:none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* ---- Cabecera ---------------------------------------------------------- */
header.topbar {
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line-soft);
  padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top));
}
.topbar-inner { max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:10px; }
.topbar-title {
  font-weight:700; letter-spacing:-.02em; font-size:17px;
  min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.topbar-spacer { flex:1; }
.icon-btn {
  border:1px solid var(--line); background:var(--bg-elev); color:var(--text);
  width:38px; height:38px; border-radius:var(--r-md); flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
  text-decoration:none;
}
.icon-btn:hover { transform:translateY(-1px); box-shadow:var(--sh-2); text-decoration:none; }
.icon-btn svg { width:18px; height:18px; }
.icon-btn.girando svg { animation:girar 1s linear infinite; }
@keyframes girar { to { transform:rotate(360deg); } }

main {
  max-width:1100px; margin:0 auto; padding:16px 16px 64px; width:100%;
  overflow-x:clip; animation:fadeIn .18s var(--ease);
}
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

/* ---- Tipografía de vista ---------------------------------------------- */
.titulo-grande {
  font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1.12;
  margin:10px 0 6px; padding-bottom:.08em;
  background-image:linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, #000 30%) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  overflow-wrap:break-word;
}
:root[data-tema="oscuro"] .titulo-grande {
  background-image:linear-gradient(135deg, color-mix(in srgb, var(--accent) 80%, #fff 20%) 0%, var(--accent) 100%);
}
@media (min-width:720px) { .titulo-grande { font-size:46px; letter-spacing:-.035em; } }
.view-sub { color:var(--text-muted); font-size:14px; margin:0 0 20px; }
h2.section-title { font-weight:700; letter-spacing:-.02em; font-size:20px; margin:32px 0 12px; }
h3.card-title { font-size:16px; font-weight:700; letter-spacing:-.01em; margin:0 0 10px; }

/* ---- Botones ----------------------------------------------------------- */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:42px; padding:0 18px; border:1px solid var(--line); background:var(--bg-elev); color:var(--text);
  border-radius:var(--r-pill); font-weight:600; font-size:14px; letter-spacing:-.01em;
  cursor:pointer; text-decoration:none;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
}
.btn:hover { transform:translateY(-1px); box-shadow:var(--sh-2); text-decoration:none; }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
.btn-primary {
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:var(--on-accent, #fff); border:none;
  box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 28%, transparent);
}
.btn-sm { height:32px; padding:0 12px; font-size:13px; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; }

/* ---- Chips y segmentado ------------------------------------------------ */
.chip-row {
  display:flex; gap:8px; overflow-x:auto; padding:2px; margin:0 -2px 16px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.chip-row::-webkit-scrollbar { display:none; }
.chip-row.wrap { flex-wrap:wrap; overflow:visible; }
.chip {
  flex-shrink:0; display:inline-flex; align-items:center; gap:7px;
  height:34px; padding:0 14px; background:var(--bg-elev); border:1px solid var(--line); color:var(--text-muted);
  border-radius:var(--r-pill); font-size:13px; font-weight:600; cursor:pointer;
  transition:all .18s var(--ease); white-space:nowrap;
}
.chip:hover { color:var(--text); }
.chip.active {
  background:var(--accent); border-color:var(--accent); color:var(--on-accent, #fff);
  box-shadow:0 4px 12px color-mix(in srgb, var(--accent) 22%, transparent);
}
.chip .badge {
  font-size:11px; font-weight:600; font-feature-settings:"tnum";
  background:color-mix(in srgb, var(--text) 8%, transparent); padding:2px 7px; border-radius:var(--r-pill);
}
.chip.active .badge { background:rgba(255,255,255,.22); color:var(--on-accent, #fff); }
.chip.peq { height:28px; padding:0 11px; font-size:12px; }

.seg {
  display:flex; gap:2px; padding:3px; margin:0 0 20px;
  background:var(--bg-soft); border:1px solid var(--line); border-radius:var(--r-pill);
}
.seg button {
  flex:1; min-width:0; border:none; background:transparent; color:var(--text-muted);
  font-size:14px; font-weight:600; min-height:40px; border-radius:var(--r-pill); cursor:pointer;
  transition:background .15s, color .15s;
}
.seg button.on { background:var(--bg-elev); color:var(--text); box-shadow:var(--sh-1); }

/* ---- Etiquetas (vigencia, fuente, bloque) ------------------------------ */
.tag {
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  padding:3px 9px; border-radius:var(--r-pill); line-height:1.3;
  background:var(--bg-soft); color:var(--text-muted);
}
.tag.ok   { background:var(--ok-bg);   color:var(--ok); }
.tag.warn { background:var(--warn-bg); color:var(--warn); }
.tag.hot  { background:var(--hot-bg);  color:var(--hot); }
.tag.lila { background:var(--lila-bg); color:var(--lila); }
.tag.azul { background:var(--azul-bg); color:var(--azul); }
.tag.acc  { background:var(--accent-bg); color:var(--accent); }
.tags { display:flex; flex-wrap:wrap; gap:6px; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.hot { background:var(--hot); }

/* ---- Tarjetas ---------------------------------------------------------- */
.card {
  background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--sh-1); padding:20px; min-width:0;
}
.card + .card { margin-top:14px; }
/* En rejilla el hueco lo pone gap, no el margen de apilado */
.grid > .card, .ficha > .card { margin-top:0; }
.card.interactive { cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s var(--ease); }
.card.interactive:hover { transform:translateY(-2px); box-shadow:var(--sh-2); }

/* Hero del inicio */
.hero { padding:22px 20px; }
.prog-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.prog-row .lbl { font-size:13px; font-weight:600; color:var(--text-muted); }
.bar { flex:1; min-width:160px; height:8px; background:var(--bg-soft); border-radius:99px; overflow:hidden; }
.bar > div { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:99px; transition:width .4s var(--ease); }
.prog-row .pct { font-weight:800; font-size:18px; color:var(--accent); font-feature-settings:"tnum"; }
.kpis { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-top:16px; }
@media (min-width:720px) { .kpis { grid-template-columns:repeat(4, minmax(0,1fr)); } }
.kpi { background:var(--bg-soft); border-radius:var(--r-md); padding:12px 14px; min-width:0; }
.kpi .k { font-size:11.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; display:flex; align-items:center; gap:6px; }
.kpi .v { font-size:24px; font-weight:800; letter-spacing:-.02em; font-feature-settings:"tnum"; }
.kpi .s { font-size:12px; color:var(--text-muted); }

/* Rejillas */
.grid { display:grid; gap:16px; grid-template-columns:minmax(0,1fr); }
@media (min-width:720px) { .grid.g2 { grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (min-width:720px) { .grid.g3 { grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (min-width:1000px) { .grid.g3 { grid-template-columns:repeat(3, minmax(0,1fr)); } }

/* Tarjeta de bloque */
.bloque-rom {
  width:48px; height:48px; border-radius:var(--r-md); flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--accent-bg); color:var(--accent); font-weight:800; font-size:18px; letter-spacing:-.02em;
}
.bloque-sub { font-size:12.5px; color:var(--text-muted); font-weight:600; }

/* Cabecera de bloque */
.bloque-head { display:flex; align-items:center; gap:14px; margin:6px 0 18px; }
.bloque-head .bloque-rom { width:56px; height:56px; font-size:20px; }
.bloque-head h1 { margin:0; font-size:24px; font-weight:700; letter-spacing:-.025em; line-height:1.2; }
@media (min-width:720px) { .bloque-head h1 { font-size:30px; } }

/* Tarjeta de tema */
.prog-mini { display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-muted); font-weight:600; }

/* Detalle del tema */
.ficha { display:grid; gap:14px; grid-template-columns:minmax(0,1fr); }
@media (min-width:860px) { .ficha { grid-template-columns:repeat(2, minmax(0,1fr)); } .ficha .ancho { grid-column:1 / -1; } }
.ficha-k {
  font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-muted); margin:0 0 8px; display:flex; align-items:center; gap:8px;
}
.ficha-v { font-size:15px; line-height:1.55; overflow-wrap:break-word; }
.ficha-v a { font-weight:600; }
.verif {
  font-size:11px; font-weight:700; color:var(--warn); background:var(--warn-bg);
  padding:1px 6px; border-radius:var(--r-pill); white-space:nowrap; cursor:help;
}
.nota-destacada { border-left:4px solid var(--accent); background:color-mix(in srgb, var(--accent-bg) 45%, var(--bg-elev)); }
.secciones { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.secciones button {
  width:100%; text-align:left; border:none; background:transparent; cursor:pointer;
  padding:9px 10px; border-radius:var(--r-sm); font-size:14px; color:var(--text);
}
.secciones button:hover { background:var(--bg-soft); }
.secciones .sub { padding-left:26px; color:var(--text-muted); font-size:13.5px; }

/* Zona de carga */
.drop {
  border:2px dashed var(--line); border-radius:var(--r-lg); padding:26px 18px; text-align:center;
  background:var(--bg-elev); cursor:pointer; transition:border-color .18s, background .18s;
}
.drop:hover, .drop.encima { border-color:var(--accent); background:color-mix(in srgb, var(--accent-bg) 40%, var(--bg-elev)); }
.drop .ico { font-size:28px; }
.drop .t { font-weight:700; margin-top:6px; }
.drop .s { font-size:13px; color:var(--text-muted); margin-top:4px; }
code, .code { font-family:var(--font-code); font-size:.86em; background:var(--bg-soft); padding:1px 6px; border-radius:6px; }
.cargados { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; }
.cargado {
  display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 11px;
  background:var(--bg-soft); border:1px solid var(--line); border-radius:var(--r-pill); font-size:12.5px; font-weight:600;
}
.cargado button {
  width:22px; height:22px; border-radius:50%; border:none; cursor:pointer;
  background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger); font-weight:700; line-height:1;
}

/* ---- Hub: búsqueda, cronología, glosario, flashcards, test, progreso ---- */
.toolbar { margin-bottom:12px; }
.input {
  width:100%; min-width:0; border:1px solid var(--line); background:var(--bg-input); color:var(--text);
  border-radius:var(--r-md); padding:11px 14px; font-size:16px;
  transition:border .18s, box-shadow .18s;
}
.input:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.stats-line { font-size:12.5px; color:var(--text-muted); font-weight:600; margin:0 0 10px; }
.res {
  padding:12px 14px; border:1px solid var(--line-soft); border-radius:var(--r-md);
  background:var(--bg-elev); margin-bottom:8px; cursor:pointer; transition:border-color .15s, box-shadow .15s;
}
.res:hover { border-color:var(--line); box-shadow:var(--sh-1); }
.res-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.res-tit { font-weight:700; font-size:14.5px; letter-spacing:-.01em; }
.res-txt { font-size:13.5px; color:var(--text-muted); margin-top:4px; line-height:1.5; }
mark { background:color-mix(in srgb, #facc15 45%, transparent); color:inherit; border-radius:3px; padding:0 1px; }

.tl { position:relative; padding-left:18px; }
.tl::before { content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line); border-radius:2px; }
.tl-item { position:relative; padding:10px 12px; margin-bottom:8px; border-radius:var(--r-md); background:var(--bg-elev); border:1px solid var(--line-soft); cursor:pointer; }
.tl-item::before { content:""; position:absolute; left:-17px; top:16px; width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--bg); }
.tl-y { font-weight:800; color:var(--accent); font-feature-settings:"tnum"; margin-right:8px; }
.tl-cons { font-size:13px; color:var(--text-muted); margin-top:3px; }

.letras { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px; }
.letra {
  min-width:32px; height:32px; padding:0 8px; border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--bg-elev); font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-muted);
}
.letra.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.letra:disabled { opacity:.3; cursor:default; }

.fc-ctrl { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:12px; font-size:13px; color:var(--text-muted); }
.fc-ctrl b { color:var(--text); font-feature-settings:"tnum"; }
.fc { perspective:1200px; cursor:pointer; margin:6px 0 14px; }
.fc-in { position:relative; min-height:230px; transition:transform .5s var(--ease); transform-style:preserve-3d; }
.fc.volteada .fc-in { transform:rotateY(180deg); }
.fc-cara {
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:var(--r-lg); padding:24px 22px; display:flex; flex-direction:column; justify-content:center; gap:10px;
  border:1px solid var(--line); background:var(--bg-elev); box-shadow:var(--sh-2); overflow:auto;
}
.fc-cara.atras { transform:rotateY(180deg); background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border:none; }
.fc-q { font-size:19px; font-weight:700; letter-spacing:-.015em; line-height:1.35; }
.fc-a { font-size:16px; line-height:1.55; }
.fc-hint { font-size:12px; color:var(--text-muted); }
.fc-btns { display:flex; gap:10px; }
.fc-btns .btn { flex:1; }
.btn-no { color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn-si { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); }

.test-cfg { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.test-cfg select { border:1px solid var(--line); background:var(--bg-input); border-radius:var(--r-md); padding:8px 12px; font-size:15px; }
.q-meta { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--text-muted); font-weight:600; margin-bottom:8px; }
.q-txt { font-size:17px; font-weight:700; line-height:1.4; letter-spacing:-.01em; margin-bottom:14px; }
.q-opts { display:flex; flex-direction:column; gap:8px; }
.q-opt {
  display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
  padding:12px 14px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--bg-elev);
  cursor:pointer; font-size:15px; line-height:1.4; transition:border-color .15s, background .15s;
}
.q-opt:hover:not(:disabled) { border-color:var(--accent); }
.q-opt .l {
  width:26px; height:26px; border-radius:50%; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
  background:var(--bg-soft); font-weight:800; font-size:13px;
}
.q-opt.bien { border-color:var(--ok); background:var(--ok-bg); }
.q-opt.mal  { border-color:var(--danger); background:var(--hot-bg); }
.q-opt:disabled { cursor:default; }
.q-fb { margin-top:12px; padding:12px 14px; border-radius:var(--r-md); font-size:14px; line-height:1.5; }
.q-fb.bien { background:var(--ok-bg); color:var(--text); }
.q-fb.mal  { background:var(--hot-bg); color:var(--text); }
.resultado { text-align:center; padding:12px 0; }
.resultado .big { font-size:56px; font-weight:800; letter-spacing:-.04em; color:var(--accent); font-feature-settings:"tnum"; }

table.tabla { width:100%; border-collapse:collapse; font-size:13.5px; }
.tabla th { text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); padding:8px 8px; border-bottom:2px solid var(--line); }
.tabla td { padding:9px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
.tabla td.n, .tabla th.n { text-align:right; font-feature-settings:"tnum"; white-space:nowrap; }
.tabla tr.clic { cursor:pointer; }
.tabla tr.clic:hover td { background:var(--bg-soft); }
.tabla-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* Guía */
.guia p, .guia li { font-size:14.5px; line-height:1.6; }
.guia ul { padding-left:20px; margin:8px 0; }
.guia li { margin-bottom:6px; }
.guia .tabla td { font-size:13.5px; }
.lista-temas { display:flex; flex-wrap:wrap; gap:5px; }
.lista-temas button {
  border:1px solid var(--line); background:var(--bg-elev); border-radius:var(--r-pill);
  padding:3px 10px; font-size:12.5px; font-weight:700; cursor:pointer; font-feature-settings:"tnum";
}
.lista-temas button:hover { border-color:var(--accent); color:var(--accent); }
pre.formato {
  font-family:var(--font-code); font-size:12px; line-height:1.5; background:var(--bg-soft);
  border-radius:var(--r-md); padding:14px; overflow-x:auto; margin:8px 0 0;
}

/* Vacío */
.empty { text-align:center; padding:40px 20px; color:var(--text-muted); }
.empty .ico {
  display:inline-flex; align-items:center; justify-content:center; width:60px; height:60px;
  border-radius:50%; background:var(--bg-soft); font-size:26px; margin-bottom:12px;
}
.empty h3 { color:var(--text); font-weight:700; margin:4px 0; font-size:16px; }
.empty p { margin:0 auto; font-size:14px; max-width:340px; }

/* Toast */
.toast-box {
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  z-index:100; pointer-events:none; display:flex; flex-direction:column; gap:8px; align-items:center;
  width:max-content; max-width:calc(100vw - 32px);
}
.toast {
  background:var(--text); color:var(--text-inv); padding:10px 16px; border-radius:var(--r-pill);
  font-size:14px; box-shadow:var(--sh-3); animation:toastIn .25s var(--ease); text-align:center;
}
.toast.error { background:var(--danger); color:#fff; }
@keyframes toastIn { from { transform:translateY(20px); opacity:0; } to { transform:none; opacity:1; } }

/* Editor del tema */
.ed-cab { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:6px 0 16px; }
.ed-tit { margin:2px 0 0; font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.25; }
.ed-acc { display:flex; align-items:center; gap:10px; }
.ed-ayuda { font-size:13px; margin:0 0 12px; line-height:1.5; }
.ed-item { display:flex; flex-direction:column; gap:8px; padding:14px 16px; }
.card.ed-item + .card.ed-item { margin-top:10px; }
.ed-item.sub { margin-left:22px; border-left:3px solid var(--accent-bg); }
.ed-item-cab { display:flex; align-items:center; gap:8px; }
.ed-num { font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); }
.ed-fila { display:flex; gap:8px; flex-wrap:wrap; }
.ed-fila > .input { flex:1 1 220px; }
.ed-fila > .input.peq, .input.peq { flex:0 1 180px; }
select.input { padding:10px 12px; }
textarea.input { resize:vertical; line-height:1.5; font-family:var(--font-ui); }
.ed-ops { display:flex; flex-direction:column; gap:6px; }
.ed-op { display:flex; align-items:center; gap:8px; }
.ed-op input[type=radio] { width:20px; height:20px; accent-color:var(--ok); flex-shrink:0; }
.ed-op .l { font-weight:800; font-size:13px; width:16px; color:var(--text-muted); }
.ed-op .input { flex:1; }
.icon-mini {
  width:30px; height:30px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--bg-elev);
  cursor:pointer; font-size:13px; color:var(--text-muted);
}
.icon-mini:disabled { opacity:.35; cursor:default; }
.icon-mini.peligro { color:var(--danger); }
details.importar { margin-top:14px; }
details.importar summary { cursor:pointer; font-size:13.5px; color:var(--text-muted); font-weight:600; margin-bottom:10px; text-align:center; }

/* Lectura */
.lectura { max-width:760px; }
.lectura h2 { font-size:22px; letter-spacing:-.02em; margin:30px 0 8px; scroll-margin-top:80px; }
.lectura h3 { font-size:18px; margin:22px 0 6px; color:var(--accent); }
.lectura section { scroll-margin-top:80px; }
.lectura p, .lectura li { font-size:16px; line-height:1.7; }
.lectura ul, .lectura ol { padding-left:22px; }
.lectura-indice { margin-bottom:8px; }
.gl-linea { margin:0 0 8px; font-size:14.5px; line-height:1.55; }

/* ===== Página de estudio del tema ===== */
.hero-tema {
  position:relative; overflow:hidden; color:#fff; border-radius:var(--r-lg); padding:28px 24px 24px; margin:8px 0 20px;
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent-2) 55%, transparent) 0%, transparent 55%),
    linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, #0b1220) 0%, color-mix(in srgb, var(--accent) 45%, #0b1220) 100%);
  box-shadow:0 18px 40px color-mix(in srgb, var(--accent) 28%, transparent);
}
:root[data-tema="oscuro"] .hero-tema {
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent) 35%, transparent) 0%, transparent 55%),
    linear-gradient(135deg, color-mix(in srgb, var(--accent) 42%, #0b1220) 0%, color-mix(in srgb, var(--accent) 18%, #0b1220) 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]) .hero-tema {
    background:
      radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent) 35%, transparent) 0%, transparent 55%),
      linear-gradient(135deg, color-mix(in srgb, var(--accent) 42%, #0b1220) 0%, color-mix(in srgb, var(--accent) 18%, #0b1220) 100%);
  }
}
.hero-sup { font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.85; }
.hero-num { font-size:13px; font-weight:600; opacity:.9; margin-top:6px; }
.hero-tema h1 { font-size:28px; line-height:1.15; letter-spacing:-.03em; margin:6px 0 8px; font-weight:800; }
@media (min-width:720px) { .hero-tema { padding:36px 34px 30px; } .hero-tema h1 { font-size:38px; } }
.hero-epi { margin:-4px 0 10px; font-size:14px; line-height:1.5; font-weight:600; opacity:.95; max-width:760px; }
.epi-oficial { margin:0 0 14px; padding:10px 14px; border-left:3px solid var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent); border-radius:0 10px 10px 0; font-size:14.5px; line-height:1.5; font-weight:500; }
.epi-oficial span { display:block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:3px; }
.hero-sub { margin:0 0 12px; font-size:15px; line-height:1.55; opacity:.92; font-style:italic; max-width:760px; }
.hero-chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
.hero-chips span { font-size:12.5px; font-weight:600; padding:5px 12px; border-radius:var(--r-pill); background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28); backdrop-filter:blur(4px); }
.hero-acc { display:flex; flex-wrap:wrap; gap:8px; }
.hero-btn { background:rgba(255,255,255,.14); color:#fff; border-color:rgba(255,255,255,.3); }
.hero-btn:hover { background:rgba(255,255,255,.24); }

.estudio { display:grid; grid-template-columns:minmax(0,1fr); gap:20px; align-items:start; }
@media (min-width:1000px) { .estudio { grid-template-columns:minmax(0,1fr) 290px; } }
.estudio-lateral { display:none; position:sticky; top:76px; max-height:calc(100dvh - 92px); overflow:auto; padding:18px; }
@media (min-width:1000px) { .estudio-lateral { display:block; } .fab-herr { display:none !important; } }
.lat-cab { padding-bottom:10px; border-bottom:2px solid var(--accent); margin-bottom:6px; }
.lat-sup { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); font-weight:700; }
.lat-tit { font-size:20px; font-weight:800; color:var(--accent); letter-spacing:-.02em; }
.lat-k { display:block; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin:16px 0 8px; }
.lat-pct { display:flex; justify-content:space-between; font-size:12px; margin-top:6px; }
.lat-pct b { color:var(--accent); }
.buscar-tema .input { padding:9px 12px; font-size:15px; }
.buscar-nav { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; }
.herr-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.herr {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:68px;
  border:1px solid var(--line); background:var(--bg-soft); border-radius:var(--r-md); cursor:pointer;
  font-size:12.5px; font-weight:600; color:var(--text); padding:8px 6px; text-align:center;
  transition:transform .15s var(--ease), box-shadow .15s, border-color .15s, background .15s;
}
.herr:hover { transform:translateY(-1px); box-shadow:var(--sh-2); border-color:var(--accent); background:var(--bg-elev); }
.herr-ico { font-size:20px; line-height:1; }
.practica { grid-column:1 / -1; border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background:color-mix(in srgb, var(--accent-bg) 45%, var(--bg-elev)); border-radius:var(--r-md); padding:10px; }
.practica-k { font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
.practica .herr { background:var(--bg-elev); }
.lat-indice { list-style:none; margin:0; padding:0; font-size:13.5px; }
.lat-indice ul { list-style:none; padding-left:16px; margin:0; }
.lat-indice button { border:none; background:none; cursor:pointer; text-align:left; width:100%; padding:6px 6px; border-radius:var(--r-sm); color:var(--text); font-size:13.5px; line-height:1.35; }
.lat-indice ul button { color:var(--text-muted); font-size:12.5px; }
.lat-indice button:hover { background:var(--bg-soft); }
.lat-indice .n { color:var(--accent); font-weight:700; margin-right:2px; }
.ok-mini { color:var(--ok); font-weight:800; }

.indice-tema { padding:20px 22px; margin-bottom:14px; }
.indice-tema .ficha-k { color:var(--accent); }
.indice-tema ol { list-style:none; margin:0; padding:0; columns:2 260px; column-gap:28px; }
.indice-tema li { break-inside:avoid; }
.indice-tema ul { list-style:none; padding-left:22px; margin:0 0 4px; }
.indice-tema button { border:none; background:none; cursor:pointer; text-align:left; padding:5px 0; font-size:15px; color:var(--text); line-height:1.4; }
.indice-tema ul button { font-size:13.5px; color:var(--text-muted); padding:3px 0; }
.indice-tema button:hover { color:var(--accent); }
.indice-tema .n { color:var(--accent); font-weight:800; font-feature-settings:"tnum"; margin-right:4px; }
.estudio-barra { display:flex; gap:8px; justify-content:flex-end; margin:0 0 10px; }

.card.ap { padding:0; overflow:hidden; transition:box-shadow .2s, border-color .2s; }
.card.ap + .card.ap { margin-top:12px; }
.ap-cab { display:flex; align-items:center; gap:12px; padding:16px 18px; cursor:pointer; }
.ap-num { font-size:13px; font-weight:800; color:var(--text-muted); font-feature-settings:"tnum"; min-width:20px; }
.ap-tit { flex:1; min-width:0; margin:0; font-size:18px; font-weight:700; letter-spacing:-.015em; line-height:1.3; color:var(--accent); }
@media (min-width:720px) { .ap-tit { font-size:20px; } }
.ap-rep {
  flex-shrink:0; border:1px solid var(--line); background:var(--bg-soft); color:var(--text-muted);
  font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:var(--r-pill); cursor:pointer; white-space:nowrap;
}
.ap-rep:hover { border-color:var(--ok); color:var(--ok); }
.ap-tog {
  flex-shrink:0; width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; color:#fff; font-size:12px;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); transition:transform .2s var(--ease);
  box-shadow:0 4px 12px color-mix(in srgb, var(--accent) 30%, transparent);
}
.ap.abierto .ap-tog { transform:rotate(90deg); }
.ap-cuerpo { display:none; padding:4px 22px 22px 50px; border-top:2px solid var(--accent); margin:0 18px; padding-left:32px; }
.ap.abierto .ap-cuerpo { display:block; }
.ap-cuerpo p, .ap-cuerpo li { font-size:16px; line-height:1.75; color:var(--text); }
.ap-cuerpo p { text-align:justify; hyphens:auto; }
.ap-cuerpo ul, .ap-cuerpo ol { padding-left:22px; }
.ap-sub { scroll-margin-top:84px; }
/* Texto literal de la norma */
.ap-cuerpo blockquote.literal {
  margin:10px 0 16px; padding:12px 16px 4px; border-left:4px solid var(--accent);
  background:color-mix(in srgb, var(--accent-bg) 28%, var(--bg-elev)); border-radius:0 var(--r-md) var(--r-md) 0;
}
.ap-cuerpo blockquote.literal p { text-align:left; font-size:15.5px; line-height:1.7; margin:0 0 10px; }
.ap-cuerpo blockquote.literal p:first-child strong:first-child { color:var(--accent); }
/* Subtítulos dentro de un apartado («### » y «#### ») */
.ap-cuerpo h4.ap-h { font-size:17px; font-weight:700; letter-spacing:-.01em; color:var(--accent); margin:26px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line); }
.ap-cuerpo h4.ap-h:first-child { margin-top:12px; }
.ap-cuerpo h5.ap-h2 { font-size:15.5px; font-weight:700; color:var(--text); margin:18px 0 6px; }
/* Recuadros: «!> » idea clave, «?> » trampa de examen */
.ap-cuerpo .ap-caja { margin:12px 0 16px; padding:10px 14px; border-radius:var(--r-md); border:1px solid var(--line); }
.ap-cuerpo .ap-caja p { margin:0 0 6px; text-align:left; font-size:15px; line-height:1.6; }
.ap-cuerpo .ap-caja p:last-child { margin-bottom:0; }
.ap-cuerpo .ap-caja.clave { background:color-mix(in srgb, var(--accent-bg) 45%, var(--bg-elev)); border-color:color-mix(in srgb, var(--accent) 35%, transparent); }
.ap-cuerpo .ap-caja.trampa { background:var(--warn-bg); border-color:color-mix(in srgb, var(--warn) 40%, transparent); }
.ap-cuerpo .ap-caja.trampa strong:first-child { color:var(--warn); }
.ap-cuerpo li.sub { margin-left:22px; list-style-type:circle; }
.ap-cuerpo .ap-caja.ap-guia { background:var(--bg-elev); border-left:4px solid var(--accent); }
.ap-cuerpo .ap-caja.ap-guia strong:first-child { color:var(--accent); }
.ap-cuerpo .ap-caja.ap-ficha { padding:0; overflow:hidden; background:var(--bg-elev); }
.ap-cuerpo .ap-caja.ap-ficha::before { content:"FICHA"; display:block; padding:5px 14px; font-size:11.5px; font-weight:700; letter-spacing:.08em; color:var(--text-muted); background:color-mix(in srgb, var(--line) 45%, transparent); }
.ap-cuerpo .fi-fila { display:grid; grid-template-columns:8.5em 1fr; gap:10px; padding:7px 14px; border-top:1px solid var(--line); font-size:15px; line-height:1.55; }
.ap-cuerpo .fi-k { font-weight:700; }
.ap-cuerpo .fi-v ul { margin:2px 0 0; padding-left:18px; }
.ap-cuerpo .fi-v li { margin:1px 0; font-size:15px; line-height:1.55; }
.ap-cuerpo .fi-fila.ojo { background:var(--warn-bg); }
.ap-cuerpo .fi-fila.ojo .fi-k { color:var(--warn); }
.ap-cuerpo .ap-caja.ap-quiz { background:var(--bg-elev); border-left:4px solid var(--warn); }
.ap-cuerpo .ap-quiz strong:first-child { color:var(--warn); }
.ap-cuerpo .qz-ops { display:flex; flex-direction:column; gap:6px; margin:8px 0; }
.ap-cuerpo .qz-op { display:flex; gap:6px; align-items:flex-start; text-align:left; width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--bg); color:var(--text); font:inherit; font-size:15px; line-height:1.5; cursor:pointer; }
.ap-cuerpo .qz-op:hover:not([disabled]) { border-color:var(--accent); }
.ap-cuerpo .qz-op .qz-l { font-weight:700; }

mark.busq { background:color-mix(in srgb, #facc15 50%, transparent); border-radius:3px; }

/* Resaltados: cinco colores; sin color guardado (los antiguos), rosa. */

.barra-resaltar {
  position:fixed; z-index:60; display:flex; align-items:center; gap:6px; padding:5px 6px 5px 5px;
  border-radius:var(--r-pill); background:var(--text); color:var(--text-inv); box-shadow:var(--sh-3);
}
.barra-resaltar .btn-resaltar { border:none; border-radius:var(--r-pill); padding:7px 12px; font-weight:700; font-size:13px; cursor:pointer;
  background:transparent; color:inherit; display:inline-flex; align-items:center; gap:7px; }
.barra-resaltar .btn-resaltar i { width:12px; height:12px; border-radius:50%; background:var(--rc); }

.barra-resaltar .res-col.on { border-color:var(--text-inv); box-shadow:0 0 0 2px var(--rc); }
.fab-herr {
  position:fixed; right:16px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:35;
  display:inline-flex; align-items:center; gap:8px; height:52px; padding:0 18px; border:none; border-radius:var(--r-pill); cursor:pointer;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; font-weight:800; font-size:15px;
  box-shadow:0 12px 28px color-mix(in srgb, var(--accent) 38%, transparent);
}

/* Panel lateral / hoja inferior */
.panel-fondo { position:fixed; inset:0; z-index:70; background:rgba(2,6,23,.45); opacity:0; transition:opacity .2s; }
.panel-fondo.on { opacity:1; }
.panel {
  position:fixed; z-index:71; background:var(--bg); display:flex; flex-direction:column; box-shadow:var(--sh-3);
  left:0; right:0; bottom:0; max-height:88dvh; border-radius:22px 22px 0 0; transform:translateY(100%); transition:transform .22s var(--ease);
  padding-bottom:env(safe-area-inset-bottom);

}
.panel-asa { width:42px; height:5px; border-radius:99px; background:var(--line); margin:8px auto 0; }

.lateral-movil .lat-cab { display:none; }

.res-item { display:flex; gap:8px; align-items:flex-start; margin-bottom:10px; }
.res-ir { flex:1; display:flex; flex-direction:column; gap:4px; text-align:left; border:1px solid var(--line); background:var(--bg-elev); border-radius:var(--r-md); padding:10px 12px; cursor:pointer; font-size:14px; line-height:1.5; }

.anillos { display:flex; justify-content:space-around; gap:10px; margin:4px 0 16px; }
.anillo {
  --p:0; width:96px; height:96px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(closest-side, var(--bg) 78%, transparent 79% 100%), conic-gradient(var(--accent) calc(var(--p) * 1%), var(--bg-soft) 0);
}
.anillo span { font-size:20px; font-weight:800; font-feature-settings:"tnum"; }

.lista-check { list-style:none; padding:0; margin:0; }

.hist { display:flex; flex-direction:column; gap:8px; }
.hist-fila { display:grid; grid-template-columns:56px 1fr 44px 70px; align-items:center; gap:8px; font-size:12.5px; }
.hist-bar { height:8px; border-radius:99px; background:var(--bg-soft); overflow:hidden; }

.mapa { overflow-x:auto; }
.mapa-raiz { display:inline-block; font-weight:800; padding:10px 16px; border-radius:var(--r-md); color:#fff; background:linear-gradient(135deg, var(--accent), var(--accent-2)); margin-bottom:12px; }
.mapa ul { list-style:none; margin:0; padding-left:22px; position:relative; }
.mapa ul::before { content:""; position:absolute; left:8px; top:0; bottom:14px; width:2px; background:var(--line); }

.mapa-nodo { display:inline-flex; align-items:center; gap:8px; border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background:var(--bg-elev); border-radius:var(--r-md); padding:7px 12px; font-weight:700; font-size:14px; cursor:pointer; color:var(--text); text-align:left; }
.mapa-nodo .n { width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:var(--accent-bg); color:var(--accent); font-size:12px; }

/* Estado de sincronización (como la píldora de Viajes) */
.sync-pill {
  display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px; flex-shrink:0;
  border:1px solid var(--line); background:var(--bg-elev); border-radius:var(--r-pill);
  font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; white-space:nowrap;
}

.sync-pill[data-estado="ok"] .dot { background:var(--ok); }
.sync-pill[data-estado="sync"] .dot { background:var(--accent); animation:latido 1s ease-in-out infinite; }
.sync-pill[data-estado="offline"] .dot { background:var(--warn); }
.sync-pill[data-estado="error"] .dot, .sync-pill[data-estado="sesion"] .dot { background:var(--danger); }
.sync-pill[data-estado="error"], .sync-pill[data-estado="sesion"] { color:var(--danger); }

@media (max-width:560px) {
  .sync-pill { width:38px; height:38px; padding:0; justify-content:center; border-radius:var(--r-md); }

}

}

.mod-grid > .card, .tema-grid > .card { margin-top:0; }
.mod-card .bar, .tema2 .bar, .temas-barra .bar { flex:none; min-width:0; }

/* ---- Bloque: cabecera, barra y tarjetas de tema --------------------------- */

.temas-barra { display:flex; align-items:center; gap:14px; padding:14px 18px; margin-bottom:14px; }

.real-checks { display:flex; flex-direction:column; gap:6px; }

.real-dlg-pie { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap; }
.real-veredicto { font-weight:700; margin:8px 0 0; }

<script type="application/json" id="datos-embebidos">{"_format":"gestion_hub_config","_version":2,"_exportedAt":"2026-10-04T12:00:00.000Z","ajustes":null,"temas":{"B1T02":{"id":"B1T02","group":"B1","number":2,"codigo":"I.2","title":"Derechos y deberes fundamentales. Su garantía y suspensión. El Defensor del Pueblo.","subtitle":"Cuatro preguntas: I. Qué derechos y deberes hay (arts. 10-52) · II. Cómo se protegen (art. 53, LJCA, habeas corpus y LOTC) · III. Cuándo pueden suspenderse (arts. 55 y 116, LO 4/1981 y LECrim) · IV. Quién vela por ellos (Defensor del Pueblo). Cada artículo: texto literal del BOE y ficha.","etiquetas":["Título I CE","Art. 53: garantías","Art. 55: suspensión","Art. 116","LO 4/1981","LO 3/1981","Defensor del Pueblo","Amparo","LJCA 114-122","Habeas corpus","LOTC: amparo","Ley 36/1985","LECrim: art. 55.2"],"sections":[{"id":"s0","title":"Mapa del tema: cuatro preguntas","body":"**Epígrafe oficial** (BOE-A-2025-26262, anexo VII, Bloque I, tema 2):\n> 2. Derechos y deberes fundamentales. Su garantía y suspensión. El Defensor del Pueblo.\n\n### El hilo conductor\n\nEl epígrafe se lee como **cuatro preguntas encadenadas**. Cada una es un bloque de los apuntes:\n\n| Bloque | Pregunta | Constitución | Leyes de desarrollo |\n|---|---|---|---|\n| **I** | ¿Qué derechos y deberes hay? | Título I, arts. 10 a 52 | — |\n| **II** | ¿Cómo se protegen? | Arts. 53 y 54; 81, 86, 161, 162, 167-169 | LJCA (114-122), LO 6/1984 (*habeas corpus*), LOTC (41-58) |\n| **III** | ¿Cuándo pueden suspenderse? | Arts. 55 y 116 | LO 4/1981 y LECrim |\n| **IV** | ¿Quién vela por ellos? | Art. 54 | LO 3/1981 y Ley 36/1985 |\n\n!> **La idea que une los cuatro bloques:** el **lugar** que ocupa un derecho en el Título I decide **cómo se protege** (bloque II) y **si puede suspenderse** (bloque III). Por eso cada ficha del bloque I termina en la casilla «Protección», que enlaza con los bloques II y III.\n\n### Cómo está escrito cada apartado\n\nSiempre en el mismo orden:\n1. **Texto legal**: el artículo literal del BOE, en el recuadro con borde de color. Es lo que se pregunta.\n2. **Ficha**: debajo, con casillas fijas. No repite la ley: la **desmonta** en datos que se memorizan.\n\n| Tipo de ficha | Casillas (siempre en este orden) | Se usa para |\n|---|---|---|\n| **Derecho** | Titulares · Contenido · Límites · Protección · ⚠ Ojo en el examen | Arts. 10 a 52 |\n| **Institución o procedimiento** | Qué · Quién · Cómo · Plazos y mayorías · ⚠ Ojo en el examen | Garantías, suspensión, Defensor del Pueblo y leyes de desarrollo |\n\n**Otros elementos**\n- **Numeración:** bloque (I a IV) → apartado (1, 2…) → artículo (1.1, 1.2…). Las remisiones se escriben así: «→ II.4» es el apartado 4 del bloque II.\n- **Recuadros de guía** (borde lateral): «▸ Dónde estamos» abre cada bloque; «▸ En resumen» lo cierra y enlaza con el siguiente.\n- **Citas entre comillas latinas** («…»): son literales y están comprobadas contra el BOE.\n- **Lo que no es texto legal** (doctrina, jurisprudencia, datos) se indica siempre como tal, con su fuente.\n\n?> **Cómo se pregunta en GACE-L.** Casi todas las preguntas del primer ejercicio empiezan por «Según el artículo X…» y las cuatro opciones se diferencian en un plazo, una mayoría, un órgano o una palabra. En este tema cayeron dos en 2025 (→ Cierre 1).","nivel":1},{"id":"bI","title":"I. ¿Qué derechos y deberes hay? (arts. 10 a 52)","body":"@> **▸ Dónde estamos.** Primera pregunta del tema. Antes de hablar de garantías o de suspensión hay que saber **qué** reconoce la Constitución y **dónde** lo coloca, porque el lugar decide la protección.\n@> **▸ Qué vas a ver.** 1 El Título I y el art. 10 · 2 Españoles y extranjeros (11-13) · 3 Igualdad (14) · 4 a 7 Sección 1.ª (15-29) · 8 y 9 Sección 2.ª (30-38) · 10 y 11 Capítulo tercero (39-52) · 12 Los deberes\n\n**Orden de estudio.** Se sigue el orden de los artículos. Primero el marco (estructura del Título I y art. 10); después, capítulo a capítulo, cada artículo con su ficha.","nivel":1},{"id":"s1","title":"I.1 El Título I: estructura, art. 10 y niveles de protección","body":"### 1.1 Estructura del Título I\n\nLa Constitución tiene una **parte dogmática** (derechos y deberes) y una **parte orgánica** (poderes del Estado); la distinción es doctrinal. La parte dogmática es el **Título I**, «De los derechos y deberes fundamentales», **arts. 10 a 55**:\n\n| Parte | Artículos | Rúbrica literal | Nivel de protección |\n|---|---|---|---|\n| Artículo 10 (sin capítulo) | 10 | — | — |\n| Capítulo primero | 11 a 13 | De los españoles y los extranjeros | — |\n| Capítulo segundo | 14 a 38 | Derechos y libertades | — |\n| · Art. 14 (fuera de las secciones) | 14 | — | Casi máxima |\n| · Sección 1.ª | 15 a 29 | De los derechos fundamentales y de las libertades públicas | **Máxima** |\n| · Sección 2.ª | 30 a 38 | De los derechos y deberes de los ciudadanos | **Intermedia** |\n| Capítulo tercero | 39 a 52 | De los principios rectores de la política social y económica | **Mínima** |\n| Capítulo cuarto | 53 y 54 | De las garantías de las libertades y derechos fundamentales | → bloques II y IV |\n| Capítulo quinto | 55 | De la suspensión de los derechos y libertades | → bloque III |\n\n%> **📋 Pregunta real · GACE-L 2025 · 1.er ejercicio · n.º 1**\n%> «El Título I de la Constitución Española de 1978 se denomina:»\n%> [x] a) De los derechos y deberes fundamentales. || Es la rúbrica literal del Título I: «De los derechos y deberes fundamentales» (arts. 10 a 55).\n%> [ ] b) De los derechos y deberes de los ciudadanos. || «De los derechos y deberes de los ciudadanos» es la rúbrica de la **Sección 2.ª** del Capítulo segundo (arts. 30 a 38), no la del Título.\n%> [ ] c) De los españoles y los extranjeros. || «De los españoles y los extranjeros» es la rúbrica del **Capítulo primero** (arts. 11 a 13).\n%> [ ] d) Derechos y libertades. || «Derechos y libertades» es la rúbrica del **Capítulo segundo** (arts. 14 a 38).\n%> = **Respuesta correcta: a)**, según la plantilla definitiva de respuestas, y coherente con el texto legal citado.\n\n### 1.2 Los tres niveles de protección (anticipo del bloque II)\n\n| Nivel | Qué derechos | Qué los distingue |\n|---|---|---|\n| Máximo | Art. 14 y Sección 1.ª (15-29) | Procedimiento preferente y sumario y recurso de amparo (art. 53.2); la Sección 1.ª, además, ley orgánica (81) y reforma agravada (168) |\n| Intermedio | Sección 2.ª (30-38) | Vinculación, reserva de ley y contenido esencial (53.1). Sin amparo, salvo la objeción de conciencia (30.2) |\n| Mínimo | Capítulo tercero (39-52) | Solo «informarán» la legislación, la práctica judicial y la actuación pública (53.3) |\n\nCada ficha del bloque I lo resume en su casilla «Protección». El detalle está en → II.1 y el cuadro final, en → II.6.\n\n### 1.3 Fundamento y regla de interpretación (art. 10)\n\n> **Artículo 10.**\n> 1. La dignidad de la persona, los derechos inviolables que le son inherentes, el libre desarrollo de la personalidad, el respeto a la ley y a los derechos de los demás son **fundamento del orden político y de la paz social**.\n> 2. Las normas relativas a los derechos fundamentales y a las libertades que la Constitución reconoce se interpretarán de conformidad con la **Declaración Universal de Derechos Humanos** y los tratados y acuerdos internacionales sobre las mismas materias **ratificados por España**.\n\n=> Titulares: Habla de «la persona» (no de «los españoles»)\n=> Contenido: \n=> - 10.1, fundamento: dignidad, derechos inviolables inherentes, libre desarrollo de la personalidad, respeto a la ley y a los derechos de los demás\n=> - 10.2, interpretación: los derechos se leen conforme a la DUDH y a los tratados ratificados por España\n=> Límites: No crea derechos nuevos: el 10.2 es una regla para interpretar los que ya reconoce la Constitución\n=> Protección: No está en ningún capítulo: el art. 53 no lo menciona\n=> ⚠ Ojo en el examen: Tratados «ratificados por España», no «firmados» ni «suscritos». Fundamento del orden político «y de la paz social».\n\n### 1.4 Fuera del Título I: la igualdad real (art. 9.2)\n\n> **Artículo 9.2**\n> 2. Corresponde a los poderes públicos promover las condiciones para que la libertad y la igualdad del individuo y de los grupos en que se integra sean **reales y efectivas**; **remover los obstáculos** que impidan o dificulten su plenitud y facilitar la participación de todos los ciudadanos en la vida política, económica, cultural y social.\n\n=> Qué: Mandato de igualdad **real** (material), que completa la igualdad **ante la ley** del art. 14 (→ I.3)\n=> Quién: Los poderes públicos\n=> Cómo: Tres verbos:\n=> - **promover** las condiciones de libertad e igualdad reales y efectivas\n=> - **remover** los obstáculos\n=> - **facilitar** la participación en la vida política, económica, cultural y social\n=> Plazos y mayorías: —\n=> ⚠ Ojo en el examen: Está en el **Título preliminar**, no en el Título I. Alcanza al individuo «y de los grupos en que se integra».","nivel":2},{"id":"s2","title":"I.2 De los españoles y los extranjeros (Capítulo primero, arts. 11 a 13)","body":"El Capítulo primero responde a **quién** es titular de los derechos: los españoles (nacionalidad y mayoría de edad) y los extranjeros.\n\n### 2.1 La nacionalidad (art. 11)\n\n> **Artículo 11.**\n> 1. La nacionalidad española **se adquiere, se conserva y se pierde de acuerdo con lo establecido por la ley**.\n> 2. **Ningún español de origen** podrá ser privado de su nacionalidad.\n> 3. El Estado podrá concertar tratados de doble nacionalidad con los países iberoamericanos o con aquellos que hayan tenido o tengan una **particular vinculación con España**. En estos mismos países, aun cuando no reconozcan a sus ciudadanos un derecho recíproco, podrán naturalizarse los españoles **sin perder su nacionalidad de origen**.\n\n=> Titulares: Los españoles; la garantía del 11.2, solo los españoles **de origen**\n=> Contenido: \n=> - 11.1, remisión a la ley (el Código Civil) para adquirir, conservar y perder la nacionalidad\n=> - 11.2, el español de origen no puede ser privado de ella\n=> - 11.3, doble nacionalidad por tratado con los países iberoamericanos o con los que tengan particular vinculación con España; en ellos, naturalización sin perder la nacionalidad de origen, aunque no haya reciprocidad\n=> Límites: La ley fija cómo se adquiere y se pierde. Quien no es español de origen (por ejemplo, por residencia) puede perderla en los casos legales\n=> Protección: Fuera del Capítulo segundo: el art. 53 no lo menciona\n=> ⚠ Ojo en el examen: «Ningún español de origen»: sin «de origen», es falso. «**Particular** vinculación», no «especial». Naturalización «aun cuando no reconozcan a sus ciudadanos un derecho recíproco».\n\n### 2.2 La mayoría de edad (art. 12 y disposición adicional segunda)\n\n> **Artículo 12.**\n> Los españoles son mayores de edad a los **dieciocho años**.\n\n> **Disposición adicional segunda (CE)**\n> La declaración de mayoría de edad contenida en el artículo 12 de esta Constitución no perjudica las situaciones amparadas por los **derechos forales** en el ámbito del Derecho privado.\n\n=> Titulares: Los españoles\n=> Contenido: Mayoría de edad a los **dieciocho años**\n=> Límites: La DA 2.ª: no afecta a las especialidades de los **derechos forales** en el ámbito del Derecho privado\n=> Protección: Fuera del Capítulo segundo: el art. 53 no lo menciona\n=> ⚠ Ojo en el examen: Dieciocho años lo fija la **propia Constitución**, no la ley.\n\n### 2.3 Los extranjeros (art. 13)\n\n> **Artículo 13.**\n> 1. Los extranjeros gozarán en España de las libertades públicas que garantiza el presente Título **en los términos que establezcan los tratados y la ley**.\n> 2. **Solamente los españoles serán titulares de los derechos reconocidos en el artículo 23**, salvo lo que, atendiendo a criterios de reciprocidad, pueda establecerse por tratado o ley para el derecho de **sufragio activo y pasivo en las elecciones municipales**.\n> 3. La extradición sólo se concederá en cumplimiento de un tratado o de la ley, atendiendo al principio de reciprocidad. Quedan excluidos de la extradición los delitos políticos, **no considerándose como tales los actos de terrorismo**.\n> 4. La ley establecerá los términos en que los ciudadanos de otros países y **los apátridas** podrán gozar del derecho de asilo en España.\n\n=> Titulares: Los extranjeros (13.1 a 13.3); en el asilo, también los apátridas (13.4)\n=> - *Doctrina del TC (STC 107/1984), no texto legal:* tres grupos de derechos: los que tienen **igual que los españoles** por ser inherentes a la dignidad (vida, integridad, libertad ideológica, tutela judicial…); los que **no** tienen (art. 23, salvo el 13.2); y los que tienen **según tratados y ley**\n=> Contenido: \n=> - 13.1, libertades públicas del Título I en los términos de los tratados y la ley\n=> - 13.2, derechos del art. 23 solo para españoles; excepción: sufragio activo y pasivo en las **municipales**, por tratado o ley y con reciprocidad\n=> - 13.3, extradición solo por tratado o ley, con reciprocidad; excluidos los delitos políticos, pero el terrorismo **no** es delito político\n=> - 13.4, la ley regula el asilo\n=> Límites: Tratados y ley (13.1); reciprocidad (13.2 y 13.3)\n=> Protección: Fuera del Capítulo segundo: el art. 53 no lo menciona\n=> ⚠ Ojo en el examen: \n=> - Solo elecciones **municipales** (no autonómicas, generales ni europeas), «atendiendo a criterios de reciprocidad»\n=> - «y pasivo» se añadió en la **reforma de 1992** (Tratado de Maastricht), dato histórico, no texto legal\n=> - Asilo: ciudadanos de otros países **y apátridas**","nivel":2},{"id":"s3","title":"I.3 La igualdad ante la ley (Capítulo segundo, art. 14)","body":"El Capítulo segundo, «Derechos y libertades», es el núcleo del Título I. Se abre con el art. 14, que está **fuera de las dos secciones**, y sigue con la Sección 1.ª (→ I.4 a I.7) y la Sección 2.ª (→ I.8 y I.9).\n\n### 3.1 Igualdad y no discriminación (art. 14)\n\n> **Artículo 14.**\n> Los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de **nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social**.\n\n=> Titulares: Literalmente, «Los españoles son iguales ante la ley». Los extranjeros, según el art. 13.1 (→ I.2.3)\n=> Contenido: \n=> - Igualdad **ante la ley** (formal)\n=> - Prohibición de discriminación por nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social: lista **abierta**\n=> - La igualdad **real** está en el art. 9.2 (→ I.1.4)\n=> Límites: No hay límites expresos en el texto\n=> Protección: Casi máxima (art. 14): preferente y sumario y amparo, pero reforma ordinaria (→ II.1)\n=> - Lo nombra el art. 53.2: «el artículo 14 y la Sección primera del Capítulo segundo»\n=> - **Sin** reforma agravada: el art. 168 solo nombra la Sección primera\n=> - Ley orgánica: el art. 81 habla de «derechos fundamentales y libertades públicas»; que no alcance al art. 14 es **doctrina del TC**, no texto literal\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: No aparecen expresamente «ideología», «edad», «nacionalidad» ni «discapacidad»: caben en «cualquier otra condición o circunstancia personal o social». El art. 14 **no** pertenece a la Sección 1.ª.","nivel":2},{"id":"s3-1","title":"I.4 Sección 1.ª (I): la esfera personal (arts. 15 a 19)","body":"La Sección 1.ª, «De los derechos fundamentales y de las libertades públicas», reúne los derechos con **protección máxima**. Todos comparten las mismas garantías (→ II.1); por eso, en sus fichas la casilla «Protección» destaca sobre todo **si el derecho puede suspenderse**.\n\nSe estudia en cuatro grupos: esfera personal (15-19), comunicación y participación (20-23), garantías procesales y penales (24-26) y educación, sindicación, huelga y petición (27-29).\n\n### 4.1 Vida e integridad (art. 15)\n\n> **Artículo 15.**\n> **Todos tienen derecho a la vida y a la integridad física y moral**, sin que, en ningún caso, puedan ser sometidos a tortura ni a penas o tratos inhumanos o degradantes. Queda abolida la pena de muerte, **salvo lo que puedan disponer las leyes penales militares para tiempos de guerra**.\n\n=> Titulares: «Todos» (no solo los españoles)\n=> Contenido: \n=> - Vida\n=> - Integridad **física y moral**\n=> - Prohibición absoluta, «en ningún caso», de la tortura y de las penas o tratos inhumanos o degradantes\n=> - Abolición de la pena de muerte\n=> Límites: La única salvedad es la pena de muerte en las leyes penales militares para tiempos de guerra. *Dato, no texto legal: la LO 11/1995 la abolió también en tiempo de guerra; la salvedad sigue en la Constitución*\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: «para **tiempos de guerra**», no «estado de sitio». Integridad «física **y moral**».\n\n### 4.2 Libertad ideológica, religiosa y de culto (art. 16)\n\n> **Artículo 16.**\n> 1. Se garantiza la libertad ideológica, religiosa y de culto de los individuos y las comunidades **sin más limitación, en sus manifestaciones, que la necesaria para el mantenimiento del orden público protegido por la ley**.\n> 2. **Nadie podrá ser obligado a declarar sobre su ideología, religión o creencias**.\n> 3. **Ninguna confesión tendrá carácter estatal**. Los poderes públicos tendrán en cuenta las creencias religiosas de la sociedad española y mantendrán las consiguientes relaciones de cooperación con la Iglesia Católica y las demás confesiones.\n\n=> Titulares: «los individuos y las comunidades»\n=> Contenido: \n=> - 16.1, libertad ideológica, religiosa y de culto\n=> - 16.2, nadie puede ser obligado a declarar sobre su ideología, religión o creencias\n=> - 16.3, aconfesionalidad del Estado y cooperación «con la Iglesia Católica y las demás confesiones»\n=> Límites: Uno solo, y solo en sus **manifestaciones**: el orden público protegido por la ley\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: Límite **único**: orden público. Aconfesional no es lo mismo que sin relación: hay **cooperación**.\n\n### 4.3 Libertad y seguridad personal (art. 17)\n\n> **Artículo 17.**\n> 1. Toda persona tiene derecho a la libertad y a la seguridad. Nadie puede ser privado de su libertad, sino con la observancia de lo establecido en este artículo y en los casos y en la forma previstos en la ley.\n> 2. La detención preventiva no podrá durar más del tiempo estrictamente necesario para la realización de las averiguaciones tendentes al esclarecimiento de los hechos, y, en todo caso, **en el plazo máximo de setenta y dos horas**, el detenido deberá ser puesto en libertad o a disposición de la autoridad judicial.\n> 3. Toda persona detenida debe ser informada **de forma inmediata, y de modo que le sea comprensible**, de sus derechos y de las razones de su detención, **no pudiendo ser obligada a declarar**. Se garantiza la asistencia de abogado al detenido en las diligencias policiales y judiciales, en los términos que la ley establezca.\n> 4. La ley regulará un procedimiento de «**habeas corpus**» para producir la inmediata puesta a disposición judicial de toda persona detenida ilegalmente. Asimismo, por ley se determinará el **plazo máximo de duración de la prisión provisional**.\n\n=> Titulares: «Toda persona»\n=> Contenido: \n=> - 17.1, regla: libertad; privación solo en los casos y en la forma de la ley\n=> - 17.2, detención preventiva: lo estrictamente necesario y, como máximo, **72 horas**; después, libertad o disposición judicial\n=> - 17.3, derechos del detenido: información inmediata y comprensible de derechos y razones; no declarar; abogado\n=> - 17.4, *habeas corpus* (→ II.4) y plazo máximo de la prisión provisional, fijado por ley\n=> Límites: Solo «en los casos y en la forma previstos en la ley»\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1); además, *habeas corpus*\n=> - Suspendible: **sí**, en los estados de excepción y de sitio (art. 55.1 → III.2); el **17.3 solo en el de sitio**\n=> - 17.2: también suspensión **individual** por terrorismo (55.2 → III.9)\n=> ⚠ Ojo en el examen: 72 horas es el **máximo**: la regla es «el tiempo estrictamente necesario». Información «de forma inmediata», no «en 24 horas».\n\n### 4.4 Honor, intimidad, domicilio, comunicaciones e informática (art. 18)\n\n> **Artículo 18.**\n> 1. Se garantiza el derecho al honor, a la intimidad personal y familiar y a la propia imagen.\n> 2. **El domicilio es inviolable**. Ninguna entrada o registro podrá hacerse en él sin consentimiento del titular o resolución judicial, **salvo en caso de flagrante delito**.\n> 3. Se garantiza el secreto de las comunicaciones y, en especial, de las postales, telegráficas y telefónicas, **salvo resolución judicial**.\n> 4. **La ley limitará el uso de la informática** para garantizar el honor y la intimidad personal y familiar de los ciudadanos y el pleno ejercicio de sus derechos.\n\n=> Titulares: No se nombra titular: «Se garantiza el derecho»…\n=> Contenido: \n=> - 18.1, honor, intimidad personal y familiar y propia imagen\n=> - 18.2, inviolabilidad del domicilio\n=> - 18.3, secreto de las comunicaciones, en especial postales, telegráficas y telefónicas\n=> - 18.4, la ley limitará el uso de la **informática** (base de la protección de datos)\n=> Límites: \n=> - Domicilio, **tres** títulos: consentimiento del titular, resolución judicial o flagrante delito\n=> - Comunicaciones, **uno**: resolución judicial\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **sí**, en los estados de excepción y de sitio (art. 55.1 → III.2): solo **18.2 y 18.3**; el 18.1, nunca\n=> - 18.2 y 18.3: también suspensión **individual** por terrorismo (55.2 → III.9)\n=> ⚠ Ojo en el examen: En las comunicaciones **no** hay excepción por flagrante delito.\n\n### 4.5 Residencia y circulación (art. 19)\n\n> **Artículo 19.**\n> **Los españoles tienen derecho a elegir libremente su residencia** y a circular por el territorio nacional.\n> Asimismo, tienen derecho a entrar y salir libremente de España en los términos que la ley establezca. Este derecho **no podrá ser limitado por motivos políticos o ideológicos**.\n\n=> Titulares: «Los españoles» (los extranjeros, según el art. 13.1)\n=> Contenido: \n=> - Elegir libremente la residencia\n=> - Circular por el territorio nacional\n=> - Entrar y salir libremente de España\n=> Límites: Los términos de la ley; el derecho a entrar y salir no puede limitarse por motivos políticos o ideológicos\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **sí**, en los estados de excepción y de sitio (art. 55.1 → III.2)\n=> - En la alarma solo puede **limitarse** (STC 148/2021 → III.8)\n=> ⚠ Ojo en el examen: «motivos políticos **o ideológicos**». Titulares: los **españoles**.\n\n!> **Idea clave del grupo.** Se pueden suspender **17, 18.2, 18.3 y 19**. Nunca: vida (15), libertad ideológica (16), honor e intimidad (18.1).","nivel":2},{"id":"s3-2","title":"I.5 Sección 1.ª (II): comunicación y participación (arts. 20 a 23)","body":"Segundo grupo de la Sección 1.ª: las libertades para **comunicarse** y **participar** en la vida colectiva y política.\n\n### 5.1 Expresión e información (art. 20)\n\n> **Artículo 20.**\n> 1. Se reconocen y protegen los derechos:\n> a) A expresar y difundir libremente los pensamientos, ideas y opiniones mediante la palabra, el escrito o cualquier otro medio de reproducción.\n> b) A la producción y creación literaria, artística, científica y técnica.\n> c) A la **libertad de cátedra**.\n> d) A comunicar o recibir libremente **información veraz** por cualquier medio de difusión. La ley regulará el derecho a la **cláusula de conciencia y al secreto profesional** en el ejercicio de estas libertades.\n> 2. El ejercicio de estos derechos no puede restringirse mediante **ningún tipo de censura previa**.\n> 3. La ley regulará la organización y el control parlamentario de los medios de comunicación social dependientes del Estado o de cualquier ente público y garantizará el acceso a dichos medios de los grupos sociales y políticos significativos, respetando el pluralismo de la sociedad y de las diversas lenguas de España.\n> 4. Estas libertades tienen su límite en el respeto a los derechos reconocidos en este Título, en los preceptos de las leyes que lo desarrollen y, especialmente, en el derecho al honor, a la intimidad, a la propia imagen y a la **protección de la juventud y de la infancia**.\n> 5. Sólo podrá acordarse el secuestro de publicaciones, grabaciones y otros medios de información **en virtud de resolución judicial**.\n\n=> Titulares: No se nombra titular: «Se reconocen y protegen los derechos»\n=> Contenido: \n=> - 20.1 a), expresión de pensamientos, ideas y opiniones\n=> - 20.1 b), producción y creación literaria, artística, científica y técnica\n=> - 20.1 c), libertad de cátedra\n=> - 20.1 d), información **veraz**; la ley regula la cláusula de conciencia y el secreto profesional\n=> - 20.2, sin censura previa\n=> - 20.3, medios públicos: control parlamentario, acceso de los grupos significativos, pluralismo y lenguas de España\n=> Límites: \n=> - 20.4, el respeto a los demás derechos del Título I y a las leyes que lo desarrollen; en especial, honor, intimidad, propia imagen y protección de la juventud y de la infancia\n=> - 20.5, secuestro de publicaciones, grabaciones y otros medios **solo por resolución judicial**\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **sí**, en los estados de excepción y de sitio (art. 55.1 → III.2): solo **20.1 a) y d)** y **20.5**\n=> ⚠ Ojo en el examen: Información «**veraz**». Secuestro: **solo** el juez, nunca la autoridad gubernativa.\n\n### 5.2 Reunión (art. 21)\n\n> **Artículo 21.**\n> 1. Se reconoce el derecho de reunión **pacífica y sin armas**. El ejercicio de este derecho **no necesitará autorización previa**.\n> 2. En los casos de reuniones en lugares de tránsito público y manifestaciones se dará **comunicación previa** a la autoridad, que sólo podrá prohibirlas cuando existan razones fundadas de alteración del orden público, **con peligro para personas o bienes**.\n\n=> Titulares: No se nombra titular: «Se reconoce el derecho de reunión»…\n=> Contenido: \n=> - 21.1, reunión pacífica y sin armas, sin autorización previa\n=> - 21.2, en lugares de tránsito público y manifestaciones: **comunicación previa** a la autoridad\n=> Límites: La autoridad solo puede prohibir «cuando existan razones fundadas de alteración del orden público, con peligro para personas o bienes»\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1); recurso urgente contra la prohibición (art. 122 LJCA → II.3)\n=> - Suspendible: **sí**, en los estados de excepción y de sitio (art. 55.1 → III.2)\n=> ⚠ Ojo en el examen: «Comunicación previa», **no** «autorización previa». Prohibición: orden público **con peligro para personas o bienes**.\n\n### 5.3 Asociación (art. 22)\n\n> **Artículo 22.**\n> 1. Se reconoce el derecho de asociación.\n> 2. Las asociaciones que persigan fines o utilicen medios tipificados como delito son ilegales.\n> 3. Las asociaciones constituidas al amparo de este artículo deberán inscribirse en un registro **a los solos efectos de publicidad**.\n> 4. Las asociaciones sólo podrán ser disueltas o suspendidas en sus actividades **en virtud de resolución judicial motivada**.\n> 5. Se prohíben las asociaciones **secretas y las de carácter paramilitar**.\n\n=> Titulares: No se nombra titular: «Se reconoce el derecho de asociación»\n=> Contenido: \n=> - 22.1, derecho de asociación\n=> - 22.3, inscripción en un registro **a los solos efectos de publicidad**\n=> Límites: \n=> - 22.2, ilegales: fines o medios tipificados como **delito**\n=> - 22.4, disolución o suspensión solo por **resolución judicial motivada**\n=> - 22.5, prohibidas las **secretas** y las **paramilitares**\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: La inscripción **no** es constitutiva. El art. 34.2 aplica a las **fundaciones** los apartados **2 y 4** de este artículo (→ I.8.5).\n\n### 5.4 Participación política y acceso a cargos públicos (art. 23)\n\n> **Artículo 23.**\n> 1. Los ciudadanos tienen el derecho a participar en los asuntos públicos, **directamente o por medio de representantes**, libremente elegidos en elecciones periódicas por **sufragio universal**.\n> 2. Asimismo, tienen derecho a acceder **en condiciones de igualdad a las funciones y cargos públicos, con los requisitos que señalen las leyes**.\n\n=> Titulares: «Los ciudadanos»: solo los españoles, salvo el sufragio municipal (13.2 → I.2.3)\n=> Contenido: \n=> - 23.1, participar en los asuntos públicos directamente o por representantes elegidos en elecciones periódicas por sufragio universal\n=> - 23.2, acceder en condiciones de igualdad a las funciones y cargos públicos: base constitucional del acceso al empleo público\n=> Límites: Los requisitos que señalen las leyes\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: El 23.2 **no** dice «mérito y capacidad»: eso está en el **art. 103.3**.\n\n!> **Idea clave del grupo.** Se pueden suspender **20.1 a) y d), 20.5 y 21**. Nunca: asociación (22) ni participación (23).","nivel":2},{"id":"s3-3","title":"I.6 Sección 1.ª (III): garantías procesales y penales (arts. 24 a 26)","body":"Tercer grupo: la protección de la persona **ante los tribunales** y **ante el poder sancionador** del Estado.\n\n### 6.1 Tutela judicial efectiva y garantías del proceso (art. 24)\n\n> **Artículo 24.**\n> 1. **Todas las personas** tienen derecho a obtener la tutela efectiva de los jueces y tribunales en el ejercicio de sus derechos e intereses legítimos, **sin que, en ningún caso, pueda producirse indefensión**.\n> 2. Asimismo, todos tienen derecho al **Juez ordinario predeterminado por la ley**, a la defensa y a la asistencia de letrado, a ser informados de la acusación formulada contra ellos, a un proceso público sin dilaciones indebidas y con todas las garantías, a utilizar los medios de prueba pertinentes para su defensa, a no declarar contra sí mismos, a no confesarse culpables y a la **presunción de inocencia**.\n> La ley regulará los casos en que, **por razón de parentesco o de secreto profesional**, no se estará obligado a declarar sobre hechos presuntamente delictivos.\n\n=> Titulares: 24.1, «Todas las personas»; 24.2, «Asimismo, todos tienen derecho»…\n=> Contenido: 24.1, tutela efectiva de jueces y tribunales, sin indefensión\n=> - 24.2: Juez ordinario predeterminado por la ley\n=> - defensa y asistencia de letrado\n=> - ser informados de la acusación\n=> - proceso público sin dilaciones indebidas y con todas las garantías\n=> - medios de prueba pertinentes\n=> - no declarar contra sí mismos y no confesarse culpables\n=> - presunción de inocencia\n=> Límites: La ley regula cuándo no hay obligación de declarar por parentesco o secreto profesional\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: «sin que, en ningún caso, pueda producirse indefensión». Dispensa de declarar: **parentesco o secreto profesional**.\n\n### 6.2 Legalidad penal y sancionadora; fines de la pena (art. 25)\n\n> **Artículo 25.**\n> 1. Nadie puede ser condenado o sancionado por acciones u omisiones que en el momento de producirse no constituyan **delito, falta o infracción administrativa**, según la legislación vigente en aquel momento.\n> 2. Las penas privativas de libertad y las medidas de seguridad estarán orientadas hacia la **reeducación y reinserción social** y **no podrán consistir en trabajos forzados**. El condenado a pena de prisión que estuviere cumpliendo la misma gozará de los derechos fundamentales de este Capítulo, a excepción de los que se vean expresamente limitados por el contenido del fallo condenatorio, el sentido de la pena y la ley penitenciaria. En todo caso, tendrá derecho a un trabajo remunerado y a los beneficios correspondientes de la Seguridad Social, así como al acceso a la cultura y al desarrollo integral de su personalidad.\n> 3. La Administración civil no podrá imponer sanciones que, **directa o subsidiariamente**, impliquen privación de libertad.\n\n=> Titulares: 25.1, «Nadie puede ser condenado o sancionado»…; 25.2, «El condenado a pena de prisión»\n=> Contenido: \n=> - 25.1, legalidad: nadie condenado o sancionado por hechos que no fueran delito, falta o **infracción administrativa** cuando se cometieron\n=> - 25.2, penas y medidas de seguridad orientadas a la reeducación y reinserción social; sin trabajos forzados; el condenado conserva sus derechos fundamentales y tiene derecho a trabajo remunerado, Seguridad Social, cultura y desarrollo de su personalidad\n=> - 25.3, la Administración civil no puede imponer sanciones privativas de libertad\n=> Límites: Los derechos del condenado ceden ante el fallo, el sentido de la pena y la ley penitenciaria\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: La legalidad alcanza a las **sanciones administrativas**. Sin privación de libertad «directa o subsidiariamente»: la Administración **civil** (no la militar).\n\n### 6.3 Prohibición de los Tribunales de Honor (art. 26)\n\n> **Artículo 26.**\n> Se prohíben los Tribunales de Honor en el ámbito de la **Administración civil y de las organizaciones profesionales**.\n\n=> Titulares: —\n=> Contenido: Prohibición de los Tribunales de Honor\n=> Límites: —\n=> Protección: Máxima (Sección 1.ª): ley orgánica, preferente y sumario, amparo y reforma agravada (→ II.1)\n=> - Suspendible: **no** (no figura en el art. 55)\n=> ⚠ Ojo en el examen: En el ámbito de la Administración **civil** y de las **organizaciones profesionales**.","nivel":2},{"id":"s3-4","title":"I.7 Sección 1.ª (IV): educación, sindicación, huelga y petición (arts. 27 a 29)","body":"Último grupo de la Sección 1.ª: un derecho de **prestación** (educación) y derechos de **acción colectiva** (sindicación, huelga y petición).\n\n### 7.1 Educación y libertad de enseñanza (art. 27)\n\n> **Artículo 27.**\n> 1. **Todos tienen el derecho a la educación**. Se reconoce la libertad de enseñanza.\n> 2. La educación tendrá por objeto el pleno desarrollo de la personalidad humana en el respeto a los principios democráticos de convivencia y a los derechos y libertades fundamentales.\n> 3. Los poderes públicos garantizan el derecho que asiste a los padres para que sus hijos reciban la formación religiosa y moral que esté de acuerdo con sus propias convicciones.\n> 4. La enseñanza básica es **obligatoria y gratuita**.\n> 5. Los poderes públicos garantizan el derecho de todos a la educación, mediante una programación general de la enseñanza, con participación efectiva de todos los sectores afectados y la creación de centros docentes.\n> 6. Se reconoce a las personas físicas y jurídicas la libertad de creación de centros docentes, dentro del respeto a los principios constitucionales.\n> 7. Los profesores, los padres y, **en su caso, los alumnos** intervendrán en el control y gestión de todos los centros sosten
