 concertadamente y de forma organizada por dos o más personas, prórroga por otro plazo no superior a cinco días. Nunca para menores de dieciséis años.","cat":"Suspensión"},{"q":"Correspondencia y comunicaciones en urgencia por terrorismo (arts. 579.3 y 588 ter d.3 LECrim)","a":"Las ordena el Ministro del Interior o, en su defecto, el Secretario de Estado de Seguridad. Se comunica al juez en 24 horas como máximo y este revoca o confirma en 72 horas desde que se ordenó.","cat":"Suspensión"},{"q":"Aforamiento de los defensores autonómicos (art. 1.1 Ley 36/1985)","a":"La Sala correspondiente del Tribunal Superior de Justicia. El Defensor del Pueblo estatal: Sala de lo Penal del Tribunal Supremo.","cat":"Defensor"}],"questions":[{"q":"El Título I de la Constitución Española de 1978 se denomina:","o":["De los derechos y deberes fundamentales.","De los derechos y deberes de los ciudadanos.","De los españoles y los extranjeros.","Derechos y libertades."],"c":0,"e":"Respuesta a) según la plantilla definitiva. ✅ a) Es la rúbrica literal del Título I: «De los derechos y deberes fundamentales» (arts. 10 a 55). ✗ b) «De los derechos y deberes de los ciudadanos» es la rúbrica de la Sección 2.ª del Capítulo segundo (arts. 30 a 38), no la del Título. ✗ c) «De los españoles y los extranjeros» es la rúbrica del Capítulo primero (arts. 11 a 13). ✗ d) «Derechos y libertades» es la rúbrica del Capítulo segundo (arts. 14 a 38).","cat":"Título I CE","real":"Examen GACE-L 2025 · 1.er ejercicio · pregunta 1"},{"q":"Según el artículo 2 de la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, si en el procedimiento inicial no se alcanzan las mayorías exigidas para la elección del Defensor del Pueblo:","o":["Se convoca directamente un nuevo Pleno conjunto de las Cortes Generales, y el candidato será designado por mayoría absoluta de ambas Cámaras.","Se convoca directamente un nuevo Pleno conjunto de las Cortes Generales, y el candidato será designado por mayoría simple de ambas Cámaras.","Se procede a una nueva sesión de la Comisión Mixta Congreso-Senado y, en el plazo máximo de un mes, se formulan sucesivas propuestas; una vez obtenidos tres quintos en el Congreso, la designación queda realizada al alcanzarse mayoría absoluta en el Senado.","Se procede a una nueva sesión de la Comisión Mixta Congreso-Senado y, en el plazo máximo de quince días, se formulan sucesivas propuestas; una vez obtenidos tres quintos en el Congreso, la designación queda realizada al alcanzarse mayoría simple en el Senado."],"c":2,"e":"Respuesta c) según la plantilla definitiva. ✗ a) No existe ningún «Pleno conjunto»: el art. 2.5 manda volver a la Comisión Mixta: «se procederá en nueva sesión de la Comisión». Tampoco se exige mayoría absoluta en las dos Cámaras. ✗ b) Mismo error que la a): no hay «Pleno conjunto». Y la designación nunca se hace por mayoría simple de las Cámaras: la mayoría simple solo rige para los acuerdos de la Comisión («Los acuerdos de la Comisión se adoptarán por mayoría simple», art. 2.3). ✅ c) Reproduce el art. 2.5: «en el plazo máximo de un mes, a formular sucesivas propuestas»; «una vez conseguida la mayoría de los tres quintos en el Congreso, la designación quedará realizada al alcanzarse la mayoría absoluta del Senado». ✗ d) Cambia dos datos: «un mes» por «quince días» y «mayoría absoluta» por «mayoría simple» en el Senado.","cat":"Art. 2.5 LO 3/1981","real":"Examen GACE-L 2025 · 1.er ejercicio · pregunta 2"},{"q":"Según el artículo 10.1 de la Constitución, son fundamento del orden político y de la paz social:","o":["El respeto a la ley, la seguridad jurídica y la interdicción de la arbitrariedad de los poderes públicos.","La dignidad de la persona, la igualdad ante la ley y el respeto a los derechos fundamentales y libertades públicas.","La libertad, la justicia, la igualdad y el pluralismo político.","La dignidad de la persona, los derechos inviolables que le son inherentes, el libre desarrollo de la personalidad, el respeto a la ley y a los derechos de los demás."],"c":3,"e":"Art. 10.1. b) son los valores superiores del art. 1.1; d) son principios del art. 9.3.","cat":"Art. 10.1 CE"},{"q":"Según el artículo 10.2 de la Constitución, las normas relativas a los derechos fundamentales y a las libertades que la Constitución reconoce se interpretarán de conformidad con:","o":["El Convenio Europeo para la Protección de los Derechos Humanos y la jurisprudencia del Tribunal Europeo de Derechos Humanos.","La Carta de Derechos Fundamentales de la Unión Europea y los tratados internacionales ratificados por España.","La Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias firmados por España.","La Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España."],"c":3,"e":"Art. 10.2: «ratificados por España». El matiz entre «ratificados» y «firmados» es la trampa.","cat":"Art. 10.2 CE"},{"q":"Según el artículo 11 de la Constitución:","o":["Ningún español podrá ser privado de su nacionalidad.","Ningún español de origen podrá ser privado de su nacionalidad.","La nacionalidad española se adquiere, se conserva y se pierde de acuerdo con lo establecido en los tratados internacionales.","El Estado solo podrá concertar tratados de doble nacionalidad con los países iberoamericanos."],"c":1,"e":"Art. 11.2. La nacionalidad se rige por la ley (11.1), y los tratados de doble nacionalidad caben también con países de particular vinculación (11.3).","cat":"Art. 11.2 CE"},{"q":"Según el artículo 11.3 de la Constitución, en los países con los que se concierten tratados de doble nacionalidad los españoles podrán naturalizarse sin perder su nacionalidad de origen:","o":["Solo si reconocen a sus ciudadanos un derecho recíproco.","Aun cuando no reconozcan a sus ciudadanos un derecho recíproco.","Solo si han residido legalmente en ellos durante diez años.","Previa autorización del Gobierno."],"c":1,"e":"Art. 11.3.","cat":"Art. 11.3 CE"},{"q":"Según el artículo 13.1 de la Constitución, los extranjeros gozarán en España de las libertades públicas que garantiza el Título I:","o":["En condiciones de igualdad con los españoles, sin excepción.","En los términos que establezcan los tratados y la ley.","Atendiendo exclusivamente al principio de reciprocidad.","En los términos que establezca una ley orgánica."],"c":1,"e":"Art. 13.1.","cat":"Art. 13.1 CE"},{"q":"Según el artículo 13.2 de la Constitución, atendiendo a criterios de reciprocidad podrá establecerse por tratado o ley, para los extranjeros:","o":["El derecho de acceso a las funciones públicas.","El derecho de sufragio activo y pasivo en las elecciones al Parlamento Europeo y municipales.","El derecho de sufragio activo y pasivo en las elecciones municipales.","El derecho de sufragio activo en las elecciones municipales y autonómicas."],"c":2,"e":"Art. 13.2, en la redacción de la reforma de 1992.","cat":"Art. 13.2 CE"},{"q":"Según el artículo 13.3 de la Constitución, quedan excluidos de la extradición:","o":["Los delitos castigados con pena de muerte en el Estado requirente.","Los delitos políticos, salvo que un tratado disponga otra cosa.","Los delitos políticos y los actos de terrorismo.","Los delitos políticos, no considerándose como tales los actos de terrorismo."],"c":3,"e":"Art. 13.3.","cat":"Art. 13.3 CE"},{"q":"Según el artículo 13.4 de la Constitución, la ley establecerá los términos en que podrán gozar del derecho de asilo en España:","o":["Los ciudadanos de otros países perseguidos por motivos políticos.","Los extranjeros con residencia legal y los refugiados.","Los ciudadanos de otros países y los apátridas.","Los ciudadanos de países sin tratado de extradición."],"c":2,"e":"Art. 13.4.","cat":"Art. 13.4 CE"},{"q":"Según el artículo 14 de la Constitución, no puede prevalecer discriminación alguna por razón de:","o":["Raza, sexo, edad, religión, opinión o cualquier otra condición personal.","Nacimiento, origen, raza, sexo, religión o cualquier otra circunstancia social o económica.","Nacimiento, raza, sexo, religión, ideología o cualquier otra condición o circunstancia personal o social.","Nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social."],"c":3,"e":"Art. 14. La trampa habitual es añadir «ideología» o «edad».","cat":"Art. 14 CE"},{"q":"Según el artículo 15 de la Constitución, queda abolida la pena de muerte, salvo:","o":["Lo que puedan disponer las leyes penales para delitos de terrorismo.","Lo que disponga la declaración del estado de sitio.","Lo que puedan disponer las leyes penales militares para tiempos de guerra.","Lo que dispongan las leyes militares en todo caso."],"c":2,"e":"Art. 15.","cat":"Art. 15 CE"},{"q":"Según el artículo 16.1 de la Constitución, la libertad ideológica, religiosa y de culto se garantiza sin más limitación, en sus manifestaciones, que:","o":["La necesaria para la seguridad nacional y la salud pública.","La necesaria para la protección de los derechos de los demás.","La que establezcan los acuerdos con las confesiones religiosas.","La necesaria para el mantenimiento del orden público protegido por la ley."],"c":3,"e":"Art. 16.1.","cat":"Art. 16.1 CE"},{"q":"Según el artículo 16.3 de la Constitución:","o":["Los poderes públicos mantendrán relaciones de cooperación exclusivamente con la Iglesia Católica.","Las confesiones religiosas deberán inscribirse a efectos constitutivos.","Ninguna confesión tendrá carácter estatal.","La religión católica tendrá carácter preferente."],"c":2,"e":"Art. 16.3: cooperación «con la Iglesia Católica y las demás confesiones».","cat":"Art. 16.3 CE"},{"q":"Según el artículo 17.2 de la Constitución, el detenido deberá ser puesto en libertad o a disposición de la autoridad judicial, en todo caso, en el plazo máximo de:","o":["Setenta y dos horas.","Veinticuatro horas.","Cuarenta y ocho horas.","Diez días."],"c":0,"e":"Art. 17.2. Los diez días son la detención del estado de excepción (art. 16 LO 4/1981).","cat":"Art. 17.2 CE"},{"q":"Según el artículo 17.3 de la Constitución, toda persona detenida debe ser informada de sus derechos y de las razones de su detención:","o":["De forma inmediata, y de modo que le sea comprensible.","En su lengua materna y antes de prestar declaración.","Por escrito y en presencia de abogado.","En el plazo máximo de veinticuatro horas."],"c":0,"e":"Art. 17.3.","cat":"Art. 17.3 CE"},{"q":"Según el artículo 17.4 de la Constitución, el procedimiento de «habeas corpus» tiene por objeto:","o":["Revisar la legalidad de la prisión provisional.","Producir la inmediata puesta a disposición judicial de toda persona detenida ilegalmente.","Garantizar la asistencia de abogado al detenido.","Poner en libertad a toda persona detenida durante más de setenta y dos horas."],"c":1,"e":"Art. 17.4. Además, la ley determinará el plazo máximo de la prisión provisional.","cat":"Art. 17.4 CE"},{"q":"Según el artículo 18.2 de la Constitución, ninguna entrada o registro podrá hacerse en el domicilio:","o":["Sin resolución judicial motivada, en todo caso.","Sin consentimiento del titular o resolución judicial, salvo en caso de flagrante delito.","Sin consentimiento del titular o autorización de la autoridad gubernativa.","Sin resolución judicial, salvo en caso de flagrante delito o estado de alarma."],"c":1,"e":"Art. 18.2.","cat":"Art. 18.2 CE"},{"q":"Según el artículo 18.3 de la Constitución, se garantiza el secreto de las comunicaciones y, en especial, de las postales, telegráficas y telefónicas:","o":["Salvo resolución judicial.","Salvo consentimiento de uno de los comunicantes.","Salvo resolución judicial o flagrante delito.","Salvo autorización del Ministro del Interior en casos de urgencia."],"c":0,"e":"Art. 18.3: aquí no hay excepción de flagrante delito (esa es la del domicilio, 18.2).","cat":"Art. 18.3 CE"},{"q":"Según el artículo 18.4 de la Constitución, la ley limitará el uso de la informática para garantizar:","o":["La seguridad de los sistemas de información de las Administraciones Públicas.","El honor y la intimidad personal y familiar de los ciudadanos y el pleno ejercicio de sus derechos.","La protección de los datos de carácter personal y el secreto de las comunicaciones.","La propia imagen y la libertad de información."],"c":1,"e":"Art. 18.4.","cat":"Art. 18.4 CE"},{"q":"Según el artículo 19 de la Constitución, el derecho de los españoles a entrar y salir libremente de España:","o":["Solo podrá ser limitado por resolución judicial.","No podrá ser suspendido en ningún caso.","No podrá ser limitado por motivos políticos o ideológicos.","Corresponde a todas las personas que residan legalmente en España."],"c":2,"e":"Art. 19. Es suspendible en excepción y sitio (art. 55.1), y su titularidad es de «los españoles».","cat":"Art. 19 CE"},{"q":"Según el artículo 20.1.d) de la Constitución, la ley regulará en el ejercicio de la libertad de información:","o":["El derecho a la cláusula de conciencia y al secreto profesional.","Los supuestos de censura previa.","El derecho de rectificación y el de réplica.","El secreto de las fuentes y la responsabilidad de los editores."],"c":0,"e":"Art. 20.1.d).","cat":"Art. 20.1.d CE"},{"q":"Según el artículo 20.4 de la Constitución, las libertades del artículo 20 tienen su límite, especialmente, en:","o":["La seguridad nacional, el orden público y la salud pública.","El derecho al honor, a la intimidad y al secreto de las comunicaciones.","La protección de la infancia y la moral pública.","El derecho al honor, a la intimidad, a la propia imagen y a la protección de la juventud y de la infancia."],"c":3,"e":"Art. 20.4.","cat":"Art. 20.4 CE"},{"q":"Según el artículo 20.5 de la Constitución, el secuestro de publicaciones, grabaciones y otros medios de información sólo podrá acordarse:","o":["Por la autoridad gubernativa en casos de urgencia, con posterior control judicial.","A instancia del Ministerio Fiscal.","En virtud de resolución judicial.","Por el Gobierno, mediante acuerdo motivado."],"c":2,"e":"Art. 20.5. En el estado de excepción puede ordenarlo la autoridad gubernativa, pero solo porque se suspende el 20.5 (art. 21 LO 4/1981).","cat":"Art. 20.5 CE"},{"q":"Según el artículo 21.2 de la Constitución, la autoridad sólo podrá prohibir las reuniones en lugares de tránsito público y las manifestaciones:","o":["Cuando existan razones de seguridad ciudadana o de alteración del tráfico.","Cuando lo autorice el juez competente.","Cuando no se haya obtenido la autorización previa.","Cuando existan razones fundadas de alteración del orden público, con peligro para personas o bienes."],"c":3,"e":"Art. 21.2: se exige comunicación previa, no autorización (21.1).","cat":"Art. 21.2 CE"},{"q":"Según el artículo 22.3 de la Constitución, las asociaciones deberán inscribirse en un registro:","o":["Como requisito para adquirir personalidad jurídica.","A los solos efectos de publicidad.","Con efectos constitutivos.","Solo si reciben financiación pública."],"c":1,"e":"Art. 22.3.","cat":"Art. 22.3 CE"},{"q":"Según el artículo 22.4 de la Constitución, las asociaciones sólo podrán ser disueltas o suspendidas en sus actividades:","o":["Por acuerdo del Consejo de Ministros.","En virtud de resolución judicial o en estado de excepción.","En virtud de resolución judicial motivada.","Por resolución administrativa motivada, previa audiencia."],"c":2,"e":"Art. 22.4. La asociación no es suspendible por el art. 55.1.","cat":"Art. 22.4 CE"},{"q":"Según el artículo 23.2 de la Constitución, los ciudadanos tienen derecho a acceder en condiciones de igualdad a las funciones y cargos públicos:","o":["De acuerdo con los principios de mérito y capacidad.","Mediante oposición o concurso-oposición.","Con los requisitos que señalen las leyes.","De acuerdo con los principios de igualdad, mérito, capacidad y publicidad."],"c":2,"e":"Art. 23.2. «Mérito y capacidad» es del art. 103.3 CE, no del 23.2.","cat":"Art. 23.2 CE"},{"q":"Según el artículo 24.1 de la Constitución, todas las personas tienen derecho a obtener la tutela efectiva de los jueces y tribunales en el ejercicio de sus derechos e intereses legítimos:","o":["Con la asistencia gratuita de letrado en todo caso.","En un plazo razonable y sin dilaciones.","Sin que, en ningún caso, pueda producirse indefensión.","Siempre que acrediten un interés directo."],"c":2,"e":"Art. 24.1. Las «dilaciones indebidas» están en el 24.2.","cat":"Art. 24.1 CE"},{"q":"Según el artículo 24.2 de la Constitución, la ley regulará los casos en que no se estará obligado a declarar sobre hechos presuntamente delictivos por razón de:","o":["Parentesco, secreto profesional o interés propio.","Secreto profesional o religioso.","Parentesco o de secreto profesional.","Parentesco o amistad íntima."],"c":2,"e":"Art. 24.2, último párrafo.","cat":"Art. 24.2 CE"},{"q":"Según el artículo 25.1 de la Constitución, nadie puede ser condenado o sancionado por acciones u omisiones que en el momento de producirse no constituyan:","o":["Infracción penal o administrativa, según la legislación más favorable.","Delito o falta, según la ley penal vigente.","Delito, según la legislación vigente en el momento del juicio.","Delito, falta o infracción administrativa, según la legislación vigente en aquel momento."],"c":3,"e":"Art. 25.1.","cat":"Art. 25.1 CE"},{"q":"Según el artículo 25.2 de la Constitución, el condenado a pena de prisión tendrá derecho, en todo caso:","o":["A un trabajo remunerado y a los beneficios correspondientes de la Seguridad Social, así como al acceso a la cultura y al desarrollo integral de su personalidad.","A un trabajo remunerado, salvo que lo limite el fallo condenatorio.","A la reducción de la pena por trabajo.","A permisos de salida y a la comunicación con sus familiares."],"c":0,"e":"Art. 25.2.","cat":"Art. 25.2 CE"},{"q":"Según el artículo 25.3 de la Constitución, la Administración civil:","o":["No podrá imponer sanciones que, directa o subsidiariamente, impliquen privación de libertad.","Solo podrá imponer sanciones privativas de libertad de forma subsidiaria.","Podrá imponer arrestos domiciliarios por infracciones muy graves.","Podrá imponer sanciones privativas de libertad en estado de excepción."],"c":0,"e":"Art. 25.3.","cat":"Art. 25.3 CE"},{"q":"Según el artículo 26 de la Constitución, se prohíben los Tribunales de Honor:","o":["En el ámbito de los Colegios Profesionales exclusivamente.","En el ámbito de la Administración civil y militar.","En todos los ámbitos, públicos y privados.","En el ámbito de la Administración civil y de las organizaciones profesionales."],"c":3,"e":"Art. 26.","cat":"Art. 26 CE"},{"q":"Según el artículo 27.4 de la Constitución, la enseñanza básica es:","o":["Obligatoria y gratuita hasta los dieciséis años.","Obligatoria y gratuita.","Gratuita en los centros públicos.","Obligatoria, y gratuita en los términos que establezca la ley."],"c":1,"e":"Art. 27.4. La edad no está en la Constitución.","cat":"Art. 27.4 CE"},{"q":"Según el artículo 27.7 de la Constitución, intervendrán en el control y gestión de todos los centros sostenidos por la Administración con fondos públicos:","o":["Los titulares de los centros y los profesores.","La Administración educativa y los padres.","Los profesores, los padres y, en su caso, los alumnos.","Los profesores, los padres y los alumnos."],"c":2,"e":"Art. 27.7: «y, en su caso, los alumnos».","cat":"Art. 27.7 CE"},{"q":"Según el artículo 28.1 de la Constitución, la ley podrá limitar o exceptuar el ejercicio del derecho de sindicación:","o":["A las Fuerzas y Cuerpos de Seguridad del Estado y al personal de servicios esenciales.","A los Jueces, Magistrados y Fiscales.","A los funcionarios públicos.","A las Fuerzas o Institutos armados o a los demás Cuerpos sometidos a disciplina militar."],"c":3,"e":"Art. 28.1. Para los funcionarios, la ley «regulará las peculiaridades». La prohibición para jueces y fiscales está en el art. 127.","cat":"Art. 28.1 CE"},{"q":"Según el artículo 28.2 de la Constitución, se reconoce el derecho a la huelga:","o":["De los sindicatos más representativos.","De los trabajadores y funcionarios, salvo en servicios esenciales.","De los trabajadores para la defensa de sus intereses.","De los trabajadores y empresarios."],"c":2,"e":"Art. 28.2. Las medidas de conflicto colectivo de trabajadores y empresarios son del art. 37.2.","cat":"Art. 28.2 CE"},{"q":"Según el artículo 29 de la Constitución, los miembros de las Fuerzas o Institutos armados o de los Cuerpos sometidos a disciplina militar podrán ejercer el derecho de petición:","o":["Solo previa autorización de sus mandos.","Solo colectivamente, a través de sus asociaciones profesionales.","Sólo individualmente y con arreglo a lo dispuesto en su legislación específica.","Individual y colectivamente, por escrito."],"c":2,"e":"Art. 29.2. El resto de españoles: «individual y colectiva, por escrito» (29.1).","cat":"Art. 29 CE"},{"q":"Según el artículo 30.2 de la Constitución, la ley regulará la objeción de conciencia, pudiendo imponer, en su caso:","o":["Una sanción administrativa.","Un servicio civil obligatorio.","Una contribución económica sustitutoria.","Una prestación social sustitutoria."],"c":3,"e":"Art. 30.2. El «servicio civil» para fines de interés general está en el 30.3.","cat":"Art. 30.2 CE"},{"q":"Según el artículo 31.1 de la Constitución, el sistema tributario justo está inspirado en los principios de:","o":["Igualdad y progresividad, y en ningún caso tendrá alcance confiscatorio.","Progresividad y suficiencia.","Igualdad, capacidad económica y generalidad.","Eficiencia y economía, y en ningún caso tendrá alcance confiscatorio."],"c":0,"e":"Art. 31.1. «Eficiencia y economía» rigen el gasto público (31.2).","cat":"Art. 31.1 CE"},{"q":"Según el artículo 33.3 de la Constitución, nadie podrá ser privado de sus bienes y derechos sino:","o":["Por causa de utilidad pública, previa indemnización.","Por razones de interés general apreciadas por el Gobierno.","Por causa justificada de utilidad pública o interés social, mediante la correspondiente indemnización y de conformidad con lo dispuesto por las leyes.","Por resolución judicial firme, mediante el justo precio."],"c":2,"e":"Art. 33.3.","cat":"Art. 33.3 CE"},{"q":"Según el artículo 34.2 de la Constitución, regirá también para las fundaciones lo dispuesto en el artículo 22, apartados:","o":["2 y 4.","2 y 5.","3 y 4.","1 y 3."],"c":0,"e":"Art. 34.2: ilicitud penal de fines o medios (22.2) y disolución solo por resolución judicial motivada (22.4).","cat":"Art. 34.2 CE"},{"q":"Según el artículo 35.1 de la Constitución, el derecho a una remuneración suficiente se reconoce sin que en ningún caso pueda hacerse discriminación por razón de:","o":["Sexo o edad.","Cualquier condición o circunstancia personal o social.","Nacimiento o sexo.","Sexo."],"c":3,"e":"Art. 35.1.","cat":"Art. 35.1 CE"},{"q":"Según el artículo 37.1 de la Constitución, la ley garantizará el derecho a la negociación colectiva laboral entre los representantes de los trabajadores y empresarios, así como:","o":["La participación de los trabajadores en la empresa.","La eficacia general de los convenios.","La fuerza vinculante de los convenios.","El derecho de huelga."],"c":2,"e":"Art. 37.1.","cat":"Art. 37.1 CE"},{"q":"Según el artículo 38 de la Constitución, se reconoce la libertad de empresa:","o":["En los términos que establezca la ley de defensa de la competencia.","Con sujeción al interés general y a la función social.","En el marco de la economía de mercado.","Dentro de los límites de la planificación económica."],"c":2,"e":"Art. 38.","cat":"Art. 38 CE"},{"q":"Según el artículo 39.2 de la Constitución, la ley posibilitará:","o":["La investigación de la paternidad.","El reconocimiento de los hijos extramatrimoniales.","La protección integral de las madres solteras.","La adopción por parejas de hecho."],"c":0,"e":"Art. 39.2.","cat":"Art. 39.2 CE"},{"q":"Según el artículo 40.1 de la Constitución, los poderes públicos realizarán de manera especial una política orientada:","o":["A la formación y readaptación profesionales.","Al pleno empleo.","A la estabilidad de precios.","A la redistribución de la renta."],"c":1,"e":"Art. 40.1. La formación y readaptación profesionales están en el 40.2.","cat":"Art. 40.1 CE"},{"q":"Según el artículo 41 de la Constitución, la asistencia y prestaciones complementarias del régimen público de Seguridad Social serán:","o":["Gratuitas.","Libres.","Obligatorias.","Universales."],"c":1,"e":"Art. 41.","cat":"Art. 41 CE"},{"q":"Según el artículo 43.3 de la Constitución, los poderes públicos fomentarán la educación sanitaria, la educación física y el deporte y, asimismo:","o":["Garantizarán la asistencia sanitaria universal.","Facilitarán la adecuada utilización del ocio.","Regularán el deporte profesional.","Promoverán hábitos de vida saludables."],"c":1,"e":"Art. 43.3.","cat":"Art. 43.3 CE"},{"q":"Según el artículo 45.3 de la Constitución, para quienes violen lo dispuesto en materia de medio ambiente se establecerán:","o":["Sanciones penales y la obligación de indemnizar a la Administración.","Sanciones administrativas y la obligación de restaurar el medio ambiente.","Sanciones penales o, en su caso, administrativas, así como la obligación de reparar el daño causado.","Sanciones administrativas y, en su caso, penales."],"c":2,"e":"Art. 45.3: primero las penales.","cat":"Art. 45.3 CE"},{"q":"Según el artículo 47 de la Constitución, la comunidad participará en:","o":["Los beneficios de la especulación del suelo.","La gestión del suelo público.","Las plusvalías que genere la acción urbanística de los entes públicos.","La planificación urbanística."],"c":2,"e":"Art. 47.","cat":"Art. 47 CE"},{"q":"Según el artículo 49 de la Constitución, en la redacción vigente, las personas con discapacidad ejercen los derechos previstos en el Título I:","o":["En los términos que establezcan los tratados internacionales.","En condiciones de libertad e igualdad reales y efectivas.","Con la protección especial que establezca la ley orgánica.","En condiciones de igualdad, previa tutela de los poderes públicos."],"c":1,"e":"Art. 49.1 (reforma de 2024): «Se regulará por ley la protección especial que sea necesaria para dicho ejercicio».","cat":"Art. 49 CE"},{"q":"Según el artículo 49.2 de la Constitución, se atenderán particularmente las necesidades específicas de:","o":["Las personas mayores con discapacidad.","Las personas con discapacidad en el medio rural.","Las mujeres y los menores con discapacidad.","Las personas con discapacidad intelectual."],"c":2,"e":"Art. 49.2.","cat":"Art. 49.2 CE"},{"q":"Según el artículo 50 de la Constitución, los poderes públicos garantizarán la suficiencia económica a los ciudadanos durante la tercera edad mediante pensiones:","o":["Contributivas y no contributivas.","Dignas y actualizadas por ley.","Suficientes y revalorizadas anualmente conforme al IPC.","Adecuadas y periódicamente actualizadas."],"c":3,"e":"Art. 50.","cat":"Art. 50 CE"},{"q":"Según el artículo 51.1 de la Constitución, los poderes públicos garantizarán la defensa de los consumidores y usuarios, protegiendo, mediante procedimientos eficaces:","o":["Sus derechos frente a las prácticas abusivas.","Su información, su educación y sus organizaciones.","La seguridad, la salud y los legítimos intereses económicos de los mismos.","La calidad de los productos y servicios."],"c":2,"e":"Art. 51.1. Información, educación y organizaciones están en el 51.2.","cat":"Art. 51.1 CE"},{"q":"Según el artículo 53.1 de la Constitución, los derechos y libertades del Capítulo segundo se tutelarán de acuerdo con lo previsto en el artículo:","o":["161, 1, a).","162, 1, b).","161, 1, b).","53, 2."],"c":0,"e":"Art. 53.1: recurso de inconstitucionalidad. El amparo es el 161.1.b), vinculado al 53.2.","cat":"Art. 53.1 CE"},{"q":"Según el artículo 53.1 de la Constitución, el ejercicio de los derechos y libertades del Capítulo segundo:","o":["Solo podrá regularse por ley orgánica.","Podrá regularse por ley o por decreto-ley en casos de urgente necesidad.","Se regulará por ley aprobada por mayoría absoluta de ambas Cámaras.","Sólo podrá regularse por ley, que en todo caso deberá respetar su contenido esencial."],"c":3,"e":"Art. 53.1. El decreto-ley no puede afectar a los derechos del Título I (art. 86.1).","cat":"Art. 53.1 CE"},{"q":"Según el artículo 53.2 de la Constitución, cualquier ciudadano podrá recabar la tutela de las libertades y derechos reconocidos en el artículo 14 y la Sección primera del Capítulo segundo ante los Tribunales ordinarios:","o":["Mediante el recurso de amparo ordinario.","Por un procedimiento basado en los principios de urgencia y gratuidad.","Por un procedimiento basado en los principios de preferencia y sumariedad.","Por un procedimiento basado en los principios de oralidad y concentración."],"c":2,"e":"Art. 53.2.","cat":"Art. 53.2 CE"},{"q":"Según el artículo 53.2 de la Constitución, el recurso de amparo ante el Tribunal Constitucional será aplicable también a:","o":["El derecho a la propiedad privada del artículo 33.","Los principios rectores del Capítulo tercero.","El derecho al trabajo del artículo 35.","La objeción de conciencia reconocida en el artículo 30."],"c":3,"e":"Art. 53.2.","cat":"Art. 53.2 CE"},{"q":"Según el artículo 53.3 de la Constitución, los principios reconocidos en el Capítulo tercero:","o":["No vinculan a los poderes públicos.","Sólo podrán ser alegados ante la Jurisdicción ordinaria de acuerdo con lo que dispongan las leyes que los desarrollen.","Son tutelables mediante recurso de amparo.","Podrán ser alegados directamente ante la Jurisdicción ordinaria."],"c":1,"e":"Art. 53.3: además, «informarán la legislación positiva, la práctica judicial y la actuación de los poderes públicos».","cat":"Art. 53.3 CE"},{"q":"Según el artículo 54 de la Constitución, el Defensor del Pueblo es:","o":["Comisionado del Gobierno para la supervisión de la Administración.","Alto comisionado del Congreso de los Diputados para la defensa de los derechos fundamentales.","Alto comisionado de las Cortes Generales, designado por éstas para la defensa de los derechos comprendidos en el Título I.","Órgano constitucional independiente designado por el Rey a propuesta de las Cortes."],"c":2,"e":"Art. 54.","cat":"Art. 54 CE"},{"q":"Según el artículo 81.2 de la Constitución, la aprobación, modificación o derogación de las leyes orgánicas exigirá:","o":["Mayoría absoluta de ambas Cámaras.","Mayoría absoluta del Congreso, en una votación final sobre el conjunto del proyecto.","Mayoría absoluta del Congreso y simple del Senado, en votación final.","Mayoría de tres quintos del Congreso."],"c":1,"e":"Art. 81.2.","cat":"Art. 81.2 CE"},{"q":"Según el artículo 86.1 de la Constitución, los Decretos-leyes no podrán afectar a los derechos, deberes y libertades de los ciudadanos regulados en:","o":["El Título I.","El Capítulo segundo del Título I.","La Sección primera del Capítulo segundo del Título I.","Los artículos 14 a 29."],"c":0,"e":"Art. 86.1: todo el Título I.","cat":"Art. 86.1 CE"},{"q":"Según el artículo 162.1.a) de la Constitución, están legitimados para interponer el recurso de inconstitucionalidad:","o":["El Presidente del Gobierno, el Defensor del Pueblo, el Ministerio Fiscal, 50 Diputados y 50 Senadores.","El Gobierno, el Defensor del Pueblo, 50 Diputados, 50 Senadores y los Presidentes de las Comunidades Autónomas.","Toda persona natural o jurídica que invoque un interés legítimo, el Defensor del Pueblo y el Ministerio Fiscal.","El Presidente del Gobierno, el Defensor del Pueblo, 50 Diputados, 50 Senadores, los órganos colegiados ejecutivos de las Comunidades Autónomas y, en su caso, las Asambleas de las mismas."],"c":3,"e":"Art. 162.1.a). La d) es la legitimación para el amparo (162.1.b).","cat":"Art. 162.1.a CE"},{"q":"Según el artículo 162.1.b) de la Constitución, están legitimados para interponer el recurso de amparo:","o":["Toda persona natural o jurídica que invoque un interés legítimo, así como el Defensor del Pueblo y el Ministerio Fiscal.","Las personas físicas titulares del derecho vulnerado y el Ministerio Fiscal.","El Defensor del Pueblo, 50 Diputados y el Ministerio Fiscal.","Toda persona que invoque un interés directo y el Defensor del Pueblo."],"c":0,"e":"Art. 162.1.b).","cat":"Art. 162.1.b CE"},{"q":"Según el artículo 168 de la Constitución, exige el procedimiento agravado de reforma la revisión parcial que afecte:","o":["Al Título preliminar, al Capítulo segundo del Título I y al Título X.","Al Título preliminar, al Capítulo segundo, Sección primera del Título I, o al Título II.","Al Título I y al Título II.","Al Título preliminar y a todo el Título I."],"c":1,"e":"Art. 168.1. El art. 14 y la Sección 2.ª se reforman por el art. 167.","cat":"Art. 168 CE"},{"q":"Según el artículo 169 de la Constitución, no podrá iniciarse la reforma constitucional:","o":["Mientras esté disuelto el Congreso de los Diputados.","En tiempo de guerra o de vigencia del estado de sitio.","Durante el último año de la legislatura.","En tiempo de guerra o de vigencia de alguno de los estados previstos en el artículo 116."],"c":3,"e":"Art. 169: los tres estados, incluida la alarma.","cat":"Art. 169 CE"},{"q":"Según el artículo 55.1 de la Constitución, se exceptúa de la suspensión el apartado 3 del artículo 17 para el supuesto de declaración del:","o":["Estado de alarma.","Estado de sitio.","Estado de excepción.","Estado de excepción y de sitio."],"c":2,"e":"Art. 55.1. En el estado de sitio sí puede suspenderse (art. 32.3 LO 4/1981).","cat":"Art. 55.1 CE"},{"q":"¿Cuál de los siguientes derechos NO puede ser suspendido con la declaración del estado de excepción o de sitio, según el artículo 55.1 de la Constitución?","o":["El derecho de reunión del artículo 21.","El secreto de las comunicaciones del artículo 18.3.","El derecho de asociación del artículo 22.","El derecho a adoptar medidas de conflicto colectivo del artículo 37.2."],"c":2,"e":"Art. 55.1.","cat":"Art. 55.1 CE"},{"q":"Según el artículo 55.1 de la Constitución, los derechos de su enumeración podrán ser suspendidos cuando se acuerde la declaración:","o":["De los estados de alarma, excepción o sitio.","Del estado de alarma o de excepción.","Del estado de sitio exclusivamente.","Del estado de excepción o de sitio."],"c":3,"e":"Art. 55.1: la alarma no permite suspender derechos.","cat":"Art. 55.1 CE"},{"q":"Según el artículo 55.2 de la Constitución, la suspensión individual de derechos en relación con la actuación de bandas armadas o elementos terroristas puede afectar a los derechos reconocidos en los artículos:","o":["17, apartado 3, y 18, apartado 3.","17, apartados 2 y 3, 18, apartado 2, y 21.","17, 18 y 19.","17, apartado 2, y 18, apartados 2 y 3."],"c":3,"e":"Art. 55.2.","cat":"Art. 55.2 CE"},{"q":"Según el artículo 55.2 de la Constitución, la utilización injustificada o abusiva de las facultades reconocidas en la ley orgánica de suspensión individual de derechos producirá:","o":["Responsabilidad penal, como violación de los derechos y libertades reconocidos por las leyes.","Responsabilidad política del Gobierno ante el Congreso.","Responsabilidad disciplinaria de los funcionarios actuantes.","La nulidad de las actuaciones y responsabilidad patrimonial del Estado."],"c":0,"e":"Art. 55.2, último párrafo.","cat":"Art. 55.2 CE"},{"q":"Según el artículo 116.2 de la Constitución, el estado de alarma será declarado por el Gobierno mediante decreto acordado en Consejo de Ministros por un plazo máximo de quince días, dando cuenta:","o":["Al Congreso de los Diputados y al Senado, en sesión conjunta.","A las Cortes Generales en el plazo de quince días.","A la Diputación Permanente del Congreso.","Al Congreso de los Diputados, reunido inmediatamente al efecto."],"c":3,"e":"Art. 116.2.","cat":"Art. 116.2 CE"},{"q":"Según el artículo 116.3 de la Constitución, la duración del estado de excepción no podrá exceder de:","o":["Treinta días, prorrogables por otro plazo igual, con los mismos requisitos.","Treinta días, prorrogables por plazos sucesivos de quince días.","Sesenta días, improrrogables.","Quince días, prorrogables con autorización del Congreso."],"c":0,"e":"Art. 116.3.","cat":"Art. 116.3 CE"},{"q":"Según el artículo 116.4 de la Constitución, el estado de sitio será declarado:","o":["Por las Cortes Generales, por mayoría de tres quintos, a propuesta del Gobierno.","Por el Gobierno, previa autorización de la mayoría absoluta del Congreso.","Por el Gobierno, dando cuenta inmediata al Congreso.","Por la mayoría absoluta del Congreso de los Diputados, a propuesta exclusiva del Gobierno."],"c":3,"e":"Art. 116.4.","cat":"Art. 116.4 CE"},{"q":"Según el artículo 116.5 de la Constitución, mientras estén declarados alguno de los estados de alarma, excepción o sitio:","o":["No podrá procederse a la disolución del Congreso.","Las competencias del Congreso pasan a la Diputación Permanente.","Quedan suspendidas las sesiones de las Cámaras.","El Gobierno podrá disolver las Cortes previa autorización del Rey."],"c":0,"e":"Art. 116.5. La Diputación Permanente solo asume las competencias si el Congreso ya estaba disuelto o había expirado su mandato.","cat":"Art. 116.5 CE"},{"q":"Según el artículo 116.6 de la Constitución, la declaración de los estados de alarma, de excepción y de sitio:","o":["Suspende el control jurisdiccional de los actos de la Administración.","No modificarán el principio de responsabilidad del Gobierno y de sus agentes reconocidos en la Constitución y en las leyes.","Suspende la responsabilidad patrimonial de la Administración.","Exime al Gobierno de responsabilidad política durante su vigencia."],"c":1,"e":"Art. 116.6. Además, los actos son impugnables en vía jurisdiccional (art. 3.1 LO 4/1981).","cat":"Art. 116.6 CE"},{"q":"Según el artículo 1 de la Ley Orgánica 4/1981, procederá la declaración de los estados de alarma, excepción o sitio cuando:","o":["Lo solicite la mayoría absoluta del Congreso de los Diputados.","Circunstancias extraordinarias hiciesen imposible el mantenimiento de la normalidad mediante los poderes ordinarios de las Autoridades competentes.","Se produzca una grave alteración del orden público en todo el territorio nacional.","Circunstancias extraordinarias dificulten gravemente el funcionamiento de los servicios públicos."],"c":1,"e":"Art. 1.1.","cat":"Art. 1.1 LO 4/1981"},{"q":"Según el artículo 1.3 de la Ley Orgánica 4/1981, finalizada la vigencia de los estados de alarma, excepción y sitio decaerán en su eficacia las competencias sancionadoras y preventivas y las medidas adoptadas en base a éstas:","o":["Sin excepción alguna.","Salvo las adoptadas por la Autoridad militar.","Salvo las que hubiese convalidado el Congreso de los Diputados.","Salvo las que consistiesen en sanciones firmes."],"c":3,"e":"Art. 1.3.","cat":"Art. 1.3 LO 4/1981"},{"q":"Según el artículo 2 de la Ley Orgánica 4/1981, la declaración de los estados de alarma, excepción o sitio entrará en vigor:","o":["Desde su comunicación al Congreso de los Diputados.","Desde el instante mismo de su publicación en el «Boletín Oficial del Estado».","Desde su aprobación por el Consejo de Ministros.","Al día siguiente de su publicación en el «Boletín Oficial del Estado»."],"c":1,"e":"Art. 2. La propia LO 4/1981 entró en vigor al día siguiente de su publicación (disposición final): no confundir.","cat":"Art. 2 LO 4/1981"},{"q":"¿Cuál de las siguientes NO es una alteración grave de la normalidad que permita declarar el estado de alarma según el artículo 4 de la Ley Orgánica 4/1981?","o":["Los accidentes de gran magnitud.","Las crisis sanitarias, tales como epidemias y situaciones de contaminación graves.","Las situaciones de desabastecimiento de productos de primera necesidad.","La grave alteración del normal funcionamiento de las instituciones democráticas."],"c":3,"e":"Art. 4. La alteración de las instituciones democráticas es presupuesto del estado de excepción (art. 13.1).","cat":"Art. 4 LO 4/1981"},{"q":"Según el artículo 4.c) de la Ley Orgánica 4/1981, la paralización de servicios públicos esenciales para la comunidad permite declarar el estado de alarma cuando no se garantice lo dispuesto en los artículos 28.2 y 37.2 de la Constitución y:","o":["Así lo autorice previamente el Congreso de los Diputados.","Concurra alguna de las demás circunstancias o situaciones contenidas en el artículo.","La paralización se prolongue más de quince días.","Lo solicite el Presidente de la Comunidad Autónoma afectada."],"c":1,"e":"Art. 4.c). La paralización por sí sola no basta.","cat":"Art. 4.c LO 4/1981"},{"q":"Según el artículo 5 de la Ley Orgánica 4/1981, cuando los supuestos del estado de alarma afecten exclusivamente a todo o parte del ámbito territorial de una Comunidad Autónoma:","o":["El Consejo de Gobierno de la Comunidad podrá declarar el estado de alarma.","El Presidente de la misma podrá solicitar del Gobierno la declaración de estado de alarma.","El Delegado del Gobierno será la Autoridad competente.","La Asamblea legislativa de la Comunidad deberá autorizar la declaración."],"c":1,"e":"Art. 5. La declaración corresponde siempre al Gobierno.","cat":"Art. 5 LO 4/1981"},{"q":"Según el artículo 6.2 de la Ley Orgánica 4/1981, el estado de alarma sólo se podrá prorrogar:","o":["Con autorización de las Cortes Generales, por un máximo de quince días.","Con autorización del Congreso de los Diputados, por mayoría absoluta, por un plazo máximo de treinta días.","Por decreto del Consejo de Ministros, dando cuenta al Congreso de los Diputados.","Con autorización expresa del Congreso de los Diputados, que en este caso podrá establecer el alcance y las condiciones vigentes durante la prórroga."],"c":3,"e":"Art. 6.2. La ley no fija un límite máximo para la prórroga (la STC 183/2021 censuró una de seis meses por su falta de justificación).","cat":"Art. 6.2 LO 4/1981"},{"q":"Según el artículo 7 de la Ley Orgánica 4/1981, a los efectos del estado de alarma la Autoridad competente será:","o":["El Gobierno o, por delegación de éste, el Presidente de la Comunidad Autónoma cuando la declaración afecte exclusivamente a todo o parte del territorio de una Comunidad.","El Ministro del Interior o, por delegación, el Delegado del Gobierno.","El Presidente del Gobierno o, en su caso, la Autoridad militar que designe.","El Presidente de la Comunidad Autónoma afectada en todo caso."],"c":0,"e":"Art. 7.","cat":"Art. 7 LO 4/1981"},{"q":"Según el artículo 11 de la Ley Orgánica 4/1981, el decreto de declaración del estado de alarma podrá acordar intervenir y ocupar transitoriamente industrias, fábricas, talleres, explotaciones o locales de cualquier naturaleza:","o":["Previa autorización del Congreso de los Diputados.","Con excepción de los locales de partidos políticos y sindicatos.","Incluidos los domicilios privados, previa autorización judicial.","Con excepción de domicilios privados, dando cuenta de ello a los Ministerios interesados."],"c":3,"e":"Art. 11.c).","cat":"Art. 11.c LO 4/1981"},{"q":"Según el artículo 13.2 de la Ley Orgánica 4/1981, la solicitud de autorización del estado de excepción NO tiene que contener:","o":["La relación de las medidas a adoptar referidas a los derechos cuya suspensión se solicita.","La designación de la Autoridad militar que haya de ejecutar las medidas.","El ámbito territorial y la duración del estado de excepción.","La cuantía máxima de las sanciones pecuniarias que la Autoridad gubernativa esté autorizada para imponer."],"c":1,"e":"Art. 13.2. La Autoridad militar es propia del estado de sitio (art. 33.2).","cat":"Art. 13.2 LO 4/1981"},{"q":"Según el artículo 13.3 de la Ley Orgánica 4/1981, el Congreso, ante la solicitud de autorización del estado de excepción remitida por el Gobierno:","o":["Necesitará la mayoría absoluta para aprobarla.","Solo podrá aprobarla o rechazarla en su totalidad.","Podrá aprobarla en sus propios términos o introducir modificaciones en la misma.","Deberá pronunciarse en el plazo de veinticuatro horas."],"c":2,"e":"Art. 13.3.","cat":"Art. 13.3 LO 4/1981"},{"q":"Según el artículo 15.2 de la Ley Orgánica 4/1981, el Gobierno podrá poner fin al estado de excepción antes de que finalice el período para el que fue declarado:","o":["Previa autorización del Congreso de los Diputados.","Mediante decreto acordado en Consejo de Ministros, dando cuenta de ello inmediatamente al Congreso de los Diputados.","Solo si lo solicita la mayoría absoluta del Congreso.","Mediante orden del Ministro del Interior."],"c":1,"e":"Art. 15.2.","cat":"Art. 15.2 LO 4/1981"},{"q":"Según el artículo 16 de la Ley Orgánica 4/1981, durante el estado de excepción la detención acordada por la Autoridad gubernativa no podrá exceder de:","o":["Diez días, y habrá de ser comunicada al juez competente en el plazo de veinticuatro horas.","Setenta y dos horas, y habrá de ser comunicada al juez de inmediato.","Diez días, y habrá de ser comunicada al juez en el plazo de setenta y dos horas.","Treinta días, y habrá de ser comunicada al Ministerio Fiscal en veinticuatro horas."],"c":0,"e":"Art. 16.","cat":"Art. 16 LO 4/1981"},{"q":"Según el artículo 17 de la Ley Orgánica 4/1981, el reconocimiento de la casa, papeles y efectos en el estado de excepción será presenciado, en todo caso, por:","o":["El juez de instrucción del partido.","El Secretario judicial y dos testigos.","Dos vecinos de la casa o de las inmediaciones, si en ellas los hubiere.","Un representante del Ministerio Fiscal."],"c":2,"e":"Art. 17.3: el titular, el encargado o los familiares mayores de edad pueden presenciarlo; los dos vecinos, en todo caso.","cat":"Art. 17.3 LO 4/1981"},{"q":"Según el artículo 20 de la Ley Orgánica 4/1981, la Autoridad gubernativa podrá exigir a personas determinadas que comuniquen todo desplazamiento fuera de la localidad de su residencia habitual con una antelación de:","o":["Tres días.","Dos días.","Veinticuatro horas.","Cinco días."],"c":1,"e":"Art. 20.3.","cat":"Art. 20.3 LO 4/1981"},{"q":"Según el artículo 21 de la Ley Orgánica 4/1981, la suspensión de publicaciones y emisiones durante el estado de excepción:","o":["Solo afectará a los medios de titularidad pública.","Requerirá autorización judicial previa.","Podrá acompañarse de censura previa por un máximo de treinta días.","No podrá llevar aparejado ningún tipo de censura previa."],"c":3,"e":"Art. 21.2.","cat":"Art. 21.2 LO 4/1981"},{"q":"Según el artículo 22 de la Ley Orgánica 4/1981, durante el estado de excepción no podrán ser prohibidas, disueltas ni sometidas a autorización previa:","o":["Las manifestaciones convocadas por los sindicatos más representativos.","Las reuniones de los órganos de gobierno de las Comunidades Autónomas.","Las reuniones orgánicas que los partidos políticos, los sindicatos y las asociaciones empresariales realicen en cumplimiento de sus fines y de acuerdo con sus Estatutos.","Las reuniones celebradas en domicilios privados."],"c":2,"e":"Art. 22.3.","cat":"Art. 22.3 LO 4/1981"},{"q":"Según el artículo 24 de la Ley Orgánica 4/1981, durante el estado de excepción los apátridas y refugiados respecto de los cuales no sea posible la expulsión:","o":["Se someterán al mismo régimen que los españoles.","Deberán fijar su residencia en la localidad que se determine.","Serán internados en centros habilitados al efecto.","Quedarán bajo la custodia de la Autoridad militar."],"c":0,"e":"Art. 24.3.","cat":"Art. 24.3 LO 4/1981"},{"q":"Según el artículo 30 de la Ley Orgánica 4/1981, los condenados en los procedimientos por hechos contrarios al orden público durante el estado de excepción:","o":["Cumplirán la pena en establecimientos militares.","Verán duplicada la duración de la pena.","Serán juzgados por la jurisdicción militar.","Quedan exceptuados de los beneficios de la remisión condicional durante la vigencia del estado de excepción."],"c":3,"e":"Art. 30.2.","cat":"Art. 30.2 LO 4/1981"},{"q":"Según el artículo 32 de la Ley Orgánica 4/1981, el Gobierno podrá proponer al Congreso de los Diputados la declaración de estado de sitio cuando se produzca o amenace producirse:","o":["Una insurrección o acto de fuerza contra la soberanía o independencia de España, su integridad territorial o el ordenamiento constitucional, que no pueda resolverse por otros medios.","Una paralización de los servicios públicos esenciales en todo el territorio nacional.","Una agresión exterior que exija la declaración de guerra.","Una grave alteración del orden público que no pueda restablecerse con las potestades ordinarias."],"c":0,"e":"Art. 32.1.","cat":"Art. 32.1 LO 4/1981"},{"q":"Según el artículo 32.3 de la Ley Orgánica 4/1981, la declaración del estado de sitio podrá autorizar, además de lo previsto para los estados de alarma y excepción:","o":["La suspensión del derecho de asociación.","La suspensión del funcionamiento de las Cortes Generales.","La suspensión temporal de las garantías jurídicas del detenido que se reconocen en el apartado tres del artículo diecisiete de la Constitución.","La aplicación de la pena de muerte prevista en las leyes penales militares."],"c":2,"e":"Art. 32.3.","cat":"Art. 32.3 LO 4/1981"},{"q":"Según el artículo 33 de la Ley Orgánica 4/1981, en el estado de sitio la Autoridad militar que haya de ejecutar las medidas será designada por:","o":["El Rey, como mando supremo de las Fuerzas Armadas.","El Congreso de los Diputados en la declaración.","El Jefe del Estado Mayor de la Defensa.","El Gobierno, bajo cuya dirección actuará."],"c":3,"e":"Art. 33.2.","cat":"Art. 33.2 LO 4/1981"},{"q":"Según el artículo 35 de la Ley Orgánica 4/1981, en la declaración del estado de sitio podrá determinar los delitos que durante su vigencia quedan sometidos a la Jurisdicción Militar:","o":["El Consejo General del Poder Judicial.","El Congreso de los Diputados.","La Autoridad militar mediante bando.","El Gobierno."],"c":1,"e":"Art. 35.","cat":"Art. 35 LO 4/1981"},{"q":"Según el artículo 1 de la Ley Orgánica 3/1981, el Defensor del Pueblo podrá supervisar la actividad de la Administración:","o":["Dando cuenta a las Cortes Generales.","Dando cuenta al Gobierno y a las Cortes Generales.","Dando cuenta al Congreso de los Diputados.","Dando cuenta al Tribunal Constitucional."],"c":0,"e":"Art. 1.","cat":"Art. 1 LO 3/1981"},{"q":"Según el artículo 2 de la Ley Orgánica 3/1981, el Defensor del Pueblo será elegido por las Cortes Generales para un periodo de:","o":["Cuatro años.","Nueve años.","Cinco años.","Seis años."],"c":2,"e":"Art. 2.1.","cat":"Art. 2.1 LO 3/1981"},{"q":"Según el artículo 2.4 de la Ley Orgánica 3/1981, será designado Defensor del Pueblo quien obtuviese una votación favorable de:","o":["Las tres quintas partes de los miembros del Congreso y posteriormente, en un plazo máximo de veinte días, fuese ratificado por esta misma mayoría del Senado.","Las dos terceras partes de ambas Cámaras en sesión conjunta.","Las tres quintas partes de los miembros del Congreso y posteriormente, en un plazo máximo de un mes, fuese ratificado por la mayoría absoluta del Senado.","La mayoría absoluta del Congreso y posteriormente, en un plazo máximo de veinte días, fuese ratificado por la mayoría absoluta del Senado."],"c":0,"e":"Art. 2.4.","cat":"Art. 2.4 LO 3/1981"},{"q":"Según el artículo 2.4 de la Ley Orgánica 3/1981, propuesto el candidato o candidatos, se convocará al Pleno del Congreso para que proceda a su elección en término:","o":["No inferior a diez días.","No superior a diez días.","No superior a un mes.","No inferior a quince días."],"c":0,"e":"Art. 2.4.","cat":"Art. 2.4 LO 3/1981"},{"q":"Según el artículo 2.3 de la Ley Orgánica 3/1981, los acuerdos de la Comisión Mixta Congreso-Senado encargada de relacionarse con el Defensor del Pueblo se adoptarán por:","o":["Mayoría de tres quintos.","Unanimidad.","Mayoría simple.","Mayoría absoluta."],"c":2,"e":"Art. 2.3.","cat":"Art. 2.3 LO 3/1981"},{"q":"Según el artículo 3 de la Ley Orgánica 3/1981, podrá ser elegido Defensor del Pueblo:","o":["Cualquier español mayor de edad que se encuentre en el pleno disfrute de sus derechos civiles y políticos.","Cualquier español mayor de edad que no haya ostentado cargo político en los cinco años anteriores.","Cualquier ciudadano de la Unión Europea residente en España.","Cualquier jurista español de reconocida competencia con más de quince años de ejercicio profesional."],"c":0,"e":"Art. 3.","cat":"Art. 3 LO 3/1981"},{"q":"Según el artículo 4.2 de la Ley Orgánica 3/1981, el Defensor del Pueblo tomará posesión de su cargo:","o":["Ante la Comisión Mixta Congreso-Senado.","Ante el Pleno del Congreso de los Diputados.","Ante las Mesas de ambas Cámaras reunidas conjuntamente.","Ante el Rey."],"c":2,"e":"Art. 4.2.","cat":"Art. 4.2 LO 3/1981"},{"q":"¿Cuál de las siguientes NO es una causa de cese del Defensor del Pueblo según el artículo 5 de la Ley Orgánica 3/1981?","o":["La pérdida de la confianza de la Comisión Mixta Congreso-Senado.","Haber sido condenado, mediante sentencia firme, por delito doloso.","La expiración del plazo de su nombramiento.","Actuar con notoria negligencia en el cumplimiento de las obligaciones y deberes del cargo."],"c":0,"e":"Art. 5.1: renuncia, expiración, muerte o incapacidad sobrevenida, notoria negligencia y condena firme por delito doloso.","cat":"Art. 5.1 LO 3/1981"},{"q":"Según el artículo 5.2 de la Ley Orgánica 3/1981, en los casos de muerte, renuncia y expiración del plazo del mandato, la vacante en el cargo de Defensor del Pueblo se declarará por:","o":["La Comisión Mixta Congreso-Senado.","Las tres quintas partes de cada Cámara.","Los Presidentes del Congreso y del Senado conjuntamente.","El Presidente del Congreso."],"c":3,"e":"Art. 5.2: en los demás casos decide la mayoría de tres quintos de cada Cámara.","cat":"Art. 5.2 LO 3/1981"},{"q":"Según el artículo 5.4 de la Ley Orgánica 3/1981, en caso de muerte, cese o incapacidad del Defensor del Pueblo, y en tanto no procedan las Cortes Generales a una nueva designación, desempeñarán sus funciones interinamente:","o":["El Secretario General de la institución.","Los Adjuntos al Defensor del Pueblo, en su propio orden.","El Adjunto designado por la Comisión Mixta.","El Presidente de la Comisión Mixta Congreso-Senado."],"c":1,"e":"Art. 5.4.","cat":"Art. 5.4 LO 3/1981"},{"q":"Según el artículo 6.3 de la Ley Orgánica 3/1981, la decisión sobre la inculpación, prisión, procesamiento y juicio del Defensor del Pueblo corresponde exclusivamente a:","o":["La Sala de lo Penal del Tribunal Supremo.","El Pleno del Congreso, previo suplicatorio.","El Tribunal Constitucional.","La Sala de lo Penal de la Audiencia Nacional."],"c":0,"e":"Art. 6.3.","cat":"Art. 6.3 LO 3/1981"},{"q":"Según el artículo 7.2 de la Ley Orgánica 3/1981, el Defensor del Pueblo deberá cesar en toda situación de incompatibilidad que pudiera afectarle:","o":["Antes de su elección por el Congreso.","Dentro de los quince días siguientes a su nombramiento.","Dentro de los diez días siguientes a su nombramiento y antes de tomar posesión.","Dentro del mes siguiente a su toma de posesión."],"c":2,"e":"Art. 7.2: si no, se entiende que no acepta el nombramiento.","cat":"Art. 7.2 LO 3/1981"},{"q":"Según el artículo 8.2 de la Ley Orgánica 3/1981, los Adjuntos del Defensor del Pueblo:","o":["Serán elegidos por las Cámaras por mayoría de tres quintos.","Serán nombrados y separados por el Defensor del Pueblo previa conformidad de las Cámaras.","Serán nombrados libremente por el Defensor del Pueblo.","Serán nombrados por los Presidentes del Congreso y del Senado."],"c":1,"e":"Art. 8.2.","cat":"Art. 8.2 LO 3/1981"},{"q":"Según el artículo 10.1 de la Ley Orgánica 3/1981, podrá dirigirse al Defensor del Pueblo:","o":["Toda persona física que acredite un interés directo.","Todo español mayor de edad.","Toda persona natural o jurídica que invoque un interés legítimo, sin restricción alguna.","Toda persona natural o jurídica, salvo los internos en centros penitenciarios."],"c":2,"e":"Art. 10.1: no son impedimento la nacionalidad, la residencia, el sexo, la minoría de edad ni el internamiento.","cat":"Art. 10.1 LO 3/1981"},{"q":"Según el artículo 10.3 de la Ley Orgánica 3/1981, no podrá presentar quejas ante el Defensor del Pueblo:","o":["Ningún menor de edad sin representación.","Ningún Diputado o Senador individualmente.","Ningún extranjero en situación irregular.","Ninguna autoridad administrativa en asuntos de su competencia."],"c":3,"e":"Art. 10.3. Los Diputados y Senadores sí pueden solicitar su intervención individualmente (10.2).","cat":"Art. 10.3 LO 3/1981"},{"q":"Según el artículo 11 de la Ley Orgánica 3/1981, cuando las Cortes Generales no se encuentren reunidas, hubieren sido disueltas o hubiere expirado su mandato, el Defensor del Pueblo:","o":["Se dirigirá a las Diputaciones Permanentes de las Cámaras.","Cesará en sus funciones.","Suspenderá su actividad hasta la constitución de las nuevas Cámaras.","Se dirigirá al Gobierno."],"c":0,"e":"Art. 11.1-2.","cat":"Art. 11 LO 3/1981"},{"q":"Según el artículo 13 de la Ley Orgánica 3/1981, cuando el Defensor del Pueblo reciba quejas referidas al funcionamiento de la Administración de Justicia, deberá dirigirlas:","o":["Al Ministerio Fiscal o bien dar traslado de las mismas al Consejo General del Poder Judicial, según el tipo de reclamación.","Al Ministerio de Justicia.","Al Consejo General del Poder Judicial en todo caso.","Al Tribunal Supremo."],"c":0,"e":"Art. 13.","cat":"Art. 13 LO 3/1981"},{"q":"Según el artículo 15.1 de la Ley Orgánica 3/1981, toda queja se presentará en el plazo máximo de:","o":["Tres meses desde la notificación del acto.","Seis meses desde que se produjeron los hechos.","Un año desde que se produjeron los hechos.","Un año, contado a partir del momento en que se tuviera conocimiento de los hechos objeto de la misma."],"c":3,"e":"Art. 15.1: el plazo se cuenta desde el conocimiento de los hechos, no desde que se produjeron.","cat":"Art. 15.1 LO 3/1981"},{"q":"Según el artículo 17.3 de la Ley Orgánica 3/1981, las decisiones del Defensor del Pueblo sobre el rechazo de las quejas:","o":["Podrán ser objeto de reposición en el plazo de un mes.","Serán recurribles en alzada ante la Comisión Mixta.","Serán recurribles ante la jurisdicción contencioso-administrativa.","No serán susceptibles de recurso."],"c":3,"e":"Art. 17.3: además, rechaza las quejas anónimas.","cat":"Art. 17.3 LO 3/1981"},{"q":"Según el artículo 18.1 de la Ley Orgánica 3/1981, admitida la queja, el Jefe del Organismo o Dependencia administrativa procedente deberá remitir informe escrito en el plazo máximo de:","o":["Quince días, ampliable cuando concurran circunstancias que lo aconsejen a juicio del Defensor del Pueblo.","Un mes, ampliable a petición del organismo.","Diez días, improrrogable.","Veinte días hábiles."],"c":0,"e":"Art. 18.1.","cat":"Art. 18.1 LO 3/1981"},{"q":"Según el artículo 22.1 de la Ley Orgánica 3/1981, la no remisión al Defensor del Pueblo de documentos clasificados como secretos deberá ser acordada por:","o":["La Comisión Mixta Congreso-Senado.","El Ministro del Departamento afectado.","El Consejo de Ministros, acompañándose una certificación acreditativa del acuerdo denegatorio.","El Presidente del Gobierno."],"c":2,"e":"Art. 22.1.","cat":"Art. 22.1 LO 3/1981"},{"q":"Según el artículo 25.1 de la Ley Orgánica 3/1981, cuando el Defensor del Pueblo tenga conocimiento de una conducta o hechos presumiblemente delictivos, lo pondrá de inmediato en conocimiento de:","o":["El juez de instrucción competente.","La Comisión Mixta Congreso-Senado.","El Fiscal General del Estado.","El Ministro de Justicia."],"c":2,"e":"Art. 25.1.","cat":"Art. 25.1 LO 3/1981"},{"q":"Según el artículo 28.1 de la Ley Orgánica 3/1981, el Defensor del Pueblo, aun no siendo competente para modificar o anular los actos y resoluciones de la Administración Pública, podrá:","o":["Sugerir la modificación de los criterios utilizados para la producción de aquéllos.","Suspender cautelarmente su ejecución.","Declarar su nulidad cuando lesionen derechos fundamentales.","Requerir su revisión de oficio con carácter vinculante."],"c":0,"e":"Art. 28.1.","cat":"Art. 28.1 LO 3/1981"},{"q":"Según el artículo 29 de la Ley Orgánica 3/1981, el Defensor del Pueblo está legitimado para interponer:","o":["Los recursos contencioso-administrativos y de amparo.","El recurso de inconstitucionalidad y la cuestión de inconstitucionalidad.","Solo el recurso de amparo.","Los recursos de inconstitucionalidad y de amparo."],"c":3,"e":"Art. 29.","cat":"Art. 29 LO 3/1981"},{"q":"Según el artículo 30.1 de la Ley Orgánica 3/1981, las autoridades y los funcionarios vendrán obligados a responder por escrito a las advertencias, recomendaciones, recordatorios y sugerencias del Defensor del Pueblo en término no superior al de:","o":["Quince días.","Tres meses.","Un mes.","Diez días."],"c":2,"e":"Art. 30.1.","cat":"Art. 30.1 LO 3/1981"},{"q":"Según el artículo 32.1 de la Ley Orgánica 3/1981, el Defensor del Pueblo dará cuenta anualmente a las Cortes Generales de la gestión realizada en un informe que presentará:","o":["Cuando se hallen reunidas en periodo ordinario de sesiones.","En el primer trimestre de cada año natural.","Ante la Comisión Mixta, en el mes de febrero.","Ante la Diputación Permanente de cada Cámara."],"c":0,"e":"Art. 32.1. Los informes extraordinarios van a las Diputaciones Permanentes si las Cámaras no están reunidas (32.2).","cat":"Art. 32.1 LO 3/1981"},{"q":"Según el artículo 33.4 de la Ley Orgánica 3/1981, un resumen del informe anual:","o":["Será expuesto oralmente por el Defensor del Pueblo ante los Plenos de ambas Cámaras, pudiendo intervenir los grupos parlamentarios a efectos de fijar su postura.","Será remitido al Gobierno para su contestación en el plazo de un mes.","Será expuesto ante el Pleno del Congreso exclusivamente.","Será publicado en el BOE y debatido en la Comisión Mixta."],"c":0,"e":"Art. 33.4.","cat":"Art. 33.4 LO 3/1981"},{"q":"Según el artículo 36 de la Ley Orgánica 3/1981, los adjuntos y asesores del Defensor del Pueblo:","o":["Cesarán automáticamente en el momento de la toma de posesión de un nuevo Defensor del Pueblo.","Continuarán en funciones hasta que el nuevo Defensor nombre a los sustitutos.","Cesarán al expirar el mandato de las Cortes que eligieron al Defensor.","Tienen un mandato propio de cinco años."],"c":0,"e":"Art. 36.","cat":"Art. 36 LO 3/1981"},{"q":"Según el artículo 37 de la Ley Orgánica 3/1981, la dotación económica necesaria para el funcionamiento de la institución del Defensor del Pueblo constituirá una partida dentro de:","o":["Los Presupuestos de las Cortes Generales.","Los Presupuestos del Ministerio de la Presidencia.","Los Presupuestos del Congreso de los Diputados.","Los Presupuestos Generales del Estado, en la sección de Órganos Constitucionales."],"c":0,"e":"Art. 37.","cat":"Art. 37 LO 3/1981"},{"q":"Según la disposición final única de la Ley Orgánica 3/1981, el Consejo Asesor del Mecanismo Nacional de Prevención de la Tortura será presidido por:","o":["El Adjunto Primero en todo caso.","El Adjunto en el que el Defensor del Pueblo delegue las funciones previstas en esta disposición.","El Defensor del Pueblo.","Un vocal elegido por el propio Consejo."],"c":1,"e":"Disposición final única, apartado segundo.","cat":"DF única LO 3/1981"},{"q":"Según el artículo 41.1 de la Ley Orgánica 2/1979, del Tribunal Constitucional, serán susceptibles de amparo constitucional:","o":["Los derechos y libertades reconocidos en los artículos 14 a 29 de la Constitución, y la objeción de conciencia reconocida en el artículo 30.","Los derechos y libertades reconocidos en los artículos 14 a 29 de la Constitución, sin incluir la objeción de conciencia.","Los derechos y libertades reconocidos en los artículos 14 a 38 de la Constitución.","Los derechos y libertades reconocidos en los artículos 15 a 29 de la Constitución, excluido el principio de igualdad."],"c":0,"e":"Art. 41.1 LOTC: «artículos catorce a veintinueve» e «Igual protección será aplicable a la objeción de conciencia reconocida en el artículo treinta».","cat":"Art. 41.1 LOTC"},{"q":"Según el artículo 42 de la LOTC, las decisiones o actos sin valor de Ley emanados de las Cortes o de las Asambleas legislativas de las Comunidades Autónomas que violen derechos susceptibles de amparo podrán ser recurridos dentro del plazo de:","o":["Treinta días desde que sean firmes.","Veinte días desde su publicación.","Tres meses desde que, con arreglo a las normas internas de las Cámaras o Asambleas, sean firmes.","Un mes desde su adopción."],"c":2,"e":"Art. 42 LOTC.","cat":"Art. 42 LOTC"},{"q":"Según el artículo 43 de la LOTC, el plazo para interponer el recurso de amparo frente a violaciones originadas por el Gobierno o sus autoridades o funcionarios será:","o":["El de tres meses desde que el acto sea firme.","El de los veinte días siguientes a la notificación de la resolución recaída en el previo proceso judicial.","El de los treinta días siguientes a la notificación de la resolución recaída en el proceso judicial.","El de los diez días siguientes a la notificación del acto administrativo."],"c":1,"e":"Art. 43.2 LOTC: veinte días. Trampa: 30 días es el plazo del art. 44 (órgano judicial) y tres meses el del art. 42 (Parlamentos).","cat":"Art. 43.2 LOTC"},{"q":"Según el artículo 43.1 de la LOTC, las violaciones de derechos originadas por el Gobierno o los órganos ejecutivos colegiados de las comunidades autónomas podrán dar lugar al recurso de amparo:","o":["Solo si el Defensor del Pueblo lo solicita.","Una vez agotada la vía administrativa, sin necesidad de vía judicial.","Una vez que se haya agotado la vía judicial procedente.","Directamente, sin necesidad de acudir previamente a la vía judicial."],"c":2,"e":"Art. 43.1 LOTC.","cat":"Art. 43.1 LOTC"},{"q":"Según el artículo 44.2 de la LOTC, el plazo para interponer el recurso de amparo frente a violaciones con origen inmediato y directo en un acto u omisión de un órgano judicial será de:","o":["10 días, desde la notificación de la sentencia.","Tres meses, desde que la resolución sea firme.","20 días, a partir de la notificación de la resolución recaída en el proceso judicial.","30 días, a partir de la notificación de la resolución recaída en el proceso judicial."],"c":3,"e":"Art. 44.2 LOTC.","cat":"Art. 44.2 LOTC"},{"q":"Según el artículo 44.1 de la LOTC, uno de los requisitos del amparo frente a actos de órganos judiciales es:","o":["Que el Tribunal Constitucional pueda entrar a conocer de los hechos que dieron lugar al proceso.","Que se haya interpuesto previamente queja ante el Defensor del Pueblo.","Que se haya denunciado formalmente en el proceso, si hubo oportunidad, la vulneración del derecho constitucional tan pronto como, una vez conocida, hubiera lugar para ello.","Que no se hayan agotado los medios de impugnación de la vía judicial."],"c":2,"e":"Art. 44.1.c) LOTC. La b) del mismo artículo excluye expresamente que el TC entre a conocer de los hechos.","cat":"Art. 44.1 LOTC"},{"q":"Según el artículo 46.1 de la LOTC, en los casos del artículo 42 (actos sin valor de Ley de los Parlamentos) están legitimados para interponer el recurso de amparo:","o":["La persona directamente afectada y el Ministerio Fiscal, pero no el Defensor del Pueblo.","Cincuenta Diputados o cincuenta Senadores.","La persona directamente afectada, el Defensor del Pueblo y el Ministerio Fiscal.","Quienes hayan sido parte en el proceso judicial correspondiente, el Defensor del Pueblo y el Ministerio Fiscal."],"c":2,"e":"Art. 46.1.a) LOTC. La b) («quienes hayan sido parte en el proceso judicial») corresponde a los arts. 43 y 44.","cat":"Art. 46.1 LOTC"},{"q":"Según el artículo 47.2 de la LOTC, el Ministerio Fiscal:","o":["Solo intervendrá en los procesos de amparo que él mismo haya promovido.","Intervendrá en todos los procesos de amparo, en defensa de la legalidad, de los derechos de los ciudadanos y del interés público tutelado por la Ley.","Intervendrá en los procesos de amparo cuando lo acuerde la Sala.","No interviene en los procesos de amparo frente a actos judiciales."],"c":1,"e":"Art. 47.2 LOTC.","cat":"Art. 47.2 LOTC"},{"q":"Según el artículo 48 de la LOTC, el conocimiento de los recursos de amparo constitucional corresponde:","o":["A las Salas del Tribunal Constitucional y, en su caso, a las Secciones.","A las Secciones exclusivamente.","Al Pleno del Tribunal Constitucional.","Al Pleno y, en su caso, a las Salas."],"c":0,"e":"Art. 48 LOTC.","cat":"Art. 48 LOTC"},{"q":"Según el artículo 49.1 de la LOTC, en todo caso la demanda de amparo justificará:","o":["La urgencia de la decisión.","La existencia de doctrina contradictoria del Tribunal Supremo.","La especial trascendencia constitucional del recurso.","El agotamiento de la vía administrativa."],"c":2,"e":"Art. 49.1 LOTC.","cat":"Art. 49.1 LOTC"},{"q":"Según el artículo 50.1 de la LOTC, la admisión a trámite del recurso de amparo se acordará:","o":["Por la Sección, por mayoría absoluta, mediante auto.","Por la Sala, por mayoría, mediante auto.","Por el Pleno, mediante providencia.","Por la Sección, por unanimidad de sus miembros, mediante providencia."],"c":3,"e":"Art. 50.1 LOTC. Si hay mayoría sin unanimidad, la Sección traslada la decisión a la Sala (50.2).","cat":"Art. 50.1 LOTC"},{"q":"Según el artículo 50.3 de la LOTC, las providencias de inadmisión del recurso de amparo:","o":["Podrán ser recurridas ante el Pleno en el plazo de diez días.","Podrán ser recurridas en súplica por el demandante en el plazo de tres días.","Son recurribles en súplica por cualquier parte en el plazo de cinco días.","Solamente podrán ser recurridas en súplica por el Ministerio Fiscal en el plazo de tres días."],"c":3,"e":"Art. 50.3 LOTC. El recurso se resuelve por auto no susceptible de impugnación alguna.","cat":"Art. 50.3 LOTC"},{"q":"Según el artículo 51.1 de la LOTC, admitida la demanda de amparo, la Sala requerirá al órgano, autoridad, Juez o Tribunal para que remita las actuaciones o testimonio de ellas en plazo que no podrá exceder de:","o":["Veinte días.","Treinta días.","Cinco días.","Diez días."],"c":3,"e":"Art. 51.1 LOTC.","cat":"Art. 51.1 LOTC"},{"q":"Según el artículo 52.1 de la LOTC, la vista de las actuaciones a las partes y al Ministerio Fiscal será por plazo común que no podrá exceder de:","o":["Veinte días.","Quince días.","Diez días.","Treinta días."],"c":0,"e":"Art. 52.1 LOTC. La sentencia se dicta en 10 días desde la vista o deliberación (52.3).","cat":"Art. 52.1 LOTC"},{"q":"Según el artículo 53 de la LOTC, al conocer del fondo del asunto, la Sala o, en su caso, la Sección pronunciará en su sentencia alguno de estos fallos:","o":["Otorgamiento de amparo, denegación de amparo o planteamiento de cuestión de inconstitucionalidad.","Estimación, desestimación o inadmisión.","Otorgamiento de amparo o denegación de amparo.","Nulidad del acto o confirmación del acto."],"c":2,"e":"Art. 53 LOTC.","cat":"Art. 53 LOTC"},{"q":"Según el artículo 55.2 de la LOTC, si el recurso de amparo debiera ser estimado porque la ley aplicada lesiona derechos fundamentales o libertades públicas:","o":["Se remitirá la cuestión al Defensor del Pueblo para que interponga recurso de inconstitucionalidad.","Se otorgará el amparo y se comunicará a las Cortes Generales para que modifiquen la ley.","La Sala declarará directamente la inconstitucionalidad de la ley.","Se elevará la cuestión al Pleno con suspensión del plazo para dictar sentencia."],"c":3,"e":"Art. 55.2 LOTC (la doctrina lo llama «autocuestión»).","cat":"Art. 55.2 LOTC"},{"q":"Según el artículo 56.1 de la LOTC, la interposición del recurso de amparo:","o":["No suspenderá los efectos del acto o sentencia impugnados.","Suspenderá los efectos de las sentencias, pero no de los actos administrativos.","Suspenderá automáticamente los efectos del acto impugnado.","Suspenderá los efectos si lo solicita el Ministerio Fiscal."],"c":0,"e":"Art. 56.1 LOTC. La Sala o Sección puede acordar la suspensión (56.2).","cat":"Art. 56.1 LOTC"},{"q":"Según el artículo 58 de la LOTC, las peticiones de indemnización de los daños causados por la concesión o denegación de la suspensión deberán presentarse:","o":["Dentro de los treinta días siguientes a la notificación de la sentencia, ante la Sala.","Dentro del plazo de un año ante el Tribunal Constitucional.","Dentro del plazo de seis meses ante el propio Tribunal Constitucional.","Dentro del plazo de un año a partir de la publicación de la sentencia del Tribunal Constitucional, ante los Jueces o Tribunales."],"c":3,"e":"Art. 58 LOTC.","cat":"Art. 58.2 LOTC"},{"q":"Según el artículo 32.1 de la LOTC, están legitimados para el ejercicio del recurso de inconstitucionalidad contra Leyes del Estado:","o":["El Gobierno, el Defensor del Pueblo, cincuenta Diputados y veinticinco Senadores.","El Presidente del Gobierno, el Ministerio Fiscal, cincuenta Diputados y cincuenta Senadores.","El Presidente del Gobierno, el Defensor del Pueblo, cincuenta Diputados y cincuenta Senadores.","El Presidente del Gobierno, el Defensor del Pueblo y el Consejo General del Poder Judicial."],"c":2,"e":"Art. 32.1 LOTC (y art. 162.1.a CE). El Ministerio Fiscal solo está legitimado para el amparo.","cat":"Art. 32.1 LOTC"},{"q":"Según el artículo 114 de la Ley 29/1998, reguladora de la Jurisdicción Contencioso-administrativa, la tramitación de los recursos del procedimiento para la protección de los derechos fundamentales:","o":["Tendrá carácter preferente solo en el período de prueba.","Tendrá carácter preferente a todos los efectos.","Seguirá el orden de presentación de los recursos.","Tendrá carácter urgente solo si lo solicita el Ministerio Fiscal."],"c":1,"e":"Art. 114.3 LJCA.","cat":"Art. 114.3 LJCA"},{"q":"Según el artículo 115.1 de la LJCA, el plazo para interponer el recurso del procedimiento para la protección de los derechos fundamentales será de:","o":["Dos meses.","Veinte días.","Diez días.","Cinco días."],"c":2,"e":"Art. 115.1 LJCA. Trampa: dos meses es el plazo general del recurso contencioso-administrativo.","cat":"Art. 115.1 LJCA"},{"q":"Según el artículo 115.1 de la LJCA, cuando la lesión del derecho fundamental tuviera su origen en la inactividad administrativa, el plazo de diez días se iniciará:","o":["Transcurrido un mes desde la reclamación.","Al día siguiente de la reclamación.","Transcurridos diez días desde la reclamación.","Transcurridos veinte días desde la reclamación."],"c":3,"e":"Art. 115.1 LJCA.","cat":"Art. 115.1 LJCA"},{"q":"Según el artículo 116.1 de la LJCA, el órgano administrativo deberá remitir el expediente administrativo en el plazo máximo de:","o":["Cinco días a contar desde la recepción del requerimiento.","Veinte días a contar desde la interposición del recurso.","Diez días a contar desde la recepción del requerimiento.","Cuarenta y ocho horas desde la recepción del requerimiento."],"c":0,"e":"Art. 116.1 LJCA. Las 48 horas del 116.5 son para alegaciones si el expediente llega tarde.","cat":"Art. 116.1 LJCA"},{"q":"Según el artículo 118 de la LJCA, acordada la prosecución del procedimiento especial, el recurrente podrá formalizar la demanda en el plazo:","o":["De veinte días.","De diez días, prorrogable por otros cinco.","Improrrogable de cinco días.","Improrrogable de ocho días."],"c":3,"e":"Art. 118 LJCA.","cat":"Art. 118 LJCA"},{"q":"Según el artículo 120 de la LJCA, en el procedimiento para la protección de los derechos fundamentales, el período probatorio:","o":["No será superior a diez días hábiles.","Se rige sin especialidades por las normas generales.","No será superior a treinta días.","No será en ningún caso superior a veinte días comunes para su proposición y práctica."],"c":3,"e":"Art. 120 LJCA.","cat":"Art. 120 LJCA"},{"q":"Según el artículo 121 de la LJCA, conclusas las actuaciones, el órgano jurisdiccional dictará sentencia en el plazo de:","o":["Veinte días.","Ocho días.","Cinco días.","Diez días."],"c":2,"e":"Art. 121.1 LJCA.","cat":"Art. 121 LJCA"},{"q":"Según el artículo 121.3 de la LJCA, contra las sentencias de los Juzgados de lo Contencioso-administrativo en este procedimiento:","o":["Procederá la apelación en ambos efectos.","No cabrá recurso alguno.","Procederá siempre la apelación en un solo efecto.","Solo cabrá recurso de casación."],"c":2,"e":"Art. 121.3 LJCA.","cat":"Art. 121.3 LJCA"},{"q":"Según el artículo 122.1 de la LJCA, en caso de prohibición o propuesta de modificación de reuniones no aceptada por los promotores, el recurso contencioso-administrativo se interpondrá:","o":["Dentro de los cinco días siguientes a la notificación.","Dentro de los diez días siguientes a la notificación.","Dentro de las setenta y dos horas siguientes a la notificación.","Dentro de las cuarenta y ocho horas siguientes a la notificación de la prohibición o modificación."],"c":3,"e":"Art. 122.1 LJCA. La audiencia se convoca en cuatro días y el tribunal resuelve «sin ulterior recurso» (122.2).","cat":"Art. 122.1 LJCA"},{"q":"Según el artículo 1 de la Ley Orgánica 6/1984, reguladora del procedimiento de «Habeas Corpus», mediante este procedimiento se podrá obtener:","o":["La inmediata puesta en libertad de cualquier persona detenida.","La indemnización por los daños causados por una detención ilegal.","La puesta a disposición del Ministerio Fiscal de cualquier persona detenida ilegalmente.","La inmediata puesta a disposición de la Autoridad judicial competente de cualquier persona detenida ilegalmente."],"c":3,"e":"Art. 1 LO 6/1984.","cat":"Art. 1 LO 6/1984"},{"q":"Según el artículo 2 de la Ley Orgánica 6/1984, es competente para conocer la solicitud de «Habeas Corpus»:","o":["La Audiencia Provincial del lugar de la detención.","El Juez de Guardia del domicilio del detenido.","El Juez de Instrucción del lugar en que se encuentre la persona privada de libertad.","El Juez de Instrucción del lugar en que se produjo la detención, en todo caso."],"c":2,"e":"Art. 2 LO 6/1984. El lugar de la detención solo opera si no consta dónde se encuentra la persona.","cat":"Art. 2 LO 6/1984"},{"q":"Según el artículo 2 de la Ley Orgánica 6/1984, si la detención obedece a la aplicación de la ley orgánica que desarrolla los supuestos previstos en el artículo 55.2 de la Constitución, el procedimiento deberá seguirse ante:","o":["El Juez Central de Instrucción correspondiente.","La Sala de lo Penal de la Audiencia Nacional.","La Sala de lo Penal del Tribunal Supremo.","El Juez de Instrucción del lugar de la detención."],"c":0,"e":"Art. 2, párrafo segundo, LO 6/1984.","cat":"Art. 2 LO 6/1984"},{"q":"Según el artículo 3 de la Ley Orgánica 6/1984, podrán instar el procedimiento de «Habeas Corpus», entre otros:","o":["El Ministerio Fiscal, el Defensor del Pueblo y el abogado defensor del privado de libertad; y lo podrá iniciar de oficio el Juez competente.","Únicamente el privado de libertad y sus familiares.","El Defensor del Pueblo y el Ministerio Fiscal, pero nunca de oficio el Juez.","El Ministerio Fiscal y el abogado defensor, pero no el Defensor del Pueblo."],"c":0,"e":"Art. 3 LO 6/1984.","cat":"Art. 3 LO 6/1984"},{"q":"Según el artículo 4 de la Ley Orgánica 6/1984, el procedimiento de «Habeas Corpus» se iniciará, salvo cuando se incoe de oficio:","o":["Por medio de escrito o comparecencia, no siendo preceptiva la intervención de Abogado ni de Procurador.","Únicamente por comparecencia ante el Juez.","Por medio de escrito firmado por Abogado y Procurador.","Por medio de escrito firmado por Abogado."],"c":0,"e":"Art. 4 LO 6/1984.","cat":"Art. 4 LO 6/1984"},{"q":"Según el artículo 6 de la Ley Orgánica 6/1984, contra el auto que acuerde la incoación del procedimiento de «Habeas Corpus» o deniegue la solicitud:","o":["Cabrá recurso de amparo ante el Tribunal Constitucional en el plazo de tres días.","Cabrá recurso de reforma.","No cabrá recurso alguno.","Cabrá recurso de apelación ante la Audiencia Provincial."],"c":2,"e":"Art. 6 LO 6/1984.","cat":"Art. 6 LO 6/1984"},{"q":"Según el artículo 7 de la Ley Orgánica 6/1984, los Jueces practicarán todas las actuaciones y dictará
